<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: pie, chart, share, proportion, breakdown, analytics, report, slice -->
  <!-- Classic: What the eye sees: a whole pie with one quarter sitting in its place, and the rim stopping short either side of it, so the slice reads as a separate piece without moving. The reference construction (Nucleo, Lucide): a closed wedge from the centre to 12 and 3 o'clock, and one open arc for the rest. THE CUT: in the outline it is the two breaks in the rim, 1.52 of air each, measured, at every master; holding that costs the rim 19.06° either side at 24, 24.62° at 20 and 25.75° at 16, so the circle gives up 38.1° · 49.2° · 51.5° in all. At 16 that is a seventh of the rim gone and the arc starts to read as a broken ring. In the filled the two pieces part by exactly 1.5. Circle as shipped: centreline r 9.25 · 7.25 · 6.375, filled disc r 10 · 8 · 7 (check-circle, clock, target). -->
