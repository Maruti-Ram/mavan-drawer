  <!-- Bar cut through: What the eye sees: the curved-sided drop struck in two by the bar: the crown from about 11 o'clock round to the right shoulder, and the left side sweeping down into the blunt tip and a short way up the right. No ring. Filled: a half-disc crown and a fuller lower piece than A1's, the bar whole between them. The bar (C21, second ruling 2026-10-25): \ at 45°, its ink the square keyline 18 · 14 · 12, centred on the pin's ink centre 12,12 · 10,9.75 · 8,7.75: centreline (3.75,3.75)-(20.25,20.25) · (3.75,3.5)-(16.25,16) · (2.625,2.375)-(13.375,13.125), map-pin-off's bar exactly. It stands 1 past each side of the pin and inside its top and bottom. The pin stays in place (C34); the composite is 18×20 · 14×15.5 · 12×13.5, outline and filled, declared as a box. With the full keyline bar the cut is identical to the morning's pin-wide bar: every piece and both filled solids are unchanged, only the bar is longer. Pieces (24 · 20 · 16): lower piece 18.77 · 12.01 · 9.73, crown 19.81 · 13.02 · 10.80; the outline keeps 75 · 66 · 63% of its length. The ring inside the head is dropped at every master. The cut rule alone would keep an arc of it at 24 and 20 (122° / 6.90 long and 77° / 3.02 long); at 16 it falls wholly inside the cut (its farthest centreline point 2.61 from the bar's centreline against 2.75). It is dropped so every master shows the same pieces (bug-off's precedent) and because the kept arc, concentric inside the head's own arc, reads as a wifi or hearing sign, not a hole (drawn and looked at). The filled hole goes with it. Mass from the canvas centre, outline +0.09,−0.33 · +0.13,−0.50 · +0.15,−0.48 (map-pin-2 0,−0.95 · 0,−1.04 · 0,−0.93); filled +0.19,−0.55 · +0.23,−0.68 · +0.25,−0.68. Cut as cloud-off and bug-off: every stroke stops 1.5 clear of the bar's edge (air at the cut ends measured 1.505–1.512 · 1.505–1.512 · 1.501); pieces under 1.5 go; filled, a channel 4.5 · 4.5 · 4.25 wide is knocked out of the solid (corners r0.75 · 0.75 · 0.625 on the outline's cut-end centres), its white 1.506 · 1.506 · 1.501 each side, and the bar runs whole through it at 1.5 · 1.5 · 1.25. Off-grid decimals are the cut ends and the channel corners, where the circles put them; a cut arc that passes its circle's top or side is pinned there (one extra node on the grid) so the ink box stays exactly the base's. (recommended) -->
