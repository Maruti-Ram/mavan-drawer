  <!-- Bigger card inside the place, solid card: C1's outline unchanged, with C0's filled construction (Maruti). The 20 master is refitted (Maruti, 2026-10-20: 20's card looked out of place beside 24 and 16). As fractions of the dashed place, the card now sits like the other two: inset 0.25, size 0.607, gap on the far side 0.143, cursor tip at 0.518, cursor 0.554. 24 is 0.222 · 0.667 · 0.111 · 0.5 · 0.556 and 16 is 0.25 · 0.583 · 0.167 · 0.542 · 0.542; 20 was 0.357 · 0.643 · 0 · 0.607 · 0.464, its card pushed into the corner with a small cursor. The exact fit, a card edge at 6.25, would land on a quarter pixel, so the card takes 6.5 (6 after the shift) and its edges sit on whole and half pixels. C1's drawing: C's picture, Polaris DragDrop's arrangement, with the largest card that keeps 1.5 to the dashes and to the cursor: 12 · 8.5 · 7 across (C0 and C 11 · 8 · 7), at 6.5–18.5 · 6–14.5 · 5–12. 16 cannot grow: an 8 card either pushes the top-right and bottom-left corner dashes under 1.5 of air, at 5–13, or is cut down to its top-left corner, at 6–14. Card at the detail radius 1.5 · 1.25 · 1. The dashed place is the spec unchanged: the square keyline 18 · 14 · 12 at radius 2.5 · 2 · 1.5, one dash centred on each corner and one on each side, pitch 7.71 · 5.82 · 5.05, dash 4 · 2.5 · 2.25, gap 2.25 · 1.82 · 1.55; the card and the cursor cover its bottom-right corner and its right and bottom side dashes, so the same five show at every master. Cursor: cursor-click's dart, exact shape and corner radii, at 82 · 89 · 87% (10 · 7.75 · 6.5 across). Its ink corner is 0.5 in from the margin edge at 24 and 20, on it at 16. Air card to cursor 1.72 · 1.66 · 1.62, dashes to card or cursor 1.61 · 1.7 · 1.69. The card is cut back by hand 1.5 from the cursor (C33). It keeps its top and left walls and three whole corners, and at 24 its right and bottom walls keep 1.75 past their corners; at 20 and 16 they go. At 16 the card cannot show four corners while the cursor is on it. With the tip anywhere on the card, its bottom-right corner falls inside the cursor's 50° wedge or within 1.5 of it, for every cursor from 5 to 7.5 across and every whole-pixel card inside the dashes (searched). To clear that corner, the tip has to stay off the card, 1.5 beyond its corner (corner at most 0.22 short of the tip along the diagonal), which leaves a card 3.5 across. So the card shows three corners whole. Balance: the drawing is moved 0.5 up and left at 24 and 20, so its box is centred (it was 0.5 toward the cursor, C33's offset). 16 stays put, because a half-unit move blurs every 1.25 line. Half the mass offset, outline / filled: -0.11 / +0.14 · -0.03 / +0.05 · +0.43 / +0.56 (C0 +0.52 / +0.69 · +0.54 / +0.61 · +0.56 / +0.66). Tightest air at 16: 1.55, dash to dash. Off-grid numbers are the cursor's, the corner dashes' arc ends and the cut ends. Filled: the card goes solid on the outline's outer edge, and the cursor goes solid (cursor-click-filled's offset). The white between them is cut along the cursor's ink grown by 1.5: the cut measures 1.5 at every master, 16 included (C22), the same construction as C0. Where the cut meets the card's edge the two junctions are eased at 0.75 · 0.75 · 0.75, so the thinnest solid there is 1.5. C0's 0.5 · 0.5 · 0.375 left tips 1.0 · 1.0 · 0.75 thick. At 16 the card's straight edge ends 0.06 short of where that easing would start, so the easing joins the corner arc itself and trims the corner under the cursor. The card's size and the outline are unchanged. The solid band between the card's top or left edge and the cut is 3.5 · 2.25 · 2. The easing starts at 18.5,10.73 · 14.5,8.16 · 12,6.51 (on the corner arc) and the mirror points, off-grid where it meets the edge. The dashes stay lines at 1.5 · 1.5 · 1.25. Filled ink box identical. Why: Maruti's filled look on the bigger card, with every white cut and every solid at least 1.5 (recommended) -->
