<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: slats, lattice, weave -->
  <!-- Slatted basket: A with slats (Lucide shopping-basket; Font Awesome basket-shopping and Phosphor Basket, from memory). The two slats carry the handles on through the rim, parallel to the walls, from x 7.5 · 7 · 5.5 to the floor at 9 · 8.25 · 6.5 — so the handle reads as hooked into the side, as a real basket's is. Air: slat to wall 1.70 · 1.69 · 1.59, slat to slat at the floor 4.5 · 2 · 1.75. Lucide also draws a band across the middle; at 16 it fits the outline (1.6 of air) but the filled twin would be six panels 1.4 tall, so it is left out. Filled: the bowl as three solid panels on the outline's outer edge, split by 1.5 white slots along the slats and cut 1.5 under the rim; the middle panel narrows from 6.68 to 4.21 · 3.61 to 1.68 · 2.77 to 1.27 wide (at 16, just over the 1.25 line weight at the floor). Rim and handles stay lines. Busiest of the five at 16; it says "basket" most strongly at 24. -->
  <path d="M2.75 8.75H17.25"/>
  <path d="M7 8.75L8.5 4.75"/>
  <path d="M13 8.75L11.5 4.75"/>
  <path d="M3.75 8.75L4.81 14.24A1.25 1.25 0 0 0 6.03 15.25H13.97A1.25 1.25 0 0 0 15.19 14.24L16.25 8.75"/>
  <path d="M7 8.75L8.25 15.25"/>
  <path d="M13 8.75L11.75 15.25"/>
</svg>
