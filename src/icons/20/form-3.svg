<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: card, field and button, submit, dialog, sign in -->
  <!-- box: 14x16 -->
  <!-- Card with a field and a button: A card holding one field and its button: the whole form as one thing (the coordinator's 'card or page with a field and a button'; Fluent's Form is a card too, with a title line and radio rows). Agreed box 18x20 · 14x16 · 12x14: card corners 2.5 · 2 · 1.5; field 12x6 · 8x4.5 · 6.5x4 (3 · 1.5 · 1.5 inside), corners 1.5 · 1.25 · 1; button 6 · 4.5 · 3.75 long, right-aligned; field to card wall 1.5 at the sides, 2.75 · 1.75 · 1.75 at top and bottom; field to button 2.5 · 2 · 1.5. A page with TWO fields (the other card idea) cannot hold at 16: two 4-tall fields with 1.5 of air need 12.5 inside, and the tallest card at 16 gives 11.5. Tightest air at 16: 1.5 (field inside, field to wall, field to button). Filled: the card solid, field and button cut out as white at their ink (1.5 of card between them). At 16: calculator is the nearest, a 10x14 card with a display line and keys; this is 12x14 with a hollow box and a pill. Risk: densest of the five, every gap on the floor at 16, as A was -->
  <path d="M5.75 2.75H14.25A2 2 0 0 1 16.25 4.75V15.25A2 2 0 0 1 14.25 17.25H5.75A2 2 0 0 1 3.75 15.25V4.75A2 2 0 0 1 5.75 2.75Z"/>
