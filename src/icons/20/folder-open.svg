  <!-- Flap over the back: The back stays whole: left wall, both top corners, the tab, the bottom-left corner and the bottom edge are folder's own path verbatim (the bottom edge stops 1 · 0.41 · 0.46 short at the right, where the flap's bottom-right corner stands in front of folder's); only the right wall below its top corner is gone, hidden behind the flap (what would show is under 1.5 long, so it is removed, as C33 does with a short wall). The front drops forward as a leaning flap: its top edge runs across at 11.25 · 10.75 · 8.625, its right side leans in, and its left side leans the other way and stops short with a round end 1.5 clear of the wall, so the back's bottom-left corner shows beside it (the idea of Lucide's open folder, drawn in our parts). In the set grid at 16 and 20 it is the only one of the three that still reads as an open folder; B and C read nearer a lid over a box. Same ink box as folder, centred: 20x18 · 16x14 · 14x12. Angles the object sets: left side 1 across for 2 down, 63.43 deg at every master; right side 75.96 · 74.74 · 75.26 deg (run 2.25 over 9 · 1.5 over 5.5 · 1.25 over 4.75, the 1 to 4 lean as near as the grid allows). The left side's line meets the top edge at x 7.75 · 7 · 5.25 and ends at (5.75, 15.25) · (5.75, 13.25) · (4.375, 10.375), all on the grid. Flap corners at the container radius 2.5 · 2 · 1.5. Flap ink 10.5 · 7 · 6 tall, 58 · 50 · 50 percent of the box. At 16 the top edge sits at 8.625 so its top lands on a whole pixel (8.875 rendered two grey rows). Air: the left end to the wall 1.5 · 1.5 · 1.5 and to the bottom 3.5 · 1.5 · 1.75; the back's right corner end to the flap 2.04 · 1.89 · 1.52. The left end's straight is 2.93 · 1.57 · 1.03 long: the 1.5 to the bottom edge holds it short at 20 and 16. Filled: one piece, as folder-3's hook: a 1.5 slot runs in from the right edge between the back and the flap, round the flap's top corner and down its left side, and ends round where the outline's left end stops; below it back and flap join, as they do in the outline. Slot 1.5 at every master (1.5 at 16, not the 1.25 line). Back strip left of the slot's end 1.66 · 1.66 · 1.40. Mouth corner of the back eased 0.75 · 0.5 · 0.5; at 16 the cut (6.5) sits inside folder-filled's r2.25 corner, so the ease is drawn tangent to both and the filled back stops 0.25 above the outline's corner cap (6.75). Off-grid decimals: the flap corners' tangent points (radius x tan of half the turn back along each edge, snapped onto the arc so the box stays exact), the slot's arcs about the flap's corner (4.75 · 4.25 · 3.625 outside, 3.25 · 2.75 · 2.125 inside) and its round end, the 16 ease, and folder's own tab decimals. (recommended) -->
