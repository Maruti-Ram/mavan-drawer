  <!-- Two tiles, one elbow: Rhythm: two of grid's cells on the diagonal (7.5 · 5.5 · 4.75 outer, radius 1 · 0.75 · 0.75), the top-left one's bottom joined to the bottom-right one's left wall by one elbow, corner radius 1.5 · 1.25 · 1 (hierarchy's elbow). The elbow leaves and enters each tile at its wall centre, so its run is as long down as across: 6 · 5 · 4.25 in the clear each way, an even L. Every end sits on a wall centreline, so the round caps hide in the walls. Ink 18×18 · 14×14 · 12×12, box-centred, margins 3 · 3 · 2 all round, tile edges on whole pixels at 16 (2–6.75 and 9.25–14). Smallest air: the white the L encloses, open to the top right, never under 4.25. Who: Lucide `workflow` is exactly this picture (two squares, one elbow connector). Family: it is hierarchy with its top-right child removed, same cells, same elbow to the hundredth, so the two read as relatives; told apart by two tiles, not three. Filled: two solid tiles on the outline's outer edge, the elbow stays a line at 1.5 · 1.5 · 1.25 with both ends inside the solids. At 16 it reads cleanly: two tiles, one routed line (recommended) -->
