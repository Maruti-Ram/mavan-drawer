  <!-- Polaris set, polished, 16 redrawn: The approved drawing (2026-10-20) with only the 16 redrawn so it is the 24's picture: six pieces at every master, 6 · 6 · 6. The 24 and 20 are the approved files verbatim, every number below cited from their own note: the A4 cone (ink 14.25 · 9.5 along the diagonal, mouth 13.77 · 9.34 across), three plus sparks with arms 3.5 · 3 on the line (ink 5 · 4.5) at 9.5,4.5 · 19.5,4.5 · 19.5,14.5 and 6.75,4.25 · 15.75,4.25 · 15.75,13.25, an upright tick on the top edge (x 14.5 · 11.25, 3 · 2.25 long), its mirror level on the right edge (y 9.5 · 8.75), and the short axis dash, 2.12 at 45° just past the mouth (1.62 · 1.77 from its cap) — the one piece that leaves the mouth, so the throw has a direction; smallest air 1.55 · 1.5 outline (cone–plusTop · plusTop–dashUp), 1.54 · 1.5 filled; the outline's mass centre 0.15,-0.15 · -0.04,0.05 from the canvas centre, the filled twin's -1.03,1.03 · -0.66,0.66. Sixteen, what changed and why. The approved 16 had five pieces: the axis dash was dropped because its far cap landed 1.09 from the upright tick's foot, and its three crosses (ink 3.25 in a 14 box) with nothing in the middle read as a frame round a smaller cone, not the 24's spray ahead of the mouth — the cone is 42% of the box's diagonal at 16 against 50% at 24, so the middle is emptier there. The axis dash is back: M8.375 7.625 L9.875 6.125, 2.12 on the line at 45° (dx = dy = 1.5, the shortest 45° dash of 2 or more that stays on the eighth grid), its near cap 1.5 from the mouth's ink (1.505 exactly) and its far cap 1.55 from the upright tick's foot. That air is what moves the rest. A vertical tick 2 long with its top on the box edge has its foot cap centred at y 3.625; against a far cap on the axis it needs 2.75 centre to centre, which holds only with the tick's centreline at x ≤ 8.73 (at the approved 9.5 the air is 1.28; at 9.375, the nearest crisp column, 1.4). So the upright tick moves to x 8.625 (ink 8–9.25: pixel column 8 solid, a 25% halo on 9), the top plus follows to 4.625,2.625 (ink 3–6.25, 1.75 clear of the tick), and the mirror pair does the same — the level tick to y 7.375 (ink 6.75–8), the right plus to 13.375,11.375 — while the corner plus stays at 13.375,2.625. Nothing else was found that works: the cone keeps its 8.3 because a quarter off the mouth lets the far cap sit only 0.125 further in and lifts the tick's limit to 8.93, so the tick would still be at 8.625 (8.875 straddles two columns) — the quarter buys nothing; arms 1.75 (ink 3) were drawn and measured (air 2 · 2.75 either side of the tick, centres on x.5) and render the same 3×3 cross at 1×, so the arms stay 2 as the approved 16 had them; the ticks are already 2, the floor. Where the pieces sit now, from the mouth centre 6.427,9.573: top plus 104.5°, upright tick 72.4°, corner plus 45°, level tick 17.6°, right plus -14.5° — against 104.43 · 70.2 · 45 · 19.8 · -14.43° at 24, so the 16 is the 24's picture to within 2.2°; the side pluses sit 6.19 off the axis (approved 16: 5.48; 24: 7.07 in a box 1.43× larger), 73.7° and 16.3° from the apex. The air either side of each tick is 1.75 and 2.5 where the 24's is 1.75 · 1.75: the price of the dash, since evening it needs the tick back at 9.5. Air at 16, outline and filled alike: cone–axis dash 1.5, each tick–axis dash 1.55, top plus–tick 1.75, right plus–level tick 1.75, corner plus–each tick 2.5, cone–side plus 2.79, cone–tick 4.51. Smallest air 1.55 · 1.5 · 1.5 outline (cone–plusTop · plusTop–dashUp · cone–dashAxis), 1.54 · 1.5 · 1.5 filled (the same pairs). Balance: ink box 20 · 16 · 14 square in both styles, the apex on the keyline corner, the pluses' caps on the top and right edges; at 16 the outline's mass centre is -0.3,0.3 from the canvas centre (approved 16: -0.23,0.23), the filled twin's -0.87,0.87 (approved: -0.85,0.85); no declared box. Decimals: every 16 piece coordinate is on the eighth grid with centrelines on x.375 / x.625, so each tick and each plus bar puts one whole pixel column or row solid; the only off-grid numbers are the cone's bend tangent points, as in every round. Filled: the cone solid, six pieces as lines at 1.25, no dot; filled outer edge = outline's. At 16, 1× (headless Chrome, both themes, coverage read back pixel by pixel, outline and filled identical on the pieces): three 3×3 crosses with bars at 99–100%, the upright tick one solid column (79 · 100 · 99) with a 16–25% halo, the level tick one solid row (100 · 100 · 94), the axis dash two solid pixels (98 · 98) stepping diagonally with 26–33% neighbours — two whole pixels, not the grey the approved note feared. Beside the 24 drawn at 16 px, the two show the same layout piece for piece; the approved 16 beside the same 24 lacks the dash and has its top plus a column nearer the tick. At 2× the dash is a clean short diagonal and the 16 and the 24 read as one drawing. Beside sparkle-4, sun, loader and sparkle-3 at 1× it holds the strip's weight. (recommended) -->
