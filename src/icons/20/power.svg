<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: standby, on, off, shutdown, iec -->
  <!-- Standby sign: Rhythm: the ring is the circle keyline (outer ⌀20 · 16 · 14, r 9.25 · 7.25 · 6.375 on the line, check-circle's and ban's ring) opened ±53.13° from the top — the 3-4-5 angle, which puts both ring ends exactly on the grid (4.6/19.4, 6.45 · 4.2/15.8, 5.65 · 2.9/13.1, 4.175), so the outline and filled ink boxes match exactly; it is also B's opening, so power and a ring version would share one sign. The line runs from the top of the box (ink 2 · 2 · 1) to the ring's centre, ink 10.75 · 8.75 · 7.625 long, and stands 3.7 · 2.9 · 2.55 above the ring ends' caps. Air from the line to each ring end 5.9 · 4.3 · 3.85, equal both sides; ink 20×20 · 16×16 · 14×14, box-centred. Filled: line-heavy, 2.5 · 2 · 2 — ring r 8.75 · 7 · 6 (outer edge kept), ends at the same angle (5/19, 6.75 · 4.4/15.6, 5.8 · 3.2/12.8, 4.4), line ends pulled in so both ink ends stay put; air line to ring ends 4.5 · 3.6 · 2.8. Who: Lucide power (about ±50°), Material power_settings_new, SF Symbols power, Tabler power, Phosphor Power, Fluent Power, Heroicons power; Material and Tabler open about ±40° — the other exact angle, 36.87°, would give that tighter mouth if Maruti prefers it. (recommended) — the IEC standby sign is the picture every set and every device uses, and with nothing around it it stays the clearest of the five at 16. -->
  <path d="M15.8 5.65A7.25 7.25 0 1 1 4.2 5.65"/>
  <path d="M10 2.75V10"/>
</svg>
