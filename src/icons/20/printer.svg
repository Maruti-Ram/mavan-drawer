  <!-- Classic: Ink 20x20 · 16x16 · 14x14 (circle keyline), box-centred. Body the whole width, container radius 2.5 · 2 · 1.5 (desktop, folder). Tray and sheet share walls, ink 12 · 10 · 8 wide (60 · 62 · 57% of the body), corners r1.5 · 1.25 · 1 (save's detail radius). Tray 5 · 4 · 3 of ink above the body (counter 9x3.5 · 7x2.5 · 5.5x1.75); body 11 · 8 · 8 tall (y 7-18 · 6-14 · 4-12); the sheet's top edge sits 2.5 · 1.5 · 1.75 below the body's top (floor 1.5) and the body's bottom line stops at the sheet's walls; sheet shows 4 · 4 · 3 below the body (sheet counter 9x8 · 7x6 · 5.5x5.5). 16 master at stroke 1.25: centrelines on the eighth grid (x.375 / x.625), so every outer edge, the tray top, the body top and bottom and the sheet foot land on whole pixels. Filled: one solid on the outline's outer edge (body radius 3.25 · 2.75 · 2.125), the tray and sheet counters punched at their true size (C22, as trash's handle), so the paper reads white; the junctions stay square where the outline's strokes meet, as trash-filled's tab. The thinnest material left is the paper wall itself, 1.5 · 1.5 · 1.25. The construction all three references share (Lucide, Nucleo, Polaris), with the body, radius and paper corners taken from desktop and save, so nothing new enters the set; the sheet's top edge inside the body is the one line that says paper goes through the machine (recommended). -->
