  <!-- Three puffs, leaning: Rhythm: small puff, big dome, medium puff — sizes stepping 2.75 · 5 · 4 at 24 (2.25 · 3.75 · 3 at 20, 1.875 · 3.25 · 2.625 at 16; 0.24 · 0.43 · 0.35 of the height at 24). Dome left of centre (x 10.75 · 9 · 7.125). Notches turn 70° / 70° · 70° / 74° · 69° / 73° and sit 51% / 71% up — low on the left, high on the right, which is what makes it lean. Balance: mass 0.09 · 0.12 · 0.07 left of centre. Ink 20×13 · 16×11 · 14×9, filled identical, 1.54 · 1.45 · 1.56 wide for its height (SF Symbols' cloud is 1.51); the full width of the circle keyline. Lifted 0.5 at every master (optical 0 −0.5, as alert-triangle): a cloud's mass sits low, measured 0.76–1.15 below the box centre at 24 without the lift (outline), and the lift also puts the flat base on a whole pixel (18 · 15 · 12). Puffs are circles on the quarter grid (eighth at 16); the ends sit on the base, so the bottom corners are the puffs themselves. Notches are filleted 1.5 · 1.5 · 1.25 on the line, 0.75 · 0.75 · 0.625 on the outer edge (half the weight, C10; the held cloud-download's notch). Off-grid values are the tangent points the circles put there. Who: SF Symbols cloud (measured from the font: small left puff, dome at 0.45 of the width, bigger right puff, flat base), Material cloud, Bootstrap, Tabler, Octicons. Composites: a centred arrow runs 1.25 right of the dome's axis; a bottom-right badge cuts the right puff and leaves dome + left puff, still a cloud. -->
