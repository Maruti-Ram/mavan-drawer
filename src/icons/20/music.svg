  <!-- Beamed pair, one slanted beam: Rhythm and balance: two heads of one size, outer diameter 7 · 5.5 · 5 (ring r 2.75 · 2 · 1.875, hole 4 · 2.5 · 2.5, open at 16); stem pitch 11 · 8.5 · 7; air from the left stem to the right head 4 · 3 · 2. The right head sits higher by exactly the beam's rise (2.75 · 2 · 1.75 across a 1:4 beam, 14.04 degrees; at 20 the rise is 2.125 and the head step 2, so the right stem is 0.125 longer), so the heads share a baseline parallel to the beam and both stems read 11.2 · 8 · 7.2 long. Each stem stands on its head's right side, touching it (tangent), not through its centre. Corners where the stems meet the beam are r 0.75 · 0.75 · 0.625 (C10). Ink 18x18 · 14x14 · 12x12, square keyline, moved 0.5 · 0.5 · 0.375 left of the box centre (declared optical shift, C14). The same drawing at every master, nothing dropped. Why the shift: box-centred, the measured mass sat right of centre (+1.23 · +0.92 · +0.80 outline), because the stems and beam are on the right; half of that, on the grid, is 0.5 · 0.5 · 0.375, which leaves +0.73 · +0.42 · +0.42. It costs crispness: at 16 the stems now sit at 6 and 13, so they straddle pixels (play's 0.59 shift at 16 is the precedent). Up-down is left at 0: the outline wants 0.17 up and the filled twin 0.57 up, so the optical sheet should settle it. The 14-degree beam is outside the 0/45/90 angle rule, as every slanted beam is (Lucide 16.3, Iconoir 10.3, Font Awesome 16.7 degrees). Who draws it: Lucide music, Iconoir music-double-note, Font Awesome music (solid). Filled: heads solid (outer edge = the ring's), stems and beam stay at 1.5 · 1.5 · 1.25. Off-grid decimals are the tangent points where the corner arcs meet the slanted line; arc centres, stem lines, head centres and radii sit on the grid. (recommended): the picture most people know as music, it holds the most air at 16 (2 between stem and head, at least 3 under the beam) and keeps every part at all three sizes. -->
