<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: switch, on, enabled, active, setting, pill, ring, joined -->
  <!-- box: 16x10 -->
  <!-- Ring knob on the wall, 20×12: Pill 20×12 · 16×10 · 14×8 (1.67 · 1.6 · 1.75 wide to tall), the width of check-circle's ring. The knob is a ring the full height of the track, drawn as the track's own right end: the track line runs into the ring and stops at its centre, the way sliders' track stops on its ring. Knob 12 · 10 · 8 across, white inside 9 · 7 · 5.5; track showing left of the knob 8 · 6 · 6. Two strokes and no inner detail, so nothing can close up at 16. Filled: solid pill with the knob knocked out, 1.5 of wall round it at every master (hole 9 · 7 · 5; at 16 the hole is 0.5 smaller than the outline's white so the wall holds 1.5, not the 1.25 line). The solid track is the "on" read; flipping it gives toggle-off (recommended) -->
  <path d="M13 5.75H7A4.25 4.25 0 0 0 7 14.25H13"/>
  <path d="M8.75 10A4.25 4.25 0 1 0 17.25 10A4.25 4.25 0 1 0 8.75 10Z"/>
</svg>
