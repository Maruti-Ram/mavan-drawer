  <!-- Door fixed left (Tabler): A mirrored: the leftward pair. Login is the arrow pointing left INTO a door on the left; logout is the arrow pointing left OUT OF a door on the right, so the arrow direction reverses against A on both boards. Reads as sign-in / sign-out for a layout whose flow runs right-to-left, or for a menu where every arrow already points right and this one should not. Geometry identical to A (returns 6 · 4.5 · 4, arrow 15 · 11 · 9.25, apex 1.5 · 1.5 · 1.5 off the wall, tips to the returns 3.19 · 2.7 · 2.41 — this login is A's login mirrored). Filled as A (filled arrow 14 · 10.5 · 8.5). Ink box 18×18 · 14×14 · 12×12, the same as A's -->
