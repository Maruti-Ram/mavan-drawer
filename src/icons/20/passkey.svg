<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: person, credential, sign in, passwordless -->
  <!-- Person and key: The passkey mark itself: the FIDO Alliance passkey icon, a person with a key standing beside it — Shopify Polaris ships it as Passkey and Fluent as Person Passkey (both in our references); Material Symbols passkey, Apple Passwords, 1Password and Bitwarden show the same picture. Built from our own parts: `user` at its shipped size (head ⌀8 · 6 · 5, body 16 · 12 · 10 wide) moved 2 · 2 · 2 left, and key-6’s hanging key as a column on its right: bow ring ⌀7 · 5.5 · 4.75 outer (88 · 92 · 95% of the head; air inside 4 · 2.5 · 2.25), shank down to the body’s base line, two teeth to the right on key-6’s rhythm — pitch 3 · 3 · 3, first tooth 2 · 2 · 1.75 above the tip, lengths 2.75 & 1.75 · 2 & 1.25 · 1.75 & 1.125 (the first ends level with the bow’s right edge). Key ink 16 · 14 · 12.375 tall (80 · 88 · 88% of the figure). Not a C33 badge: the key is half the symbol and stands the height of the body on the same base line, so the pair is composed and centred as one, like a C27 group; C33’s cut is kept — the body stops with 1.5 of air from the key’s ink, its dome ending 49 · 54 · 62° round from the top and its base 1.5 short of the shank. Air: head to body 1.5 (as user), head to bow 1.69 · 1.71 · 1.92, bow to second tooth 2.5 · 2 · 1.63, dome end to bow 1.81 · 2.9 · 3.11; tightest 1.5 at every master. Ink 20×20 · 16×16 · 14×14 on the circle keyline, centred, side margins 2 · 2 · 1; ink mass 0.56 · 0.41 · 0.31 right of centre in the outline and 0.30 · 0.24 · 0.34 left in the filled, so it sits balanced left–right. Filled: head and body solid to the outline’s outer edge (the body’s cut edge is the outline’s two round caps joined by a straight drop), bow solid with a round hole ⌀2 · 1.5 · 1.5; shank and teeth stay lines at 1.5 · 1.5 · 1.25. Off-grid numbers are only the dome’s cut end and its filled tangent point, which fall where the 1.5 of air puts them on the arc. At 16 it is apart from user (the key column), key-6 (the figure) and any user badge (the key is as tall as the body). (recommended: it is the one picture people already know as “passkey” — it sits on the passkey button in sign-in sheets — and at 16 it still reads as a person plus a key) -->
  <path d="M5.75 5A2.25 2.25 0 1 0 10.25 5A2.25 2.25 0 1 0 5.75 5Z"/>
  <path d="M12.24 12.4A5.25 5.25 0 0 0 2.75 15.5L2.75 16A1.25 1.25 0 0 0 4 17.25L12.25 17.25"/>
