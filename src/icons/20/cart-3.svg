  <!-- Hook, tapered front: Hooked handle: a flat stub from the ink edge (3 · 3 · 2) bending down at r1.5 · 1.25 · 1 into the post (centreline x 6.75 · 6 · 4.625). Basket off the post, top 6.75 · 5.75 · 3.625, bottom 12.75 · 9.25 · 6.875, front 20.25 · 16.25 · 13.375: 15x7.5 · 11.75x5 · 10x4.5 of ink, 4.5 · 2 · 2 clear inside (floor 1.5). The whole front runs at 45° from the top corner to the bottom, so the basket's floor is 6 · 3.5 · 3.25 shorter than its top — the classic trolley wedge, but steeper than any reference (4–20°). The top corner is acute, bent at C10's mark radius 0.75 · 0.75 · 0.625 so its ink still lands on the keyline; foot bend r1.5 · 1 · 0.75. The post runs on below the basket and bends at r1.5 · 1.25 · 1 into a chassis rail at 15.75 · 12.25 · 9.625, 1.5 · 1.5 · 1.5 clear of the basket. The rail reaches past the basket's foot to 17.25 · 14.25 · 11.375. Wheels: two solid dots of 3 · 2.5 · 2 ink (image's and bell's dot), 1.5 · 1.5 · 1.75 clear of the rail; the rear dot starts at the post's inner edge, the front one ends with the rail; at 16 both sit on whole pixels (centres 6 and 11). Ink 18x18 · 14x14 · 12x12, box-centred; mass centre 0.09 left of centre at 24. 16 master at stroke 1.25: centrelines on the eighth grid so the rail and the dots land on whole pixels. Filled: basket solid on the outline's outer edge, wheels solid discs, handle, post and rail stay lines at 1.5 · 1.5 · 1.25. Strongest cart silhouette; risk: the pointed top corner and the short floor read as a wedge or a dustpan. -->
