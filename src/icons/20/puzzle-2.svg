  <!-- Two knobs and a socket: B's small knobs plus a socket cut into the bottom edge, so it reads as a piece that takes another. The socket has an undercut at 24 and 20; at 16 it is a plain round notch, because an undercut socket there leaves under 1.5 of wall (1.44 at best, measured). Circle keyline, corners 2.5 · 2 · 1.5. Ink 20x20 · 16x16 · 14x14; body 16.25x16.25 · 12.25x12.25 · 10.5x10.5 outer; knob head 5 · 5 · 4.5 across, standing 3.75 · 3.75 · 3.5 proud of the body; neck clear inside 1.62 · 1.62 · 1.58 (floor 1.5), waist 0.19 · 0.19 · 0.21 each side; socket 3.75 · 3.75 · 2.375 deep, mouth clear 1.62 · 1.62 · 1.75, undercut 0.19 · 0.19 · 0 each side; smallest gap anywhere 1.62 · 1.52 · 1.58. Filled: the piece solid; its edge is the outline's outer edge exactly (every curve offset by half the stroke), no inner lines. Every curve is a tangent arc; where a join lands off the grid this note is its documentation, as with checkbox's tick. Knob feet (2026-09-28): Where each knob meets the piece, the foot is now rounded at half the stroke weight in the filled (0.75 · 0.75 · 0.625, the set's bend radius, as puzzle-4), not 0.25, which rendered as a nick at 16; the outline foot goes with it (centreline 1.5 · 1.5 · 1.25, was 1 · 1 · 0.875), so the filled edge is still the outline's outer edge. Nothing moves: both knobs keep their centre (top 10.25,4.5 · 8.25,4.5 · 6.25,3.25; right 19.5,14 · 15.5,12 · 12.75,9.75), head size and height, because the wider feet still land on the straight edge before the corners - straight edge left between a foot and the next corner: 1.79 and 1.54 at 24, 0.29 and 0.04 at 20, 0.32 each side at 16; nothing overhangs. The one thing that changes shape: the knob's neck no longer pinches in under the head - waist 0.04 · 0.04 · 0.07 each side, was 0.19 · 0.19 · 0.21 - and its hollow inside the outline widens to 1.92 · 1.92 · 1.86 (was 1.62 · 1.62 · 1.58). Socket unchanged: its mouth corners are 1.75 · 1.75 · 1.5 round in the filled, not pinched; narrowest air anywhere is the socket mouth, 1.62 · 1.62 · 1.75, both styles. Ink 20x20 · 16x16 · 14x14 both styles. New decimals, each a tangent point, not a grid step: the feet land on the edge 3.21 · 3.21 · 2.806 either side of the knob's axis (7.04/13.46, 10.79/17.21 at 24; 5.04/11.46, 8.79/15.21 at 20; 3.444/9.056, 6.944/12.556 at 16), where a foot of that radius touches the head; 8.52,4.77 / 11.98 and 19.23,12.27 / 15.73 (24), 6.52,4.77 / 9.98 and 15.23,10.27 / 13.73 (20), 4.664,3.603 / 7.836 and 12.397,8.164 / 11.336 (16) are where foot meets head in the outline; 7.78,4.88 / 12.72 and 19.12,11.53 / 16.47 (24), 5.78,4.88 / 10.72 and 15.12,9.53 / 14.47 (20), 4.054,3.739 / 8.446 and 12.261,7.554 / 11.946 (16) the same in the filled. (recommended) -->
