<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: pan, raise hand, stop, palm, open hand -->
  <!-- Open palm: The raised open palm, fingers together, thumb out at 45 degrees: the pan tool and raise-hand picture (Lucide hand, Nucleo hand, Fluent Hand, Untitled hand, Material pan_tool, Heroicons hand-raised, SF hand.raised). Fingers share their walls (Lucide's build), so each finger is one counter on an even pitch. Four fingers at 24, three at 20 and 16: four at the 1.5 floor need 13.5 at 20 and 12.25 at 16 before the thumb, and the thumb needs about 4 more beside them, which is past the 16 and 14 the margins allow — a finger is dropped, not squeezed (a mitten with notches costs more width, not less: each notch needs 1.5 of air as well as each finger). Pitch 3 · 3 · 3, finger counters 1.5 · 1.5 · 1.75; walls at x 8.25…20.25 · 7.25…16.25 · 5.375…14.375 (at 16 every wall sits on x.375, so the fingers stay on whole pixels; a 2.75 pitch held 1.5 but put two walls on x.125 and x.875 and the fingers went soft at 16). Tip radius 1.5, half the pitch. Tips (ink top) index · middle · ring · little 4.5 · 3 · 4.5 · 6 at 24, then 3.75 · 2.5 · 5 and 2 · 1 · 3 (index, middle, outer finger): the middle is tallest, the outer finger twice the index's drop. The walls between fingers stop on one knuckle line at 11 · 9 · 7.375 (0.44 · 0.45 · 0.46 of the height). Thumb: thumbs-up's thumb, 3 · 3 · 2.75 wide with its 1.5 · 1.5 · 1.375 tip, at 45 degrees, tip centre (5.25, 13) · (4.75, 10.75) · (3, 8.75), its top 10.75 · 8.5 · 6.75, 1.5 of air inside at every master; it meets the index at a crotch bent 0.75 · 0.75 · 0.625 (C10, a clean V on the air side), its upper edge runs 2.74 · 2.04 · 1.98 free, its outer edge 8.75 · 6.28 · 6.58 down to the heel bend (2.75 · 2.25 · 2) and the palm bottom; heel corner 4.5 · 3.5 · 3.25. Ink box 18×18 (square keyline) at 3…21, 14.5×14.5 (square keyline, within 0.5) at 2.5…17, 14×14 (circle keyline) at 1…15; margins 3 all round · 2.5 left/top, 3 right/bottom · 1 all round. Box-centred like thumbs-up; the filled mass sits +1.11, +1.32 · +0.58, +0.86 · +0.87, +1.06 from the canvas centre (x right, y down; thumbs-up +0.26, +1.86). Tightest air at 16: 1.5 inside the thumb, 1.75 inside each finger. Cost: at 16 it is the heaviest of the hands, 66 px of ink against thumbs-up's 55 (outline, measured on a 16 px render; 109 against 101 at 24), and three fingers plus a thumb at 20 and 16. Filled: one solid, its outer edge the outline's on the thumb, palm and both sides; the fingers are re-cut as equal prongs with 1.5 cuts, because a cut on each shared wall would leave the middle fingers half as wide as the outer ones: prongs 2.25 · 2.5 · 2.25, cuts 1.5 · 1.5 · 1.75 (at 16 three equal prongs and 1.5 cuts in the outline's 10.25 do not land on the eighth grid; 1.75 is the next that does), filled pitch 3.75 · 4 · 4; the 24 prongs round their corners at 1 with a 0.25 flat, since a full 1.125 round needs three decimals there. Cuts end where the outline's walls end (11.75 · 9.75 · 8). Prong tops keep the outline's tip heights, so the ink box is identical; the index's and the outer finger's outer corners sit a little squarer than the outline's round tips. The filled thumb (4.5 · 4.5 · 4 across) reads heavier beside 2.25 fingers than it does in the outline. The off-grid decimals are the thumb's 45-degree tangent points (tip, crotch, heel), where the circles put them; the 0.001 on the ink box is their 2-decimal rounding (recommended) -->
  <path d="M10.25 6A1.5 1.5 0 0 0 8.75 4.5A1.5 1.5 0 0 0 7.25 6V9.32A0.75 0.75 0 0 1 5.97 9.85L5.81 9.69A1.5 1.5 0 0 0 3.69 9.69A1.5 1.5 0 0 0 3.69 11.81L7.47 15.59A2.25 2.25 0 0 0 9.06 16.25H12.75A3.5 3.5 0 0 0 16.25 12.75V7.25A1.5 1.5 0 0 0 14.75 5.75A1.5 1.5 0 0 0 13.25 7.25"/>
