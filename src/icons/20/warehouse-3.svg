<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: inventory, stock, boxes, stacked, storage, polaris, shed -->
  <!-- Open shed, two boxes: Walls: the roof stands on two walls, Polaris Inventory's construction. It is the shipped warehouse's roof and walls as one open path, with the same eave radius of 1.5 · 1.25 · 1, no floor line, and the walls ending on the baseline with round caps. The walls hold the roof up, so nothing floats. The 1.5 of air from box to wall leaves 10.5 · 6.5 · 5.25 of centreline for the boxes. At 16, two boxes side by side would hold only 1.375 of white, below the floor, so the stack is two boxes, one on another, at every master. Bottom box 10.5×5.25 · 6.5×4 · 5.25×3, standing on the baseline. Top box 7.5×4.25 · 4.5×3.25 · 3.75×2.75, 71 · 69 · 71% of the bottom box's width, sitting on it and centred. The roof is 3.24 · 2.32 · 2.49 above the top box: this is room inside a building, not a gap. Risk: two boxes say storage more than stock, and at 16 a narrow box on a wide one can read as a padlock. That is why the top box is kept wide and low. Filled: the two boxes solid, split by 1.5 of white; the shed stays a line at the outline weight. -->
  <path d="M3.75 16.25V7.5A1.25 1.25 0 0 1 4.44 6.38L9.44 3.88A1.25 1.25 0 0 1 10 3.75A1.25 1.25 0 0 1 10.56 3.88L15.56 6.38A1.25 1.25 0 0 1 16.25 7.5V16.25"/>
