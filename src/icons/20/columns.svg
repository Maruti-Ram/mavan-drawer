  <!-- tags: columns, three columns, layout, split, view -->
  <!-- Three equal, wall to wall: Checkbox's square (18 · 14 · 12, container radius 2.5 · 2 · 1.5, outer 3.25 · 2.75 · 2.125), the frame every layout icon ships on, with two dividers wall to wall on table's row lines turned a quarter: x 9.25 / 14.75 · 8 / 12 · 6.375 / 9.625, symmetric about the canvas centre. Columns of air 4 / 4 / 4 · 2.75 / 2.5 / 2.75 · 2.5 / 2 / 2.5 — at 20 exactly Polaris LayoutColumns3 (2.75 / 2.5 / 2.75), at 24 exactly Lucide columns-3 (three equal thirds). At 16 the eighth grid cannot split 7 of air in three: the dividers sit on x.375 / x.625 so each has one whole-pixel edge (7 and 9) and the middle column gives up a half, as table's middle row does. Tightest air at 16: 2 (middle column). How it differs: layout-sidebar has one divider at a third (counters 2.75 / 5.5 at 16), this has two and three equal columns; table adds the cross lines; the map board's flat sheet (map D) is the same idea in a 20×16 landscape box with folds at 8.75 / 15.25 — only the proportion tells them apart, so if columns takes A the map should keep a zigzag or stepped outline. rows (#184) can be this drawing turned back. Filled: table-filled turned — three solids split by 1.5 cuts centred on each divider (8.5–10 / 14–15.5 · 7.25–8.75 / 11.25–12.75 · 5.625–7.125 / 8.875–10.375); pieces 5.5 / 4 / 5.5 · 4.25 / 2.5 / 4.25 · 3.625 / 1.75 / 3.625, outer corners on the outline's, cut corners 0.5. Look at the filled 16: the middle solid is half the width of the outer two (recommended: three columns is the reading no layout icon already owns, and it shares table's lines to the hundredth) -->
