<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: window, app, application, chart, analytics, dashboard, stats, statistics, report, graph, metrics, data, bar chart, bars, columns -->
  <!-- Bar chart: A bar chart in the window: chart-bar-5's framed bars (low, tall, mid) standing right of the dot. Bars at x 10 / 14 / 18 · 8.25 / 11.25 / 14.25, ink heights 5 / 10 / 7.75 · 3.25 / 6 / 4.5 (chart-bar-5: 5 / 10.5 / 7.75 · 4 / 8 / 6; the window's body is 2 · 2 shorter than its square), air between bars 2.5 · 1.5. At 16 two bars, as chart-bar-5 has two at 16, but tall and mid (x 8.375 / 11.375, ink 4.5 / 3.375, air 1.75) rather than its low and tall: beside the dot a low then a tall bar reads as a rising ramp, signal-2's picture, in real pixels at 16. A third bar does not fit at 16: under the dot it reads as an i (a colon filled), and right of the dot it ends 0.75 from the right wall (centrelines on x.375 / x.625). The bars stay right of the dot at 24 and 20 for the same reason: chart-bar-5's x 7 put the low bar 1 right of the dot's centre and the pair read as an i. Chart ink 9.5x10 · 7.5x6 · 4.25x4.5 (x 9.25 to 18.75, y 7 to 17 · x 7.5 to 15, y 7 to 13 · x 7.75 to 12, y 5.75 to 10.25). One traffic light, as window-pointer keeps one. With window's three dots the body under the dot row is 9.5 · 5.5 · 4.5 clear (y 9 to 18.5 · 9 to 14.5 · 7.25 to 11.75), which after 1.5 of air above and below leaves a chart 6.5 · 2.5 · 1.5 tall: at 16 one line weight, a flat line or a row of pills, and beside the third dot there is 6.5 · 2.5 · 2.5 to the right wall, room for no chart at 20 and 16. Two dots still pin the line flat under them at 16 (0.25 of travel) and leave room for one tall bar. So the second and third dots go at every master and the first stays, window's dot verbatim (6,8 · 6,8 · 4.5,6.5). The frame is window's path verbatim, whole and in place; the composite keeps the landscape keyline 20x16 · 16x12 · 14x10, centred, so it needs no box or base note. Air: to the frame 1.5 · 1.5 · 1.5 (floor and the tall bar to the roof at every master; right wall 1.75 · 1.5 · 1.75); to the dot 4.46 · 1.61 · 2.5. Filled: window-filled's slab with its first hole (2 · 2 · 1.5 across) and the chart knocked out 1.5 wide, because the window fills as a shape and a shape's lines are cut out of it (chart-bar-5-filled cuts its bars, activity-circle-filled its pulse); a solid chart on a solid slab would not show. Filled ink box identical to the outline's. The bars are cut as chart-bar-5-filled cuts them: round-ended slots 1.5 wide on the outline's ink ends (at 16 the cap centres pulled in 0.125, so the cut is 0.125 wider than the 1.25 bar on each side and ends where it ends). Solid between cuts 2.5 · 1.5 · 1.5, to the slab's edge 3 · 3 · 2.75, to the hole 4.46 · 1.61 · 2.38 (floor 1.5 · 1.5 · 1.25). No off-grid decimals. -->
  <path d="M4.75 4.75H15.25A2 2 0 0 1 17.25 6.75V13.25A2 2 0 0 1 15.25 15.25H4.75A2 2 0 0 1 2.75 13.25V6.75A2 2 0 0 1 4.75 4.75Z"/>
