  <!-- Hi-fi box: Rhythm: tweeter over woofer, centred; vertical air top / between / bottom 2 / 2 / 2 · 1.5 / 1.5 / 1.5 · 1.5 / 1.5 / 1.5, woofer to side walls 2.5 · 1.5 · 1.5; the woofer is half the body's width at 24 and 20 (8 of 16, 6 of 12), 0.45 at 16. Body 16×20 · 12×16 · 10×14 (portrait keyline), r2.5 · 2 · 1.5. Tweeter a dot ⌀3 · 2.5 · 2.5 (at 16 ⌀2.5 centred on the 7|8 pixel line so it prints as a solid 2×2 core; ⌀2 printed as a grey smudge); woofer ring ⌀8 · 6 · 4.5, hole 5 · 3 · 2 (camera's ⌀8 lens at 24).  Filled: body solid, tweeter a white dot, woofer a 1.5 white band round a solid core ⌀5 · 3 · 1.5; material tweeter to woofer 2 · 1.5 · 1.5. Tried and dropped for speaker: slot over woofer (Central) and square cabinet with corner screws (Untitled speaker-02) are this same box; the smart speaker (SF homepod) has no driver and reads as a jar at 16; on a stand (Untitled speaker-03) reads as a webcam; a boombox or capsule cannot keep two rings 1.5 apart inside 16 or 20. Who: Lucide speaker, Untitled speaker-01, Nucleo speaker, Material speaker, SF hifispeaker (SF's tweeter is a ring: a ring tweeter cannot keep a 1.5 hole and 1.5 air at 20, so a dot). (recommended) — the picture every set agrees on; at 16 dot-over-ring reads as a loudspeaker instantly and sits with camera and calculator. -->
