<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: cmd, command key, mac, modifier, shortcut, keyboard, place of interest, looped square -->
  <!-- box: 13.5x13.5 -->
  <!-- Command key glyph: The ⌘ key glyph (U+2318), as every set that ships an icon named command draws it: Lucide, Feather, Nucleo, Tabler, Phosphor, Material keyboard_command_key, SF command. One closed stroke: two upright and two level lines cross to make the centre square and run on into four three-quarter loops. Rhythm: one pitch across and down, the four centrelines 4.5 · 4 · 3.5 apart (x and y 5.25 / 9.75 / 14.25 / 18.75 · 4 / 8 / 12 / 16 · 2.75 / 6.25 / 9.75 / 13.25), so loop and centre square are the same size: loop ⌀ 4.5 · 4 · 3.5 on its centreline (6 · 5.5 · 4.75 of ink, radius 2.25 · 2 · 1.75), centre square 4.5 · 4 · 3.5 on its centreline, loop hole (2r − w) and centre-square air both 3 · 2.5 · 2.25 against the 1.5 floor. Across the glyph it reads line, air, line, air, line, air, line with every air equal. Ink 15 · 13.5 · 11.75, declared box: hash and plus are 15 · 13.5 · 12, so it swaps with # in a toolbar. At 16 it is 0.25 short of 12 because the even pitch lands there (3.625 would make 12.125, past the mark ceiling), and its outer edges sit 1/8 off whole pixels (2.125 / 13.875) — on round loops, where a whole-pixel edge buys little; the pitch was kept instead. Filled: line-heavy at 2.5 · 2 · 2 on the same centrelines, thickened in place like C17 repeats: closed loops have no ends to pull in, and holding the outline box would leave 1.25 holes at 16. So it grows 0.5 · 0.25 · 0.375 on every side (ink 16 · 14 · 12.5) and the loop holes and centre air stay equal at 2 · 2 · 1.5. The 16 filled stands 0.25 past the 12 mark ceiling on each side, inside the 14 circle. Not a keycap with the glyph knocked out: the filled twin has to be the outline picture, and a ⌘ inside a keycap cannot keep 1.5 holes and 1.5 to the walls at 20 or 16 (the smallest such ⌘ at 16 is 9.5 across and needs a 15-wide key). Risk: at 16 this is the densest glyph in the set, four loops 4.75 across; the eye has to confirm it reads as ⌘ and not as a knot. (recommended: it is the picture the name means in every set that ships a command icon, its rhythm is one number at every master, and it sits with keyboard as the key you press, where a prompt would belong to a later terminal icon) -->
  <path d="M12 6V14A2 2 0 1 0 14 12H6A2 2 0 1 0 8 14V6A2 2 0 1 0 6 8H14A2 2 0 1 0 12 6Z"/>
</svg>
