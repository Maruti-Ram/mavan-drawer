  <!-- Floor collar, fuller head at 16: A's collar (1.5 of air at every master, measured 1.5 · 1.5 · 1.5), and at 16 only the head grows an eighth in radius (2.125, so 5.5 across instead of 5.25; its centre moves an eighth along the axis to 4.75,11.25 so the point stays in the box corner) — which gives back the shipped waist: the head stands 1.5 · 1 · 0.75 proud of the collar each side (shipped 1.59 · 1.09 · 0.76). 24 and 20 are identical to A. What it costs: at 16 the head is a quarter wider across than shipped, and the collar there is 3.24 long (A 3.6, shipped 3.45); the handle line does not move. (recommended) it is the only one that fixes the air without giving up the waist — the part that makes the head read as bristles in a ferrule at 16 — and the head change is an eighth, at one master. Everything else is the shipped drawing: the round head (radius 3 · 2.5 · 2.125 on the centreline, 7.5 · 6.5 · 5.5 across), its 90° point in the bottom-left box corner with bend 0.75 · 0.75 · 0.625 (C10) and its two edges on the box's left and bottom lines, the concave waist (0.75 · 0.75 · 0.625), collar corners 0.75 · 0.75 · 0.625, and the same handle line (from 12.5,11.5 · 10.5,9.5 · 8.375,7.625 to the top-right box corner, 10.96 · 8.13 · 7.07 long). Filled: head and collar solid to the outline's outer edge, handle a line at 1.5 · 1.5 · 1.25. Ink 18×18 · 14×14 · 12×12 on the square keyline, centred; filled ink box equals the outline's. Off-grid numbers: the collar is set by its width across the 45° axis, so its edges, corner and waist tangent points are off the grid (rounded to 2 dp at 24 and 20, 3 dp at 16), as are the head arc's tangent points; the head centre, the point's bend, cap ends and box edges sit on the grid (quarter at 24 and 20, eighth at 16). -->
