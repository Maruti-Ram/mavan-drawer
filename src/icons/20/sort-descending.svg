  <!-- Agreed: arrow down, rag down: Both the arrow and the rag say down, and they agree. Three bars shrinking downward on the left, a full-height down arrow on the right. The arrow is `arrow-down`'s own drawing taken verbatim — head 10 · 9 · 8 of ink across, placed by a shift in x alone (and in F/J a shift in y as well), plus the stem that meets its apex. It is the head `arrow-up`'s note reserves for composites and the one `upload` carries byte-for-byte. At 24 and 20 the outline legs are a true 45° (3.72 · 3.22 per axis); AT 16 THEY LEAN — 2.928 across against 3.001 down, 45.7° — and the shipped FILLED head is a true 45° at every master, so outline and filled differ here exactly as the shipped pair does. Do not redraw either symmetric. Stem at 14.5 · 12.25 · 10, running the full 15 · 13.5 · 12 that arrow-down's stem runs (ink 4.5→19.5 · 3.25→16.75 · 2→14), so the arrow holds all four edges of the box on its own. Bars ink 7.25/5.25/3.25 · 6.5/4.75/3 · 5.5/4/2.5 from menu's own left edge (4.5 · 3.25 · 2), rows 6/10.5/15 · 4.75/8.75/12.75 · 3.5/7/10.5, pitch 4.5 · 4 · 3.5. Three numbers here are measured consequences, not choices. (1) The head is 67% of the mark at every master, and the longest bar is fixed by the FILLED stem — which thickens sideways to 2.5 · 2 · 2 while a bar's cap only pulls in — so it lands at 7.25 · 6.5 · 5.5, 48% · 48% · 46% of the mark, with the gap exactly 1.5. (2) The head is 5.44 · 4.94 · 4.44 deep, which puts menu's own bottom row inside it, so the stack moves up off menu's rows and tightens; filled air 2 · 1.5 · 1.5. (3) The shortest bar is then capped by the head's filled tip at 3.25 · 3 · 2.5. The step falls out even: 2 · 1.75 · 1.5 a bar. Box 15×15 · 13.5×13.5 · 12×12, centred, identical in both styles — no grows. Filled: line-heavy, 2.5 · 2 · 2, head and stem from arrow-down-filled, the stem's tail cap pulled in 0.5 · 0.25 · 0.375. Mirrors cleanly: flip top to bottom and this is sort-ascending, arrow-up's head, rows 9/13.5/18 · 7.25/11.25/15.25 · 5.5/9/12.5, same lengths reversed. (recommended) -->
  <path d="M4 4.75H9"/>
  <path d="M4 8.75H7.25"/>
  <path d="M4 12.75H5.5"/>
