  <!-- Piggy bank, refined: C polished in place: the same oval body on two stick legs, with a coin slot, an ear and a snout. Body ellipse ink 16×13.5 · 12.5×10.5 · 10.5×8.5 — wider and lower than C's 15.5×14 · 12.5×11.5 · 10.75×9.5 (width to height 1.19 · 1.19 · 1.24 against 1.11 · 1.09 · 1.13), so it sits like a pig, not a ball. Ear: a triangle 4.25 · 3.5 · 2.75 wide at its base, its tip rounded r0.75 · 0.75 · 0.625 and on the keyline, rising 2.25 · 1.75 · 1.75 above the back and leaning toward the snout (C's was a thin spike rising 1.75 · 1 · 1.125, which read as a thorn). Snout: 3.5 · 3 · 2.75 tall (white 2 · 1.5 · 1.5), 2 · 1.5 · 1.5 proud of the body, front corners r0.75 · 0.75 · 0.625 so it reads soft like the body, not as a box stuck on. Legs: symmetric under the body, 3.75 · 3 · 2.625 either side of its centre, 3.1 · 2.5 · 2.4 showing below it. Slot 2.5 · 2 · 1.5 long, set back toward the rump at y 9.5 · 9.25 · 7.75, at least 1.5 from the back (lint). No eye and no tail: the slot is the bank, and an eye would be a second mark in a body 6 pixels tall at 16; a tail cannot hold 1.5 inside its curl at 16. Ink 18×18 · 14×14 · 12×12, centred. Filled: the body solid with ear and snout, the slot cut 1.5 wide at every master, legs stay lines at 1.5 · 1.5 · 1.25. (recommended) — keeps the picture Maruti picked and every part reads at 16 in both styles -->
