  <!-- tags: wheelchair, accessibility, accessible, a11y, disabled, in motion -->
  <!-- Arm swept back, 30° lean: The Accessible Icon Project's figure, drawn as a sibling of wheelchair. Who draws it this way: the Accessible Icon Project, Lucide accessibility, SF Symbols figure.roll, Fluent Wheelchair Access, Font Awesome wheelchair-move: head ahead of a leaning torso, an arm bent back at the elbow, the leg forward, an open wheel. Shared with wheelchair, verbatim: the wheel (12 · 9.5 · 7.75 across, opening 135°, filled 170°), the head dot (3 · 3 · 2.5 across), the seat line, knee bend, 32° shin and foot, the box 18×18 · 14×14 · 12×12, and bends of half the weight (0.75 · 0.75 · 0.625; filled 1.25 · 1 · 1). What changes: the torso leans 30° at every master (Lucide 34°, SF figure.roll about 19°, Fluent about 40°, measured off their outlines) and runs as one straight line, 7.5 · 4.33 · 3.26 long, from the hip to the neck. The head sits on that same line, 1.5 above the neck end, so head and torso read as one body (round 1's D held its head 2.93 · 2.49 · 2.3 away and off the line). The arm leaves the torso 1.5 · 1.25 · 0.75 below the neck as its own stroke: upper arm 6.22 · 5.62 · 4.47 rising 54 · 55 · 53°, forearm 2.57 · 2.02 · 1.74 dropping 29 · 30 · 30° toward the wheel. It rises more steeply than Lucide's 29° because the box is square and the wheel's opening ends at its top: a flatter arm meets the wheel at 20 and 16. Air: head to torso 1.5 at every master, outline and filled; head to arm 2.54 · 2.3 · 1.92 (filled 2.04 · 2.05 · 1.55); hand to wheel 3.13 · 1.61 · 1.61 (filled 3.57 · 1.8 · 1.63); leg to wheel 2.2 · 1.51 · 1.71 (filled 2.36 · 2.1 · 1.82). Thigh's straight run 3.41 · 1.58 · 1.52 (filled 2.27 · 1.01 · 0.66). Filled: lines 2.5 · 2 · 2; the neck end and the hand pull in by the added half weight so the head and the wheel keep their 1.5, the junction and elbow stay, the foot keeps the right edge; ink box identical to the outline. The decimals are where the lean, the 1.5 neck gap and the half-weight bends put each point (the neck end is rounded away from the head); the seat, knee, shin, foot and wheel numbers are wheelchair's. At 16 the arm, the short neck above it and the torso knot into a small X: the busiest of the three. -->
