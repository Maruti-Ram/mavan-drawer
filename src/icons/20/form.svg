<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- keyline: mark -->
  <!-- tags: labelled fields, horizontal form, settings, inputs -->
  <!-- Labels beside fields: Labels beside their fields, two rows: the horizontal form of settings screens (Vaadin form draws it: a block left of each field). It keeps its labels at every master because they sit beside the fields, not above, which is the height A ran out of. Keyline mark, 18x15 · 14x12.5 · 12x11, centred. Labels 4.5 · 3.5 · 2.5 of ink, centred on their field, 2 · 2 · 1.5 from it; fields 11.5x6 · 8.5x5 · 8x4.5 (3 · 2 · 2 inside), corners 1.5 · 1.25 · 1, right-aligned to the box; row air 3 · 2.5 · 2, pitch 9 · 7.5 · 6.5; margins 3 left and right, 4.5 · 3.75 · 2.5 top and bottom. Tightest air at 16: 1.5, label to field. Filled: fields solid, labels stay 1.5 · 1.5 · 1.25. At 16: rows-2's boxes run the full 12 with no labels; layout-list is the mirror (tiles left, two lines right of each); password is one field. Risk: at 16 a label is a 2.5px dash, and filled it nears a list of pills (recommended: several fields to fill in, each with its label, the same parts at every size, air never under 1.5) -->
