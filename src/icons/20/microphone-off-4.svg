  <!-- Big slash to the square, bar cut through: What the eye sees: microphone-4 (the squared cup) struck by the same bar as A2. At 24 the cup keeps its left side, its corner and its flat bottom past the stand, so it reads as a cup with its lower right corner cut away; the right side stands alone. At 20 and 16 the step meets the flat bottom: the bottom ends 0.5 · 0.52 left of the stand and drops 45° into it, which reads as a small Z — the clearest case on the board for A1. At 20 and 16 the bar's air falls across the joint where the stand meets the cradle (in the base that joint sits 1.15 · 1.14 from the bar's edge), so cradle and stand are cut on the same line with their ends only 0.71 · 0.73 apart — left as two caps they would merge into a lump. The two cut ends are joined by a 45° step along the edge of the air, parallel to the bar and 1.5 clear of it, so the stand stays on the cradle; it reads as a slight bend at the top of the stand. The step is the one stroke in this drawing that is not in the base. Bar (C21; Maruti 2026-10-25, the big slash to the square: every -off bar spans the square keyline): \ at 45°, its ink the square keyline 18 · 14 · 12, centred on the microphone's ink centre 12,12 · 10,10 · 8,8 (on the grid, nothing snapped): centreline M3.75 3.75L20.25 20.25 · M3.75 3.75L16.25 16.25 · M2.625 2.625L13.375 13.375. It stands 1 · 1 · 1 past the microphone's sides (2 past microphone-5's at 24) and sits 1 · 1 · 1 inside its top and bottom, so the box is declared 18×20 · 14×16 · 12×14. All five shapes have the same ink centre, so the row shares this one bar. Measured against the inside-width bar it replaces, the longer bar removes nothing new: every kept piece is identical, its extra length runs outside the microphone. Cut: every stroke stops with 1.5 of air from the bar's edge (cut-end centrelines 3 · 3 · 2.75 from the bar's), measured 1.505 · 1.505 · 1.501 at the tightest cut end; round caps. Kept (24 · 20 · 16): capsule as A2, 12.57 · 8.04 · 6.56. Cup's left piece 16.43 · 8.64 · 7.08: the left side from 9 · 9 · 7.515 (6.25 · 2.75 · 2.36 of 6.75 · 4.5 · 4.25), the corner, and the bottom to 13.5 · 9.5 · 7.485 — at 24 that is 1.5 past the stand, not shorter than C33's 1.5, so it stays as a short foot of the cup; at 20 and 16 the 0.71 · 0.73 step into the stand. Cup's right side 6.5 · 3.75 · 2.86, straight from its top down to 15 · 11 · 8.485. Stand 3.5 · 3 · 2.49 (plus the step). Removed: capsule 12.57 · 10.95 · 10.08; the cup's lower-right corner with the end of its bottom and of its right side, 7.93 · 9.39 · 9.03. Ink 18×20 · 14×16 · 12×14, centred 12,12 · 10,10 · 8,8, declared as a box. Filled: the capsule fills; a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side) is knocked out of it, corners r0.75 · 0.75 · 0.625, white 1.506 · 1.506 · 1.501 each side, the bar whole through it at 1.5 · 1.5 · 1.25. What stays is the capsule's upper right as one solid, 5.70 · 4.14 · 3.41 thick across the channel. The cradle, stand and foot stay lines at 1.5 · 1.5 · 1.25, cut exactly as the outline. Off-grid decimals are the cut ends, the step and the channel's corners. -->
