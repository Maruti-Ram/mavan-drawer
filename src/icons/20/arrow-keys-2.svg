  <!-- box: 15.5x10 -->
  <!-- optical: 0 -0.5 -->
  <!-- Four solid triangles, polished: B refined. Rhythm and balance: one pitch both ways, as on a keyboard — every triangle's box centre sits on a square grid of 7.2 · 6.25 · 5.375 (2 · 2.08 · 2.15 triangle bases), set so the white between neighbours is the same share of a triangle at every master — 0.75 · 0.71 · 0.75 of its width. On that grid the air reads equal: ▲'s base faces ▼'s base flat to flat at 3.9 · 3.25 · 2.88, and the white between ◀ (or ▶) and ▼ averages 3.81 · 3.18 · 2.81 across ▼'s height (it is 3 · 2.5 · 2.25 at ▼'s corner and opens along its slope) — within 0.09 · 0.07 · 0.07 of the flat gap. B set the nearest points equal instead (2.4 · 2 · 1.75 everywhere), which left ▲ and ▼ reading tight, a sort pair beside two loose side triangles. Optical: lifted 0.65 · 0.5 · 0.5, half the four triangles' centre-of-mass offset with the box centred (0.68 · 0.59 · 0.52), caret-up's measure for solid triangles, on each master's grid. Triangles: 90° points like caret-up, each a closed stroke its own weight shuts (centreline base 3.6 · 3 · 2.5, no counter), legend ink 5.1×3.3 · 4.5×3 · 3.75×2.5 each, 0.21 · 0.23 · 0.23 of the canvas; corners round at 0.75 · 0.75 · 0.625. Ink 17.7×11.4 · 15.5×10 · 13.25×8.5, declared box; vertices on tenths at 24 (3.6 is the largest base the stroke shuts), on the grid at 20 and 16. Filled: caret-up's pair cannot be followed — its outline is a hollow triangle, and a hollow one needs a base of 7.24 · 7.24 · 6.64 to keep 1.5 of air inside, so three across would need 21.5 · 21.5 · 19.3 against 20 · 16 · 14. So it follows grid-4, the set's other solid-in-outline drawing (C17): the same triangles on the same centrelines at 2.5 · 2 · 2, which thicken in place — filled legend 6.1×4.3 · 5×3.5 · 4.5×3.25, corners r 1.25 · 1 · 1, declared growth 0.5 · 0.25 · 0.375 on every side; filled air 2 / 2.9 · 2 / 2.75 · 1.5 / 2.13 (corner / flat). At 16 the filled cluster is 14 wide, on the margin, with its corner air on the 1.5 floor: that fixes the 16 pitch and the 16 triangle (base 2.5, ink 3.75 wide, 0.5 smaller than B's) — B's base 3 would only fit there by tightening the 16 air to 0.6 of a triangle, breaking the rhythm, so the rhythm was kept and the size paid. Clear of move (no shafts, a T not a plus) and of arrow-keys (no caps). -->
