<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: moon, crescent, night, dark mode, theme -->
  <!-- Waist = the radius: The bite circle passes through the moon’s own centre: radius 6.54 · 5.13 · 4.51, centred 6.54 · 5.13 · 4.51 out along the 45° diagonal, so the two horns are the ends of its diameter and the inner arc is an exact semicircle through the centre point. The crescent is then 9.25 · 7.25 · 6.38 across at the waist — half the icon’s width — and the counter inside the outline is 7.75 · 5.75 · 5.13 clear. The whole icon is three numbers: the keyline radius, half of it twice over for the bite’s centre, and that radius ÷ √2. Polaris’s moon has this exact waist. (recommended) -->
  <path d="M10 2.75A7.25 7.25 0 1 0 17.25 10A5.13 5.13 0 0 1 10 2.75Z"/>
</svg>
