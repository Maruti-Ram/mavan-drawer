  <!-- Spark tapering, out of the corner: Spark tapering, out of the corner (recommended; Maruti locked H on 2026-10-25 and asked to refine and polish it, especially at the smaller sizes): image, unchanged and in place, with a spark in the sun's place out of the top-left corner; the sun goes, the mountain stays whole. The spark is two crossed thin diamonds, each a closed stroke at the outline weight, sharp on the line so each tip is the round join, radius 0.75 · 0.75 · 0.625; the arms run straight from the middle to a point, and where the diamonds cross the sides turn in to a narrow waist. Solid in both styles; the filled spark is the outline's own ink. Ink 8 · 7 · 6.5 across, 0.44 · 0.50 · 0.54 of the frame; both diamonds the same, so all four arms are 4 · 3.5 · 3.25 long and taper alike. Diamonds 0.75 · 0.5 · 0.5 wide at the middle on the line; arm 2.11 · 1.89 · 1.65 wide at half its length, 1.65 · 1.57 · 1.34 at three quarters; waist (ink across the diagonal) 3.48 · 3.03 · 2.70; tips open 26 · 20.6 · 21.6 degrees. Polish at 20 and 16, before to after: diamonds 0.75 to 0.5 at 20 and 0.625 to 0.5 at 16, so the middle reads as a waist rather than the crossing of a plus: arm at half length 2.10 to 1.89 and 1.76 to 1.65 (still a third above the line weight 1.5 · 1.25; narrower and it thins to a glint), waist 3.40 to 3.03 and 2.90 to 2.70, tips 30.5 to 20.6 and 26.8 to 21.6 degrees; in real pixels the four pixels round the middle go 89% to 78% at 20 and 72% to 65% at 16, the pixels beside each arm 48% to 40% and 29% to 25%. Tips: at 24 and 20 they land on pixel edges (2 and 10, 2 and 9); at 16 they sit at 1.25 and 7.75, because 7 across (tips on 1 and 8) would leave 1.10 of black between the cut and the mountain in the filled twin, under the floor 1.25. Centring: on the corner's diagonal, the middle on a pixel centre at 20 and 16 (5.5 · 4.5; 6 at 24), so each arm falls on one pixel column or row; its ink corner on the margin edge 2 · 2 at 24 and 20 and 0.25 in at 16 for that pixel centre; the top and left walls start at the same 11.25 · 10.75 · 9.25, so the air is the same both sides. Box 19×19 · 15×15 · 12.75×12.75, centre 11.5 · 9.5 · 7.63. Cut back by hand with 1.5 of air from the spark's ink: walls 6.5 · 3.5 · 2.625 long before their corner arcs; the top-left corner goes. Tightest air outline 1.51 · 1.55 · 1.58 (unchanged), the mountain 6.63 · 4.33 · 2.90 away. Filled: image-filled's upper solid without the sun's hole, cut along the spark's ink grown 1.5 and followed into the inner waist with the black point rounded 0.5, as image-plus cuts round its plus; bridged by a straight line only where a waist runs out through the top or left edge; junctions with the frame eased 0.5; the lower solid verbatim. The air is 1.5 along every tip and flank (tightest 1.51 · 1.50 · 1.50; at 20 1.506 to 1.502) and 1.87 · 1.93 · 1.92 in the inner waist, where a 1.5 offset of a corner cannot come closer; at 16 the filled twin keeps 1.28 of black between the cut and the mountain (floor 1.25). Off-grid numbers are the spark's tangent points and crossings, image's own, and the cut's tangent points and 0.5 fillets (its arcs placed 0.006 · 0.006 · 0.001 out so rounding keeps 1.5); the spark's centre and its four tip extremes sit on the grid. -->
