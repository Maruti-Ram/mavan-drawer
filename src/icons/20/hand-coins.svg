  <!-- Coins in a hand: Two coins resting above an open hand, palm up, seen from the thumb side (Central money-hand, Untitled coins-hand, Lucide hand-coins). Really an adjacent meaning — pay out, tip, donate — and would ship as hand-coins, a name not yet on the sheet; it is here because it is the one other familiar coins picture. What changed from round 1’s hand: it is drawn as Central draws it, one line from the wrist over the thumb, down into a valley and out along the fingers, which rise at 34–35 degrees to a round tip — not a thumb block over a finger block, which read as a figure lying down. The wrist narrows (5.5 · 4.25 · 3.5 on the centreline) into the palm (7 · 5.5 · 5); finger band 3.5 · 3 · 2.75 (air 2 · 1.5 · 1.5), fingertip a half circle r 1.75 · 1.5 · 1.375 whose centre sits on the grid so the ink ends at 22 · 18 · 15; thumb valley r 1 · 1 · 0.875. Coins ⌀ 8 · 7 · 5.5, the back one cut 1.5 clear of the front one (190 · 168 · 162 degrees show), 1.5 above the thumb. Box 20 · 16 · 14 square. Filled: the coins solid, the hand kept as its line at 1.5 · 1.5 · 1.25 — it is an open stroke, and a solid hand under a solid coin read as a head and shoulders (a person) in the 16 strip. Watch at 16: the fingers are one band, so the hand reads by its outline and the thumb valley alone -->
