  <!-- Signature inside the page: Signature inside the page: the shipped file, whole and unchanged (default shape: fold top-right, chamfer 6 · 5 · 4; ink 16×20 · 12×16 · 10×14, portrait keyline, centred), with a signature squiggle in its open lower part. No badge and no cut. What the page allows: under the fold, 1.5 from both walls, the fold's foot and the bottom wall, the open part is 10×8 · 6×5 · 4.5×4.375 of ink room (x 7–17, y 11–19 · x 7–13, y 10–15 · x 5.75–10.25, y 7.875–12.25). The shipped signature cannot be scaled into it. Its baseline costs 3 · 3 · 2.75 of height (the bar plus 1.5 of air), which leaves 2 · 1.625 at 20 and 16 for a 1.5 · 1.25 stroke, a straight line: file-text-2. Its loop needs a ring 4.5 · 4.5 · 4 of ink across to keep 1.5 inside (radius 1.5 · 1.5 · 1.375 on the line), with the lead-in and tail beside it, which fits only at 24. So 16 needs the line and the loop both gone, and to keep one picture at every master they go at 24 and 20 too. What is left is scribble's wave, one crest and one trough (a tilde). It is built as scribble builds its wave: one arc per turn, radius (p² + h²) / 4h = 2.43 · 1.22 · 0.841 (exact 2.431 · 1.219 · 0.8406, rounded to 2 · 2 · 3 dp). Half-period 4.25 · 2.25 · 1.625, crest 2.5 · 1.5 · 1.25 above the trough (scribble's 3 · 1.92 · 1.58 and 2 · 1.5 · 1.25); the ends sit mid-slope, rising. Ink 10×4 · 6×3 · 4.5×2.5, spanning the full open width, exactly 1.5 from each wall (centreline x 7.75–16.25 · 7.75–12.25 · 6.375–9.625), and centred on file-text's line centre, y 15 · 12.5 · 10. Air: to the walls 1.50 · 1.50 · 1.50, to the fold 4.74 · 3.01 · 2.75, to the bottom wall 3.5 · 2.5 · 2.5. Tightest 1.50 at every master. Filled: file-filled's sheet with the wave knocked out as a white slot 1.5 wide on the outline's centreline, round ends, as file-text-filled knocks out its lines (1.5 at every master, C22: wider than the 1.25 line at 16); the flap verbatim. Sheet left round the slot at least 3.0 · 3.02 · 2.5. The slot's inner turns have radius R − 0.75 = 1.68 · 0.47 · 0.091; C1's corner floor (lint §5k) does not apply to a slit, white no wider than 1.5. At real pixels at 16 the tilde reads as a squiggle, but it is close to file-text's single bar. Off-grid decimals: the outline's arc radii; in the filled twin the slot's edge points, each 0.75 either side of the centreline along the arc's radius. -->
