<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: article, picture, post, page -->
  <!-- Article page: The article / rich-text page: a page with a picture block over text lines — SF doc.richtext, Phosphor Article family, Material article / feed. Rhythm and balance: walls 1.5 all round the content, picture and lines on equal gaps (2 · 2 at 24), the picture full content width so it weighs as much as the two lines below it. 24: page 16×20 (file-text's page without the fold), r2.5; picture 10×7 outer, r1 (its outer corner 1.75 = the page's inner corner); two lines, 10 and 7 long — the last one ragged, as text ends; gaps 2 · 2, walls 1.5. 20: page 12×16, r2; picture 6×4.5, r0.75, one ragged line 4.5 long (two lines need 13.5 of the 13 inside); walls 1.5 at top and sides, gap 2. 16: page 10×14, r1.5; picture 4.5×4, r0.625 (its inside air 1.5), one ragged line 3.25 long, left-aligned so it reads as text and not as a centred phone home bar; gap 1.75, 3 of paper below. Filled: the page fills, the picture and the lines are cut out as white (picture at the outline picture's outer edge, lines 1.5 wide); solid between picture and line 2 · 2 · 1.63. Weakest at 16: the narrow page leaves a 4.5×4 box over a short line; the ragged line helps, but it can still read as an ID badge. Round 3: tried the picture as a cover band across the top of the page instead of a framed box — at 16 it read as a fridge or a notepad, worse than the badge — so B keeps its framed picture; F is the same picture without the page, which is what stops the badge read. -->
  <path d="M6.75 2.75H13.25A2 2 0 0 1 15.25 4.75V15.25A2 2 0 0 1 13.25 17.25H6.75A2 2 0 0 1 4.75 15.25V4.75A2 2 0 0 1 6.75 2.75Z"/>
  <path d="M8.5 5.75H11.5A0.75 0.75 0 0 1 12.25 6.5V8A0.75 0.75 0 0 1 11.5 8.75H8.5A0.75 0.75 0 0 1 7.75 8V6.5A0.75 0.75 0 0 1 8.5 5.75Z"/>
  <path d="M7.75 12.25H10.75"/>
</svg>
