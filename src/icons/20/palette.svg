<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: palette, paint, colour, color, art, theme, notch, material, lucide, phosphor, tabler, font awesome -->
  <!-- Round palette, thumb notch: Round palette, thumb notch: Material palette, Lucide palette, Phosphor Palette, Tabler palette, Font Awesome palette — a disc whose lower right turns in to a thumb tab. Rhythm and balance: the paint dots (C17) sit on one circle concentric with the wall, radius 5.25 · 3.75 · 3.25, so every dot keeps the same air to the wall, 1.99 · 1.75 · 1.5; four on an even 60° pitch at 24 (dot to dot 2.75), three on 90° at 20 and 16 (3.3 · 2.6) — four at 20 left 1.75 between dots, denser than either neighbour, and a fourth at 16 would leave 1.25, so the rhythm runs open at every master and the dot is dropped, not squeezed. The notch's corner (radius 4 · 3.5 · 3.125 on the line) is centred on the last dot, so that dot keeps the same air to the corner as the others to the wall; the ledge at y 16 · 13.5 · 11.125, the thumb's round end and its fillet 1.5 · 1.25 · 1. Dots are alert-circle's, ink 2.5 · 2 · 2. The notch takes ink from the lower right, so the outline's mass sits 0.22 · 0.18 · 0.15 left and 0.59 · 0.3 · 0.3 above centre — the picture's own lean, as in Material's. Ink 20×20 · 16×16 · 14×14 on the circle keyline, box-centred. Filled: the disc solid, the dots knocked out white at the outline's dot size, 2.75 · 3.3 · 2.6 of disc between two dots. Off-grid numbers are tangent points and the 60° dots' centres. The clearest palette at 16 in the row, and the picture most UI sets draw. (recommended) -->
