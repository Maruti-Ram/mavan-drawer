<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: bars, columns, baseline, rising, increasing, growth, trend, analytics, report -->
  <!-- Rising bars on the floor: chart-bar-2 with its three bars put in rising order, short / medium / tall from left to right, as Lucide's chart-column-increasing draws it - the same floor, the same three bars, nothing added; chart-bar-horizontal B carried this floor over as its wall. Every number is chart-bar-2's: floor 3.75 → 20.25 · 3.75 → 16.25 · 2.625 → 13.375; bars on 6 / 12 / 18 · 5 / 10 / 15 · 4 / 8 / 12 (pitch 6 · 5 · 4), ending 1.5 · 1.5 · 1.75 of air above the floor; bar lengths 4.5 / 8.5 / 13.5 · 3 / 6 / 9.5 · 2.75 / 4.75 / 7.75 (ink 6 / 10 / 15 · 4.5 / 7.5 / 11 · 4 / 6 / 9). The rise is not even: it steps 4 then 5 · 3 then 3.5 · 2 then 3 (at 16, a 2-pixel then a 3-pixel step), so it reads as growth that speeds up; even steps would mean changing a bar. Air between bars 4.5 · 3.5 · 2.75, filled 3.5 · 3 · 2. Ink box 18 · 14 · 12 square, filled identical. How it differs from chart-bar-2: only the order - chart-bar-2 peaks in the middle (medium / tall / short), this one is a ramp; at 16 that is a 4-6-9 pixel staircase against 6-9-4. From signal-2 (four rising bars, no floor) the floor and the count. Why no arrow: with the set's head in the free corner, placed as B places it, the medium bar under it keeps 5.5 · 1.5 · −0.25 of its 8.5 · 6 · 4.75 - at 16 it is gone; even a head as small as Nucleo's (legs 2.22 at 16, same place) would leave it 2.8 long, 4 pixels against chart-bar-2's 6. Filled: chart-bar-2-filled reordered - weight 2.5 · 2 · 2, the floor thickens upward (centreline up 0.5 · 0.25 · 0.375), the bars end 1.5 above it and their tops pull in by the same, filled lengths 2.5 / 6.5 / 11.5 · 2 / 5 / 8.5 · 1.5 / 3.5 / 6.5. (recommended) -->
  <path d="M3.75 16.25H16.25"/>
  <path d="M5 10.25V13.25"/>
  <path d="M10 7.25V13.25"/>
  <path d="M15 3.75V13.25"/>
</svg>
