  <!-- Triangles at dashed axis: flip-horizontal turned a quarter clockwise, every number kept (on the 16 master the turn keeps the eighth grid and the box edges on whole pixels). Two triangles pointing at a dashed mirror line: Lucide flip-vertical-2 (now triangles-centerline-dashed-vertical), Nucleo flip-vertical (Nucleo draws the axis as dots), the flip buttons in design apps. Rhythm: the axis is E's straight dashed line, the board's one spec for a straight axis: three even dashes, one on the centre, flush with the box: dash 3 · 2 · 1.75 on the centreline (ink 4.5 · 3.5 · 3), air 2.25 · 1.75 · 1.5, ink to air 2:1 at every master. Each point keeps 1.5 of air to the centre dash at every master, so the points stand 4.5 · 4.5 · 4.25 apart. At 16 the outer dashes end on whole pixels; the centre dash ends on half pixels (6.5, 9.5), as any centred dash of 3 must. Triangles drawn from their corner centres, corners at half the weight (0.75 · 0.75 · 0.625, rewind's), point 90° at every master, ink 12.5×7.75 · 8.5×5.75 · 7.25×4.875, white inside 3.94 · 2.28 · 1.97. Agreed box 18×20 · 14×16 · 12×14: Lucide's own width for the triangles, the square's width for the axis; on the square keyline the 16 triangle that keeps 1.5 to a centre dash holds at most 1.375 of white inside (computed), under the floor. Nearest shipped relative: collapse (chevrons at a solid line); at 16 the stacked pair also reads close to hourglass. Filled: triangles solid on the outline's outer edge (corners 1.5 · 1.5 · 1.25), dashes stay lines at 1.5 · 1.5 · 1.25; ink box identical. Off-grid numbers are the corner arcs' tangent points. -->
