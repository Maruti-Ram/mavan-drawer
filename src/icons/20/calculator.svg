<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: math, numbers, sum, arithmetic, keypad, readout, equals key, device -->
  <!-- Tall key: Tall key. Lucide, Heroicons, Remix and Nucleo: a readout line over the keys and one key twice as tall — the + / = key. Body as A. The keypad is A's rhythm exactly: dots ⌀ 2 · 2 · 1.5 on a pitch of 3.75 · 3.5 · 3, gaps 1.75 · 1.5 · 1.5, margins to the side walls and the floor 1.75 · 1.75 · 1.5. 24: 3x3 with the last column's lower two keys fused (7 dots and the tall key, Lucide's layout); 20 and 16: a column of 2 dots and the tall key. The tall key is a capsule exactly as wide as a dot (2 · 2 · 1.5) and as tall as two rows (5.75 · 5.5 · 4.5). The readout is a line exactly the keypad's width (ink 9.5 · 5.5 · 4.5), 1.75 below the top wall and 2.5 above the keys at every master — one gap more than between the rows, so it reads as the display, not a fourth row of keys. 16 decimals: readout at y 4.625 (top edge on a whole pixel, 4) and x 6.375–9.625; dots on pixel centres (x 6.5, y 8.5 / 11.5); the tall key centred on pixel column 9 (x 9.5), so its halo matches the dots'. Filled: body solid; readout cut as a pill 1.5 tall (at 16 y 4 to 5.5, wider than its 1.25 line, C22); keys and tall key cut at their outline ink; solid between cuts 1.75 · 1.5 · 1.5. Balance: quadrants within 23–29 %, ink centre within 0.12 of the canvas centre at every master. Tightest air at 16: 1.5. Warnings: C10 on the capsule's end arcs (r 0.25 · 0.25 · 0.125) — they are a key's round end with the dot's own outer radius, not a bend; a plain line clears the warning but is 0.5 · 0.5 · 0.25 narrower than the dots. (recommended: the one picture whose rhythm carries unchanged through all three masters — keypad pitch and gaps as A, the readout fixed at 1.75 / 2.5 everywhere — and the best-balanced face; the tall key is the detail a phone keypad, a building or a calendar does not have) -->
  <path d="M6.75 2.75H13.25A2 2 0 0 1 15.25 4.75V15.25A2 2 0 0 1 13.25 17.25H6.75A2 2 0 0 1 4.75 15.25V4.75A2 2 0 0 1 6.75 2.75Z"/>
