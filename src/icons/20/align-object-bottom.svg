  <!-- Line and two boxes: Rhythm: two boxes 6 · 5 · 4 wide (white inside 3 · 2 · 1.5), 2 · 2 · 1.75 of air from the line to both and 2 · 2 · 2 between them; the line spans the whole 18 · 14 · 12 and runs 2 · 1 · 1 past the boxes at each end; long box 14.5 · 10.5 · 9 tall, short 9.5 · 7 · 6 (0.655 · 0.667 · 0.667 of the long), both flush on the bottom side, the long one on the left. Balance: ink 18 · 14 · 12 square on the square keyline, box-centred on the canvas with margins 3 · 3 · 2 on all four sides; ink mass off the canvas centre by x, y -0.55, 1.46 · -0.47, 0.87 · -0.41, 0.77, toward the bottom edge and the long box — kept on the box centre on purpose, as Lucide align-end-horizontal and Nucleo align-bottom are: the lean is what the icon says, and C14 moves only pointing marks. Corners r 1.5 · 1.25 · 1 on the centreline (inside 0.75 · 0.5 · 0.375, the C1 floor); 16 on the eighth grid, every box wall and the edge line on x.375 / x.625 so outer edges land on whole pixels. Who: Lucide align-end-horizontal, SF Symbols align.vertical.bottom, Nucleo align-bottom, Central horizontal-alignment-bottom; Phosphor AlignBottom among the public sets — the common picture. Order: every reference checked leads with the tall box, as here — Lucide align-end-horizontal, SF Symbols align.vertical.bottom, Nucleo align-bottom / align-3-bottom, Central horizontal-alignment-bottom and Untitled UI align-bottom-02. Figma's "Align bottom" is this picture with solid bars (D). Filled: both boxes solid to the outline's outer edge (corners r 2.25 · 2 · 1.625), the line stays at 1.5 · 1.5 · 1.25; ink box unchanged. At 16 beside the set it is the one that says "line these up against this" in every member: the line names the edge, two boxes of different length say "objects", and the six stay apart in a toolbar row, where C relies on a 2-pixel shift of the short box (recommended) -->
