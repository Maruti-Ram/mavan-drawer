  <!-- tags: house, start, cottage, window, low roof -->
  <!-- Low roof, window: B3 with only the window’s corners changed; body, roof, window size and place are B3’s to the byte (shipped home-2’s body, 3:4 roof, the off-grid roof values are home-2’s; ink 18×18 · 14×14 · 12×12, square keyline, centred). How the radius was found: a sweep of the white corner at every master, looked at in real pixels at 1× and 2× and magnified, filled and outline. Every master stops reading square at the same proportion: past a quarter of the white side the window turns into a rounded screen and then an O — filled at 24 r2 on the 6 square (33%) reads as a screen, at 20 and 16 r1.25 on the 4 square (31%) reads round, r1.5 is an O; outline at 24 centre line r2 (pane corner 1.25 on 4), at 20 r1.5 (0.75 on 2), at 16 r1.25 (0.625 on 2) start to read as a round ring. So the white corners are 25% of their side in both styles: filled 1.5 · 1 · 1 on the 6 · 4 · 4 cut, outline 1 · 0.5 · 0.5 on the 4 · 2 · 2 pane (centre line r1.75 · 1.25 · 1.125, outer corners 2.5 · 2 · 1.75). r1.75 at 24 still passes as square but would make the 24 window rounder than 20 and 16. At 20 the outline is B6’s drawing: the set’s detail radius is already a quarter of the 2 pane there, and the quarter grid has nothing between 1.25 and a round 1.5. Precedent: stop-circle-filled cuts its square at 25 · 29 · 27% of the side, cpu and blog-3 their holes at 21–33%. Outline: window ink 7 · 5 · 4.5 square on its centre line (x 9.25–14.75 · 8.25–11.75 · 6.375–9.625), clear pane 4 · 2 · 2 on whole pixels (x 10–14 · 9–11 · 7–9, y 11–15 · 10–12 · 8–10); the 16 corner 1.125 is on the eighth grid for that. Filled: the window cut 6 · 4 · 4 square on whole pixels as B3 (x 9–15 · 8–12 · 6–10, y 10–16 · 9–13 · 7–11). Air: floor 3 · 2 · 1.5, walls 4 · 3 · 2.5, roof 3.05 · 2.6 · 2.23 (B3 2.65 · 2.4 · 2.03); tightest 1.5, the floor at 16, as B3. Filled material: floor 5 · 4 · 3, walls 6 · 5 · 4, roof 4.85 · 4.4 · 3.53. Mass, rendered: 1.18 · 0.93 · 0.86 below centre outline, 1.22 · 0.87 · 0.75 filled, B3’s within 0.01. Real pixels: the filled window’s corner pixel is 48 · 24 · 24% grey (B3 1–2%), the outline pane’s 24 · 7 · 7%, so the softening shows at every size in the filled twin and at 24 in the outline. Lint clean. Honest read at 16: filled, a house with a soft square window, the one take where the corners visibly stop being sharp at 16 and 20; outline, B3’s small square ring with its pane a touch rounder, still a window and not a dot. (recommended: it is the only take that answers ‘the holes look sharp’ at 16 and 20, where B6 renders as B3, and it stays square at every master.) 24 only (B9, 2026-10-23): the window and its filled cut-out moved down 0.5 so it leans toward the floor as it does at 20 and 16 — air to the floor 2.5 (was 3), to the roof 3.45 (was 3.05); floor-to-roof air 0.72 (20: 0.77, 16: 0.67); matches the lean of 20 and 16, its pane edges on half pixels at 24. 20 only (B10, 2026-10-23): the window grows from 5 to 5.5 of ink (pane 2 → 2.5, its white corners 0.5), the filled cut-out from 4 to 4.5 (corners r 1), both centred where they were, so the window is 39% of the house width at 20 as at 24 (39%) and 16 (38%), the pane 18% (24: 22%, 16: 17%), the filled hole 32% (24 and 16: 33%). Air to the floor 1.75 (was 2), to the roof 2.25 (was 2.6), floor : roof 0.78 (24: 0.72, 16: 0.67). The new edges sit on quarter pixels at 20 — the same trade B9 makes at 24, balance before crispness. (recommended) -->
