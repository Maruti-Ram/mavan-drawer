  <!-- Bar moved 1 right, 1 up: What the eye sees: the keyboard's lower-left corner survives whole: the first key above a long space bar, in a frame that turns the corner, and on the other side of the bar the frame's upper-right corner (with the last key at 24). Filled, the space-bar slot stays in the lower-left solid at every master, so the struck slab still reads as a keyboard at 16. OUTSIDE C21's centred bar (as cloud-off is): the bar moved 1 right and 1 up at every master, 1.41 square to the bar, the least whole step that keeps the space bar's cut in the filled twin at 16 (1 right alone leaves the filled twin no key cut at 16; 1 left and 1 down, cloud-off's move, keeps only the right-hand keys and loses the space bar at 20 and 16). The bar (C21): \ at 45°, the square keyline 18 · 14 · 12, centreline (4.75,2.75)-(21.25,19.25) · (4.75,2.75)-(17.25,15.25) · (3.625,1.625)-(14.375,12.375). Keyboard in its shipped place (C34). Ink 20×18 · 16×14 · 14×12, centred at 12,11 · 10,9 · 8,7: 1 above the canvas centre (optical 0 −1); the bar stands 4 · 2.5 · 2 above the slab and 2 · 0.5 · 0 below it. Mass from the canvas centre, outline −0.26,−0.16 · −0.35,−0.12 · −0.17,0.00, filled −0.29,−0.18 · −0.49,−0.09 · −0.55,−0.03: the keys sit low-left and level the high bar (centred A2: −0.15,+0.08 · −0.05,+0.03 · −0.03,+0.02). Cut: every stroke stops with 1.5 of air from the bar's edge, measured 1.505 · 1.505 · 1.501 at every cut end; tightest other air 1.5, the keyboard's own. Pieces (centreline length): frame upper-right 15.18 · 10.64 · 9.08 (top from x 13 · 11.5 · 9.515, the corner, right wall to y 14.75 · 11 · 8.485), frame lower-left 22.43 · 18.14 · 15.47 (bottom to x 15 · 12.5 · 10.485, the corner, left wall, the top-left corner kept to 4.59,6.84 · 3.47,5.72; at 16 its 1.26 of corner left goes and the wall ends at its top, air 2.64). At 24 the bottom-right corner's 0.25 left goes, so the right wall ends at its own end (air 1.68). Keys: 24 keeps the first and last top keys whole (ink 2) and the space bar 5.75→11.5 (ink 7.25 of 10); 20 the first top key whole and the space bar 5.75→9.25 (ink 5 of 6); 16 the first top key 4.375→4.735 (ink 1.61 of 1.75, its right end cut) and the space bar 4.375→7.485 (ink 4.36 of 5.125). Removed, inside the 1.5 zone: top keys 2 and 3 and the bottom-right key at every master. Kept keys are verbatim, so the rows keep their pitch. Filled: a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side) knocked out, corners r0.75 · 0.75 · 0.625, white 1.506 · 1.506 · 1.501 each side, the bar whole through it at 1.5 · 1.5 · 1.25; two solids. A key cut stays only where it keeps the line weight of solid to the channel (measured 1.506 · 1.506 · 1.26): 24 the first-key cut 5.75→5.87 (1.62 long) and the space cut 5.75→9.37 (5.12 of 10); 20 the space cut 5.75→7.12 (2.87 of 6); 16 the space cut 4.5→5.402 (2.40 of 5.125); the rest filled in. Filled ink box = outline's. Off-grid decimals are the cut ends, the channel's corners and the key cuts' ends, where the circles and the 1.5 put them. (recommended: the only row whose filled keyboard-off still has a key at 20 and 16) -->
