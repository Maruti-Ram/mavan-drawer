  <!-- Redraw: eye-off A1 polished: What the eye sees: the eye struck through with its iris still showing: the upper-right of the ring, 126° · 90° · 69° of it (35 · 25 · 19%), above the bar; the lid in two long pieces, the upper-right one over the top and round the right point, the lower-left one along the bottom and round the left point. At 24 and 20 the iris reads as a ring cut by the bar. At 16 in real pixels it is a two-pixel fleck parallel to the bar (100 · 64 · 100%), an echo of the bar more than a ring; at 16 the almond alone says eye, here and in the centred cut alike. Filled, the upper-right solid keeps the iris as a round white bite opening into the channel: a bitten crescent at 24, a notched C at 20 and 16, but at 16 in real pixels the only light inside the dark almond, where eye-filled shows its light ring. What it widens: C21's dated note (2026-10-23) lets the bar leave the base's centre only to save its silhouette (cloud-off's dome); centred, this cut keeps the almond as well (lid surviving 75.5 · 66.7 · 64.2% against 75.1 · 65.7 · 62.5% here), and what the move saves is the iris, the detail that names the eye, so it needs a dated C21 note: the bar may move to save the detail that names the object (as for keyboard-off's keys). The move: 1 left and 1 down at every master (1.41 square to the bar), cloud-off's step; the mirror, 1 right and 1 up, is the same picture upside down. Why: centred, the bar runs through the iris's centre and at 20 and 16 no point of the ring is far enough from it to survive the cut (its farthest point is 2.25 · 1.625 from the bar's centreline against the 3 · 2.75 a cut end needs). 1 left 1 down is the least whole step that keeps any of the ring at 16 (a piece 1.5 long needs the bar 1.30 off the iris's centre) and the most the margin allows. Polished (Maruti, 2026-10-25, "refine and polish"): every cut end sits on one grid diagonal each side of the bar, so all six, four on the lid and two on the iris, measure the same air to the bar, 1.505 · 1.505 · 1.501 (the first board's drawing had three at 1.512). The iris arc is mirrored about the bar's normal through the iris's centre, its middle 3.41 · 2.16 · 1.79 clear of the bar; it is the most of the ring the 1.5 rule leaves with the bar here. The bar (C21): \ at 45°, the square keyline 18 · 14 · 12, centreline (2.75,4.75)-(19.25,21.25) · (2.75,4.75)-(15.25,17.25) · (1.625,3.625)-(12.375,14.375), centred 1 LEFT and 1 DOWN of the eye's ink centre (12,12 · 10,10 · 8,8). Both its ends are held by the margin, the upper-left cap on the left edge (2 · 2 · 1) and the lower-right cap on the bottom one (22 · 18 · 15), so it cannot slide along itself: it stands 0 above and 2 below the eye's box at every master (shipped cloud-off: 1.5 and 3.5 · 0.5 and 2.5 · 0.5 and 2.5), and along the bar it runs 3.74 · 2.86 · 2.48 past the eye's ink at its upper end and 4.20 · 3.47 · 3.20 at its lower (cloud-off 3.53 and 4.64 · 2.33 and 3.22 · 1.97 and 3.28). The eye stays in place (C34), verbatim where uncut: lid arcs r9.6 · 7.75 · 6.968, corners r1.5 · 1.25 · 1, ring r3.5 · 2.25 · 1.625. Box 20×18 · 16×14 · 14×12, its top the eye's and its foot the bar's, 1 BELOW the canvas centre (optical 0 1; cloud-off 0.5). Outline mass from the canvas centre +0.04,−0.04 · −0.01,+0.02 · −0.03,+0.06. Pieces (24 · 20 · 16): upper-right lid 22.15 · 15.91 · 13.73, lower-left lid 16.01 · 9.35 · 6.92 (at 16 it stops just past the left point), iris arc 7.70 · 3.53 · 1.97. Removed: the lower-left side of the ring, whose farthest point is 2.09 · 0.84 · 0.21 from the bar's centreline. Iris arc to the lid 2.25 · 1.5 · 1.52, the eye's own spacing. Filled: a channel 4.5 · 4.5 · 4.25 wide knocked out, corners r0.75 · 0.75 · 0.625, white 1.506 · 1.506 · 1.501 on both sides, the bar whole through it at 1.5 · 1.5 · 1.25; eye-filled's hole (r4.25 · 3 · 2.375: the ring's outer edge at 24 and 20, 0.125 past it at 16) stays as a bite in the upper-right solid, 3.41 · 2.16 · 1.66 deep, its corners against the channel r0.75 · 0.75 · 0.625; the pupil goes (only 1.91 · 0.66 · 0.16 of it stands past the channel, under the line weight at 20 and 16, so at 24 too); on the lower-left the hole would nick the solid 0.59 deep at 24, where the outline's ring is cut, so it stays solid. Filled mass +0.09,+0.05 · +0.28,−0.05 · +0.42,−0.11. Off-grid decimals are the cut ends and the channel's and bite's corners, where the circles put them; the lid's own decimals are eye's. (recommended) -->
