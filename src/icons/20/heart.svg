  <!-- Round lobes, 45°, true point: The plain geometric heart and the one that sits inside every rule we have: two round lobes, straight flanks at 45° (home's roof angle), and both corners - the point and the notch - bent at half the weight (C10), the way message's tail tip is. Folder's agreed box (20x18 · 16x14 · 14x12), every outer edge on a whole pixel. (recommended) It is the calmest of the ten and the one the set already speaks: 45°, C10 corners, whole-pixel box; the notch is shallow (under a tenth of the height at 24) but still a clear pixel at 16, outline and filled. Ink 20x18 · 16x14 · 14x12 (filled 20x18 · 16x14 · 14x12, identical), top edge at 3 · 3 · 2, point at 21 · 17 · 14. lobe radius 5.25 · 4 · 3.25 on the line, centres 4 · 3.25 · 3.13 either side of the axis; notch bend 0.75 · 0.75 · 0.625 on the line (C10), so the outer edges meet in one clean V (96.38 · 93.65 · 72.5°, no sliver of air: the two edges are one joined corner) - notch 1.53 · 1.29 · 1.58 deep in outer-edge terms (8.49 · 9.19 · 13.2% of the height), between lobe peaks 8 · 6.5 · 6.25 apart; flanks straight at 45.54 · 44.5 · 45.22° from level (point 88.93 · 91 · 89.57°); point bend 0.75 · 0.75 · 0.625 on the line, 1.5 · 1.5 · 1.25 on the outer edge. Air: one closed outline with nothing inside it, so no two separate edges ever face each other (smallest gap: none to measure); the only narrowings are the notch V outside and the inside of the point, both joined corners. The filled area's centre sits 1.48 · 1.09 · 0.97 above the canvas centre. Radii, lobe centres and every outer edge are on the grid, so the 45° gives slightly (45.54 · 44.5 · 45.22°) - the trade C10 makes at 16 (box held, leg angle gives); the largest miss here is noted per master. Off-grid numbers are tangent points and the centres tangency fixes (the notch bend's centre); every radius, lobe top, side and point is on the quarter grid, eighth at 16. Filled: one solid on the outline's outer edge (every arc grown by half the stroke, the notch V where the grown lobes cross). -->
