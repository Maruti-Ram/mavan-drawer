  <!-- Planes side-on: Rhythm and balance: Nucleo's own picture — upright planes in a row, the front one whole on the right, the ones behind seen only by their near edge and the stubs of their top and bottom edges. Three planes at 24, two at 20 and 16, as Nucleo itself drops a plane on its 12 grid: with three, the stubs at 20 and 16 came to 0.79 · 0.53 and vanished in real pixels, leaving two bars and a trapezoid. Now the stubs are 1.59 · 1.59 · 1.6 long at every master, stopping with exactly 1.5 of air to the plane in front (measured 1.51 · 1.51 · 1.51). Pitch 4.5 · 4.5 · 4.25; each plane is the same trapezoid scaled, heights 18 / 14.63 / 11.25 · 14 / 10.63 · 12 / 8.81. One slope for every top and bottom edge, 20.56 · 20.56 · 20.56° (1 in 2.67). Front plane 9 · 9.5 · 7.75 wide, its far edge 12.38 · 8 · 7.13 tall. Ink 18×18 · 14×14 · 12×12, the square keyline, box-centred; the mass sits right of centre, toward the front plane. Corners are the round join (outer radius 0.75 · 0.75 · 0.625), as layers. Filled: the front plane goes solid (layers-filled's construction, corners 0.75 · 0.75 · 0.625), the edges behind stay at 1.5 · 1.5 · 1.25. Ink box identical. Off-grid numbers are the slope's run-outs and the stub ends. At 16 two planes read as a bracket behind a plane: the depth cue is one step. -->
