<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: pie, chart, share, proportion, breakdown, analytics, report, slice -->
  <!-- Three slices: What the eye sees: a real pie chart with three parts — a quarter, a quarter and a half, radii at 12, 3 and 6 o'clock. THE CUT: none in the outline (three radii, each touching the rim, all meeting at the centre). In the filled all three cuts measure 1.5 and each is taken out of the piece that follows it, so every piece but the first keeps a true edge somewhere and the box stays exact. The trade: three cuts is a lot of white in a ⌀14 circle. At 16 the filled gives up about a quarter of its disc to the cuts, and the quarter at the bottom right is the smallest piece in the batch. Circle as shipped: centreline r 9.25 · 7.25 · 6.375, filled disc r 10 · 8 · 7 (check-circle, clock, target). -->
  <path d="M2.75 10A7.25 7.25 0 1 0 17.25 10A7.25 7.25 0 1 0 2.75 10Z"/>
  <path d="M10 10L10 2.75"/>
  <path d="M10 10L17.25 10"/>
  <path d="M10 10L10 17.25"/>
</svg>
