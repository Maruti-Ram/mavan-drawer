  <!-- Big slash to the square, bar cut through: What the eye sees: the clipboard struck by the big slash, running from the square keyline's corner to corner, 1 past the board on each side. The bar takes the board's upper-left and lower-right corners and bites the clip's lower left. At 24 the clip loses only that corner and its left side and still reads as a clip; at 20 and 16 only its top and right side survive, hooked at both ends, so it reads as a small tab on the board rather than a ring. Bar (C21): \ at 45°, its ink the square keyline 18 · 14 · 12 (Maruti, 2026-10-25: every -off bar spans the square keyline), centreline (3.75,3.75)-(20.25,20.25) · (3.75,3.75)-(16.25,16.25) · (2.625,2.625)-(13.375,13.375), 23.33 · 17.68 · 15.2 long, centred on the clipboard's ink centre 12,12 · 10,10 · 8,8, the same bar through all four. Cut: every stroke stops with 1.5 of air from the bar's edge, measured 1.505 · 1.505 · 1.501 at every cut end; round caps. Two walls left shorter than 1.5 past a corner are removed (C33): the clip's left side, 0.26 under its upper-left corner at 24 (that end then keeps 1.68 of air), and its floor, 0.51 past its lower-right corner at 20 (1.86). The board's top-left stub, 0.26 long at 24, goes as a piece under 1.5. Kept (24 · 20 · 16): the upper-right piece, from the clip along the top and down the right wall, 13.68 · 8.89 · 7.72; the lower-left piece, bottom and left wall, 23.42 · 15.64 · 13.08 (at 24 the bottom runs 0.24 into the lower-right corner, where the 1.5 puts it); the clip 14.32 · 8.46 · 7.53 of 18.42 · 13.85 · 13.28 (78 · 61 · 57%): at 24 all of it but the lower-left corner and left side, at 20 from 70° of its upper-left corner round to the end of its lower-right corner, at 16 from 71° of the upper-left corner to 71° of the lower-right. Board kept 71 · 63 · 60%. Removed: the board's upper-left corner with the top of the left wall, its lower-right corner with the foot of the right wall, and the clip's lower-left quarter. Why no offset bar: moving the bar's line 2 down (1.41 square to it) would keep the clip whole at 24 (air 1.95) and 20 (1.49), but at 16 it still bites the corner and leaves a 0.36 mouth, which the 1.5 rule opens back into this same hook; holding the clip at 16 needs the line 2.55 down, and the keyline bar cannot move more than 1 down without standing past the margin edge (22 · 18 · 15). On -3 and -4 the clip sits 1 lower and 2 down still cuts it (air 0.89 · 0.43 · 0.05 and 1.24 · 0.79 · 0.40), so no offset moves the row together. Ink 18×20 · 14×16 · 12×14, centred, declared as an agreed box: the bar stands 1 past the board's sides at every master and sits 1 inside the clip's top and the board's bottom. Filled: a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side) knocked out of the solid board, corners r0.75 · 0.75 · 0.625 about the outline's cut ends, white 1.506 · 1.506 · 1.501 each side; two solids, the board's upper right with the clip's floor and its lower left. The clip window would keep 0.54 · 0.08 · none of material to the channel, under the line weight, so it opens into the channel where the outline's clip opens. At 20 the solid's corner under the clip's floor sits where the 1.5 puts it, 0.51 past the outline's trimmed line, as bug-off's filled wall does. The clip stays a line at the outline weight, cut as in the outline; the bar runs whole at 1.5 · 1.5 · 1.25. Off-grid decimals are the cut ends and the channel's corners, where the circles put them. (recommended) -->
