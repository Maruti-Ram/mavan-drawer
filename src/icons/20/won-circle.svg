  <!-- Middle peak lowered at 20 and 16: A's coin with the W's middle peak lowered at 20 and 16 only, as bare won's round-2 drafts tried: down 1.25 · 1.125, a quarter of the cap height (0.25 · 0.26). The middle point stands 1.5 · 1.375 above the bar's centreline, so it still reads as a third, shorter tip. 24 is A's: 9.5×8.5, clean, peak at the cap. Lowering the peak opens both upper notches all the way down to the bar, and nothing is trapped. In the filled cut, the white under the peak starts 0.77 · 1.11 below the bar's top edge, and the valleys close 0.85 · 1.02 above its bottom edge, both inside the bar. Inner legs at 25.0 · 25.6° (outer 16.7 · 17.9°). W 8×6.5 · 7×5.5. Bar 0.5 · 0.375 below centre, as the shipped bar sits low, standing 1.25 · 1.125 past the corners. Air to the ring: corners 1.65 · 1.55, bar ends 1.22 · 1.11. Tip air 1.07 · 1.02, so the outline carries gap 1.05 at 20 and 1 at 16, as A does. Filled: disc r 10 · 8 · 7, the ₩ knocked out 1.5 wide as one hole; knockout white 50.5 · 34.1 · 29.0. At 16 the two upper notches print as open dark wedges above the bar: the clearest ₩ here, outline and filled, though still denser than ₦. (recommended) -->
