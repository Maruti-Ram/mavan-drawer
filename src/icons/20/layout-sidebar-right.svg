  <!-- tags: sidebar, page, panel right, navigation, layout -->
  <!-- Third, wall to wall: The shipped `layout-sidebar` reflected about the canvas centre and nothing else: every x becomes W − x and every arc flips its sweep flag. The frame is symmetric, so it maps onto itself to the last decimal — checked in the build, not assumed — and the only thing that moves is the divider, from x 9.75 · 8.5 · 6.625 to 14.25 · 11.5 · 9.375. The counters swap sides and keep their sizes: sidebar 4.5 · 3.25 · 2.75, page 9 · 6.25 · 5.5. At 16 the divider still sits on the eighth grid (9.375), so its right edge lands on whole pixel 10. Filled: `layout-sidebar-filled` reflected, so the page and the band stay two shapes with the 1.5 cut between them. (recommended) -->
  <path d="M14.25 3.75H5.75A2 2 0 0 0 3.75 5.75V14.25A2 2 0 0 0 5.75 16.25H14.25A2 2 0 0 0 16.25 14.25V5.75A2 2 0 0 0 14.25 3.75Z"/>
  <path d="M11.5 3.75V16.25"/>
