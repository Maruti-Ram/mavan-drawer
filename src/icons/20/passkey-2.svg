  <!-- tags: fingerprint, key, biometric, passwordless, sign in -->
  <!-- box: 15.66x16 -->
  <!-- Key standing in the corner: Key: our key family drawn as a badge, the same key in P1 and P2 — bow ring ⌀6 · 5 · 4.75 outer (air inside 3 · 2 · 2.25), one tooth to the right 2.25 · 1.75 · 1.75 long (it ends level with the bow's side), 2 · 1.75 · 1.75 short of the tip as key-6 and passkey set theirs, 1.5 of air to the bow. Key ink 6×11 · 5×9.75 · 4.75×9.25. One tooth, not two: a second at the family pitch would make the key 3 · 3 · 2.75 taller (14 · 12.75 · 12 — most of the print's height, passkey's column rather than a badge), so the repeat is dropped at every master. The key stands a quarter in from the right margin at 24 and 20 so its shank and tooth centrelines sit on .25/.75 (one edge on a whole pixel); at 16 it touches the margin corner (15, 15). Here it stands on its bow in the corner (bow on the bottom edge, shank up, tooth near the top). Cut back by hand with 1.5 of air from the key's ink (C33; tightest air key to print 1.5 at every master). Off-grid numbers are fingerprint A's own arc points and the cut ends, which fall where the 1.5 of air meets each arc. The inner arch loses its right leg (61 · 57 · 56% of the ridge kept; ends just past its shoulder at 24, 50° past the top at 16; a 0.68 loose foot at 24 removed as a stub) and the outer arch its right leg (62 · 60 · 52% kept); core and outer-left ridge whole. Box 19.29×20 · 15.66×16 · 13.94×13.97, centre 12.11,12 · 9.92,10 · 8.03,8.02. At 16 the tooth sits at 8.125 and straddles two pixel rows (the 1.5 to the bow wins over crispness). Filled: fingerprint-filled's bold print verbatim — every ridge 2.5 · 2 · 2, three ridges at every master — cut back where the outline cuts it: the inner arch and the outer arch lose their right legs, core and outer-left ridge whole. Inner arch loses 12.08 · 10.39 · 9.43 (outline 12.62 · 10.55 · 9.48) and keeps 60 · 56 · 54%; outer arch loses 9.56 · 7.51 · 8.30 (outline 9.80 · 7.67 · 8.04) and keeps 60 · 58 · 47%; nothing is left past a cut, so no stub is removed. The key is a C33 line badge and keeps the outline weight, 1.5 · 1.5 · 1.25 (badge: 'line', drawn in filled.badge; 2026-10-19): the outline's key verbatim — bow ring with its hole (air inside 3 · 2 · 2.25), shank, one tooth 1.5 clear of the bow — not pulled in, so the ink box is the outline's at every master. Air from the key's ink to the print, each path at its own weight: tightest 1.53 · 1.50 · 1.51 (outer arch to the shank's top); inner arch 1.66 · 1.62 · 1.73 to the shank (1.50 when the key was drawn bold). The cuts were made against the bold key, and the thin key has the same top and the same bow edge, so they stay as they are: the outer arch still needs its cut, and the inner arch keeps its own with 0.16 · 0.12 · 0.23 to spare. Air between ridges is fingerprint-filled's own: 1.49–1.5 at 24 (its 2-dp rounding at the core's foot, read as 1.5 by lint), 1.437 at 20, 0.875 at 16, declared as gap 1.43 and 0.87 at 20 and 16, the notes fingerprint-filled carries; the note governs the print only, never the key. Seen in real pixels at 20 and 16: the key reads as a key — ring with a clear centre pixel, thin shank and tooth — beside the bold print, as passkey-filled's key does; drawn bold with a solid bow (the previous filled) it read as a thermometer. -->
