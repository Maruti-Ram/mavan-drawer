<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: tab, snap, flush -->
  <!-- Snap tab: The classic tab with a snap - at 24 only. 24: a flush D tab 9 tall (ink 7.5 to 16.5, 2 clear of each wall), its round end r3.75 centred on a dot 3 across, 1.5 of air all round the dot and 1.5 from the dot to the wall. At 20 and 16 the dot cannot fit: tab + dot need 8.5 · 7 of height and the body gives 9 · 7.5, 0.25 a side, so the dot goes and the tab is B's. Filled 24: the D knocked out with the dot left standing in it as a 3-across island; 20 and 16 as B -->
