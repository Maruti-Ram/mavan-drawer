  <!-- Link badge: Rhythm: two rings r 1.5 · 1.5 · 1.375 joined by one link on the anti-diagonal, a C33 badge standing to the margin edge (22 · 18 · 15); centres 7.07 · 6.01 · 5.66 apart, link ink 2.57 · 1.51 · 1.66. Air gear-to-badge 1.5 · 1.51 · 1.51. At 24 the hub ring stays whole and only the lower-right teeth are cut; at 20 and 16 the inner ring comes near the hub, which is cut back to a C (9.5 · 7.7 long) - the rhythm changes there and that is its cost. Ink box 19.31×20 · 15.47×16 · 13.56×14, centre 12.35,12 · 10.27,10 · 8.22,8 (0.35 · 0.27 · 0.22 toward the badge, as calendar-repeat's 0.5). Who uses it: the 'linked' badge of git and workflow rings, as settings-link composites in Tabler-style sets; the lightest touch on the gear at 24. C33 stubs: walls left past a corner at a cut end, shorter than 1.5, are removed - 0.45 at 24, 0.70 at 20, 0.19 and 0.94 at 16; the filled twin takes off the matching tooth corner at 24 (0.92) with a straight cut. The gear is the shipped gear verbatim, in place (C33): it cannot be drawn smaller, since six hollow teeth with 1.5 of air inside the tooth and across the valley need about 14 at a 1.5 stroke and 12.7 at 1.25, so the nodes come into its canvas and the gear is cut back by hand with 1.5 of air from their ink instead of shrinking. Off-grid numbers are the gear's own rotated points, the cut ends (where the gear's centreline reaches 1.5 of air) and the link ends on the ring centrelines; ring centres and radii are on the grid. Filled: gear-filled cut back 1.5 round each node disc and link, nodes solid discs, links stay lines at 1.5 · 1.5 · 1.25. -->
