<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: stand, large -->
  <!-- Card screen: Ink 20x20 · 16x16 · 14x14 (circle keyline), box-centred both ways. Screen 20x16 · 16x12 · 14x10 of ink (1.25 · 1.33 · 1.40 : 1), container radius 2.5 · 2 · 1.5. Neck on the centre line, 2.5 · 2.5 · 2.75 of it showing between the screen and the foot (floor 1.5); foot 9 · 7 · 6 of ink (45% · 44% · 43% of the screen). 16 master at stroke 1.25: centrelines on the eighth grid so the screen's outer edges and the foot's bottom are whole pixels; the neck at x 8, as briefcase's clasp, which on a 1.25 line covers two pixel columns at 62% (the same softness the clasp has); foot ends at x 5.625 / 10.375 (calendar's pegs) so its ink runs 5 to 11. Filled: screen solid, outer edge on the outline's (radius 3.25 · 2.75 · 2.125); neck and foot stay lines at 1.5 · 1.5 · 1.25. The screen is exactly the credit-card and mail rectangle (landscape keyline) and the stand hangs below it, so the whole icon fills the circle keyline. The strongest family tie to card and mail, and the biggest footprint in the set: it will read larger than its neighbours. -->
  <path d="M4.75 2.75H15.25A2 2 0 0 1 17.25 4.75V11.25A2 2 0 0 1 15.25 13.25H4.75A2 2 0 0 1 2.75 11.25V4.75A2 2 0 0 1 4.75 2.75Z"/>
  <path d="M10 13.25V17.25"/>
  <path d="M7.25 17.25H12.75"/>
</svg>
