  <!-- Straight ruler, 45°: Rhythm: ticks hang from the upper-right wall at one even pitch, 3.18 · 3.18 · 2.83 apart along the ruler (24 · 20 · 16), so the air between ticks is 1.68 · 1.68 · 1.58 and the end ticks keep 1.5 · 2.06 · 1.63 from the end walls. Long and short alternate L S L S L at 24 and L S L at 20 (two ticks dropped, not squeezed); at 16 the three ticks are equal, 2.12 each, because a 1.41 short tick there was one grey pixel in outline and a round hole in filled. Long ticks 2.83 · 2.47 · 2.12, short 1.41 · 1.41, the long ones leaving 2.04 · 1.68 · 1.58 of air to the far wall. Body 18.73×6.36 · 13.49×5.66 · 11.42×4.95 on the centreline (2.9 · 2.4 · 2.3 : 1), corners r1.5 · 1.25 · 1 (the pencil head's radius). Square keyline 18 · 14 · 12, the pencil's; box-centred, mass +0.16,−0.16 · +0.10,−0.10 · +0.10,−0.10 off centre, ink 14.2 · 14.6 · 16.8% of the canvas (pencil 12.4% at 24, 15.0% at 16). Filled: the body solid, each tick a white slot 1.5 wide from the wall's inner edge to where the outline's tick ends (a short tick under 1.5 long becomes a round hole), 1.5 · 1.5 · 1.25 of wall kept, 1.68 · 1.68 · 1.33 of material between slots. Values on the 45° axis are off the quarter and eighth grid, rounded to 2 · 2 · 3 dp. Who: Lucide ruler and Nucleo ruler (in the refs), Phosphor ruler, Fluent Ruler, Font Awesome ruler, Carbon ruler—alt (from memory). Honest read at 16: a ruler at once, the same size and angle as pencil, so the two sit together in a toolbar; at 16 the three equal ticks read as a scale. (recommended) -->
