  <!-- Underline at 24, dropped at 20 and 16: Ring: euro-circle’s, verbatim (r 9.25 · 7.25 · 6.375). The sign is dong’s own build at coin size — a round bowl closed on the stem, the stem running down to the bowl’s foot with a round cap, a bar across the ascender that reaches further left than right (left arm 1.83 · 1.8 · 1.75× the right, ending 1.5 · 1.25 · 0.75 past the bowl’s centre), the stem standing 1 · 0.75 · 0.5 above the bar (at 16 a 0.75 rise would need a 1.5 bowl, whose disc counter reads 1.47 in the filled twin). Every gap inside the sign is 3 centre to centre (outline air 1.5 · 1.5 · 1.75; in the filled twin 1.5 of white per cut and 1.5 of disc left between bar and bowl and between bowl and underline). 24: bowl r 2 with a 0.5 straight (outer 5.5×6), the bowl on the ring’s centre across and 0.5 below it, because the ascender stands 1 taller than the underline hangs; the ₫ 7×13 with its underline as wide as the d (as dong). Air to the ring equal at the four corners — stem top and both underline ends 1.66 — and 1.85 at the bar’s right end; the bowl’s own air is 5. 20 and 16 drop the underline (it cannot fit: 0.6 from the ring at 20 at best) and the đ is placed by its air, since a centred bowl would put the ascender into the ring: bowl r 1.75 with a 0.5 straight · r 1.625, centred 1 · 1 left and 1.75 · 1.625 below the ring’s centre, the đ 6.25×9.25 · 5.5×8 (the € 7.27×8 · 6.56×7.5, the $ 8×9 · 7.65×8), air 1.68–2.17 · 1.57–1.92. 16’s upright centrelines on x.375/x.625 (the bar at y 5, as euro-circle’s at y 8). Filled: the disc (r 10 · 8 · 7, the ring’s outer edge) with the sign cut out as one hole of the disc’s own path — the cut is the stroke 1.5 wide at every master (wider than the 1.25 line at 16) — the counter left standing as an island of disc 2.5×3 · 2×2.5 · 1.75×1.75, the underline a second hole. Its off-grid values are where two edges meet: the stem’s foot and the bowl, the stem and the bowl’s top, and at 16 the stem’s cap and the bar. Reads as ₫ at 24; at 20 and 16 it reads as đ, as the bare dong does at 16. (recommended) -->
