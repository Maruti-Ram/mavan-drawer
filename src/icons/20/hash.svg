<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- keyline: mark -->
  <!-- tags: number, channel, hashtag, pound, upright, square cell -->
  <!-- Upright, plus box: Upright # on plus's own box (15 · 13.5 · 12), bars a little inside the thirds so each arm runs past the crossing by about three quarters of the cell. At 16 the bar pairs sit on x/y 5.625 and 10.375, so their outer edges land on whole pixels (5 and 11) and each bar renders as one solid pixel with a quarter-pixel of grey on its inner side. Ink 15×15 · 13.5×13.5 · 12×12 (24 · 20 · 16), box-centred, filled identical. Air between the parallel bars 4.5 · 4 · 3.5 (filled 3.5 · 3.5 · 2.75; floor 1.5). Filled: the same four lines at 2.5 · 2 · 2, ends pulled in 0.5 · 0.25 · 0.375 so the ink box matches. Round caps, no joins (four separate lines, as plus). (recommended) the only answer that stays on 0/90 with no exception, it swaps with plus and x in a toolbar at the same size, and at 16 its four bars are the crispest of the ten; the cost is that it can lean towards a tic-tac-toe grid, which is what F answers. -->
  <path d="M7.25 4L7.25 16"/>
  <path d="M12.75 4L12.75 16"/>
  <path d="M4 7.25H16"/>
  <path d="M4 12.75H16"/>
</svg>
