<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: replace, swap, exchange, two tiles, hooks -->
  <!-- Two tiles, two hooks: Two tiles on the diagonal, each hook carrying one into the other's place — Tabler replace and Polaris Replace. Rhythm and balance: the whole drawing turns 180° onto itself about the canvas centre, so it is centred in both axes by construction, and every air is the same at its master: head tip to tile 1.75 · 1.75 · 1.75, hook tail to tile 1.87 · 1.82 · 1.82 (the tail stands over the tile's round corner). Tiles are grid's tiles verbatim (6 · 4 · 3.5 on the centreline, ink 7.5 · 5.5 · 4.75, radius 1 · 0.75 · 0.75); hooks are translate's (bend 2.5 · 1.5 · 1.25, head legs 2.5 · 2 · 1.5 either side of the rail, tip arc 0.75 · 0.75 · 0.625) and run along each tile's middle (rail 6.75 · 5.75 · 4.375), so each arrow points square at the middle of its tile. Box 18 · 14 · 12, the square keyline. Filled: the two tiles fill (grid-filled's 1.75 · 1.5 · 1.375 corners), hooks stay at the outline weight. At 16 the tiles are 4.75 px, the same as grid at 16. (recommended) — the most widely shared picture for replace (Tabler, Polaris, Canva's replace), it reads at 16 without any letter or dash detail, and it sits beside translate as its tile twin: same hooks, same diagonal. -->
