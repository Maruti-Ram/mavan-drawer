  <!-- Classic: The plain upright plug, and the one that borrows most from the set: its body is microphone's cradle closed with a flat top (sides 4.75–19.25 · 4.75–15.25 · 3.625–12.375, bottom arc radius 7.25 · 5.25 · 4.375, microphone's own), and its cord is microphone's stem (17.75–21.25 · 13.75–17.25 · 11.375–14.375), so the two sit as relatives. Top corners radius 1.5 · 1.25 · 1 (filled outer 2.25 · 2 · 1.625). Two prongs 6 · 5 · 3.75 apart on centres, air between them 4.5 · 3.5 · 2.5, standing 5 · 4 · 3.5 above the body's top edge. Cord shows 3.5 · 3.5 · 3 below the body. Ink 16x20 · 12x16 · 10x14 (portrait keyline), centred. Filled: the body solid, prongs and cord stay at the outline weight (1.5 · 1.5 · 1.25). (recommended) It reads as a plug at 16 in both styles with the most air of the ten, and it adds no new radius or length to the set -->
