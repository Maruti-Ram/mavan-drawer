  <!-- Folder box, seam and clasp: Ink 20x18 · 16x14 · 14x12; body 20x15 · 16x11 · 14x9.25 of ink (1.33 · 1.45 · 1.51 : 1), container radius 2.5 · 2 · 1.5 as folder and calendar. Handle 7.5 · 5.5 · 4.75 wide on the centreline (41% · 38% · 37% of the body), rising 3 · 3 · 2.75 above the lid line (1.5 · 1.5 · 1.5 of air under its top line), corners r1.5 · 1.25 · 1. Seam 44% · 45% · 41% down the body, edge to edge; clear above 4.5 · 2.75 · 2, below 4 · 2 · 2 (floor 1.5). Clasp stub 2 · 1.75 · 1.5 below the seam. 16 master at stroke 1.25: outer centrelines on the eighth grid so the container's outer edges are whole pixels; the seam at y 8.625 so its top edge is a whole pixel, as calendar's line; the clasp at x 8, as trash's rib. Filled: body solid, split by a 1.5 cut on the seam (at 16 the cut shares the line's top edge, as calendar), cut corners eased 0.5 at the walls; the clasp becomes a 1.5 slot joined to the cut, round-ended, its mouth eased 0.25; the handle stays a line at 1.5 · 1.5 · 1.25. The seam plus a short clasp is what says briefcase rather than bag or toolbox; box and handle are borrowed whole from folder and trash, so nothing new enters the set (recommended). -->
