  <!-- Letter width, cut letter: A's outline exactly; the filled twin is a CUT LETTER instead of the wire thickened — the outer edge is the outline's own silhouette, the stem is heavier than the arms, and the counters are true D-slots. Every bowl is a true circle — radius exactly half the bowl's height: upper/lower 4/4.25 · 3/3.25 · 2.5/2.875 at 24 · 20 · 16, D-slot 1.00 on every bowl at every master. Waist 48.6 · 48.2 · 46.9% of the ink height (Polaris 46.1%). Outline counters — the air inside each bowl — 7.5×6.5 · 5.75×4.5 · 4.38×3.75 and 9×7 · 7×5 · 5.5×4.5, width-to-height 1.15 · 1.28 · 1.17 over 1.29 · 1.40 · 1.22 (Polaris 1.33 and 1.67; round 2's pinched slots ran 1.90–2.08). Cut-letter counters 4.25×4.5 (0.94) · 3.5×3.25 (1.08) · 2.625×2.75 (0.95) and 5.75×5 (1.15) · 4.75×3.75 (1.27) · 3.75×3.5 (1.07), stem 3.25 · 2.75 · 2.25 against arms 3 · 2.5 · 2 and a waist of 2.5 · 2 · 1.75, the bowl one thickness (3 · 2.5 · 2) the whole way round. Upper reach 0.875 · 0.875 · 0.859 of the lower (Polaris 0.90, Lucide 0.92); the notch between the bowls comes 3.16 · 2.3 · 2.04 in from the widest edge. Ink 12×18 · 10×14 · 8×12 in both styles, centred, no growth note. The cost: the cut letter's counters are the tightest white on the board - 2.625x2.75 at 16 - so it is the first to clog if the icon is ever set smaller. -->
