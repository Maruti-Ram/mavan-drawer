arms. Nothing gives at 16: the 6.375 / 9.625 centrelines leave room for the medium cut. The disc between the cut's ends and its edge is 3.97 · 3.5 · 3.04. The white corners are the round ends only, radius 1 · 0.88 · 0.875 (floor 0.75 · 0.5 · 0.375); the crossings turn toward the disc. Ink box = the disc. Costs: the darkest mark in the family. At 16 the arms are 1 past the bar against a 2 square, so magnified it looks squarer than at 20, though in real pixels it is the classic 1 · 1 · 2 · 1 · 1 pixel #. (recommended): it swaps with plus-circle at the same size, the scale the V4 spec settles, and it keeps hash's proportion at 24 and 20. -->
