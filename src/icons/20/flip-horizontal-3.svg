  <!-- Square, dashed centreline: A square cut by a dashed mirror line: Lucide flip-horizontal (now square-centerline-dashed-horizontal). Rhythm: the axis is three even dashes, one on the centre, flush with the frame's edges: dash 3 · 2 · 1.75 on the centreline (ink 4.5 · 3.5 · 3), air 2.25 · 1.75 · 1.5, ink to air 2:1 at every master and C35's own 2.25 of air at 24. Both halves stop 1.5 short of the axis; frame on the square keyline, radius 2.5 · 2 · 1.5. Ink 18×18 · 14×14 · 12×12, centred. Not C35's dash: three of them need 21 of length at 24 and 15.64 at 20, past the 18 · 14 keyline, and two leave a broken line. Filled: each half solid on the outline's outer edge, 6.75 · 4.75 · 3.875 wide, white to the dashes 1.5; the dashes stay lines at the outline weight. Filled, it reads close to a two-column layout (columns-2) with a dashed divider. -->
