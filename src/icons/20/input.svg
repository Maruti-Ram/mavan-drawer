<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: text field, input, text cursor, i-beam, text box, type -->
  <!-- Field with a text cursor: A text field with the I-beam cursor through it (Polaris Forms, Tabler forms, Lucide text-cursor-input, Phosphor Textbox). Square 18x18 · 14x14 · 12x12. The field is half the box tall at every master: 18x9 · 14x7 · 12x6 of ink, container corners 2.5 · 2 · 1.5. The I-beam runs the full height with crossbars 7.5 · 7.5 · 6.75 of ink; the stem sits 40 · 41 · 41% across (x 10.25 · 8.75 · 6.875). The field's top and bottom lines stop 1.5 either side of the stem, and the stub ends sit right under the crossbar ends (Lucide's construction), so at 20 and 16 the left part is the corner arc alone, a bracket; at 24 it keeps 1 of straight to hold the stem at 40%. Air: stem to field 1.5 · 1.5 · 1.5, crossbar to field 3 · 2 · 1.75; margins 3 · 3 · 2. Tightest air at 16: 1.5, stem to field, outline and filled. One picture at every master, nothing dropped. Filled: the field fills as two solid pieces cut back 1.5 from the stem (a 4.5 · 4.5 · 4.25 white channel with the stem in it, cut corners 0.5), the I-beam stays 1.5 · 1.5 · 1.25; box identical. At 16 nothing in the set has an I-beam: text's serif T has a bar on top only and a foot, not a beam through a box; id-card and checkbox are closed frames. Box-centred; the stem pulls the mass left, as in every reference. Risk: it says text field before it says form, so a later input or text-field icon would want this same drawing (recommended: the one picture that reads the same at 24, 20 and 16, nothing near it in the set, and Shopify's own Forms icon) -->
  <path d="M5.75 7.25A2 2 0 0 0 3.75 9.25V10.75A2 2 0 0 0 5.75 12.75"/>
  <path d="M11.75 7.25H14.25A2 2 0 0 1 16.25 9.25V10.75A2 2 0 0 1 14.25 12.75H11.75"/>
  <path d="M5.75 3.75H11.75"/>
  <path d="M8.75 3.75V16.25"/>
  <path d="M5.75 16.25H11.75"/>
</svg>
