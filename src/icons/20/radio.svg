  <!-- Portable radio: Rhythm: ring speaker and two knobs share one height — the knobs' top and bottom sit flush with the ring's ink at every master; ring-to-wall air 1.5 on three sides at 24 · 20 · 16; knob pitch 5 · 3.5 · 3 (air 2 · 1.5 · 1.5); ring to knob 2 · 2 · 1.5, knob to right wall 2.5 · 2 · 2.5 (knobs sit on whole-pixel centres, which cost the even split at 16). Body 20×14 · 16×11.5 · 14×10, corner r2.5 · 2 · 1.5 (the container radius); ring ⌀8 · 5.5 · 4.5, hole 5 · 2.5 · 2 (camera's ⌀8 lens at 24); knobs ⌀3 · 2 · 1.5 (live's dot at 24, calculator's dots at 20 and 16). Strap from the top-left corner's end at slope 2:5 (21.8°) at every master, tip ink at y 3 · 3 · 2; the narrow wedge it makes with the top edge is the construction SF Symbols, Material, Tabler and Central all use. Ink 20×18 · 16×14 · 14×12, camera's agreed box. Filled: body solid, ring a 1.5 white band round a solid core ⌀5 · 2.5 · 1.5, knobs white dots, strap stays 1.5 · 1.5 · 1.25; material between the knob holes 2 · 1.5 · 1.5. Who: SF radio, Material radio, Tabler radio, Central radio. (recommended) — the only picture that says "a radio set" without leaning on waves, and at 16 the strap and ring read before anything else; it sits with camera at the same box. -->
