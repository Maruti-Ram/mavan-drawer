  <!-- Bar cut through: What the eye sees: the short round pin with 45° sides struck in two by the bar: the crown from about 11 o'clock to the right shoulder, and the left side running down into the right-angled tip and a short way up the right. No ring. Filled: a half-disc crown and a squarer lower piece than A1's. The bar (C21, second ruling 2026-10-25): \ at 45°, its ink the square keyline 18 · 14 · 12, centred on the pin's ink centre 12,12.345 · 10,9.93 · 8,7.775, snapped to the nearest grid point 12,12.25 · 10,10 · 8,7.75: centreline (3.75,4)-(20.25,20.5) · (3.75,3.75)-(16.25,16.25) · (2.625,2.375)-(13.375,13.125). It stands 1 past each side of the pin; at 20 it reaches 0.14 below the tip and at 16 0.25 above the crown and 0.2 below the tip. The pin stays in place (C34); the composite is 18×18.69 at 24 (declared as a box) and the square keyline 14×14 · 12×12 at 20 and 16, outline and filled. With the full keyline bar the cut is identical to the morning's pin-wide bar: every piece and both filled solids are unchanged, only the bar is longer. Pieces (24 · 20 · 16): lower piece 17.56 · 10.57 · 8.36, crown 18.47 · 11.73 · 9.08; the outline keeps 75 · 64 · 60% of its length. The ring inside the head is dropped at every master. The cut rule alone would keep an arc of it at 24 only (99° / 5.60 long); at 20 and 16 it falls wholly inside the cut (its farthest centreline point 2.96 · 1.91 from the bar's centreline against 3 · 2.75). It is dropped so every master shows the same pieces (bug-off's precedent) and because the kept arc, concentric inside the head's own arc, reads as a wifi or hearing sign, not a hole (drawn and looked at). The filled hole goes with it. Mass from the canvas centre, outline +0.11,−0.07 · +0.14,−0.29 · +0.12,−0.42 (map-pin-4 0,−0.51 · 0,−0.65 · 0,−0.69); filled +0.24,−0.36 · +0.27,−0.51 · +0.24,−0.59. Cut as cloud-off and bug-off: every stroke stops 1.5 clear of the bar's edge (air at the cut ends measured 1.505–1.512 · 1.505–1.512 · 1.501–1.502); pieces under 1.5 go; filled, a channel 4.5 · 4.5 · 4.25 wide is knocked out of the solid (corners r0.75 · 0.75 · 0.625 on the outline's cut-end centres), its white 1.506 · 1.506 · 1.501 each side, and the bar runs whole through it at 1.5 · 1.5 · 1.25. Off-grid decimals are the cut ends and the channel corners, where the circles put them; a cut arc that passes its circle's top or side is pinned there (one extra node on the grid) so the ink box stays exactly the base's. (recommended) -->
