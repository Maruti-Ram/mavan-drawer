  <!-- Two bars at every master: The shipped ¥ scaled into euro-circle’s ring (r 9.25 · 7.25 · 6.375) with both bars kept: straight arms meeting at a point, the top bar on the fork, the second 3 below. Ink 8×11 · 6×8.75 · 5.25×7.875 (€ coin 9.41×11 · 7.27×8 · 6.56×7.5; $ coin 8.25×11 · 8×9 · 7.65×8). Arms 37.4 · 39.3 · 40.1° off vertical (bare ¥ 37.2 · 39 · 39.2). Bars as wide as the arms’ span (half 3.25 · 2.25 · 2), so tips and bar ends line up. Bars 3 apart at every master: that is the least that leaves 1.5 of disc between their cuts in the filled twin (outline air 1.5 · 1.5 · 1.75). At 16 both bars’ lower edges sit on whole pixels (8 and 11), as on the bare ¥. Placed like the reference coins, fork on the ring’s centre at 24 (0.5 · 0.625 above it at 20 · 16), ink box 0.5 low. Air to the ring is balanced between the arm tips and the foot: 2.4 / 2.5 · 1.8 / 1.75 · 1.52 / 1.5 (€ 2.77–2.89 · 2.25–2.34 · 1.88–1.94; $ 2.94 · 1.61 · 1.28). The tips are points, so they can come closer than the €’s bowl. What the coin costs: the V is short and the foot stands only 2.25 · 1.5 · 1.25 below the lower bar. The inside corner between the top bar and each arm keeps 1.08 · 0.24 · 0.28 of air at the bar end, measured square to the arm; at 20 and 16 it closes to a shoulder, as in the shipped yen-filled at 16. Filled: the disc with the ¥ cut out 1.5 wide as one hole of the disc’s own path (round ends, sharp inside corners). That leaves 1.5 of disc between the bar cuts at every master and 3.9 · 3.3 · 2.6 of disc outside the tips; the shoulders go white at 20 and 16 (0.24 and 0.03 of disc left in the corner). No gap notes. Reads as ¥ at 16 in both styles: a small fork over two clear bars. (recommended) -->
