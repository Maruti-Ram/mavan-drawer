<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: signature, sign, handwriting, baseline -->
  <!-- Signature: Signature — Lucide's, Material's and SF's signature: a scrawl with one loop over a baseline. Rhythm and balance: the scrawl is straight runs joined by arcs — lead-in, a loop of radius 3 · 2.25 · 2, a down-run to one bottom turn of 1.5 · 1.25 · 1.25, a rising tail — spanning the full width; exactly 1.5 of air between the scrawl and the baseline at every master. Reworked after review (2026-10-22) to balance the mass: the loop moves right (0.4 of the width, was 0.3), the tail rises higher (to 0.4 of the scrawl height, was 0.55), and the baseline is inset 2 · 1.5 · 1.25 a side, 12.5 · 9.5 · 8.25 long on y 20.25 · 16.25 · 13.375 (underline's and pencil-4's line height) — the ink mass moves from 1.08 left, 1.36 low to 0.26 left, 0.72 low at 24 (0.2 left, 0.32 low at 20; 0.17, 0.23 at 16); what is left low is the bar itself. Loop air 4.5 · 3 · 2.75; the loop crosses its lead-in at 86° · 87° · 82°. Ink 18×18 · 14×14 · 12×12. The scrawl is drawn as two paths meeting tangent at the loop top, for the same reason as A. Filled at FILLED_WEIGHT: baseline 2.5 · 2 · 2 with its ends pulled in (6.25–17.75 · 5.5–14.5 · 4.25–11.75), the scrawl's ends pulled in the same way and the scrawl squatter so it keeps 1.5 above the heavier bar (crossing 79° · 76° · 57°, loop air 3.5 · 2.5 · 2). Tightest at 16: the filled scrawl has 8.5 of height above the bar (9.25 in the outline), the loop filling most of it. Best kept for a later signature icon; as scribble it says "sign here" -->
  <path d="M3.75 11.89L9.97 7.9A2.25 2.25 0 0 0 10.96 5.57A2.25 2.25 0 0 0 9.17 3.79"/>
  <path d="M9.17 3.79A2.25 2.25 0 0 0 6.85 4.8A2.25 2.25 0 0 0 6.93 7.33L10.87 12.74A1.25 1.25 0 0 0 12.95 12.64L16.25 7.07"/>
  <path d="M5.25 16.25H14.75"/>
</svg>
