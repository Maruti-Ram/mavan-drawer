  <!-- Three charge cells: Rhythm: three bars on one even pitch, 4.25 · 3.25 · 2.875, with the same air between bars as from the end bars to the walls, 2.75 · 1.75 · 1.625, all four gaps equal at every master. The bars are line-wide (1.5 · 1.5 · 1.25) and 5 · 3 · 2.5 of ink tall, with 2 · 1.5 · 1.5 of air above and below. Body and nub are battery's, unchanged; ships as battery-2 (the full member), with -medium and -low below (C28). Body 18.5×12 · 14.5×9 · 12.75×8, container radius 2.5 · 2 · 1.5 on the line (keyboard's and credit-card's; filled outer 3.25 · 2.75 · 2.125). Nub solid and joined to the wall, one line past it (1.5 · 1.5 · 1.25) and half the body's height (6 · 4.5 · 4), centred on the body; it is drawn as a closed bar on the wall's centreline so no white is left inside it. Off-grid values 20.49 · 16.45 · 13.746 in the filled files are where the corner arc meets the nub's edge (computed). Ink 20×12 · 16×9 · 14×8, box-centred, so the body sits 0.75 · 0.75 · 0.625 left of the canvas centre. Inside white 15.5×9 · 11.5×6 · 10.25×5.5. Filled: the body solid, the bars cut as white slots 1.5 wide at every master (at 16 wider than the 1.25 line, C22) at the outline bars' length, leaving 2.75 · 1.75 · 1.375 of material between slots (floor 1.25 at 16). Lint clean. Who: Lucide battery-full, Central battery-full, Untitled battery-full, Tabler battery-1…4, Phosphor BatteryHigh, Nucleo battery-high. At 16 at real size the three bars run together into one grey band; the outline still reads as a battery. -->
