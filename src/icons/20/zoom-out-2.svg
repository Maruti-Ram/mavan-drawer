<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: lens, taper, magnify, zoom, shrink, reduce, minus -->
  <!-- Big lens, ring kept, thin mark: zoom-out-2: shipped zoom-out's styling on search-2's lens and handle, both verbatim. The minus is zoom-in-2's horizontal arm verbatim. Bar centred on the lens centre 11.5 · 9.5 · 7.75. Outline: 9 · 6.5 · 5.5 across (arm ends 3.75 · 2.5 · 2.125), air to the rim 2.5 · 1.75 · 1.75. It is zoom-out's minus scaled to the bigger lens: 0.529 · 0.5 · 0.478 of the lens's outer width against zoom-out's 0.516 · 0.5 · 0.476 (zoom-out: 8 · 6 · 5 on a 15.5 · 12 · 10.5 lens, here 17 · 13 · 11.5); at 16 5.5 is taken over 5.25 because it holds zoom-in's share (0.478 against 0.476). Filled: search-2-filled verbatim — ring 2.5 · 2 · 2 (counter 12 · 9 · 7.5) and the C20 taper grip, as filled areas — with the minus at the outline weight 1.5 · 1.5 · 1.25 (lines stay at the outline weight in a shape-filled file), shortened only as far as 1.5 of air to the heavier ring needs: 9 · 6 · 4.5 across (arm ends 3.75 · 2.25 · 1.625), air 1.5 · 1.5 · 1.5; it loses 0 · 0.5 · 1 between styles where zoom-out loses 0.5 · 1 · 1.5, because the bigger counter has room. Margins 3 · 3 · 2 on all four sides, as search-2. Tightest air at 16: 1.5, filled minus to ring. Risk: as zoom-out, the 16 filled minus is a thin mark in a heavy ring, here 4.5 across instead of 3.5 (recommended) -->
  <path d="M3.75 9.5A5.75 5.75 0 1 0 15.25 9.5A5.75 5.75 0 1 0 3.75 9.5Z"/>
  <path d="M13.57 13.57L16.25 16.25"/>
  <path d="M7 9.5h5"/>
