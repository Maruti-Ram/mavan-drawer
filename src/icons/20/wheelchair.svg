<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: wheelchair, a11y, step-free, accessibility, accessible, disabled -->
  <!-- Wheelchair sign (International Symbol of Access): The International Symbol of Access, upright and still: head dot over a straight back, seat and shin, a wheel behind. Who uses it: building signage and maps, Material accessible, Font Awesome wheelchair, Phosphor Wheelchair, Tabler disabled. Box 18×18 · 14×14 · 12×12 (square keyline). Wheel 12 · 9.5 · 7.75 across (67 · 68 · 65% of the box), the back 2.25 right of the wheel centre at every master, seat 0.75 · 0.75 · 1.13 above it, shin 32° from upright at every master. The wheel opens 135° round the body at every master (outline, from 259° to 34°) and 170° in the filled twin (244° to 54°), the angles the tightest master needs, so the opening is the same at each size. Head to back 1.5; body to wheel 1.75 · 1.5 · 1.62 (filled 1.83 · 1.89 · 1.51). Bends are arcs of half the weight (0.75 · 0.75 · 0.625; filled 1.25 · 1 · 1). The sign's forward arm is left out: at 16 filled the head, arm, thigh and wheel need 13 of height in a 12 box, so it is gone at every size to keep one picture. Filled: lines 2.5 · 2 · 2, the wheel keeps its outer edge, the foot keeps the right edge. Nothing shipped has a wheel; D is its sibling. Means step-free physical access more than digital accessibility. -->
  <path d="M9.25 4.5A0.75 0.75 0 1 0 10.75 4.5A0.75 0.75 0 1 0 9.25 4.5Z"/>
  <path d="M10 8.25L10 10.75A0.75 0.75 0 0 0 10.75 11.5L12.84 11.5A0.75 0.75 0 0 1 13.47 11.85L16.25 16.25"/>
  <path d="M6.99 8.32A4 4 0 0 0 3.75 12.25A4 4 0 0 0 7.75 16.25A4 4 0 0 0 11.06 14.5"/>
</svg>
