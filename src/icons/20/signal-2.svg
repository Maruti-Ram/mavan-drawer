<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: bars, cellular, reception, strength, status bar -->
  <!-- box: 13.5x10 -->
  <!-- Status-bar proportion: Ships as signal-2, the full member of its level family (C28). Rhythm: four bars on one pitch (5.5 · 4 · 3.5, air 4 · 2.5 · 2.25, filled 3 · 2 · 1.5), but shorter, as a phone's status-bar glyph draws them. The box is wider than tall, about 4 : 3 at every master (18×13.5 · 13.5×10 · 11.75×9), and the shortest bar starts at a third of the tallest, not a quarter. Equal steps of 3 · 2.25 · 2: heights 4.5/7.5/10.5/13.5 · 3.25/5.5/7.75/10 · 3/5/7/9, one baseline, box-centred (baseline ink 18.75 · 15 · 12.5). Filled: C17 like A, grows 0.5 · 0.25 · 0.375 left and right. It reads lighter and smaller than the set at 24, about the weight of an inline glyph. Who: Bootstrap reception-4 (four bars in a 15×12 box), the phone status bar. -->
  <path d="M4 12.5V14.25"/>
  <path d="M8 10.25V14.25"/>
  <path d="M12 8V14.25"/>
  <path d="M16 5.75V14.25"/>
</svg>
