  <!-- Nodes branching off the hub: Rhythm: the gear's own hub ring is share's hub, kept whole (8.5 · 6.5 · 5.5 across); two leaves r 1.75 · 1.5 · 1.375 sit at the top-right and bottom-right corners on share's 45 degree links, 13.5 · 10.5 · 9 apart; link ink between hub and leaf 2.8 · 1.92 · 1.61 long. Cut back: the two right-hand teeth go under the leaves and links, the top and bottom teeth lose their right corners, and the right valley that is left floating (4.25 · 1.5 · 0.8 long) is removed as a stub; air gear-to-nodes 1.51 at every master. Four of six teeth and the whole hub stay, so the gear is still the first thing read. Ink box 18.56×20 · 14.97×16 · 13.06×14, centre 11.97,12 · 10.02,10 · 7.97,8. Who uses it: Nucleo's gear-nodes (the reference: nodes branching off a gear) and share's own drawing; one object rather than a gear plus a badge, the same build at every master, the clearest of the five at 16 (recommended) The gear is the shipped gear verbatim, in place (C33): it cannot be drawn smaller, since six hollow teeth with 1.5 of air inside the tooth and across the valley need about 14 at a 1.5 stroke and 12.7 at 1.25, so the nodes come into its canvas and the gear is cut back by hand with 1.5 of air from their ink instead of shrinking. Off-grid numbers are the gear's own rotated points, the cut ends (where the gear's centreline reaches 1.5 of air) and the link ends on the ring centrelines; ring centres and radii are on the grid. Filled: gear-filled cut back 1.5 round each node disc and link, nodes solid discs, links stay lines at 1.5 · 1.5 · 1.25. -->
