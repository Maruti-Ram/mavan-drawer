  <!-- Wedge: (recommended — the only drawing C9 allows) alert-octagon's container and alert-circle-2's "!" to the coordinate: the bar is a closed wedge stroked at 1.5 · 1.5 · 1.25, 2.5 · 2 · 2 of ink at the shoulder (the dot's diameter) narrowing to a 1.5 · 1.5 · 1.25 tip, apex 13.44 · 10.71 · 8.065 — the two-decimal apexes correct the tip's round join as the circle's do; sides 4.4 · 3.2 · 6.7° off vertical, the circle's own numbers (the 16 was 4.9 before the 1.25 stroke, per its file note), which lint does not check and is the one thing the family already carries. C19 dot 2.5 · 2 · 2, bar-to-dot 1 · 1 · 1.06. Air from the glyph to the top and bottom flats 2.75 · 2.0 · 2.0 (shoulder and dot alike, the circle's air to its rim); to the nearest diagonal side 3.87 · 2.93 · 2.65 (shoulder) and 4.08 · 3.03 · 2.81 (dot); to the nearest corner arc 3.33 · 2.49 · 2.39 (shoulder). Every air is above 1.5 at every master, so no gap note at 16 — unlike alert-triangle-2, whose sloping sides close on the shoulder. Ink box 20×20 · 16×16 · 14×14, the filled identical, circle keyline. Filled: alert-octagon-filled's solid octagon (outer corner radius 3.25 · 2.75 · 2.125) with alert-circle-2-filled's cuts — tapered slot 3 · 2.76 · 2.25 wide at the shoulder, tip 2 · 1.76 · 1.75, dot ⌀2.5 · 2 · 2. At 24 and 20 the cuts are the circle's verbatim; at 16 they are written on the eighth grid as alert-octagon-filled's are (4.125 / 0.875 / 8.875 / 7.125 / 10.875 for the circle's 4.12 / 0.88 / 8.88 / 7.12 / 10.88, at most 0.005 apart; the slot's shoulder tangent points 9.122 / 6.878, 5.073 are where a 0.875 disc about each shoulder corner meets the sloping side). Material between the two cuts 1.0 · 1.0 · 1.0, measured by hand — lint reads no material between two separate holes (the known gap alert-octagon-filled's note records). Least material from a cut to the outer flat 4.0 · 3.37 · 3.125, to the outer diagonal 5.12 · 4.30 · 3.83. -->
