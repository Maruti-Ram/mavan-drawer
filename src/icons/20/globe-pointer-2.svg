  <!-- Redraw: the cursor with its tail: The cursor, with its tail: the shipped globe, unchanged and in place, with the shipped cursor's silhouette as a C33 badge (tip 50 degrees, edges at 20 and 70 degrees, its back on the diagonal, the tail along it, corners 0.75 · 0.75 · 0.625, C10), its ink corner on the margin edge (22 · 18 · 15). Ink 9×9 · 7.25×7.25 · 6×6; head 7.55 · 5.9 · 4.88 deep from tip to back, the tail one line running 3.77 · 2.95 · 2.44 past the back (centreline), white inside the head 2.98 · 2.00 · 1.65. Why one line: cursor's hollow tail (5 · 4.5 · 4 wide in ink) scaled into this box keeps 0.09 of white inside at 24 and shuts at 20 and 16, so at badge size the tail is drawn as the line it reads as. Filled: the head solid (corners 1.5 · 1.5 · 1.25, cursor-filled's), the tail stays a line at 1.5 · 1.5 · 1.25, as lines in a filled shape icon do. Siblings: window-pointer, drag-drop and select carry the dart, so C makes this the one pointer badge with a tail; if Maruti picks it, window-pointer would want the same pointer (a separate decision). Box 20×20 · 16×16 · 14×14, centre 12,12 · 10,10 · 8,8: the pointer's ink corner is the circle's own box corner, so the composite fits the circle keyline, centred, with no box note. Size: 9 · 7.25 · 6, chosen for the globe: the ring then keeps 1.5 at 3 and 6 o'clock at every master (at 20 a 7.5 pointer leaves 1.42, at 16 a 6.5 one leaves 1.35; window-pointer's 7.75 · 6.5 leave 1.27 · 1.35, which is why A's ring and meridian end as a lump left of the pole at 20 and 16), and it is the same share of the globe at every master (0.45 · 0.45 · 0.43 of its ⌀ 20 · 16 · 14; the lock is 8×9.5 · 7×8.25 · 6×7). Cut back by hand, the same in B and C: the ring keeps exactly three quarters, from 3 o'clock over the top to 6 o'clock, ending where the equator and the meridian meet it, which is also where the filled twin's solid ends (the band at 3, the pole at 6), so both styles stop together; air there 2.41 · 1.58 · 1.65. The meridian keeps its left half, which now ends at the bottom pole with its cap inside the ring's stroke (the two are tangent there, so they end as one), and its upper right quarter down to (15.73,10.96) · (12.94,8.56) · (10.461,6.881), 1.5 from the pointer. The equator runs from the left to 1.5 short of the pointer's tip, x 11.71 · 9.25 · 7.735, 3.46 · 2.25 · 2.24 past the meridian at every master (no stub). The ring's bottom-right quarter, the meridian's lower-right quarter and the equator's right half go whole; no closed cell is left beside the cut. Tightest air, outline 1.50 · 1.51 · 1.50 (meridian and equator ends; measured 1.501 · 1.508 · 1.500); filled 2.0 · 1.63 · 1.94 (the upper lens to the tip). Filled: globe-filled with its band and upper lens verbatim. The lower-right cell goes with the ring's quarter, so the disc's edge stops at the band at 3 o'clock and at the pole at 6, as credit-card-percent's top piece stops on its stripe. The lower lens goes at every master: at 20 and 16 the cut leaves it 1.21–1.67 · 0.82–1.44 wide, under the line weight 1.5 · 1.25, and 24 (2.1–2.6) drops it too so the three masters are one picture. Nothing else of the globe is cut, so there are no fillets: the upper lens is untouched (A's bit it 0.5 · 0.37 · 0.12 deep). Filled ink box identical. Off-grid decimals: the pointer's own (arc-derived tangent points of its rounded corners), the meridian's end on its ellipse and the equator's end, each where the air to the pointer is 1.5 (rounded away from it), and globe-filled's own. Shipped as globe-pointer-2 beside the dart (Maruti, 2026-10-25): filled it reads as a pointer; in the outline at 16 and 20 its tail sits where user-search's magnifier handle does, so it can read as a lens, which is why the dart took the plain name. -->
