  <!-- Leaning, long needle: The leaning pin with a long needle: a smaller body (cap 8.57 · 7.16 · 5.85 across, waist 5.74 · 5.04 · 4.08, plate 13.52 · 10.69 · 9.03; body 12.81 · 9.99 · 8.67 along the axis) and a needle of 8.49 · 7.07 · 6.01, which sets the ink box's bottom-left corner. Taper and skirt edges on whole pixels at every master; the needle's round end on whole pixels at 20 and 16. The diagonal needle is what says "pin" at 16. Leaning 45, head top-right, needle to bottom-left, in the square keyline (ink 17.6-17.9 · 13.9-14.2 · 11.9-12.1 across the five). Drawn upright in its own frame with every length a whole multiple of sqrt2 x the grid (0.354 · 0.354 · 0.177), so every corner lands on the grid after the turn, and the 45 edges of the upright body (flare, cap taper) turn into flat horizontal and vertical edges. Those flat edges were moved (a shift of at most 0.25 and a step of the flare or taper along the axis) until their outer edges sit on whole pixels. Radii as the upright ones (corners 1 · 1 · 0.75, inside 0.75 · 0.75 · 0.625). Filled: body one solid on the outline's outer edge, needle a line at 1.5 · 1.5 · 1.25. Off-grid decimals: fillet tangent points and arc ends along the diagonal edges, and the ink box edges, which land on the round corners (irrational by construction). -->
