  <!-- Three column guides: A's frame and A's divider positions (x 9.25 / 14.75 · 8 / 12 · 6.375 / 9.625), but the dividers stop short of the top and bottom walls — column guides in one room, as a design tool's layout grid draws them, rather than walls. Air from each divider's round end to the wall 1.5 · 1.5 · 1.75; at 16 the 1.75 (not 1.5) keeps one clear pixel row above and below (rows 4 and 11), the lesson layout-footer-4 learned — at 1.5 the frame's fringe and the cap's fringe meet in the same rows. Divider ink 12 · 8 · 6 long (centreline 6.75–17.25 · 6.75–13.25 · 5.625–10.375). Tightest air at 16: 1.75 (cap to wall); columns 2.5 / 2 / 2.5 as A. How it differs: one room with guides instead of three rooms. Risk: at 16 a rounded square with two 6-long bars 3.25 apart is how a pause button in a square is drawn, and the filled twin — the square solid with two 1.5 white slots, round-ended, 12 · 8 · 6 long — is exactly a pause button -->
