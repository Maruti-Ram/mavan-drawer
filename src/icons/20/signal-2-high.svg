  <!-- Three of four bars: Ships as signal-2-high. 3 of signal-2's four bars active, 1 kept as dots. Ink 18×10.5 · 13.5×7.75 · 11.75×7. Rhythm: signal-2 exactly — pitch 5.5 · 4 · 3.5, one baseline (ink 18.75 · 15 · 12.5), active bars at signal-2's heights 4.5/7.5/10.5/13.5 · 3.25/5.5/7.75/10 · 3/5/7/9. Each inactive bar stays in its place as a dot at the bar's foot: a zero-length line whose round cap is a disc exactly the bar's width, ⌀1.5 · 1.5 · 1.25 (filled 2.5 · 2 · 2). So the pitch, the air (4 · 2.5 · 2.25, filled 3 · 2 · 1.5) and the box width (18 · 13.5 · 11.75) hold, and the eye still counts four places. Dot against the lowest bar: 1.5 vs 4.5 · 1.5 vs 3.25 · 1.25 vs 3; filled 2.5 vs 4.5 · 2 vs 3.25 · 2 vs 3, the closest pair at 16 filled. anchor: signal-2 — the ink stays inside signal-2's box on its baseline and shares its left and right edges (C28). Filled: C17 like signal-2, weight 2.5 · 2 · 2, bars' ends pulled in, the dots grow in place on the baseline. Who: Tabler antenna-bars-1…4 (dots for empty bars), Bootstrap reception-0…3 (flat dashes). The zero-length line is new to the set; Tabler draws the same dot as a 0.01 line. -->
