  <!-- Gesture bar: Rhythm: one bar on the centre line, its air to the floor 1.5 at every master (phone-contactless keeps the same 1.5); bar ink 4 · 3 · 2.5 long (a third of the body: 33 · 30 · 31%), 1.5 · 1.5 · 1.25 thick, air to each side wall 2.5 · 2 · 1.5 — equal both sides. Body: ink 12×20 · 10×16 · 8×14 (0.60 · 0.63 · 0.57 wide-to-tall; Fluent phone is 12×20, Material 0.61, Phosphor 0.64), centred on the canvas, container radius 2.5 · 2 · 1.5 and walls 1.5 · 1.5 · 1.25 as cast-mobile, phone-contactless and calculator; inside 9×17 · 7×13 · 5.5×11.5; every edge on a whole unit at 16. Filled: body solid (outer radius 3.25 · 2.75 · 2.125), the bar cut out at its outline ink; at 16 the cut is 1.5 tall, not 1.25 (C22), and keeps the outline bar's lower edge, so it grows 0.25 up; 3 · 3 · 2.75 of solid below it. Pairs with tablet A. Who: Fluent phone (bar), Material phone_android (bar), Polaris Mobile and Heroicons device-phone-mobile (bar under a notch). (recommended) — it is today's phone in one stroke, the same home bar phone-contactless already ships, and the body stays clean enough to reuse in devices at 16. -->
