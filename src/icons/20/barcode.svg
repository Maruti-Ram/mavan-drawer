<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: bars, upc, ean, product code, sku -->
  <!-- box: 15x11.5 -->
  <!-- Bars, mixed width: Rhythm: four bars — thin, thick, thin, thin — with one equal air between every pair: 3.5 · 2.5 · 2.25 (filled 2.5 · 2 · 1.5, floor 1.5). Thin bars 1.5 · 1.5 · 1.25 (the line weight), the thick bar exactly two lines wide, 3 · 3 · 2.5, drawn as a block whose corners are the join radius 0.75 · 0.75 · 0.625 (C10's half-weight bend), so its top is flat where the thin bars are round — the flat top is what reads as print, not as a pill. Same four bars at every master: five filled bars of 2 across the 14 a 16 master allows leave 1 of air, so five fit nowhere at 16. Ink 18×14 · 15×11.5 · 13×10 (declared box, ≈1.3:1 landscape at each master), box-centred; the thick bar second puts the mass 0.35 · 0.25 · 0.23 left of centre, left as drawn. Filled: C17 repeated elements, as chart-bar and menu — weight 2.5 · 2 · 2, every bar thickens in place (thick bar 4 · 3.5 · 3.25), ends held, so the filled ink is 19×14 · 15.5×11.5 · 13.75×10, declared grows 0.5 · 0.25 · 0.375 left and right. Who: SF Symbols barcode, Material Symbols barcode, Font Awesome barcode, MDI barcode, Remix barcode, Carbon barcode, Bootstrap upc, Lucide barcode (equal bars), Nucleo barcode. (recommended) — it is the barcode itself, the picture most sets use, and at 16 the one thick bar among thin ones is what tells it apart from chart-bar and menu. -->
  <path d="M3.25 5V15"/>
  <path d="M7.25 5H8.75V15H7.25Z"/>
  <path d="M12.75 5V15"/>
  <path d="M16.75 5V15"/>
</svg>
