<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: sticky note, memo, post-it, turned corner -->
  <!-- Sticky note, turned corner: (recommended) The square keyline (checkbox's frame, 18 · 14 · 12, corners 2.5 · 2 · 1.5) with its bottom-right corner turned up. The fold is file's own — chamfer 6 · 5 · 4.125, fold radius 1.5 · 1.25 · 1 — moved from file's top-right to the bottom-right by mapping, not redrawn, so the two folds match exactly. Polaris Note, Material sticky_note_2, Font Awesome note-sticky, Tabler note, Phosphor Note and Central note all turn the bottom-right corner; Lucide sticky-note turns the top-right. No text lines: beside the fold a second text line fits only at 24 (at 20 and 16 it shrinks to a dot), so the note stays plain at every master instead of changing picture between sizes. Filled: file-filled's build — body solid, the flap split off by a 1.5 cut, flap tips r0.25; the off-grid values (19.96, 20.13, 15.43 and their 20/16 twins) are those tips' tangent points, file's numbers moved by whole units. Ink 18×18 · 14×14 · 12×12, filled identical. At 16 it is a square with a turned corner: file is a portrait page folded top-right, calendar has pegs and a header bar, clipboard a clip. Why: the most widely used picture of a single note, and the calmest — one outline and one fold, nothing to clog at 16. Open point: C33 puts note-plus's badge on exactly this corner, so the fold would have to give way there. -->
  <path d="M5.75 3.75H14.25A2 2 0 0 1 16.25 5.75V11.25L11.25 16.25H5.75A2 2 0 0 1 3.75 14.25V5.75A2 2 0 0 1 5.75 3.75Z"/>
  <path d="M16.25 11.25H12.5A1.25 1.25 0 0 0 11.25 12.5V16.25"/>
</svg>
