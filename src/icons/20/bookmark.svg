  <!-- Folded over the page: The ribbon's head folded over the page's top edge: a fold line across the ribbon, book-4's band construction laid across the top. Band clear 2.5 · 2 · 1.75 (book's page band), fold line at y 6.75 · 6.25 · 4.625 (at 24 and 16 its top edge lands on a whole pixel). Body clear 11 · 9 · 7.5 wide, 8.12 · 5.62 · 5.27 from the fold line down to the notch. Notch: both edges at 45°, full width, so it is half the ribbon's width deep, 6.25 · 5.25 · 4.375 on the centreline. Tips and the notch's inner corner at the mark bend 0.75 · 0.75 · 0.625 (C10, flag's tails); the filled notch comes to a sharp V (0.75 - 0.75), as flag's does. Seen from outside, the notch's white is 4.88 · 3.88 · 3.23 deep and at least 1.5 wide for 4.13 · 3.13 · 2.48 of that, the same in both styles (one outer edge); each tail's counter narrows under 1.5 only in its last 1.5 above the joined corner, as flag's tails do. Head corners at the detail radius 1.5 · 1.25 · 1 (book's and book-4's), 2.25 · 2 · 1.625 on the filled edge. Ink 14x20 · 12x16 · 10x14: the 20 and 16 masters sit on the portrait keyline and the 24 is two narrower (agreed box 14x20 at 24 only, declared), so all three share one proportion, 0.70 · 0.75 · 0.71 wide for their height, where the rejected 16x20 block was 0.80 at 24. Centred, every outer edge on a whole pixel, filled identical. Filled: head band and body split by a 1.5 cut centred on the fold line (6-7.5 · 5.5-7 · 3.875-5.375; at 16 wider than the 1.25 line, C22), cut corners r0.5 as book-4's spine cut, leaving a band 4 · 3.5 · 2.875 solid. Off-grid decimals are tangent points on the slanted notch edges (r / tan of half the corner back along each edge) and the filled V's sharp point; each tip arc is written in two halves through its lowest point, so the ink ends exactly on 22 · 18 · 15, and the tip vertex (22.311 · 18.311 · 15.259) and notch vertex (16.061 · 13.061 · 10.884) are construction points, off-grid as flag's tip vertex is. At 16 the filled twin puts down 113 px of ink, inside the relatives' 106 (star) to 117 (book-4), where the plain ribbon E puts down 128: the cut keeps it from being a slab. Nearest neighbour at 16 is archive (a lid band over a box): archive's lid stands a pixel proud of its body and it has no notch. (recommended) It is new to the board, it is the only one whose filled twin carries a second bookmark cue instead of a solid slab, it reads as a ribbon over a page and not as flag (no pole), file (no folded corner) or book (no page band at the foot, no spine), and it needs no angle exception, only the 24 box. -->
