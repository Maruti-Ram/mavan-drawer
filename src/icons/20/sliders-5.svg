<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- keyline: mark -->
  <!-- tags: adjust, controls, filters, settings, tune, two tracks, ring, end, toggle -->
  <!-- Two tracks, knob at the end: Each track ends in its ring - top ring at the far right, bottom ring at the far left - so there are no short stubs at all: four parts, the cleanest pixels on the sheet at 16. The cost is meaning: a knob parked at the end of its travel reads a little like two keys or two toggles, less like something you slide. Same track lines, ring sizes and ink as A (18×15 · 14×12 · 12×12, rings 6 · 5 · 5, holes 3 · 2 · 2.5). Smallest gap 5.25 at 24 (top track to bottom ring), 3.75 at 20 (top track to bottom ring), 3.875 at 16 (top track to bottom ring). Filled: the shape case - each knob fills to a solid disc the size of the ring's outer edge, tracks stay at the outline weight 1.5 · 1.5 · 1.25; filled ink box equals the outline's at all three. -->
  <path d="M3.75 6.5H12.75"/>
  <path d="M12.75 6.5A1.75 1.75 0 1 0 16.25 6.5A1.75 1.75 0 1 0 12.75 6.5Z"/>
  <path d="M7.25 13.5H16.25"/>
  <path d="M3.75 13.5A1.75 1.75 0 1 0 7.25 13.5A1.75 1.75 0 1 0 3.75 13.5Z"/>
</svg>
