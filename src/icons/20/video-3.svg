  <!-- TV with play: a screen over a stand bar, a play triangle on it. Material ondemand_video, Lucide tv-minimal-play, SF play.tv, Phosphor MonitorPlay; streaming and on-demand menus. Screen = desktop's at 24 (outer 20x14, radius 2.5); at 20 and 16 it is 2 taller than desktop's (16x12.5 · 14x11, radius 2 · 1.5), so the play keeps its air inside and out, and the 20 screen takes the 16 one's shape (1.28 · 1.27 : 1). A bar the length of desktop's foot (ink 9 · 7 · 6) floats under it with 2.5 · 2 · 1.75 of air and no neck. Triangle near-equilateral (59.6° · 59.5° · 59.9° at the point), ink 6x6.42 · 5.45x5.8 · 4.75x5.09, 46% of the screen's height at every master; the white inside it 1.98 · 1.62 · 1.5 across (the widest circle that fits, lint §5i); air above and below 2.29 · 1.85 · 1.71; leaning right 0.24 · 0.22 · 0.25, about half its mass offset (0.25 · 0.2 · 0.19), centred up and down on the screen. Ink 20x18 · 16x16 · 14x14, agreed boxes, box-centred. Filled: screen solid with the triangle knocked out white; the bar stays a line at the outline weight. At 16 it is not desktop (neck and foot, no play) or airplay. It is also the picture the tv concept (#314) would want. Off-grid decimals are the triangle's tangent points. The 20 master was redrawn 2026-10-20: its play left 1.13 of white inside (lint §5i), which filled grey in real pixels and read as a dot. (recommended) -->
