  <!-- Knob on the piece, half-weight feet: The top knob moves left onto the left piece (knob centre x 6.5 · 5.75 · 4.125, was 8.5 · 7.5 · 5.625; head size, height and stand-proud unchanged), outline and filled together, so nothing overhangs the seam: the head's right edge is at 9.25 · 8.25 · 6.375 against the piece edge 11 · 9.5 · 7.5. Its feet are rounded at half the stroke weight in the filled (0.75 · 0.75 · 0.625, the set's bend radius; outline centreline 1.5 · 1.5 · 1.25, was 1 · 1 · 0.875). The right foot lands on the top edge 0.65 · 0.04 · 0.03 before the seam's 0.5 corner; the left foot lands on the outer corner arc - the piece is 9 · 7.5 · 6.5 wide and the knob's foot needs about all of it, so the left shoulder is the corner itself. Why not a smaller knob instead: trimming the head closes the outline knob's hollow neck below 1.5 (0.74 at 24 for 0.25 less), so the knob moves, it does not shrink. Outline knob neck clear inside stays over 1.75 at every master; the knob head is 3.63 · 3.01 · 2.83 clear of the right piece; narrowest filled air is the seam: 1.5 · 1.49 · 1.5 (1.49 is the shipped seam's 2-dp rounding). The filled 16 seam was 1.25 and is widened to the 1.5 floor for a band between filled parts (2026-09-28) on the right piece's side, because the left piece's top-right corner starts where the knob's right foot lands: the right piece's edge moves from 8.75 to 9 and its socket radius from 2.25 to 2.5 round the same head (r1, centre 10,9.625); the left piece's side-tab fillet goes from r1.5 to r1.75, concentric with the right piece's r0.25 mouth corner (centre 9.25,6.979), so the air round it stays an even 1.5 and the tab's neck widens to 1.79 (was 1.58). New decimals: 6.979 / 12.271 are where that fillet meets the seam edges, 9.727,8.663 / 10.587 where it meets the head, 9.318,7.22 / 12.03 where the mouth corner meets the socket. Ink 20x20 · 16x16 · 14x14 both styles. (recommended: looked at in real pixels at 16 and 20, both feet now render as clean curves, with no notch and no hook, and the knob still has a small shoulder on the left where the corner rounds into it; B's wider foot removes that shoulder and the left piece starts to read as a bottle. Cost against S: the knob sits in the middle of the piece, not beside the seam, and at 16 the left piece is more dome than shoulders) (recommended: only the filled 16 changes) -->
