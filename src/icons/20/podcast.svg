<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: podcast, broadcast, arcs, on air -->
  <!-- Podcast arcs: Rhythm: live's dot and radii again (air dot to arc 2.75 · 2 · 1.75, arc to arc 2.75 · 1.75 · 1.75), but the arcs run unbroken over the top, 240° each, open 30° below level on both sides — a dome, not live's side waves. A stand under the dot, 5 · 3.25 · 3 long, with 2 · 2 · 1.75 of air to the dot so the filled dot still keeps 1.5. Ink 20×20 · 16×16 · 14×14, circle keyline, box-centred. Filled: dot ⌀4 · 3.5 · 2.5, arcs and stand at 1.5 · 1.5 · 1.25. At 16 the stand sits at x 7.625, 0.375 left of the axis, so it lands on whole pixels instead of two half-grey columns. Who: Lucide podcast, Material podcasts, Untitled podcast. Says "podcast / on air" more than "radio"; if a podcast icon is wanted later, this is it. -->
