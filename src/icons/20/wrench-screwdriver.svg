<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: wrench, screwdriver, tools, maintenance, repair, fix, service, build, under repair, pair, upright -->
  <!-- box: 16x16 -->
  <!-- Side by side, upright: What changed from C: (1) The wrench is drawn upright from the shipped wrench's own numbers, not the shipped drawing turned 45 degrees: head 12 · 10.5 · 9.5, horns r1.75 · 1.5 · 1.375, jaw floor fillet r1.25 · 1.25 · 1, shoulder fillet r2.75 · 2.5 · 2.125, shoulders at the shipped 44 · 41 · 41 degrees. So every wall lands on the grid instead of 1/8 off it. At 16 the box is 14 x 14 starting on a whole pixel (C: 13.75 at x 1.125, every edge soft). The left prong, the left jaw wall and the shaft land on whole pixels there; the 9.5 head and the 4-wide handle cannot put both their edges on whole pixels. At 20 every wall and the shaft have a whole-pixel edge. At 24 the wrench's handle walls, the shaft and the screwdriver's walls do. The one change to the wrench is at 20: head 10.5 with a 1.5 jaw (shipped 10.75 and 1.75), so its walls land on the grid; 24 and 16 keep the shipped head, jaw and handle. Bare handle shortened to fit the height (to 7.75 · 4.5 · 3.75). (2) The screwdriver gets a collar: a crossbar across the top of its handle, 0.75 · 1 · 0.375 past each side, as in Nucleo's wrench-screwdriver. That T where the shaft meets the handle is what tells a screwdriver from a matchstick or a thermometer; C's capsule did not have it. At 16 the collar shows as a dark bar. Handle 4.5 · 4.5 · 4 wide (the wrench handle's width), 47 · 47 · 45% of the height, collar level with where the wrench's shoulders end at 20 (0.125 off at 16). Tip level with the jaw tips, handle bottom level with the butt. Air from head to shaft 1.75 · 1.5 · 1.5; nothing crosses, nothing is cut, tightest air 1.5 in both styles. Ink 17.5x20 · 16x16 · 14x14, centred, agreed box. Mass outline +0.31,-0.63 · 0.00,-0.43 · +0.18,-0.40 (C: +0.40,-0.59 · +0.27,-0.46 · +0.24,-0.41): high, because the head is the heaviest part, and the box fills the height so there is no room to move it down. Ink 23.3 · 27.3 · 31.0% beside gear and bug. Off-grid values are only the shoulder tangent points and arc ends, rounded to 2 · 2 · 3 dp. Honest read at 16: the only one of the four that reads at once as two tools, and the collar makes the screwdriver read. (recommended) -->
