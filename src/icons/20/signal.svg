<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: wedge, triangle, cellular, strength -->
  <!-- Rising wedge: Ships as signal. Rhythm: one shape, so balance is the question. A right-angled wedge fills the square keyline: ink 18×18 · 14×14 · 12×12, box-centred, rising from bottom-left to the top-right corner at 45°. Corners: both 45° tips bend r 1 · 0.75 · 0.625 on the centreline (outer 1.75 · 1.5 · 1.25); the right angle bends r 1.75 · 1.25 · 1 (outer 2.5 · 2 · 1.625, the container radius at 24). Inside white holds a circle of ⌀ 9 · 6.4 · 5.6 (floor 1.5). The tangent points on the 45° side are irrational, so they round to 2 · 2 · 3 places (lint lists them as off-grid values); the ink box lands within 0.006 of 18 at 24. Filled: the wedge fills solid with the same outer edge, the same corner centres and radii grown by half the weight; ink box identical. Caveat: in Material's outlined style a hollow wedge (signal_cellular_0_bar) means NO signal and only the solid one means full, so our outline twin reads as 'empty' to Android users. The filled wedge is among the heaviest filled shapes in the set (a half square at 18). Who: Material Symbols signal_cellular_4_bar (solid wedge) and network_cell, the Android status bar. Caveat: a hollow full wedge reads as 'none'. Material's outlined signal_cellular_0_bar is exactly this frame and means no signal. Maruti kept the hollow full wedge (2026-10-23), as for the wifi fan, so signal-none is left out: it would be this drawing. -->
