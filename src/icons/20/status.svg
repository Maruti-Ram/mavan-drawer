<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: dial, gauge, stem -->
  <!-- Polaris dial: Round one's drawing, unchanged. The one reference drawn under this name: a ring open in its top-right quarter, a stem dropping from the top of the ring into a centre dot, and a smaller open ring inside, both rings running from 12 o'clock round the left to 3 o'clock. It reads as a dial or a readout at 24; at 16 it is three arcs and a line in a 14 box, the busiest of the five. Rings are target's (r 9.25 / 5 · 7.25 / 4 · 6.375 / 3.375) and the dot target's small one (⌀ 3 · 2.5 · 2), so the air is target's: ring end to ring end 2.75 · 1.75 · 1.75, inner ring to dot 2.75 · 2 · 1.75. The stem turns off the ring through a C10 bend (r 0.75 · 0.75 · 0.625) and runs through the inner ring's end into the dot. Filled: dot thickened in place to ⌀ 4 · 3.5 · 2.5 as B, lines stay 1.5 · 1.5 · 1.25, air 2.25 · 1.5 · 1.5. Ink box 20×20 · 16×16 · 14×14, filled identical, circle keyline, box-centred. Look-alike risk: power (a ring with a gap and a line) — the inner ring is what keeps it apart -->
  <path d="M17.25 10A7.25 7.25 0 1 1 9.16 2.8A0.75 0.75 0 0 1 10 3.54L10 10"/>
  <path d="M14 10A4 4 0 1 1 10 6"/>
  <path d="M9.5 10A0.5 0.5 0 1 0 10.5 10A0.5 0.5 0 1 0 9.5 10Z"/>
</svg>
