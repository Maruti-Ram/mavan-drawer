ard its point 0.5 · 0.25 · 0.25 at 24 · 20 · 16, the ring held still; the measure was half the solid triangle’s centre-of-mass offset, 0.42 · 0.29 · 0.25. Corners: the C10 floor a smaller copy takes (play-3, triangle-small, the carets), not stop-circle’s rounder 1.5 · 1.25 · 1, so the two cut-outs differ (1.5 against 2.25 at 24, 1.25 against 1.625 at 16). -->
