  <!-- Router with waves: Rhythm: the router's lights and walls share one air — LEDs ⌀2 · 2 · 1.5 (radio's knob at 20) at pitch 3.5 · 3.5 · 3, 1.5 of air to the top, bottom and left wall and between the two at every master. Box 20×8 · 16×8 · 14×7 ink, corners r2.5 · 2 · 1.5 (the container radius). Antenna 3.5 · 1.5 · 1.5 long from the box's top centreline, on the right like Lucide's and Tabler's; two arcs about its tip, r4.25 / 8.5 · 3.25 / 6.5 · 2.75 / 5.5, tip to arc = arc to arc 2.75 · 1.75 · 1.5 (A's air), ends 45.1 · 43.0 · 43.3° above level, the outer cap on the right edge and the top. Ink 20×20 · 16×16 · 14×14, circle keyline, box-centred. Balance: mass 0.92 right and 1.84 low at 24 (the box is the heavy part), 1.07 low at 20, 0.95 low at 16; filled 3.45 · 2.13 · 1.99 low. Filled: the box solid with the LEDs cut out white at the same size, 1.5 of material between them and 3 · 3 · 2.75 to the box edge; antenna and arcs stay 1.5 · 1.5 · 1.25. Who: Lucide router, Tabler router, Material router, SF wifi.router. It says "router" more than "Wi-Fi": picked to ship as `router`, its own icon (not on the sheet yet). At 16 the LEDs are the first thing to go grey. -->
