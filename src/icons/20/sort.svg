<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: sort, order, arrange, two arrows -->
  <!-- box: 16x13.5 -->
  <!-- Pair, full height: The reference default, and the honest price of Concession A. arrow-up on the left, arrow-down on the right, both taken verbatim and both spanning the full mark height. Shaft centres 8/16 · 6.5/13.5 · 5/11, separation 8 · 7 · 6. Ink 18x15 · 16x13.5 · 14x12: at 24 that is exactly the 18 mark ceiling, so the pair costs nothing there; at 20 it is the circle keyline and the margin edge at once; at 16 it is the margin edge, 1 to 15. Air between the up arrow's right head-tip and the down arrow's shaft, on the filled drawing: 1.75 · 1.5 · 1.0. The 16 is the whole argument: one unit of white, declared as an agreed gap of 1, which is one pixel at 16px. Two things in its favour that only the raster shows. The stems land on whole pixels (4 to 6 and 10 to 12), so they are the crispest on the board; and because the head-tip ink stops at 9.0 and the stem starts at 10.0, that single unit of white lands on a whole pixel too and reads as a clean white column at exactly 16px. Against it: at any size other than 16px that alignment is gone, and 1.0 is then the thinnest white anywhere in the set. Nothing about the family changes here — this is arrow-up and arrow-down, twice, unedited. -->
  <path d="M2.75 7.44L5.97 4.22A0.75 0.75 0 0 1 7.03 4.22L10.25 7.44"/>
  <path d="M6.5 4V16"/>
  <path d="M9.75 12.56L12.97 15.78A0.75 0.75 0 0 0 14.03 15.78L17.25 12.56"/>
  <path d="M13.5 16V4"/>
</svg>
