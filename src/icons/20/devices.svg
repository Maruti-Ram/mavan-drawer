  <!-- Monitor and phone: Rhythm: the phone stands in front at the bottom right, 1.5 of air from the monitor all round it (1.75 above it at 16); the monitor's bottom line and its foot both stop at that same 1.5, so their ends line up at every master. Monitor: desktop's screen and stand, narrowed — ink 16×12 · 13×9.5 · 11×8 (1.33 · 1.37 · 1.38 : 1; desktop 1.43 · 1.45 · 1.56), radius 2.5 · 2 · 1.5; neck on the monitor's own centre (x 10 · 8.5 · 6.5) with desktop's 2.5 · 1.5 · 1.75 showing; foot 5 · 5 · 4 of ink (31 · 38 · 36% of the screen; desktop 45%) — it can be no longer, because it stops 1.5 from the phone. Depth: the phone's floor sits 2 · 1.5 · 1 below the foot, so it reads as standing nearer. Ink 20×18 · 16×14 · 14×12, desktop's agreed box, centred both ways. Phone: mobile A's walls 1.5 · 1.5 · 1.25 on a smaller body, ink 8×12.5 · 5.5×9 · 5×7.5 (0.64 · 0.61 · 0.67; mobile A 0.60 · 0.63 · 0.57); corner radius 1.5 · 1.25 · 1 (the detail radius, outer 2.25 · 2 · 1.625) — mobile's 2.5 · 2 · 1.5 on a body this narrow left no flat top at 20 and read as a capsule. One mark at 24 only: a chin line wall to wall with 1.5 of white above the floor (mobile D's chin), and in the filled twin a 5×1.5 slot with 3 of solid below it, mobile A's filled bar in the same place. At 20 and 16 the white inside is 2.5 wide and a chin split it into an "8"; the plain slab reads as a phone there, so the mark is dropped (drop a part rather than squeeze). Mobile A's bar needs 7 · 6 · 5.5 of white inside and mobile B's dot 5 · 5 · 4.5; the phone cannot grow — its width is capped by the stand or base (a 6-wide phone at 16 leaves a 2.75 foot in A) and its height by the 1.5 under the back device's top-right corner (12.5 · 9 · 7.75 at most). Cut-back (C33 practice): the back device stops 1.5 short of the phone's ink — its bottom line's cap and its right wall's cap both 1.5 away at 24 and 20, 1.5 at the side and 1.75 at the top at 16 (a 0.25 wall left past the corner was removed, not kept as a stub); its top-right corner stays whole above the phone. Filled: the back device solid with a notch that keeps the same 1.5 of white round the phone (notch corner r3.75 · 3.25 · 2.875, its ends rounded like the outline's caps), the phone solid; neck and foot stay lines at 1.5 · 1.5 · 1.25. Who: Lucide monitor-smartphone, Phosphor Devices (a foot only, phone front-right), Material important_devices, Tabler devices-2 (phone beside), Fluent phone_desktop (phone on the left). (recommended) — desktop is already shipped and its stand keeps the back device a monitor at 16, and a phone in front at the bottom right is the picture Lucide, Phosphor and Material share. -->
