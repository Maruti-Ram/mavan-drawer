  <!-- Two speech bubbles: Rhythm: the front bubble holds the A with 2.25 · 1.5 · 1.5 of air at the sides and 2 · 1.5 · 1.5 above and below; the back bubble sits 6 · 4 · 3.5 left and 3.25 · 2.25 · 1.25 higher, cut back 1.5 from the front's ink. Both take message's corner tail (45°, top bend 1.5 · 1.25 · 1, tip bend half the weight), radius 2.5 · 2 · 1.5; the tails sit on the outer corners. Ink 20×20 · 16×15.73 · 14×13.8 (at 20 and 16 the back's top is cut inside its corner, so the drawing sits 0.14 · 0.1 low). No character in the back bubble: the 文 needs about 10 of height and neither bubble has it. At 24 the back shows its top edge, left wall and tail; at 20 and 16 only a 2.5 · 2 wide strip of its left side and its tail, which reads as a bracket. Filled: the front bubble painted with the A cut out (white 1.5 at every master, C22), the back stays a line. Apple SF translate, the Apple Translate app, Microsoft Translator. Look-alikes at 16: the message family; the A carries it. -->
