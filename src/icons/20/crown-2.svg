  <!-- On a band: What the eye sees: crown’s body floating over a separate band line (Lucide crown, Material Symbols crown-outline and Remix vip-crown-line construction). Agreed box 20×18 · 16×14 · 14×12 — folder’s, heart’s and cloud-off’s — because on the landscape keyline the band, its 1.5 of air and the base eat 4 of a 10-tall mark at 16 and the notches go shallow. The band is a line at the outline weight on the box’s bottom edge, its ink the base’s own width 13.5 · 10.5 · 9 (Material’s is equal to the base, Lucide’s 13% wider), with a literal 1.5 of air to the body’s base at every master. The body is crown’s skeleton compressed to 15 · 11 · 9.25 tall (×0.94 · 0.92 · 0.925): base corners and valleys keep crown’s x, valleys at y 8.96 · 7.38 · 5.875, tips at 4.5 and 7.74 · 7.18 · 5.586, so the walls lean 15 · 19 · 21° (crown’s 14 · 17 · 19°), the valleys open 96 · 93 · 93° and the white under them is 6.0 · 3.6 · 2.9. Centred; off-grid decimals are the fillets’ tangent points. Filled: the body solid as crown-filled, the band a line at the outline weight; box identical. Read at 16 in real pixels: a crown sitting on its line, the air a visible row, the notches still open — the clearest of the five, unmistakably not crown, and the picture most sets draw for the word, so it reads at once. (recommended) -->
