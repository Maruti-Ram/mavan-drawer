<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- keyline: mark -->
  <!-- tags: bars, columns, analytics, report, no axis -->
  <!-- Three bars, bare: Three upright lines - low, tall, middle - and nothing else. The lightest drawing of the ten and the nearest to menu and sliders-4: the same line with the same round ends. The order is deliberate: bars that only rise read as signal strength, equal bars read as menu on its side. Bars stand on whole-number centres a quarter of the canvas apart (6 · 5 · 4; at 24 these are sliders-4's three columns, 6 / 12 / 18), so all three bars render alike and the filled bars are whole pixels at 20 and 16. Bar heights 9/18/13 · 7/14/10 · 6/12/9. Ink box 13.5x18 · 11.5x14 · 9.25x12, declared a mark. Smallest gap is the air between neighbouring bars: 4.5 · 3.5 · 2.75, filled 3.5 · 3 · 2 (floor 1.5). Filled: the repeated-elements case (C17), following menu-filled exactly - weight 2.5 · 2 · 2, ends pulled in 0.5 · 0.25 · 0.375 so the heights hold, bars thicken in place, so the filled drawing is 0.5 · 0.25 · 0.375 wider on each side (14.5 · 12 · 10 wide), declared with a grows note as menu-filled is. sliders-4-filled thickens its tracks in place too; its crossbars are what hold its box. At 16 a 1.25 line on a whole-number centre renders as two grey columns, the same as the upright of plus. Extends: stacked = each bar broken by a 1.5 gap; trend = the bars shortened under a rising line; horizontal is the weak one - three bare level lines of different lengths read as align-left or filter-2, so that variant would have to borrow C's floor line -->
  <path d="M5 10.75V16.25"/>
  <path d="M10 3.75V16.25"/>
  <path d="M15 7.75V16.25"/>
</svg>
