  <!-- Ring heads, slim solid stems: Rhythm: a mirrored pair with 3 · 2 · 2 of air between the buds, the same beside the heads and all the way down the stems; walls 3 · 3 · 2 on all four sides (square keyline 18 · 14 · 12); box-centred, symmetric left-right, no shift. At 16 the middle reads stem 2 · air 2 · stem 2 on whole pixels. Heads are headphones-4's rings verbatim (r 3 · 2.25 · 1.875, centres and air the same; 7.5 · 6 · 5 of ink, 4.5 · 3 · 2.5 clear inside). Each stem is solid, 2.5 · 2 · 2 wide — the set's filled line weight — drawn as a closed path no wider than the stroke, so the stroke fills it (a solid key, like calculator's tall key). Its inner wall continues the head's inner tangent from the head's equator to the bottom, and it hangs 10.5 · 8 · 7 below the head: the AirPods silhouette of round 1's filled twin, at a third (24, 20) to two fifths (16) of the head's width instead of 56 · 75 · 80%. Off-grid: 8.99 · 7.41, where the stem's other wall meets the ring's centreline (6.75 + √5, 6 + √2), hidden inside the ring's stroke; the stem's end arcs are r 0.5 · 0.25 · 0.375, the centreline half-width (a round end, not a bend). Edges at 16 and 20 all on whole pixels. Filled: heads fill (headphones-4's discs verbatim), stems unchanged, so the ink box is the same. Look-alikes at 16: q p in a bold face; the solid stems keep it from reading as letters (recommended) -->
