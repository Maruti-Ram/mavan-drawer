<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: sort, order, alphabetical, ascending, lines, list, table header -->
  <!-- box: 16x13.5 -->
  <!-- lines left, characters right: The stepped lines are the list and the characters are the key, reading left to right the way the eye already reads the shipped sort icons. No separate pointing mark — the direction is said twice over, by the lines stepping and by the characters’ order. Fits the family box exactly. (recommended of this group) -->
  <!-- The A’s crossbar sits a third of the way up the letter, 0.5 lower than the locked A, so its counter opens (Maruti, 2026-10-20). Its ends sit on the leg centrelines, off the grid at this master (invisible: the round cap is inscribed in the leg), so lint reads the A as one joined letter; the bar is drawn in the legs’ path so a browser smooths the A as one shape. -->
