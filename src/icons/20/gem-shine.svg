  <!-- Gem with shine: Gem with shine: a gem with three short rays over it, as Material Symbols draws diamond_shine (checked against the published file) and Nucleo draws gem-sparkle (a sparkle beside the gem, in the repo references). Rhythm and balance: the rays are sun's, 2.75 · 1.5 · 1.25 long with 1.5 of air to the body at every master. The upright ray stands on the centre line and the diagonals are drawn as sun draws them, 1.94 · 1.06 · 0.884 on each axis, each on the 45° line through its table corner's centre. Air from each ray to the gem measures 1.5 · 1.51 at 24, 1.5 · 1.51 at 20 and 1.5 · 1.5 at 16. At 24 the gem is the shipped 20-master gem moved (2, 5), 16×14 with its corners at 1.25, not the set's 1.5 at 24. At 20 and 16 the gem is redrawn: 13×11.5 and 11.25×10 of ink, table 45°, crown white 1.5, pavilion 50.9 · 50.6° (51.2° at 24). The table's top edge and the girdle's lower edge land on whole pixels: 8 and 13 at 24, 8 and 11 at 20, 5 and 9 at 16. Agreed box 18.9×19.75 · 14.8×16 · 12.468×14, centred (12.13 down at 24). Filled: the stone solid with the girdle cut 1.5 short of its edge, as shipped; the rays stay lines at 1.5 · 1.5 · 1.25. In real pixels at 16 the rays read as three short dashes over the stone. Naming: the rays are a modifier, so it would ship as gem-shine (like pen-sparkle), not as a number. (recommended) -->
