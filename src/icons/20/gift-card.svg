<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: gift card, voucher, bow, ribbon, card, tails, redeem, store credit -->
  <!-- box: 16x14 -->
  <!-- Bow with hanging tails: Gift's bow with hanging tails: A2's bow on the band, and the ribbon below the knot replaced by two tails at every master (Material card_giftcard / Mingcute gift-card picture: a band and a bow with tails, no upright ribbon). The card is credit-card's construction (radius 2.5 · 2 · 1.5) on an agreed box of 20×16 · 16×14 · 14×12, centred: the landscape keyline at 24, and at 20 and 16 one unit taller than round 1's 16×13 · 14×11 (two over credit-card's 16×12 · 14×10), so it is 1.25 · 1.14 · 1.17 wide for 1 tall. That unit is what makes room for the tails: with the bow 1.5 under the top wall, round 1's card left 3.5 · 3 of white under the band at 20 · 16, and tails that hold 1.5 at their tips need 4.5 · 4 (their drop, their round end, 1.5 to the bottom wall). The bow sits on the band as A2's does: at 24 gift's bow verbatim (loops 6 wide, 4.5 tall, knot 2.25 under their top, bends 1.5), at 20 and 16 A2's (loops 4 · 3.25 wide, 3.5 · 2.75 tall, knot 1.75 · 1.375 under the top, bends 1.25 · 1); counters 4.5×3 · 2.5×2 · 2×1.5. Stem at x 11.75 · 9.75 · 7.625 (one edge on a whole pixel), band at y 12.75 · 10.25 · 8.125; air above the bow 2 · 1.5 · 1.5, under the tails 2 · 1.5 · 1.5, bow to the side walls 1.5 left and 2 · 2 · 2.25 right. At 16 the stack is at the floor top and bottom, so the band cannot move onto a whole pixel: it falls across two rows (7.5 to 8.75) and reads a little soft. Tails 1.75 along 3 down (3.47 long, 30° from upright) · 1.5 along 3 down (3.35, 27°) · 1.375 along 2.5 down (2.85, 29°): tip air to the band at equal reach 1.96 · 2.03 · 1.65, tip to tip 2 · 1.5 · 1.5, to the bottom wall 2 · 1.5 · 1.5. The same tail angle at every master, so 24, 20 and 16 are one drawing; at 16 it is identical to A5. Filled: the card solid; band, loops, stem, and tails cut as 1.5 of white at every master (radius 0.5 where a cut leaves the card's edge, 0.25 at inner corners, round ends on the tails). At 24 and 20 the band's white runs on under the bow, so each loop is a white ring round a dark body 4.5×3 · 2.5×2 (the outline's own counter), standing as the loop, not as a dot. At 16 that body would be 1.75×1.25 — two grey dots, the eyes A had — so there the band's white stops at the loops' feet and turns up into them (outer corner rounded 0.75, as a stroke's round join), and each loop's dark body runs down into the card below: a white bow drawn as one ribbon, no dots and no white lump (round 1's solid white m). Dark left between a tail's white and the band's end at 16: 1.35 (floor 1.25, measured). Filled, dark between the two white tails at their tips: 2 · 1.5 · 1.25. Off-grid decimals: in the outline only gift's own (each 45° side meeting its top bend); in the filled file the grown 45° sides meeting their bends and the knot, the fillets, and the tails' white edges and round ends at their angle. Construction: each loop runs on down the stem to the crossing and the tails are one path pointed at it, so lint reads loops and tails as joined (the stem is drawn twice, same pixels). Lint does not judge the wedge where the tails meet the band (it reads a V on a line, as an arrowhead), so tip air is measured by hand at equal reach, as docs/01 §6 measures crossing arms. At 16, 1×: gift's bow with two short tails on a band — reads as a bow on a card, soft band; filled, a white bow drawn as one ribbon, no dots, no lump. (recommended) The cleanest of the three at every master: no third spoke under the knot, the tails read as a bow's tails rather than a cross, and it keeps one construction from 24 to 16. The cost is the card: one unit taller at 20 and 16, which at 20 is close to square (1.14 wide for 1 tall). -->
  <path d="M2.75 5.75A2 2 0 0 1 4.75 3.75H15.25A2 2 0 0 1 17.25 5.75V14.25A2 2 0 0 1 15.25 16.25H4.75A2 2 0 0 1 2.75 14.25V5.75Z"/>
