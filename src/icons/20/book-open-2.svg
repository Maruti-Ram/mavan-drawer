<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: pages, bound, read -->
  <!-- Bound book, pointed base: A without the foot: the bottom edges run straight down to a point at the spine, the purest form of the classic. Because a cut right through would take that point away and leave the filled ink box short, the filled twin is ONE solid book with a slit 2 wide from the top nick that stops above the point, as if the pages were bound at the bottom. Landscape keyline, detail corners; dip 3 · 2.5 · 2, hill radius 7.5 · 6.25 · 5, bottom drop 2 · 2 · 1. Ink box 20x16 · 16x12 · 14x10, filled identical. Outline: tightest open space the page interior, 7.75 · 5.75 · 5.13. Filled: slit 2 wide with a round end, material left under it 1.75 · 1.75 · 1.71 at its thinnest (floor 1.5). What it costs: outline and filled are different pictures (a line to the bottom against a slit that stops), and the solid with a nick above and a point below is the nearest any of the ten comes to a heart - look at the 20 filled -->
