  <!-- Smaller, 0.5: Rhythm and balance: size B, about 0.5 of square's width, the same size class on all five shape boards. Ink 9 · 7 · 6 at 24 · 20 · 16 (0.5 · 0.5 · 0.5 of square's 18 · 14 · 12 across), centred; side margin 7.5 · 6.5 · 5. Same stroke and construction; corner radius shrinks from square's 2.5 · 2 · 1.5 to 0.75 · 0.75 · 0.625 on the centreline (C10's tightest bend, half the weight), so the outer corner is 0.17 · 0.21 · 0.21 of the width (square: 0.18 · 0.2 · 0.18). Weight, measured: filled area 0.251 · 0.248 · 0.247 of square's, outline ink 0.465 · 0.445 · 0.443. Against circle-small B at the same size: filled 1.007 · 0.936 · 1.226, outline ink 1.075 · 1.014 · 1.201 (square against circle: 1.002 · 0.943 · 0.91 filled). Inside air 6 · 4 · 3.5. Pixels: at 16 whole (5/11), the box of circle-small B; at 24 and 20 half pixels (7.5/16.5 · 6.5/13.5), one unit narrower than the ring. Still reads as a square at 16. Lint: the agreed box replaces the keyline check; C8's family check still warns at every master, outline and filled, "small container is N — C8 keeps the default's M; only the inner mark changes", because C8 knows only a mark's 3 · 2.5 · 2 step and a container's kept size. That is the rule question, not a fault in the drawing. -->
