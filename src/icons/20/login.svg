  <!-- Bracket 6, arrow deep: What was off: the arrow ran to the 1.5 floor against the wall — its point 1.5 · 1.5 · 1.5 from the wall at 24 · 20 · 16, in both styles — so at 16 the head and the wall closed into one ⇥ (a tab-to-end key), filled worst, and the head was boxed in on three sides (tips 3.19 · 2.7 · 2.41 from the returns). Changed: the point now stands 3 · 2.5 · 2.25 off the wall in both styles — at 16 the shaft row now reads head, half-grey, white, wall (a fully white pixel column where shipped had one at 19% ink), and the filled twin shows two white columns where shipped had one — and still crosses the door's mouth by 1.5 · 0.5 · 0.5, so the arrow still goes in. The legs stand 4.11 · 3.41 · 2.93 from the returns and corners (was 3.19 · 2.7 · 2.41; filled 4.03 · 3.37 · 2.84, was 2.97 · 2.66 · 2.31); tail on the box edge as shipped. The shared arrow is 1.5 · 1 · 0.75 shorter at its inner end: 13.5 · 10 · 8.5 long (was 15 · 11 · 9.25), filled 12.5 · 9.5 · 7.75 (was 14 · 10.5 · 8.5) — the filled arrow is shorter by the added weight, as shipped, so the air to the heavier wall is the same in both styles. Kept exactly: the door (C31 — two doors in the set, each drawn once and mirrored; this one is the shallow door, returns 6 · 4.5 · 4 deep, 2 · 1 · 1.25 straight past the container corner 2.5 · 2 · 1.5, filled at weight 2.5 · 2 · 2 with the same outer radius, centreline 2 · 1.75 · 1.125), the square keyline (ink 18×18 · 14×14 · 12×12, filled identical, centred), and the head: arrow-right's at every master and style (10 · 9 · 8 tall, 45° legs, C10 bend 0.75 · 0.75 · 0.625, filled 1.25 · 1 · 1), moved along its own axis only — its off-grid decimals are the shipped head's own bend tangent points. Balance: ink mass 3.31 · 2.18 · 1.82 toward the door (was 3.70 · 2.46 · 2.04) — the door's own weight; the set's optical bearings (tools/optical.mjs) read the same as shipped, and tools/optical-sheet.mjs has no measure for a door and arrow (not a single-bend mark), so no optical shift (C14), as shipped. C31: the same arrow as C (logout) and the same door as D (logout-3) — redraw the four together. Upload and download use this same door and the old arrow (turned upright); they are left as shipped — carrying the change to them is a separate call. (recommended, with B, C and D) -->
