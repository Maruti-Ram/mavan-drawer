  <!-- Bracket 6, arrow deep: The common login: a rounded bracket (a door seen edge-on, right) and the classic arrow going in through its open side. The bracket takes the whole square keyline (18 · 14 · 12) with the container corners 2.5 · 2 · 1.5 and returns 6 · 4.5 · 4 deep (2 · 1 · 1.25 straight past the corner). Arrow 15 · 11 · 9.25 long — the shipped arrow-right head (10 · 9 · 8 tall, 45° legs, C10 bend 0.75 · 0.75 · 0.625; filled head from arrow-right-filled, weight 2.5 · 2 · 2) — its tail on the box edge and its apex 1.5 · 1.5 · 1.5 clear of the wall, so the head sits 3 · 1.5 · 1.25 inside the mouth line: at 24 the head is in the door, at 16 only its point is. Tips to the returns 3.19 · 2.7 · 2.41 (filled 2.97 · 2.66 · 2.31). Filled: line-heavy, weight 2.5 · 2 · 2; the tail and the bracket's ends pull in 0.5 · 0.25 · 0.375 so the box holds, but the apex pulls in a whole added weight (1 · 0.5 · 0.75) because the wall is now 2.5 · 2 · 2 thick and the air between them must stay 1.5 (1.5 · 1.5 · 1.5) — the filled arrow is 14 · 10.5 · 8.5 long against the outline's 15 · 11 · 9.25; corners keep the outline's outer radius (3.25 · 2.75 · 2.13, so the centreline radius drops to 2 · 1.75 · 1.125). Ink box 18×18 · 14×14 · 12×12, filled identical. Beside external-link at 16 the door is the same 12 box and the same 1.5 corner; beside arrow-right the arrow is 9.25 long, not 12, because the wall and its 1.5 of air take 2.75 of the box. Why: it is the door everybody reads, the arrow is arrow-right's own head, and at 16 its 4-deep return still reads as a corner plus a run (1.25 straight) without swallowing the head (recommended) -->
