  <!-- tags: translate, wen, latin, cjk, diagonal, brush -->
  <!-- Brush Wen: As A with the 撇 and 捺 drawn as brush strokes: each is a shallow arc (sagitta 1 · 0.75 · 0.5), the 撇 bowing to the lower right and the 捺 to the lower left, so the legs start steep under the bar and flatten into the feet the way the written character does. Same ends, same crossing, same A (60°, counters 1.65 · 1.62 · 1.54, filled 1.57 · 1.66 · 1.52), same gaps (bar to 乂 1.5, 文 to A 2.25 · 1.68 · 1.82). Keeps the pair everyone reads as translate, and the curve is what makes the 文 a character rather than an x under a lid; at 16 it is as legible as A and no worse (recommended). The 文 is dot, bar and 乂: the dot stands on the bar (one path), the bar is 11.5 · 8 · 6.5 wide, the dot shows 2 · 1.75 · 1.75 above it; the 撇 and 捺 cross at 45° and start 1.5 below the bar instead of hanging from it (simplified: hung from the bar, the triangle between bar and crossing measures under 1.5 unless the legs start 3.3 or more from the middle, which makes the 文 7.9 wide at 16 and leaves no room for the A); upper arms 2 · 1.5 · 1, lower arms 4 · 2.75 · 1.75 on each axis (filled 1.75 · 1.25 · 0.75 and 3.25 · 2.25 · 2, the 捺 1.25 at 16 to clear the A). Filled: line-heavy, 2.5 · 2 · 2; the A keeps its leg angle, its feet pull in by half the added weight so the box holds exactly, and its apex, which no edge of the box rests on, sits 0.37 · 0.17 · 0.27 lower; the crossbar drops to the highest line that keeps the counter at 1.5 (filled counter 1.57 · 1.66 · 1.52, crossbar-to-foot 1.25 · 1 · 1). Angles 0/90, arcs, and the A at 60. Off-grid values: the arcs' radii (set by the sagitta) and the A's apex tangent points and crossbar ends on the 60° legs. -->
