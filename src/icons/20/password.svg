<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: field, dots, masked, input, passcode, pin, secret, sign in, credentials -->
  <!-- box: 16x8 -->
  <!-- Masked field: The password field itself: a rounded field holding three dots, the picture Lucide (rectangle-ellipsis), SF Symbols (ellipsis.rectangle), Untitled (passcode) and Central (password) all draw, and what every phone and desktop shows in a password box. Field ink 20×10 · 16×8 · 14×8 (2 : 1 at 24 and 20, 1.75 : 1 at 16), container radius 2.5 · 2 · 1.5, centrelines on .25/.75 (.625 at 16) so all four outer edges sit on whole pixels; the same box key already keeps (20×10 · 16×8 · 14×8). Dots ⌀3 · 2 · 1.75 (r 0.75 · 0.25 · 0.25 stroked, C17's dot), centres x 7/12/17 · 6.25/10/13.75 · 4.75/8/11.25 on the field's centre line: pitch 5 · 3.75 · 3.25. Air, C17 rhythm: wall to dot 2 · 1.75 · 1.625, dot to dot 2 · 1.75 · 1.5, above and below 2 · 1.5 · 1.875. At 24 every space is 2. At 20 the field cannot be 8.5 tall without putting its top and bottom edges on half pixels, so above and below get 1.5 against 1.75 at the sides; at 16 three dots and four 1.5 spaces fill the 11.5 inside exactly with ⌀1.83 dots, ⌀1.75 on the eighth grid, and the height must stay a whole 8, so above and below get 1.875. Tightest air at 16: 1.5, dot to dot. Dots, not asterisks: three asterisks that keep their points need 17.9 of row at 24 (17 inside here) and 15.8 at 16 (11.5 inside), so in a field they fuse into blobs; every set that draws the field uses dots for that reason. How it differs: key has a 6-wide bow and a shank in the same box; keyboard is 20×12 · 16×11 · 14×10 with two rows of dashes and a space bar; more-horizontal is the same three dots bare (⌀3 · 2.7 · 2.4). Ink mass on the box centre at every master. On 0/45/90, no angle grant needed. Risk: it can read as a general text field or input; at 16 the dots are 1.75 across and render as 2-pixel grey spots, so the field carries the reading. Filled: the field solid to the outline's outer edge (outer radius 3.25 · 2.75 · 2.125) with the dots knocked out at their outline ink, holes ⌀3 · 2 · 1.75 (1.5 or more of white at every master), as keyboard-filled cuts its keys; solid between holes 2 · 1.75 · 1.5, hole to the side edge 3.5 · 3.25 · 2.875, to the top and bottom 3.5 · 3 · 3.125. A shape icon fills its shape; thickening the dots instead would close the gaps to 1 · 1.25 · 0.75. (recommended: the picture most sets ship and every OS shows, and the only one that still says password at 16 with all its air at 1.5 or more; on 0/45/90, and the base a later password-lock or password-check would sit on) -->
  <path d="M4.75 6.75H15.25A2 2 0 0 1 17.25 8.75V11.25A2 2 0 0 1 15.25 13.25H4.75A2 2 0 0 1 2.75 11.25V8.75A2 2 0 0 1 4.75 6.75Z"/>
  <path d="M6 10A0.25 0.25 0 1 0 6.5 10A0.25 0.25 0 1 0 6 10Z"/>
  <path d="M9.75 10A0.25 0.25 0 1 0 10.25 10A0.25 0.25 0 1 0 9.75 10Z"/>
  <path d="M13.5 10A0.25 0.25 0 1 0 14 10A0.25 0.25 0 1 0 13.5 10Z"/>
</svg>
