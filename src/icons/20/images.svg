  <!-- Down-left, tight: Back sheet offset down-left by 3 · 3 · 3, the tightest the 1.5 gap allows (3 = 1.5 of air + one stroke), showing only its left side, its bottom-left corner and its bottom; its ends stop where its other two corners would begin. Ink 18x18 · 14x14 · 12x12, the square keyline (the single `image`'s own box), so the stack sits exactly where the single does. Front frame 15x15 · 11x11 · 9x9 (83% · 79% · 75% of `image`'s width), `image`'s drawing brought down: radius 2.5 · 2 · 1.5, one 45 degree mountain from the corner start, peak r1.5 · 1.25 · 1 at 69% · 71% · 69% of the width; sun kept at 24 (2.5 off the walls, 2.35 off the slope); dropped at 20 (best place leaves 1.25 / 1.54); dropped at 16 (best place leaves 1.13 / 1.03). Outline gap between the sheets measured 1.5 · 1.5 · 1.75 (floor 1.5). At 16 the line is 1.25, so the same 3 leaves 1.75 of air. Filled: the front is `image-filled` (mountain a 1.5 cut through to the edge, sun a hole); the sheet behind is a solid, cut 1.5 from the front (the users-behind rule, the same cut seen as two solids), cut ends rounded r0.75. It runs 1.5 · 1.5 · 1.5 thick on its straights and 2.74 · 2.74 · 2.74 at its corner, where the front's corner grown by 1.5 is rounder than the back sheet's own. Air measured 1.5 · 1.5 · 1.5. Off-grid values are computed, not rounded: the peak tangent points and the r0.5 / r0.25 / r0.75 cut fillets of the filled drawings. Why: the back reads as the same sheet, not a bracket; the front stays as big as a stack can (tight offset); the sun and peak stay clear of the back; Lucide builds it this way; at 16 it stays two sheets and nothing clogs (recommended). -->
