<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: tap, contactless, waves, nfc -->
  <!-- Tap on the reader: Contactless waves over the reader (Polaris CreditCardReaderTap and CreditCardTapChip) on B's body exactly. The waves are two 120° arcs, not half rings: drawn as half rings landing on the body they read as a padlock beside lock and repeated contactless's own E (rings over a card). Radii 5 and 8.5 · 3.5 and 6.5 · 3 and 5.75, one centre; the outer arc's ink tops on the keyline (2 · 2 · 1); air between the arcs 2 · 1.5 · 1.5; the arc ends stop 2.5 · 1.75 · 1.5 above the body. Arc ends sit at 30° below the centre's horizontal (cos 30°), rounded to 2 dp (3 at 16), so the ink box measures 20×19.998 · 16×16.001 · 14×14.001. Circle keyline. Filled: body solid with the display line cut 1.5 tall; the arcs stay lines at 1.5 · 1.5 · 1.25. No card is drawn: the waves say tap. At 16 it can also read as a wireless router. -->
  <path d="M6.97 7.5A3.5 3.5 0 0 1 13.03 7.5"/>
  <path d="M4.37 6A6.5 6.5 0 0 1 15.63 6"/>
  <path d="M4.75 10.75H15.25A2 2 0 0 1 17.25 12.75V15.25A2 2 0 0 1 15.25 17.25H4.75A2 2 0 0 1 2.75 15.25V12.75A2 2 0 0 1 4.75 10.75Z"/>
  <path d="M5.75 14H14.25"/>
</svg>
