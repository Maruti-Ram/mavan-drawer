  <!-- Six square teeth, one outline: A single machined outline: six square-shouldered teeth, one on top, and a hub ring in the middle. In real pixels at 16 it is the clearest gear of the ten - six teeth is the most a hollow tooth can carry there with 1.5 of air inside the tooth and across the valley, and it reads as cleanly as the eight-tooth drawings that break the rule. Teeth get shallower as the master shrinks; at 16 the shoulders have almost no straight flank left and soften a little. Two costs, neither a gap: teeth sit every 60 degrees, so it needs the open angle exception; and no tooth points left or right, so the ink is 18.62×20 · 14.94×16 · 13.12×14, narrower than tall, and carries an agreed box instead of matching the circle guide (left and right margins are 0.69 · 0.53 · 0.44 wider than top and bottom). 6 teeth at every master; outer ⌀ 20 · 16 · 14, root ⌀ 15 · 12.5 · 11.25 (outer edge of the valley floor), teeth 2.5 · 1.75 · 1.38 deep; air inside a tooth 2 · 1.5 · 1.5, air across a valley floor 2.54 · 1.73 · 1.63; straight flank left between the rounded corners 1.37 · 0.63 · 0.44; corners 0.75 · 0.75 · 0.63 at the tip, 0.75 · 0.75 · 0.63 in the valley (filled valley corner 0 · 0 · 0); hub ring ⌀ 8.5 · 6.5 · 5.5 outside, 5.5 · 3.5 · 3 open inside, 1.75 · 1.5 · 1.63 clear of the valley floor. Filled: hub hole ⌀ 8.5 · 6.5 · 5.5, 3.25 · 3 · 2.88 of body between hole and valley floor. Smallest gap 1.75 · 1.5 · 1.5 (recommended). Off-grid numbers are rotated points and the tangent points of the rounded corners only (a tooth off the axes cannot sit on the grid); every radius, tooth width and axis point is on the quarter grid, eighth at 16 -->
