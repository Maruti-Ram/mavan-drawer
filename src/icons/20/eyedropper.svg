  <!-- Bulb dropper: Bulb dropper: Nucleo eye-dropper, Phosphor Eyedropper, SF Symbols eyedropper, Fluent Eyedropper, Bootstrap eyedropper, Photoshop's Eyedropper tool — a rubber bulb, a flange, a glass tube to a point. Rhythm and balance: the tube is wand's rod, 4.5 · 4.5 · 4 across with 1.5 of air inside (the floor); the bulb 7 · 6 · 5.5 across (air 4 · 3 · 3), the flange 9 · 8 · 5.5, standing 1 · 1 · 0 past the bulb each side (flush at 16: 0.75 past a 5.5 bulb over a 4 tube made a dark knot there, so at 16 the flange is the bulb's base line); tube 10.5 · 7.25 · 5.38 long, the flange at 59 · 59 · 54% of the length from the nib. The point is a 90° cone whose edges run level and plumb, bent at 0.75 · 0.75 · 0.625 (C10), with a nib 1.5 · 1.5 · 1.25 long on the axis. Mass along the diagonal: 0.43 · 0.37 · 0.19 toward the bulb in the outline, 1.83 · 1.16 · 1.01 in the filled. Filled: the bulb solid; flange, tube and nib stay lines at the outline weight — dark rubber, clear glass, as paintbrush-6's solid head on an open handle. Ink 18×18 · 14×14 · 12×12 on the square keyline, box-centred, on the box diagonal from the bottom-left corner to the top-right, as pencil and wand. Tube, nib, flange and bulb meet, so they are one path of four subpaths (as wand's rod and band). Off-grid numbers are the diagonal's points. The dropper every product draws; at 16 the wider bulb is what tells it from pencil, and the solid bulb makes the filled twin top-heavy. (recommended) -->
