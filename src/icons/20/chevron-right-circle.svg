  <!-- chevron-right-circle · classic: Ring: circle verbatim (centreline r 9.25 · 7.25 · 6.375), not turned. Chevron: chevron-down-circle's classic turned a quarter, (x, y) → (y, c − x) about (12, 12) · (10, 10) · (8, 8), so the point is on the right; legs at exactly 45°, bend r 0.75 · 0.75 · 0.625 (C10). It runs bottom end, point, top end; chevron-right itself is chevron-down transposed and runs top first, the same ink because the chevron is symmetric. Ink 5.69×10.5 · 4.44×8 · 3.62×6.5 (w×h), box-centred on the canvas (centre 12.005, 12 · 10, 10 · 8, 8). C14 shift deferred to the C15 sheet, judged left–right only (it mirrors top–bottom): the end-triangle measure on the mark alone (triangle centre 0.70 left of the box centre at 24) recommends 0.35 right at 24, snapping to 0.25 · 0.25 · 0.25 (bare chevron-right: 0.5). The ends' x 9.91 · 8.53 · 6.817 are off the grid on purpose: they centre the ink box across to 2 dp (C10 exact placement); the tangent points sit off the grid by construction (C10). At 16 the ends sit on y 5.375 / 10.625: the lead's x.375 / x.625 swap axes with the turn, so every value stays on the eighth grid at 3 dp. Air from the chevron's ends to the ring 2.79 · 2.18 · 2.25 (check-circle 2.5 · 2 · 1.96, plus-circle 3.25 · 2.5 · 2.5). Line ink 20.4 · 15.1 · 10.2 against check-circle's tick 19.9 · 14.7 · 10.4 (+2.4% · +2.8% · -2.6%), so the height holds the spec's span. Filled: the disc with the chevron cut out at 1.5 (spec §3, a single bent line, the weight check-circle-filled cuts its tick at). The cut keeps the outline's centreline ends (flat run); at 24 and 20 it is the outline stroke itself, as check-circle-filled's is. At 16 it follows C18: the cap centres stay put, so the white reaches 0.106 past the outline ink on the left, top and bottom (half the added 0.25, less 0.02 for the cap arcs), where check-circle-filled at 16 pulls its cap centres in 0.125 and holds the outline's box. Its bend follows check-circle-filled: centreline r 0.75 at every master, so the white's outer corner rounds at 1.5 and its inner corner is the arc centre, as the outline's inner corner is (at 16 that moves the bend's white 0.07 further right). Cut points are the centreline offset 0.75 at 45° (0.53 each way, which leaves the cap arcs 0.02 short of a half circle, as check-circle-filled's), rounded to 2 · 2 · 3 dp. White 5.67×10.46 · 4.42×7.96 · 3.8×6.71, 1.5 wide (a slit; inside air 1.499 · 1.499 · 1.501); disc left round it 4.31 · 3.71 · 3.4 to the edge. Ink box: the disc's, 20 · 16 · 14. Placed by eye on the C15 sheet (Maruti, 2026-10-25, row Cd35): the chevron moves 0.25 · 0.25 · 0.25 toward its point, the ring held still; the measure was the end triangle × 0.5, 0.35 at 24, half the bare classic chevron's shift because the ring's chevron is smaller (10.5 against 14 wide). -->
