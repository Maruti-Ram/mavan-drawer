<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: open dial, hub -->
  <!-- Open dial, hub: A with a solid hub at the pivot, ink ⌀ 3 · 2.5 · 2.5 (twice the needle at 24 and 16; at 16 a smaller hub merged into the needle's foot in real pixels; target's dot is 3 · 2.5 · 2), filled ⌀ 3.5 · 3 · 3 so it stays a step wider than the heavier needle. Landscape keyline 20x16 · 16x12 · 14x10, box-centred: the dial is a circle of ink ⌀ 20 · 16 · 14 (centreline r 9.25 · 7.25 · 6.375, as clock and target) whose top sits on the keyline top; sweep 249.16° · 233.27° · 223.75° (ends 34.58° · 26.63° · 21.87° below horizontal, caps on the keyline bottom). Needle at 45 deg, length 4.95 · 3.54 · 2.83, reach 5.7 · 4.29 · 3.45, tip-to-dial 2.8 · 2.21 · 2.3. Filled (line-heavy, nothing encloses an area): weight 2.5 · 2 · 2, the dial pulled in to centreline r 8.75 · 7 · 6 so its outer edge and its ends' caps stay on the outline's ink box; the needle's tip is the one end that cannot simply pull in by half the added weight — the dial's inner edge moves in by the whole added weight, so the needle is redrawn to the 1.5 floor: reach 5.85 · 4.18 · 3.47 (outline 5.7 · 4.29 · 3.45), tip-to-dial 1.65 · 1.82 · 1.53. 16 master at stroke 1.25: the dial's centreline r 6.375 puts its top and sides on whole pixels (1 → 15, top 3); the ends sit on the eighth grid (y 12.375) so their caps stop on the 13 line. Off-grid values are the arc's end and gap points (on the circle, rounded to 2 · 2 · 3 dp) and, in filled files, the cut's tangent points; every one is a point on a circle, not a correction. The needle leans right, so the mark is lopsided left-right: an optical-placement sheet (C14/C15) is the follow-up once a candidate is picked; drawn box-centred here. Three parts, each doing one job: the open ring is the scale, the hub says "this turns", the needle says "reading". The open bottom keeps it apart from clock and target at 16, and the hub keeps the needle from reading as a clock hand (recommended). -->
  <path d="M3.52 15.25A7.25 7.25 0 0 1 2.75 12A7.25 7.25 0 0 1 10 4.75A7.25 7.25 0 0 1 17.25 12A7.25 7.25 0 0 1 16.48 15.25"/>
  <path d="M10 12L12.5 9.5"/>
  <path d="M9.5 12A0.5 0.5 0 1 0 10.5 12A0.5 0.5 0 1 0 9.5 12Z"/>
</svg>
