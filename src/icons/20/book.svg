<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: pages, read, library, curl, spine -->
  <!-- Page curl, spine: Page curl and spine together. The cover's bottom-left corner rolls round into the page block (Lucide's curl): the page line runs from the right edge, curls down into the spine and becomes the back cover. A spine line drops from the top edge and stops on the page line. At 16 in real pixels this is the one that still says book: the spine stopping on the page band turns the bottom bar into pages, where the curl alone melts into the corner and reads as a tablet's home bar (see D). Ink box 16x20 · 12x16 · 10x14, filled identical. Corners 1.5 · 1.25 · 1 (book-open's). Curl radius 2 · 1.75 · 1.5; page band clear 2.5 · 2 · 1.75. Spine on x 7.75 · 7.75 · 6.375, spine band clear 1.5 at every master (the floor); front panel clear 10 · 6 · 4.75 wide. Filled: cover solid, page band knocked out at its clear size (2.5 · 2 · 1.75 tall, a back-cover strip 1.5 · 1.5 · 1.25 thick under it), spine cut 1.5 wide from the top edge that stops 1.5 above the band, leaving a spine strip 3 · 3 · 2.625 wide. Inside every rule, no exceptions, and the strongest 16 of the ten in both styles (recommended) -->
  <path d="M6 2.75H14A1.25 1.25 0 0 1 15.25 4V16A1.25 1.25 0 0 1 14 17.25H6.5A1.75 1.75 0 0 1 4.75 15.5V4A1.25 1.25 0 0 1 6 2.75Z"/>
  <path d="M15.25 13.75H6.5A1.75 1.75 0 0 0 4.75 15.5"/>
  <path d="M7.75 2.75V13.75"/>
</svg>
