  <!-- Standby on a round button: Rhythm: the standby sign sits in check-circle's ring (⌀20 · 16 · 14) with one even air to the ring on all four sides — line top, both arc sides and arc bottom — 2.25 · 1.75 · 1.625. Sign: arc r 5.5 · 4 · 3.5 opened ±53.13° (A's angle, and Lucide circle-power's: ends on the grid), line from the arc's top to the centre; sign ink 12.5 · 9.5 · 8.25 square, 0.74 · 0.73 · 0.72 of the ring's white — no drift from 24 to 16. Air from the line to the arc ends 2.9 · 1.7 · 1.55; the opening cannot be narrower than about ±51° here, or that air drops under 1.5 at 16. Filled: the disc (⌀20 · 16 · 14) with the sign cut out 1.5 wide on the same centrelines, as check-circle-filled; material between the line cut and the arc cut 2.9 · 1.7 · 1.3 (floor 1.5 · 1.5 · 1.25), disc left round the sign 3.75 · 3.25 · 2.75. Who: SF Symbols power.circle and power.circle.fill, Lucide circle-power. The filled one is the strongest 'power button' of the five; at 16 the sign inside is 8.25 across and the arc's mouth is the tightest place. -->
