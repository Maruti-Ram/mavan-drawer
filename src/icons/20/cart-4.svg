  <!-- Ring wheels: Two ring wheels instead of dots. A ring keeps its 1.5 counter only at r1.5 on the centreline, 4.5 of ink, so there is no room for a chassis rail: the basket stands straight on its wheels (H's construction) and the post bends into the floor at r1.5 · 1.25 · 1. Basket bottom 14.25 · 10.25, 15x9 · 11.75x6 of ink, 6 · 3 clear inside; rings centred 5.25 and 15.75 · 5.25 and 13, 1.5 clear under the basket; the rear ring sits under the post because at 20 two 4.5 rings do not fit beside each other inside the floor. At 16 a ring that keeps the 1.5 counter would be 4 of ink, a third of the 12-unit box, and reads as two buttons, so the rings are removed and 16 is H's drawing with dots. Ink 18x18 · 14x14 · 12x12, box-centred. Filled: the rings become solid discs of 4.5 ink; basket solid; handle and post stay lines. Lucide's wheels; heavier than anything in the set so far. -->
