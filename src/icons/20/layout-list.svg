<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: list view, thumbnails, media list, details, items, tiles and lines -->
  <!-- Thumbnails and lines: Lucide layout-list, Nucleo grid-list, Tabler list-details, built on grid itself. Grid's left column of tiles is kept exactly (ink 3→10.5 and 13.5→21 · 3→8.5 and 11.5→17 · 2→6.75 and 9.25→14; cells 7.5 · 5.5 · 4.75, radius 1 · 0.75 · 0.75, counters 4.5 · 2.5 · 2.25) and grid's right column of tiles becomes two lines per tile, spanning that column exactly (line ink 13.5→21 · 11.5→17 · 9.25→14, so 7.5 · 5.5 · 4.75 long, the tile's width). Toggling grid and layout-list, the left tiles do not move and the ink box is identical, 18 · 14 · 12 square. Rhythm: row pitch 10.5 · 8.5 · 7.25 (grid's); air between a row's two lines 2.5 · 2 · 1.75 and between rows 5 · 4 · 3.5, half of it at every master, so each pair groups with its tile (lines flush with the tile edges would leave 4.5 · 2.5 · 2.25 inside a row against 3 · 3 · 2.5 between rows, and the middle two lines would pair up instead). Line centres 4.75 / 8.75 / 15.25 / 19.25 · 3.75 / 7.25 / 12.75 / 16.25 · 2.625 / 5.625 / 10.375 / 13.375: at 24 the pair is centred in its tile (inset 1 top and bottom); at 20 and 16 each pair sits a quarter unit toward the outside of the icon (inset 0 and 0.5) so every line has one solid pixel row instead of two grey ones. Tile to line 3 · 3 · 2.5 (grid's gutter). Margins 3 · 3 · 2 from the canvas on all four sides. Tightest air at 16: 1.75 between a row's two lines. At 16 against list-bullet: two hollow 4.75 squares and four short lines, not small dots and three long lines; against grid: the right column is lines, not tiles; against rows: no frame and nothing runs wall to wall. Box-centred like grid. The mass sits left of centre (x 10.86 · 9.26 · 7.37 outline, measured by sampling) because the tiles outweigh the lines; moving it right would break the grid pairing. Cost: at 16 it inherits grid's quarter-pixel inner tile edges (6.75 / 9.25). Filled: grid-filled's two solid tiles; the lines stay at the outline weight 1.5 · 1.5 · 1.25, as list-bullet-3-filled's do; box unchanged (recommended: it is the picture most sets call layout-list, it is grid with one column changed so the pair toggles cleanly, and at 16 it cannot be mistaken for list-bullet, rows, table or columns-2) -->
  <path d="M4.5 3.75H7A0.75 0.75 0 0 1 7.75 4.5V7A0.75 0.75 0 0 1 7 7.75H4.5A0.75 0.75 0 0 1 3.75 7V4.5A0.75 0.75 0 0 1 4.5 3.75Z"/>
