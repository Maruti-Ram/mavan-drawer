<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: window, app, application, key, api key, license, credential, access, token, secret, badge -->
  <!-- box: 16x14 -->
  <!-- base: window -->
  <!-- Window, key badge, tooth set back: Key badge on the window, tooth set back at every master: the shipped window, unchanged and in place, with passkey-2's key lying flat as a C33 badge on its bottom-right corner (bow left, shank level to the right, one tooth down, as key-5 lies), the key's ink corner on the margin edge (22 · 18 · 15) — the picture Nucleo window-key draws. At 24 and 20 identical to A: bow ⌀6 · 5 outer (centreline radius 2.25 · 1.75, air inside 3 · 2), tooth 2.25 · 1.75 long, 2 · 1 short of the tip; at 24 passkey-2's key verbatim, turned a quarter clockwise. At 16 the tooth stays set back, as in every shipped key (key, key-5, passkey, passkey-2 all set it 1.75 back at 16): tooth at x 13.375, 1 short of the tip as at 20, 1.75 long; to keep it there with 1.5 to the bow and 1.5 of bottom wall past its corner, the bow is a ring of radius 1.5 at 9.125,12.625 — 4.25 across, air inside 1.75 (floor 1.5) — 0.5 smaller than passkey-2's 4.75, its bottom 0.25 above the margin (the tooth and the tip reach it). Ink 11×6 · 9×5 · 8×4.5 (x 11–22, y 16–22 · x 9–18, y 13–18 · x 7–15, y 10.5–15); against password-lock's lock (8×9.5 · 7×8.25 · 6×7) smaller by area (66 · 45 · 36 against 76 · 58 · 42) and 1.5 · 0.75 · 1 longer on its long side, as a key lies long. Box 20×18 · 16×14 · 14×12: the window's 20×16 · 16×12 · 14×10 plus the 2 the key stands below it; centre 12,13 · 10,11 · 8,9, 1 below the canvas centre at every master, the same as window-pointer; like window-pointer it declares base: window, so lint holds it to window's left, top and right edges instead of the centre. Cut back by hand with 1.5 of air from the key's ink: the right wall stops at y 16 · 12.5 · 9.875, 8.75 · 5.75 · 4.75 past its corner (air to the tip 1.5 · 1.5 · 1.5); the bottom wall stops at x 8.75 · 6.75 · 4.875, 3.5 · 2 · 1.75 past its corner (air to the bow 1.51 · 1.51 · 1.51); the bottom-right corner goes. Bow to tooth 1.5 · 1.5 · 1.5. Traffic lights: all three stay at every master: the third dot is 7.05 · 4.15 · 3.40 from the bow. Tightest air: outline 1.5 · 1.5 · 1.5; filled 1.5 · 1.5 · 1.5 (the cut to the key, by construction). Filled: window-filled's slab cut along the key's ink grown by 1.5 — the grown shank's top edge at y 16.75 · 13.25 · 10.5, then an arc r 4.5 · 4 · 3.625 round the bow — with the three junctions eased 0.5 (right edge, shank to bow, bow to bottom edge); the right edge stops at y 16.25 · 12.75 · 10 and the bottom edge keeps to x 9.03 · 7 · 5. All three holes stay (window-filled's, 2 · 2 · 1.5 across); solid from the third hole to the cut 5.55 · 2.65 · 1.90 (floor 1.5 · 1.5 · 1.25). The key fills as key-filled and passkey-filled do: the bow solid to its outline's outer edge with a round hole ⌀2 · 1.5 · 1.75 (passkey-filled's at 24 and 20; at 16 the outline's own 1.75 of air, which keeps one clear centre pixel where a 1.5 hole rendered grey; solid round it 2 · 1.75 · 1.25, the line weight), shank and tooth stay lines at 1.5 · 1.5 · 1.25. It fills because window-filled is a shape: shapes fill and their lines stay at the outline weight, as password-lock's lock body fills on password-filled. passkey-2-filled keeps its key all line only because its base is fingerprint's bold line print at the filled weight. Filled ink box identical. Off-grid decimals: none in the outline; in the filled twin only the cut's tangent points and its 0.5 fillets (18.18, 17.76 16.52, 9.52 19.45, 9.03 · 15.06, 14.67 13.06 · 12.307, 11.922 10.318, 5.501 12.515, 5.002). Risk: at every master the shank lies 0.25 off the line of the window's bottom edge and shares its pixel row at 16, so key and frame meet on one line; the ring breaks it. At 16 the ring's edges sit a quarter off whole pixels and render a little softer than A's. (recommended: at 16 it reads as ring, shank, tooth and tip, the same key as at 24 and 20 and as key-5 and passkey-2, where A's tooth at the tip reads as a hook) -->
  <path d="M6.75 15.25H4.75A2 2 0 0 1 2.75 13.25V6.75A2 2 0 0 1 4.75 4.75H15.25A2 2 0 0 1 17.25 6.75V12.5"/>
  <path d="M5.75 8A0.25 0.25 0 1 0 6.25 8A0.25 0.25 0 1 0 5.75 8Z"/>
  <path d="M9.25 8A0.25 0.25 0 1 0 9.75 8A0.25 0.25 0 1 0 9.25 8Z"/>
  <path d="M12.75 8A0.25 0.25 0 1 0 13.25 8A0.25 0.25 0 1 0 12.75 8Z"/>
  <path d="M9.75 15.5A1.75 1.75 0 1 0 13.25 15.5A1.75 1.75 0 1 0 9.75 15.5Z"/>
  <path d="M13.25 15.5H17.25"/>
  <path d="M16.25 15.5V17.25"/>
</svg>
