<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: tape, reels, answering machine, message -->
  <!-- box: 16x7 -->
  <!-- Tape reels: Rhythm: two identical rings ⌀9 · 7 · 6 of ink (centreline r 3.75 · 2.75 · 2.375), 2 · 2 · 2 of air between them, centre pitch 11 · 9 · 8; the tape runs centre to centre along the rings' bottoms, its ink flush with theirs, so the box is the rings' own height. Hole 6 · 4 · 3.5 (holds 1.5 at 16 with 2 to spare). Ink 20×9 · 16×7 · 14×6, agreed box: a wide two-part mark like toggle-off, which settled on an agreed box of the same widths (20×12 · 16×10 · 14×8) instead of `keyline: mark` (mark ≤ 18 · 14 · 12 would shrink the rings to ⌀8 · 6 · 5); box-centred, symmetric left–right. At 24 and 20 the top and bottom edges fall on half pixels (7.5–16.5, 6.5–13.5), the price of keeping the group centred; 16 sits on whole pixels. Filled: the rings fill to discs ⌀9 · 7 · 6 with a hub hole ⌀3 · 3 · 2 (material 3 · 2 · 2, film-reel's ⌀3 holes), the tape stays 1.5 · 1.5 · 1.25; ink box identical. Who: Lucide voicemail, Material voicemail, SF Symbols recordingtape, Phosphor Voicemail, Tabler voicemail, Hugeicons, Carbon, IconPark, Font Awesome, Bootstrap, Nucleo, Mage. (recommended) — it is the picture nearly every set and phone uses for voicemail, and the only one here whose reels keep a real hole at every size without a gap note. -->
  <path d="M2.75 10A2.75 2.75 0 1 0 8.25 10A2.75 2.75 0 1 0 2.75 10Z"/>
  <path d="M11.75 10A2.75 2.75 0 1 0 17.25 10A2.75 2.75 0 1 0 11.75 10Z"/>
  <path d="M5.5 12.75H14.5"/>
</svg>
