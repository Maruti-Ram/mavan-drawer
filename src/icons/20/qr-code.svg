  <!-- Finders with a dot: Rhythm at 24: finders 8 outer with a 2-unit centre dot and 1.5 of air all round it (counter 5), finder gap 2; the data is five 2-unit modules in an X on pitch 3 (the dot is one module, so finder and data share one module size), module to finder 2, diagonal module air 2.04. At 20 and 16 the dot cannot be drawn: a finder with a dot needs two walls, two 1.5 airs and a dot, at least 7.5 at 20 and 6.75 at 16, and two of them side by side (15 · 13.5) overflow the 14 · 12 keyline. So the dot drops there (the rule working) and B becomes A's finders (6 · 5, gap 2 · 2) with the X reduced to its diagonal pair, 2.25 · 1.75 square, diagonal air 2.74 · 2.64. Honest limit: at 20 and 16 B differs from A only by one module. Ink 18×18 · 14×14 · 12×12, box-centred. Filled: finders solid — at 24 a white ring round the dot would be the outline drawing itself, so the dot merges into the solid finder (Phosphor's fill does the same); modules unchanged; ink box identical. Who: Fluent qr-code, Heroicons qr-code, Tabler qrcode, Carbon qr-code, Boxicons qr, Ant Design qrcode, Bootstrap qr-code, Solar, Nucleo qrcode, Untitled qr-code-02 — the most common construction at 24, which is why it is on the board. -->
