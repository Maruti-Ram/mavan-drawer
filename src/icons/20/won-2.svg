<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: won, korean won, krw, south korea, currency, money, sign, two bars, wide, straight legs -->
  <!-- box: 16x13 -->
  <!-- Two bars centred on A’s bar: A’s W unchanged; two bars centred where A’s one bar sits (y 12.5 · 10.5 · 8.75), at y 10.5/14.5 · 8.75/12.25 · 7/10.5 — 4 · 3.5 · 3.5 apart, ₦’s spacing; white between them 2.5 · 2 · 2.25 outline, 1.5 · 1.5 · 1.5 filled. Same length as A’s bar, margin to margin, 1.5 past the top corners. The sign’s weight stays where A’s is. Cost: the top bar crosses higher, where the leg is nearer the corner, so its ends are short — tip air outline 2.16 · 1.69 · 1.84, filled 0.92 · 1.08 · 0.92, so every filled master carries a gap note, well under the family’s 1.25 (₦ and € carry 1.25 at 16 only). At 16 filled it reads as a dense ₩ with two dark lines, as filled ₦ does; the cells between the legs fill solid. (recommended) -->
  <path d="M4.25 4.25L7 15.75L10 4.25L13 15.75L15.75 4.25"/>
  <path d="M2.75 8.75H17.25M2.75 12.25H17.25"/>
