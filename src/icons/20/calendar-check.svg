  <!-- box: 15x15 -->
  <!-- Check on the calendar corner: The shipped calendar (default shape, C9), verbatim and in place (ink 18×18 · 14×14 · 12×12 at 3–21 · 3–17 · 2–14), with the V2 check badge copied string-for-string from the spec (badge-check's mark: ink 8.6×6.09 · 6.58×4.69 · 5.7×4.08, x 13.4–22 · 11.42–18 · 9.3–15, y 15.91–22 · 13.31–18 · 10.92–15) on its bottom-right corner, its ink corner on the margin edge (22 · 18 · 15), C33, at the outline weight in both styles. Box 19×19 · 15×15 · 13×13 (declared), calendar-repeat's: the calendar plus the 1 the check stands right of and below it; centre 12.5 · 10.5 · 8.5, 0.5 toward the badge, so no base note. Cut back by hand with 1.5 of air from the check's ink, each path at its own weight, as calendar-repeat, -2 and file-check are; the bottom-right corner arc goes whole at every master. Right wall: at 24 and 20 it stops at y 13.75 · 11 (cap ink to 14.5 · 11.75, clear of the check's box top), 5.5 · 3.25 past its top corner and 4 · 2.25 below the header line; the long arm's tip cap decides it, air 1.58 · 1.72 (one grid step lower would leave 1.34 · 1.48). At 16 it stops at the header line, y 7.625, 1.5 past its top corner, as calendar-repeat and -2 end that wall at 24 (V on the header line's y): the 1.5 of air would let it run on to y 8.875, but that tail would be only 1.25 below the header line, shorter than 1.5, and C33 removes a stub; air at its end 2.80. Bottom wall: stops at x 11.25 · 9 · 7.125 (cap ink to 12 · 9.75 · 7.75, clear of the check's box left edge), 5 · 3.25 · 3 past its corner; the short arm's left cap decides it, air 1.54 · 1.68 · 1.56 (one step further would leave 1.30 · 1.43 · 1.44). No line enters the check's box at any master. Top wall, both top corners, left wall, bottom-left corner, the header line (whole, 5.48 · 3.90 · 2.80 of air above the check) and both pegs untouched. Tightest air, outline: 1.54 · 1.68 · 1.56 (the bottom wall's end). Filled: calendar-filled's header band and pegs verbatim (the header 6.94 · 5.33 · 4.00 clear of the check); the page solid cut along the check's ink grown 1.5 (radius 2.25 · 2.25 · 2.125 round its centreline). Each end of the cut follows the outline's end (spec 4a): at 24 and 20 the right side runs down the outline's outer edge (x 21 · 17) into the right wall's own round cap (r 0.75 on 20.25,13.75 · 16.25,11), joined to the grown cut by the straight line tangent to both (0.69 · 1.17 long; the caps stand 0.08 · 0.22 clear of the cut); at 16, where the wall ends at the header line, the page's right side ends at the header band too: the page keeps the shipped top-right rounding (0.5, from 13.5,8.5 to 14,9), and 0.07 below it the side turns into the cut with a 0.5 ease (fillet centre 13.5,9.071, meeting the check's grown tip at 13.667,9.542), as file-plus's right edge turns into its plus's cut, so the page's top-right is a round end 1.04 tall (y 8.5 to 9.54). The bottom edge ends in the bottom wall's own cap (on 11.25,20.25 · 9,16.25 · 7.125,13.375), joined the same way (0.47 · 1.06 · 0.58 long; 0.04 · 0.18 · 0.06 clear of the cut). Inside the check's V the solid follows the grown ink down to a tab eased 0.5 (spec 4b; fillet centre 16.35,17.67 · 13.72,13.71 · 11.33,10.92): at 24 between the two arms' grown sides, at 20 and 16 between the long arm's grown side and the short arm's grown cap, the short arm being too short there for its side to reach, as file-check. Tightest air, filled: 1.500 · 1.502 · 1.500. The check stays a line at 1.5 · 1.5 · 1.25. Off-grid decimals: the check's own (V2 spec) and, in the filled twin, the tangent points of the joins, of 16's 0.5 ease into the cut and of the V's 0.5 fillet, rounded to 2 · 2 · 3 dp away from the check so the air never falls under 1.5. At real pixels the calendar reads whole at 20 and 16 (top edge, both pegs, header line, left side) with the check in its corner, as file-plus carries its plus. -->
  <path d="M9 16.25H5.75A2 2 0 0 1 3.75 14.25V7.75A2 2 0 0 1 5.75 5.75H14.25A2 2 0 0 1 16.25 7.75V11"/>
