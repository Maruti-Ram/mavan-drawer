  <!-- Slightly wider, every master: A's drawing with the pair taken 1 wider on each side: ink 20x18 · 16x14 · 14x12 (agreed box), front panel 17x15 · 13x11 · 11x9, everything else A exactly - offset 3, radius 2.5 · 2 · 1.5, the same back L and the same band rule. 16 chose the step, not the eye: on the eighth grid only an EVEN ink width keeps the outer edges on whole pixels (13 would land them on 1.5 and 14.5), so the move from 12 is to 14 - which is also the margin edge and the circle keyline's width. +2 at every master follows from that, and it lands the box exactly between the square keyline (18 · 14 · 12) and the landscape one (20x16 · 16x12 · 14x10). What the width buys: the front panel's clear counter goes 12 to 14 at 24, 8 to 10 at 20 and 6.5 to 8.5 at 16, so the front sheet reads as a rectangle instead of a rounded square - and the pair stops sharing a silhouette with shipped images, whose 16 master is two rounded squares on the square keyline offset 3, the same two paths as J on this board. What it costs: a panel wider than it is tall stops reading as paper (paper is portrait) and starts reading as a card or a window, and 14x12 at 16 sits only 2 off credit-card's landscape box - copy would be neither image's square nor credit-card's landscape. White is A's, unchanged: outline 1.5 · 1.5 · 1.75, filled 1.5 · 1.5 · 1.5, the band 1.5 on its straights and 2.74 at the corner. -->
