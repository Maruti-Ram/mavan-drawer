  <!-- Classic piece: two knobs, two sockets: The whole jigsaw piece: knobs top and right, sockets bottom and left - the piece from the middle of the puzzle, the silhouette people draw when they draw 'puzzle'. Knob feet rounded at half the stroke weight in the filled (0.75 · 0.75 · 0.625, the set's bend radius, as puzzle-4; was 0.25, a quarter pixel at 16 that rendered as a nick); outline foot centreline 1.5 · 1.5 · 1.25 (was 1 · 1 · 0.875), outline and filled changed together, so the filled edge is still the outline's outer edge exactly. The knobs do not move: the wider feet fit on their own edge (top knob centre x 10.25 · 8.25 · 6.25, right knob centre y 14 · 12 · 9.75, both unchanged), landing 1.79 and 1.54 · 0.29 and 0.04 · 0.32 and 0.32 short of the corners on either side, so at 20 the knob's far foot runs almost straight into the 2 corner. Head 5 · 5 · 4.5 across, standing 3.75 · 3.75 · 3.5 proud, unchanged; the neck clear inside widens to 1.92 · 1.92 · 1.86 (was 1.62 · 1.62 · 1.58). The two sockets share a corner, so at 20 and 16 they are round notches (R1.625 · R1.5, the 16 one puzzle-2's notch radius) set 0.25 away from that corner; sockets unchanged: socket 3.75 · 2.625 · 2.125 deep, mouth clear 1.62 · 1.75 · 1.75, and their filled mouth corners are convex 1.75 · 1.75 · 1.25, so they carry no pinch (the outline's white counter turns 0.25 · 0.25 · 0 at the mouth, as puzzle-4's seam mouths do). Circle keyline, corners 2.5 · 2 · 1.5. Ink 20x20 · 16x16 · 14x14 both styles. Smallest gap anywhere is now the socket mouth, 1.62 · 1.75 · 1.75 (floor 1.5). Every curve is a tangent arc. New decimals: each foot's centre sits 3.211 (24, 20) or 2.806 (16) off the knob's axis, where an arc of the foot radius resting on the edge touches the head, so the feet meet the edge at 7.04 / 13.46 and 10.79 / 17.21 (24), 5.04 / 11.46 and 8.79 / 15.21 (20), 3.444 / 9.056 and 6.944 / 12.556 (16), and meet the head at 8.52 / 11.98 (y 4.77) and 12.27 / 15.73 (x 19.23) in the 24 outline, 7.78 / 12.72 (y 4.88) and 11.53 / 16.47 (x 19.12) in the 24 filled, 6.52 / 9.98 (y 4.77) and 10.27 / 13.73 (x 15.23) in the 20 outline, 5.78 / 10.72 (y 4.88) and 9.53 / 14.47 (x 15.12) in the 20 filled, 4.664 / 7.836 (y 3.603) and 8.164 / 11.336 (x 12.397) in the 16 outline, 4.054 / 8.446 (y 3.739) and 7.554 / 11.946 (x 12.261) in the 16 filled; the sockets' decimals are S's, unchanged. (recommended: looked at in real pixels at 16 and 20, the knob feet now render as soft flares where the knob meets the piece, with no nick and no step, like puzzle-4's; nothing else about the piece changes, and nothing had to move to make room) -->
