  <!-- Corner badge: Polaris's picture, file-down-2's: the shipped desktop in place with v3-kit-arrow.md's down badge on its bottom-right corner, string for string, ink corner on the margin edge (22 · 18 · 15), which is also the screen's own right edge. Badge: arrow-down's classic head at badge size, legs 45°, C10 bend 0.75 · 0.75 · 0.625 reaching the shaft's end, half-width 2.5 · 2.5 · 2.25 — C37's floor, leg cap to shaft 1 · 1 · 1 in both styles (the badge stays at the outline weight); badge ink 6.5×9.5 · 6.5×8 · 5.75×7.125, shaft at x 18.75 · 14.75 · 12.125. Cut back by hand with 1.5 of air from the badge's ink: the screen's right wall stops at y 11.5 · 9 · 6.875, 5.25 · 3.25 · 2.75 past its corner (air 1.55 · 1.55 · 1.53 to the shaft's top); the bottom-right corner goes; the bottom edge stops at x 15 · 9.75 · 7.875, 9.75 · 5 · 4.75 past its corner (air 1.58 · 1.59 · 1.59 to the left leg). The stand pays. At 24 the neck stays whole (air 2.75 to the left leg) and the foot stops at x 13.25, 5 long, 3.75 left of the neck and 1.25 right (air 1.73). At 20 and 16 the left leg's end sits 2.25 · 1.875 from the neck's centreline (air 0.75 · 0.625), so no part of the neck can keep 1.5 and it goes; the foot keeps x 7.25 to 9.25 · 5.625 to 7.25, 2 · 1.625 long, ink 3.5 · 2.875 (air 1.73 · 1.56). At real pixels that foot is a short dash under the screen's left half: it still says 'stand', on its own; without it the screen reads as a plain card. Box 20×19 · 16×15 · 14×13 (declared): the desktop plus the 1 the badge stands below its foot; centre 12,12.5 · 10,10.5 · 8,8.5, 0.5 low at every master, so the desktop keeps its place without a base note (lint: no warning). Filled: desktop-filled's solid cut along the badge's centreline grown by 2.25 · 2.25 · 2.125: from the grown round of the shaft's top down its band at x 16.5 · 12.5 · 10, round the left leg's end to the bottom edge, which now stops at x 15.23 · 9.98 · 8.04, each junction eased 0.5. The solid's right edge keeps an ear down to y 11.75 · 9.25 · 6.875, 0.25 · 0.25 · 0 below the outline wall's end (11.5 · 9 · 6.875), its foot squared with 0.5 corners and 1.57 · 1.57 · 1.51 of solid between the cut and the outer edge where it turns; lower down that strip would be 1 · 1 · 0.75 beside the band, thinner than the line weight, so it goes with the cut. Neck (24) and foot stay lines at the outline weight. Tightest air: outline 1.55 · 1.55 · 1.53 (wall end to shaft top); filled 1.5 · 1.5 · 1.5 shaft band, 1.508 · 1.508 · 1.501 left leg; head air 1 · 1 · 1. Off-grid decimals: the badge's leg ends and bend tangents (the kit's), and in the filled twin the cut's tangent points, worked at 0.005 · 0.005 · 0.002 more than the grown radius so the 2 and 3 dp values keep 1.5, and the 0.5 corners. Lint: clean. Ships as desktop-download-2. -->
