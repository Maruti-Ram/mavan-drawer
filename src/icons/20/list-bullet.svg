  <!-- Small discs, menu rows: A real bullet at every size: a small solid disc, a third wider than the line is thick at 24 (⌀ 2 · 2 · 1.75 against a 1.5 · 1.5 · 1.25 stroke; ink 3.5→5.5 · 3.25→5.25 · 2.375→4.125), on menu's rows in the full mark box. The disc is a closed two-arc circle of radius 0.25 · 0.25 · 0.25 on the centreline (C17's dot construction: outer ⌀ = 2r + stroke). Rows are menu's own rows (centrelines 7.5 · 12 · 16.5 at 24, 5.5 · 10 · 14.5 at 20, 3.5 · 8 · 12.5 at 16 — the 1.5-era lines menu holds at 16), so the line air is menu's 3 · 3 · 3.25. Gap rule: §6's 1.5 on the FILLED drawing — outline dot-to-line 2 · 1.75 · 1.875, filled 1.5 · 1.5 · 1.5 — and the disc size is what the 4.5 pitch allows: the filled dots (⌀ 3 · 2.5 · 2.5) stand 1.5 · 2 · 2 apart, exactly the floor at 24; one step larger (⌀2.5, J's dot) would leave 1.0 there, which is why J needs wider rows. Lines 13.5 · 10 · 8 (ink 7.5→21 · 7→17 · 6→14). Box 17.5×11 · 13.75×11 · 11.625×10.75 (the dot, not the line, is the top and bottom edge: it is taller than the line). Placement: the filled twin fills the mark box centred (box 18×12 · 14×11.5 · 12×11.5); the outline sits inside it, right of centre by half the dot's growth (centre x 12.25 · 10.125 · 8.188), because a dot grows from its centre while a line end pulls in — the growth is one-sided and only one of the two styles can sit on the axis. Filled: C17 — discs grow from their centres, lines thicken in place to 2.5 · 2 · 2 with their far end pulled in 0.5 · 0.25 · 0.375 so the right edge holds; grows 0.5 0 0.5 0.5 · 0.25 0 0.25 0.25 · 0.375 0 0.375 0.375. Row air 3→2 · 3→2.5 · 3.25→2.5, dot-to-dot 2.5→1.5 · 2.5→2 · 2.75→2. At 16 the dot is 1.75 px (filled 2.5 px) beside a 1.25 px line: still a dot, not a speck, and the filled twin does not blob. Nearest candidate at 16: J, the same dot, gap and line on rows 0.25 further apart; nearest shipped at 16: more-vertical, whose dots are 2.4 across — these are 0.65 smaller, so the two never read as the same mark. (recommended: the bullet reads as a bullet at 16 in both styles, the rows are menu's so the two sit as one family, and every gap sits on §6 with no special case) -->
