  <!-- Bar cut through: What the eye sees: the teardrop pin struck in two by the bar: the head's crown from about 11 o'clock round to 4 o'clock, and the left side running down into the tip and a short way back up the right side. No ring. Filled: a half-disc crown and a tapered wedge holding the tip, the bar whole between them; at 16 in real pixels the filled reads as diagonal stripes, as cloud-off's does. The bar (C21, second ruling 2026-10-25): \ at 45°, its ink the square keyline 18 · 14 · 12, centred on the pin's ink centre 12,12 · 10,9.75 · 8,7.75 (on the grid at every master): centreline (3.75,3.75)-(20.25,20.25) · (3.75,3.5)-(16.25,16) · (2.625,2.375)-(13.375,13.125). It stands 1 past each side of the pin and inside its top and bottom. The pin stays in place (C34); the composite is 18×20 · 14×15.5 · 12×13.5, outline and filled, declared as a box, centred as map-pin is (0.25 high at 20 and 16). With the full keyline bar the cut is identical to the morning's pin-wide bar: every piece and both filled solids are unchanged, only the bar is longer. Pieces (24 · 20 · 16): lower piece 18.30 · 11.69 · 9.30, crown 19.55 · 12.87 · 10.65; the pin outline keeps 75 · 66 · 62% of its length. The ring inside the head is dropped at every master. The cut rule alone would keep an arc of it at 24 and 20 (122° / 6.90 long and 77° / 3.02 long); at 16 it falls wholly inside the cut (its farthest centreline point 2.61 from the bar's centreline against the 2.75 a cut end needs). It is dropped so every master shows the same pieces (bug-off's precedent) and because the kept arc, concentric inside the head's own arc, reads as a wifi or hearing sign, not a hole (drawn and looked at). The filled hole goes with it. Mass from the canvas centre, outline +0.16,−0.48 · +0.21,−0.59 · +0.25,−0.55 (map-pin 0,−1.15 · 0,−1.18 · 0,−1.06); filled +0.34,−0.95 · +0.38,−0.95 · +0.42,−0.93. Cut as cloud-off and bug-off: every stroke stops 1.5 clear of the bar's edge (air at the cut ends measured 1.512 · 1.505–1.512 · 1.501–1.502); pieces under 1.5 go; filled, a channel 4.5 · 4.5 · 4.25 wide is knocked out of the solid (corners r0.75 · 0.75 · 0.625 on the outline's cut-end centres), its white 1.506 · 1.506 · 1.501 each side, and the bar runs whole through it at 1.5 · 1.5 · 1.25. Off-grid decimals are the cut ends and the channel corners, where the circles put them; a cut arc that passes its circle's top or side is pinned there (one extra node on the grid) so the ink box stays exactly the base's. (recommended) -->
