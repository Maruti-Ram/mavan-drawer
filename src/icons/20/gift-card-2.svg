<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: gift card, voucher, bow, ribbon, card, round loops, tails, redeem, store credit -->
  <!-- box: 16x14 -->
  <!-- Round loops with tails: A4 refined, with tails at every master: the full cross (ribbon left of centre top to bottom, band across) and two round loops on the crossing — teardrops with their point on it, straight sides on the ribbon and the band — and two tails under it (Fluent Gift Card construction). The card is credit-card's construction (radius 2.5 · 2 · 1.5) on an agreed box of 20×16 · 16×14 · 14×12, centred: the landscape keyline at 24, and at 20 and 16 one unit taller than round 1's 16×13 · 14×11 (two over credit-card's 16×12 · 14×10), so it is 1.25 · 1.14 · 1.17 wide for 1 tall. That unit is what makes room for the tails: with the bow 1.5 under the top wall, round 1's card left 3.5 · 3 of white under the band at 20 · 16, and tails that hold 1.5 at their tips need 4.5 · 4 (their drop, their round end, 1.5 to the bottom wall). Loops radius 1.75 · 1.75 · 1.375 (A4's 1.625 at 16 gives back 0.25 to make room for the tails), counters 2 · 2 · 1.5; ribbon at x 9.25 · 9.25 · 7.625 (36 · 45 · 47% across), band at y 12.25 · 10.25 · 8.125; air above the loops 2.5 · 1.5 · 1.5 and under the tails 2.5 · 1.5 · 1.5, loops to the left wall 1.5 · 1.5 · 2. Tails as A5's: 3 along 3 down at 24 and 20 (tip air 1.75 to band and ribbon), and at 16 the ribbon stops at the band and the tails hang at 29° (1.375 along, 2.5 down; 1.65 to the band, 1.5 tip to tip). Filled: Fluent's — the cross and the tails cut as 1.5 of white, each loop a white ring round a dark island 2 · 2 · 1.25 across. Round loops cannot be opened as gift's are: below the band their round end curls back toward the ribbon and would leave 0.25 of dark, so the only choices are islands or A4's solid white dome; islands kept, as the dome was the blob. Off-grid decimals, filled file only: where each loop's white meets the ribbon and the band (fillets 0.25), and the tails' white edges and round ends at 45° and 29°; lint does not judge the tails' wedge with the band (a V on a line), so tip air is measured by hand at equal reach. At 16, 1×: outline, a small knot on a cross; filled, the two 1.25 islands are grey dots in a white lump and read as a face. The weakest filled of the three. -->
  <path d="M2.75 5.75A2 2 0 0 1 4.75 3.75H15.25A2 2 0 0 1 17.25 5.75V14.25A2 2 0 0 1 15.25 16.25H4.75A2 2 0 0 1 2.75 14.25V5.75Z"/>
