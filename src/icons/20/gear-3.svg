  <!-- tags: settings, preferences, cog, fine, wheel, spokes -->
  <!-- box: 16x16 -->
  <!-- Spoked wheel, three spokes: The reference's wheel: the same thin rim and single-stroke teeth, and inside it three spokes running from the centre to the rim, no hub ring - a watch wheel rather than a stamped gear. The spokes sit on teeth (a spoke continues into a tooth, as on a real wheel), which fixes the counts to multiples of three: 15 · 12 · 9; nine at 16 is the finest count divisible by three that holds 1.5 of air. Spokes at 0/120/240 degrees from the top (one up, two down: the star, not the Y), meeting at the centre with round joins, 6.75 · 5.25 · 4 long from the centre to the rim's inner edge. Fifteen and nine are odd counts, so no tooth sits opposite another: the ink is 19.9×19.8 · 16×16 · 13.81×13.62, an agreed box, and at 24 and 16 the box sits 0.1 · 0.19 above the canvas centre (a tooth on top, a valley at the bottom; inside lint's 0.5). Every spoke is off the 0/45/90 grid except the vertical one: angle exception, as gear's 60 degrees. 15 · 12 · 9 teeth every 24° · 30° · 40°; outer ⌀ 20 · 16 · 14, rim outer edge ⌀ 16.5 · 13.5 · 10.5, open inside ⌀ 13.5 · 10.5 · 8, rim one stroke thick; teeth stand 1.75 · 1.25 · 1.75 proud, 1.5 · 1.5 · 1.25 wide. Air between neighbouring teeth where they leave the rim (the eye's gap, at the rim's outer edge) 1.95 · 2.02 · 2.39; what lint measures is the tooth roots on the rim's centreline, under the rim's own ink: 1.62 · 1.61 · 1.91 (from the rounded text 1.61 · 1.6 · 1.91). Filled: the body of a fine gear is its rim, so the filled twin fills the rim and teeth as one band 2.5 · 2 · 2 deep (the line-heavy filled weight) on the outline's outer edge, open centre ⌀ 11.5 · 9.5 · 6.5 kept; the spokes stay lines at the outline weight (a shape icon keeps its strokes), so the filled twin is a heavier wheel, not a disc. Smallest gap 1.62 · 1.61 · 1.91. Off-grid numbers are rotated points only; every radius, tooth length, ring and axis point is on the quarter grid, eighth at 16. -->
