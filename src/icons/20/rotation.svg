  <!-- Ring half dashed: The ring half solid, half dashed, one head: Material Symbols rotate_left and rotate_right, the rotate control in Android and Google Photos. A rotate-ccw ring variant, not a new metaphor: rotate-ccw's ring and head verbatim on the top half (rotate-ccw-4's arc, 3 o'clock over the top to the head at 10:30), and the bottom half, from rotate-ccw's free end round to 3 o'clock, broken into three dashes. Rhythm and balance: C35 keeps its air and the dash gives way to a whole count, as on circle-dashed: dashes 4.73 · 2.39 · 1.68 on the arc, 2.24/2.25/2.25 · 1.82/1.82/1.82 · 1.55/1.55/1.55 of air between dashes and from the last dash to the solid; three dashes at every master (a fourth at 16 would leave dashes 0.95 long). Opening from the first dash to the head 1.8 · 1.54 · 1.52, rotate-ccw's. Head counter 2.04 · 1.5 · 1.58. Ink 17.88×17.88 · 13.57×13.58 · 11.4×11.4, rotate-ccw's box, centred 11.94,11.94 · 10.04,10.04 · 7.95,7.95. Filled: C35's rule for a mark beside dashes — the dashes stay lines at the outline weight and the arrow alone goes to 2.5 · 2 · 2, drawn as filled shapes (select-2's way) on rotate-ccw-filled's ring and head; its head counter is rotate-ccw-filled's, 0.82 · 0.9 · 0.67. The heavier arrow takes air from the dashes, so the filled dashes are re-spaced, not the outline's paths as C35 asks: the first starts 1.5 · 3 · 7° further round and they shorten to 4.45 · 2.18 · 1.32, keeping C35's air (2.26/2.25/2.25 · 1.82/1.82/1.81 · 1.55/1.55/1.55) and an opening of 1.54 · 1.54 · 1.55; ink box identical. Beside the set: circle-dashed is six dashes on a whole ring with no head, loader is eight spokes, rotate-ccw is this ring with no dashes — so it reads as rotate-ccw caught half-way, the one difference being the dashed half -->
