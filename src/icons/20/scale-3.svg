<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: parcel, shipping, platform, dial, package, nucleo -->
  <!-- Parcel scale: A box on a platform, with a post at the left rising to a round dial (Nucleo box-scale and baggage-scale). It is the shipping scale, so it says "shipping weight" and sits beside package. I drew this in place of the hanging spring scale, which no set we have draws. Ink 20×20 · 16×16 · 14×14 on the circle keyline, centred on the box. Dial ring r 2.25 · 2 · 1.5 (ink ⌀6 · 5.5 · 4.25, white inside 3 · 2.5 · 1.75). The post runs from the dial to the platform. The platform spans the full width, 2.25 · 2 · 1.5 of it left of the post. The box's walls stand on the platform line (it is the box's floor), with top corners at the detail radius 1.5 · 1.25 · 1, and a centre tape 3 · 2.5 · 2 long, as package has. Box 12.5 · 9.5 · 8.5 of ink wide. Air from the box to the post is 3 · 2.25 · 2. Filled: the dial is a disc, and the box is solid with its tape cut from the top edge as a 1.5 notch with a round end. Post and platform stay lines. Lopsided left to right (dial and post left, box right), so it needs an optical check (C14) if picked. At 16 it is the busiest of the five -->
  <path d="M2.75 4.75A2 2 0 1 0 6.75 4.75A2 2 0 1 0 2.75 4.75Z"/>
  <path d="M4.75 6.75L4.75 17.25"/>
  <path d="M2.75 17.25L17.25 17.25"/>
  <path d="M8.5 17.25V10.25A1.25 1.25 0 0 1 9.75 9H15.25A1.25 1.25 0 0 1 16.5 10.25V17.25"/>
  <path d="M12.5 9L12.5 11.5"/>
</svg>
