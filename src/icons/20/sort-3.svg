  <!-- box: 16x11.02 -->
  <!-- classic 45° — the set’s own chevron: A list and its control in one mark, in the state where nothing has been sorted yet. THE LINES carry G's three lengths — 4.75 / 7 / 2.5 of centreline at 24, 4 / 6 / 2 at 20, 3.5 / 5.25 / 1.75 at 16 — in the order medium, long, short. That is one of the four orders a sorted list cannot produce: sort-ascending and sort-descending are both wedges, growing or shrinking all the way down, and this is a bulge. THE CHEVRONS are the set's own, at the angle chevron-up and chevron-down actually ship (44.95 · 45 · 45.5, the 16 leaning half a degree the way every 16 master in this set leans) — not chevron-up-3's 52, which is what the first drawing of this icon inherited without anything choosing it. Channel between the two carets 4.14 · 4.64 · 3.45, which is the tightest that keeps the pair taller than the bar stack in the FILLED style, where the bars thicken in place (C17) and would otherwise set the ink box. Each caret's apex is the circle of radius half a stroke inscribed in the vertex, the construction G's own carets measure to within 0.003. The filled twin keeps the leg angle, pulls both ends in by half the added weight and re-solves the apex radius so the tip lands on the outline's own ink extreme — which is what holds the ink box identical in both styles, 18x11.52 · 16x11.02 · 14x9. BOX: 18x11.52 · 16x11.02 · 14x9 is wider than §2's mark keyline at 20 and 16, exactly as shipped `sort` is — it declares 16x13.5 · 14x12 for the same reason: two elements side by side need the width the family already agreed. (recommended) -->
