  <!-- Card with waves: credit-card with two waves on its bottom-right corner (Nucleo credit-card-contactless, Central credit-card-nfc): the card that pays by tap — would ship as credit-card-contactless, a C33 composite, if the bare waves win. Base is credit-card verbatim (body, stripe, bar; filled = credit-card-filled's two parts) and keeps its place (base: credit-card; 20×18 · 16×14 · 14×12, 1 below centre). Badge: two ±30° waves, radii 4.5/8.5 · 3.25/6.5 · 2.25/5 (pitch 4 · 3.25 · 2.75, air 2.5 · 1.75 · 1.5), 6/10 · 4.75/8 · 3.5/6.25 tall, outer crown and lowest ink on the margin edge 22 · 18 · 15. The card is cut back by hand: the right wall stops at the stripe (at 20 and 16 the piece below it would be under 1.5, so C33 removes it; 24 follows for the same picture), the bottom wall at 13.5 · 10.5 · 8.5, its cap 1.65 · 1.57 · 1.57 from the inner wave; the stripe's end keeps 2.66 · 1.62 · 1.58 from the outer wave. Filled: the lower part ends on the bottom wall's cap (same 1.65 · 1.57 · 1.57), the waves stay lines at 1.5 · 1.5 · 1.25 (a line badge on a shape base). At 16 the badge is small — the inner wave is 3.5 of ink — which is the cost of keeping the card whole. Off-grid values are the wave ends only: each wave is a circle whose centre and radius sit on the grid, its ends rounded to 2 · 2 · 3 dp. -->
