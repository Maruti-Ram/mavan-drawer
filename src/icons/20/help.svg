  <!-- Polaris bowl: Polaris’ construction on the C19 glyph gap: the bowl wraps 249° from just past 9 o’clock (r 3 · 2.25 · 1.75), then a reverse tuck (1.14 · 0.86) turns the terminal onto the axis, dot directly below. Counter 4.5 · 3 · 2, void/dot 0.5. At 16 a legal tuck needs a 0.57 radius, under half the stroke (C10), so 16 ends at the bowl’s foot — the one drawing 16 allows, shared by all three -->
