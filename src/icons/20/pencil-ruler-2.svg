  <!-- Side by side: Rhythm: ruler and pencil stand upright with 2 of air between them at every master, both the full height of the box, and the ruler's top tick sits exactly on the pencil's band at every master (y 6 · 6 · 4.5). The ticks run from the band's height down to the same height from the bottom, at one pitch 3 · 4 · 3.5 (air 1.5 · 2.5 · 2.25 between ticks, 1.75 · 1.75 · 1.63 to the end walls), L S L S L at 24, L S L at 20, three equal at 16. The ruler is ruler A stood upright. Width 6.5 · 5.5 · 4.75 on the centreline (ink 8 · 7 · 6): ruler A's 7.86 · 7.16 · 6.2 moved to the nearest whole-pixel ink widths (+0.14 · −0.16 · −0.2), so both upright walls are crisp. Ends r1.5 · 1.25 · 1. Ticks 2.75 / 1.5 · 2.5 / 1.5 · 2: ruler A's 2.83 / 1.41 · 2.47 / 1.41 · 2.12 put on the grid; at 16 a 2.12 tick would leave 1.38 to the far wall in the 4.75 width, so 2. The long ticks leave 2.25 · 1.5 · 1.5 to the inner wall. Pitch: ruler A's 3.18 does not fit at 24 (in the 20-tall box it leaves 1.39 at the ends, and 3.25 needs 20.5 of height), so 24 takes 3, which also lands on the band. At 20 and 16, ruler A's pitch on the grid (3.25 · 2.875) leaves the top tick 0.75 · 0.625 off the band, neither aligned nor clearly apart, so the pitch is the one that aligns, 4 · 3.5. Pencil 6 · 5 · 4 of ink wide: upright, the shipped 5.74 · 4.68 · 4.08 puts both walls on part pixels; the nearest whole-pixel widths are +0.26 · +0.32 · −0.08 away. Band 3.25 · 3.25 · 2.875 from the head and head corners r1.5 · 1.25 · 1, as shipped. Its point keeps the shipped 60°, so standing upright its edges run 30° from vertical: the angle exception was granted to the 45° pencil, and using it here needs Maruti's grant. Ink 16×20 · 14×16 · 12×14 (declared box; 16×20 is the portrait keyline), box-centred; mass −0.20,−0.32 · −0.03,−0.21 · −0.02,−0.15, ink 25.0 · 27.5 · 31.4% (wrench-screwdriver 21.7% at 24, 29.0% at 16). Filled: the ruler solid with 1.5 white tick slots (1.5 · 2.5 · 2 of material between them), the pencil as pencil-filled (body and head split by a 1.5 white band). Who: Remix pencil-ruler-2 (from memory), and the set's own wrench-screwdriver, which ships this arrangement. Honest read at 16: the only one of the five where both tools are whole at 16; the ruler's ticks, the point and the band all show. (recommended) -->
