  <!-- tags: signpost, directions, two boards, way -->
  <!-- Two boards on a post: A signpost with two boards pointing opposite ways, the upper to the right and the lower to the left, each crossing the pole and shifted 3 · 2.5 · 2 toward its point, so the pole shows above, between and below them. Portrait keyline 16×20 · 12×16 · 10×14, like flag; the pole is one upright line on the canvas centre (x 12 · 10 · 8), full height, cut where it passes behind a board. Boards 13×6 · 9.5×5 · 8×4 of ink, air inside 3 · 2 · 1.5, air between them 2 at every master; pole above the top board 2 · 1 · 1, below the bottom one 4 · 3 · 3. Point depth 2.25 · 1.75 · 1.375; tip vertex 19.56 · 15.56 · 12.634. Every board corner is an arc of 0.75 · 0.75 · 0.625 (C10, as flag-4's cloth corners): the point, the two shoulders and the square end. The point is two 45° edges, so its depth is half the board's centreline height. Off-grid decimals are the tangent points of the board arcs on the 45° tip edges (r × tan 22.5° at a shoulder, r / √2 at the point) and the tip vertex itself, placed so the rounded point lands its ink exactly on the keyline edge. At 16 the boards are 4 px tall and the points round off: they read as two plates on a post, still a signpost. Filled: each board one solid on the outline's outer edge, the pole a line at 1.5 · 1.5 · 1.25 straight through; 2 of air between the solids. -->
