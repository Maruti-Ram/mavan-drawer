  <!-- Third, solid sidebar, two links at 24: The mirror of `layout-sidebar-3`: B with two short links inside the band at 24 only, knocked out of the solid at 1.5 of white. Their centreline moves from x 6.75 to 17.25, keeping 1.5 to the frame’s right wall and 1.5 to the divider — both on the gap floor — and they run down the band, not across it, for the same reason as on the left: a 4.5-wide sidebar with 1.5 clear each side leaves 1.5 of ink, a dot, not a line. At 20 and 16 the counter is 3.25 and 2.75, the links do not fit, and C is B there, exactly as `layout-sidebar-3` is `layout-sidebar-2` at those masters. -->
