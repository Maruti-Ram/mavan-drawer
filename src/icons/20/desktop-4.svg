<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: stand, wide -->
  <!-- Wide screen: Ink 20x16 · 16x12 · 14x10 (landscape keyline), box-centred both ways. Screen 20x12 · 16x9 · 14x7 of ink (1.67 · 1.78 · 2.00 : 1), container radius 2.5 · 2 · 1.5. Neck on the centre line, 2.5 · 1.5 · 1.75 of it showing between the screen and the foot (floor 1.5); foot 9 · 7 · 6 of ink (45% · 44% · 43% of the screen). 16 master at stroke 1.25: centrelines on the eighth grid so the screen's outer edges and the foot's bottom are whole pixels; the neck at x 8, as briefcase's clasp, which on a 1.25 line covers two pixel columns at 62% (the same softness the clasp has); foot ends at x 5.625 / 10.375 (calendar's pegs) so its ink runs 5 to 11. Filled: screen solid, outer edge on the outline's (radius 3.25 · 2.75 · 2.125); neck and foot stay lines at 1.5 · 1.5 · 1.25. The whole icon in the landscape keyline (mail, credit card): a flatter, wider screen, closer to a modern display, with A's stand. The stand's fixed height costs a small master more, so the screen flattens toward 16 (2 : 1 there). -->
  <path d="M4.75 4.75H15.25A2 2 0 0 1 17.25 6.75V10.25A2 2 0 0 1 15.25 12.25H4.75A2 2 0 0 1 2.75 10.25V6.75A2 2 0 0 1 4.75 4.75Z"/>
