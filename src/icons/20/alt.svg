<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: alt key, option, modifier, pc, keyboard, letters -->
  <!-- box: 13.5x7.5 -->
  <!-- ALT letters: Rhythm and balance: the PC key's legend as three capitals of one height, every gap one number — A's legs, A to L, L's foot to T's stem and T's bar to L's stem all 2 · 1.5 · 1.5 of air, the A's counter 2 · 1.5 · 1.5 each way; the A arched (Tabler's), L's corner r 0.75 · 0.75 · 0.625. Ink 16×8.5 · 13.5×7.5 · 12×6.75, declared box. At 16 the three letters hold, but only just: every gap sits on the 1.5 floor and the word fills the 12 mark width. Filled twin: the letters keep the outline weight (glyph: letter, C32), so it is the same drawing as the outline — at 2.5 · 2 · 2 the word would need 17 · 15 · 15 across against 16 · 13.5 · 12 and the A's counter would shut. It would be the one icon in the set whose two styles are identical. Who: Tabler alt (ALT); Windows keyboards print Alt. -->
  <path d="M4 13V8.5A1.5 1.5 0 0 1 7 8.5V13M4 10H7"/>
  <path d="M10 7L10 12.25A0.75 0.75 0 0 0 10.75 13L11.5 13"/>
  <path d="M13 7H16M14.5 7V13"/>
</svg>
