  <!-- Dimension arrow, in: viewport-narrow · open frame over a dimension arrow (Tabler arrow-autofit-width; SF arrow.left.and.right.square puts the arrow inside, which cannot hold 1.5 at 16: two heads and three airs need 9.78 in a 9.5 interior). One drawing, arrows reversed: the layout square's top with its walls down to 12.5 · 10 · 7.75 (ink), and A's arrows exactly, moved to a line at y 17.5 · 14.25 · 11.625 under it; tails on the keyline, tips 1.5 apart. Vertical air from wall end to head top 1.55 · 1.5 · 1.6. Air arrow to frame, outline / filled: 3.82 / 3.24 · 2.79 / 2.55 · 2.61 / 2.32; tightest at 16 is the 1.5 between the tips. Ink 18×17.95 · 14×14 · 12×11.9. Turned a quarter it is viewport-short (the frame on the left, the arrow on the right). Reads as a screen and its width; the risk is that it also reads as a measurement (fit to width). Filled: weight 2.5 · 2 · 2, ends pulled in, the wall ends kept at the outline's ink end; ink box identical. At 16 beside its relatives (share of pixels that differ, outline): expand-horizontal 92% / 88%, collapse-horizontal 93% / 87%, maximize 62% / 55%, minimize 75% / 61%, columns 54% / 58%, move 87% / 84%; its twin C2 32% / 21% (outline / filled). Recommended for the family: the frame keeps its full corners at every master, so it still reads as a screen at 16, where A's corners shrink to flat bars; the arrows get a row of their own, so nothing crowds the corners; it is the furthest of the three from expand-horizontal, collapse-horizontal and move (84–93% of pixels differ) (recommended) -->
