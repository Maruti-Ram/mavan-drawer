5 · 1.25. Tightest air, filled: 1.5 at every master, along the grown bar. Off-grid decimals: the folder's own (its corner tangent points); folder-plus-filled's bottom join (13.12,19.56 to 13.29,19.73 · 10.6,15.68 to 10.71,16.02 · 8.547,12.945 to 8.611,13.244); and the right join, the cap's 45-degree tangent point 21.78,13.78 · 17.78,11.28 · 14.817,8.942, the ease's tangent point 19.96,15.6 · 16.46,12.6 · 13.53,10.229 and its foot x 19.6 · 16.1 · 13.177 on the grown top, rounded to 2 · 2 · 3 dp with the air still 1.5 -->
