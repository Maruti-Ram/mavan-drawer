  <!-- ⇧ bare, 45° head: Rhythm and balance: the stem is half the head's width at every master (stem ink 8 · 6 · 5 of head ink 15.38 · 11.88 · 10.23 = 0.52 · 0.51 · 0.49), the head as tall as half its span (45°, arrow-up's and caret-up's angle), the stem 0.88 · 0.8 · 0.74 of the head's height below the barbs; ink 15.38×16.19 · 11.88×12.44 · 10.23×10.37 (0.64 · 0.59 · 0.64 of the canvas wide). Air inside the stem 5 · 3 · 2.5. Optical: up 0.09 · 0.22 · 0.18 (C15 measure 0.12 · 0.03 · 0.03 up); the extra at 20 and 16 keeps the barbs' undersides and the stem's foot on whole pixels and costs at most 0.19 px. every corner an arc of half the weight (0.75 · 0.75 · 0.625 on the centreline), caret-up's construction, so the filled outer edge rounds at 1.5 · 1.5 · 1.25 and the shoulders stay crisp. At 16 the stem's walls sit on half pixels (5.5–10.5) to keep the stem half the head; the crisp 4-wide stem would be 0.39 of the head. Filled: the solid arrow, its outer edge the outline's. Who: SF Symbols shift, Lucide arrow-big-up, Material shift, Phosphor arrow-fat-up, Tabler arrow-big-up, Fluent keyboard_shift, Bootstrap shift, Carbon mac-shift, MDI apple-keyboard-shift, Nucleo arrow-bold-up, Qlementine key-shift — the ISO / Apple key legend. Look-alikes at 16: home (a house, walls 0.76 of its eaves, a door) — a stem at half the head keeps this an arrow; nothing shipped is a block arrow. (recommended) The ⇧ alone is what every major set ships as shift, and it is the only picture here whose barbs stand clear of the stem at 16 (2.6 proud each side). -->
