<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: coupon, voucher, discount, percent, sale, notched, lucide -->
  <!-- glyph: dot -->
  <!-- Coupon %: Ships as ticket-percent (Lucide ticket-percent). C on the new body. At 24 the % is percent-circle's own, unchanged: the slash spans 7.5 at 45°, the dots are ⌀3 with centres (8.75, 8.75) and (15.25, 15.25), and their filled cuts are percent-circle's too (a 2-wide slash, ⌀3.5 dots), so the two coupons are siblings. The 24 holds 1.5 everywhere: dot to slash 2.35, dot to wall 1.75, dot to notch 1.97. At 20 and 16 the ticket has only 9 and 7.5 of white height, which cannot hold two dots and a slash with 1.5 between all of them. So the file declares glyph: dot (C19: the % is one character with detached dots, and dot to slash floors at 1). The 20 keeps C's %: slash spans 4, dots ⌀2, dot to slash 1.08. The 16 keeps C's % too: slash 3.25, dots ⌀1.5 set 1.875 across and 1.5 up and down from the centre, dot to slash 1.01. Dots to walls hold 1.5 at 20 and 16; the shallower notch gives them more room than before. Filled: slash and dots cut out; the material between cuts is 1.84 · 1.08 · 1.06. Honest: at 16 the % is a murmur, and the ticket reads as "a ticket with something on it". -->
  <path d="M4.75 4.75H15.25A2 2 0 0 1 17.25 6.75V7.35A2.75 2.75 0 0 0 15.25 10A2.75 2.75 0 0 0 17.25 12.65V13.25A2 2 0 0 1 15.25 15.25H4.75A2 2 0 0 1 2.75 13.25V12.65A2.75 2.75 0 0 0 4.75 10A2.75 2.75 0 0 0 2.75 7.35V6.75A2 2 0 0 1 4.75 4.75Z"/>
  <path d="M12 8L8 12"/>
  <path d="M7.75 8A0.25 0.25 0 1 0 8.25 8A0.25 0.25 0 1 0 7.75 8Z"/>
  <path d="M11.75 12A0.25 0.25 0 1 0 12.25 12A0.25 0.25 0 1 0 11.75 12Z"/>
</svg>
