  <!-- Framed: A rounded square (image's frame: square guide box, corners 2.5 · 2 · 1.5) with small bars floating inside - low, tall, middle. Reads as a report or a dashboard tile rather than a bare chart, and sits naturally beside image and calendar. Bars on whole-number centres at 24 and 20. At 16 the third bar is removed: three bars of 1.25 with 1.5 on each side need 9.75 of interior and the frame gives 9.5, so the 16 has two bars, low and tall. Bar heights 5/10.5/7.75 · 4/8/6 · 3.75/6.5. Smallest gaps: bar to side wall 1.75 · 1.75 · 2.375, bar to top or floor 2.25 · 1.5 · 1.5, between bars 3.5 · 1.5 · 2.25 - the 20 is on the 1.5 floor everywhere. Ink box 18x18 · 14x14 · 12x12, filled identical. Filled: the shape case - the frame is solid and the bars are round-ended cuts 1.5 wide with the outline's ink ends (as file-text-filled and credit-card-filled cut their lines); material between cuts 3.5 · 1.5 · 2, cut to outer edge 3.25 · 3.25 · 3.5. Extends: it is really a second icon (a report tile); horizontal, stacked and trend would all be drawn inside the frame and all lose a bar at 16 -->
