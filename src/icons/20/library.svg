<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: library, shelf, books, square-library, saved-items -->
  <!-- Two book spines in a square: A shelf: two book spines standing in checkbox's square, one leaning on the other (Lucide square-library, Spotify's Library). Upright spine at x 9 · 7.5 · 6.375, ink 6→18 · 6→14 · 4.75→11.25 (1.5 to the top and bottom walls); leaning spine (12.5,6.75)→(15,17.25) · (10.75,6.75)→(12.5,13.25) · (9.5,5.375)→(10.625,10.625), a lean of 13.4 · 15.1 · 12.1 deg (Lucide 11.3). Air: wall to upright 3.75 · 2.25 · 1.5, upright to the lean's head 1.9 · 1.75 · 1.875, lean's foot to the wall 3.75 · 2.25 · 1.5 — the 24 pair moved 0.25 left so the air either side is equal (round one 4 / 3.5). Why two, not Lucide's three: three spines with 1.5 either side need 10.5 of white plus the lean at 20, where the square has 11, and 9.75 plus the lean at 16, where it has 9.5; and wall, spine, spine, lean, wall would be five parallel strokes in one run against §6's three. Filled: checkbox-filled with both spines cut as 1.5 slots (archive's handle slot); the leaning slot is drawn 1.52 wide at 24 and 20 (half-width 0.76) because the 2-dp rounding of its slanted edges left 1.49 at 20. Smallest air: 1.5 from the spines' caps to the top and bottom walls (outline), the 1.5 slots (filled). At 16 in real pixels: two bars in a box, the lean a grey stair of three pixels. What it costs: it says library before it says saved; at 24 the square is still thin — two lines in a 15-wide white is the picture, and nothing more fits under the three-stroke rule; at 16 the lean is a grey stair. Off-grid decimals: the slanted slot's edge offsets. -->
  <path d="M5.75 3.75H14.25A2 2 0 0 1 16.25 5.75V14.25A2 2 0 0 1 14.25 16.25H5.75A2 2 0 0 1 3.75 14.25V5.75A2 2 0 0 1 5.75 3.75Z"/>
  <path d="M7.5 6.75V13.25"/>
  <path d="M10.75 6.75L12.5 13.25"/>
</svg>
