  <!-- tags: paperclip, clip, attach, tilted, diagonal, simple -->
  <!-- Tilted, three legs: A's three-leg clip laid on the 45 degree diagonal, big turn bottom left, free end top right - the conventional attachment look, airy and light. The diagonal buys length: the clip is 2.07 · 1.86 · 1.63 times as long as it is wide, against A's 1.8 · 1.6 · 1.4, and fits the diagonal keyline (20 · 16 · 14). At 16 every line is a 45 degree line, so it is softer than any upright - grey steps instead of solid pixels. Legs 4.6 · 3.89 · 3.89 apart. Ink box 19.85x19.77 · 15.89x15.71 · 13.89x13.83, filled box the same to 0.01. Smallest gap, outline 3.08 · 2.38 · 2.63 (between neighbouring legs); filled 1.58 · 1.63 · 1.5 (between neighbouring legs); floor 1.5. Filled is the line-heavy case: nothing to fill, so the same wire at 2.5 · 2 · 2, outer legs moved in 0.5 · 0.25 · 0.375 and free ends pulled back the same, so the ink box is held. Off-grid by construction (45 degree geometry): the half-circle radii, which are a leg spacing times 0.707 and are written rounded down so the renderer completes the exact half circle; and in the filled twin the leg and turn coordinates, because moving a leg in by half the added weight across a diagonal moves it 0.35 · 0.18 · 0.27 on each axis. Every outline leg end and free end is on the grid. -->
