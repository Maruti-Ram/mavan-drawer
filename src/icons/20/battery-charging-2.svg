  <!-- Narrow bolt through the walls: Narrow bolt through the walls: A's picture with a slimmer bolt, lighter beside the 1.5 frame and closer to Lucide's line bolt; at 16 in real pixels each arm steps out only 2.125 from the bolt's centre line (A's 2.75) and it reads closer to a slash than a bolt. Ink 6.5×12 · 5×9 · 4.25×8, 0.54 · 0.56 · 0.53 wide to tall; long edges 65.6° · 66.4° · 68.2° from level, near bolt-2's 65.9° · 64.2° · 62.6°; tips on the body's centre, steps 0.5 · 0.5 · 0.75 apart, outer corners at half the weight, tips on the walls' centreline so the ink box stays battery's 20×12 · 16×9 · 14×8. Solid: at 20 and 16 it is one closed stroke, as shortcut's bolt is (widest circle inside the centreline 0.69 · 0.61 in radius, under half the weight); at 24 it needs one run from each tip down its arm (to 10,12 and the mirror point; 0.575 with it, 0.98 without). Walls cut back on the grid at 1.69 · 1.71 · 1.54 of air from the slant and 1.5 from the tip, a 5 · 5 · 4.5 gap; 4.5 · 3.25 · 3 to each side wall. At 20 and 16 the top-left and bottom-right pieces kept only 1 · 1.25 of straight wall past their corner arc, so (C33) the stub is removed and the piece ends at the arc's tangent point, in both styles: air to the bolt's slant 1.71 → 2.62 at 20 and 1.54 → 2.70 at 16, the gap in those walls 5 → 6 and 4.5 → 5.75; the other two pieces keep 1.5, and 24 its 2.5 and 3. Filled as A: battery-filled split by a 1.5 white halo around the solid bolt, the body's corners along it at half the weight, the bolt's notches sharp. Lint clean in both styles at every master. -->
