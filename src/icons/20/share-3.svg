  <!-- Forward arrow: Forward arrow, drawn closed: the share arrow of Facebook, WhatsApp, YouTube and TikTok; Font Awesome's share, Tabler's share-3, Phosphor's ShareFat, Remix's share-forward, Central's arrow-share-right, Untitled's share-06, Nucleo's share-right-3. A head with 45° sides, 14.5 · 11 · 9.5 tall, its tip and back corners bent 0.75 · 0.75 · 0.625 (C10); a shaft 6 · 4.5 · 3.75 thick where it leaves the head (white 4.5 · 3 · 2.5), its inner corners radius 1.5 · 1.5 · 1.375 so their outer corner is 0.75 and the 1.5 floor reaches into them; the tail sweeps down-left on two circles — the outer one radius 7.5 · 5.5 · 4.625 onto the left edge, the inner one tangent to the tail's round end — and stops in a round end of radius 1.75 · 1.75 · 1.5, the narrowest white in the drawing at 2 · 2 · 1.75 across. Ink 18×16 · 14×12.5 · 12×11 (mark), centred. Every off-grid decimal is a tangent point of that construction. Filled: the solid shape on the outline's outer edge. (recommended) It is the share arrow most people meet, in the social apps, and at 16 nothing in the set looks like it: redo-2 and corner-up-right are open line arrows, send is a plane, and it differs from the nodes in every part. All on 0/45/90 and curves, no ruling. Cost: the only closed arrow in a set of line arrows (send is the precedent for a closed outlined mark). Round 1's E drew the same metaphor 9 tall with fillets everywhere and read busy; this one is 11 tall with one curve per edge. -->
