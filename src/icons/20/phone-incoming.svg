  <!-- Corner arrow to the margin edge: Arrow in the handset's empty corner, to the margin edge: phone's handset verbatim and in place at every master, both styles, with nothing cut — the arrow sits in the corner the handset leaves empty (phone's own "clear square top-right"), as Lucide and Polaris put it. The arrow is arrow-down-left's turned-classic head scaled to a badge: legs 4.5 · 4 · 3.5 on 0° and 90° from the corner, C10 bend 0.75 · 0.75 · 0.625, the shaft on the diagonal to the far corner, its open end at the head set back 0.22 · 0.22 · 0.183 on each axis (r(1 − 1/√2), arrow-down-left's own number, which lands its cap on the head's outer corner). Arrow ink 10×10 · 7.5×7.5 · 6×6; its top-right corner on the margin edge (22,2 · 18,2 · 15,1), the reach C33 gives a badge. Composite 19×19 · 15×15 · 13×13, declared as box, centre 0.5 right and 0.5 up — calendar-repeat's box and offset, turned to the top-right. The other two sides stop where the handset allows: the head's legs keep 1.5 · 1.5 · 1.75 from the top-left head's right side and from the bottom-right head's top. At 16 the legs sit on x 9.625 and y 6.375 so their outer edges land on whole pixels (9 and 7), which leaves 1.75 rather than 1.5. Head air (C37, the leg cap to the shaft) 1.68 · 1.33 · 1.23. The legs are 53 · 67 · 74% of the arrow's side (arrow-down-left: 52 · 53 · 54%), because a leg shorter than 3.54 · 3.54 · 3.18 cannot keep C37's 1 of air; the smaller masters' heads are bigger for that reason. Tightest air, measured: 1.5 · 1.5 · 1.75 (head legs to the handset's heads), the same outline and filled, since the filled handset's edges are the outline's ink edges. Filled: phone-filled verbatim; the arrow stays a line at 1.5 · 1.5 · 1.25, because a shape icon's lines keep the outline weight (external-link-filled's arrow, phone-contactless-filled's waves). Why not inside the phone's 18 · 14 · 12 box: the family's forwarded arrow cannot keep C37's 1 of head air and 1.5 from the handset there at 16 (0.80 measured). A smaller handset frees nothing, because the corner's room is set by the two heads' widths, not by the handset's size. Off the grid besides phone's own numbers: only the shaft's set-back end (12.97 11.03 · 11.47 8.53 · 9.808 6.192). Family: phone-outgoing is the same arrow reversed, phone-forwarded a level arrow in the same box, top-aligned, phone-missed an x on the same box (v3-kit-phone.md). (recommended) -->
