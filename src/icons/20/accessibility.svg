<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: universal access, a11y, ring, accessibility settings, accessible, person -->
  <!-- Open-arms figure in a ring: The accessibility badge: the same figure inside a ring. Who uses it: Apple (SF Symbols accessibility, the iOS and macOS Accessibility icon), the UN accessibility logo, Font Awesome universal-access, Tabler accessible, Bootstrap universal-access-circle, WordPress Dashicons. (recommended) It is the one people read as accessibility settings, the ring stops the figure reading as a plain person, and its filled twin is the familiar white figure in a solid disc. Ring is plus-circle's (centreline r 9.25 · 7.25 · 6.375, box 20×20 · 16×16 · 14×14). Head dot 3 · 2.5 · 2 (15 · 16 · 14% of the ring), arms 11 · 9 · 8 wide (55 · 56 · 57% of the ring), 1.5 from head to arms. The legs hang straight from the arms, 27.5° from upright, drop 6 · 3.75 · 3.25: at 20 and 16 the ring leaves no room for a body line, so 24 matches them. Air to the ring: head 2 · 1.5 · 1.5, hands 2.84 · 1.99 · 1.75, feet 2.07 · 1.74 · 1.57; between the feet 4.74 · 2.4 · 2.13. Filled: a disc 20 · 16 · 14 with the figure cut out at C18's mark weight 2 · 1.75 · 1.75 (x-circle's), head hole the outline head's size, 1.5 of disc under the head, the arms keep their top edge, the feet end on the outline's foot centres (0.125 lower at 16) so 3.98 · 2.02 · 1.5 of disc stays between them. Cost: at 16 the figure is 8 tall, so its legs are short and soft in real pixels. Distinct from plus-, info- and x-circle by its head and legs. -->
  <path d="M2.75 10A7.25 7.25 0 1 0 17.25 10A7.25 7.25 0 1 0 2.75 10Z"/>
  <path d="M9.5 6.25A0.5 0.5 0 1 0 10.5 6.25A0.5 0.5 0 1 0 9.5 6.25Z"/>
  <path d="M6.25 9.75L13.75 9.75"/>
  <path d="M8.05 13.5L10 9.75L11.95 13.5"/>
</svg>
