  <!-- Corner badge, fold cut away: Corner badge, fold cut away (Maruti's pick, 2026-10-25): note's outline verbatim and in place, with the V2 plus (ink 8 · 6 · 5, its ink corner on the margin edge 22 · 18 · 15, C33) on the bottom-right corner, which is exactly where note's fold is. Cut back by hand with 1.5 of air from the plus's ink, and the whole fold goes at every master: the chamfer's ink overlaps the plus's (air −1.5 · −1.32 · −0.9) and the flap's two legs run under the arms (air −1 · 0 · 0.13); the only piece of the flap the rule would leave is a bit of its bend, 0.81 · 1.76 · 1.29 long and joined to nothing, removed as a stub, at 20 too so the picture is the same at every master. The right wall stops at y 12.75 · 10 · 8 and the bottom wall at x 12.75 · 10 · 8, 6.5 · 4.25 · 3.875 past their corners, with 1.51 · 1.52 · 1.52 of air to the plus's top and left arm caps; their round caps end at 13.5 · 10.75 · 8.625, outside the plus's ink box (14 · 12 · 10) by 0.5 · 1.25 · 1.38, so the 1.5 of air stops them before the box does and nothing enters the plus's gaps (spec 3a). Composite ink 19×19 · 15×15 · 13×13 (declared box), centre 0.5 toward the badge, as calendar-repeat. Filled: note-filled's body solid without its fold, cut along the plus's ink grown 1.5 (radius 2.25 · 2.25 · 2.125 round each arm). Each side of solid ends as the outline's wall ends (spec 4a): in that line's own round cap, r 0.75 · 0.75 · 0.625, centred on the outline's end point (20.25,12.75 · 16.25,10 · 13.375,8 and their mirrors on the bottom), joined to the grown cut by the straight line tangent to both, 0.25 · 0.35 · 0.31 long. Inside the plus's top-left gap the bite follows the grown ink (spec 4b): at 24 the solid keeps the small tab between the arms, eased r 0.5; at 20 and 16 the two grown arm tips meet in a 0.5 ease, as file-plus. The plus stays a line at 1.5 · 1.5 · 1.25. Solid to plus 1.5 · 1.5 · 1.5. Off-grid values are the tangent points of the caps and the cut and the ease ends, rounded to 2 · 2 · 3 dp, those on the grown cut rounded outward so the air never drops under 1.5: 19.73, 13.29, 19.56, 13.12 at 24; 16.02, 10.71, 15.68, 10.6, 12.78, 12.38 at 20; 13.244, 8.611, 12.945, 8.547, 10.444, 10.087 at 16. What is left is a rounded square with a plus on its corner: the fold is what tells note from square, so without it this reads as a square with a plus rather than a sticky note; Maruti took that over moving the plus inside -->
