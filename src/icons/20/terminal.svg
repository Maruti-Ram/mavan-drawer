  <!-- Prompt: The prompt, bare: > and _ as Lucide, Feather, Tabler, Phosphor and Font Awesome draw terminal (in all of them it is named terminal, not command). The > is the set's classic chevron, 45° legs and the C10 bend (0.75 · 0.75 · 0.625; tangent points 0.53 · 0.53 · 0.442 off the corner are construction values), 12.5 · 9.5 · 8.75 tall on its centreline (at 24 exactly chevron-right's height, ink 14), corner at x 10.5 · 8.75 · 7. The _ sits on the chevron's lower end, one baseline, runs 7.25 · 5.75 · 5 (0.58 · 0.61 · 0.57 of the chevron height) and starts 2 · 1.5 · 1.375 after the corner (0.16 at every master), so the pair keeps one proportion at every master. Ink 17×14 · 13.5×11 · 12×10, box-centred, under the mark ceiling (18 · 14 · 12). At 16 every outer edge lands on a whole pixel (x 2 / 14, y 3 / 13) and the _ sits on y 12.375, so it renders as one solid pixel row; a first pass at 11.75×9.25 put it on y 12 and it rendered as two half-grey rows. At 24 the _ sits on y 18.25 for the same reason. Its mass sits left and low; any optical shift is an optical-sheet question (C15) once the picture is chosen. Tightest air: _ to the lower leg 4.33 · 2.92 · 2.82 outline, 3.33 · 2.42 · 2.07 filled. Filled: line-heavy 2.5 · 2 · 2, chevron ends pulled in 0.5 · 0.25 · 0.375 on both axes and its bend grown to 1.96 · 1.35 · 1.53 so the corner ink stays put (code and chevron-right do the same), the _ pulled in at both ends and lifted by the same amount so its bottom edge stays; ink box identical. Risk: bare, it is a chevron and a minus; beside chevron-right and minus in a toolbar it has to read as one character pair. -->
  <path d="M4 5.25L8.22 9.47A0.75 0.75 0 0 1 8.22 10.53L4 14.75"/>
  <path d="M10.25 14.75H16"/>
</svg>
