<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: inventory, stock, boxes, stacked, storage, polaris, nucleo -->
  <!-- Roof resting on the stack: Recommended. No walls. The stack is wider and taller, so its top box now rests just under the roof: 1.68 · 1.54 · 1.54 of air from the top box's corner to the roof, against B's 3.2 · 1.7 · 2.4. The air is measured square to the slope, so it reads as resting, not floating. The roof is B's free chevron, the shipped warehouse roof without walls. Three boxes, stacked two and one, the top box centred over the shared wall. The boxes are 6.5 · 5 · 4 wide (B: 5.5 · 4.5 · 3.25) on a 5.75 · 4 · 3.375 row pitch, a little wider than tall at every master. White inside each box is 5×4.25 · 3.5×2.5 · 2.75×2.125. The stack is 79 · 80 · 74% of the roof's width, so the eaves overhang it by 1.75 · 1.25 · 1.375, which is what makes it a shelter rather than a lid. The bottom pair is one path, standing on the baseline. Why no walls: at 16, two walls leave 6.5 of width for the boxes, and two boxes side by side then hold only 1.375 of white, below the 1.5 floor. No tape on the boxes (package's construction): a tape needs 4.25 of white across a box, and only the 24 master has it. The silhouette is clearly different from warehouse (A), so the two never get mistaken for each other at 16. Filled: three solid boxes split by 1.5 of white, outer corners eased to the outline's round joins, cut corners 0.25; the roof stays a line at 1.5 · 1.5 · 1.25. -->
  <path d="M3.75 6.73L9.44 3.88A1.25 1.25 0 0 1 10 3.75A1.25 1.25 0 0 1 10.56 3.88L16.25 6.73"/>
  <path d="M5 12.25H15V16.25H5ZM10 12.25V16.25"/>
  <path d="M7.5 12.25V8.25H12.5V12.25"/>
