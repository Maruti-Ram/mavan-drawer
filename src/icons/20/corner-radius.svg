<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: rounded corner, radius, border radius -->
  <!-- Rounded corner: Rhythm: one corner of a shape, the top-left, rounded at 7.5 · 5.75 · 4.875 on the centreline (outer 8.25 · 6.5 · 5.5) — 45% of the side at every master, between Polaris CornerRound's 35% and Nucleo corner-radius's 48% (refs file). Each leg runs straight 9 · 6.75 · 5.88 past the arc to the square keyline's edge, so the ink is 18×18 · 14×14 · 12×12, box-centred. Top-left because Figma, Polaris and Nucleo put it there and it is the corner read first. Filled: line-heavy, weight 2.5 · 2 · 2, the outer curve kept exactly (7 · 5.5 · 4.5 on the centreline), ends pulled in 0.5 · 0.25 · 0.375; ink box identical. Who: Polaris CornerRound, Nucleo corner-radius (refs file); Figma's and Sketch's radius field (from memory). (recommended) — it is the picture designers meet in the radius field of every design app, and at 16 one curve against two 5.88 straight legs says rounded corner with nothing small to lose. -->
  <path d="M3.75 16.25V9.5A5.75 5.75 0 0 1 9.5 3.75H16.25"/>
</svg>
