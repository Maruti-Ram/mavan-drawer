<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: call, calling, in call, active call, ringing, talk, handset, waves, sound -->
  <!-- box: 15x15 -->
  <!-- Two waves: Two waves in the handset's empty corner (Lucide phone-call, Nucleo phone-volume): phone's handset verbatim and in place at every master, both styles, nothing cut; the waves sit in the phone family's corner box (v3-kit-phone.md), where incoming's arrow sits. Two quarter arcs concentric on the box's inner corner (12.75,11.25 · 11.25,8.75 · 9.625,6.375, the corner incoming's head bends round), each running from the box's left line to its bottom line, so every wave end lies on the same two lines as incoming's head legs. Radii 4.25/8.5 · 2.75/6 · 2/4.75. The outer wave is set by the box: its top and right ink edges on the margin edge (y 2 · 2 · 1, x 22 · 18 · 15). The inner one is set by wifi's pitch 4.25 · 3.25 · 2.75, so the air between the waves is wifi's 2.75 · 1.75 · 1.5 at every master (live and podcast share the 24 value); at 24 the inner radius equals the pitch, volume's r and 2r. Waves ink 10×10 · 7.5×7.5 · 6×6, the family's mark box; composite 19×19 · 15×15 · 13×13, declared as box, centre 0.5 right and 0.5 up, as every phone member. Tightest air, measured: the inner wave's ends to the handset's heads 1.5 · 1.5 · 1.75 (at 16 the ends sit on x 9.625 / y 6.375 like the family's head legs, which leaves 1.75); the outer wave 2.52 · 2.33 · 2.40; wave to wave 2.75 · 1.75 · 1.5. The same in the filled twin, whose handset edges are the outline's ink edges. Filled: phone-filled verbatim; the waves stay lines at 1.5 · 1.5 · 1.25, as phone-contactless-filled's waves and the family's arrows do beside a solid handset. Against phone-contactless: the same idea (lines beside a solid phone), but its waves are ±30° sectors facing right at volume's pitch 5 · 4 · 3.5 on radii 7.75/12.75 · 5/9 · 3.75/7.25; its inner radius alone nearly fills this corner (8.5 · 6 · 4.75), so its arcs cannot be reused. Here each wave sweeps the full quarter so both ends land on the box's sides, and the pitch is wifi's because volume's would leave a 16 inner wave of radius 1.25, a blob with 1.25 of white inside. At 16 the outer wave's edges land on whole pixels (1 and 15); the inner wave's outer edges sit on half pixels (3.75, 12.25). Radius 1.75 would make them whole, but at pitch 3 (air 1.75), off wifi's rhythm, with the inner wave shrunk to 37% of the outer (here 42%; 50 · 46% at 24 · 20). Three waves cannot hold in this box: at 16 the outer radius 4.75 less two pitches of 2.75 leaves −0.75, at 20 6 less two of 3 leaves 0, and at 24 they fit only at pitch 3 (air 1.5, radii 2.5/5.5/8.5), denser than any shipped wave. No off-grid values besides phone's own: every wave end sits on the quarter grid at 24 and 20 and on the eighth grid at 16. (recommended) -->
