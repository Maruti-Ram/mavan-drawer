  <!-- Two rows, ring bullets: The shape case: two rows with a ring in front of each line, and the ring is what fills — so this is the one candidate whose outline and filled twin differ in kind, an empty ring against a solid disc, like sliders' knob. Rows are menu-4's (8.25 · 15.75 at 24, 6.25 · 13.75 at 20, 4.25 · 11.75 at 16; air 6 · 6 · 6.25); the ring's outer ⌀ is 5 · 5 · 4.5 with a counter of 2 · 2 · 2 (radius 1.75 · 1.75 · 1.625 on the centreline; 1.625 at 16 puts the ring on the mark box edge, ink 2→6.5), a size under sliders' 6 · 5 · 5 knob so it reads as a bullet and not a control. Gap rule: §6's 1.5 in both styles with no growth — ring-to-line 1.5→1.5 · 1.5→1.5 · 1.5→1.5 — and ring-to-ring 2.5 · 2.5 · 3 down the column. Lines 11.5 · 7.5 · 6 at the outline weight in both styles (ink 9.5→21 · 9.5→17 · 8→14). Box 18×12.5 · 14×12.5 · 12×12, filled 18×12.5 · 14×12.5 · 12×12 — equal, centred in both styles, no grows: the filled disc's edge is the ring's outer edge (radius 2.5 · 2.5 · 2.25), the lines stay 1.5 · 1.5 · 1.25. At 16 the ring is 4.5 px with a 2 px hole beside a 6 px line: the bullet is bigger than half the line, which reads as radio buttons as readily as a list. Nearest candidate: H, two rows with a small disc where this has a ring; nearest shipped at 16: sliders, whose rings are 5 across with a 2.5 hole. -->
