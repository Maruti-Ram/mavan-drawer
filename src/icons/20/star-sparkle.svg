  <!-- Three, as Nucleo: Three, as Nucleo (recommended): Nucleo's star-sparkle in line form — a big glint where the lower-right point was, a smaller glint in the top-left corner and sparkle-4's dot (⌀ 2.5 · 2.5 · 2) mirrored top-right. Three sizes and a dot round the star read as sparkles, never as a badge, and the composite is the circle keyline exactly, centred. In real pixels at 16 the star reads whole but one point, the big glint as a tall twinkle, the small glint and the dot as specks of light; at 20 the big glint's taper shows. Each sparkle is a glint: two crossed tapered lines — thin pointed lenses (half-width 0.375 · 0.375 · 0.25 on the line at most, a fifth of the arm on a short arm), stroked at the outline weight and sharp on the line, so the round join gives every tip the half-weight radius 0.75 · 0.75 · 0.625 — the sparkle kit's F construction (crossed lenses), slimmer, with the across arm about 0.7 of the upright one. Light: the big glint's upright arm is 2.07 · 2.08 · 1.64 across at half its length and 1.5 · 1.5 · 1.25 at its tip, against V2's plus bars, 1.5 · 1.5 · 1.25 all along and equal both ways (8 · 6 · 5); this glint is 8×5.5 · 6×4 · 4.75×3.25, so no sparkle reads as a lone plus, and there are several. Lines stay lines in the filled twin, at the outline weight; only the star fills. Pieces glint 8×5.5 at 17.25,18 + glint 4.5×3 at 3.5,4.25 + dot 2.5×2.5 at 20.5,4.25 · glint 6×4 at 14.25,15 + glint 3×2.5 at 3.25,3.5 + dot 2.5×2.5 at 16.75,3.5 · glint 4.75×3.25 at 11.75,12.625 + glint 2.75×2.25 at 2.125,2.375 + dot 2×2 at 13.875,2.375. Ink 20×20 · 16×16 · 14×14, the circle keyline, centred on the canvas: no box or base note. The big glint takes the star's lower-right point: centred on that point's axis (x 17.25 · 14.25 · 11.75), its ink bottom on the margin edge 22 · 18 · 15, sized (the largest that does it) so the cut keeps the bottom notch and a real right point at every master. Outline: one open stroke from the bottom notch (12,17.92 · 10,14.73 · 8,12.14; the 0.29 · 0.01 · 0.05 of lower-right arm left past it goes, under 1.5) round the left, top and right points to the right arm's lower edge (19.09,12.38 · 15.8,10.18 · 12.855,8.356), 2.58 · 1.62 · 1.77 past the right point's bend. Filled: star-filled cut along the glint's ink grown 1.5 (each waist's black point rounded 0.5), and the solid ends where the outline's ink ends — on each stroke end's round cap, radius 0.75 · 0.75 · 0.625: at the right arm the cap meets the cut; at the notch the lower-left arm's edge runs on to the cap round the notch and a straight tangent joins it to the cut. The star keeps four points whole (top, right, lower-left, left) and its bottom notch: 75% · 75% · 76% of its outline, 83% · 82% · 83% of its filled area. Thinnest black 3.78 · 3.67 · 3.15. Tightest air outline 1.5 · 1.5 · 1.5, filled 1.5 · 1.5 · 1.5 (floor 1.5); sparkles 14.93/8.99/14.25 · 12.4/7.58/11 · 11.11/7.14/9.63 apart. For image-sparkle: the glint would suit it as its one spark (the kit's F family, crossed lenses, lighter) in F's place and box (7 · 5.5 · 5); a cluster would not fit, as image's corner holds one sparkle at 20 and 16. Off-grid numbers are the star's own vertices and tangent points, the cut ends (points on the star's edges, rounded toward more air), the filled cut's tangent points, caps and 0.5 fillets (halo arcs placed 0.006 · 0.006 · 0.001 out, written at the nominal radius), and the lens radii (each lens's arc through its two tips and its half-width); every glint centre and tip sits on the grid. -->
