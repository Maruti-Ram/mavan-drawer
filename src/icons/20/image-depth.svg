  <!-- tags: picture, photo, depth, depth map, near, far, mountains, foreground, background, parallax, 3d -->
  <!-- Near and far: image's frame and mountain verbatim and in place; behind the mountain a second, far one: its left slope runs from the left wall up to a peak in the sun's corner and its right slope stops 1.5 short of the near mountain, so it reads as passing behind it. Overlap is the depth cue; Nucleo's image-depth draws the same near and far pair (frameless). Same 45 degree slopes and peak radius as image (1.5 · 1.25 · 1). Far peak centre 7.5,8.25 · 6.5,8 · 5,6.375, its ink 1.5 under the frame's inside edge at every master (measured 1.50 · 1.51 · 1.50), so it stands higher than the near peak (tops 6.75 · 6.75 · 5.38 against 12.62 · 10.51 · 8.41 on the line). The far slope meets the left wall at y 9.88 · 8.99 · 7.336; left slope 3.80 · 2.64 · 2.36 long, right slope 4.81 · 2.29 · 1.58 past the peak. Air far to near 1.50 · 1.51 · 1.50 (to the near peak's arc at 24 and 20, its slope at 16). The sun is kept at 24 only, moved to the top right at 16,8.25: 2.0 off the right wall, 2.25 off the top and the near peak, 2.42 off the far slope's end; at 20 and 16 the far peak takes its corner and the best spot left leaves 1.33 · 1.12 to the near peak, so it goes, as images drops it. Against image-2: image-2 joins a low small peak to the big one in a valley, sun above; here the far peak stands above the near one and its line ends in the air beside it, so the two read as one behind the other, not side by side. Against images: no second frame. Ink 18x18 · 14x14 · 12x12, image's own box, centred. Filled: image-filled verbatim (sky, ground, the near mountain a 1.5 cut through to the edge, sun a hole) with the far mountain cut the same way: a 1.5 band through the left edge, its junctions there eased 0.5, ending in a round end r0.75 where the outline line ends; the sun hole moves with the sun at 24 and goes at 20 and 16. Solid between the far band's end and the near band 1.50 · 1.51 · 1.25 (the line weight floor), above the far peak 3.0 · 3.0 · 2.63; the far band is 1.5 of white to the shipped band's own rounding (0.749 a side). Filled ink box equals the outline. Off-grid decimals: image's own (peak tangent points, the filled arc ends and fillets); the far peak's tangent points, its wall point and its end, set on the 45 degree line from the rounded tangent point and rounded toward the far peak so the air stays 1.5; in the filled the band's offset points and 0.5 fillets (recommended: the depth is in the photo itself, it keeps image whole and its sun at 24, and at 16 it stays a frame and two clean peaks with nothing added in a corner) -->
  <path d="M5.75 3.75H14.25A2 2 0 0 1 16.25 5.75V14.25A2 2 0 0 1 14.25 16.25H5.75A2 2 0 0 1 3.75 14.25V5.75A2 2 0 0 1 5.75 3.75Z"/>
