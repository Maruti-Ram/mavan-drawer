<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: slideshow, pager, dots, carousel, frame -->
  <!-- box: 16x16 -->
  <!-- Frame and dots: (recommended) Rhythm: dot = gap between dots = air frame→dots = 2 at every master; dot pitch 4 · 4 · 4, the row centred. A frame with pager dots (Polaris Slideshow, Tabler slideshow, Nucleo slideshow). Frame on the landscape keyline 20×16 · 16×12 · 14×10, radius 2.5 · 2 · 1.5. Dots are 2×2 rounded squares on whole pixels (ink 7..9, 11..13, 15..17 at 24) — measured in Chrome they render 100% solid, where the earlier circles rendered as 50% grey blocks. Box 20×20 · 16×16 · 14×14. Filled: frame solid (outer radius 3.25 · 2.75 · 2.125), dots unchanged. Why: the dots are the one detail no relative has, so it reads as slideshow and not video, presentation or image, and it is the quietest at 16. Cost: dots are 2 at 24 too (not the set’s 3) so all three masters share one crisp size and pitch. -->
  <path d="M4.75 2.75H15.25A2 2 0 0 1 17.25 4.75V11.25A2 2 0 0 1 15.25 13.25H4.75A2 2 0 0 1 2.75 11.25V4.75A2 2 0 0 1 4.75 2.75Z"/>
  <path d="M5.75 16.75H6.25V17.25H5.75Z"/>
  <path d="M9.75 16.75H10.25V17.25H9.75Z"/>
  <path d="M13.75 16.75H14.25V17.25H13.75Z"/>
</svg>
