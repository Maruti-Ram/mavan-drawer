  <!-- Wider B, oval bowls: C’s B, de-stretched by its curves. C had long flat bars (5.25 at 24) ending in tight, nearly round corners (rx 3.25, plus 0.25 straight), so it looked like a wide box. Here the flats stop at the line, 4.5 · 4 · 4.5 long, and each bowl is one half-oval, rx×ry 4×2.88 / 4.5×3.13 · 3×2.13 / 3.5×2.38 · 2.75×1.94 / 3.13×2.06. That is a width-to-height ratio of 1.39–1.52, the $’s oval language (1.36–1.43 at 24). The top bowl is a touch smaller in both directions: it reaches 8.5 · 7 · 7.25 from the stem against 9 · 7.5 · 7.75 (0.94), and its counter is 4.25 · 2.75 · 2.63 tall against 4.75 · 3.25 · 2.88. The middle bar sits 0.25 above centre, as the ₿’s does. Line x 11.75 · 9.75 · 7.75, running 2.25 · 1.75 · 1.375 past the B, the $’s stub length. Ink 10.5×18 · 9×14 · 9×12, box-centred. Outline white either side of the line 2.75 · 2 · 2.38; filled, at 2.5 · 2 · 2 with the ink box identical, 1.25 at every master (gap 1.25 noted, as C and the € filled at 16). Reads as ฿ at 16 in both styles. (recommended) -->
