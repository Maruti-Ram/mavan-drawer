<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: prohibition, hollow -->
  <!-- Filled keeps the ring: A's outline unchanged. The filled is the same drawing at the filled weight — ring 2.5 / 2 / 2 on centrelines 8.75 / 7 / 6 so the outer edge still lands on 10 / 8 / 7, bar ending on that centreline so its caps finish flush with the outer edge. Four open counters: the mark reaches the ring and still breathes, which is the air the inset has without the inset's shortening. This is Polaris's Disabled construction (ring 1.5 and bar 1.5 on an r7 disc, hollow) and the ISO sign's. Cost: it is the only filled circle in the set that is not solid, so it sits lighter than x-circle-filled in a grid, which the family sheet shows plainly -->
  <path d="M2.75 10A7.25 7.25 0 1 0 17.25 10A7.25 7.25 0 1 0 2.75 10Z"/>
  <path d="M4.87 4.87L15.13 15.13"/>
</svg>
