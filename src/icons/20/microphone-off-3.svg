  <!-- Big slash to the square, bar cut through: What the eye sees: microphone-3 (the deep bracket cradle) struck by the same bar as A2. What tells it apart survives on the right: the bracket's right arm stays whole and straight (4 · 2.75 · 2.75) beside the capsule, while the left arm is cut back as A2's (1.5 of its 4 kept at 24, gone at 20 and 16). No foot, as the base. At 20 and 16 the bar's air falls across the joint where the stand meets the cradle (in the base that joint sits 1.15 · 1.14 from the bar's edge), so cradle and stand are cut on the same line with their ends only 0.75 · 0.78 apart — left as two caps they would merge into a lump. The two cut ends are joined by a 45° step along the edge of the air, parallel to the bar and 1.5 clear of it, so the stand stays on the cradle; it reads as a slight bend at the top of the stand. The step is the one stroke in this drawing that is not in the base. Bar (C21; Maruti 2026-10-25, the big slash to the square: every -off bar spans the square keyline): \ at 45°, its ink the square keyline 18 · 14 · 12, centred on the microphone's ink centre 12,12 · 10,10 · 8,8 (on the grid, nothing snapped): centreline M3.75 3.75L20.25 20.25 · M3.75 3.75L16.25 16.25 · M2.625 2.625L13.375 13.375. It stands 1 · 1 · 1 past the microphone's sides (2 past microphone-5's at 24) and sits 1 · 1 · 1 inside its top and bottom, so the box is declared 18×20 · 14×16 · 12×14. All five shapes have the same ink centre, so the row shares this one bar. Measured against the inside-width bar it replaces, the longer bar removes nothing new: every kept piece is identical, its extra length runs outside the microphone. Cut: every stroke stops with 1.5 of air from the bar's edge (cut-end centrelines 3 · 3 · 2.75 from the bar's), measured 1.505 · 1.505 · 1.501 at the tightest cut end; round caps. Kept (24 · 20 · 16): capsule as A2, 12.57 · 8.04 · 6.56. Cradle's left half 12.89 · 7.18 · 5.77, as A2 (at 24 from y 9, the top 2.5 of the deep side gone). Cradle's right arm 7.72 · 4.88 · 4.06: the whole straight side and the arc to 29.4° · 23.2° · 17.2° below 3 o'clock. Stand 3.5 · 3 · 2.49 (plus the step). Removed: capsule 12.57 · 10.95 · 10.08, cradle 10.17 · 9.94 · 9.42 (the 1.38 past the stand at 24 included). Ink 18×20 · 14×16 · 12×14, centred 12,12 · 10,10 · 8,8, declared as a box. Filled: the capsule fills; a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side) is knocked out of it, corners r0.75 · 0.75 · 0.625, white 1.506 · 1.506 · 1.501 each side, the bar whole through it at 1.5 · 1.5 · 1.25. What stays is the capsule's upper right as one solid, 5.70 · 4.14 · 3.41 thick across the channel. The cradle, stand and foot stay lines at 1.5 · 1.5 · 1.25, cut exactly as the outline. Off-grid decimals are the cut ends, the step and the channel's corners. -->
