<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: face id, face scan, face recognition, viewfinder, brackets, nose -->
  <!-- Eyes, nose and smile: Face ID's face (as Nucleo's facial-recognition draws it): eyes set wide, a nose between them, a wider, shallower smile — it reads as 'unlock with your face' more than 'a smiley'. 24: dash eyes 1.5×3 of ink on x 8 / 16, nose on x 12 from y 7 to 10 hooking at radius 1.5 (the set's detail radius) to (10.5, 11.5), smile at face-smile's radius 5 swept 120°; face 10.16×11.5, centred. Air outline: corners 1.75, eye to nose 2.4, nose to smile 2.62; filled (A's widening): corners 1.75, eye to nose 1.5, nose to smile 2.18. 20, its own layout to make room: eyes 1.5×2 of ink on x 7 / 13 (under the corners' tips, as at 24), a short nose on x 10 from 8.75 to 9 hooking at 0.75 (C10's bend radius) to (9.25, 9.75), smile radius 5 swept 80° (narrower, so its ends clear the corners); face 7.93×8.25, 0.125 below centre. Air outline: corners 1.5, eye to nose 1.85, nose to smile 2.04; filled: corners 1.5, eye to nose 1.61, nose to smile 1.69. 16: eyes 1.25×1.5 of ink on x 5.625 / 10.375, the simplest nose — a straight line on x 8 from 7.5 to 8, one cap long (on the centre, so its edges fall on half pixels) — smile at face-smile 16's radius 3.375 swept 100°; face about 6.4×6.9, 0.19 below centre. The outline holds (corners 1.51, eye to nose 1.78, nose to smile 1.75); the filled twin does not: eye to nose 1.44 and smile to the bottom corners 1.45, because at 1.75 thick the eye, nose and smile stacked between the top and bottom corner tips need more height than there is. That is the best of a search over eyes ±1.625–3.375 at any height, nose on x 7.5–8.5 straight or hooked (radius 0.5–1), smile radius 2.5–5 swept 80–150°, the nose starting no higher than the eyes — none holds 1.5 in the filled twin. Off-grid numbers: the smile's ends (turned 30° · 50° · 40° below level), the filled shapes' edges along the arcs, and at 20 the filled hook (outer arc and two end caps meeting at 9.01, 8.83). -->
  <path d="M7 3.75L5.75 3.75A2 2 0 0 0 3.75 5.75L3.75 7"/>
  <path d="M13 3.75L14.25 3.75A2 2 0 0 1 16.25 5.75L16.25 7"/>
  <path d="M7 16.25L5.75 16.25A2 2 0 0 1 3.75 14.25L3.75 13"/>
  <path d="M13 16.25L14.25 16.25A2 2 0 0 0 16.25 14.25L16.25 13"/>
  <path d="M7 6.75V7.25"/>
  <path d="M13 6.75V7.25"/>
  <path d="M10 8.75V9A0.75 0.75 0 0 1 9.25 9.75"/>
  <path d="M6.79 12.33A5 5 0 0 0 13.21 12.33"/>
</svg>
