  <!-- tags: password, access, bit, diagonal -->
  <!-- Block bit: The bit is a closed square block instead of teeth (the Feather/Lucide construction): a loop hanging from the shank just short of the tip, its inside one clear gap wide. In the filled twin the block fills solid, so the filled key is bow + blade + solid bit and reads at 16 even where teeth blur. Bow ring, outer ⌀ 11 · 8 · 7, centre 8.5,15.5 · 7,13 · 5.5,10.5, centreline radius 4.75 · 3.25 · 2.875; air inside the bow 8 · 5 · 4.5. Shank on the 45° diagonal from the bow's ring to the tip at 20.25,3.75 · 16.25,3.75 · 13.375,2.625: 11.75 · 9.25 · 7.875 across and up from the bow's centre (16.62 · 13.08 · 11.14 long), 11.87 · 9.83 · 8.26 of it clear of the bow's outer edge. Block bit 2.5 · 2 · 1.875 deep and 2.25 · 2.25 · 2 wide (each measured right-and-down / left-and-down) (3.54 · 2.83 · 2.65 deep), hanging 2.5 · 2 · 1.875 back from the tip; air inside it 1.68 · 1.68 · 1.58. Filled: the bow solid to its outline's outer edge with a round hole ⌀ 3 · 2 · 3 at its centre (sized so its edges land on whole pixels at each master), the block bit filled solid,; shank and bit edges stay lines at 1.5 · 1.5 · 1.25. Ink box 18×18 · 14×14 · 12×12, filled identical, centred. Gaps between stroke edges: 24: bow to bit 3.65; 20: bow to bit 2.32; 16: bow to bit 1.53. Smallest at 16: 1.53. Off-grid numbers are the points where the shank meets the bow (on the 45° line, rounded to 2 dp · 2 dp · 3 dp) only; the bow centre and radius, tip, tooth and bit points are on the quarter grid (eighth at 16) - lengths along the diagonal are therefore those numbers × 1.41, given above. -->
  <path d="M3.75 13A3.25 3.25 0 1 0 10.25 13A3.25 3.25 0 1 0 3.75 13Z"/>
  <path d="M9.3 10.7L16.25 3.75"/>
  <path d="M12 8L14 10L16.25 7.75L14.25 5.75"/>
</svg>
