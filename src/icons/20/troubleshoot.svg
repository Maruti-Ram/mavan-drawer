  <!-- Magnifier with a heartbeat: What changed from A: the magnifier is search's classic one drawn one size up — its lens 1 larger in radius about its own centre, its handle end 1 further out on the diagonal — so the ink is 20×20 · 16×16 · 14×14, the circle keyline (A and search-2: 18 · 14 · 12). Lens ⌀17.5 · 14 · 12.5 (search ⌀15.5 · 12 · 10.5, search-2 ⌀17 · 13 · 11.5), clear inside 7.25 · 5.5 · 5; handle 6.85 · 5.42 · 4.45 beyond the lens (search 6.44 · 5 · 4.04, search-2 4.62 · 3.8 · 2.83), the same 1.5 · 1.5 · 1.25 line. Why it grows: activity's whole beat — flat, up, one long stroke down through the line, back up, flat — needs 5.04 · 5.04 · 4.84 of clear radius to keep 1.5 of air at both tips and at both mouths (where a flat meets the long stroke). search-2's lens has 7 · 5 · 4.5 and its filled ring 6 · 4.5 · 3.75, so the beat fails at 20 and 16 in both styles; that is why A could carry one peak only. The beat is activity's construction exactly — legs 1×3 (71.57°, activity's angle exception), C10 bends 0.75 · 0.75 · 0.625, round caps — centred on the lens as a chord whose flats end on the ring, as A's do. Line on y 10.75 · 9.25 · 7.25; ink tips at y 5.75 and 15.75 · 5.75 and 12.5 · 4.25 and 10.25, i.e. 5 · 3.5 · 3 above and 5 · 3.25 · 3 below the line's centre; 7.83 · 5.66 · 4.97 wide between its outer bends; flats 2.79 · 2.12 · 2.07 visible each side. Air: tips to the rim 1.73 · 1.52 · 1.6; mouths 2.72 · 1.61 · 1.53; tightest 1.73 · 1.52 · 1.53. As in activity, the inside of each spike reaches 1.5 of air only 3.75 · 3.75 · 3.5 below its tip, so at 16 both spikes are dark wedges; what reads as a heartbeat is the line going up and then down below the flat. Filled: the lens fills solid and the beat is cut out of it as 1.5 of white on the outline's centreline, bent as activity-circle-filled cuts its pulse (outer bend 1.5, inner corner sharp, round ends), its flats stopping 1.5 short of the edge (white flats 2.04 · 1.37 · 0.98 straight). Material from the cut's tips to the edge 3.23 · 3.02 · 2.91; between a flat and the long stroke 2.72 · 1.61 · 1.36 (floor 1.5 · 1.5 · 1.25). Grip: search-filled's taper (2 → 3.5 at 24), 5.91 · 4.6 · 3.95 between its circles. search-2-filled's heavy ring cannot be kept with this beat at 20 or 16 — A4 shows what keeping it costs. Off-grid decimals: the handle's start on the ring, the bend tangent points and the chord ends (where the circle and the 1×3 legs put them), the grip's tangent points. At 16 in real pixels: a magnifier with a clear handle and an ECG line that goes up and down through it — both read at once, outline and filled; the filled reads as activity-circle-filled held on a handle. Cost: 14×14 at 16 instead of search-2's 12×12 — in a row it sits with the -circle icons (activity-circle, alert-circle), larger than search beside it. (recommended) -->
