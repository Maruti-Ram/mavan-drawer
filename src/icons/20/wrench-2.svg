<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: wrench, spanner, tool, settings, maintenance, fix, repair, build, open end, jaw, short handle -->
  <!-- box: 13.98x13.98 -->
  <!-- Shorter handle: A with a shorter handle and nothing else changed - same head, same jaw, same shoulder, same 45 degrees. The step is 2 units off the ink box at every master (19.98 - 15.98 - 13.98 becomes 17.98 - 13.98 - 11.98), and 2 is the smallest real step: the box stays centred on the canvas, so an odd width puts both outer edges on half pixels - 13 wide at 16 lands on 1.5 and 14.5, where 12 lands on 2 and 14. What 2 units of box costs the tool is 2.83 of its own length, because the tool lies on the diagonal. That comes off the bare handle, which is all there is to take it from: 10.54 - 6.11 - 5.11 long in A, 7.71 - 3.28 - 2.29 here, so the handle loses 27% at 24, 46% at 20 and 55% at 16. The head cannot shrink to match - 9.5 is its floor at 16 - so its share of the box goes from 60% - 67% - 68% to 67% - 77% - 79%. At 24 it still reads as a spanner with a short handle. At 16 it reads as a head with a stub, and the thing the eye names first is the notch, not the tool. Agreed box at all three masters. -->
  <path d="M6.32 15.8A1.5 1.5 0 0 1 5.26 16.24A1.5 1.5 0 0 1 3.76 14.74A1.5 1.5 0 0 1 4.2 13.68L6.52 11.36A2.5 2.5 0 0 0 7.25 9.69L7.38 6.46A1 1 0 0 1 7.67 5.79L9.26 4.2A1.5 1.5 0 0 1 10.32 3.76A1.5 1.5 0 0 1 11.38 4.2L12.44 5.26L10.85 6.85A1.25 1.25 0 0 0 10.48 7.74A1.25 1.25 0 0 0 10.85 8.62L11.38 9.15A1.25 1.25 0 0 0 12.26 9.52A1.25 1.25 0 0 0 13.15 9.15L14.74 7.56L15.8 8.62A1.5 1.5 0 0 1 16.24 9.68A1.5 1.5 0 0 1 15.8 10.74L14.21 12.33A1 1 0 0 1 13.54 12.62L10.31 12.75A2.5 2.5 0 0 0 8.64 13.48L6.32 15.8Z"/>
</svg>
