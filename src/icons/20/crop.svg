<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: crossed brackets, trim, cut, lucide, polaris, nucleo, untitled, sf symbols, material -->
  <!-- Crossed brackets: Rhythm: two L brackets cross at the frame's top-left and bottom-right corners and each runs on past the other by 3.25 · 2.5 · 2 (20 · 20 · 19% of the span), so end : frame : end is 1 : 3.1 : 1 · 1 : 3 : 1 · 1 : 3.4 : 1 — Lucide and Untitled UI crop-01 draw 1 : 3 : 1 and Nucleo 1 : 2.8 : 1 (refs file). The frame between the brackets is 10 · 7.5 · 6.75 on the centreline, white inside 8.5 · 6 · 5.5. Bends at the detail radius 1.5 · 1.25 · 1, as drag-drop's card: this frame is card-sized, and maximize's 2.5 · 2 · 1.5 is for an 18 frame. Ink 18×18 · 14×14 · 12×12, box-centred, the square maximize, scan and focus fill; both crossings are square-on, so no wedge closes. Filled: line-heavy, weight 2.5 · 2 · 2, ends pulled in 0.5 · 0.25 · 0.375 so the ink box is identical; ends past the crossing 2.75 · 2.25 · 1.63, white inside 7.5 · 5.5 · 4.75. Who: Lucide crop, Untitled UI crop-01, Nucleo crop (refs file), SF Symbols crop (rendered here), Feather, Tabler, Material, Phosphor (from memory). (recommended) — it is the crop picture nearly every set shares, and at 16 the two running ends and the 5.5 of white inside still read as two separate brackets, the one thing that makes it crop and not a frame. -->
  <path d="M6.25 3.75V12.5A1.25 1.25 0 0 0 7.5 13.75H16.25"/>
  <path d="M3.75 6.25H12.5A1.25 1.25 0 0 1 13.75 7.5V16.25"/>
</svg>
