  <!-- tags: highlight, marker, chisel, felt tip, diagonal, band -->
  <!-- Chisel marker, back band: A with a band across the back of the body (recommended — over A; A’s own note predates this round). Rhythm and balance: A’s outline leaned toward its dark nib and its filled twin toward its solid back, so no single placement could centre both; a band does both at once — a line adds weight to the back of the outline, and in the filled twin it is a 1.5 cut that takes weight off the back. Mass centre along the diagonal, measured at real pixels: outline 0.06 · 0.06 · 0.03 toward the back (A: 0.45 · 0.21 · 0.22 toward the tip), filled 0.28 · 0.21 · 0.26 toward the back (A: 0.81 · 0.66 · 0.65). The band sits where pencil’s does — 3.25 · 3.25 · 2.875 from the end on the centreline, 1.75 · 1.75 · 1.625 of air to the end — so the two read as one family. Ink 14.6 · 15.4 · 17.1% of the canvas (pencil 13.4 · 13.8 · 16.4, A 13.5 · 14.5 · 16.1); filled 20.5 · 17.6 · 19.5% (pencil-filled 20.1 · 17.5 · 20.7, A 22.4 · 19.8 · 22). Numbers (24 · 20 · 16), otherwise A exactly: body 5.3 · 3.89 · 3.36 wide on the centreline, back corners r 1.5 · 1.25 · 1, collar corners r 0.75 · 0.75 · 0.625; solid chisel nib ink 3 · 3 · 2.5 wide, long side 4 · 3.25 · 3; box 18×18 · 14×14 · 12×12, centred. Filled: three pieces on the outline’s outer edge — back cap, barrel, nib — split by 1.5 of white at the band and the collar at every master. Looked at and not changed: the nib cannot grow — a solid nib is at most twice the stroke wide (3 · 3 · 2.5), and a hollow one needs 4 at 16, which leaves no shoulder; at 16 it reads as a dark felt tip, the chisel’s slant as one stepped pixel, and that dark tip is what tells it from pencil. Risk: with the band it is closer to pencil-3 — only the dark nib in place of the light cone separates them; if that is too close, A stays the cleaner picture -->
