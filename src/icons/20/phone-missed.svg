  <!-- X in the corner box: X in the handset's empty corner — the kit's missed member (v3-kit-phone.md), Lucide's picture: phone's handset verbatim and in place at every master, both styles, with nothing cut. The mark is the shipped x's two diagonals, written as x writes them (M… l…), corner to corner of the family's mark box (centreline 12.75–21.25 × 2.75–11.25 · 11.25–17.25 × 2.75–8.75 · 9.625–14.375 × 1.625–6.375), crossing at 90° at its centre (17,7 · 14.25,5.75 · 12,4). X ink 10×10 · 7.5×7.5 · 6×6 — incoming's and outgoing's arrow box exactly; its top-right corner on the margin edge (22,2 · 18,2 · 15,1), the reach C33 gives a badge. Composite 19×19 · 15×15 · 13×13, declared as box, centre 0.5 right and 0.5 up — calendar-repeat's box and offset, turned to the top-right, as the family. Tightest air, measured: 1.922 · 1.753 · 2.068 outline, 1.923 · 1.753 · 2.068 filled — the lower-left arm's round cap, on the box's bottom-left corner, to the bar's inner arc, as outgoing's tail; the filled handset's edges are the outline's ink edges. At 16 the arms end on 9.625 / 14.375 and 1.625 / 6.375, so the four cap extremes land on whole pixels (x 9 and 15, y 1 and 7). The arms cross at 90°, so no wedge closes at their tips (§6 judges crossings under 86°). Filled: phone-filled verbatim; the x stays a line at 1.5 · 1.5 · 1.25, because a shape icon's lines keep the outline weight (external-link-filled's arrow, phone-contactless-filled's waves). No off-grid numbers besides phone's own. Why recommended: at 16 in real pixels the x is a 6-pixel cross that reads as missed at once and stands apart from the three arrows beside it (incoming ↙, outgoing ↗, forwarded →); it also keeps 0.25–0.42 more air from the handset than B at every master. (recommended) -->
