<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- keyline: mark -->
  <!-- tags: adjust, controls, filters, settings, tune, vertical, bar, faders, equalizer -->
  <!-- Upright tracks, bar knobs: Three upright tracks, each crossed by a short level bar - high - low - high - like faders. Keeps three tracks at every master because a bar needs less room than a ring. Ink 18×18 · 14×14 · 12×12; tracks 6 · 4.75 · 4.25 apart, bars 6 · 4.5 · 3.5 long. Smallest gap 2.25 at 24 (left track to middle bar), 1.75 at 20 (left track to middle bar), 1.875 at 16 (left track to middle bar); filled 1.75 · 1.5 · 1.5 - exactly on the floor at 20 and 16. Filled: the line-heavy case - everything redrawn at 2.5 · 2 · 2 with every end pulled in by half the added weight; filled ink box equals the outline's at all three. Weak spot, seen in real pixels: filled at 16 the bars stand only 0.75 proud of the 2-wide tracks and the icon turns into three thick posts; the 16 tracks also sit on 3.75 and 12.25, so their edges are soft. -->
  <path d="M5.25 3.75V16.25"/>
  <path d="M3.75 7.75H6.75"/>
  <path d="M10 3.75V16.25"/>
  <path d="M8.5 12.25H11.5"/>
  <path d="M14.75 3.75V16.25"/>
  <path d="M13.25 7.75H16.25"/>
</svg>
