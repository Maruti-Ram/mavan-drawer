<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: pop-up, popover, overlay, corner, notification, picture in picture, widget -->
  <!-- Corner popup: The popup in the page's corner: a small window sits in the page's top-right corner and the page steps aside for it. Polaris LayoutPopup is this picture (its page is dashed, its popup solid, in the top right). Lucide picture-in-picture-2, Tabler picture-in-picture and Material pip are the same picture at the bottom right. Frame as A. The box is half the frame, 9 · 7 · 6 of ink (outer 12-21 x 3-12 · 10-17 x 3-10 · 8-14 x 2-8, every edge on a whole pixel), 6 · 4 · 3.5 clear. It shares the page's top-right corner, with the page's radius 2.5 · 2 · 1.5. The page is cut back by hand, as C33 cuts a base for a badge: its top wall stops at x 9.75 · 7.75 · 5.875 and its right wall at y 14.25 · 12.25 · 10.125, so each wall ends 1.5 from the box at every master. Tightest air at 16 is 1.5, the two wall ends to the box. Against layout-header and layout-header-4 at 16: no divider and no full-width box; the only box is in one corner. Against the window board: a single page with a box inside it, where window D is two equal windows offset; square, no bar. Filled: the box fills (outer radius 3.25 · 2.75 · 2.125) and the cut page stays a line at 1.5 · 1.5 · 1.25, so the popup reads as the thing in front. Top right, as Polaris places it; bottom right would read as picture-in-picture. (recommended: it is the picture the name came from, no shipped icon shares it, and its one rule, the 1.5 cut-back, is a rule the set already keeps) -->
  <path d="M7.75 3.75H5.75A2 2 0 0 0 3.75 5.75V14.25A2 2 0 0 0 5.75 16.25H14.25A2 2 0 0 0 16.25 14.25V12.25"/>
  <path d="M12.75 3.75H14.25A2 2 0 0 1 16.25 5.75V7.25A2 2 0 0 1 14.25 9.25H12.75A2 2 0 0 1 10.75 7.25V5.75A2 2 0 0 1 12.75 3.75Z"/>
