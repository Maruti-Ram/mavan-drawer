  <!-- Capsule cups: Rhythm: cups of 6×10.5 · 5×8.25 · 4×7 ink, 6 · 4 · 4 of air between them as H1; box-centred on the square keyline, symmetric. Variant of H1 (same over-ear picture, other cups): the AirPods Max / SF headphones build, a band (r 6 · 4.5 · 4) that lands on the tops of two separate cups. The cups are the shipped microphone's capsule, 4.5 · 3.5 · 2.75 wide on the line, 3 · 2 · 1.5 clear inside; the band stands 1.5 · 1.25 · 1 above them. At 16 the band's two short uprights sit on x 4 and 12, between pixels (soft), so that the cups keep whole-pixel edges. Filled: capsules solid, band a line. Its band and cups are S2's verbatim. Lighter than H1 at 16, cups taller -->
