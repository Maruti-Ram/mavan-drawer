<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: pair, numbered, face-on, count -->
  <!-- glyph: numeral -->
  <!-- Two coins, numbered: Two equal coins face-on, the front one lower left and whole, carrying the set’s own 1 (list-ordered’s: a 1×1 flag into the stem), the back one upper right and cut where it passes behind — Lucide coins and Untitled coins-02/-04 stamp a 1 the same way; Central coins draws the pair plain. What changed from round 1: the 1 is what says coin rather than ring or link, and the coins are bigger and closer (ink ⌀ 14 · 11 · 10, was 13 · 10.5 · 9; centres 6 · 5 · 4 apart on each axis, was 7 · 5.5 · 5), so the pair fills the circle keyline 20 · 16 · 14 like the other circle icons. The back coin stops where its centreline is 9.25 · 7.75 · 7.125 from the front coin’s centre — 1.5 of air to the front ink — so it shows 208 · 201 · 181 degrees of itself. The 1: stem 4.5 · 3 · 3, ink 6 · 4.5 · 4.25 tall (43 · 41 · 42% of the coin, Lucide’s proportion), its ink centred on the coin; air to the ring 2.45 · 1.67 · 1.5 (the 1 shortened at 20 and 16 to keep 1.5). Filled: the front coin a disc with the 1 knocked out 1.5 wide, the back coin its outer arc with stroke-radius ends and the cut traced 1.5 off the disc (users-filled’s construction); filled box = outline box. glyph: numeral is in use only in the filled 20 and 16, where the white 1’s flag meets its stem at 1.22 (C19 floor 1). The 1 is a generic denomination, not a currency: it does not overlap dollar-sign C or currency B. (recommended) — reads as coins at 16 in outline and filled, sits on the circle keyline at every master, and is the simplest drawing of the five -->
  <path d="M2.75 12.5A4.75 4.75 0 1 0 12.25 12.5A4.75 4.75 0 1 0 2.75 12.5Z"/>
  <path d="M7 12L8 11V14"/>
  <path d="M8.57 4.82A4.75 4.75 0 0 1 12.5 2.75A4.75 4.75 0 0 1 17.25 7.5A4.75 4.75 0 0 1 15.18 11.43"/>
</svg>
