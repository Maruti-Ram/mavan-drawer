<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: del, delete key, forward delete, keyboard, letters, pc -->
  <!-- box: 14.5x7.5 -->
  <!-- DEL letters: The PC key's legend, in the letter family of escape C (ESC) and option D (ALT): the same cap height, 8.5 · 7.5 · 6.75 of ink (centreline 7 · 6 · 5.5), the same E as ESC's and the same L as ALT's, verbatim, with a D built on ESC's bowl radius, 1.75 · 1.5 · 1.375, and E's corners, r 0.75 · 0.75 · 0.625. Rhythm and balance: one gap between the letters, 1.75 · 1.5 · 1.5 (ESC's), the word on the box centre; the D's counter is 2.25 · 1.75 · 1.5 wide. Ink 16.5×8.5 · 14.5×7.5 · 12.75×6.75, declared box. Honest at 16: it holds, but only on the floor — both gaps and the D's counter are exactly 1.5, and the 1.25 lines fall between pixels and read grey, as ESC's do. Filled twin: the letters keep the outline weight (glyph: letter, C32), so it is the same drawing as the outline, as ESC and ALT are — at 2.5 · 2 · 2 the D's counter shuts and the word needs 18 · 16 · 14 across. Who: Windows and PC keyboards print Del or Delete on the key; no icon set I found ships a DEL icon (Iconify has none). Clear of every shipped icon; next to escape and option it is one family. -->
  <path d="M4.25 7H5.25A1.5 1.5 0 0 1 6.75 8.5V11.5A1.5 1.5 0 0 1 5.25 13H4.25A0.75 0.75 0 0 1 3.5 12.25V7.75A0.75 0.75 0 0 1 4.25 7Z"/>
  <path d="M12 7L10.5 7A0.75 0.75 0 0 0 9.75 7.75L9.75 12.25A0.75 0.75 0 0 0 10.5 13L12 13"/>
  <path d="M9.75 10H11.75"/>
  <path d="M15 7L15 12.25A0.75 0.75 0 0 0 15.75 13L16.5 13"/>
</svg>
