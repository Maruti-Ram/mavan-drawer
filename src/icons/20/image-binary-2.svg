  <!-- Image cut at its peak, 1 over 0: Image cut at its peak, 1 over 0 (Maruti locked C as image-binary-2 on 2026-10-25): the reference's picture (Nucleo's image-binary) in our language. The shipped image is cut down at its peak by a line, x 13.75 · 11.25 · 9.125, that runs 1 past the frame at both ends to the margin edge (ink 2 to 22 · 2 to 18 · 1 to 15) so it reads as a cut, not a frame side. Left of it everything is image's own, verbatim and in place: the frame's left part (its top and bottom walls run into the line), the sun, and the left leg, cut by the line, not run on: image's straight leg to its tangent point (13.69,13.06 · 11.12,10.88 · 8.793,8.707) and then image's own peak arc for the 3.2 · 7.9 · 23 degrees it takes to reach the line's centre (13.75,13 · 11.25,10.77 · 9.125,8.487), all of it inside the line's ink, so the leg ends on the line and nothing is drawn past the base (ending it on the tangent point instead leaves it 0.06 · 0.13 · 0.33 off the line, which lint reads as two strokes almost touching). The sun keeps 2.75 · 1.5 · 1.5 to the line, and that sets the line's place at 20 and 16, as close as the sun allows; at 16 the line's edges fall on 8.5 and 9.75, half pixels, because the sun's ink ends on 7. Right of the line the image becomes 1 over 0, stacked 1.5 apart, as tall as the frame (ink 3 to 21 · 3 to 17 · 2 to 14). Numerals at the outline weight (glyph: numeral): the 0 is sort-numeric's stadium (ink 5×8.25 · 4×6.25 · 3.5×5.25, hole 2 · 1 · 1 wide), the 1 a 45 degree flag of 1.25 · 1 · 1 on a stem over the 0 (ink 2.75×8.25 · 2.5×6.25 · 2.25×5.25). At 16 the 0 stands on x 11.5 to 15, its right edge on the margin and a whole pixel, and the 1's stem on 13.625, its left edge on pixel 13. Air: 0 to the line 1.50 · 1.50 · 1.75, 1 to the line 2 · 1.75 · 2.25, 1 to 0 1.50 · 1.50 · 1.52, sun to the line 2.75 · 1.50 · 1.50, sun to the wall 2.75 · 2 · 1.75. Box 18×20 · 14.5×16 · 13×14 (declared), centre 12,12 · 10.25,10 · 8.5,8. Filled: image-filled's two solids joined by the line's ink into one shape: the frame's outer edge on the left, the line's ink on the right with its round ends, the leg's 1.5 band from image's own bottom-left eases up into the line's left edge (13 · 10.5 · 8.5), the sun image-filled's hole (r 1.5 · 1.25 · 1); the band's white ends square against the line, a line-weight wall. Digits stay lines, the outline's own ink. Tightest air outline 1.50 · 1.50 · 1.50, filled 1.50 · 1.50 · 1.75 (the 0 to the line's ink). Off-grid decimals: image's own (the leg's tangent point, fillet and band points), the arc's end on the line (rounded to 2 · 2 · 3 dp) and the band's ends on the line's edge. -->
