  <!-- box: 16x9 -->
  <!-- Full bolt through the walls: Full bolt through the walls (recommended): battery's body and nub verbatim and in place, with a solid bolt standing on the body's centre and breaking through the top and bottom walls, which are cut back by hand 1.5 from its ink (Lucide's battery-charging picture; Nucleo's bolt is solid too). At 16 in real pixels it reads as a bolt in a battery beside battery, battery-full and shortcut; the narrow bolt (B) reads closer to a slash. Why through the walls: battery's inside white is 15.5×9 · 11.5×6 · 10.25×5.5, so a bolt keeping 1.5 of air inside could be at most 6 · 3 · 2.5 tall, while the smallest bolt the set draws (shortcut's solid one) is 8.5 · 8 · 6.5 and the shipped hollow bolt 20 · 16 · 14 (its step white is already exactly 1.5 at 16). The bolt is the set's small solid bolt, shortcut's, scaled to the body's height: ink 8×12 · 6×9 · 5.5×8, 0.67 · 0.67 · 0.69 wide to tall (shortcut 0.65 · 0.69 · 0.69); long edges 59.4° · 60.6° · 60.5° from level, between bolt's 54.6° · 58.2° · 60.9° and bolt-2's 65.9° · 64.2° · 62.6°; tips one above the other on the body's centre (x 11.25 · 9.25 · 7.375) and the two steps 0.5 · 0.5 · 0.75 apart, as shortcut's; outer corners round at half the weight. Its tips sit on the walls' centreline, so they stop on the body's outer edge and the ink box stays battery's 20×12 · 16×9 · 14×8, box-centred; point-symmetric about the body's centre, so no optical shift. Solid, drawn with the pen as the level bar is: its outline plus one run from each tip down the middle of its arm (to 9.75,12 · 8.25,10 · 6.5,8 and the mirror point), so the stroke leaves no white inside — the widest circle inside the centreline is 0.675 · 0.476 · 0.466 in radius, under half the weight 0.75 · 0.75 · 0.625 (without the runs 1.18 · 0.83 · 0.78: a pinhole lint flags). Walls: the cut ends sit on the grid at 1.51 · 1.55 · 1.58 of air from the bolt's slant and 1.5 from its tip, a 5 · 5 · 4.75 gap in each wall; the bolt keeps 3.75 · 2.75 · 2.375 to each side wall. At 20 and 16 the top-left and bottom-right pieces kept only 1 of straight wall past their corner arc, so (C33, as password-lock and map-pinned) that stub is removed and the piece ends at the arc's tangent point: their air to the bolt's slant 1.55 → 2.42 at 20 and 1.58 → 2.45 at 16, the gap in those walls 5 → 6 and 4.75 → 5.75; the top-right and bottom-left pieces keep their 1.5 of straight wall, and 24 keeps its 2.5 and 3. Filled: battery-filled's solid split by a white halo 1.5 wide around the solid bolt (the bolt is the outline's ink exactly; the halo is drawn 1.508 · 1.508 · 1.501 so rounding never takes the white under 1.5); the body's corners along the halo round at half the weight, 0.75 · 0.75 · 0.625. Where the outline's stub is removed (20 and 16), the filled piece stops there too: its edge ends at the corner arc, turns down in a half-weight cap and runs as a straight face into the halo. The bolt's two notches stay sharp, as the outline's ink and bolt-filled's notches are: they are the bolt's shape, and the halo opens at the top and bottom, so it is not a cut-out (lint §5k does not read it). A white bolt cut into a whole solid body was measured too: with line-weight walls it can only be 6×9 · 4×6 · 3.75×5.5, and at 16 it reads as a diamond. Lint clean in both styles at every master. Who: Lucide battery-charging (bolt across the walls, walls cut), Nucleo battery-charging (solid bolt across the walls). -->
