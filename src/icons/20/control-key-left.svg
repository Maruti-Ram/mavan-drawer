<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: control, ctrl, control key, modifier, key cap, keyboard, shortcut, caret, mac, corner legend -->
  <!-- Caret in the corner: Rhythm and balance: the ⌃ sits in the cap's top-left corner with the same share of air at every master — left air 2.25 · 1.75 · 1.5, 0.125 of the cap each time (1.5 is the 16 floor, scaled up) — and 0.25 more on top, because the rounded apex reads nearer its edge than the end cap does (measured: within the first 0.75 of depth the apex holds as much ink as the end cap holds 0.235 · 0.235 · 0.245 deeper), so the two airs read equal at the corner. The cap is the shipped square verbatim (18 · 14 · 12, centreline radius 2.5 · 2 · 1.5); the caret's nearest points face straight walls, clear of the inner corner (inner radius 1.75 · 1.25 · 0.875), and its leg runs diagonally past the corner with about 4 of air. Numbers: cap ink 18×18 · 14×14 · 12×12; legend ink 6.5×3.69 · 5×2.94 · 4.25×2.491 (0.36 · 0.36 · 0.35 of the cap's width); air to the cap's inner edge: left 2.25 · 1.75 · 1.5, top 2.5 · 2 · 1.75, right 6.25 · 4.25 · 3.75, below 8.81 · 6.06 · 5.259. Caret: chevron-up's classic construction reused — 45° legs, a right-angle corner on a bend of radius 0.75 · 0.75 · 0.625 (C10's minimum, the same arc chevron-up bends on), round caps; only its size is the legend's. Off-grid decimals are the bend's tangent points and the ends' heights, which the 45° legs and the apex's place put there. Filled: the cap solid (outer radius 3.25 · 2.75 · 2.125), the caret cut out 1.5 wide at every master (C22, so at 16 the white is wider than the 1.25 line): at 24 and 20 the outline caret's own stroke, at 16 its ends pulled in 0.125 along their legs so the white keeps the outline caret's sides and foot, bend 0.75 (outer 1.5, inner corner sharp, as checkbox-filled's tick) — its apex stands 0.07 above the outline caret's top; solid between the cut and the key's outer left edge 3.75 · 3.25 · 2.75. Who: Central control-key-left / control-key-right (a 1.5-stroke caret 6 wide in an 18 key, air 2 to the side and 2.5 above) — the picture Maruti showed (2026-10-24); Apple prints ⌃ in a corner of its control key. At 16 the legend is 4.25 across: small, as a key legend is, and clearly off the centre (1.125 left of it). Nearest shipped picture: window, a wide frame with three dots in its top-left; the square cap and the single caret keep A apart from it at 16. (recommended: it is the reference picture, the corner placement is what makes it a key legend rather than a chevron-in-a-square button, and its shares hold at all three masters) -->
  <path d="M5.75 3.75H14.25A2 2 0 0 1 16.25 5.75V14.25A2 2 0 0 1 14.25 16.25H5.75A2 2 0 0 1 3.75 14.25V5.75A2 2 0 0 1 5.75 3.75Z"/>
  <path d="M7 8.69L8.22 7.47A0.75 0.75 0 0 1 9.28 7.47L10.5 8.69"/>
</svg>
