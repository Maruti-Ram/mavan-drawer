<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: app, application, app window, traffic lights, mac, program, dots -->
  <!-- Traffic lights: The window by its traffic lights: a landscape frame with three dots in the top-left corner and no title-bar line. Lucide app-window-mac draws three dots; Tabler and Phosphor app-window and Nucleo window draw two; Heroicons window and Central window-app add a line under them. Frame is credit-card's and mail's landscape keyline: 20x16 · 16x12 · 14x10, container radius 2.5 · 2 · 1.5. Landscape because three dots cannot fit in the square frame at 16: its 9.5 inside leaves 0.5 of air past the third dot, and a window on a screen is landscape in six of the seven sets. Dots 2 · 2 · 1.5 across (solid circles of radius 0.25 · 0.25 · 0.125 in the stroke), centres x 6 / 9.5 / 13 · 6 / 9.5 / 13 · 4.5 / 7.5 / 10.5, y 8 · 8 · 6.5. Rhythm: pitch 3.5 · 3.5 · 3, so the gap between dots is 1.5 at every master, and the top and left margins are also 1.5. Every air in the corner is the same number. Dot row 9 · 9 · 7.5 long, with 6.5 · 2.5 · 2.5 clear to the right wall. Tightest air at 16 is 1.5: dot to dot, dot to the top wall, dot to the left wall. The line is dropped on purpose. With it, the dots need 1.5 above and below, so the bar becomes 5 · 5 · 4.5 clear over a body only 6.5 · 2.5 · 1.75 clear: at 20 and 16 the bar is taller than the window under it. Against layout-header at 16: no divider at all, and a 14x10 silhouette against 12x12. Against the popup board: no box inside the frame and no pointer. Risk: the 1.5 dots at 16 straddle pixel rows and render soft (one solid row, 6, with grey above and below). Next to keyboard, also 14x10 with dots, the dots here are three in one corner and the body is empty. Filled: the frame becomes a solid slab, the outline's outer edge (outer radius 3.25 · 2.75 · 2.125), with the three dots cut out as white holes 2 · 2 · 1.5 across in the same places, as Tabler and Phosphor fill app-window. The ink between holes is 1.5, and from hole to outer edge 3 · 3 · 2.75. (recommended: the one window picture that says app window without a line, so it cannot be read as a header or a card, and it keeps 1.5 everywhere at 16) -->
  <path d="M5.25 4.75H18.75A2.5 2.5 0 0 1 21.25 7.25V16.75A2.5 2.5 0 0 1 18.75 19.25H5.25A2.5 2.5 0 0 1 2.75 16.75V7.25A2.5 2.5 0 0 1 5.25 4.75Z"/>
  <path d="M5.75 8A0.25 0.25 0 1 0 6.25 8A0.25 0.25 0 1 0 5.75 8Z"/>
  <path d="M9.25 8A0.25 0.25 0 1 0 9.75 8A0.25 0.25 0 1 0 9.25 8Z"/>
  <path d="M12.75 8A0.25 0.25 0 1 0 13.25 8A0.25 0.25 0 1 0 12.75 8Z"/>
</svg>
