  <!-- Dashed square, crosshair: Rhythm and balance: the same C35 dashed place, back on the canvas centre (18 · 14 · 12), with a crosshair in its bottom-right corner in place of the pointer — a plus 8.5 · 7 · 6 across whose right and bottom arms end on the place's own lines, where the corner and its two side dashes are left out; dashes to crosshair 6.33 · 4.48 · 3.88. Ink 18×18 · 14×14 · 12×12, the square keyline, box-centred; the crosshair's mass sits bottom-right. Who: Photoshop's marquee cursor, macOS's screenshot selection, Windows Snipping Tool's rectangle mode (all from memory). Filled: the dashes stay at 1.5 · 1.5 · 1.25, the crosshair goes to 2.5 · 2 · 2 (ends pulled in 0.5 · 0.25 · 0.375), written as its ink. Ink box identical. Risk: a plus in a dashed square can read as "add to selection" more than "select". -->
