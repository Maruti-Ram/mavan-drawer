  <!-- tags: wedge, separate cuff, thumbs down, dislike, downvote, turned -->
  <!-- Turned · thumbs-down: thumbs-up turned 180° about the canvas centre. Every number in the shipped drawing is kept exactly — the 63.43° thumb (2 up for 1 across), the 1.5 · 1.5 · 1.5 of air inside the tip which is the floor exactly, the 4 · 3.25 · 2.75 cuff, the 1.5 · 1.25 · 1 web, the 2.5 · 2 · 1.5 palm corners — because a rotation moves points without changing any distance or angle. A rotation is two mirrors, so it keeps the hand it started with and every arc keeps its sweep. Lucide and Polaris both turn; so do Material and Font Awesome. Side by side with thumbs-up the pair is point-symmetric: the cuff crosses to the top right and the thumb points down-left, which is what makes the two read as opposites rather than as the same hand twice. (recommended) -->
