<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: balance, scales, justice, law, weighing, beam, pans, dish, central, nucleo -->
  <!-- Rounded dish, long beam: Polish taken from Central law. (1) The beam runs straight past the hanging points to the keyline edge, x 2.75–21.25 · 2.75–17.25 · 1.625–14.375, at y 5 · 4.5 · 3.375. Its ends line up with the pans' widest point, and the pans hang inside them at A's points (5.75/18.25 · 4.75/15.25 · 3.375/12.625). The hanging point is now a T under a continuous bar, not A's three-way corner, so at 16 the top reads as one clean bar with two drops under it. (2) The pans are dishes: straight strings meet a flat bottom 3 · 1.5 · 1.5 long through corners of r 1.5 · 1.25 · 1, which is scale-3's box-corner radius, so the sibling shares it. Pan ink 7.5×12.5 · 5.5×10.25 · 4.75×8.75. The pan's height is 1.83 times its width (Central 2.07, A 1.75). White inside a pan 3.68 · 2.15 · 1.89 across (A 3.55 · 1.93 · 1.81). (3) The finial is 2.25 · 1.75 · 1.75 above the beam. (4) The base is widened to 12 · 9.5 · 8.5 of ink, 0.6 · 0.59 · 0.61 of the width (Central 0.6, Lucide 0.55, Nucleo 0.67; A 0.45). Air: pan to post 1.75 · 1.75 · 1.625, pan to base 3.75 · 2.5 · 2.25. Ink 20×20 · 16×16 · 14×14 on the circle keyline, centred. The beam's full-width line matches scale-2's tray and scale-3's platform. Filled: each pan is solid to the outline's outer edge (corners r 2.25 · 2 · 1.625, apex rounded 0.75 · 0.75 · 0.625); the post, beam and base stay lines at 1.5 · 1.5 · 1.25. Cost: the flat bottoms make the pans look more like dishes than bowls. (recommended) It is the calmest of the three at 16 and the closest sibling to scale-2 and scale-3 (flat lines, the same radii) -->
