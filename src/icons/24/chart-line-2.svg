<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- keyline: mark -->
  <!-- tags: line, points, dots, data, graph, no axis -->
  <!-- Dots at the turns, bare: E's zigzag with a solid dot on the peak and on the dip: the data-point idea. Dots are circles at half the stroke (diameter 3 · 3 · 2.5, solid, drawn as more-horizontal's are), standing 0.75 · 0.75 · 0.625 proud of the line. Dots on all four points do not fit: at 16 four dots that still stand proud in the filled twin need 9.75 of run (3 x 3.25) and the 12 mark gives 9.5. The dip is longer than E's (runs 5.25/4/7.25 · 4/3.25/5.25 · 3.375/3.25/4.125) so the two dots keep their air: 2.66 · 1.6 · 2.1 between them, filled 1.66 · 1.6 · 1.6. Ink 18x10 · 14x7.5 · 12x6, declared a mark, centred. Filled: line-heavy at 2.5 · 2 · 2, ends pulled in 0.5 · 0.25 · 0.375, dots diameter 4 · 3 · 3 (0.75 · 0.5 · 0.5 proud); at 16 the filled dip dot hangs 0.25 below the outline's box, declared grows 0 0 0 0.25 - C17's dots-thicken-in-place stretched to data dots, which needs Maruti's ruling. By eye the dots read as joints of a hinged arm more than as data, and at 16 filled they melt into the heavier line -->
  <path d="M3.75 16.25L8.47 11.53A0.75 0.75 0 0 1 9.53 11.53L12.47 14.47A0.75 0.75 0 0 0 13.53 14.47L20.25 7.75"/>
  <path d="M8.25 11A0.75 0.75 0 1 0 9.75 11A0.75 0.75 0 1 0 8.25 11Z"/>
