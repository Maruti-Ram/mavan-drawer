<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: apps, tiles, dashboard, four squares -->
  <!-- Four squares, menu gap: Four rounded squares filling the square keyline (18 · 14 · 12), box-centred. Gap 3 · 3 · 2.5 = two strokes at every master, the air menu keeps between its lines at 24 and 20 (C17), so grid and menu sit as one family. Cells 7.5 · 5.5 · 4.75 outer, counters 4.5 · 2.5 · 2.25. Corner radius 1 · 0.75 · 0.75 on the centreline (outer 1.75 · 1.5 · 1.375 = 23 · 27 · 29% of the cell; checkbox is 18 · 20 · 18% on its 18 · 14 · 12 box, but a proportional radius at 24 would be 0.6, under C10's 0.75 even-bend floor). Smallest gap at 16: 2.5 between cells, counter 2.25. Cost: at 16 the inner cell edges land on 6.75 / 9.25, a quarter pixel off (outer edges stay on 2 and 14); H is the whole-pixel version. Filled: four solid squares on the same outer edges, gap unchanged (recommended: the plain grid everyone reads, on the menu's own spacing) -->
  <path d="M4.75 3.75H8.75A1 1 0 0 1 9.75 4.75V8.75A1 1 0 0 1 8.75 9.75H4.75A1 1 0 0 1 3.75 8.75V4.75A1 1 0 0 1 4.75 3.75Z"/>
