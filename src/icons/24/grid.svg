  <path d="M4.75 14.25H8.75A1 1 0 0 1 9.75 15.25V19.25A1 1 0 0 1 8.75 20.25H4.75A1 1 0 0 1 3.75 19.25V15.25A1 1 0 0 1 4.75 14.25Z"/>
