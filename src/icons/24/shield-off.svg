  <!-- box: 18x20 -->
  <!-- Bar cut through: What the eye sees: the heraldic shield struck through in two long pieces — above the bar, the flat top edge with the right shoulder and the whole right side; below it, the left side running down round the belly into the point. The point is kept whole, so it still reads as a shield and not a cup; Lucide's shield-off reading, built as cloud-off and bug-off are. The bar (C21, V1 spec): \ at 45°, its ink the square keyline 18 · 14 · 12, centreline (3.75,3.75)-(20.25,20.25) · (3.75,3.75)-(16.25,16.25) · (2.625,2.625)-(13.375,13.375) — exactly on shield's own ink centre 12,12 · 10,10 · 8,8 at every master, no snapping needed. shield is portrait (16×20 · 12×16 · 10×14), so the bar stands 1 · 1 · 1 past each side and sits 1 inside its top and its point (bar ink 3–21 against 2–22 at 24, 3–17 against 2–18 at 20, 2–14 against 1–15 at 16): the spec's default for every row; whether a portrait base should hold the bar inside its own width is asked once, on the bell-off board, and this row follows that ruling. shield stays in place (C34). Cut: every stroke stops with 1.5 of air from the bar's edge — cut ends measured 1.505 · 1.505 (one end 1.512) · 1.501, centrelines 3 · 3 · 2.75 apart; round caps on every cut end; tightest air anywhere in the drawing is that cut air. Pieces (24 · 20 · 16): upper 23.13 · 15.64 · 13.08 — from the cut at the top left (24: 0.24 inside the left shoulder round, at (7.01,2.76); 20 and 16: on the top edge at x 7 · 5.515) across the top and the right shoulder, down the right side to (18.93,14.68) · (15.25,11) · (12.375,8.485), i.e. 15° · 2° into the belly at 24 · 20 and 0.46 above it at 16; lower 19.51 · 13.08 · 10.86 — from (15.42,19.67) · (12.11,16.37) · (9.747,13.637) on the right belly, round the point (3.78 · 2.29 · 1.91 of line from the cut to the point, so the point keeps a run on both sides), up the left belly and side to y 9 · 9 · 7.515. Removed: the top-left corner — the left side above that and the left shoulder round, 7.44 · 7.64 · 7.14 of line — and the right belly across the bar, 6.22 · 6.48 · 6.08; 76 · 67 · 64% of the shield's line kept. Nothing under 1.5 is left: the shortest straight is the left side's 3.31 · 1.80 · 1.43 above its belly, which runs on tangent into the belly (no corner, so not a C33 stub). Every uncut segment is shield's own, verbatim. Ink 18×20 · 14×16 · 12×14 (declared box), centred 12,12 · 10,10 · 8,8, outline and filled alike. Mass from the canvas centre, outline +0.26,−0.68 · +0.23,−0.47 · +0.20,−0.42 (shield itself 0,−1.06 · 0,−0.75 · 0,−0.66: the cut takes weight off the top-left, so the mass drops toward the centre and leans a little right); filled +0.32,−0.86 · +0.26,−0.61 · +0.23,−0.55 (shield-filled 0,−0.96 · 0,−0.68 · 0,−0.60). Filled: shield-filled's solid split by a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side; edges on x − y = ±3.19 · ±3.19 · ±3.006), its corners r0.75 · 0.75 · 0.625 — each corner round is the outline's round cap at that cut end, so the filled outer edge is the outline's outer edge exactly; white each side measured 1.506 · 1.506 · 1.501; the bar runs whole through it at 1.5 · 1.5 · 1.25. Two solids, upper right and lower left, nothing removed beyond the outline's removed runs, no sliver. At 16 in real pixels it reads as a struck shield at once, beside cloud-off and bug-off: the top bar and right side, the U with its point, the bar's ends clear of both. Off-grid decimals are the cut ends and the channel's corners, where the circles put them; every other number is shield's own. (recommended) -->
