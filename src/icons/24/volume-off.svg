  <!-- volume-off, square: A state, not a level (C28): centred as its own icon, no anchor. The same speaker drawing as volume, moved right by 5 · 4 · 3 (a pure translation), the bar centred on the speaker. At 24 and 20 the pair sits on the canvas centre; at 16 an odd 7-wide speaker cannot be centred without putting its left and back edges on half pixels, so it moves 3 instead of 3.5: edges on whole pixels (x 4 and 11) and the ink centre 0.5 left of 8. Moving 4 was the other whole-pixel choice; measured, the ink's mass centre sits at x 7.8 with 3 (0.2 left of the canvas centre, the box's lighter side) against 8.8 with 4 (0.8 right), and 3 reads balanced at real size. The C21 bar, \ at 45 degrees through the speaker's centre, square keyline 18 · 14 · 12: the bar's ink is an 18 · 14 · 12 square centred on the speaker, reaching 4 · 3 · 2.5 past it left and right and 1 · 1 · 1 above and below; centreline (3.75, 3.75)-(20.25, 20.25) · (3.75, 3.75)-(16.25, 16.25) · (2.125, 2.625)-(12.875, 13.375). Built as ban: the outline speaker whole and the bar crossing it, joined; filled, the solid with the bar knocked out at its own width (1.5 · 1.5 · 1.25), the same line inverted, which parts the speaker in two, and the bar in ink outside the solid, ending where its centreline meets the solid's edge; slot corners r0.75 · 0.75 · 0.625, centred on the outline's line. Off-grid decimals: the speaker's cone tangents (volume's, moved) and the slot's edges and corners where it meets the solid's edge. Ink 18x18 · 14x14 · 12x12, centred on 12,12 · 10,10 · 7.5,8, filled identical. (recommended) -->
