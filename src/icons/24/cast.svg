  <!-- Corner arcs: Rhythm: dot, arc and cut wall sit 1.5 apart as the eye sees them — dot→arc 1.50 at the dot’s rounded corner and 1.61 · 1.61 · 1.65 square to its sides, arc→arc 1.50 (24), arc→wall 1.5 at every master. The signal mark (shared exactly with cast-mobile): a 2×2 rounded-square dot on whole pixels (renders solid at 16; a stroked circle that small renders 50% grey), arcs centred on it within 0.008 — r 3.36 / 6.37 at 24, 3.36 at 20, 3.28 at 16 (dot + one arc at 20 and 16; two arcs in 6 px turned to speckle). Arc ends sit on the walls’ centrelines, so the arcs read as the walls continuing. The Chromecast picture (Lucide cast, Material cast, Tabler cast, Phosphor Screencast). Screen on the landscape keyline 20×16 · 16×12 · 14×10, radius 2.5 · 2 · 1.5. Walls cut back 1.5 from the last arc: left stub 2.38 · 1.89 · 0.85 straight, bottom 6.38 · 5.89 · 4.85. Balance (ink mass from the canvas centre, x, y; + is right, down): outline −0.19, 0.07 · 0.27, −0.18 · 0.21, −0.14 — no shift. Filled leans 0.86, −0.54 · 0.61, −0.34 · 0.72, −0.34 because the bite empties the lower-left; the screen fills the keyline width, so a shift would leave the keyline; not shifted. Filled: the screen goes solid with a quarter bite round the arcs (r 8.62 · 5.61 · 5.405, 1.5 of white), its corners rounded by the outline’s own caps (0.75 · 0.75 · 0.625); dot and arcs at the outline weight — the same picture, heavier. Ink box identical in both styles. Crispness at 16: frame edges and dot on whole pixels; the arc and the round caps are curves and anti-alias. Decimals: arc radii keep the centre on the dot; cut ends are where the air reaches 1.5; 16’s arc end 3.635 (off the eighth grid) is what makes the dot air 1.5 rather than 1.6. -->
