ntre. Filled: disc r 7 · 5.5 · 5 joined to the ribbon at the leg’s outer edge (14.14 · 11.52 · 10), one solid with a sharp V at the fillet’s centre (19.37 · 16.37 · 13.768), tip arcs 1.5 · 1.5 · 1.25; the white ring r 5.5→4 · 4→2.5 · 3.75→2.25, face ⌀ 8 · 5 · 4.5, every white 1.5; outer edge equals the outline’s. -->
