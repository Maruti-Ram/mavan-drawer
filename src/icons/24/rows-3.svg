<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: rows, three rows, guides, layout grid, view -->
  <!-- Three row guides: columns-3 turned a quarter. A's frame and A's divider positions (y 9.25 / 14.75 · 8 / 12 · 6.375 / 9.625), but the dividers stop short of the side walls — row guides in one room, as a design tool's layout grid draws them, rather than walls. Guide ink 12 · 8 · 6 long (centreline x 6.75–17.25 · 6.75–13.25 · 5.625–10.375); air from each guide's round end to the side wall 1.5 · 1.5 · 1.75 — at 16 the 1.75 (not 1.5) keeps one clear pixel column left and right (columns 4 and 11), columns-3's lesson turned. Pitch 5.5 · 4 · 3.25; rows of air 4 / 4 / 4 · 2.75 / 2.5 / 2.75 · 2.5 / 2 / 2.5 as A; margins to the canvas 3 · 3 · 2 on all four sides. Tightest air at 16: 1.75 (cap to wall). How it differs: one room with guides instead of three rooms; drag-handle-3 is three short lines with no frame, menu three long ones. Risk: this is the strongest collision of the three — two short level bars centred in a rounded square, 3.25 apart and 6 long at 16, is how an equals sign in a square is drawn (Lucide ships square-equal beside rows-3, whose lines run wall to wall as A's do), and the filled twin — the square solid with two 1.5 white slots, round-ended, 12 · 8 · 6 long — is a filled equals key; in pixels at 16 it is two 6-pixel bars two clear rows apart inside the frame, nothing else. It is columns-3's pause-in-a-square turned; pause is a media control on every screen and equals is not on our sheet, so the cost is lower here than there, but there it was a risk taken knowingly and here it is the first reading. Recommendation: leave rows-3 unused (C9 allows the gap until the set ships) unless the strict mirror of columns-3 matters more than the reading. Filled: columns-3-filled turned — the square solid on the outline's outer edge (outer radius 3.25 · 2.75 · 2.125) with two 1.5 white slots centred on the guides (y 8.5–10 / 14–15.5 · 7.25–8.75 / 11.25–12.75 · 5.625–7.125 / 8.875–10.375), round-ended, as long as the guides' ink -->
