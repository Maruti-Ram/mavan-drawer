p 3 · 3 · 2.63, beside its leg caps 6.25 · 4.25 · 3.5, above them 6.81 · 3.81 · 2.38. Off-grid decimals in the filled twin: the knockout's cap points and bend tangents (import-filled's). Ink 20×18 · 16×14 · 14×12, desktop's own box, centred. Lint: clean. (recommended in this board's sense: it holds every rule at 24 · 20 · 16 in both styles and keeps the whole desktop; both pictures ship, A as desktop-download) -->
