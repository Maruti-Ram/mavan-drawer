  <!-- Bar 1 right, 1 up: What the eye sees: the same struck camera with the bar moved 1 right and 1 up, so a crescent of the lens survives at every master — the lower-left of the ring, 148° · 133° · 111° of it, hugging the bar — and at 16 in real pixels it reads as a camera with its lens struck, not a folder. The hump keeps its top right corner, shoulder and right side. OUTSIDE C21's centred bar, as cloud-off is: moved 1 right and 1 up at every master (1.41 square to the bar; cloud-off moved 1 left, 1 down — the lens sits below and left of the bar, so the bar moves the other way). The least whole step that saves the lens: 1 right alone (0.71 square to the bar) keeps 121° · 90° · 61° (6.86 · 3.53 · 2.54) — at 16 a 2.5 tick, not a ring — and loses camera-2's lens at 20 and 16; 1 right and 1 up is the most the margin allows (the bar's ends then stand on the margin edge, 22 and 2 at 24). The bar (C21, V1 spec): \ at 45°, its ink the square keyline 18 · 14 · 12, centreline (4.75,2.75)-(21.25,19.25) · (4.75,2.75)-(17.25,15.25) · (3.625,1.625)-(14.375,12.375) — centred 1 RIGHT and 1 UP of camera's ink centre, at 13,11 · 11,9 · 9,7. camera stays in place (C34); the bar alone moves, so the composite grows to 20×19 · 16×15 · 14×13 and sits 0.5 ABOVE the canvas centre (declared box; optical 0 −0.5, as cloud-off declares its 0.5). Cut: 1.5 of air at every cut end, measured 1.505 · 1.505 · 1.501 (centrelines 3 · 3 · 2.75 apart), save the lens's two ends at 24 and 20, 1.512, where the 2 dp point nearest the cut sits on the ring or just inside it so the arc does not swell toward the floor; round caps on every cut end; the tightest air in the drawing is 1.505 · 1.502 · 1.501 (at 20 the lens over the floor, camera's own 1.5). Pieces (24 · 20 · 16): upper 19.85 · 12.37 · 9.83 — from the hump top at x 10 · 10 · 8.515 over its right corner and shoulder, down the right wall to y 15 · 11 · 8.485; lower 28.54 · 21.00 · 18.47 — from the floor at x 18 · 14 · 11.485, round the bottom-left corner, up the left wall into the top-left corner to (4.22,6.47) · (3.76,6.01) · (2.776,4.666); lens 8.40 · 5.23 · 4.62. Removed: the shoulder, the hump's left side and corner and the first 0.88 · 1.98 · 2.10 of its top, 6.73 · 7.00 · 6.49; the bottom-right corner, 7.43 · 7.64 · 7.12; the lens's upper right, 12.02 · 8.91 · 10.30. 77 · 69 · 67% of the body line kept. Ink 20×19 · 16×15 · 14×13 at 2,2 · 2,2 · 1,1, outline and filled alike. Filled: camera-filled's solid split by a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side), its corners r0.75 · 0.75 · 0.625 — each the outline's round cap at that cut end, so the filled outer edge is the outline's outer edge exactly; white each side measured 1.506 · 1.506 · 1.501; the bar runs whole through it at 1.5 · 1.5 · 1.25. Lens, filled: the lens hole opens into the channel on the lower-left as a round bay 3.87 · 2.87 · 2.29 deep, corners r0.75 · 0.75 · 0.625; at 24 the glass beyond the channel is 2.37 thick, so it stays as a half-disc island with its corners rounded r0.75; at 20 and 16 it would be 1.37 · 0.79, under the line weight, so the bay is one hole. One bar position runs through the row (C21 dated note), so B1–F1 draw the rest of the row on this offset. Every uncut segment is camera's own, verbatim; off-grid decimals are the cut ends, the channel's corners and the lens bay's, where the circles put them. (recommended) -->
