  <!-- Splayed arc: A large head over one shallow arc whose ends splay outward, filling the square guide box (18 · 14 · 12). Elegant and very light - the shoulders are suggested, not drawn. The cost: the arc is thin against the head (it can read as a ball over a brow or a smile upside down), and the filled twin is a low hill, the biggest outline-to-filled change of the ten. Head 10 · 8 · 6 across (56 · 57 · 50% of the body's width), body 18 · 14 · 12 wide × 6.5 · 4.5 · 4.5 tall, gap between head and body 1.5 · 1.5 · 1.5 (filled 1.5 · 1.5 · 1.5). Ink box 18×18 · 14×14 · 12×12, filled box identical. Arc radius 9.31 · 8.01 · 6.07, rising 5 · 3 · 3.25 over a span of 16.5 · 12.5 · 10.75. The arc is a curve, so nothing here leaves 0/45/90. Filled: the closed shape under the arc's outer edge, round caps as corners. Natural in a ring; for users the rear arc would cross the front head's gap, so it needs care. -->
  <path d="M7.75 8A4.25 4.25 0 1 0 16.25 8A4.25 4.25 0 1 0 7.75 8Z"/>
  <path d="M3.75 20.25A9.31 9.31 0 0 1 12 15.25A9.31 9.31 0 0 1 20.25 20.25"/>
