  <!-- Laptop and phone: Rhythm: laptop A from the laptop board (its recommended pick) with the phone in front at the bottom right; the screen's bottom line and the base line both stop 1.5 from the phone, so their ends line up. Laptop: screen ink 16×11.5 · 13×9 · 12×8 (laptop A's own screen at every master), radius 2.5 · 2 · 1.5; base line under it with laptop A's 2 · 1.5 · 1.5 of air, running 2 · 1.5 · 1.5 past the screen on the left as in laptop A; the base shows 10.5 · 9 · 7.5 of ink. Depth: the phone's floor sits 3 · 2 · 1.25 below the base. Ink 20×18 · 16×14 · 14×12, centred both ways. Phone: mobile A's walls 1.5 · 1.5 · 1.25 on a smaller body, ink 8×12.5 · 5.5×9 · 5×7.5 (0.64 · 0.61 · 0.67; mobile A 0.60 · 0.63 · 0.57); corner radius 1.5 · 1.25 · 1 (the detail radius, outer 2.25 · 2 · 1.625) — mobile's 2.5 · 2 · 1.5 on a body this narrow left no flat top at 20 and read as a capsule. One mark at 24 only: a chin line wall to wall with 1.5 of white above the floor (mobile D's chin), and in the filled twin a 5×1.5 slot with 3 of solid below it, mobile A's filled bar in the same place. At 20 and 16 the white inside is 2.5 wide and a chin split it into an "8"; the plain slab reads as a phone there, so the mark is dropped (drop a part rather than squeeze). Mobile A's bar needs 7 · 6 · 5.5 of white inside and mobile B's dot 5 · 5 · 4.5; the phone cannot grow — its width is capped by the stand or base (a 6-wide phone at 16 leaves a 2.75 foot in A) and its height by the 1.5 under the back device's top-right corner (12.5 · 9 · 7.75 at most). Cut-back (C33 practice): the back device stops 1.5 short of the phone's ink — its bottom line's cap and its right wall's cap both 1.5 away at 24 and 20, 1.5 at the side and 1.75 at the top at 16 (a 0.25 wall left past the corner was removed, not kept as a stub); its top-right corner stays whole above the phone. Filled: the back device solid with a notch that keeps the same 1.5 of white round the phone (notch corner r3.75 · 3.5 · 3.125, its ends rounded like the outline's caps), the phone solid; the base stays a line at 1.5 · 1.5 · 1.25. Balance: the ink leans right of centre by 1.20 at 24 (0.91 filled, 0.67 at 16; measured by the polish review) — the laptop's base reaches 2 past the screen on the left while the phone stands at the right. The box already spans the keyline 2–22; moving the phone left only shortens the base and cuts more of the screen, so it is left as laptop draws it (shortening the overhang to 1.5 would break laptop's 2). Cost: at 16 the half-hidden laptop is a screen corner over a short line, and it reads less surely than A's stand. Who: Material devices (screen on a base, phone at the right), Nucleo laptop-mobile, Fluent phone_laptop (phone on the left). -->
