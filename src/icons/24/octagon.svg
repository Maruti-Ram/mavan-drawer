  <!-- Plain octagon: The plain shape. Lucide `octagon` and SF Symbols `octagon` (rendered to check) draw this one picture, flat side up. Rhythm and balance: this is alert-octagon's body exactly, every coordinate the same at every master and in both styles, so octagon and the four alert-octagons share one shape. Flats 20 · 16 · 14 of ink on the circle keyline (centreline apothem 9.25 · 7.25 · 6.375). Eight equal sides of 7.66 · 6.01 · 5.28. Corners at the container radius 2.5 · 2 · 1.5 (filled 3.25 · 2.75 · 2.125), so each side keeps 5.59 · 4.35 · 4.04 straight (73 · 72 · 76%). Size: its ink area is 1.049 · 1.048 · 1.050 of the ⌀20 · 16 · 14 circle. Lucide's octagon measures 1.051 of its circle (worked out from its path) and SF Symbols' 1.013 (rendered, pixels counted), so it matches Lucide's size and is 3.5% bigger than SF's. In real pixels the four flats land on whole pixels at every master. At 16 the plain octagon reads close to a soft disc: its outer corner of 2.125 leaves only 4.04 of a 5.28 side straight. E is the clearer octagon at 16, but A is alert-octagon's body. Filled: alert-octagon-filled's solid body without its cuts. Ink box 20×20 · 16×16 · 14×14, filled identical. (recommended) -->
