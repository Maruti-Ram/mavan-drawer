<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: stand, chin -->
  <!-- box: 20x18 -->
  <!-- Chin: Ink 20x18 · 16x14 · 14x12 (agreed box, as briefcase and folder), box-centred both ways. Screen 20x14 · 16x11 · 14x9 of ink (1.43 · 1.45 · 1.56 : 1), container radius 2.5 · 2 · 1.5. Neck on the centre line, 2.5 · 1.5 · 1.75 of it showing between the screen and the foot (floor 1.5); foot 9 · 7 · 6 of ink (45% · 44% · 43% of the screen). Chin line 4 · 3.5 · 3 above the screen's bottom line, so the chin band (line included) takes 39% · 45% · 47% of the screen's height; clear above 7 · 4.5 · 3.5, below 2.5 · 2 · 1.75 (floor 1.5), so the chin holds at 16 and nothing is shed. 16 master at stroke 1.25: centrelines on the eighth grid so the screen's outer edges and the foot's bottom are whole pixels; the neck at x 8, as briefcase's clasp, which on a 1.25 line covers two pixel columns at 62% (the same softness the clasp has); foot ends at x 5.625 / 10.375 (calendar's pegs) so its ink runs 5 to 11. Filled: screen solid, outer edge on the outline's (radius 3.25 · 2.75 · 2.125); the chin line becomes a 1.5 cut through to the walls, corners eased 0.5, as calendar's header (at 16 the cut shares the line's bottom edge at y 8, a whole pixel, so the chin is 3 tall in both styles); chin piece 4 · 3.5 · 3 tall; neck and foot stay lines at 1.5 · 1.5 · 1.25. A with a chin line across the screen, the all-in-one look (Polaris draws one). The chin is deep because of the filled twin: its bottom piece has to hold the corner radius plus the 0.5 ease above it, so the line cannot sit closer to the bottom than 4 · 3.5 · 3. -->
  <path d="M5.25 3.75H18.75A2.5 2.5 0 0 1 21.25 6.25V13.75A2.5 2.5 0 0 1 18.75 16.25H5.25A2.5 2.5 0 0 1 2.75 13.75V6.25A2.5 2.5 0 0 1 5.25 3.75Z"/>
