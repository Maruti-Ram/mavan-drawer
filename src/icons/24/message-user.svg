  <!-- box: 19x19 -->
  <!-- Head and shoulders on the corner: Head and shoulders on the corner (recommended: the only person picture that holds every rule at every master). The shipped message bubble, unchanged and in place, with a head and shoulders as a C33 badge on its bottom-right corner, the badge's ink corner on the margin edge (22 · 18 · 15). The figure is user-circle's crop of user (a head over a shoulder arc, the base dropped), drawn to the lock's size, because no figure fits inside the bubble at 20 or 16 (the board's first line). Badge ink 8×9.5 · 7×8.25 · 6×7 at (14, 12.5) · (11, 9.75) · (9, 8): password-lock's lock and user-lock's exactly, so the figure stands as large as the lock that user-lock and user-shield put beside a figure. Head: at 24 a ring ⌀4.5 of ink (centreline r 1.5, the hole 1.5, the floor; user-focus A's 20 head); at 20 and 16 a solid dot ⌀3 · 2.5 (r 0.75 · 0.625, half the weight, the largest a stroke closes), as id-card's and user-focus A's are. A ring at 20 needs 4.5 of height and leaves the shoulders a flat line; a ring at 16 does not fit at all. Shoulders: one arc, 8 · 7 · 6 wide of ink, its round caps on the margin edge, rising 2 · 2.25 · 1.75 on the centreline (3.5 · 3.75 · 3 of ink). It is drawn as two arcs through its on-grid apex (18, 19.25) · (14.5, 15) · (12, 12.625), as user-circle draws its dome, so the 2 dp radius cannot move the apex. Head 56 · 43 · 42% of the shoulders' width (user-circle: 8 of 14, 57%). Head to shoulders 1.5 · 1.5 · 1.5, user's, measured 1.500 at every master in both styles. Axis x 18 · 14.5 · 12. Composite ink 19×19 · 15×15 · 13×13 (calendar-repeat's box, as message-alert), centre 0.5 toward the badge, declared as box; no base note, since 0.5 is within the centre. Cut back by hand with 1.5 of air from the figure's ink, one open path in the shipped path's own segments, the closing Z written as its line (message-alert's form). The right wall stops at y 10.75 · 7.75 · 6.125, leaving 4.5 · 2 · 2 straight past the top-right corner, 1.59 · 1.66 · 1.54 from the head. The bottom wall stops at x 13.25 · 10.25 · 8.375, its cap ending on the badge's ink box (V2 rule 3a; air alone would let it run to 13.75 · 10.9 · 8.82). That leaves 3.82 · 1.92 · 1.45 straight past the tail's fillet, 1.98 · 2.45 · 1.92 from the head and 3.02 · 1.93 · 2.23 from the shoulders. At 16 that 1.45 is 0.05 under C33's 1.5. It is kept because it is not a wall past a corner but the run the tail turns out of: removed, the tail would end in its own 1-radius fillet as a hook. The bottom-right corner goes at every master. Tightest air, outline: 1.59 · 1.66 · 1.54, the right wall's end to the head. Filled: the shipped message-filled solid cut along the head's ink grown 1.5 (radius 3.75 · 3 · 2.75 round the head); the shoulders' grown edge does not reach the solid at 24 (it touches the solid's bottom edge only inside the head's bite) and lies inside the white at 20 and 16. The solid's two cut ends are round caps at the outline cap radius 0.75 · 0.75 · 0.625, each centred exactly on the outline wall's end (20.25, 10.75 · 16.25, 7.75 · 13.375, 6.125, and 13.25, 16.25 · 10.25, 13.25 · 8.375, 10.375), so the filled outer edge ends where the outline's ink ends. Each cap is joined to the bite by a straight line tangent to both, 0.9 · 1.12 · 0.52 long at the right wall and 2.14 · 2.83 · 1.74 at the bottom, where it drops nearly straight down the bite's left side, so every junction is smooth and needs no ease. The figure fills as user-filled: the head a disc r 2.25 · 1.5 · 1.25 (the outline's outer edge), the shoulders solid to the arc's outer edge (r 4.39 · 3.56 · 3.112), closed by the end caps' round and a flat base on the caps' bottoms (y 22 · 18 · 15), as user-focus A fills its shoulders. Tightest air, filled: 1.50 at every master, solid to head, by construction (measured 1.504 · 1.505 · 1.501); solid to shoulders 3.03 · 1.93 · 2.23; head to shoulders 1.5. Filled ink box identical. Off-grid values: 9.43, 8.37, 5.03, 6.923, 6.216 and the like are the shipped bubble's own. The shoulders' radius 3.64 · 2.81 · 2.487 is the circle through the caps' centres and the apex (exactly 3.6406 · 2.8056 · 2.4866). In the filled twin they are tangent points: right cap to bite 20.02,11.46 / 19.16,11.18 · 16.12,8.49 / 15.02,8.29 · 13.213,6.729 / 12.716,6.594; bite to bottom cap 14.28,14.24 / 13.99,16.35 · 11.56,10.63 / 10.98,13.4 · 9.291,8.773 / 8.991,10.483, each point on the bite rounded away from the head so the rounded point keeps 1.5. The shoulders' outer edge meets the caps at 14.08,20.91 · 11.02,17.1 · 9.028,14.19 and mirrors; at 24 and 20 each cap is written through its outermost point (14, 21.25 · 11, 17.25 and mirrors), so the rounded tangent point cannot move the ink box. In real pixels at 16 the head is a 2-pixel dot over a 6-pixel arch beside the bubble's open corner, outline and filled; the filled reads as the set's solid person at once. -->
