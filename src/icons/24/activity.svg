  <!-- tags: pulse, heartbeat, ecg, health, monitor, spike -->
  <!-- Steep spike: (recommended) The pulse every reference draws, and the only one of the five that reads as a heartbeat at 16: flat lead-in, a spike up, one long stroke down through the baseline, a spike back up, flat lead-out on the same baseline. ANGLE EXCEPTION for Maruti: every leg runs at run x rise 1 x 3 (71.57° from level) at all three masters and in the filled twin. Measured references, none at 45°: Feather/Untitled 1 x 3 (71.6°), Lucide 74.3°, Nucleo pulse 66-67°, Central heart-beat 61-63°. Landscape keyline 20x16 · 16x12 · 14x10, centred, filled identical; the spike reaches 8 · 6 · 5 above and below the baseline, 11.83 · 9.16 · 7.63 wide, flats 3.34 · 2.67 · 2.56 long. C10 bends everywhere (0.75 · 0.75 · 0.625, filled 1.25 · 1 · 1); on a 37° apex the even-width bend blunts the tip, so each apex vertex sits 0.87 · 0.87 · 0.73 beyond the ink (filled 1.45 · 1.16 · 1.16), placed so the tips land on whole units - the tangent points this leaves are off the grid by construction, rounded to 2 · 2 · 3 dp. Air: flat to the long leg 4.62 · 3.36 · 2.8, filled 4.33 · 3.21 · 2.58. The wedge inside each spike reaches 1.5 of air 3.87 · 3.87 · 3.62 below the tip (48 · 65 · 72% of the spike's depth; filled 4.87 · 4.37 · 4.37, 61 · 73 · 87%), so at 16 the top of each spike is one dark wedge - Feather's own drawing at 16 px measures 77%. A 1 x 2 leg (63.4°) was measured and not drawn: it cannot fill this box (flats at 16 1.23, filled 0.76), and as a 12x7.5 mark its wedge still opens only at 78%. Apart from chart-line: no axis, and the line starts and ends level instead of climbing; apart from trending: no arrowhead, no climb, and legs three times steeper than their 45°. Filled: line-heavy at 2.5 · 2 · 2, ends pulled in 0.5 · 0.25 · 0.375, tips held on the outline's ink box -->
