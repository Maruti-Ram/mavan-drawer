  <!-- % on the card's corner: Discount card: credit-card (bar left) kept exactly where credit-card has it (ink 20×16 · 16×12 · 14×10), with a % as a C33 line badge on its bottom-right corner, its ink corner on the margin edge (22 · 18 · 15), the same strings in both styles. Which %: percent's rings cannot come down to badge size. A ring needs 1.5 of hole (ink ⌀ 4.5 · 4.5 · 4) and 1.5 to the slash, and two of them on a 45° slash take a box of at least 10.86 · 10.86 · 9.83, against a badge of 8–9.75 · 7–8.25 · 6–7 (password-lock's lock, calendar-repeat's loop). So at every master the holes go (§6: a detail that cannot hold 1.5 goes), as percent-filled closes its rings, and what is left is the set's in-container %, percent-circle's and ticket-percent's: a 45° slash with two solid dots. It is drawn on percent's own construction, the slash corner to corner of the badge's box and the dots on the other two corners, their outer edges on the box. Not percent-2: its 63° slash is an angle exception and its rings want a wider box still. Not ticket-percent's 20 and 16 %: those hold dot to slash at C19's 1 under glyph: dot; this one holds 1.5 and needs no note. Badge ink 9×9 · 7×7 · 6×6 (the lock 8×9.5 · 7×8.25 · 6×7; V2's plus and x 8 · 6 · 5), box 13→22 · 11→18 · 9→15. Dots ⌀ 3 · 2 · 1.75: percent-circle's 3 at 24, ticket-percent's 2 at 20; at 16 percent-circle's ⌀2 needs a 6.5 box to keep 1.5 from the slash, which brings the upper dot to 1.25 under the stripe, and in a 6 box leaves 1.2 to the slash, so 1.75: a new dot for 16, between percent-circle's 2 and ticket-percent's 1.5. At 24 and 20 the dots' edges fall on whole units. Dot to slash 1.99 · 1.79 · 1.505. Box 20×18 · 16×14 · 14×12 (declared), the card's box plus the 2 the % stands below it; centre 12,13 · 10,11 · 8,9, 1 below the canvas centre at every master: the card keeps its place, as credit-card-lock and credit-card-contactless ship it, so the files declare <!— base: credit-card —> and lint holds the composite to the card's left and top edges. Cut back by hand with 1.5 of air from the %'s ink, by credit-card-lock's rules. Bottom wall stops at x 10.75 · 8.75 · 6.875, 5.5 · 4 · 3.75 past its corner, its cap's ink ending at 11.5 · 9.5 · 7.5, 1.5 left of the %'s box, where the filled solid ends too; 2.11 · 2.11 · 2.15 from the slash's lower end (the slash alone would let it run on to 11.5 · 9.5 · 7.625). Right wall stops on the stripe's line at every master, y 8.75 · 7.75 · 6.625, so the stripe closes the top band: at 24 and 16 that is credit-card-lock's own cut, 1.5 past its corner; at 20 it is 1 past its corner, closed by the stripe rather than ending in air (credit-card-lock's 20 runs on to 8.25 because its stripe stops short of the shackle). The % would let the wall run on to 10.75 · 8.75 · 6.875, a stub under the stripe that credit-card-lock left out. Stripe whole at every master, 3.5 · 2.5 · 1.75 above the % (upper dot and slash end alike). Bar: whole at 24, 3.05 from the upper dot. At 20 and 16 the upper dot stands at the bar's own height, so in the filled twin its 1.5 of white would run into the bar's slot; the bar stops at x 7.25 · 5.625 (was 8.25 · 6.625; ink 3 · 2.5, was 4 · 3.5) to leave the line weight, 1.5 · 1.25, of solid beside its slot, and the outline is cut with it so the pair keeps one bar, as credit-card-lock's 16 is. Tightest air, outline: card to % 2.11 · 2.11 · 1.75 (the bottom wall's end to the slash at 24 and 20, the stripe at 16); inside the % 1.99 · 1.79 · 1.505, dot to slash. Filled: credit-card-filled's top band whole (5 · 4 · 3 from the %); the lower solid ends on one straight edge where the outline's bottom wall's ink ends, x 11.5 · 9.5 · 7.5, 1.5 left of the %'s box, from the stripe's gap to the bottom, its two corners at the cap's radius 0.75 · 0.75 · 0.625 so its bottom edge ends where the outline's does, as credit-card-contactless-filled ends its lower part on one straight edge and credit-card-lock-filled's cut runs straight up. Cut along the % instead, it would leave a tooth of solid between the upper dot and the slash, about 2.8 · 1.9 · 1.4 proud of that edge, and a horn down the right edge the outline no longer has. The % in the filled twin is the outline's, at 1.5 · 1.5 · 1.25: percent-filled thickens its slash to 2.5 · 2 · 2 because a line-heavy icon has nothing to fill, and closes its rings into dots; here the dots are solid already and the slash is a line badge on a shape base, which C33 keeps at the outline weight (V2's plus and x, credit-card-contactless's waves); at the filled weight it would stand 1.49 · 1.54 · 1.13 from the dots. Filled air 1.5 · 1.5 · 1.5 (the straight edge to the upper dot; the slash 2.11 · 2.11 · 2.15 from the solid); solid beside the bar's slot 1.5 · 1.5 · 1.25; ink box equal to the outline's. Every value on its master's grid. (recommended: the rules decide it; Polaris CreditCardPercent draws the same picture, its card's bottom and right walls cut back the same way) -->
