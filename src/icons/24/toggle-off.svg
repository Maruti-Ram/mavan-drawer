<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: switch, off, disabled, inactive, setting, pill, ring, joined -->
  <!-- box: 20x12 -->
  <!-- Ring knob on the wall, off: toggle-on mirrored about the canvas centre, in place: the knob ring is the track's left end and the track runs from it to the right. Ink box unchanged, 20×12 · 16×10 · 14×8, centred; margins 2 · 2 · 1 left and right, 6 · 5 · 4 top and bottom. Every number is toggle-on's reflected (x → 24 − x · 20 − x · 16 − x), so all stay on the grid: at 16 the ring's centreline edges 7.625 / 14.375 land on 8.375 / 1.625, x.375 and x.625 trading places. Knob 12 · 10 · 8 across, white inside 9 · 7 · 5.5; air from the knob to the track's far end 6.5 · 4.5 · 4.75 (unlock's shackle air is 3.5 · 2.5 · 2.375); track showing right of the knob 8 · 6 · 6. Filled: toggle-on-filled mirrored, a solid pill with the knob knocked out at the left, hole 9 · 7 · 5 with 1.5 of wall round it at every master, solid track right of the hole 9.5 · 7.5 · 7.5. On and off differ only in which end the hole sits, exactly as the outlines do, so a button that swaps them moves only the knob. Fluent ToggleLeft, Phosphor toggle-left, Material Icons and Material Symbols toggle_off draw their filled off this way (recommended) -->
  <path d="M8 6.75H16A5.25 5.25 0 0 1 16 17.25H8"/>
  <path d="M13.25 12A5.25 5.25 0 1 1 2.75 12A5.25 5.25 0 1 1 13.25 12Z"/>
</svg>
