<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: password, access, credential, classic, diagonal -->
  <!-- Diagonal ring, two teeth: The common key, drawn on the search icon's frame: ring bow bottom-left, shank on the 45° diagonal to the top-right corner, two teeth hanging to the lower right just short of the tip, the first longer than the second like a cut key. Same 18 · 14 · 12 square ink box as search, so the two sit at one size in a toolbar; the bow is a little over half the box (61 · 57 · 58%), clearly smaller than search's lens (15.5 · 12 · 10.5), so the two never read as each other. At 20 the bow is 8 rather than a scaled 8.5 so its centre, edges and filled hole land on whole pixels. Bow ring, outer ⌀ 11 · 8 · 7, centre 8.5,15.5 · 7,13 · 5.5,10.5, centreline radius 4.75 · 3.25 · 2.875; air inside the bow 8 · 5 · 4.5. Shank on the 45° diagonal from the bow's ring to the tip at 20.25,3.75 · 16.25,3.75 · 13.375,2.625: 11.75 · 9.25 · 7.875 across and up from the bow's centre (16.62 · 13.08 · 11.14 long), 11.87 · 9.83 · 8.26 of it clear of the bow's outer edge. Teeth at 90° to the shank, two: each starts 2.5 & 4.75 · 2 & 4.25 · 1.875 & 3.875 left and the same down from the tip (back along the shank) and runs 2.5 & 1.75 · 2 & 1.5 · 1.875 & 1.25 right and the same down, i.e. 3.54 & 2.47 · 2.83 & 2.12 · 2.65 & 1.77 long, standing that far proud of the shank's edge; the two are 3.18 · 3.18 · 2.83 apart centre to centre. The first tooth ends straight below the tip so it never widens the box. Filled: the bow solid to its outline's outer edge with a round hole ⌀ 3 · 2 · 3 at its centre (sized so its edges land on whole pixels at each master); shank and teeth stay lines at 1.5 · 1.5 · 1.25. Ink box 18×18 · 14×14 · 12×12, filled identical, centred. Gaps between stroke edges: 24: bow to tooth1 6.83, bow to tooth2 3.65, tooth1 to tooth2 1.68; 20: bow to tooth1 5.5, bow to tooth2 2.32, tooth1 to tooth2 1.68; 16: bow to tooth1 4.36, bow to tooth2 1.53, tooth1 to tooth2 1.58. Smallest at 16: 1.53. Off-grid numbers are the points where the shank meets the bow (on the 45° line, rounded to 2 dp · 2 dp · 3 dp) only; the bow centre and radius, tip, tooth and bit points are on the quarter grid (eighth at 16) - lengths along the diagonal are therefore those numbers × 1.41, given above. Why: it is the key everybody already reads, it matches search's box and diagonal exactly, and of the two-tooth diagonals it keeps the most air in the bow at 16 (4.5, against D 3.5 and C 2.5) while holding 1.5 everywhere, and its filled twin stays a solid bow with a crisp hole (recommended) -->
  <path d="M3.75 15.5A4.75 4.75 0 1 0 13.25 15.5A4.75 4.75 0 1 0 3.75 15.5Z"/>
  <path d="M11.86 12.14L20.25 3.75"/>
  <path d="M17.75 6.25L20.25 8.75"/>
  <path d="M15.5 8.5L17.25 10.25"/>
</svg>
