  <!-- box: 20x18 -->
  <!-- base: window -->
  <!-- Window, pointer badge: Pointer badge on the window: the shipped window, unchanged and in place, with the set's small pointer as a C33 badge on its bottom-right corner, the pointer's ink corner on the margin edge (22 · 18 · 15) — the picture Nucleo window-pointer draws. Pointer: drag-drop's and select's dart verbatim (cursor-click's dart at 82 · 89 · 87%; cursor-3's shape: tip 50 degrees, edges at 20 and 70 degrees, notch 1.5 · 1.25 · 1, bends 0.75 · 0.75 · 0.625, C10), moved 0.5 right and 0.5 down at 24 and 20 and not at all at 16, so its corner reaches the margin. Ink 10×10 · 7.75×7.75 · 6.5×6.5 (password-lock's lock 8×9.5 · 7×8.25 · 6×7, calendar-repeat's loop 9.75 · 8.25 · 8.125; the dart inks about a third of its box). Not cursor's tailed pointer: scaled to the same 6.5 box at 16 its tail shuts (0.09 of white left inside it). The same drawing goes on globe-pointer (kit: v3-kit-pointer). Box 20×18 · 16×14 · 14×12: window's 20×16 · 16×12 · 14×10 plus the 2 the pointer stands below it; centre 12,13 · 10,11 · 8,9, 1 below the canvas centre at every master. The window keeps its place, as subscription and credit-card-contactless keep theirs on the same landscape keyline, and Maruti approved it in place (2026-10-25), so the files declare <!— base: window —> and lint holds the composite to the window's left and top edges, 1 below centre. Cut back by hand with 1.5 of air from the pointer's ink: the right wall stops at y 12.25 · 9.75 · 7.75, 5 · 3 · 2.625 past its corner (air 1.57 · 1.51 · 1.59); the bottom wall stops at x 11.5 · 9 · 7, 6.25 · 4.25 · 3.875 past its corner (air 1.6 · 1.53 · 1.61); the bottom-right corner goes, and with it whatever lay in the pointer's notch. The tip points into the empty body, so no wall is left as a sliver beside it. Traffic lights: only the first stays. The window is 12 · 10 tall at 20 · 16 and the tip lands under the dot row: the second and third dots are 4.31 · 1.88 · 1.95 and 3.03 · 1.46 · 1.34 from the pointer. The third misses the 1.5 floor in the outline at 20 and 16; in the filled twin the cut, 1.5 off the pointer, leaves 0.38 · 0.45 of solid beside the second hole at 20 · 16 (floor 1.5 · 1.25) and runs into the third. Two holes need a pointer no more than 6.75 · 5.75 across at 20 · 16, smaller than every shipped badge, and any badge-sized pointer (7 · 6 or more) leaves room for the first dot only. So one dot stays at every master, as password-lock keeps one; 24 alone could hold all three (1.53 of solid beside the third hole). Tightest air: outline 1.57 · 1.51 · 1.59 (right wall end to the pointer); filled 1.5 · 1.5 · 1.5 (the cut to the pointer, by construction). Filled: window-filled's slab cut along the pointer's ink grown by 1.5 — the grown upper and lower edges and the tip arc r 3 · 3 · 2.75 — with the two junctions eased 0.5 where the cut meets the right and bottom edges at 70 degrees; one hole, window-filled's first (2 · 2 · 1.5 across), 5.3 · 2.87 · 2.67 of solid to the cut; the pointer solid (drag-drop-filled's, moved the same 0.5). Filled ink box identical. Off-grid decimals are the dart's own (drag-drop's, arc-derived) and, in the filled twin, the cut's tangent points and its 0.5 fillets. Risk: at 16 the one dot renders soft, and without it this is button (a pointer on a 14×9 button); the dot is the only difference. (recommended: the only picture the references draw, and it keeps the pointer identical to globe-pointer, drag-drop and select) -->
