  <!-- tags: extension, plugin, integration, add-on, jigsaw, knobs, sockets, tilted, diagonal -->
  <!-- Tilted classic piece: The classic piece turned 45 degrees, knobs and sockets alternating round it (knob, socket, knob, socket) - the pose most icon sets use for 'puzzle'. Sides run at 45 degrees, which the angle rule allows; every tangent point lands off the grid (a rotation cannot land on it), so this note is their documentation. Knobs are puzzle-2's small knob and the sockets are the same shape, undercut at 24 and 20 (at 16 a smaller socket, R1.5, whose undercut is only 0.03 - in effect a notch). Corners 2.5 · 2 · 1.5, body side 14.5 · 11.25 · 9.25 on the centreline. Circle keyline; ink a touch under it (19.94 · 15.78 · 13.69) because a turned square cannot fill it, centred exactly. Ink 19.94x19.94 · 15.78x15.78 · 13.69x13.69; knob head 5 · 5 · 4.5 across, standing 3.75 · 3.75 · 3.5 proud; neck clear inside 1.62 · 1.62 · 1.58, waist 0.19 · 0.19 · 0.21 each side; socket 3.75 · 3.75 · 2.75 deep, mouth clear 1.62 · 1.62 · 1.69, undercut 0.19 · 0.19 · 0.03 each side; smallest gap measured anywhere 1.62 · 1.62 · 1.58 (floor 1.5). Filled: the piece solid, its edge the outline's outer edge exactly (convex curves +half the stroke, concave -half), no inner lines. Every curve is a tangent arc; joins that land off the grid are documented here, as with checkbox's tick. Knob feet (2026-09-28): Each knob foot is rounded at half the stroke weight in the filled (0.75 · 0.75 · 0.625, was 0.25 at every master - a quarter pixel at 16 that rendered as a nick) and so at 1.5 · 1.5 · 1.25 on the outline centreline (was 1 · 1 · 0.875), outline and filled together, the filled edge still the outline outer edge exactly. Both knobs stay where they were (head centre 18.54,5.46 / 5.46,18.54 · 15.39,4.61 / 4.61,15.39 · 12.596,3.404 / 3.404,12.596; head size, 3.75 · 3.75 · 3.5 stand-proud unchanged): the wider feet land 3.21 · 3.21 · 2.81 either side of the knob axis (was 2.56 · 2.56 · 2.29), still on the straight side, 1.54 · 0.41 · 0.32 short of the corner arcs, so nothing overhangs a corner and nothing had to move. Cost: the knob neck loses most of its waist (0.19 · 0.19 · 0.21 each side on the centreline, now 0.04 · 0.04 · 0.07), so the head reads as a round tab more than a mushroom; pushing the head out to keep the waist is blocked by the ink box - at 20 and 16 the knob tip already sets it. Neck clear inside widens to 1.92 · 1.92 · 1.86 (was 1.62 · 1.62 · 1.58). Sockets unchanged: their mouths are convex lips in the filled (1.75 · 1.75 · 1.5), no pinch. Narrowest air anywhere is now the socket mouth, 1.63 · 1.63 · 1.69 in both styles (floor 1.5). New off-grid decimals are the tangent points of a turned knob (a 45-degree rotation cannot land on the grid): outline 14.86,4.6 / 19.4,9.14 (24), 11.71,3.75 / 16.25,8.29 (20), 9.286,2.745 / 13.255,6.714 (16) where each foot leaves the side; 17.13,4.43 / 19.57,6.87, 13.98,3.58 / 16.42,6.02, 11.225,2.532 / 13.468,4.775 where foot meets head; 15.92,5.04 / 18.96,8.08, 12.77,4.19 / 15.81,7.23, 10.17,3.111 / 12.889,5.83 the foot arcs split at their axis extremes; the filled points are the same construction offset by half the stroke; the SW knob is the NE one turned 180 degrees about the centre. Ink 19.94x19.94 · 15.78x15.78 · 13.69x13.69 both styles, unchanged. (recommended: looked at in real pixels at 16 and 20 - the foot pixel where the knob meets the side fills from 57 to 69 percent at filled 16 and 55 to 68 at filled 20, so the crease reads as a curve, not a nick; in the outline at 20 the stray grey inside each foot clears) -->
