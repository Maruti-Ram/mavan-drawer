  <!-- Teardrop bow: The bow narrows into the shank: a circle whose top-right quarter is squared off, so its two sides run straight (one level, one upright - still 0/90) into a rounded point the shank leaves from on the diagonal. The key then reads as one piece rather than a ring with a stick. Corner radius 1.5 · 1.5 · 1 (filled 2.25 · 2.25 · 1.625). Teeth as A. Bow teardrop, outer ⌀ 9 · 7 · 6, centre 7.5,16.5 · 6.5,13.5 · 5,11, centreline radius 3.75 · 2.75 · 2.375; air inside the bow 6 · 4 · 3.5. Shank on the 45° diagonal from the bow's corner to the tip at 20.25,3.75 · 16.25,3.75 · 13.375,2.625: 12.75 · 9.75 · 8.375 across and up from the bow's centre (18.03 · 13.79 · 11.84 long), 14.28 · 11.04 · 9.47 of it clear of the bow's outer edge. Teeth at 90° to the shank, two: each starts 2.5 & 4.75 · 2 & 4.25 · 1.875 & 3.875 left and the same down from the tip (back along the shank) and runs 2.5 & 1.75 · 2 & 1.5 · 1.875 & 1.25 right and the same down, i.e. 3.54 & 2.47 · 2.83 & 2.12 · 2.65 & 1.77 long, standing that far proud of the shank's edge; the two are 3.18 · 3.18 · 2.83 apart centre to centre. The first tooth ends straight below the tip so it never widens the box. Filled: the bow solid to its outline's outer edge with a round hole ⌀ 3 · 3 · 2 at its centre (sized so its edges land on whole pixels at each master); shank and teeth stay lines at 1.5 · 1.5 · 1.25. Ink box 18×18 · 14×14 · 12×12, filled identical, centred. Gaps between stroke edges: 24: bow to tooth1 8.31, bow to tooth2 5.13, tooth1 to tooth2 1.68; 20: bow to tooth1 6.19, bow to tooth2 3.01, tooth1 to tooth2 1.68; 16: bow to tooth1 5, bow to tooth2 2.17, tooth1 to tooth2 1.58. Smallest at 16: 1.58. Off-grid numbers are the points where the shank meets the bow (on the 45° line, rounded to 2 dp · 2 dp · 3 dp) only; the bow centre and radius, tip, tooth and bit points are on the quarter grid (eighth at 16) - lengths along the diagonal are therefore those numbers × 1.41, given above. -->
  <path d="M7.5 12.75L9.75 12.75A1.5 1.5 0 0 1 11.25 14.25L11.25 16.5A3.75 3.75 0 1 1 7.5 12.75Z"/>
