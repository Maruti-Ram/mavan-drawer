  <!-- Chevron below: Rhythm and balance: the chevron takes the same share of the slab at every master — 8 · 6 · 5.25 wide, 0.4 · 0.375 · 0.375 of it — centred under it, its tip on the box's bottom edge and 1.56 · 1.56 · 1.51 of air to the slab, so the keyboard reads first and the chevron as its state. Chevron: chevron-down's 45° legs and bend (0.75 · 0.75 · 0.625) at a smaller span; the shipped chevron-down (14 · 12 · 10.5) and -small (11 · 9.5 · 8.5) are too wide for the 4.44 · 3.44 · 2.99 of height left. Box 20×18 · 16×16 · 14×14 — keyboard-2's 20×18 at 24, whose slab is lowered 3 for its cable where this one is raised 3. The off-grid values (17.31, 11.47, 20.03, 12.53 at 24) are chevron-down's own tangent points, set so the tip lands exactly on 21 · 18 · 15. Filled: keyboard-filled's solid slab and key cuts, moved with it (at 16 the cuts at 3.5–5 and 6.5–8, lower edges on whole pixels, 2.5 of solid above and below, the shipped rule); the chevron stays a line at 1.5 · 1.5 · 1.25 (a shape icon, as keyboard-2's cable). Cost: the 16 slab's bottom edge sits on a half pixel (10.5). Who: Nucleo keyboard-hide-down, WordPress keyboard-close, Unicons keyboard-hide, Tabler keyboard-hide and -show. Look-alike: tooltip (a wide rounded rect with a V under it) — here the V is detached by 1.5 and the keys are inside; the two read apart at 16 in the strip. (recommended: a chevron under the keyboard is the picture most sets and iOS show for hide keyboard — iOS draws it flat, B — and this one reuses chevron-down's legs and bend unchanged, so it sits with the set's chevrons and arrows) -->
