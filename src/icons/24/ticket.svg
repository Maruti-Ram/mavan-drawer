  <!-- Notched, torn line: The default ticket, refined (recommended). Eight sets agree on this picture: Central, Untitled ticket-01, Lucide, Material confirmation_number, Tabler, Heroicons, Mynaui and Nucleo ticket-4. It is the base the % and the stack sit on. Body: as described in the board's question. Torn line at x 14.75 · 12.25 · 9.875 (65% across, with the stub on the right as in Central and Lucide). Three evenly spaced dashes run wall to wall: the two end dashes grow out of the walls, and the visible dashes are 3 · 2 · 1.5 long with 2 · 1.5 · 1.5 of air between them. C35's evenness is kept: every visible dash is the same length and every gap is the same width. C35's own numbers do not fit. A dash centred on the wall (C35's corner rule) leaves a stub only 1.75 · 1 · 0.75 long next to a 5 · 3.5 · 2.75 middle dash, and on the render that read as "!". At 16 the middle dash is a 1.5 dot. Air from the middle dash to the right notch is 2.5 · 1.5 · 1.63. Filled: the three dashes are cut out 1.5 wide. The end cuts start at the wall's inner edge, so the wall stays a solid band. The material left between the cuts is 2 · 1.5 · 1.5. Ink is 20×16 · 16×12 · 14×10 and the filled ink is identical. Off-grid numbers are the notch lips, where the notch arc meets the wall (8.65 / 15.35 at 24). -->
