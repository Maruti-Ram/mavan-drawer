<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: slash, command menu, key cap, forward slash -->
  <!-- Slash on a key cap: Slash on a key cap (recommended): it is the picture three of the four sets that draw a slash command use — Lucide square-slash (tagged "shortcut"), Remix slash-commands-2, Central run-shortcut, also gg shortcut — and on this round's key cap it reads as the key you press to open the menu, beside control, option and shift on the same cap. Rhythm and balance: the slash is centred on the cap (it is point-symmetric, so no C14 shift) and holds the same share of the cap at every master — ink 6.5×10.5 · 5×8 · 4.25×6.5, 58 · 57 · 54% of the cap's height (checkbox's tick is 57 · 56 · 54% of its width); air to the cap's inner edge 2.25 · 1.5 · 1.5 above and below, 4.25 · 3 · 2.625 at the sides (a slash is narrow, so the side air is what the eye reads as the key's face). Angle: run × rise 5×9 · 3.5×6.5 · 3×5.25 = 60.95° · 61.70° · 60.26° from level — §3's 60°, "where the subject demands it", with the ends on the grid, which is why it moves by a degree between masters (C30's way of declaring a slash). Cap: the shipped square, verbatim (18 · 14 · 12, centreline radius 2.5 · 2 · 1.5). Filled: square-filled's solid with the slash cut out as a capsule of 1.5 white at every master (C22, so 0.25 wider than the outline's line at 16), round ends, same centreline; 3.75 · 3 · 2.63 of solid between the cut's ends and the key's top and bottom edges. Every off-grid decimal in the filled path is a tangent point of the capsule's round ends. Look-alikes at 16: none in the set — percent's and code's slashes are bare and full height, checkbox carries a tick. -->
  <path d="M6.25 3.75H17.75A2.5 2.5 0 0 1 20.25 6.25V17.75A2.5 2.5 0 0 1 17.75 20.25H6.25A2.5 2.5 0 0 1 3.75 17.75V6.25A2.5 2.5 0 0 1 6.25 3.75Z"/>
  <path d="M9.5 16.5L14.5 7.5"/>
</svg>
