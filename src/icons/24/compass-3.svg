  <!-- North solid, south outlined: What the eye sees: round 1's B filled turned white-on-dark — the north half a solid white triangle, the south half only a white outline with a dark triangle of disc left inside it, so the needle reads as one filled half and one open half, the classic two-tone needle. The white line round the south island is the outline's needle stroke, 1.5 · 1.5 · 1.25 wide, and the island is the outline's own south counter (sharp corners, as every stroked counter is): at 24 and 20 it stops at the split line's edge and holds a circle of 2.82 · 1.63; at 16, with no split line, it runs to the waist and holds 1.78. At 20 and 16 that island is under two pixels across, and the white band round it at 16 is 1.25, under the 1.5 floor for a strip between parts — the busiest answer at small sizes. Filled: the disc solid (ink ⌀20 · 16 · 14, as clock and target), the needle knocked out at the outline's ink size, so the filled ink box is the outline's at every master. Disc left round the tips 3 · 3 · 2.75. Outline: B from round 1, byte for byte — the 45° diamond needle (tip 50°, edges at 20° and 70°, cursor's angle exception) with a line across its waist at 24 and 20; at 16 the line would leave each half 1.41, under the 1.5 floor, so the 16 has no line. Needle ink 14 · 10 · 8.5 long, tips 1.5 inside the ring; ring is clock's (ink ⌀20 · 16 · 14). -->
