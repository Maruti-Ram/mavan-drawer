  <!-- Square, pencil on its corner: Square, pencil on its corner. Ink 18×18 · 14×14 · 12×12 (square keyline), centred. Pencil: pencil-4's drawing without its baseline — the set's 0/45/90 pencil, a square-cornered point (C10 arc 0.75 · 0.75 · 0.625), flat end with corners 1.5 · 1.25 · 1, band 3.25 · 3.25 · 2.875 from the end, body 4.24 · 3.18 · 2.83 wide on the centreline (22.09 · 16.82 · 14.37 long in pencil-4). The tip slides 5 · 4 · 3.5 up the axis in x and y, so the body is 7.07 · 5.66 · 4.95 shorter: 15.02 · 11.16 · 9.42 on the centreline. Square: checkbox's rounded square on the square keyline, 18 · 14 · 12, corners 2.5 · 2 · 1.5, with the pencil's end on its top-right corner (the pencil ink reaches the box corner, so nothing passes the square). The top line stops at x 13 · 9.75 · 7.375 and the right line starts at y 11 · 10.25 · 8.625 — the first grid points with 1.5 of air to the pencil (1.51 · 1.51 · 1.58 measured) — leaving 6.75 · 4 · 3.25 of straight line on each side. Filled: the container is one solid on the outline's outer edge with a channel cut 1.5 clear all round the pencil (external-link-filled's slot; C22, interior detail becomes negative space), easing 0.5 where the channel meets the edge; the pencil is its shipped filled drawing slid the same way (band cut 1.5). Thinnest material of the solid, beside the pencil's point: 2.63 · 2.5 · 2. Off-grid values: the pencil's 45° points (16.81, 4.19 … at 24) are the shipped pencil's own, moved by whole grid steps; the filled channel's are the tangent points of the 1.5 offset round the pencil and of the 0.5 easing where it meets the edge (13.61 / 13.97 at 24, as external-link-filled's 13.6 / 13.96). 16 on the eighth grid, container centrelines on x.375 / x.625. Checkbox's square and pencil-4's pencil, nothing new; the pencil overlays the corner the way Lucide's square-pen does. The pencil is the loudest thing in it, and filled at 16 the square reads as a ring round the pencil. -->
