  <!-- Screen over a base line: Rhythm: the base runs past the screen by 2 · 1.5 · 1.5 on each side (24's proportion held at every master: screen 80% · 81% · 79% of the base), the same both sides (box-centred); 2 · 1.5 · 1.5 of air between screen and base. Ink 20×15 · 16×12 · 14×10.75 (agreed box; 24's 20×15 scales to 16×12 and 14×10.5). Screen 16×11.5 · 13×9 · 11×8 of ink (1.39 · 1.44 · 1.38 : 1; desktop's is 1.43 · 1.45 · 1.56), container radius 2.5 · 2 · 1.5 and walls 1.5 · 1.5 · 1.25 as desktop. White inside the screen 13×8.5 · 10×6 · 8.5×5.5. At 16 the screen's edges sit on half pixels (ink 2.5–13.5 × 2.625–10.625): kept so the overhang and height hold 24's proportion rather than whole pixels. Base 20 · 16 · 14 of ink, the full keyline width, at the outline weight. Against desktop-2 at 16 (14-wide screen over a 6-wide foot): here the base is wider than the screen — 14 under 11 — and runs the full width, so it reads as the machine's lower half, not a stand. Filled: screen solid on the outline's outer edge (radius 3.25 · 2.75 · 2.125, as desktop-filled), base stays a line at 1.5 · 1.5 · 1.25. Who: Fluent laptop, Tabler device-laptop, Lucide laptop-minimal, Carbon laptop, Remix macbook-line, Font Awesome laptop. (recommended) — it is desktop's screen with the stand traded for a base line wider than the screen, so the two read as one family at 16, and as the plainest silhouette it leaves room for a phone beside it in devices. -->
