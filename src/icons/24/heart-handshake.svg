  <!-- Heart, bowl and knuckle (Central): Ships as heart-handshake. What the eye sees: one hand's thumb and palm cupping, and the other hand's knuckle standing up. This is Central's handshake, measured (thumb 6.4 long, bowl r 3.07, peak, then down to the side) and rebuilt in our heart. The heart is the shipped heart exactly: lobes r 5.25 · 4 · 3.25, notch and tip r 0.75 · 0.75 · 0.625. The thumb runs down-left from the notch, 6 · 4.75 · 3.75 long, and ends square: corner r 0.75 · 0.75 · 0.625, the mark bend. The palm under it is a wide bowl, r 3 · 2.25 · 2. The other hand's knuckle is a peak, r 0.75 · 0.75 · 0.625, before the line runs 45° down-right to the heart's side. Agreed box 20×18 · 16×14 · 14×12, like heart. Filled: the line is a 1.5 white line centred on the outline's and splits the heart into two hands. Its top end is a round end r 0.75 at the notch. Two shapes. (recommended for B) It reads as two hands where B read as one hook, and it stays as calm as heart at 16. -->
