  <!-- Bar moved 1 right, 1 up: What the eye sees: everything wifi is made of, on both sides of the bar, at every master — below-left the dot and the left ends of all three arcs, above-right the outer arc's long sweep up to about 12 o'clock. Lucide's wifi-off reading, sparser. The left ends are short (three rungs beside the bar), so it is busier than A2 at 24, but at 16 it is the only one that still has its dot. Balance: ink mass (by inked area, so the dot counts as the ⌀3 · 2.5 · 2 disc it draws) 0.34 · 0.37 · 0.34 right of the canvas centre and 1.40 · 1.02 · 0.80 above (wifi itself sits 1.98 · 1.42 · 1.13 above), against A2's 1.54 · 1.34 · 1.35 right. (recommended) OUTSIDE C21's centred bar (dated note 2026-10-23): the bar moved 1 right and 1 up of wifi's snapped centre at every master — 1.50 · 1.50 · 1.41 square to the bar from wifi's own ink centre (at 24 and 20 the centred bar already sits 0.09 off it, the quarter grid's tie) — cloud-off's move, mirrored, because wifi lies below-left of the bar. Centred (A2), the cut removes the inner arc and every left end and at 16 reaches the dot; 1 right alone (0.71 square) keeps them at 24 but leaves the left ends 1.25–1.27 long at 20 and 1.03–1.28 at 16, under 1.5. It is also about as far as the bar can go: its ink touches the top margin at 24 and 20 (0.125 inside it at 16) and wifi's right edge. An offset of 1 right and 0.75 up (1.33 · 1.33 · 1.24 square from wifi's ink centre) also keeps the dot and every arc end at every master (rungs at 16: 1.60 · 1.69 · 1.81) with the icon a quarter lower; it is not a whole step, so the rule gives 1 and 1. The bar (C21): \ at 45°, the square keyline 18 · 14 · 12, centreline (4.75,2.75)-(21.25,19.25) · (4.75,2.75)-(17.25,15.25) · (3.625,1.75)-(14.375,12.5), centred on (13,11) · (11,9) · (9,7.125): wifi's ink centre (12,12.125 · 10,10.125 · 8,8.125, snapped to 12,12 · 10,10 · 8,8.125) plus 1 right, 1 up. Wifi stays in place (C34); the box is 20×18 · 16×14.25 · 14×12.125 — top the bar's, bottom the dot's — so it sits 1 · 0.875 · 0.8125 above the canvas centre (declared optical). Cut: every arc stops with 1.5 of air from the bar's edge, measured 1.505 · 1.505 · 1.501 at every cut end. Kept (centreline lengths, 24 · 20 · 16): the dot whole (air to the bar 3.76 · 2.95 · 2.71); the inner arc's left end 3.08 · 2.04 · 1.80; the middle arc's left end 2.78 · 1.97 · 1.87; the outer arc's left end 2.62 · 1.96 · 1.99 and its right sweep 10.92 · 7.00 · 5.64 — 46 · 39 · 39% of the arcs. Removed: the rest of the inner and middle arcs; the middle arc's right end survives the cut at 24 only (1.84) and is dropped there too, so every master shows the same pieces (as bug-off dropped its middle leg at 24, 2026-10-23). Tightest air elsewhere is wifi's own, arc to arc 2.75 · 1.75 · 1.5. Filled: as wifi-filled — the dot thickens in place to ⌀4 · 3 · 2 (white to the bar 3.26 · 2.70 · 2.71) and the arcs stay lines at 1.5 · 1.5 · 1.25, cut exactly as in the outline; the dot is the bottom edge, so the filled box grows 0.5 · 0.25 · 0 at the bottom (declared, as wifi-filled does); filled mass 0.32 · 0.36 · 0.34 right, 0.89 · 0.81 · 0.80 above. Off-grid decimals are the cut ends, where the circles put them. -->
