  <!-- Open square shoulders: Level shoulders turning down into two short upright arms, open at the bottom - the construction Lucide's user uses, in the tall guide box. Sturdier than F, and the level line is crisp at every size. The cost: under the head it reads as a goalpost or a table, and its filled twin is the heaviest block of the ten. Head 10 · 8 · 6 across (63 · 67 · 60% of the body's width), body 16 · 12 · 10 wide × 8.5 · 6.5 · 6 tall, gap between head and body 1.5 · 1.5 · 2 (filled 1.5 · 1.5 · 2). Ink box 16×20 · 12×16 · 10×14, filled box identical. Shoulder corners 4 · 3 · 2.5 (as D). Gap 2 at 16 puts the shoulder line on a whole pixel. Filled: a solid slab with the round caps as its bottom corners. Pairs acceptably for users; inside a ring the upright arms fight the curve. -->
