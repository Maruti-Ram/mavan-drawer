  <!-- Upright flat, split bristles: Lucide's upright flat brush, drawn our way, on the portrait keyline (16×20 · 12×16 · 10×14). The bristle block has two split marks hanging from its top edge, of different lengths (3 and 4.5 · 2.5 and 3.5 · 2 and 3), and top corners 1.5 · 1.25 · 1. A crimp line runs across where the bristles meet the ferrule. The ferrule is 3.5 · 3 · 2.75 tall on the centreline (air 2 · 1.5 · 1.5), with bottom corners 1.5 · 1.25 · 1. An outlined handle, 4.5 · 4.5 · 4 wide with 1.5 of air, hangs from it on concave shoulders (0.75 · 0.75 · 0.625) and ends in a half-round. Marks at x 9.75 and 14.25 · 8.25 and 11.75 · 6.375 and 9.625 (at 16 their inner edges land on whole pixels, 7 and 9). Gaps: mark to wall, mark to mark, mark to wall 3.5, 3, 3.5 · 2, 2, 2 · 1.5, 2, 1.5; longer mark to crimp 3 · 1.5 · 1.75, so both marks stay at 16. Every edge is vertical or horizontal on x.25/x.75 (x.375/x.625 at 16), so the edges land on whole pixels. Filled: the bristles are solid with the marks cut in as notches 1.5 wide at every master, and the crimp is a cut of 1.5 (C22). At 16 the notches sit at x 5.5–7 and 9–10.5, sharing the outline marks' inner edges, which leaves 2 of bristle between them and 2.5 at each side; the crimp cut runs y 7–8.5, its top edge the outline crimp's. The ferrule and handle are solid. Ink 16×20 · 12×16 · 10×14, centred; the filled ink box equals the outline's. Off-grid values: the round end's tangent points only. (recommended) The clearest "paintbrush" at 16: it is the symbol most sets use, its detail survives at full gap, and standing upright it does not repeat the diagonal pencil and wand. -->
