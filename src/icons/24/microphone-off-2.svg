  <!-- Big slash to the square, bar cut through: What the eye sees: microphone-2 (the wide capsule and foot) struck by the same bar as A2. The wider capsule loses its whole left side; its top, its right side and a sliver of its round bottom stay, so the arch is broader than A2's. The foot is whole at every master, at 16 too. At 20 and 16 the bar's air falls across the joint where the stand meets the cradle (in the base that joint sits 1.15 · 1.14 from the bar's edge), so cradle and stand are cut on the same line with their ends only 0.75 · 0.78 apart — left as two caps they would merge into a lump. The two cut ends are joined by a 45° step along the edge of the air, parallel to the bar and 1.5 clear of it, so the stand stays on the cradle; it reads as a slight bend at the top of the stand. The step is the one stroke in this drawing that is not in the base. Bar (C21; Maruti 2026-10-25, the big slash to the square: every -off bar spans the square keyline): \ at 45°, its ink the square keyline 18 · 14 · 12, centred on the microphone's ink centre 12,12 · 10,10 · 8,8 (on the grid, nothing snapped): centreline M3.75 3.75L20.25 20.25 · M3.75 3.75L16.25 16.25 · M2.625 2.625L13.375 13.375. It stands 1 · 1 · 1 past the microphone's sides (2 past microphone-5's at 24) and sits 1 · 1 · 1 inside its top and bottom, so the box is declared 18×20 · 14×16 · 12×14. All five shapes have the same ink centre, so the row shares this one bar. Measured against the inside-width bar it replaces, the longer bar removes nothing new: every kept piece is identical, its extra length runs outside the microphone. Cut: every stroke stops with 1.5 of air from the bar's edge (cut-end centrelines 3 · 3 · 2.75 from the bar's), measured 1.505 · 1.505 · 1.501 at the tightest cut end; round caps. Kept (24 · 20 · 16; 16 is A2's capsule and cradle, the base being identical there but for the foot): capsule 13.89 · 8.84 · 6.56 of 29.42 · 21.14 · 16.64 — the top from 22.6° · 31.4° · 10.2° above 9 o'clock, the right side whole and 0.46 into the bottom at 24, down to 8 (3 of 3.5) at 20 and to 5.485 at 16. Cradle's left half 12.89 · 7.18 · 5.77: at 24 the left side is whole (its tip 1.505 clear of the bar), round to the stand; at 20 and 16 as A2, with the 0.75 · 0.78 step. Cradle's right tip 5.22 · 3.13 · 2.68. Stand 3.5 · 3 · 2.49 (plus the step), foot 6.5 · 4.5 · 2.75 whole. Removed: capsule 15.53 · 12.30 · 10.08, cradle 7.67 · 8.19 · 8.04 (the 1.38 past the stand at 24 included). Ink 18×20 · 14×16 · 12×14, centred 12,12 · 10,10 · 8,8, declared as a box. Filled: the capsule fills; a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side) is knocked out of it, corners r0.75 · 0.75 · 0.625, white 1.506 · 1.506 · 1.501 each side, the bar whole through it at 1.5 · 1.5 · 1.25. What stays is the capsule's upper right as one solid, 5.99 · 4.29 · 3.41 thick across the channel. At 24 a 0.69-thick sliver of the capsule below the bar is thinner than the 1.5 line weight and goes; the outline keeps nothing there either. The cradle, stand and foot stay lines at 1.5 · 1.5 · 1.25, cut exactly as the outline. Off-grid decimals are the cut ends, the step and the channel's corners. -->
