<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: add, new, apps, add app, widgets, blocks, circles, launcher -->
  <!-- Rings and plus at cell size: Three rings and a plus of the same size, each in one of grid's four cells: nothing moves from grid, so the icon sits in the grid family and the plus reads as the fourth cell, not as a badge. The rings are grid-5's ring verbatim (radius 3 · 2 · 1.75 on the centreline, outer 7.5 · 5.5 · 4.75, counter 4.5 · 2.5 · 2.25) on grid's cell centres (6.75 / 17.25 · 5.75 / 14.25 · 4.375 / 11.625, the 16 eighths are grid's own), pitch 10.5 · 8.5 · 7.25. The plus is centred in the bottom-right cell and as wide and tall as it, 7.5 · 5.5 · 4.75 of ink (lines 6 · 4 · 3.5 long, round caps reaching 0.75 · 0.75 · 0.625 past each end), built as plus is: two lines crossing at their middles at the outline weight. Bottom-right as Nucleo's 18 grid and C33's badge corner (Nucleo's 12 grid puts it top-right). Air 3 · 3 · 2.5 from the plus to both neighbours and between rings, the grid gap, outline and filled. Ink 18 · 14 · 12 on the square keyline, centred. Filled: grid-5-filled's disc (radius 3.75 · 2.75 · 2.375, same outer edges) three times, and the plus at the filled weight 2.5 · 2 · 2 as plus-filled, ends pulled in 0.5 · 0.25 · 0.375 so its ink stays 7.5 · 5.5 · 4.75; written as two round-ended bars, as select-crosshair-filled, since a file with filled shapes keeps its root stroke at the outline weight. Ink box unchanged in both styles. Costs: at 16 the cell centre 11.625 leaves the filled plus's arms 3/8 px off whole pixels (10.625 to 12.625), and beside the solid discs the filled plus reads a little lighter, being a cross. Against the plus badge on file-plus and folder-plus (v2-pm): the same outline construction at the same weight 1.5 · 1.5 · 1.25, 0.5 · 0.5 · 0.25 shorter (theirs 8 · 6 · 5 of ink); in the filled twin the badge stays at the outline weight (C33, a line badge on a shape) while this plus goes to the filled weight, because here it is a cell, not a badge (recommended: the family's own ring, cell and gap, nothing moved) -->
  <path d="M3.75 6.75A3 3 0 1 0 9.75 6.75A3 3 0 1 0 3.75 6.75Z"/>
  <path d="M14.25 6.75A3 3 0 1 0 20.25 6.75A3 3 0 1 0 14.25 6.75Z"/>
  <path d="M3.75 17.25A3 3 0 1 0 9.75 17.25A3 3 0 1 0 3.75 17.25Z"/>
  <path d="M17.25 14.25V20.25"/>
  <path d="M14.25 17.25H20.25"/>
</svg>
