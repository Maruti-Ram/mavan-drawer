  <!-- Large head, low dome: A confident head over a low half-round body, in the tall guide box (16x20 · 12x16 · 10x14, as lock). Head and body carry about equal weight, so it reads as a face-and-shoulders portrait rather than a figure. At 16 the 6-wide head sits on whole pixels both ways and stays a clean ring with 3.5 clear inside - the crispest head of the ten. The proportion Lucide and Central use (measured 0.63 to 0.66; ours 0.63 · 0.67 · 0.6). (recommended) Head 10 · 8 · 6 across (62 · 67 · 60% of the body's width), body 16 · 12 · 10 wide × 8.5 · 6.5 · 6.5 tall, gap between head and body 1.5 · 1.5 · 1.5 (filled 1.5 · 1.5 · 1.5). Ink box 16×20 · 12×16 · 10×14, filled box identical. Body is a near half circle (radius 7.63 · 5.7 · 4.38 against a half-width of 7.25 · 5.25 · 4.375), corners 1.5 · 1.25 · 1. At 16 the body's top edge lands on a half pixel (8.5) to hold the 1.5 gap exactly; candidate I shows what gap 1 would buy there. Shrinks well: the low body is the first thing a ring or a badge cuts into, and the head survives. For users the rear figure is a head plus an open arc of this same dome. -->
