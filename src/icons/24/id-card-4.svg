<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: identity, passport, travel, document -->
  <!-- Passport: The identity document as a booklet: a portrait cover with an emblem ring over a title bar (Untitled passport, Central passport, Nucleo passport, Font Awesome passport, Tabler passport). Cover = B's portrait card (16x20 · 12x16 · 10x14). Ring 7.5 · 6 · 4.5 across (4.5 · 3 · 2 clear inside), title bar ink 6 · 5 · 4.5 long. Air top / ring-to-bar / bottom: 3.25 / 2 / 2.75 · 2 / 1.5 / 2 · 2 / 1.75 / 2; ring 1.5 from the side walls at 20 and 16. No globe lines: a meridian cannot keep 1.5 inside the ring at any master. Filled: the cover fills, the ring is knocked out as a 1.5 white band (a solid centre stays), the bar as a 1.5 cut. Risk at 16: a ring over a bar on a tall rounded box also reads as a phone, speaker or webcam; it is a neighbour of id-card (a passport), offered because it is the other identity picture products use -->
