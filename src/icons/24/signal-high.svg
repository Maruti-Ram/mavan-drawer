  <!-- Wedge, three quarters: Ships as signal-high. Level legs 8.98 · 5.13 · 3.75. Steps: equal in amount, not in length. Each level holds about a quarter more of the full level's ink: areas 0.26/0.50/0.77 · 0.24/0.49/0.76 · 0.26/0.51/0.73 at 24 · 20 · 16. Equal-length quarters (2.56 · 1.47 · 1.09) fall below the smallest wedge the pen can draw at 20 and 16 (legs 2.56 · 2.56 · 2.13). So do thirds (1.46 at 16). Legs of the level, low/medium/high/full: 5.23/7.23/8.98/10.23 · 2.88/4.13/5.13/5.88 · 2.25/3.13/3.75/4.38 (the room inside the frame after 1.5 of white has legs 10.23 · 5.88 · 4.38). Its right edge sits on x 13/15/16.75/18 · 11/12.25/13.25/14 · 9.125/10/10.625/11.25. Outline: the frame is B's, unchanged; the level is a solid right-angled wedge drawn with the pen as battery's charge bar is. It is one closed path, the level's outline plus runs one line apart (1.5 · 1.5 · 1.25), so no white is left inside, and its corners bend at weight/2. 1.5 of white separates it from the frame's bottom and its slope; the full level also leaves 1.5 to the right side. Filled: as Material and the wifi fan's approved levels. The frame stays at the outline weight; the level is solid and merged with it, with no white band, filling the frame to the level's right edge (x 13/15/16.75 · 11/12.25/13.25 · 9.125/10/10.625). The rest of the frame's inside is left open, its corners at the level's edge r0.5 · 0.5 · 0.375. Open part at its narrowest (high): 2.75 · 2.25 · 2.125 wide. anchor: signal — the frame is signal's own, so the ink box is signal's at every master (C28). Who: Material Symbols signal_cellular_1_bar…3_bar (frame kept, solid level merged with it from the bottom-left). -->
