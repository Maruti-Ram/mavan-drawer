<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: write, edit note, jot, pencil, lines -->
  <!-- Lines and a pencil: Three text lines top-left and a pencil writing toward the bottom-right (Material edit_note; Lucide notebook-pen and Fluent's note-edit pair a note with a pen). The pencil is pencil-4's (compose's) 0/45/90 pencil with its tip slid 6 · 4.5 · 4 up the axis and moved down as far: a 12 · 9.5 · 8 box in the bottom-right corner, two thirds of the icon; its off-grid values are pencil-4's tangent points moved by whole steps. Lines on pitch 4 · 3.5 · 3 (air 2.5 · 2 · 1.75): two long ones (11.25 · 7 · 5.75) and a third about half (5.75 · 3.5 · 2.75), each as long as the 1.5 floor to the pencil allows — tightest air 1.53 · 1.5 · 1.58. Ink 18×18 · 14×14 · 12×12, filled identical. Filled: pencil-4-filled's pencil, lines stay 1.5 · 1.5 · 1.25 (as pencil-4's baseline does). Against compose (a pencil on an open square) and pencil-4 (a pencil on one baseline): no frame and three lines. Says 'write a note' more than 'a note', and the pencil takes the corner note-plus would need. -->
  <path d="M3.75 3.75H15"/>
  <path d="M3.75 7.75H15"/>
