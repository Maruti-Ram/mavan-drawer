<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- keyline: mark -->
  <!-- tags: adjust, controls, filters, settings, tune, three tracks, bar, broken, horizontal -->
  <!-- Three tracks, bar knobs, broken: Three tracks with a short upright bar as the knob, left - right - left, the track cut back 1.5 either side of each bar at 24 and 20. The familiar "settings" drawing, and the busiest here: 9 · 9 · 6 separate strokes, and in real pixels at 20 it starts to read as a lattice. Fills the square guide box: ink 18×18 · 14×14 · 12×12; tracks 6 · 5 · 4.25 apart, bars 6 · 4 · 3.5 long. At 16 the breaks are removed and the bars simply cross the tracks: with the filled weight of 2, a bar plus two 1.5 breaks takes 5 of the 12 width and leaves stubs that are dots (measured), so the detail goes, as the rule says. Smallest gap 1.5 at 24 (top track end to top bar), 1.5 at 20 (top track end to top bar), 1.875 at 16 (top track to middle bar); filled 1.5 · 1.5 · 1.5. Filled: the line-heavy case - everything redrawn at 2.5 · 2 · 2 with every end pulled in by half the added weight; filled ink box equals the outline's at all three. Weak spot: filled at 16 the bars stand only 0.75 proud of a 2-wide track, so the knobs nearly vanish. -->
  <path d="M3.75 6H7"/>
  <path d="M13 6H20.25"/>
  <path d="M10 3.75V8.25"/>
  <path d="M3.75 12H11"/>
  <path d="M17 12H20.25"/>
  <path d="M14 9.75V14.25"/>
  <path d="M3.75 18H7"/>
  <path d="M13 18H20.25"/>
  <path d="M10 15.75V20.25"/>
</svg>
