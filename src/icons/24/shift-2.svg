  <!-- tags: key cap -->
  <!-- ⇧ on a key cap, polished: Rhythm and balance: the ⇧ keeps shipped shift's proportions on the key. The stem is half the head (stem ink 6 · 4.5 · 4 of head 11.38 · 8.88 · 7.48 = 0.53 · 0.51 · 0.53; shift 0.52 · 0.51 · 0.49), the head is 45° with every corner rounded at half the weight, and the stem below the barbs is 0.67 · 0.63 · 0.63 of the head's height. The legend takes the same share of the cap at every master: 11.38×11.19 · 8.88×8.94 · 7.48×7.49 = 0.63 · 0.63 · 0.62 of the shipped square (18 · 14 · 12, verbatim). It is centred on the cap: 11.91 · 10.03 · 8.0. Air to the cap's inner edge: sides 1.81 · 1.06 · 1.01, top 1.81 · 1.06 · 1.01, bottom 2 · 1 · 1. Air inside the stem 3 · 1.5 · 1.5. The barbs now stand 2.69 · 2.19 · 1.74 proud of the stem (B: 1.94 · 1.44 · 1.24), so at 16 the notches under them read and the ⇧ reads as ⇧, not a house. The cost: 1 of air to the cap at 20 and 16, declared as a gap note (gap: 1, outline files at 20 and 16 only), which needs your OK; 24 keeps 1.5 and more. Centring also puts the undersides and the stem's foot off whole pixels at every master, and the stem's walls at 20 (7.75–12.25). Filled: the solid cap (square-filled) with a white ⇧ cut out. It has the outline legend's barb reach (sides) and barb undersides, but a slimmer white stem (4 · 3 · 2.5) and tighter white corners (0.75 · 0.5 · 0.5, the C1 floor is 0.75 · 0.5 · 0.375), so the white barbs stand 3.69 · 2.93 · 2.49 proud. Rounded at the outline's own 1.5 · 1.5 · 1.25, the white closed into a blob. It is raised 0.5 · 0.5 · 0.375 to sit on the legend's centre (11.78 · 10.03 · 8.0). Material from the white to the cap's outer edge: 3.31 · 2.57 · 2.26. Who: Dinkie keycap-shift; the family's key-cap form beside control-key. Look-alike at 16: the filled twin's slim white arrow is closest to a generic up-arrow key; the outline no longer reads as home in a square. (recommended) It is the one that reads as ⇧ on the key at 16 in both styles. -->
