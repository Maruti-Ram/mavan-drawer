  <!-- Level arrow on, top-aligned to the margin edge: Level arrow on from the handset's empty corner, to the margin edge: phone's handset verbatim and in place at every master, both styles, with nothing cut — the arrow sits in the corner the handset leaves empty (phone's own "clear square top-right"), where Lucide's phone-forwarded puts it. The arrow is arrow-right's head on a level shaft in phone-incoming's mark box, top-aligned (v3-kit-phone.md): legs at 45° into a C10 bend 0.75 · 0.75 · 0.625 whose rightmost point is the box's right line (21.25 · 17.25 · 14.375), each leg's end h = 3.25 · 2.75 · 2.5 above and below the shaft (legs 4.6 · 3.89 · 3.54 long to the corner the bend rounds, the diagonal head's 4.5 · 4 · 3.5 to the nearest grid value), the upper leg's end on the box's top line (2.75 · 2.75 · 1.625); the shaft level at y 6 · 5.5 · 4.125, from the bend's apex to the box's left line (12.75 · 11.25 · 9.625). Arrow ink 10×8 · 7.5×7 · 6×6.25: its top-right corner is incoming's and outgoing's (22,2 · 18,2 · 15,1), on the margin edge, the reach C33 gives a badge; it is shorter than theirs because a level arrow's head is 2h + w tall, not the box's side. Composite 19×19 · 15×15 · 13×13, declared as box, centre 0.5 right and 0.5 up — calendar-repeat's box and offset, turned to the top-right, as phone-incoming. Nearest the handset: at 24 and 20 the shaft's tail, across from the top-left head's rounded corner, 1.506 · 1.506 (the tail sits 0.25 above where the head's straight side begins, so it faces the corner's arc); at 16 the lower leg's cap, above the bottom-right head, 1.508 (the tail there keeps 1.75). Head air (C37, the leg cap to the shaft: h less the weight) 1.75 · 1.25 · 1.25. Tightest air, measured: 1.506 · 1.506 · 1.508, outline and filled alike, since the filled handset's edges are the outline's ink edges. At 16 the head's top (y 1) and right (x 15) and the tail's end (x 9) land on whole pixels; the shaft on y 4.125 spans 3.5–4.75, half of one pixel row and three-quarters of the next, so at 1× it reads a shade softer than the diagonal shafts — arrow-right's own 16 shaft straddles two rows the same way (7.375–8.625). A shaft on 4.375 or 3.625 would put one edge on a whole pixel, but leaves 1.0 of air to the handset or 0.75 of head air. Filled: phone-filled verbatim; the arrow stays a line at 1.5 · 1.5 · 1.25, because a shape icon's lines keep the outline weight (external-link-filled's arrow, phone-contactless-filled's waves). Off the grid besides phone's own numbers: only the leg ends' x (18.31 · 14.81 · 12.134) and the bend's tangent points (21.03 5.47 / 6.53 · 17.03 4.97 / 6.03 · 14.192 3.683 / 4.567): they lie on the 45° lines through the bend, exactly as arrow-right's 14.81 does. Family: phone-incoming is the diagonal arrow pointing in, phone-outgoing the same arrow pointing out, phone-missed an x on the same box (v3-kit-phone.md). (recommended) -->
