<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: tape, reels, answering machine, inbox, box -->
  <!-- Reels in a box: Rhythm: mail's landscape frame 20×16 · 16×12 · 14×10, r2.5 · 2 · 1.5, with the reels centred inside: reels ⌀5.5 · 4 · 3.5 of ink, 2 · 1.5 · 1.5 of air between them, 2 · 1.75 · 1.5 to the side walls and 3.75 · 2.5 · 2 to the top and bottom walls. The frame leaves no room at 20 and 16 for a 1.5 hole (two reels with 1.5 holes and 1.5 of air need 13.5 inside a 13 wide frame at 20), so the holes are 1 there, declared `gap: 1` (outline, 20 and 16 only); dropping the holes instead made solid dots that read as a dash — a face — at 16. Ink 20×16 · 16×12 · 14×10 on the landscape keyline. Filled: frame solid, the reels and tape cut out in 1.5 white (C22, 1.5 at 16 too); at 24 each reel is a white ring round a solid hub ⌀2.5, at 20 and 16 the hub would be 1 · 0.5 across, so the reels are cut as white discs ⌀4 · 3.5 with 1.5 of material between them. Who: Material Symbols voicemail_2, Fluent voicemail (Teams), Unicons voicemail-rectangle, css.gg voicemail-r. Reads as an answering machine's window; at 16 the reels are small. -->
