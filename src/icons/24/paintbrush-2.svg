  <!-- Round head, solid band: The shipped brush's own head — a round head 7.5 · 6.5 · 5.25 across on the ink, point in the bottom-left box corner, bend 0.75 · 0.75 · 0.625 (C10) — but the collar becomes a solid band for the ferrule (its inside closed by the stroke), 3 · 3 · 2.5 wide — two strokes, 3.32 · 2.82 · 2.56 long, joined by the same concave waist (radius 0.75 · 0.75 · 0.625). The head now stands 2.25 · 1.75 · 1.38 proud of the band each side, against the shipped 1.59 · 1.09 · 0.76, so the waist is still there at 16 (1.38 instead of 0.76). Handle a line, 13.08 · 9.19 · 8.13 of ink past the band. Filled: the head fills to the outline's outer edge, the band is already solid, the handle stays a line at 1.5 · 1.5 · 1.25. Ink 18×18 · 14×14 · 12×12 on the square keyline (as pencil and the shipped paintbrush), centred; filled ink box equals the outline's at every master. Off-grid numbers are tangent points of the round parts; circle centres, cap ends and box edges sit on the grid (quarter at 24 and 20, eighth at 16). (recommended) it changes one thing about the drawing Maruti chose — the collar — and that one thing is exactly what fails at 16: a dark band between a light ring and a thin line reads as a ferrule at every size, and the band also drops the shipped collar's 1.22 of air inside at 16 (below the 1.5 floor, a gap lint cannot see inside one path). -->
