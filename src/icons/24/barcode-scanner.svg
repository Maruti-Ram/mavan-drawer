  <!-- Handheld scanner: Rhythm: three rays fan from the scanner's nose with equal air between their inner ends, 1.5 at every master (pitch 3 · 3 · 2.75), 1.5 clear of the head, slopes 0.42 · 0.5 · 0.5 so they spread from inside the head. Head a rounded block 14×8 · 11.5×7 · 10×6 of ink, container radius 2.5 · 2 · 1.5; handle hung from the head's back half, raked back 15.3° · 15.7° · 15°, inside air 2.6 · 2.35 · 1.89, its bottom corners rounded at the detail radius 1.5 · 1.25 · 1 (the fillet tangent points are off the quarter and eighth grid — 2 and 3 dp — because the handle is raked). Ink 20×20 · 16×16 · 14×14 (circle keyline), box-centred. Filled: a shape icon — head and handle fill as one silhouette whose outer edge is the outline's, the rays stay at the line weight 1.5 · 1.5 · 1.25. Who: Material Symbols barcode_reader (the only major set that draws the gun). It says "barcode scanner" more than "barcode" — a device, and a candidate name of its own (barcode-scanner). -->
