  <!-- Gesture bar: Rhythm: mobile A's bar exactly — ink 4 · 3 · 2.5 long, 1.5 above the floor at every master, on the centre line; air to each side wall 4.5 · 4 · 3.5. Body: the phone grown wider — ink 16×20 · 14×16 · 12×14, declared box (0.80 · 0.88 · 0.86 wide-to-tall; Tabler 0.80, Lucide 0.82, Heroicons 0.77, Material 0.82), the same height as the phone and 4 wider at every master, so beside it at 16 it is 12 against 8; widened at 20 and 16 from the portrait keyline (12×16 · 10×14, 0.75 · 0.71), which at real 16 read as the phone. Radius 2.5 · 2 · 1.5 and walls 1.5 · 1.5 · 1.25 as the phone; inside 13×17 · 11×13 · 9.5×11.5; every edge on a whole unit at 20 and 16. Filled: body solid, the bar cut out (1.5 tall at 16, grows 0.25 up), 3 · 3 · 2.75 of solid below it. Pairs with mobile A. At 24 the body is shipped speaker's body exactly (16×20, r2.5, and calculator's); what tells them apart is the inside — speaker has a dot over a ⌀8 ring filling the face, calculator a readout and keys, the tablet one short bar at the foot and an empty screen; at 20 and 16 the tablet is wider than both (14 · 12 against 12 · 10). Who: Heroicons device-tablet, Tabler device-ipad, Polaris Tablet, Material tablet_android (bar). (recommended) — it is the phone you pick widened, with the same bar at the same height, so the two read as one family and the tablet never reads as calculator. -->
