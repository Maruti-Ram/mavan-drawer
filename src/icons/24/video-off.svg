  <!-- box: 20x18 -->
  <!-- Bar cut through: What the eye sees: the camcorder struck in two along the bar. Lower left, the body's left wall and bottom as one open bracket; upper right, the body's top-right corner still carrying the lens wedge, so the flap that says "video" survives at every master. Lucide's video-off reading, built as cloud-off and bug-off are. The bar (C21, V1 spec): \ at 45°, its ink the square keyline 18 · 14 · 12, centreline (3.75,3.75)-(20.25,20.25) · (3.75,3.75)-(16.25,16.25) · (2.625,2.625)-(13.375,13.375), exactly on video's own ink centre 12,12 · 10,10 · 8,8; video-off-2 and -3 share this bar (same centre). video is 20×14 · 16×12 · 14×10, wide and short, so the bar stands 2 · 1 · 1 past its top and bottom (the cloud case): ink 20×18 · 16×14 · 14×12, declared box, centred. The camera stays in place (C34). Cut: every stroke stops with 1.5 of air from the bar's edge, measured 1.505 · 1.505 · 1.501 at every cut end; round caps on every cut end. Pieces (24 · 20 · 16): body lower-left 21.16 · 15.64 · 13.08 (at 24 it starts 15° into the bottom-right corner; at 20 at the bottom edge's end, 1.505 from the bar; at 16 at x 8.485), body top-right corner 9.43 · 6.89 · 5.08 (top wall 3.25 · 2.0 · 1.36; right wall 2.25 · 1.75 down to the lens root at 24 and 20, where the lens starts on it as in the base, 2.21 · 1.68 from the bar; the cut would have left it 1.0 · 0.25 past the root, so it ends there by the board's junction rule, as B1's columns end at their rung), lens 14.60 · 10.68 · 9.44: its upper leg, top corner, back edge and 80° · 28° · 21° of its lower corner. Removed: the body's top-left corner (top edge left of x 10 · 9 · 7.515, left wall above y 7.22 · 7 · 5.515), its bottom-right corner and the right wall below the lens root (y 10.5 · 8.5; at 16 below 6.485), and the lens's lower leg 4.69 · 3.23 · 2.91, all inside the cut. Line kept 68 · 62 · 59%. At 16 the lens's root lies 0.1 inside the cut (its join would keep only 1.40 of air), so the right wall and the upper leg both stop on the cut line 0.12 apart; they are written as one stroke that steps the 0.12 along the cut line, as the base's lens path starts on the body path. THE ONE EXCEPTION, for Maruti's word: at 16 the top wall runs 1.36 past its corner to its cut end, under C33's 1.5 for a wall past its corner. Kept, because it is the camera's shoulder carrying the corner into the lens (in real pixels at 16, without it the corner is a blob), and the filled twin's corner is the same solid. Tightest air between pieces 5.30 · 5.07 · 4.88. Filled: video-filled's body-and-lens solid split by a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side), its corners r0.75 · 0.75 · 0.625 centred on the outline's cut ends, so the filled outer edge is the outline's outer edge; two solids, the lower-left body and the top-right corner with the lens; white 1.506 · 1.506 · 1.501 each side; the bar whole through it at 1.5 · 1.5 · 1.25. Off-grid decimals are the cut ends, the channel's corners and the lens's own tangent points. (recommended) -->
