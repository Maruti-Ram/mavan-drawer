  <!-- bitcoin-circle · A’s bowls, half spurs: 24 is A’s, unchanged (letter 9.5, ink 8×12.5, ticks 1.5 standing 3 apart, spurs 1, ring air 1.6 or more, no note). A3: keeps A’s own B at 20 and 16, with the bottom bowl wider than the top (reach 4.5 / 5 · 4.5 / 4.75). The stem stays on 5.63 at 16, so it fills one whole pixel column and is the crispest B of the three. The spurs are cut to about half the ticks (0.5 · 0.38, ticks 0.75 · 0.63), so spur and tick no longer merge into a lump. Ink 7×9 · 6.38×8. Ring air: ticks 1.24 · 1, spurs 1.51 · 1.24. Outline gap 1.2 at 20 and 1 at 16. Placement, by Maruti’s rule: the body (stem to the outer edge of the bowl) is centred on the ring at every master, measured 12,12 · 10,10 · 8,8 to the eighth, as in A. The ticks are the same above and below, so it is centred top to bottom too. The spurs hang left, so the full ink box sits 0.5 · 0.25 · 0.19 left of centre; that is deliberate, not drift. Filled: the disc with the ₿ cut out 1.5 wide, the counters left as islands. At 20 and 16 the knockout B is drawn taller (letter 8 · 7.5), so each counter keeps 1.75 · 1.63 of disc, open; at the outline’s size it would keep 1.25. 16 in real pixels, outline and filled: it reads as a B in a coin, not ฿ (nothing runs through), but the ticks are too short to show — no version of the ₿ can stand its ticks clear of this ring at 16. -->
