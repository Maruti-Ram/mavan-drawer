<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: alignment, paragraph, centre, four rows -->
  <!-- box: 15x15 -->
  <!-- Four rows: The same lines in four rows, full and short alternating (full / short / full / short), so every member of the family is its own drawing and justify (four full lines) is no longer menu. Full lines menu's 15 · 13.5 · 12 of ink, short lines text-2's 9 · 8 · 7 centred (ink 7.5→16.5 · 6→14 · 4.5→11.5; at 16 the short ends fall on half pixels, kept because the length is the family's). Rows even-pitched and centred on the canvas: centrelines 5.25 / 9.75 / 14.25 / 18.75 · 4 / 8 / 12 / 16 · 2.75 / 6.25 / 9.75 / 13.25 (pitch 4.5 · 4 · 3.5), a block 15 × 15 · 13.5 × 13.5 · 12 × 11.75. The cost: the air between lines is 3 · 2.5 · 2.25, against menu's and text-2's 3 · 3 · 3.25, so at 20 and 16 this stack reads denser than every other line stack in the set. Filled: thickened in place to 2.5 · 2 · 2, ends in 0.5 · 0.25 · 0.375, grows 0.5 · 0.25 · 0.375 top and bottom; filled air 2 · 2 · 1.5 — exactly the floor at 16. At 16 the filled stack is 12.5 tall (ink 1.75→14.25), 0.25 past the 12 mark ceiling top and bottom, because four lines of 2 with 1.5 of air between them need 12.5; Maruti picked four rows (2026-10-25), so the drawing keeps an agreed box, 15×15 · 13.5×13.5 · 12×11.75, with the filled growth declared. The 3.5 pitch falls on the pixel grid unevenly: in the outline the white between rows is 1 · 2 · 1 whole pixel rows, so the stack reads as two pairs; in the filled twin rows two and three keep no whole white pixel row between them (a 25 % grey band). -->
  <path d="M5.25 5.25H18.75"/>
  <path d="M8.25 9.75H15.75"/>
  <path d="M5.25 14.25H18.75"/>
  <path d="M8.25 18.75H15.75"/>
</svg>
