  <!-- Heartbeat through the rim: Material's own troubleshoot construction: the pulse comes in from outside the lens through a gap cut in the rim, and ends inside it. The magnifier is search-2 one size up — lens 1 larger in radius about search-2's centre, handle end 1 further out — so ink 20×20 · 16×16 · 14×14, lens ⌀19 · 15 · 13.5, clear 8 · 6 · 5.5, handle 5.04 · 4.21 · 3.24 beyond the lens (search-2 4.62 · 3.8 · 2.83). The lens has to grow for the same reason as A2's: activity's beat needs 5.04 · 5.04 · 4.84 of clear radius. The ring is cut back on the left so its round ends hold 1.5 of air above and below the line (C33's cut-back, by hand): the gap runs y 9.75–15.75 · 7.5–13.5 · 5.88–11.38. The line's round end sits on the lens's outer edge (it stands under 0.1 proud of the ring there, and the ink box does not change) and runs 3.21 · 2.29 · 1.98 straight to the first bend. Beat: activity's construction (legs 1×3, C10 bends, round caps) in Material's rhythm — the up-stroke taller than the dip: tips 6.5 · 3.75 · 3.63 above and 4.5 · 3.25 · 3 below the line's centre. The line sits 1.25 · 1 · 0.875 below the lens centre, as Material's does, and the beat 0.75 · 1 · 1 left of centre, so a short tail (1.57 · 1.16 · 1.12 straight) can end inside the lens with its round end 1.5 from the rim instead of meeting it. Air: tips to the rim 1.91 · 1.69 · 1.55; mouths 2.41 · 1.61 · 1.53; the beat to the ring and the line to the gap's ends 1.5 · 1.5 · 1.5. Tightest 1.5, the gap, by construction. Filled: the lens fills solid and the beat is a 1.5 white cut that enters through the lens's edge at the same place — a slot whose walls meet the edge square — its tail ending 1.5 short of the edge; material from the cut to the edge 3 · 2.18 · 1.67, between a flat and the long stroke 2.41 · 1.61 · 1.36 (floor 1.5 · 1.5 · 1.25); search-2-filled's grip. The slot sits just below the lens's leftmost point, so the filled ink box equals the outline's. Off-grid decimals: the gap's ends and the slot's walls where they meet the circle, the bend tangent points, the tail's end, the handle's start and the grip's tangent points. At 16 in real pixels: reads as a trace passing through a lens — Material's picture — but the broken rim and the line's end crowd the left side, and the filled lens with its notch at nine o'clock reads first as a bitten disc, then as a pulse. -->
