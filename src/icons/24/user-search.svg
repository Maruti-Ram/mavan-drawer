  <!-- Magnifier on the figure: The shipped user (head and tall dome), kept exactly where user has it, with a magnifier badge on its bottom-right corner, the badge's ink corner on the margin edge (22 · 18 · 15), C33. The magnifier is search (the default, 0.42 split) scaled to a badge at the outline weight: lens outer radius over the magnifier's ink side 0.43 · 0.43 · 0.42 (search 7.75 / 18 = 0.43, Nucleo 0.43, Lucide 0.44); the handle at 45°, starting on the lens's centreline as search's does, and showing 3.11 · 2.35 · 2.19 past the lens (0.78 · 0.78 · 0.88 of the lens radius; search 0.83). search-2's big lens (0.47) leaves a stub of handle at badge size and search-3's small lens (0.36) needs a 4.5 outer diameter at 16, which cannot put both sides on whole pixels; zoom-in is search with a plus the badge has no room for. Lens r 3.25 · 2.25 · 1.875 on centre 16.75 · 14 · 11.5 (both axes), handle to 21.25 · 17.25 · 14.375. That lens is the head's own circle at every master (the head is r 3.25 · 2.25 · 1.875) — search's proportion lands there, it was not set; Nucleo's 12-grid user-search draws the two circles equal too. At 16 the lens's sides sit on whole pixels (9 and 14). Inside air 5 · 3 · 2.5 (the hole; 1.5 needed). Badge ink 9.25×9.25 · 7×7 · 6×6 (calendar-repeat's loop 9.75 · 9×8.25 · 8.13; user-lock's lock 8×9.5 · 7×8.25 · 6×7); a larger magnifier at 20 or 16 cuts the dome short of its top: at 7.5 · 7 across the dome stops 0.66 · 1.41 of arc before it. The head is untouched: 3.75 · 3.85 · 3.73 of air to the lens. The figure is cut back by hand with 1.5 of air from the magnifier's ink, and only its body: the whole right shoulder, the right wall and the right bottom corner go, because the lens stands on the dome (its centre 5.49 · 4.27 · 3.64 from the dome's centre, inside the dome's 7.25 · 5.25 · 4.375). The dome runs from the bottom-left corner over the top and stops on its top (12, 12.25 · 10, 10.25 · 8, 8.125), as user-lock's does at 20 and 16: the furthest point holding 1.5 is only 0.40 · 0.32 · 0.33 of arc past the top, a stub. The bottom wall stops at x 12.25 · 9.75 · 7.75, 6 · 3.75 · 3.13 past its corner (the furthest it may go is 12.41 · 9.88 · 7.88; one grid step back keeps 1.6 rather than 1.5). Tightest air, outline: 1.61 · 1.60 · 1.60, bottom wall end to the lens (the dome's top holds 1.79 · 1.73 · 1.74 to the lens). Box 18×20 · 14×16 · 12×14 (declared, the same as user-lock): user's 16×20 · 12×16 · 10×14 plus the magnifier's 2 past its right side, so the centre is 13,12 · 11,10 · 9,8, 1 right of the canvas centre at every master: the figure keeps its place, as in user-lock, which Maruti approved in place (2026-10-25), so the files declare <!— base: user —> and lint holds the composite to user's left and top edges. Filled: the magnifier stays a line at the outline weight 1.5 · 1.5 · 1.25, ring and handle, its outline drawing verbatim. search-filled keeps the lens open — C20 rejected the solid lens as a balloon on a wire, the counter is the glass — so the ring is not a disc; and search-filled's 2.5 · 2 · 2 rim in the badge's own ink box leaves a hole of 3 · 2 · 1, under the 1.5 at 16, so it keeps C33's line-badge weight, as calendar-repeat's loop and the lock's shackle do (no badge note: the base is a shape icon, so its lines stay at the outline weight anyway). C20's tapered grip is licensed for search's own handle and has no room on a 2.2–3.1 handle. The figure is user-filled cut along the magnifier's ink grown 1.5: a circle of radius 5.5 · 4.5 · 4 round the lens centre (the handle's grown edge never reaches the body), meeting the dome at the shoulder past the top, then down to the outline bottom wall's ink end (x 13 · 10.5 · 8.375), straight to the base; the cut's three junctions eased 0.5 as map-pinned's and password-lock-filled's; the head disc whole. Tightest air, filled: 1.5 · 1.5 · 1.5, body to the lens, by construction. Off-grid numbers: the handle's start (19.05 · 15.59 · 12.83, the lens centreline at 45°, as search's 15.7); in the filled twin the fillets' tangent points (dome to cut 13.07,11.57 / 13.31,12.45 · 10.99,9.58 / 11.21,10.46 · 8.688,7.548 / 8.939,8.427; cut to the vertical 12.85,20.63 / 13,20.99 · 10.4,16.7 / 10.5,17 · 8.277,13.871 / 8.375,14.166), each point on the cut rounded away from the lens so the 2- or 3-decimal point keeps 1.5. -->
