  <!-- Plain cut: Plain cut: the same brilliant-cut stone with only its girdle line. Nucleo draws its small `gem` (12 px grid) this way, and it is what the Lucide and Font Awesome gems become once their facet lines go. Rhythm and balance: folder's and map's agreed box, 20×18 · 16×14 · 14×12. The girdle line sits 29 · 28 · 28% of the way down (Lucide 32%, Nucleo 28%). The crown slopes at 45°, so the table spans 9 · 7.5 · 6.75 of the 18.5 · 14.5 · 12.75 girdle on the centreline (49 · 52 · 53%; Lucide 50%, Nucleo 52%). The lower half falls at 51.6 · 51.2 · 50.6° to a tip rounded at C10's point radius 0.75 · 0.75 · 0.625 (as on map-pin's and shield's tips). Table and girdle corners at the detail radius 1.5 · 1.25 · 1. The girdle line ends on the stone's outermost points (x 2.75 · 2.75 · 1.625, where the outline runs vertical), so it meets the outline square and its caps stay inside the outline's ink. White in the crown 3.24 · 1.98 · 1.74 across, in the lower half 7.84 · 5.76 · 5.04. Filled: one solid stone on the outline's outer edge, with the girdle as a 1.5 cut whose round ends stop 1.5 short of the outer edge (package-3's seams; 1.50 · 1.60 · 1.49 measured), so the silhouette stays whole and the ink box matches. In real pixels at 16 it is the cleanest of the five: two crisp horizontal lines over a clear V. The sides at about 51° are an angle exception (Maruti's ruling). (recommended) -->
