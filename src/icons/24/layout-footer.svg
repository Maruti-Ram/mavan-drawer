  <!-- Third, wall to wall: Frame is checkbox's square (18 · 14 · 12, container radius 2.5 · 2 · 1.5, outer 3.25 · 2.75 · 2.125), the frame grid-2 and grid-6 already ship on. One divider wall to wall at y 14.25 · 11.5 · 9.375 - grid-6's sidebar divider (x 9.75 · 8.5 · 6.625) turned a quarter and mirrored (24 - 9.75, 20 - 8.5, 16 - 6.625), so the footer takes the same share grid-6's sidebar does: footer counter 4.5 · 3.25 · 2.75, page counter 9 · 6.25 · 5.5 (33 · 34 · 33% of the space the divider leaves). 16 master at stroke 1.25: the frame's centreline on 2.625 / 13.375 keeps its outer edge on pixels 2 and 14; the divider sits on y.375 so its lower edge lands on a whole pixel. Rasterised at 16 (column 8): the divider is one solid pixel row (row 9), with two clear rows under it (10, 11) and the frame's bottom row at 13. Filled: grid-6's cut - two solids split by a 1.5 cut (13.5-15 · 10.75-12.25 · 8.5-10; at 16 the cut shares the divider's whole-pixel lower edge, as grid-6's 16 cut shares its divider's left edge), outer corners on the outline's (3.25 · 2.75 · 2.125), cut corners eased 0.5 as grid-2 and grid-6; footer piece 6 · 4.75 · 4 tall under a page piece 10.5 · 7.75 · 6.5.. At 16 the filled footer is a solid four-pixel slab under one clear row. Nothing new enters the set: frame, radius, divider share and filled cut are all grid-6's, so layout-header is this drawing mirrored (divider at 9.75 · 8.5 · 6.625, grid-6's own numbers) and layout-sidebar is grid-6 without its row line. The Lucide construction (panel-bottom: line a third up, wall to wall), at our weight and radius (recommended: the plainest drawing that reads as a page with a footer at 16, and the one whose numbers carry straight to the rest of the layout family) -->
