<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: alignment, paragraph, right, four rows -->
  <!-- box: 15x15 -->
  <!-- Four rows: Four rows, full / short / full / short, all ending on the same right edge, so every member of the family is its own drawing (justify becomes four full lines, not menu). The lines are A's: full 15 · 13.5 · 12 of ink, short 9 · 8 · 7 (text-2's), short ink x 10.5→19.5 · 8.75→16.75 · 7→14, the mirror of text-align-left's. The rows are even-pitched and centred on the canvas: centrelines 5.25 / 9.75 / 14.25 / 18.75 · 4 / 8 / 12 / 16 · 2.75 / 6.25 / 9.75 / 13.25, pitch 4.5 · 4 · 3.5, air 3 · 2.5 · 2.25. The stack is a square block at 24 and 20, 15 × 15 · 13.5 × 13.5, and 12 × 11.75 at 16. The trade: at 20 and 16 the air between lines (2.5, 2.25) is tighter than menu's 3 · 3 · 3.25, so beside menu, text-2 and list-bullet this stack reads denser, and at 16 it stands 11.75 tall against their 10.25. It also ends on a short line, so its bottom-left corner is open. Filled as A: weight 2.5 · 2 · 2, ends pulled in 0.5 · 0.25 · 0.375, the stack 0.5 · 0.25 · 0.375 proud top and bottom (grows); air between rows 2 · 2 · 1.5 — exactly the floor at 16. At 16 the filled stack is 12.5 tall (ink 1.75→14.25), 0.25 past the 12 mark ceiling top and bottom, because four lines of 2 with 1.5 of air between them need 12.5; Maruti picked four rows (2026-10-25), so the drawing keeps an agreed box, 15×15 · 13.5×13.5 · 12×11.75, with the filled growth declared. The 3.5 pitch falls on the pixel grid unevenly: in the outline the white between rows is 1 · 2 · 1 whole pixel rows, so the stack reads as two pairs; in the filled twin rows two and three keep no whole white pixel row between them (a 25 % grey band), measured on this board's 16 rendered at real size. -->
  <path d="M5.25 5.25H18.75"/>
  <path d="M11.25 9.75H18.75"/>
  <path d="M5.25 14.25H18.75"/>
  <path d="M11.25 18.75H18.75"/>
</svg>
