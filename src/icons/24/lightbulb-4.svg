  <!-- Open neck: Portrait keyline, ink exactly 16x20 · 12x16 · 10x14, box-centred. Globe r7.25 · 5.25 · 4.375 (map-pin's head circle). A's straight taper, but the walls stop open at the neck on round caps (8 · 6 · 6 ink across), and the one base line 1.5 below closes it visually, as Lucide's bulb does. Sides lean 33.3 · 32.4 · 22.9 degrees from upright (tangents from the globe to the cap centres). Filled: the same silhouette closed, its bottom corners the caps' own round (r0.75 · 0.75 · 0.625), line stays a line 1.5 below. Only one horizontal band at 16 (the base line) instead of A's two, and the open neck keeps air where the others stack ink (recommended). Off-grid decimals: tangent and touch points sit where the tangent lands (computed, rounded to 2 dp · 2 dp · 3 dp); every centre, radius, extreme and line end is on the grid (16 on x.375/x.625, so outer edges land on whole pixels). -->
