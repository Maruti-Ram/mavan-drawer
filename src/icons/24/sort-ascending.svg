<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- keyline: mark -->
  <!-- tags: sort, ascending, order, arrow, arrow up, sort by, low to high -->
  <!-- Family arrow, rag agrees: Three bars growing downward — short, medium, long, the way a sorted list reads from its first row — with the family's up arrow full height beside them on the right. The arrow is `arrow-up`'s own drawing taken verbatim — head and stem, the head its own note reserves for composites — placed by a shift in x alone: ink 10 · 9 · 8 across, apex on the canvas ink edge, stem running the full 15 · 13.5 · 12. At 24 and 20 the outline legs are a true 45 degrees; AT 16 THEY LEAN (2.928 across against 3.001 down, 45.7 degrees) and the filled head is a true 45 — that is what `arrow-up`, `arrow-down`, `upload` and `logout` ship, so it is taken, not redrawn. Bars on `menu`'s own left edge (centreline 5.25 · 4 · 2.625, ink 4.5 · 3.25 · 2) and `menu`'s own 4.5 pitch at every master. Rows 8/12.5/17 · 6/10.5/15 · 4/8.5/13: `menu`'s rows dropped half a unit, and that half unit is the whole reason this candidate exists. It clears the head's filled tip enough for an EVEN step — bars 3.25/5.25/7.25 · 3/4.75/6.5 · 2.5/4/5.5, step 2 · 1.75 · 1.5 — with the longest bar at its full 48% · 48% · 46% of the mark. On `menu`'s exact rows (B) the middle bar is capped at 4.75 · 4 · 3.375 and the step goes uneven. Outline air between bars 3 · 3 · 3.25, filled air 2 · 2.5 · 2.5 — the same air `menu` holds. Box 15x15 · 13.5x13.5 · 12x12, centred; the arrow sets it. Smallest gap in the drawing 1.96 · 1.75 · 1.71 outline, 1.50 · 1.50 · 1.50 filled — the longest bar to the filled stem, exactly §6's floor at every master. Filled: line-heavy, weight 2.5 · 2 · 2, every end pulled in by half the added weight, and the arrow is `arrow-up-filled`'s own path on the same shift. The arrow holds all four edges of the box, so the bars thicken in place inside it and the filled ink box equals the outline's — no grows note. MIRROR: flips cleanly to `sort-descending` (rows 7/11.5/16 · 5/9.5/14 · 3/7.5/12, bars reversed) but the stack is 0.5 below centre here and would be 0.5 above there, so the bars move 1 unit when a header toggles. (recommended) -->
  <path d="M5.25 8H7"/>
  <path d="M5.25 12.5H9"/>
  <path d="M5.25 17H11"/>
  <path d="M10.25 9.19L13.97 5.47A0.75 0.75 0 0 1 15.03 5.47L18.75 9.19"/>
