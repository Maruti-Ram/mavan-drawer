<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: receiver, tabletop, grille, knob -->
  <!-- Tabletop receiver: Rhythm: one air everywhere inside the body — 1.5 from wall to grille, between grille lines, grille to knob and knob to wall at 24 and 20 (knob to wall 1.75 at 16, knob on whole pixels); grille pitch 3 · 3 · 2.75. Three grille lines at 24, two at 20 and 16: three need 10.5 of inside height at 1.5 air and 20 has 7.5, so a line is dropped rather than squeezed. Knob ⌀3 · 2.5 · 2 (live's dot sizes) on the grille's middle. Body 20×13.5 · 16×10.5 · 14×9.5, r2.5 · 2 · 1.5; two feet under the knob and mirrored, standing 2.5 · 1.5 · 1.5 below the body. Ink 20×16 · 16×12 (landscape keyline) · 14×11 (agreed box: 16's landscape keyline is 14×10 and the feet need one more). Filled: body solid, grille 1.5 white slots, knob a white dot, feet stay lines; material between slots 1.5 · 1.5 · 1.25. Who: Lucide radio-receiver (box on two feet with a knob), Central radio's knobs. Reads as a hi-fi tuner more than a radio; at 16 the feet are short. -->
