he band: its bottom edge ends in the bottom wall cap (centre 12.75,20.25 · 10,16.25 · 8,13.375, ink to x 13.5 · 10.75 · 8.625, as the outline), joined by the tangent to the grown left cap, which it follows up to x 12.5 · 10.5 · 8.5 and leaves there straight up to the band, eased 0.5 at the tip 12.5,15.31 · 10.5,12.56 · 8.5,10.06; where it leaves the cap the solid is 1.90 · 1.72 · 1.72 from the band. Following the grown cap on up instead would pinch the solid between the band and the cut to 1.24 · 1.07 · 1.10, under the line weight 1.5 · 1.5 · 1.25 that material between two cuts keeps, and leave a sliver under the peak that at 16 ends in a spike into the plus, so it goes, as a wall under 1.5 is removed; it is the only solid that would have reached into the plus gaps. The band stays 1.5 of white from the bottom-left edge to the wedge tip; past it the white opens round the plus and the sky edge alone draws the peak. Tightest air, outline 1.51 · 1.51 · 1.52, filled 1.5 at every master (the wedge to the bar left cap; the sky 1.51 · 1.50 · 1.50 to the top cap; both caps 1.51 · 1.52 · 1.52, as the outline). Box 19×19 · 15×15 · 13×13 (declared), centre 0.5 toward the badge, as calendar-repeat; filled ink box equals the outline one. Off-grid decimals: image own (the peak tangent points, the filled arc ends and fillets), the peak arc new end, and in the filled twin the tangent points of the end caps, the 0.5 rounds and the grown cap, rounded to 2 · 2 · 3 dp away from the plus -->
