  <!-- Big slash to the square, lifted 1.25, crisp, whole notch: What the eye sees: bookmark-3 under A1's lifted bar: A1 without the fold line. The whole notch survives, so the foot reads as a bookmark. Above the bar sit the top edge from x 8.25 · 8.25 · 6.765, the right corner and the right side. The top-left corner goes, and the right tail is short. The bar's centre sits 1 above the canvas centre and 0.25 right of it, at 12.25,11 · 10.25,9 · 8.25,7; the 1.25 is the line it sits on. Bar (C21, V1 spec as ruled 2026-10-25, the big slash to the square keyline): \ at 45°, its ink the square keyline 18 · 14 · 12, centreline (4,2.75)-(20.5,19.25) · (4,2.75)-(16.5,15.25) · (2.875,1.625)-(13.625,12.375), on the line through the bookmark's ink centre lifted 1.25 (0.88 square to the bar), slid 0.25 down-right along itself (0.35 along the bar) at every master; the same bar on all three bookmarks, whose ink centres agree. Its ink spans x 3.25–21.25 · 3.25–17.25 · 2.25–14.25, y 2–20 · 2–16 · 1–13, inside the margin edge. OUTSIDE C21's centred bar: A1's bar, the row's one bar. It stands 1.75 · 0.75 · 0.75 past the bookmark's left side and 2.25 · 1.25 · 1.25 past its right. Along the bar it runs 2.23 · 1.12 · 1.03 past the silhouette at the top left and 2.87 · 1.46 · 1.51 at the lower right, the closest balance the margin allows. Why not a whole step: a lift of 1 loses the V's right edge at 20 (1.371 of air, under 1.5) and is 0.004 short at 16 (1.496). A lift of 2 is the least whole step that works at every master (air 2.79 · 2.08 · 2.20), but it slides the box 1 right of centre, the bar 1 · 0 · 0 past the left side and 3 · 2 · 2 past the right, visibly lopsided. So 1.25 with a 0.25 slide is the better balance. Cut: every stroke stops with 1.5 of air from the bar's edge, measured 1.500–1.505 at every cut end (centrelines 3 · 3 · 2.75 apart), round caps; the cut ends at 16 are not snapped to pixels, so the air stays even. The notch's right edge runs at 45°, parallel to the bar, its centreline 3.75 · 3.05 · 2.92 from the bar's (air 2.25 · 1.55 · 1.67). The foot is kept whole. The lower piece starts on the right tip's round at (18.03,21.03) · (14.18,17.18) · (11.737,14.375), runs down both notch edges, round the left tip and up the left side. The notch's right edge keeps 2.25 · 1.55 · 1.67 of air to the bar along its whole length (centred: 1.37 · 0.66 · 0.79, inside the cut). What the longer bar removes that the inside-width bar did not: only the right tip's round, 1.09 · 0.96 · 0.87 more. At 24 that is the right side's last 0.5 and half the tip's round; at 20 the tail also loses its lowest point, its ink ending 0.07 above the foot; at 16 the round goes to its lowest point. The top corners, the left tail and the notch are cut exactly as before, because the cut is square to the bar wherever the bookmark meets it. Kept (24 · 20 · 16): the upper piece 19.37 · 13.48 · 10.79, to y 12.75 · 9.75 · 7.235 on the right side; the foot 28.44 · 21.70 · 18.53, up the left side to y 8.75 · 7.75 · 6.265. Removed: the right side between the cuts with part of the tip's round, 8.33 · 8.24 · 7.51; the left side's top with the left corner and the top edge's first 0.99 · 2.24 · 2.14, 7.84 · 7.95 · 7.35; crumbs under 1.5 dropped: none · none · none. 75% · 68% · 66% of the bookmark's line survives. Every uncut segment is the shipped bookmark-3's, verbatim; off-grid decimals are the cut ends and the channel's corners, where the circle or line puts them. bookmark-3 stays in place (C34): its ink 14×20 · 12×16 · 10×14, centred 12,12 · 10,10 · 8,8. The composite's ink is 18×20 · 14×16 · 12×14 (declared box at every master), 0.25 right of the canvas centre (optical 0.25 0), outline and filled alike. Filled: a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side) knocked out of the solid, its corners rounded r0.75 · 0.75 · 0.625 about the outline's cut ends, so each solid's tip is the outline's cap; white 1.500–1.506 each side. The bar runs whole through it at 1.5 · 1.5 · 1.25. Two solids: above the bar 76.4 · 43.45 · 28.45, the foot 87.2 · 55.54 · 40.66 (units²). The right tail is a strip 2.25 · 1.55 · 1.42 wide, over the line weight. Balance: outline mass +0.02,−0.09 · −0.02,−0.08 · 0,−0.03 (bookmark-3 alone 0,+0.09 · 0,+0.04 · 0,+0.05; C2 −0.34,−0.68 · −0.22,−0.49 · −0.18,−0.42), the nearest to the canvas centre on the board. Filled −0.01,−0.64 · −0.10,−0.45 · −0.09,−0.27 (bookmark-3-filled 0,−0.75 · 0,−0.55 · 0,−0.46). What it costs: as A1: C21's exact centring, the top-left corner, a short right tail, a box 0.25 right of centre, and 1.55 of air between the V's right edge and the bar at 20. (recommended) -->
