  <!-- Top-right corner: Decision on A's picture: which corner. A turned to the top-right, every number kept — radius 7.5 · 5.75 · 4.875 on the centreline (outer 8.25 · 6.5 · 5.5, 45% of the side), legs straight 9 · 6.75 · 5.88 past the arc, ink 18×18 · 14×14 · 12×12, box-centred; filled weight 2.5 · 2 · 2 with the outer curve kept (7 · 5.5 · 4.5 on the centreline). The references split two and two: Lucide square-round-corner puts its big corner top-right (refs file: an r8 arc from 13,3 to 21,11) and so does Material rounded_corner (from memory); Polaris CornerRound and Nucleo corner-radius put it top-left (refs file). The eye sees the same rounded corner, opening down-left instead of down-right. Catch: none of its own at 16 — it is a choice about where the set's corner sits, to be made once and kept by every corner icon after it. -->
  <path d="M3.75 3.75H12.75A7.5 7.5 0 0 1 20.25 11.25V20.25"/>
