  <!-- Two bars through, cut-out fill: The standard ₱ — two bars right through, past both sides — with a cut-out filled twin. Outline: A1's bowl (12 · 10 · 9.25, 75 · 77 · 77% of the cap; C is 69 · 69 · 75%) so the P keeps a tail of 4 · 3 · 2.75, bars at y 8.25/11.75 · 7/10 · 5.25/8 standing 2.25 · 1.75 · 1.375 past the stem and past the bowl, box-centred, ink 14×16 · 11.5×13 · 10×12 (C's box). Outline air bowl→bar→bar→bowl 2/2/2 · 1.25/1.5/1.25 · 1.375/1.5/1.375 — 0.25 and 0.125 under the floor at 20 and 16; lint does not measure bowl-to-bar where a bar crosses the bowl, so no note can be declared and it is stated here (the references accept less: SF Symbols leaves about one stroke of air with bars thinned to 0.65 of the stroke). Filled: stem and bowl one solid shape with the outline's outer edge, the two bars white slits 1.5 tall at every master, round-ended, three equal ink bands 3/3/3 · 2.25/2.5/2.25 · 2.125/2/2.125; slits start after a stem wall of 1.5 · 1.5 · 1.25 and stop 1.95 · 1.92 · 1.61 short of the outer curve, and ink stubs at the outline weight continue each slit 2.25 · 1.75 · 1.375 out on both sides, so the bar reads as one line passing through. Tail 2.5 · 2 · 2 wide. Ink box identical in both styles. Lint clean, no notes. At 16 filled the two white lines stay open — the only two-bar filled twin here that does. Cost: the filled ₱ is a solid letter beside a € and $ drawn in heavy lines, so it reads a little darker in a row (recommended) -->
