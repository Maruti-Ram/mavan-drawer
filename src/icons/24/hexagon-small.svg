  <!-- Smaller, 0.5: Rhythm and balance: size B, about 0.5 of hexagon's width, the same size class on all five shape boards. Ink 9×9.92 · 7×7.62 · 6×6.54 at 24 · 20 · 16 (0.5 · 0.5 · 0.5 of hexagon's 18 · 14 · 12 across), centred; side margin 7.5 · 6.5 · 5. Same stroke and construction, on a point, flats equal to square-small B's side (the defaults share it too); corner radius shrinks from hexagon's 2.5 · 2 · 1.5 to 0.75 · 0.75 · 0.625 on the centreline (C10's tightest bend, half the weight), so the outer corner is 0.17 · 0.21 · 0.21 of the width (hexagon: 0.18 · 0.2 · 0.18). Weight, measured: filled area 0.25 · 0.249 · 0.249 of hexagon's, outline ink 0.459 · 0.441 · 0.442. Against circle-small B at the same size: filled 0.883 · 0.829 · 1.085, outline ink 0.954 · 0.909 · 1.076 (hexagon against circle: 0.882 · 0.833 · 0.801 filled). Inside air 5.99 · 3.99 · 3.5. Pixels: flats whole at 16 (5/11), half at 24 and 20. At 24 it still reads as a hexagon; at 20 and 16 (7 and 6 pixels across) it reads as a ring, not a hexagon. Lint: the agreed box replaces the keyline check; C8's family check still warns at every master, outline and filled, "small container is N — C8 keeps the default's M; only the inner mark changes", because C8 knows only a mark's 3 · 2.5 · 2 step and a container's kept size. That is the rule question, not a fault in the drawing. -->
