<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: timeline, gantt, bars, plan, schedule -->
  <!-- Two bars (Jira): (recommended) Jira's roadmap: Atlassian's own `roadmap` glyph, which its icon package reserves for roadmaps in Jira and Trello; Carbon's `roadmap` is the same picture with three bars. Two hollow rounded bars, the upper one flush left, the lower flush right, overlapping across most of the width. Landscape keyline: ink 20×16 · 16×12 · 14×10. At 20 it is Atlassian's numbers exactly (bars 13×5, 2 apart, offset 3, outer corner 2, stroke 1.5); 24 and 16 keep its proportions: bars 16.25×6.5 · 13×5 · 11.375×4 of ink, 3 · 2 · 2 apart, offset 3.75 · 3 · 2.625; white inside each bar 3.5 · 2 · 1.5 tall (the floor at 16, and the tightest air in the drawing). Corner radius 1.5 · 1.25 · 1 on the centreline (outer 2.25 · 2 · 1.625): Atlassian's corner, between our C10 bend and a full stadium. At 16 the bars' top and bottom edges land on whole pixels (y 3, 7, 9, 13). Recommended because it is what product users meet daily as "roadmap" (staggered bars are the roadmap picture in 6 of 9 sets), and of the four bar drawings it is the only one that at 16 still reads as bars on a timeline and collides with nothing shipped: B passes for a document, C for menu-2, E for a chart. Nearest shipped: toggle-on (one pill with a knob). All on 0/90 with quarter-circle corners, every value on the grid. Filled: the two bars solid on the outline's outer edge, 3 · 2 · 2 apart; the same box. -->
  <path d="M4.25 4.75H16A1.5 1.5 0 0 1 17.5 6.25V8.25A1.5 1.5 0 0 1 16 9.75H4.25A1.5 1.5 0 0 1 2.75 8.25V6.25A1.5 1.5 0 0 1 4.25 4.75Z"/>
  <path d="M8 14.25H19.75A1.5 1.5 0 0 1 21.25 15.75V17.75A1.5 1.5 0 0 1 19.75 19.25H8A1.5 1.5 0 0 1 6.5 17.75V15.75A1.5 1.5 0 0 1 8 14.25Z"/>
</svg>
