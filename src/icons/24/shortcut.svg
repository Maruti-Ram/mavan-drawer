<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: keyboard shortcut, hotkey, key binding, key cap, bolt, quick key -->
  <!-- Bolt on a key cap: Bolt on a key cap (recommended): the one picture that says "shortcut" on every platform (⌘ is a Mac key), that stays distinct from command and from every other key in this family (each carries its own key's legend), and that fits the family's cap at every master with no warning; Central names exactly this picture "shortcut", and Slack's Shortcuts button is a ⚡. Rhythm and balance: the bolt is centred on the cap (point-symmetric, so no C14 shift) and keeps one proportion at every master — ink 5.5×8.5 · 5.5×8 · 4.5×6.5, 0.65 · 0.69 · 0.69 wide to tall — at 47 · 57 · 54% of the cap's height, with 3.25 · 1.5 · 1.5 of air to the cap's inner edge above and below and 4.75 · 2.75 · 2.5 at the sides. The bolt is solid, as Central's outline shortcut draws it: an outlined bolt this small closes up (the shipped bolt at 16, 10×14, already holds its step white at exactly 1.5). It is one closed stroke whose centreline is slim enough that the stroke fills it — the widest circle inside the centreline is 0.75 · 0.73 · 0.61 in radius, at or under half the weight (0.75 · 0.75 · 0.625), so no counter is left — and its outer corners round at half the weight. The trade, made for the proportion (review, 2026-10-24): a solid stroke-drawn bolt can be at most 5.5 wide at 8.5 tall, so at 24 it holds 20's and 16's shape at 47% of the cap instead of 57%; at 10.5 tall, the share of the other masters, it could only be 5 wide (0.48) and read as a sliver beside them. Long edges 61.9° · 60.3° · 61.6°, against the shipped bolt's 54.6° · 58.2° · 60.9° and bolt-2's 65.9° · 64.2° · 62.6°. Tips stand one above the other (the shipped bolt's sit 2 · 1.5 · 1 apart) and the two steps are 0.5 · 0.5 · 0.75 apart — both needed to keep it solid. Cap: the shipped square, verbatim. Filled: square-filled's solid with the bolt cut out — the white bolt is exactly the outline's black bolt, tips rounded 0.75 · 0.75 · 0.625 (C1's floor is 0.75 · 0.5 · 0.375), widest circle of white ⌀3 · 2.96 · 2.47; every off-grid decimal in the filled path is a tangent point of those half-weight corners. Look-alikes at 16: power-square is also a legend on a key but on its own wider frame; the bare bolt ships as bolt. -->
  <path d="M6.25 3.75H17.75A2.5 2.5 0 0 1 20.25 6.25V17.75A2.5 2.5 0 0 1 17.75 20.25H6.25A2.5 2.5 0 0 1 3.75 17.75V6.25A2.5 2.5 0 0 1 6.25 3.75Z"/>
  <path d="M12 8.5L10 12.25L12 12.25L12 15.5L14 11.75L12 11.75Z"/>
</svg>
