  <!-- Three circles, interlaced: A DECISION ON F, NOT A NEW TYPE. F's three rings exactly (radius 5.5 · 4.25 · 3.75, the same centres and box), but interlaced as Nucleo draws its filters icon (the concept's source, rendered this session). Each ring passes behind one neighbour and in front of the other: the top ring behind the lower right, the lower right behind the lower left, the lower left behind the top. Each ring ends where it meets the ring in front, so the three arcs are near equal, 266 · 267 to 270 · 268 to 269°, and turn round the centre in one direction. Rings meet at 86.0 · 86.6 · 88.0°. White: one open middle, 6.01 · 4.5 · 4 across, with no closed pockets. Mass 1.08 · 0.84 · 0.75 below the canvas centre. Filled: no ring can sit in front everywhere, so each disc is cut 1.5 from the disc it passes behind (users-behind's cut), with its two horns rounded at half the weight (crescents 6 · 4.33 to 4.5 · 3.71 to 3.75 at their thickest, computed from the drawing), and the middle stays white. At 16 that reads as a swirl of three crescents (a triskelion), not three circles. The second fault comes back in a new form. Ink box identical. -->
