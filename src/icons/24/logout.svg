  <!-- Bracket 6, arrow deep: Shipped logout reads well; it changes only because C31 pairs it with login by arrow — the same arrow, the door swapped to the other side — so the pair stays matched when a button swaps one for the other. Changed: the arrow is A's (13.5 · 10 · 8.5, filled 12.5 · 9.5 · 7.75), its point still on the box edge, so its tail now stands 3 · 2.5 · 2.25 off the wall (was 1.5 · 1.5 · 1.5), both styles — at 16 a white pixel column between wall and tail in both styles — and still starts 1.5 · 0.5 · 0.5 inside the door's mouth, so the arrow still comes out of the door. Head to the returns 7.5 · 5.06 · 3.96 (filled 7.14 · 4.88 · 3.77), unchanged. Kept exactly: the door (C31 — two doors in the set, each drawn once and mirrored; this one is the shallow door, returns 6 · 4.5 · 4 deep, 2 · 1 · 1.25 straight past the container corner 2.5 · 2 · 1.5, filled at weight 2.5 · 2 · 2 with the same outer radius, centreline 2 · 1.75 · 1.125), the square keyline (ink 18×18 · 14×14 · 12×12, filled identical, centred), and the head: arrow-right's at every master and style (10 · 9 · 8 tall, 45° legs, C10 bend 0.75 · 0.75 · 0.625, filled 1.25 · 1 · 1), moved along its own axis only — its off-grid decimals are the shipped head's own bend tangent points. Balance: ink mass 1.65 · 1.05 · 0.90 toward the door (was 1.75 · 1.11 · 0.94) — the door's own weight; the set's optical bearings (tools/optical.mjs) read the same as shipped, and tools/optical-sheet.mjs has no measure for a door and arrow (not a single-bend mark), so no optical shift (C14), as shipped. Upload and download use this same door and the old arrow (turned upright); they are left as shipped — carrying the change to them is a separate call. -->
