  <!-- Triangle: Rhythm: the triangle is the stack’s bullet — a solid mark in list-bullet’s column, centred between the two indented lines, with 3.5 of air between it and the full line at 24 and 20 (4 at 16). It points left, out to the margin. Rows are menu’s and list-bullet’s own (centrelines 7.5/12/16.5 · 5.5/10/14.5 · 3.5/8/12.5, pitch 4.5, air 3 · 3 · 3.25; C17) and the stack is list-bullet’s width (ink 3→21 · 3→17 · 2→14), so it sits on list-bullet’s rows in a toolbar. Top line full, the two lines under it start further in, and the cue sits in the pocket under the top line, centred between rows 2 and 3 (14.25 · 12.25 · 10.25). Box 18×10.5 · 14×10.5 · 12×10.25, centred. Triangle: solid in both styles, 90° point, corners the round join (half the weight); ink 5×3.25 · 5×3.25 · 4.25×2.75 — the largest that closes solid (centreline incircle 0.72 · 0.72 · 0.62, under half the stroke, so no white is left inside). Same air on both members (review, 2026-10-22): a point facing the gap between two rows sits closer than a flat back or open ends facing the line ends square-on, so the indent member’s cue sits 0.5 further in than the outdent’s (0.625 for B at 16) and both hold the same air to the lines. Its point sits 0.5 · 0.25 · 0.375 inside the top line’s round cap, so the filled triangle, which grows from the same centreline, lands flush. Indented lines ink 9.25→21 · 9→17 · 7.375→14 (11.75 · 8 · 6.625 long, 65 · 57 · 55% of the top line), shared by both members. Air, triangle to the indented lines: indent 2.66 · 2.66 · 2.50, outdent 2.53 · 2.53 · 2.33; filled indent 2.09 · 2.37 · 2.06, outdent 2.03 · 2.28 · 1.95. Filled: C17 — the lines thicken in place to 2.5 · 2 · 2, ends pulled in 0.5 · 0.25 · 0.375, row air 2 · 2.5 · 2.5; the stack stands 0.5 · 0.25 · 0.375 proud top and bottom (grows). Filled triangle 6×4.25 · 5.5×3.75 · 5×3.5. Mass 0.43 · 0.23 · 0.24 right of centre (outdent 0.47 · 0.27 · 0.26). At 16: a solid wedge about 4 px tall and 3 px deep beside 6.6 px lines — it stays a triangle in both styles. Who: Microsoft Word, Google Docs, Material Symbols (format_indent_increase/decrease), Polaris (TextIndent / Outdent, in our refs), Remix. Same construction as indent A: same lines in the same places, only the cue turned round. (recommended: the editor-toolbar picture most people know; the solid cue keeps its shape at 16 in both styles; and a solid mark in the bullet column makes it list-bullet’s sibling) -->
