  <!-- Shed, roller door: The picture the sets call warehouse (Lucide warehouse; Central and Nucleo draw the same shed as garage) (recommended — it reads as a building at 16 beside home-2, and the slatted door is what says goods-in rather than front door). A gabled shed on the square keyline: roof 1:2 (26.6°; home-2 is 36.9°), walls from the eave down, bottom corners home-2's 2.5 · 2 · 1.5, apex and eaves 1.5 · 1.25 · 1. The door is a wide opening, 9 · 6 · 5.25 of centreline across (55 · 48 · 49% of the width between the walls; home-2's door is 27%), top corners 1.5 · 1.25 · 1, standing on the floor line; inside it the shutter slats keep a 3 · 3 · 2.75 pitch from the door top to the floor, so every white band is 1.5 at every master. Two slats at 24, one at 20 and 16: a second slat needs the door top 3 higher, and at 20 and 16 that runs it into the roof. Filled: the shed solid, the three · two · two white bands cut out exactly where the outline has them (the slat left between two bands is 1.25 at 16, the line weight — lint prints it as material between cut-outs, at its floor). Risk: it is also garage. -->
