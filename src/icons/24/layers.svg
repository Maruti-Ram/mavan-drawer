<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: layers, stack, architecture, tiers, system design -->
  <!-- Layer stack: A flat diamond with two chevrons under it, each a repeat of the diamond's lower edges one pitch down. Pitch 4.5 · 3.5 · 3.125, so 2.6 · 1.7 · 1.58 of air between parallel edges. Diamond 16.5×7.5 · 12.5×5.5 · 10.75×5 on the centreline, edges at 24.4° · 23.7° · 24.9°. Ink 18×18 · 14×14 · 12×12.5 (the 16 sits 0.5 tall to keep 1.5 of air; lint takes it as the square keyline). Filled: the top layer solid, chevrons stay 1.5 · 1.5 · 1.25. Lucide `layers`, Material `layers`, Tabler `stack-2`, Phosphor `Stack` (from memory): the stack of tiers in an architecture diagram. Two catches: it says "architecture layers" more than "plan", and the sheet lists `layers` under Design Tools, which this drawing would pre-empt -->
  <path d="M3.75 7.5L12 3.75L20.25 7.5L12 11.25Z"/>
  <path d="M3.75 12L12 15.75L20.25 12"/>
  <path d="M3.75 16.5L12 20.25L20.25 16.5"/>
