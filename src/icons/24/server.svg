<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: rack, rack unit, hosting, backend, data center, dns -->
  <!-- box: 20x16.5 -->
  <!-- Two-unit rack: Rhythm: two equal units sharing one middle wall; walls 7.5 · 6.5 · 5.75 apart on their centrelines (24 · 20 · 16), so each unit is 8.25 · 7.25 · 6.375 tall from its outer edge to the middle wall's centreline. One light per unit, ⌀2 · 2 · 1.5 (router's and hard-drive's), with the same air on its three near sides — to the left wall, to the top or floor, and to the middle wall — 2 at 24, 1.5 at 20 and 16 (hard-drive's air). Ink 20×16.5 · 16×14.5 · 14×12.75, box-centred; corners r2.5 · 2 · 1.5 (the container radius). Balance: the lights pull the mass 0.28 · 0.25 · 0.16 left; filled 0.14 · 0.15 · 0.10 right. Filled: two solid units split by a 1.5 band on the middle wall's centreline (band corners r0.5, as hard-drive-filled's lid), each light a hole of the same size set in the middle of its unit — 2.75 · 2.25 · 2 of material to the top, bottom and left edge (2.125 below at 16, for the eighth grid). Who: Lucide server, Material dns, Tabler server, Phosphor HardDrives, Nucleo server — the most common server picture. Lucide and Material leave a gap between the units; that cannot hold the light's air at 20 and 16 (see the top of the file), so the units share a wall as Phosphor's and Tabler's do. At 16 its filled twin is rows-2-filled with a light in each bar; the lights are what say server. (recommended) -->
  <path d="M5.25 4.5H18.75A2.5 2.5 0 0 1 21.25 7V17A2.5 2.5 0 0 1 18.75 19.5H5.25A2.5 2.5 0 0 1 2.75 17V7A2.5 2.5 0 0 1 5.25 4.5Z"/>
  <path d="M2.75 12H21.25"/>
  <path d="M6.25 8.25A0.25 0.25 0 1 0 6.75 8.25A0.25 0.25 0 1 0 6.25 8.25Z"/>
  <path d="M6.25 15.75A0.25 0.25 0 1 0 6.75 15.75A0.25 0.25 0 1 0 6.25 15.75Z"/>
</svg>
