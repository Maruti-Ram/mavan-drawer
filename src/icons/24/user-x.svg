tred 12.99,12.32 · 10.96,10.34 · 9.177,8.286, radius 0.75 · 0.75 · 0.625): left to run on, the rim between the dome edge and the bite round the x's upper-left tip would thin to 0.26 at 24 and to nothing at 20 and 16. The dome edge leaves at 13.09,11.58 · 11.1,9.61 · 9.345,7.685 onto the cap, and the cap meets the bite at 13.43,12.92 · 11.41,10.94 · 9.506,8.818: the cap and the grown circle round the tip are tangent (centres 3 · 3.002 · 2.751 apart, cap plus grown radius), so user-plus's joining line shrinks to that one point. The bite runs round the upper-left tip, down the upper-left arm's side from 13.15,16.34 · 11.15,14.34 · 9.122,12.128 into the gap between the x's two left arms, where the solid keeps the small tab that gap leaves, its square tip (14.82,18 · 11.82,15 · 9.495,12.5) eased r 0.5 (from 14.46,17.65 to 14.46,18.35 · 11.46,14.65 to 11.46,15.35 · 9.141,12.147 to 9.141,12.853), reaching x 14.6 · 11.6 · 9.29; then up the lower-left arm's side to 13.15,19.66 · 11.15,15.66 · 9.122,12.872 and round the lower-left tip to 12.5,21.25 · 10.5,17.25 · 8.5,14.375. There the strip under the x ends in the outline base line's own round cap (centred 11.75,21.25 · 9.75,17.25 · 7.875,14.375, radius 0.75 · 0.75 · 0.625), tangent to the bite with no joining line because the outline's air there is exactly 1.5, so the filled bottom edge ends where the outline's does, at x 12.5 · 10.5 · 8.5. The x's other three gaps lie outside what is left of the body, so they keep no tab. Tightest air, filled: 1.5 · 1.5 · 1.5 at the base cap, by construction; 1.506 · 1.502 · 1.5 round the dome's cap and the upper bite; 1.505 · 1.501 · 1.5 round the tab. Off-grid numbers: the dome ends above; in the filled twin the dome's exit, the cap's meeting with the bite, the arms' side feet and the tab's ease points (listed above), each rounded on the side that keeps 1.5 and stays inside user-filled's edge, the cap's own points onto the cap's circle. -->
