<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: bars, columns, axis, graph, analytics -->
  <!-- Corner axis, three bars: An L-shaped axis - left and bottom in one line, corner rounded 1.5 · 1.25 · 1 - with bars floating inside it: low, tall, middle. The textbook chart; the axis takes room, so the bars are shorter and thinner-looking than in A or C. At 16 the third bar is removed: the filled twin needs the axis (2) plus three bars of 2 and three gaps of 1.5 = 12.5 in a 12 box, so the 16 has two bars, low and tall, evenly spaced in the field. Square guide box. Bar heights 6/13/9.5 · 4/9.5/6.5 · 4/8. Smallest gaps: bar to floor 1.5 · 1.5 · 1.75; axis to first bar 3.25 · 2.75 · 3.125, filled 1.75 · 2 · 2; between bars 3.5 · 2.5 · 2.75, filled 2.5 · 2 · 2. At 20 the bars sit on 8 / 12 / 16 so the filled bars are whole pixels; the price is that the last bar ends flush with the end of the floor (0.25 spare; 24 has 1.75, 16 has 2.375). Ink box 18x18 · 14x14 · 12x12, filled identical. Filled: line-heavy, everything at 2.5 · 2 · 2, box held; the axis corner takes the filled bend 1.25 · 1 · 1 (C10). Extends: horizontal = same axis, bars lying; stacked and trend fit at 24 and 20 but the 16 is already down to two bars, so both would be thin there -->
  <path d="M3.75 3.75V18.75A1.5 1.5 0 0 0 5.25 20.25H20.25"/>
  <path d="M8.5 12.75V17.25"/>
  <path d="M13.5 5.75V17.25"/>
  <path d="M18.5 9.25V17.25"/>
</svg>
