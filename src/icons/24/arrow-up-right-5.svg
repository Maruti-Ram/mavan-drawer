  <!-- One step down: A one C8 size-step down. Ink 10 · 9 · 8 square - 3 · 2.5 · 2 below A, C8's own step - with the head unchanged, so the arrow runs 13.21 · 11.80 · 10.54, the nearest of the three sizes to arrow-up's 15 · 13.5 · 12. The head then covers 76% at every master, against arrow-up's 67%, and the mark is head-heavy: at 16 its 7.97 span nearly equals its 8-unit box, which is how external-link's own arrow is proportioned (it has a box beside it to fill the rest of the canvas). Standing alone in a 16 row next to 12-tall marks it will read small. Every edge lands on a pixel at 24 (ink 7 to 17) and at 16 (ink 4 to 12). Bend 0.75 · 0.75 · 0.625. Filled 2.5 · 2 · 2, ends in 0.5 · 0.25 · 0.375. -->
