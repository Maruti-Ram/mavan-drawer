  <!-- Facets: Facets, refined: the shipped gem (the plain cut) with its facet lines, as Lucide, Nucleo, Font Awesome and Bootstrap draw them. Silhouette and girdle are the shipped paths, verbatim. Rhythm and balance: two crown lines drop from the table to the girdle and split the crown into three facets whose white along the girdle measures 4.36 · 4.29 · 4.36 at 24, 3 · 2.8 · 2.99 at 20 and 2.86 · 2.25 · 2.87 at 16; inside air 2.39 · 3.24 · 2.39, 1.63 · 1.98 · 1.65 and 1.56 · 1.72 · 1.57. The lines start just inside the table (at x 8.25 · 7.25 · 5.75, where its corners begin at 7.5 · 6.25 · 4.625) and lean in at 78° to the girdle (x 9.25 · 8 · 6.375). Started at the table corners, as last round's W was, the side facets close to 1.23 of air at 20 and 1.12 at 16, which is why the W was lost there. So the crown cue now holds at all three masters; in real pixels at 16 the crown reads as three small cells. At 24 the lines carry on as pavilion lines toward the tip (76°, ending at 10.5 · 13.5 and 13.5 · 13.5): white under the girdle 4.77 · 3.57 · 4.77, the two ends 1.5 apart and 1.8 from the sides. At 20 and 16 a pavilion line closes to 1.5 against the side within 2.1 and 2.7 units, a tick, so it is dropped there. Filled: the solid stone with the crown's three cells cut out of it at every master, each the outline's own white (the cell inset by half the stroke), so the lines between them stay at the outline weight (1.51 · 1.51 · 1.26 of material) and the cells keep their air: 2.39 · 3.24 · 2.39, 1.63 · 1.98 · 1.65 and 1.56 · 1.72 · 1.57. Corners at C1's floor, 0.75 · 0.5 · 0.375; the outer cells' tips at 24 and 20 round as one corner, because the table edge left there is shorter than its two corners. The pavilion is solid, with no cuts: the pavilion lines live in the outline only. So the filled crown reads as three facets, and the filled twin differs from the shipped gem-filled at every master. Angles: sides 51.6 · 51.2 · 50.6° (the shipped gem's), facet lines 76–78°, an angle exception like the gem's own. -->
