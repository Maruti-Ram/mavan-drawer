  <!-- Exploded: What the eye sees: the slice lifted clear of the pie, up and to the right — the most explicit pie of the ten. To open a real gap the slice has to travel 4.24 · 4.24 · 3.89 along the diagonal; that is what 1.5 of white costs on a 45, and the canvas pays for it. The pie shrinks to ⌀17 · 13 · 11.25 against the usual ⌀20 · 16 · 14, and the whole drawing sits off centre (pie down-left by 1.5 · 1.5 · 1.375, slice up-right by the same) so the ink box still centres on the canvas. THE CUT: 1.5 exactly, in both styles, at every master. The trade: it says pie chart loudest and it is the smallest pie here; at 16 the whole pie is 11.25 across and the slice is a quarter of that. -->
