  <!-- Split arrow: Rhythm: the two heads stand 1.5 apart at every master (legs 6.75 · 4.75 · 4, bend 0.75 · 0.75 · 0.625, filled 1.25 · 1 · 1 — arrow-up-left's corner head); the right lane stops 1.54 · 1.54 · 1.53 short of the left one (filled 1.54 · 1.54 · 1.55), merge's own rule. The left lane turns off the stem on merge's bend, R 2.5 · 2 · 1.75, so the stem meets the two 45° lanes at the canvas centre. Ink 18×18 · 14×14 · 12×12, a mark, box-centred; filled ends pulled in 0.5 · 0.25 · 0.375 so the box is the same. Off-grid decimals are the bend's tangent points (13.04, 11.27…) and the lane's 45° stop (14.06, 9.94…). Who uses it: Lucide split, Material call_split, Tabler arrows-split, Phosphor ArrowsSplit. It is merge's exact opposite (one lane in, two heads out, top corners) — told apart from merge by its two corner heads, but it is also the picture a later `split` icon (ranked, Arrows & Direction) would want. -->
