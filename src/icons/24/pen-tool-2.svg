<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: pen tool, pen, nib, holder, up-left, cursor hotspot, lucide -->
  <!-- Holder nib, tip up-left: Rhythm and balance: C's drawing exactly, turned a quarter so the tip points up-left, where a cursor's hotspot is — Lucide's own pen-tool orientation — instead of down-left (Figma, Illustrator, Font Awesome, Phosphor and every shipped pencil). Ink 18×18 · 14×14 · 12×12 on whole pixels, box-centred; mass 0.54 · 0.41 · 0.35 toward the tip in the outline ((−0.38, −0.39) · (−0.29, −0.29) · (−0.25, −0.25)), 0.49 · 0.44 · 0.47 filled. Tightest air as C: hole to wall 3.05 · 1.71 at 24 and 20; the slit's cap 2.16 at 16, where like C it carries no hole. One pen for C, D and E. Nib: straight sides from a 57.2° tip (radius 0.75 · 0.75 · 0.625, C10) to shoulders 0.66 L along and 0.36 L out (radius 0.3 L), the sides closing to 0.36 L where they run into the holder; the slit from the tip arc's apex to 0.6 L. Holder: a solid pill across the nib's back — a closed path no deeper than its stroke, as calculator's keys are drawn, so it is solid in both styles — 3 · 3 · 2.5 deep, round-ended, standing 1 · 0.875 · 0.75 past the nib each side; it replaces round 1's hollow holder, whose 1.5 of white read as a 1-px hairline at 16. Breather hole: a solid dot ⌀3 · 3 at 0.6 L, level with the shoulders, on C and E at 24 and 20 only; at 16 the hole and the slit filled the nib's middle (its 1.53 of air ran on a 45° diagonal, so no whole white pixel survived round it), so 16 keeps the slit alone, its cap 2.16 off the walls. D's smaller nib carries no hole at any master (at 24 it would keep 1.33). Filled: the nib solid to the outline's outer edge, cut straight across a literal 1.5 before the pill (the white band, pencil-filled's ferrule), its two cut corners round 0.75 · 0.5 · 0.375; the slit cut as white a literal 1.5 wide (C22), with the hole white (⌀3) wherever the outline has it; the pill the same solid as in the outline. Ink boxes equal. Beside pencil and pen-sparkle, C keeps the writing tools pointing one way; this one makes pen-tool the odd one out, which is the point if it should read as a cursor-like tool -->
