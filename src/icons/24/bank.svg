<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: temple, columns, pediment, landmark, finance, lucide, sf symbols -->
  <!-- Temple, columns on the base: E1's pediment and pitch, but the columns stand on the base line instead of floating over it; the 1.5 of air stays only under the pediment, so the roof still reads as its own part (SF Symbols and Lucide free both ends; Polaris and Central join both, as A did). It answers E's weak point at 16: the columns gain the air and the base's half-stroke they gave up, 9 · 6.25 · 5 tall on the ink against E1's 7.5 · 4.75 · 3.5 (+20 · +32 · +43%), so at 16 they are 5 of the 12 — columns, not dashes. Pitch 4 · 3 · 2.75 (air 2.5 · 1.5 · 1.5), base 2.25 · 1.75 · 1.25 past the outer columns, so it reads as a step the colonnade stands on. Pediment as E1: rounded apex r1.5 · 1.25 · 1, roof at 29.8° · 28.7° · 30.5°, white inside 2.89 · 1.70 · 1.68. Same outer-column greying at 16 as E1. Filled: pediment solid, columns and base lines at 1.5 · 1.5 · 1.25. (recommended) — the only temple whose columns hold their height at 16, at the cost of one of E's three separate parts -->
  <path d="M3.75 8.25L11.25 3.95A1.5 1.5 0 0 1 12 3.75A1.5 1.5 0 0 1 12.75 3.95L20.25 8.25Z"/>
  <path d="M6 11.25V20.25"/>
  <path d="M10 11.25V20.25"/>
  <path d="M14 11.25V20.25"/>
  <path d="M18 11.25V20.25"/>
  <path d="M3.75 20.25H20.25"/>
</svg>
