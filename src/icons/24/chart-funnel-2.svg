  <!-- Tapered bands: (recommended) The classic funnel chart, Polaris ChartFunnel's construction: one tapered funnel cut into three bands by two walls. The sides run straight from rim to foot at about one across for three down - run x rise 4.71 x 14.01 · 3.47 x 10.34 · 2.98 x 9.01, 18.6 · 18.6 · 18.3 degrees from upright (Polaris: 3.06 x 8.5, 19.8 degrees) - an angle exception that needs Maruti's ruling. Rim corners at filter's detail radius 1.5 · 1.25 · 1 on circles centred 5.25,5.25 · 5,5 · 3.625,3.625 (so the ink box lands exactly on the keyline); foot corners at the mark bend 0.75 · 0.75 · 0.625 centred 9.25,19.5 · 8,15.5 · 6.25,12.75. Each side is the tangent between those two circles, so its ends and the walls' ends fall off the grid (rounded to 2 · 2 · 3 dp); the walls sit on A's rows (table's) and end on the side's centreline so they join it. Bands 4/4/4 · 2.75/2.5/2.75 · 2.5/2/2.5 clear tall; the foot band is 5.5 · 4 · 3.5 across at its narrowest. Tightest air at 16: 2 outline (middle band), 1.5 filled (the cuts). Ink 18x18 · 14x14 · 12x12, filled identical. Filled: three solid bands on the outline's outer edge split by A's 1.5 cuts; rim corners 2.25 · 2 · 1.625 (filter-filled's), foot 1.5 · 1.5 · 1.25, cut corners 0.5. Against filter: no stem and no shoulders - one straight taper from rim to foot, plus two walls; filter's sides are 45 degrees and stop at a 4.5-wide stem. Against filter-2: the stages are held in one funnel by the sides, in both styles. Against trash, the other tapered body: trash tapers 4 degrees at 16 and wears a lid and handle. Recommended because at 16 it is the one candidate that reads as a funnel chart in both styles without borrowing filter's stem or filter-2's stack; the price is the angle ruling -->
