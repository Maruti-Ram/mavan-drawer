<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: clasp, cuffs, deal, agreement, partner, lucide, nucleo -->
  <!-- box: 20x14 -->
  <!-- Clasp between cuffs: Two hands clasped side-on between two cuffs: the canonical handshake (Lucide handshake, Nucleo handshake, Font Awesome handshake-simple). The construction follows Nucleo. The right hand's back rises 45° from its cuff to a flat top (centreline y 5.75 · 4.75 · 3.625, so the ink top is 5 · 4 · 3) and then runs straight down-left into the thumb. The left hand's knuckles sit 0.75 · 0.75 · 0.625 lower and drop at a right angle onto the thumb line, so the right hand reads as the one on top. The thumb is built like the hand's fingers: pitch 3, tip r 1.5, 3.25 · 2 · 1.75 long. It turns back through a knuckle r 1 · 0.75 · 0.75 into a 45° line that marks the left hand's wrapped fingers and ends square on the bottom contour. The cuffs are Nucleo's open brackets (vertical at x 5 · 4 · 2.375, corner r 1 · 0.75 · 0.625), so a cuff never closes a counter under 1.5. Tightest air: 1.64 · 1.65 · 1.64, the thumb tip to the left cuff. Agreed box 20×14 · 16×12 · 14×10, centred. Filled: the cuffs are solid bars (2.25 · 2.5 · 2 wide) cut from the hands by a 1.5 white line. Every line inside the hands becomes a 1.5 white line centred on the outline's line, so the thumb shows as a white hook. The white line behind the thumb opens 1.5 past the left knuckles' outer edge, so the knuckles tuck under the thumb. At 20 and 16 the white line under the palm runs out through the cuff's white line (there is no room for its own exit). Filled box = outline box. (recommended) It is the only picture that says agreement and nothing else, and its outline holds at 16. Look closely at the filled style at 16: it reads cuff, block, cuff (I◩I) more than two hands. -->
  <path d="M2.75 7.75L4 7.75A1 1 0 0 1 5 8.75L5 15.25A1 1 0 0 1 4 16.25L2.75 16.25"/>
  <path d="M21.25 7.75L20 7.75A1 1 0 0 0 19 8.75L19 15.25A1 1 0 0 0 20 16.25L21.25 16.25"/>
  <path d="M5 8.75L6.81 6.94A1.5 1.5 0 0 1 7.87 6.5L8.48 6.5A1.25 1.25 0 0 1 9.37 6.87L10.88 8.38"/>
  <path d="M19 8.75L16.59 6.34A2 2 0 0 0 15.17 5.75L14.12 5.75A1.5 1.5 0 0 0 13.06 6.19L8.58 10.67A1.5 1.5 0 0 0 8.14 11.73A1.5 1.5 0 0 0 9.64 13.23A1.5 1.5 0 0 0 10.7 12.79L10.7 12.79A1 1 0 0 1 11.41 12.5A1 1 0 0 1 12.11 12.79L16.03 16.71"/>
