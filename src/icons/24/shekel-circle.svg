  <!-- Outer legs short at 20 and 16, sign taller: At 24 the same drawing as A (10.5×10, everything 1.5). At 20 and 16 the left leg stops 0.5 above the bottom bar and the right leg 0.5 below the top bar: those two leg ends are what touch the ring first, so pulling them in lets the sign stand 9×8 · 8×6.75 (A: 9×7 · 8×5.75) — as tall as the € at 20, and the inner legs overlap 1.5 · 1 instead of 0.5 · 0.25, so the four uprights still read side by side. The ring air is 1.09 · 1.02 (now set by the top-left corner), the white between the uprights 1, gap 1 noted in both files at 20 and 16. Pitch 2.5 · 2.25, hooks 2 · 1.875; at 16 the pitch of 2.25 puts the inner legs on 6.875 / 9.125 and the outer on 4.625 / 11.375 — even pitch kept over whole-pixel edges. Filled: one disc with the ₪ cut out of it, white 1.5 · 1.5 · 1.25, disc left between cuts 1.5 · 1 · 1; at 16 it reads grey. Recommended over A because A at 16 reads as a spiral; neither is a clean 16. (recommended) -->
  <path d="M2.75 12A9.25 9.25 0 1 0 21.25 12A9.25 9.25 0 1 0 2.75 12Z"/>
