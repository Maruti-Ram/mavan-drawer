  <!-- Erase-left key ⌫: Rhythm and balance: the x sits with even air on every side of it in the plate's body, so the point reads as the plate's direction and not as a weight pulling the x, and it holds the same share of the body at all three masters. Air from the x to the plate, top/bottom · right wall · the point's slope (measured square to it): 2.25 · 3.25 · 3.36 at 24, 1.75 · 2.25 · 2.22 at 20, 1.5 · 2.25 · 2.14 at 16 — the sides match within 0.11. The x stands 0.81 · 0.87 · 0.73 left of the centre of the plate's square part (shoulder corner to right wall), between that centre and the canvas centre; Lucide and Polaris also sit their x left of the body's centre, toward the point. Plate: our `label` mirrored, unchanged — ink 20×14 · 16×12 · 14×10 (24 declares box 20x14, as label; 20 and 16 sit on the landscape keyline), point 90° with 45° slopes, tip and shoulders r 1.5 · 1.25 · 1, square corners r 2.5 · 2 · 1.5. x: our diagonals at 45°, centreline 5 · 4 · 3.25 across, ink 6.5 · 5.5 · 4.5 — 0.59 · 0.61 · 0.60 of the plate's inside height (11 · 9 · 7.5). Grown after review: at 16 the earlier 4-px x smudged to a grey dot at 1×; it now stands 4.5 px with exactly 1.5 above and below, and 24 and 20 took the same step so the share stays even. Filled: the plate solid (label-filled mirrored) with the x cut out at x-circle-filled's weight, 2 · 1.75 · 1.75, tips reaching half the added weight further; white x 7 · 5.75 · 5 across, 3 · 2.25 · 1.5 of plate between neighbouring white tips, 2.5 of plate above and below the white at 16. Tight at 16: 1.5 of air above and below the x in the outline, and 1.5 of plate between the white tips in the filled — both at the floor, none under. (recommended: it is the backspace icon in every set and on every phone keyboard, it is our label turned round so the family already exists, and it is the only one that cannot be read as "go back".) -->
