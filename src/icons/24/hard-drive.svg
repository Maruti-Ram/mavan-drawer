<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: storage, disk, hdd, drive, perspective, lid -->
  <!-- box: 20x16 -->
  <!-- Perspective drive: Rhythm: lid against band is one proportion at every master — lid 7 · 6 · 5 over band 7.5 · 6.5 · 5.75 on the centrelines (0.93 · 0.92 · 0.87); the lights keep one air all round — to the divider, the floor, each other and the right wall — 2 at 24, 1.5 at 20 and 16 (the band cannot grow at 20 and 16: 6.5 · 5.75 is the least that holds the light with 1.5 each side); lights ⌀2 · 2 · 1.5 (calculator's dots), pitch 4 · 3.5 · 3. Ink 20×16 · 16×14 · 14×12, box-centred (the 20 and 16 boxes are radio's and desktop's). Body the full width, bottom corners r2.5 · 2 · 1.5 (container), lid corners r1.5 · 1.25 · 1 (detail radius). The lid's sides run at 2 down for 1 across (63.4°) at every master, so the top edge is 62 · 59 · 61% of the body — an angle off 0/45/90 on purpose, as radio's strap: a 45° lid (Material's) is too shallow to read as a lid at 16. The divider meets the walls where the lid starts, joined sharp under round joins (save's chamfer). Off-grid values are the lid corners' tangent points. Filled: lid and band are two solids with a 1.5 cut where the divider was (archive's), cut corners eased 0.5; lights white holes ⌀2 · 2 · 1.5 with 2 · 1.5 · 1.5 of material to the cut. Who: Lucide hard-drive, Nucleo hard-drive, Iconoir hard-drive, Fluent HardDrive, Boxicons hdd, Remix hard-drive-3, Material hard_drive (45° version). (recommended) — it is the hard drive most sets draw, and the sloped lid is what tells it apart from a keyboard, a server unit or any other box, even at 16. -->
