  <!-- Nib with holder: Rhythm and balance: nib and holder on the canvas diagonal, tip bottom-left, ink 18×18 · 14×14 · 12×12 on whole pixels (3→21 · 3→17 · 2→14), box-centred, square keyline. The solid holder now weighs against the tip: mass 0.54 · 0.42 · 0.34 toward the tip in the outline ((−0.38, +0.39) · (−0.30, +0.30) · (−0.24, +0.24); round 1's hollow holder left 0.77 · 0.57 · 0.52), 0.49 · 0.44 · 0.48 filled. Tightest air: hole to wall 3.05 · 1.71 at 24 and 20; at 16 the slit's cap to the walls 2.16. In real pixels at 16 the nib now keeps 19 fully white pixels inside it, against 14 with the hole, and white shows on both sides of the slit. Who: Lucide pen-tool, Nucleo pen-nib. One pen for C, D and E. Nib: straight sides from a 57.2° tip (radius 0.75 · 0.75 · 0.625, C10) to shoulders 0.66 L along and 0.36 L out (radius 0.3 L), the sides closing to 0.36 L where they run into the holder; the slit from the tip arc's apex to 0.6 L. Holder: a solid pill across the nib's back — a closed path no deeper than its stroke, as calculator's keys are drawn, so it is solid in both styles — 3 · 3 · 2.5 deep, round-ended, standing 1 · 0.875 · 0.75 past the nib each side; it replaces round 1's hollow holder, whose 1.5 of white read as a 1-px hairline at 16. Breather hole: a solid dot ⌀3 · 3 at 0.6 L, level with the shoulders, on C and E at 24 and 20 only; at 16 the hole and the slit filled the nib's middle (its 1.53 of air ran on a 45° diagonal, so no whole white pixel survived round it), so 16 keeps the slit alone, its cap 2.16 off the walls. D's smaller nib carries no hole at any master (at 24 it would keep 1.33). Here the nib is 18.47 · 13.78 · 11.86 long, its open back 6.65 · 4.96 · 4.27 wide, the pill 10.15 · 8.21 · 7.02 long; the slit runs 10.26 · 7.45 · 6.44 from the apex (into the hole at 24 and 20, ending in a round cap at 16). Filled: the nib solid to the outline's outer edge, cut straight across a literal 1.5 before the pill (the white band, pencil-filled's ferrule), its two cut corners round 0.75 · 0.5 · 0.375; the slit cut as white a literal 1.5 wide (C22), with the hole white (⌀3) wherever the outline has it; the pill the same solid as in the outline. Ink boxes equal. At 16 beside pencil, quill, highlighter and map-pin it reads as a pen nib at a glance: the solid bar says holder, the slit says nib, and no shipped icon shares the silhouette (recommended) -->
