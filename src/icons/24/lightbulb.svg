  <!-- Straight taper: Portrait keyline, ink exactly 16x20 · 12x16 · 10x14, box-centred. Globe r7.25 · 5.25 · 4.375 (map-pin's head circle). Straight sides run as tangents from the globe to the neck corners (C10 bend 0.75 · 0.75 · 0.625), closed by a flat bottom; neck ink 8 · 6 · 6 wide. Sides lean 36.9 · 36.9 · 25.8 degrees from upright - a consequence of circle + corner, as map-pin's are; 16 is steeper because its neck is 6 of 10 (a 5-wide neck puts both edges on half pixels). One base line (ink 8 · 6 · 6, microphone-2's base at 24 and 20) 1.5 below the bottom edge. Filled: one solid, radii grown by half a stroke (globe 8 · 6 · 5, corners 1.5 · 1.5 · 1.25); the base line stays a line, 1.5 below the fill. Off-grid decimals: tangent and touch points sit where the tangent lands (computed, rounded to 2 dp · 2 dp · 3 dp); every centre, radius, extreme and line end is on the grid (16 on x.375/x.625, so outer edges land on whole pixels). -->
