  <!-- Asterisks on one line, six arms, kept apart: Bl redrawn so the filled asterisks keep their arms (Bl's filled 16 read as two blobs over a bar, a face). Six arms, not five: three strokes, one upright and two at 30° from level, 60° apart, the asterisk of type; five arms read as a star at 24. The 30° arms are off 0/45/90 and need an angle grant for this icon, as gear's 60°. Off-grid numbers are only the 30° arm ends and the traced shape's notch points. Tip air between neighbouring arms is the arm length less the stroke, so the asterisk is as big as two can be at 16: arms 3.75 · 3 · 2.75 from the centre, ink 8×9 · 6.7×7.5 · 6.01×6.75, tip air 2.25 · 1.5 · 1.5 between every pair of neighbouring arms, §6's floor, in both styles. Pitch 10 · 8.5 · 7.75, gap 2 · 1.8 · 1.74. The line spans the two asterisks (18 · 15 · 13.75 long, snapped a hair inside their ink), air 2 · 1.75 · 1.875 below them. Ink 18×12.5 · 15.2×10.75 · 13.76×9.88 (declared box), centre 12,11.75 · 10,10.13 · 8,8.06; the line's bottom or top edge on a whole pixel. Tightest air at 16: 1.5, arm tip to arm tip and asterisk to filled bar. Filled: the asterisks do not get heavier. Each is drawn as a filled shape that traces the outline asterisk's own ink (arms 1.5 · 1.5 · 1.25 wide, round ends, the notches between them), so its shape and its tip air are the outline's. Lint does not measure the notches (their walls meet at 60°, not square-on), in either style: the tip air here is measured from the drawing, not by lint. The line becomes a solid bar 2.5 · 2 · 2 tall on the same centreline with the same round ends; it stands 0.5 · 0.25 · 0.375 below the outline (declared grows) and keeps 1.5 of air to the asterisks. This is the asterisk at the outline weight in the filled twin (Bk and Ck's idea) reached through the ordinary shape-filled path, so no new glyph kind; it is still that decision, and Maruti should know it. Face: at 16 the two large six-spoked asterisks read as asterisks on an underline, not as eyes over a mouth (in real pixels each is a 6-pixel spoked star; Bl's were 4-pixel blots). Risk: large, the two asterisks fill 13.8 of the 14 live units at 16 (recommended) -->
