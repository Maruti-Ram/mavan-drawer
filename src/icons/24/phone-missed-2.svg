  <!-- Bounce arrow in the corner box: Bounce arrow in the handset's empty corner — Material/Android's missed-call picture (phone_missed): the call comes in from the box's top-right corner, where incoming's arrow starts, drops toward the handset and bounces back up-left into the head. Phone's handset verbatim and in place at every master, both styles, with nothing cut. The head is phone-incoming's (arrow-down-left's turned-classic head: legs 4.5 · 4 · 3.5 on 0° and 90°, C10 bend 0.75 · 0.75 · 0.625) reflected to the box's top-left corner (12.75,2.75 · 11.25,2.75 · 9.625,1.625), so it points up-left. The shaft leaves the head's corner set back 0.22 · 0.22 · 0.183 on each axis (r(1 − 1/√2), the kit's number, which lands its cap on the head's outer corner), runs down at 45° into a C10 bend (0.75 · 0.75 · 0.625, chevron-down's) and back up at 45° to the box's right line (21.25 · 17.25 · 14.375), so its cap meets the margin edge. The bend's corner sits 4.5 · 4.25 · 3.625 below and right of the head's corner (17.25,7.25 · 15.5,7 · 13.25,5.25), the least that keeps the head's top leg 1.5 clear of the rising arm; the rising arm then climbs back 4 · 1.75 · 1.125 of it. So the bounce is nearly level at 24 (89%) but only 41% and 31% at 20 and 16, where it reads as an up-left arrow with a kick at its tail: a level V needs 7.78 · 7.07 of centreline width beside even the shortest head C37 allows, and the family's box gives 6 · 4.75. Arrow ink 10×6 · 7.5×5.5 · 6×4.75 at 12,2 · 10.5,2 · 9,1, top-aligned to the margin edge as forwarded's; composite 19×19 · 15×15 · 13×13, declared as box, centre 0.5 right and 0.5 up, as the family. Tightest air to the handset, measured: 1.5 · 1.5 · 1.75, outline and filled — the head's side leg to the top-left head's right side, incoming's figure (at 16 the leg sits on x 9.625 so its outer edge lands on pixel 9). Head air (C37, each leg's cap to its own shaft) 1.68 · 1.33 · 1.23, incoming's exactly; the top leg's cap to the rising arm 1.68 · 1.70 · 1.55 against §6's 1.5 — lint reads the head and the V as joined and measures only C37's 1 there, so this one is held by hand. Filled: phone-filled verbatim; the arrow stays a line at 1.5 · 1.5 · 1.25, as the family's. Off the grid besides phone's own: the shaft's set-back start (12.97 2.97 · 11.47 2.97 · 9.808 1.808) and the bend's tangent points, r/√2 from the corner on the 45° arms (16.72 6.72, 17.78 6.72 · 14.97 6.47, 16.03 6.47 · 12.808 4.808, 13.692 4.808), as chevron-down's 11.47 / 12.53. The head goes top-left because its mirror, head top-right, is Android's call_missed_outgoing — a missed outgoing call. -->
