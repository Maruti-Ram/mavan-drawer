  <!-- Big slash to the square, wide: What the eye sees: the wide clipboard cut as the others, the big slash running corner to corner of the board, flush with it on every side. The clip loses its lower-left quarter: at 24 it keeps 52° of its upper-left corner, the top, the right side and 2.25 of its floor; at 20 and 16 only the top and right side, reading as a tab, as on clipboard-off. The icon keeps clipboard-3's box. At 16 it reads more as a struck square with a nub than a clipboard (the clip keeps 46%), while A1, B1 and D1 read as struck clipboards in both styles. Bar (C21): \ at 45°, its ink the square keyline 18 · 14 · 12 (Maruti, 2026-10-25: every -off bar spans the square keyline), centreline (3.75,3.75)-(20.25,20.25) · (3.75,3.75)-(16.25,16.25) · (2.625,2.625)-(13.375,13.375), 23.33 · 17.68 · 15.2 long, centred on the clipboard's ink centre 12,12 · 10,10 · 8,8, the same bar through all four. Cut: every stroke stops with 1.5 of air from the bar's edge, measured 1.505 · 1.505 · 1.501 at every cut end; round caps. The board's top-left stub is cut away whole. Kept (24 · 20 · 16): the upper-right piece 14.18 · 9.39 · 8.22; the lower-left piece 23.43 · 15.64 · 13.08; the clip 13.82 · 8.36 · 7.04 of 20.42 · 15.85 · 15.28 (68 · 53 · 46%), at 16 from 6° of its upper-left corner to 49° of the lower-right. Board kept 73 · 66 · 63%. Removed: the board's upper-left and lower-right corners and the clip's lower-left quarter. Ink 18×18 · 14×14 · 12×12, centred, the square keyline. Filled: a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side) knocked out of the solid board, corners r0.75 · 0.75 · 0.625 about the outline's cut ends, white 1.506 · 1.506 · 1.501 each side; two solids, the board's upper right with the clip's floor and its lower left. The channel already crosses the clip window at every master (0.53 · 0.98 · 1.62 into it), so the window opens into the channel where the outline's clip opens. The clip stays a line at the outline weight, cut as in the outline; the bar runs whole at 1.5 · 1.5 · 1.25. Off-grid decimals are the cut ends and the channel's corners, where the circles put them. (recommended) -->
