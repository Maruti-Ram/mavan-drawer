  <!-- Wired earbuds: Rhythm: two bud rings of 7.5 · 6 · 5 ink with 3 · 2 · 2 between them; each cable drops from its ring, turns 45° (fillet 1.5 · 1.25 · 1) and the two meet in a Y on the centre line, tail 3.25 · 2.75 · 2; box-centred on the square keyline, symmetric. Wired earbuds, as Nucleo's wired-headphones and stock earphone icons draw them; no system set ships it as headphones. Off-grid decimals: the fillets' tangent points on the 45° runs. Look-alike at 16: a git-fork icon (rings on a Y) if the set ever adds one; merge stays distinct. Filled: rings solid, cables lines -->
