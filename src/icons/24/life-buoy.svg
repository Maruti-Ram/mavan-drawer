  <!-- Two rings, four diagonal straps: What the eye sees first: a fat white ring between two circles, crossed by four short diagonal stubs — the picture every source draws. Container r 9.25 · 7.25 · 6.375 (ban's), inner ring r 5 · 4 · 3.375 (target's middle ring), white band 2.75 · 1.75 · 1.75 between their edges. Straps run centreline to centreline on the diagonals (ban's bar ends 5.46 · 4.87 · 3.493 to 8.46 · 7.17 · 5.614), so the visible stub is the band's own length: 2.75 · 1.75 · 1.75 at a 1.5 · 1.5 · 1.25 line. At 16 the stub is 1.75 long and 1.25 thick — short, but it is what the band leaves. Filled: the ring solid from the inner ring's inner edge (r 4.25 · 3.25 · 2.75) to the outer edge (r 10 · 8 · 7), the four straps cut white 1.5 wide on the diagonals, through both rims — four fat arcs, a buoy's four stripes in one colour. Hole ⌀ 8.5 · 6.5 · 5.5. Ink box 20 · 16 · 14, filled identical (recommended) -->
