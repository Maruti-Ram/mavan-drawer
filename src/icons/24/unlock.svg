<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: padlock, open, unlocked, keyhole -->
  <!-- Released, right leg out: The shipped lock with its right leg lifted out of the body: the arc runs on from the left leg and stops at its 3 o'clock, the end pointing straight down at the socket it came out of (Lucide lock-open, Feather unlock, Tabler lock-open, Phosphor LockOpen, Untitled lock-unlocked-01 to 03, Central unlocked, Font Awesome unlock). Body, keyhole, left leg and arc are lock's, identical and in place at every master and in the filled twin, so a lock/unlock toggle changes one line: the right leg. Ink box 16x20 · 12x16 · 10x14, centred, exactly lock's. Opening under the free end, end cap to the body's top edge: 3.5 · 2.5 · 2.375 (lock: 0). Shackle air 6.5 · 4.5 · 3.5 wide, as lock. Filled: lock-filled's solid body and keyhole slot, the shackle a line at 1.5 · 1.5 · 1.25, same opening. (recommended: the picture most sets use, and the only one that keeps lock's exact box, so the toggle never shifts anything but the leg) -->
  <path d="M7.25 11.75H16.75A2.5 2.5 0 0 1 19.25 14.25V18.75A2.5 2.5 0 0 1 16.75 21.25H7.25A2.5 2.5 0 0 1 4.75 18.75V14.25A2.5 2.5 0 0 1 7.25 11.75Z"/>
  <path d="M8 11.75V6.75A4 4 0 0 1 16 6.75"/>
  <path d="M12 15.5V17.5"/>
</svg>
