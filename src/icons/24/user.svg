  <!-- Tall dome: A small head over a tall, full half-round body with a flat base - the plainest reading of the tall guide box (16x20 · 12x16 · 10x14, the same box as lock). The head is exactly half the body's width at every size. It is calm but body-heavy: beside C it nears a chess pawn, and at 16 the 5-wide head lands its sides on half pixels, so the ring is soft (2.5 clear inside). Head 8 · 6 · 5 across (50 · 50 · 50% of the body's width), body 16 · 12 · 10 wide × 10.5 · 8.5 · 7.5 tall, gap between head and body 1.5 · 1.5 · 1.5 (filled 1.5 · 1.5 · 1.5). Ink box 16×20 · 12×16 · 10×14, filled box identical. Shoulders are a true half circle, bottom corners 1.5 · 1.25 · 1 (the bend radius lock and archive use). Pairs well: a second dome tucks behind for users; in a ring the base simply disappears. -->
