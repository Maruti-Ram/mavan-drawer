  <path d="M15.75 13A0.25 0.25 0 1 0 16.25 13A0.25 0.25 0 1 0 15.75 13Z"/>
  <path d="M7.75 17A0.25 0.25 0 1 0 8.25 17A0.25 0.25 0 1 0 7.75 17Z"/>
  <path d="M11.75 17A0.25 0.25 0 1 0 12.25 17A0.25 0.25 0 1 0 11.75 17Z"/>
