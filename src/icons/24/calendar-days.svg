<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: days, month, dates, grid -->
  <!-- Day dots: The plain calendar verbatim and in place (frame, pegs, header line, radii), with the days as a centred field of small dots on the page under the header, every gap between dots the same. Dot: select-2's dotted-line dot, a closed two-arc circle of r 0.25 · 0.25 · 0.125 under the stroke, ink ⌀2 · 2 · 1.5. Not list-bullet's ⌀1.75 at 16: the page there is 4.5 tall, and 1.75 leaves 1.375 above and below, under the 1.5 floor; 1.5 leaves exactly 1.5 (the size calendar-3 already uses at 16). Count, set by the space (1.5 of air to the walls, the header line and the bottom): 24 holds 2 rows × 3 (a third row needs 12 against 9, a fourth column 15.5 against 15); 20 holds 1 × 2 (two rows need 8.5 against 6, three across 12 against 11 — and ⌀2 is already the smallest two-arc dot on the 20 grid, r 0.25, since ⌀1.5 would need r 0 under the 1.5 stroke); 16 holds 1 × 2 (two rows need 7.5 against 4.5, three across 10.5 against 9.5). A row and a column drop rather than squeezing the air. Rhythm: pitch 4 · 4 · 3.5 both ways, air between dots 2 · 2 · 2 (select-2's). 24: centres x 8 / 12 / 16, y 13 / 17; air 2.5 to each wall, 1.5 to the header line and the bottom. 20: centres x 8 / 12, y 12.5; air 2.5 to each wall, 2 above and below. 16: centres x 6.25 / 9.75, y 10.5 (the 6.25 / 9.75 are the 3.5 pitch centred on 8); air 2.25 to each wall, 1.5 above and below. Crispness given up for the even gaps and centring: at 16 each dot spreads over two pixels across (ink 5.5–7, 9–10.5; one dark pixel each would need centres 6.5 / 9.5, air 1.5 instead of 2); at 20 the centred row (ink y 11.5–13.5) spreads over three pixel rows (y 12 or 13 would sit 0.5 off centre). Differs from calendar-3 (one ⌀3 · 3 · 1.5 today dot low on the right): here the dots are smaller, centred, and many. At 16 the two share the dot size and row (y 10.5), and differ by two dots centred against one at the right. Filled: calendar-filled verbatim (header and page split by the 1.5 cut), each day a round hole in the page the size of the outline dot (⌀2 · 2 · 1.5), as calendar-3-filled does; pegs stay lines. Material between holes 2 · 2 · 2; from the cut to the top holes 1.5 · 2 · 1.25 (at 16 calendar-3-filled's accepted 1.25, the line weight). -->
  <path d="M6.25 5.75H17.75A2.5 2.5 0 0 1 20.25 8.25V17.75A2.5 2.5 0 0 1 17.75 20.25H6.25A2.5 2.5 0 0 1 3.75 17.75V8.25A2.5 2.5 0 0 1 6.25 5.75Z"/>
