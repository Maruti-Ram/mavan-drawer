  <!-- Flat ring, one head: The flat ring with one head: Material Symbols 360 without its numerals, Material Design Icons rotate-360, Tabler view-360-arrow, Central rotate-360 — the turn seen from the side. Rhythm and balance: an ellipse 16.5 · 12.5 · 10.75 wide on the centreline (ink 18 · 14 · 12, the mark ceiling), 9.5 · 8 · 7.5 tall (0.58 · 0.64 · 0.7 of its width — rounder at the smaller masters because the head's inner leg needs that much room inside the ring), turning counter-clockwise as rotation does: from the lower right over the back, down the left and along the front to a straight run under the middle and a head pointing right. The head is refresh-2's (external-link's) size at 24 and 20, legs 6 · 5.25. At 16 no shipped head fits, so it is 4.375: C37's 1 in the filled twin needs legs of about 4.25 or more on this ring (rotate-ccw's 4 measures 0.82 here, and rotate-ccw-filled's own head 0.67), while the 12 mark box and 1.5 of air from the filled inner leg to the ring's far side cap it between 4.5 (1.51 of air, 11.93 tall) and 4.625 (1.41, 12.02 tall, over the box) — so refresh-2's 4.75 does not fit either; 4.375 is the first eighth that clears both (filled counter 1.06, 1.61 to the far side, 11.84 tall). The run is long enough that both legs sit over straight shaft. Head counter 2.72 · 2.17 · 1.83 (filled 1.69 · 1.66 · 1.06, above C37's 1 in both styles); opening from the head to the ring's start 2.15 · 2.08 · 2.15 (filled 1.88 · 1.94 · 1.62). Ink 18×15.24 · 14×13.21 · 12×11.84, centred 12,11.87 · 10,9.86 · 8,7.92. Filled: line-heavy, weight 2.5 · 2 · 2, the ellipse pulled in by half the added weight so its outer edge stays; the run rises with it, so the head keeps its legs and its ink; the ring starts a little further round to keep the opening. No shipped icon draws it: rotate-ccw and rotation are rings seen face-on, orbit is a ring with a planet; why recommended: it is the most familiar picture of the full turn — Material’s 360 control in Google Photos and Maps, with its numerals left out as Maruti asked — and the only one of the familiar pictures whose head keeps C37’s 1 of air in both styles at every master (recommended) -->
