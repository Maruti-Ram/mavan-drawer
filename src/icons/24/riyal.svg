  <!-- Official sign, tight heels: The Saudi riyal sign SAMA introduced in February 2025 (U+20C1), measured from SF Pro’s U+20C1 (the system font carries it in nine widths and weights; no reference set in research/references has a riyal). Two upright stems, the left one turning at its foot into a tail running down-left, the right one turning into a bar running up-right; a long bar crossing both stems; a short detached bar under the right stem. Every bar and the tail rise at SF’s slope, 0.19 (10.76°). Ink 14×16 · 12×13 · 11.5×12, mark keyline, cap height 16 · 13 · 12 as the €. SF’s width is 0.876 of its height: 24 matches it (0.875); 20 and 16 run wider (0.92, 0.96) because the filled weight 2 needs the stems 3.5 apart and each bar end 2.75 past its stem to keep 1.5 at the crossings. Bars 4.08 · 3.57 · 3.57 apart, which is 4 · 3.5 · 3.5 measured square to the slant (the €’s and ¥’s bar spacing). Air between bars 2.51 · 2.01 · 2.26 outline, 1.51 at every master filled. Stems 4 · 3.5 · 3.5 apart: 2.5 · 2 · 2.25 of air outline, 1.5 filled. Air at the crossing tips, filled: 1.72 · 1.57 · 1.57. The right stem stops 0.5 · 0.5 · 0 lower than the left (SF 0.47 at 24; level at 16 to keep that tip air). The tail reaches 1 · 1 · 0.5 past the long bar. Placement: the stems are the body, so their midpoint sits on the canvas centre and the tail and bars hang outside it: optical −0.5 · −0.5 · −0.25 (the stroke mass centre is 0.59 right of the box centre at 24). Filled at 2.5 · 2 · 2 with the ends pulled in, so the ink box is identical. Heels bent at C10’s tightest radius, 0.75 · 0.75 · 0.625 (filled 1.25 · 1 · 1): the corner SF Pro Rounded draws. Reads as the riyal sign at 16 in both styles. (recommended) -->
  <path d="M10 4.75V16.23A0.75 0.75 0 0 1 9.39 16.97L5.25 17.75"/>
  <path d="M14 5.25V14.26A0.75 0.75 0 0 0 14.89 15L17.75 14.46"/>
  <path d="M6.25 12.56L17.75 10.38"/>
  <path d="M14 19.25L17.75 18.54"/>
