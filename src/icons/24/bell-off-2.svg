  <!-- Bar cut through, dot clapper: What the eye sees: bell-2 cut exactly as bell-off: the dome and the right flare in one piece, a small corner of rim and left wall below the bar, and the dot clapper whole. The icon keeps the bell's box. At 20 and 16 bell-2's body is bell's, so its cut ends, pieces and filled solids are bell-off's to the coordinate. At 24 its rim sits 0.5 higher, so the rim's cut moves to 12.5, and its narrower flare moves the right wall's cut end 0.12 lower and right (18.3,14.05 against 18.18,13.93). Bar (C21): \ at 45°, its ink 16 · 12 · 10 square, centreline (4.75,4.75)-(19.25,19.25) · (4.75,4.75)-(15.25,15.25) · (3.625,3.625)-(12.375,12.375), centred on the bell's ink centre 12,12 · 10,10 · 8,8, 20.51 · 14.85 · 12.37 long; it ends flush with the bell's sides and 2 inside its top and bottom, and at 16 its ink ends on whole pixels (3 and 13). Its ends: the upper left stops 2.11 · 1.20 · 0.77 past the dome's cut tip, with 2.17 · 1.73 · 1.61 of air, as bell-off. The lower right stops 3.49 · 2.15 · 1.57 past the dot, with 3.79 · 3.46 · 3.04 of air to the nearest ink (the right wall at 24, the dot at 20 and 16). The two ends are not evened: the bar's ink fills the bell's width at both ends and is centred on the bell, so neither end can move without growing the box or taking the bar off centre. The difference is the bell's own shape (the dome curls toward the upper end; the clapper sits low and narrow). Evening the air would mean sliding the bar down, away from the bell's mass, which already sits above its box centre. Cut: 1.5 of air from the bar's edge at every cut end, measured 1.505 · 1.505 · 1.501–1.505; at 16 not snapped to pixels, for the reason given on bell-off. Kept: the lower-left piece, rim 7.75 · 4.25 · 3.11 and left wall 6.36 · 3.44 · 2.48 (14.11 · 7.69 · 5.59); the upper-right piece, the dome from 10:37 · 10:50 · 10:49 round to 3:00 (12.61 · 8.71 · 7.11) and the right wall 5.87 · 3.34 · 2.74 (18.48 · 12.05 · 9.85); the dot whole, 3.76 · 2.77 · 2.62 of air to the bar. The lower-left piece is 0.76 · 0.64 · 0.57 of the upper-right's length, its shortest leg 2.48 at 16, kept as on bell-off. Removed: the dome's upper left (7.05 · 7.07 · 6.52) and the lower-right corner with the rim's right end (9.61 · 9.57 · 8.79); 66 · 54 · 50% survives. Balance: mass −0.16,−0.26 · −0.09,−0.47 · −0.06,−0.56 from the canvas centre (bell-2 alone 0,−0.14 · 0,−0.43 · 0,−0.54). Ink 16×20 · 12×16 · 10×14, centred, the portrait keyline. Filled: a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side) knocked out of the solid bell. Its corners round at r0.75 · 0.75 · 0.625 about the outline's cut ends, so each solid's tip is the outline's cap; white 1.506 · 1.506 · 1.501 each side. Two solids; the rim-and-wall wedge is 0.57 · 0.46 · 0.40 of the dome's area. The dot stays as drawn, 2.62 from the bar at 16. The bar runs whole through the channel at 1.5 · 1.5 · 1.25. The dome arc is written in two parts through its top so the rounded cut end cannot tilt it. Off-grid decimals are the cut ends and the channel's corners, where the circles put them. (recommended) -->
