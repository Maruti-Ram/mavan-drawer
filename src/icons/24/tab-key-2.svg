<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: tab, key, keycap, keyboard -->
  <!-- Tab on a key cap, taller bar: Rhythm and balance: tab-key’s proportions carried onto the square key as far as the key allows — the bar stands taller than the head as on tab-key (1.33 · 1.23 · 1.13 × the head; tab-key 1.2 · 1.33 · 1.25), the head is the smallest the rules allow so the shaft gets the room, and the legend has even air on all four sides: 10×10 · 8×8 · 6.5×6.5, air 2.5 · 1.5 · 1.5, the same box as enter B2 at 24 and 16 (0.5 wider at 20). The bar cannot be as tall as tab-key’s own (12 · 12 · 10): the key’s inside is 15 · 11 · 9.5 and the legend stops 1.5 short of it, at 12 · 8 · 6.5. Head: 45°, legs 3 · 2.5 · 2.25 from the shaft (ink 7.5 · 6.5 · 5.75 tall), head air 1.5 · 1 · 1 (C37: 1 — at 20 and 16 exactly on it); bar ink 10 · 8 · 6.5; 1.5 of air from the tip to the bar. The shaft runs 2.81 · 1.31 · 0.51 clear of the legs (D: 2.56 · 0.81 · 0.13). Box-centred: the mass leans 1.13 · 0.55 · 0.22 toward the bar, as tab-key’s does, and arrows are box-centred in the set. Filled: square-filled’s solid with the arrow and the bar cut 1.5 wide; the cut legs reach 3 · 3 · 2.75 so the solid between a cut leg and the cut shaft is 1.5 · 1.5 · 1.25, and at 16 the cut bar runs 0.25 further at each end (7.25 of white against the white head’s 7) so the bar still stands taller filled; solid between the two cuts 1.5 · 1.5 · 1.25. Result: at 24 it reads as tab and as tab-key’s sibling; at 20 the shaft just shows; at 16 it still reads as chevron-last in a box. What 16 would take: for the shaft to run about 2 clear of the legs (tab-key E read at 2.13) the legend must be 8 wide, 1.5 more than the 6.5 the square key’s 9.5 inside allows with 1.5 of air either side — a key at least 13.5 across at 16, in practice power-square’s 14 key (round-1 E). The wide control-key-left-2 key (14×10 at 16) does not help: its 7.5 of inside height is under the 8.75 the head needs with its air. Every value off the grid is a tangent point of the 45° head (its bend or leg ends) or of a cut-out’s round end. -->
  <path d="M6.25 3.75H17.75A2.5 2.5 0 0 1 20.25 6.25V17.75A2.5 2.5 0 0 1 17.75 20.25H6.25A2.5 2.5 0 0 1 3.75 17.75V6.25A2.5 2.5 0 0 1 6.25 3.75Z"/>
  <path d="M10.56 9L13.03 11.47A0.75 0.75 0 0 1 13.03 12.53L10.56 15"/>
