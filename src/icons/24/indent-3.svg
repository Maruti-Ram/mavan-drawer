  <!-- Arrow: Rhythm: a short arrow in the pocket, its head spanning rows 2 and 3 like B’s chevron and its shaft on the line between them, so it runs along the gap the text moves into; 3 below the full line (3.25 at 16). It points right, into the text. Rows are menu’s and list-bullet’s own (centrelines 7.5/12/16.5 · 5.5/10/14.5 · 3.5/8/12.5, pitch 4.5, air 3 · 3 · 3.25; C17) and the stack is list-bullet’s width (ink 3→21 · 3→17 · 2→14), so it sits on list-bullet’s rows in a toolbar. Top line full, the two lines under it start further in, and the cue sits in the pocket under the top line, centred between rows 2 and 3 (14.25 · 12.25 · 10.25). Box 18×10.5 · 14×10.5 · 12×10.25, centred. Arrow: arrow-right’s construction (45° head, bend 0.75 · 0.75 · 0.625, shaft ending at the bend), head ink 6 · 6 · 5.75 tall, arrow 7.44 · 6.44 · 5.62 long (at 16 about as long as tall). The tip and the shaft end both face the gap between rows, so the two members hold the same air with no offset. It needs width, so the indented lines are the shortest of the five: ink 12→21 · 11.25→17 · 9.25→14 (9 · 5.75 · 4.75 long, 50 · 41 · 40% of the top line). Air, arrow to the indented lines: indent 2.18 · 2.40 · 2.29, outdent 2.30 · 2.50 · 2.41; filled indent 2.02 · 2.31 · 2.15, outdent 2.14 · 2.42 · 2.27. Filled: C17 — the lines thicken in place to 2.5 · 2 · 2, ends pulled in 0.5 · 0.25 · 0.375, row air 2 · 2.5 · 2.5; the stack stands 0.5 · 0.25 · 0.375 proud top and bottom (grows). Filled arrow (review, 2026-10-22: the 5-tall head at bend 1.25 read as a round club): the head is now as tall as B’s chevron and its ends stay on rows 2 and 3 (thicken in place), the tip keeps the outline’s ink, bend 1.25 · 1 · 1, so each straight leg is 1.93 · 2.18 · 2.18 long (was under 1). Mass 0.42 · 0.19 · 0.04 right (outdent 0.05 · −0.14 · −0.29). Tight at 16: the lines are 4.75 px, the shortest text here. Who: SF Symbols (increase.indent / decrease.indent), Fluent (TextIndentIncrease / Decrease) and Microsoft Office — from memory, not in research/. Same construction as outdent C: same lines in the same places, only the cue turned round. -->
