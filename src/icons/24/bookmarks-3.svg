  <!-- A ribbon beside a list: A ribbon beside a list: Nucleo bookmark-list; Edge's Favorites picture with our ribbon in place of its star. bookmark-3's crisp ribbon (no fold band: beside three lines it would read as a fourth), 10x15 · 8x12 · 7x10 (0.67 · 0.67 · 0.70), head r 1.5 · 1.25 · 1, notch half its width deep (4.25 · 3.25 · 2.875). Three lines on one pitch, 4 · 3.25 · 2.75 (air 2.5 · 1.75 · 1.5), with the same air between the ribbon and the lines; lines 6.5 · 5.25 · 4.5 long in ink, two-thirds of the ribbon's width at every master, and the three lines span two-thirds of its height. Ink 19x15 · 15x12 · 13x10 (agreed box), set 0.5 right of centre, the most lint allows, to pull the ribbon toward the middle: the solid ribbon still leans the outline 0.85 · 0.46 · 0.30 left and the filled 2.23 · 1.35 · 1.10 left; a heavy mark beside thin lines is lopsided by nature, as Edge's is. Filled: ribbon solid, lines stay 1.5 · 1.5 · 1.25; 81 px at 16 filled. Distinct from list-bullet (a ribbon, not dots) and from bookmark (the lines). Built on bookmark-3, so by C27's reading it pairs as bookmarks-3. Off-grid decimals are the notch's tangent points. -->
