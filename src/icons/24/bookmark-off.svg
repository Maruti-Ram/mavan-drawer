  <!-- Big slash to the square, lifted 1.25, whole notch: What the eye sees: the folded bookmark struck by the big slash, lifted 1.25 above centre so the whole notch survives. Both tails and the V run in one piece, and the foot reads as a bookmark. The bar runs from past the top-left corner to past the right side, over the right tail's tip. The right tail is short: the V's right edge ending in the tip's rounded end. Above the bar sit the top edge from x 8.25 · 8.25 · 6.765, the right corner, the right side and the fold line's right part. The top-left corner goes. The bar's centre sits 1 above the canvas centre and 0.25 right of it, at 12.25,11 · 10.25,9 · 8.25,7; the 1.25 is the line it sits on. Bar (C21, V1 spec as ruled 2026-10-25, the big slash to the square keyline): \ at 45°, its ink the square keyline 18 · 14 · 12, centreline (4,2.75)-(20.5,19.25) · (4,2.75)-(16.5,15.25) · (2.875,1.625)-(13.625,12.375), on the line through the bookmark's ink centre lifted 1.25 (0.88 square to the bar), slid 0.25 down-right along itself (0.35 along the bar) at every master; the same bar on all three bookmarks, whose ink centres agree. Its ink spans x 3.25–21.25 · 3.25–17.25 · 2.25–14.25, y 2–20 · 2–16 · 1–13, inside the margin edge. OUTSIDE C21's centred bar, the spec's offset. Why this slide: centred on the lifted line the bar's ink would start 0.25 above the margin edge (y 1.75 · 1.75 · 0.75), so it slides the least step along its own line, and its ink now starts on the margin's top edge (y 2 · 2 · 1, level with the bookmark's top). The least slide is also the best balance of the bar's two ends against the bookmark: past the bookmark's silhouette the upper-left end runs 2.23 · 1.12 · 1.03 along the bar and the lower-right 2.87 · 1.46 · 1.51; every further slide widens the gap, to 1.17 against 3.93 · 0.75 against 2.52 · 0.63 against 2.57 at the far end of the margin. The bar stands 1.75 · 0.75 · 0.75 past the bookmark's left side and 2.25 · 1.25 · 1.25 past its right, so the composite's box sits 0.25 right of the canvas centre at every master, declared optical 0.25 0; the bookmark itself does not move. Why the lift is still 1.25: with the longer bar the least lift that keeps the whole notch is 0.25 at 24, 1.25 at 20 and 1.125 at 16, as before. One lift of 1.25 runs through all three masters. Why not a whole step: a lift of 1 loses the V's right edge at 20 (1.371 of air, under 1.5) and is 0.004 short at 16 (1.496). A lift of 2 is the least whole step that works at every master (air 2.79 · 2.08 · 2.20), but it slides the box 1 right of centre, the bar 1 · 0 · 0 past the left side and 3 · 2 · 2 past the right, visibly lopsided. So 1.25 with a 0.25 slide is the better balance. Cut: every stroke stops with 1.5 of air from the bar's edge, measured 1.500–1.505 at every cut end (centrelines 3 · 3 · 2.75 apart), round caps; the cut ends at 16 are not snapped to pixels, so the air stays even. The notch's right edge runs at 45°, parallel to the bar, its centreline 3.75 · 3.05 · 2.92 from the bar's (air 2.25 · 1.55 · 1.67). The foot is kept whole. The lower piece starts on the right tip's round at (18.03,21.03) · (14.18,17.18) · (11.737,14.375), runs down both notch edges, round the left tip and up the left side. The notch's right edge keeps 2.25 · 1.55 · 1.67 of air to the bar along its whole length (centred: 1.37 · 0.66 · 0.79, inside the cut). The weakest spot is at 20: the V's right edge runs parallel to the bar with 1.548 of air over its whole length. What the longer bar removes that the inside-width bar did not: only the right tip's round, 1.09 · 0.96 · 0.87 more. At 24 that is the right side's last 0.5 and half the tip's round; at 20 the tail also loses its lowest point, its ink ending 0.07 above the foot; at 16 the round goes to its lowest point. The top corners, the left tail and the notch are cut exactly as before, because the cut is square to the bar wherever the bookmark meets it. Kept (24 · 20 · 16): the upper piece 19.37 · 13.48 · 10.79, the top edge round the right corner and down the right side to y 12.75 · 9.75 · 7.235; the foot 28.44 · 21.70 · 18.53, the right tip, both notch edges, the left tip and the left side up to y 8.75 · 7.75 · 6.265. Removed: the right side between the cuts with part of the tip's round, 8.33 · 8.24 · 7.51; the left side's top with the left corner and the top edge's first 0.99 · 2.24 · 2.14, 7.84 · 7.95 · 7.35; crumbs under 1.5 dropped: none · none · none. 70% · 63% · 60% of the bookmark's line survives. Fold line kept 6.01 (x 12.243 to the right side) · 3.51 (x 11.743 to the right side) · 2.61 (x 9.764 to the right side). Every uncut segment is the shipped bookmark's, verbatim; off-grid decimals are the cut ends and the channel's corners, where the circle or line puts them. bookmark stays in place (C34): its ink 14×20 · 12×16 · 10×14, centred 12,12 · 10,10 · 8,8. The composite's ink is 18×20 · 14×16 · 12×14 (declared box at every master), 0.25 right of the canvas centre (optical 0.25 0), outline and filled alike. Filled: a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side) knocked out of the band and the body, its corners rounded r0.75 · 0.75 · 0.625 about the outline's cut ends, so each solid's tip is the outline's cap; where the channel meets the fold slot the band's and body's corners round at the same radius; white 1.500–1.506 each side. The bar runs whole through it at 1.5 · 1.5 · 1.25. Three solids: the band 40.39 · 25.72 · 17.02, the body above the bar 23.48 · 8.95 · 4.66, the foot 87.2 · 55.61 · 40.66 (units²). The right tail is a strip 2.25 · 1.55 · 1.42 wide between the channel and the notch, over the line weight. Balance: outline mass +0.20,−0.46 · +0.14,−0.29 · +0.12,−0.20 from the canvas centre (bookmark alone 0,−0.69 · 0,−0.52 · 0,−0.45; A2 −0.12,−1.11 · −0.02,−0.76 · −0.01,−0.65). Filled −0.21,−0.33 · −0.35,−0.21 · −0.33,−0.02 (bookmark-filled 0,−0.34 · 0,−0.18 · 0,−0.07). What it costs: C21's centring, by 1.25 at every master (more than 24 needs); the top-left corner; a short right tail; a box 0.25 right of centre. At 20 the V's right edge keeps only 1.55 of air to the bar over its whole length, so the two read as a pair of parallel strokes. (recommended) -->
