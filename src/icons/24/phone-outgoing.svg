  <!-- Corner arrow out to the margin edge: Arrow out of the handset's empty corner, to the margin edge: phone's handset verbatim and in place at every master, both styles, with nothing cut — the arrow sits in the corner the handset leaves empty (phone's own "clear square top-right"), as Lucide and Polaris put it. The arrow is phone-incoming's turned 180° about the mark box's centre (17,7 · 14.25,5.75 · 12,4), in the same box (v3-kit-phone.md): arrow-up-right's turned-classic head scaled to a badge — legs 4.5 · 4 · 3.5 on 0° and 90° from the box's top-right corner, C10 bend 0.75 · 0.75 · 0.625, the shaft on the diagonal to the bottom-left corner, its open end at the head set back 0.22 · 0.22 · 0.183 on each axis (r(1 − 1/√2), arrow-up-right's own number, which lands its cap on the head's outer corner). Arrow ink 10×10 · 7.5×7.5 · 6×6, the same box as incoming's; its top-right corner — here the head's own corner — on the margin edge (22,2 · 18,2 · 15,1), the reach C33 gives a badge. Composite 19×19 · 15×15 · 13×13, declared as box, centre 0.5 right and 0.5 up — calendar-repeat's box and offset, turned to the top-right, as phone-incoming. Reversed, the head stands clear of the handset (6.12 · 4.12 · 3.52 of air to the top-left head's rounded corner) and the tail's round cap comes nearest, on the box's bottom-left corner across from the bar's inner arc: 1.92 · 1.75 · 2.07. At 16 the legs sit on y 1.625 and x 14.375 and the tail on 9.625 6.375, so the head's two outer edges (y 1, x 15) and the tail's cap extremes (x 9, y 7) land on whole pixels. Head air (C37, the leg cap to the shaft) 1.68 · 1.33 · 1.23, incoming's exactly. The legs are 53 · 67 · 74% of the arrow's side (arrow-up-right: 52 · 53 · 54%), because a leg shorter than 3.54 · 3.54 · 3.18 cannot keep C37's 1 of air (leg ÷ √2 less the weight); the smaller masters' heads are bigger for that reason. Tightest air, measured: 1.922 · 1.753 · 2.068 outline, 1.923 · 1.753 · 2.068 filled (the shaft's tail to the bar's inner arc), since the filled handset's edges are the outline's ink edges. Filled: phone-filled verbatim; the arrow stays a line at 1.5 · 1.5 · 1.25, because a shape icon's lines keep the outline weight (external-link-filled's arrow, phone-contactless-filled's waves). Off the grid besides phone's own numbers: only the shaft's set-back end (21.03 2.97 · 17.03 2.97 · 14.192 1.808). Family: phone-incoming is the same arrow pointing in, phone-forwarded a level arrow in the same box, top-aligned, phone-missed an x on the same box (v3-kit-phone.md). (recommended) -->
