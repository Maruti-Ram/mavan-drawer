<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: partial print, arches, touch, biometric -->
  <!-- box: 16x20 -->
  <!-- Symmetric arches: Round 1's A, kept for comparison: Three ridges on one centre: a core line and two arches, open at the bottom. The outer ridge runs up the left, over the top and stops at the upper right (36° · 50° · 53° above the right side); the legs end staggered (outer half the drop, inner left 0.9, inner right 0.7, core the full drop). The type Material/Android fingerprint, Lucide fingerprint-pattern, Tabler, Heroicons finger-print, Nucleo and Untitled fingerprint-04 draw. Pitch 4 · 3.5 · 3.5, air between ridges 2.5 · 2 · 2.25 (24 · 20 · 16), the same all the way round; three ridges at every master. Ink 16×20 · 13×16 · 12.5×14, box-centred. Filled: weight 2.5 · 2 · 2 and all three ridges kept with exactly 1.5 of air (the pitch was picked for that); the filled print sits half the added weight right and down so its left and top edges stay on the outline's, its outer ridge stops a little earlier (46° · 55° · 60° above the right side) and the core pulls up the same half weight, so the ink box is identical. Cost: at 16 the 3.5 pitch leaves two of the four legs on half pixels (outer leg and core are crisp). At 16 it reads as a print beside target, at-sign and maximize-5, and has nothing of wifi (no fan, no dot). It is the print people already know from Android and most sets, and the only type that keeps all its ridges in both styles at 16 -->
  <path d="M4.75 16L4.75 10.75A8 8 0 0 1 12.75 2.75A8 8 0 0 1 19.25 6.09"/>
  <path d="M8.75 20.25L8.75 10.75A4 4 0 0 1 12.75 6.75A4 4 0 0 1 16.75 10.75L16.75 18"/>
  <path d="M12.75 10.75V21.25"/>
</svg>
