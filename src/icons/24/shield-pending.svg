  <!-- House clock on the top-right shoulder: What the eye sees: the point stays. At 24 C is plainly a shield (flat top-left, straight left wall, the whole belly and its point) with the clock standing on its right shoulder. At 20 the left wall, the belly and the point still read as a shield; above the belly, the right side is all clock. At 16 the outline is the shield's left wall and bottom, with the same one-pixel point the shipped shield has there, and the clock above it on the right. It is clearly not file-clock: 33% of its pixel ink is shared with file-clock at 16 (B: 69%), and it shares as much with the plain shield as B does (51%, B 50%). What it loses: the shield's top edge and its whole right side, so at 16 the outline is a U holding a clock rather than a closed shield, and the filled twin at 16 and 20 reads as a crescent with a point beside a solid clock, nearer a moon than a shield. Look at that first. How much the clock takes: the top wall's right 6.5 at 24 and all of it at 20 and 16, the right shoulder, the right side, and the top 17 · 26 · 22 deg of the right belly's 68 deg turn (51 · 42 · 46 deg kept). 64 · 57 · 57% of the shield's line is kept (B 68 · 59 · 60%; shield-check 82 · 80 · 80%). The drawing: the shipped shield, unchanged and in place. The clock is file-clock's ring and hands (outline) and its disc with the hands knocked out (filled), string for string, moved straight up by 9 · 6.5 · 6 so its ink corner sits on the margin edge's top-right corner, 22,2 · 18,2 · 15,1. Ring centre 16.5,7.5 · 13.25,6.75 · 11,5; the hands pivot on it, minute 2.25 · 1.5 · 1.125, hour 0.71 of it, 1 of air to the ring (C38; the board's hands: clock, no gap note). Pixels: at 24 and 16 the move is whole units, so the clock's pixels are file-clock's exactly. At 20 the exact corner is a move of 6.5. That puts the ring's top ink edge on a whole pixel (2) and its bottom on a half pixel (11.5), the other way round from file-clock (8.5 and 18); left and right (8.5, 18) are unchanged. The ring then renders as file-clock's ring upside down: the same 13 solid pixels and the same soft-edge total (12.16), so it is as crisp. The hands come out a shade crisper (14.55 against 14.96, ring included), and the clock's top sits on the same whole-pixel row as the shield's shoulder. A move of 6 would keep file-clock's pixels but leave the clock 0.5 below the margin edge, its top on a soft row, so C keeps the corner. Box 18x20 · 14x16 · 12x14, as B: the shield's 16x20 · 12x16 · 10x14 plus the 2 the clock stands right of it. Its centre is 1 right of the canvas centre, so the files declare base: shield, and lint holds the left, top and bottom edges to the shield's. The clock's top is on the shield's top, so the base hold, written for a bottom-right badge, expresses this placement as it stands. Cut back by hand with 1.5 of air from the clock's ink. Top: at 24 the top wall stops on the grid at x 10.25, 3 past its left shoulder, with 1.6 of air (the mirror of file-clock's bottom wall end at 24). At 20 and 16 it could reach only 0.75 past the shoulder on the grid, under 1.5, so the wall is removed; the left shoulder stays and ends where the wall began (6.75,2.75 · 5.125,1.625), 2.13 · 2.15 from the ring. Right: the shoulder and the straight side lie wholly inside the band and go; the belly starts again where its cap keeps the air, at 18.85,15 · 14.61,13.62 · 11.958,11.05. At 24 that end is set at the top end's 1.6, so the white between shield and clock is one even band; at 20 and 16, with no wall end to match, at the band's 1.5. Air, shield to clock: outline 1.600 · 1.503 · 1.500, filled 1.608 · 1.510 · 1.501. The hands are at least 4.99 · 4.65 · 4.25 from the shield. Filled: shield-filled's solid, cut along a circle concentric with the clock, radius 7.1 · 6.26 · 5.501: the clock's disc (5.5 · 4.75 · 4) plus the band's air (1.6 at 24 for the even band, 1.5 at 20 and 16, rounded up). Where the outline ends a wall in a round cap, the sheet ends on that cap, in the same place, at the cap's radius (0.75 · 0.75 · 0.625). The belly cap, and at 24 the top cap, are tangent to the cut circle. At 20 and 16 the shoulder's cap stands clear of the cut (2.13 · 2.15), so the sheet runs on from the cap's forward point straight down x 7.5 · 5.75 and turns into the cut with a 0.5 round, as file-clock-filled ends its bottom-left corner. The filled ink box equals the outline's at every master. Off-grid decimals. Outline: the belly end (18.85, 15 · 14.61, 13.62 · 11.958, 11.05), the point on the right belly where its cap keeps the band's air, rounded away from the clock; the shipped shield's own tangent and tip points (13.62, 20.65, 12.28, 21.2, 11.72, 10.38, 12.31 · 11.18, 16.83, 10.28, 17.2, 9.72, 8.82, 10.8 · 8.935, 14.046, 8.234, 14.329, 7.766, 7.065, 8.947); and file-clock's hour-hand end, moved up (17.63, 8.63 at 24 · 11.565, 5.565 at 16; at 20 it is on the grid). Filled: the top cap's tangent point on the cut at 24 (10.84, 3.2); the cut's radius (7.1 · 6.26 · 5.501), the belly cap's own distance from the clock less half the stroke, rounded up; the belly cap's tangent point on the cut (18.63, 14.29 · 14.47, 12.89 · 11.861, 10.433), rounded away from the clock; the belly cap's point on shield-filled's outer belly (19.57, 15.23 · 15.29, 13.95 · 12.536, 11.289); at 20 and 16 the straight's end and the 0.5 round's end on the cut (4.17; 7.46, 4.36 · 3.282; 5.729, 3.425); shield-filled's own points (13.9, 21.35, 12.56, 21.89, 11.44, 10.1, 12.31 · 11.47, 17.53, 10.56, 17.89, 9.44, 8.53, 10.8 · 9.169, 14.626, 8.468, 14.909, 7.532, 6.831, 8.947); and file-clock-filled's knockout, moved up (15.97, 8.03, 17.35, 9.41, 18.41, 8.35, 7.19 · 12.72, 7.28, 13.85, 8.41, 14.91, 7.35, 6.44 · 10.47, 5.53, 11.349, 6.409, 12.409, 5.349, 4.69). (recommended: it keeps the point, the shape that makes it a shield, at every master. At 24 and 20 it reads as a shield with a clock on its shoulder, and at 16 it no longer reads as file-clock, which B does. Its weak spot is the filled twin at 16 and 20, where the shield reads as a crescent.) -->
