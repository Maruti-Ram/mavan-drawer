  <!-- Card in place, V2 x on its corner: Card declined: credit-card (bar left) kept exactly where credit-card has it (ink 20×16 · 16×12 · 14×10), with the V2 x badge copied string for string from the V2 spec, the same strings in both styles at the outline weight 1.5 · 1.5 · 1.25, its ink 8 · 6 · 5 square with its corner on the margin edge (22 · 18 · 15), C33. Box 20×18 · 16×14 · 14×12 (declared), the card plus the 2 the x stands below it; centre 12,13 · 10,11 · 8,9, 1 below the canvas centre at every master, so base: credit-card, as credit-card-lock, -percent and -contactless ship it. Cut back by hand with 1.5 of air from the x's ink, by credit-card-lock's and -percent's rules. Right wall stops on the stripe's line at every master (y 8.75 · 7.75 · 6.625), so the stripe closes the top band as in the rest of the family: the x would let it run on to 11.75 · 9.75 · 7.875, which at 16 is a stub 1.25 under the stripe (shorter than 1.5, so C33 removes it) and 24 and 20 follow for one picture. Bottom wall stops at x 12.5 · 10.5 · 8.5, 7.25 · 5.75 · 5.375 past its corner, its cap ending at 13.25 · 11.25 · 9.125, short of the x's box (14 · 12 · 10); air 1.51 · 1.51 · 1.50 to the x's nearest end (the lower-left end at 24 and 20, the upper-left at 16, where the wall points into the x's left gap); one step further gives 1.33 · 1.33 · 1.41. Stripe and bar whole: the stripe 4.5 · 3.5 · 2.75 above the x, the bar 4.02 · 3.11 · 2.91 from it. Tightest air, outline: 1.51 · 1.51 · 1.50 (the bottom wall). Filled: credit-card-filled's top band whole (6 · 5 · 4 above the x); the lower solid, with its bar slot, cut back from the x's ink grown 1.5 (radius 2.25 · 2.25 · 2.125 round each centreline). Its right wall is gone, so the solid ends here and V2 4a decides it: one straight face at x 12.5 · 10.5 · 8.5 from the stripe's gap down to the outline bottom wall's own cap (r 0.75 · 0.75 · 0.625, centred on the wall's end point 12.5,19.25 · 10.5,15.25 · 8.5,12.375), the solid ending in that cap, its bottom edge stopping at x 12.5 · 10.5 · 8.5 where the outline's does. The face touches the grown cap round the x's upper-left end (air 1.5), as credit-card-lock-filled runs straight up the shackle's grown side; so no horn of solid runs down the right edge the outline no longer has, and nothing points into the x's gaps. At 24 and 20 the face meets the cap in a corner eased r 0.5 (face to y 18.1 · 14.1, onto the cap at 12.8,18.56 · 10.8,14.56), the cap drawn as two arcs split at its rightmost point 13.25,19.25 · 11.25,15.25 so the arc that faces the x stays on the wall's own circle; at 16 the face runs into the cap along the grown cap round the upper-left end, which the wall's cap meets 0.003 away. The solid stands 0.75 · 0.75 · 0.63 proud of the face, the cap's own reach. Bar slot whole: solid beside it 2.5 · 1.5 · 1.25, the line weight at 20 and 16. The x stays a line at 1.5 · 1.5 · 1.25. Tightest air, filled: 1.5 at every master (the face to the x's upper-left end); the cap keeps the outline's 1.51 · 1.51 to the lower-left end, 1.5 at 16 where it meets the grown upper-left cap (1.67 to the lower arm). Ink box equal to the outline's. Off-grid values are the filled ease's tangent points only, rounded to 2 · 2 · 3 dp away from the x: 18.1 and 12.8,18.56 · 14.1 and 10.8,14.56, the r 0.5 ease between face and cap; 8.984,11.977 at 16, where the wall's cap meets the grown cap. (recommended: the rules and the family decide it; Lucide credit-card-x and Polaris CreditCardCancel draw the same picture, right wall to the stripe and bottom wall short of the x) -->
