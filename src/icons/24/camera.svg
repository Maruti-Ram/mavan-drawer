  <!-- Viewfinder hump, ring lens: Ink 20x18 · 16x14 · 14x12 (folder and briefcase's box); body 20x15.5 · 16x12 · 14x10 of ink (1.29 · 1.33 · 1.4 : 1), corners r2.5 · 2 · 1.5 as folder and calendar. Hump: 45 degree sides rising 2.5 · 2 · 2 above the body line, top 7 · 5 · 4 and base 12 · 9 · 8 on the centreline (60% · 56% · 57% of the body), top corners r1.5 · 1.25 · 1 (the detail radius), inside corners r1 · 1 · 0.75. Lens: a ring 8 · 6 · 6 across the ink (52% · 50% · 60% of the body's height; opening 5 · 3 · 3.5), centre y 13 · 11 · 8. Revised after review: the eye measures the lens against the body under the shoulder line, not against the whole silhouette, so at 24 and 20 the lens sits on the body's centre (body interior 7–19.5 · 6.5–15.5, centre 13.25 · 11): at 24 edges 9–17, 2 clear of the shoulder and 2.5 above the floor (0.25 above the true centre, the nearest whole-pixel spot); at 20 edges 8–14, 1.5 clear on both sides. At 16 the 6 lens cannot drop: the room is 7.5 tall and the lowest centre that keeps 1.5 above the floor is 8.25, which puts its edges on fractions and blurs them, so it stays at 8 (1 above the body centre, 1.59 clear of the hump; K is the lowered alternative). At 16 the whole-pixel lens sizes are 6 and 4: 5 lands on half pixels and blurred in the 16 px render, 4 leaves an opening of only 1.5. 16 master at stroke 1.25: walls, floor and hump top on the eighth grid so the outer edges are whole pixels. Filled: body solid; the ring becomes a 1.5 cut on its outer edge, leaving a glass disc 5 · 3 · 3 across (draft-check reads 4.9 · 2.94 · 2.94 of material, floor 1.5). The quietest camera that is still unmistakable: the hump says camera, the lens sits at the references' proportion (Lucide 53%, Nucleo 58% of the body's height), and body and radius come whole from folder and briefcase, so nothing new enters the set (recommended). -->
