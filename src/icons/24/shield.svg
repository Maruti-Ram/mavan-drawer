  <!-- Heraldic bow: The classic heater shield, and the shape both references draw. Ink 16x20 · 12x16 · 10x14 — the portrait keyline, the box lock, user and flag already use. Top edge flat between shoulders 2.5 · 2 · 1.5; sides straight down to 52% · 56% · 57% of the height, then the bottom. Tip round 0.75 · 0.75 · 0.625 (C10's minimum at each master, map-pin's tip). Every join is tangent, so nothing in the drawing is a sharp corner. The bottom is one belly arc of radius 9 · 6.5 · 5.5 that turns the side through 68° — so the two edges arrive at the point almost flat (68° off upright, the references run 71°) — then 1.45 · 0.97 · 0.76 of straight into the tip round. That flat arrival is why it never reads as a spike — the shield is still 8.5 · 7.6 · 6.9 wide two units above the tip — and it is also why the point needs width to show at all. Room for a later mark inside it (largest centred square with §6's 1.5 clear): 9.25 · 5.88 · 4.50. Filled: the same silhouette solid, one path whose outer edge is the outline's outer edge exactly — every convex arc grows by half the stroke, so the ink box is identical to 0.01. Judged at 16 in real pixels this is the one thing to look at: on the portrait keyline the point all but disappears — the bottom reads as a U with a one-pixel nub, because a 68° arrival needs width to show. J is this exact drawing with 2 more units at 16 and it reads as a shield; C keeps its point at this width by arriving at 45° instead. -->
