  <!-- Upright tube, arm behind: Changed in round 2. Air down the stack (cap, tube, stage, base) is now one gap per master: 1.5 / 2 / 2 → 2 / 2 / 2 at 24; 1.5 / 1.75 / 1.75 → 1.5 / 1.5 / 1.5 at 20; 1.5 / 1.5 / 1.5 → 1.75 / 1.75 / 1.75 at 16. That is about a tenth of the ink height at every master (10% · 9.4% · 12.5%). At 16, 1.75 instead of 1.5 is what lets every line land with a whole-pixel edge. With 1.5 the tube's bottom wall fell on x.875 and greyed the row, closing the tube's hole in Chrome at 1x. Tube 7x10 → 7x9.5 · 6x6.5 → 5.5x7 · 5x5.75 → 4.5x5 outer: its width stays 35% · 34% · 32% of the ink, and at 16 its walls move from x.125/x.875 (half-pixel blur) onto x.375/x.625. Eyepiece cap 2.5 · 2 · 1.5 → 4 · 2.5 · 2 long, now exactly the tube's centreline width, so its ends sit over the walls (at 16 the old cap read as a dot). Stage now overhangs the tube by 1.5 each side at every master (it was 1.5 · 1 · 0.875). Arm leaves the tube one gap below its top at every master (was 1.5 · 1.5 · 1.25) on radius 7 · 5 · 4.375 → 6.5 · 5 · 4, so its diameter stays 1.8–1.9 times the tube's width. Kept: ink 20x20 · 16x16 · 14x14 on the circle keyline, centred exactly; arm tangent on the base, its right side on the box edge; every value on the quarter / eighth grid. Measured: tightest air 2 · 1.5 · 1.75; mass centre 12.11,14.06 · 9.94,11.73 · 8.19,9.73 (the low centre is the base, as with terminal and puzzle); ink 20.5% · 22.4% · 23.8% of the canvas (bug 24.4%, wrench 16.3% at 24). Filled: the tube fills, the lines stay 1.5 · 1.5 · 1.25; ink 24.9% at 24, beside wrench-filled 25.0% and search-filled 20.8% (bug-filled 36.3%: its body is one shape). Lucide, Phosphor, Font Awesome, Fluent (recommended) -->
