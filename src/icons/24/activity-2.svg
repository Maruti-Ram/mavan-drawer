  <!-- tags: pulse, signal, square wave, monitor, oscilloscope -->
  <!-- Square pulse: On 0/90 only, no angle question: the pulse as a square wave - up, across, down through the baseline, across, up - an oscilloscope trace. Landscape keyline 20x16 · 16x12 · 14x10, centred, filled identical. Uprights 4 · 3.5 · 3.625 apart (x 8/12/16 · 6.5/10/13.5 · 4.375/8/11.625 - at 16 the outer two on x.375/x.625 so one edge of each is a whole pixel, the middle one on 8 as plus is), corners C10 (0.75 · 0.75 · 0.625, filled 1.25 · 1 · 1), flats 5.25 · 3.75 · 2.75 long. Tightest air: between the uprights 2.5 · 2 · 2.375, filled 1.5 · 1.5 · 1.625 - the spacing is set by the filled twin's heavier uprights; no wedges at all, so its 16 is the crispest of the five. It reads as a digital signal (a square wave) more than a heartbeat, and may sit closer to a later signal or waveform icon than to activity. Apart from chart-line and trending: no diagonal at all, and level ends. Filled: line-heavy at 2.5 · 2 · 2, ends pulled in 0.5 · 0.25 · 0.375, uprights thicken in place, top and bottom runs move in 0.5 · 0.25 · 0.375 so the ink box holds -->
