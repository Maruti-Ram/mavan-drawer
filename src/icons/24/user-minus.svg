6.332 · 13.482 · 11.092), 0.11 · 0.13 · 0.06 right of the outline's cap, as user-plus-filled's does. The head disc is whole; the minus a line at 1.5 · 1.5 · 1.25. Tightest air, filled: 1.5 · 1.5 · 1.5 along the cut, by construction. Off-grid numbers: the outline's dome ends above; in the filled twin user-plus-filled's own exit and strip join (24: 16.09,12.63, 12.84,19.2 / 13.89,20.86; 20: 13.25,10.46, 11.12,16.56 / 11.3,16.74; 16: 10.88,8.413, 8.739,13.48 / 9.054,14.086), the face (x 16.33 · 13.48 · 11.092, where the r 0.5 ease from the exit turns vertical, its top at y 13.06 · 10.88 · 8.822) and its foot (15.83,15.75 · 12.98,12.75 · 10.598,10.375, where the second r 0.5 ease meets the minus's grown top; at 16 just on its round end), rounded to 2 · 2 · 3 dp. With the upright gone the copied cut is set by the twin, not by the minus: the minus alone would let the dome run on to 17.68,15 · 13.91,12 · 11.4,9.75 (51.6 · 48.2 · 51.1 deg past the top), and at 24 the base line could pass under it with 1.75 of air (at 20 and 16 it could not: 0.75 · 0.625). -->
