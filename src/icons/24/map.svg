  <!-- box: 20x18 -->
  <!-- Zigzag, squarer box: Three panels, the zigzag every reference on the board draws (Lucide, Nucleo 18 and 12): left panel rises to fold 1, the middle falls to fold 2, the right rises again; one drawing turned half a turn is itself. Every slanted edge runs 2 across for 1 up (26.57 deg, package-2's 2:1, so the edges step cleanly on the pixel grid) and all of them are parallel. Panels 6 / 6.5 / 6 · 4.5 / 5.5 / 4.5 · 4 / 4.75 / 4 wide on the centreline (rise 3 / 3.25 / 3 · 2.25 / 2.75 / 2.25 · 2 / 2.375 / 2). Folds at x 8.75 / 15.25 · 7.25 / 12.75 · 5.625 / 10.375, so one edge of each lands on a whole pixel (layout-sidebar's divider rule), touching the edge at both ends. Outer corners at the detail radius 1.5 · 1.25 · 1 (book-open); the four crease corners are plain round joins, no arc, so each fold ends exactly on its crease vertex and the peaks' ink sits exactly on the box edge. Off-grid decimals are arc-derived: the corner arcs' tangent points, the peak arcs written through their apex in the filled twin, and the filled outer edge, which runs 0.75 x sqrt(5)/2 = 0.84 (0.70 at 16) above a 2:1 centreline. ANGLE EXCEPTION: 2:1 is outside 0/45/90 and needs Maruti's ruling (precedent package-2, approved for itself only). Knot at 16: where a fold meets a peak (top of fold 1, bottom of fold 2) it meets both edges at 63.4 deg, and the air beside it reaches 1.5 only 2.69 from the crease (a plain 90 deg T-junction: 2.125; package-2's seam-to-side wedge, same 63.4 deg, shipped at 2.52 / 2.95); at the valleys 2.035. Panel counters at 16 (C23, largest circle): 2.75 · 3.5 · 2.75. Filled: one solid sheet whose edge is the outline's outer edge, each fold a CLOSED slot 1.5 wide (at 16 moved 0.125 so one edge sits on a whole pixel: 5-6.5 and 9.5-11), round ends leaving material of 1.57 / 1.59 · 1.57 / 1.59 · 1.61 / 1.58 to the peak and the valley notch (floor 1.5), package-2's construction. Not cut through: the peaks carry the box's top and bottom, and a cut through them would take at least 0.29 off the top and the bottom at 24; a slot left open at the valley (drawn first) turned the filled into a meander, two linked U shapes. In folder's agreed box, 20x18 · 16x14 · 14x12 (W:H 1.11 · 1.14 · 1.17, inside the references' 1.02-1.15; folder found the 20x16 box squashed), filled identical. Fold lines 13.25 · 9.75 · 8.375 (A: 11.25 · 7.75 · 6.375); filled slots 11.5 · 8 · 6.25 long (A: 4.25 at 16). Needs two rulings: the 2:1 angle, and folder's box (agreed for folder only) extended to map. (recommended: the same drawing as A with 2 more units of crease at 16, where the panels become taller than wide and the slots in the filled stop reading as dashes) -->
