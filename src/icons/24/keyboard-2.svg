  <!-- Wired keyboard: A's slab and keys with a cable leaving the top edge at the centre and turning right: rises, bends on radius 2.5 · 2 · 1.5, runs to x 17 · 14 · 11 (ink). Ink 20x18 · 16x15 · 14x13 (declared box); the slab is A's, lowered 3 · 2 · 1.5. The cable is the one detail no card, screen or calendar has. Filled: slab solid with keys cut out, cable stays a line at 1.5 · 1.5 · 1.25. Risk: the cable costs height, and with a centred cable over three keys it can tip toward a robot's head; the off-centre space bar is what keeps it a keyboard Filled 16 only (2026-09-28): the key and bar cuts are 1.5 tall, as at 24 and 20, not the 1.25 line: rows at y 7 to 8.5 and 10 to 11.5 (slab 4.5 to 14.5), so each cut has its upper edge on a whole pixel (7, 10) and renders one pure-white pixel row with a solid pixel row between them (the slab sits on a half pixel here), and 1.5 of solid stays between the rows; the block sits 0.25 high in the slab, 2.5 of solid above and 3 below; each cut keeps its outline ink length (x 3.75 to 5.5 · 7.125 to 8.875 · 10.5 to 12.25, bar 3.75 to 8.875), round ends r0.75. -->
