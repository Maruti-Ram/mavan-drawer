<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: paperclip, clip, attach, upright, classic, gem, concentric -->
  <!-- box: 11x20 -->
  <!-- Upright, classic, nested loops: The full classic clip with the inner loop running all the way down, its bottom turn nested inside the outer one with the same gap all the way round. The most recognisable paperclip of the ten at 24 and still a clear paperclip at 16, where it is the densest upright: four legs and two nested turns. Legs as B: 3 · 3.5 · 3 apart at 24, an even 3 at 20 and 16; turn radii 1.75 · 3.25 · 4.75 at 24, 1.5 · 3 · 4.5 at 20 and 16; both free ends level, at or just under the top turn's centre. Ink box 11x20 · 10.5x16 · 10.25x14, filled box identical. Smallest gap, outline 1.5 · 1.5 · 1.75 (between neighbouring legs); filled 1.5 · 2 · 2 (between neighbouring legs); floor 1.5. The inner loop is 2 · 1.5 · 1.75 clear inside; at 16 that shows as one clear pixel beside one light one. Box 0.25 right of centre at 20, 0.125 at 16, as B. Filled: three legs in the same box, inner leg running to the bottom turn, because four heavier legs do not fit (see B). Filled is the line-heavy case: nothing to fill, so the same wire at 2.5 · 2 · 2, outer legs moved in 0.5 · 0.25 · 0.375 and free ends pulled back the same, so the ink box is held. Every number on the grid -->
  <path d="M10.25 6.5L10.25 16.5A1.75 1.75 0 0 0 13.75 16.5L13.75 6A3.25 3.25 0 0 0 7.25 6L7.25 16.5A4.75 4.75 0 0 0 16.75 16.5L16.75 6.5"/>
</svg>
