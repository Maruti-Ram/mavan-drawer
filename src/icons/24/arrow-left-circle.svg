  <!-- arrow-left-circle · wide: Turned from the shipped arrow-up-circle a quarter about (12,12) · (10,10) · (8,8), (x, y) → (y, c − x) with c the canvas width 24 · 20 · 16: a rotation, so the arc sweeps hold, and every arrow and cut number is the up file's own, swapped between axes (c − x on the new y); nothing is redrawn or re-proportioned. Ring and disc: `circle` verbatim (outer ⌀20 · 16 · 14), not turned. arrow-left-2's wide head, the one C16 names for -circle buttons. Its ratio (14/15 · 12/13.5 · 11/12) would give 9.8 · 7.11 · 5.96 tall; drawn 10 at 24 (the nearest quarter-grid head), grown to 8 · 7.25 at 20 and 16 (+0.89 · +1.29), forced by the knockout. Mark ink 10.5×10 · 8×8 · 6.5×7.25 (w×h), x 6.75–17.25 · 6–14 · 4.75–11.25, y 7–17 · 6–14 · 4.375–11.625, centred on the canvas (12,12 · 10,10 · 8,8). Head 5.44 · 4.44 · 3.99 deep, shaft showing 5.06 · 3.56 · 2.51 right of the barbs. Head to length 0.95 · 1 · 1.12 (arrow-left-2 is 0.93). Ink against plus-circle's plus, which it swaps with: 32.0 · 24.0 · 17.4 against 28.3 · 20.8 · 14.0 (+13% · +16% · +24%), measured as geometric area; filled, knocked-out white 43.1 · 28.1 · 24.7 against 38.3 · 23.9 · 18.6 — the same as arrow-up-circle's to the hundredth, since a quarter turn about the centre lays the pixel grid onto itself. Head air (C37), outline: 2.75 · 1.75 · 1.75 (the barb caps at x 11.44 · 9.69 · 8.116 to the shaft). Knockout solid barb-to-shaft: 2.25 · 1.49 · 1.25 (1.5 at 20 on the true half-width 0.875; 1.49 as written, 0.88), measured by hand from the cut's cap centres to the shaft cut's edge: lint's knockout check (§5c) returns no reading on this span, for the up file as for this one. Air to the ring, outline: 3.25 at 24 (tip and tail), 2.49 at 20 and 2.12 at 16 (barb caps). Filled, solid round the cut to the disc edge: 4.49 · 3.86 · 3.12 (at 24 the tip, 6.495 from the canvas edge; the tail holds 4.5). C15, measured by hand (the sheet, read for this board, gives "left–right only, no measure" on a two-path arrow): the triangle through both leg ends and the tail sits 1.13 · 0.88 · 0.95 right of centre, so × 0.5 recommends left 0.56 · 0.44 · 0.48; not applied (C14 keeps arrows box-centred, as arrow-up-circle shipped). Arrow: arrow-left's build (shaft starting on the bend's apex, legs 45°, one C10 tip of 0.75 · 0.75 · 0.625), 10.5 · 8 · 6.5 long in ink (plus-circle's span, so the two swap), box-centred, mirrored top and bottom on y 12 · 10 · 8. Filled: the disc with the arrow cut out at the medium weight 2 · 1.75 · 1.75 on the outline's centrelines (flat run kept), ends reaching half the added weight further (0.25 · 0.125 · 0.25): cut x 6.495–17.5 · 5.875–14.13 · 4.5–11.5; ink box = the disc. What sets the head: the knockout. The solid left between a barb's cap and the shaft's cut is the leg-end offset less the cut weight, and it floors at the line weight 1.5 · 1.5 · 1.25 (§5c), so the offset must be 3.5 · 3.25 · 3 — head 8.5 · 8 · 7.25 tall at the least; drawn 4.25 · 3.25 · 3. The outline alone (C37, 1 of air) would only need 6.5 · 6.5 · 5.75. Off-grid decimals are construction, the up file's turned: the tangent points of the 45° tip (x 7.72, y 11.47 and 12.53 · x 6.97, y 9.47 and 10.53 · x 5.558, y 7.558 and 8.442), each leg end's x set by 45° from them (11.44 · 9.69 · 8.116), the cut's outer tip radius 1.75 · 1.63 · 1.5 (bend + half the cut) with its tangent points, the cut's 45° cap points, and the 20 cut's half-width 0.875 written 0.88 on both sides (as plus-circle-filled), which keeps it mirrored. At 16 the eighths (5.375, 10.625) now sit on x, as the up file's sat on y. Ships as arrow-left-circle, as arrow-up-circle shipped under its plain name. -->
