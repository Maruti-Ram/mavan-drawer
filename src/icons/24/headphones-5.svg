<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: earbuds, wireless, in-ear, airpods -->
  <!-- Teardrop heads, slim solid stems: Rhythm: as E1 — mirrored, 3 · 2 · 2 of air between the buds the whole way down, walls 3 · 3 · 2, box-centred. E1 with the AirPod's chin: the head's lower outer side runs on a straight tangent into the stem, so each head is a teardrop that points at its stem. The chin is a 3-4-5 line (36.87° below level) that leaves the ring at centre + (−0.6r, 0.8r) and lands on the inner tangent 2r below the head's centre (y 12.75 · 10.5 · 8.25), so every point of it is exact; the stem (solid, 2.5 · 2 · 2, as E1) hangs 8.25 · 6.5 · 5.75 below that. Off-grid at 24 and 20: the chin's tangent point (4.95, 9.15 · 4.65, 7.8), 6.75 − 1.8 and 6 − 1.35. Head 7.5 · 6 · 5 wide as headphones-4's; ring radius the same, but the ring is not closed. At 20 the clearest AirPod of the four; at 16 the teardrop leaves about one clear pixel inside the head and the chin steps in grey. Filled: teardrops fill (its chin and the outline's lie on one edge), stems unchanged -->
  <path d="M9.75 12.75V6.75A3 3 0 1 0 4.95 9.15Z"/>
  <path d="M14.25 12.75V6.75A3 3 0 1 1 19.05 9.15Z"/>
