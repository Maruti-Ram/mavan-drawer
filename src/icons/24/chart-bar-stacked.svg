<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: bars, columns, stacked, baseline, axis, analytics, report -->
  <!-- Stacked column on the floor (chart-bar-2): chart-bar-2 on its floor line with the tall middle bar broken once: its lower piece stands exactly as high as the short bar beside it and the upper piece sits on it across 1.5 of air, so it reads as one stacked column between two plain bars. Only the tall bar breaks. On the floor the medium bar has 10 · 7.5 · 6 of ink (filled 9 · 7 · 5.5), so a break would leave filled pieces of 3.75 · 2.75 · 2: stubs at 24 and 20, two round dots (a colon) at 16. The short bar (6 · 4.5 · 4) cannot break at all. With one break it cannot read as a dashed line. Everything else is chart-bar-2 unchanged: floor 18 · 14 · 12 long, bars on centrelines 6 / 12 / 18 · 5 / 10 / 15 · 4 / 8 / 12 in its medium / tall / short order, tops unchanged, bar to floor 1.5 · 1.5 · 1.75 (filled 1.5), between bars 4.5 · 3.5 · 2.75 (filled 3.5 · 3 · 2). Tall bar pieces: upper 7.5 · 5 · 3.5 of ink, lower 6 · 4.5 · 4 (filled 5 · 4 · 3.5); 1.5 of air between them at every master, in both styles. Ink box 18x18 · 14x14 · 12x12 on the square keyline; filled identical. Filled: chart-bar-2-filled's construction. Weight 2.5 · 2 · 2; the floor rises 0.5 · 0.25 · 0.375 so its bottom ink holds; bar tops pull in by the same and bar bottoms rise to keep 1.5 of air to the heavier floor. The break's two ends pull in by half the added weight, so its 1.5 of air holds. At 16 in real pixels, the floor is the one crisp black line, as in chart-bar-2. The middle bar is a 3.5 px piece over a 4 px piece with a light row between; in the filled twin they are two solid 2 x 3.5 px blocks. Beside drag-handle's dots and flip-horizontal's dashes, it reads as a bar with a seam, not a dotted or dashed line. Its risk is the other way: one seam can read as a broken bar rather than a stack (recommended: it carries the floor Maruti picked for chart-bar-horizontal, and the floor is what keeps it a chart at 16) -->
  <path d="M3.75 20.25H20.25"/>
  <path d="M6 8.75V17.25"/>
  <path d="M12 3.75V9.75"/>
  <path d="M12 12.75V17.25"/>
  <path d="M18 12.75V17.25"/>
</svg>
