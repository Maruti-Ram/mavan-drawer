<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: popper, cone, party, celebrate, polaris, plus sparks, burst -->
  <!-- Polaris set, polished: Polished S1 — the same vocabulary (three plus sparks, three dashes) and the same A4 cone (ink 14.25 · 9.5 · 8.3 along the diagonal, mouth 13.77 · 9.34 · 8.14 across), with the six pieces moved into the throw and sized to render. What changed and why: (1) the pluses read as crosses now, not blobs — arms 3.5 · 3 · 2 on the line (ink 5 · 4.5 · 3.25, sparkle-3's small spark is 5 · 4.5 · 4), each bar a whole pixel wide at 1×: at 24 the centres sit on pixel centres (9.5,4.5 · 19.5,4.5 · 19.5,14.5), so a bar is one solid pixel with a faint halo and each arm stands two clean pixels past the crossing; at 20 the edge puts the centres on .25/.75 (6.75,4.25 · 15.75,4.25 · 15.75,13.25) — arm 3.5 would leave no room for a dash between the top pluses and arm 2.5 lands the bars on pixel edges — so each bar is one solid pixel with a half-tone neighbour; at 16 arm 2 on x.625 is the crisp 3×3 cross round five saw. (2) The burst: S1's side pluses sat 10.08 · 7.95 · 6.89 off the axis and barely past the mouth plane, beside the cone — a ring; now every piece is ahead of the mouth inside the cone's own 20°–70° wedge from the apex (pluses 66.8 / 45 / 23.2°, ticks 54.85 / 35.15°, at 24), the top and right pluses 7.07 · 6.36 · 5.48 off the axis — within the mouth's half-width — at 104.43 · 100.76 · 96.58° and -14.43 · -10.76 · -6.58° from the mouth centre, the far corner carrying the third plus on the axis. Polaris's steep and shallow dashes are straightened to an upright tick on the top edge between the top and corner pluses (x 14.5 · 11.25 · 9.5, 3 · 2.25 · 2 long, pointing 70.2 · 68.9 · 66.14° from the mouth centre) and its mirror level on the right edge (y 9.5 · 8.75 · 6.5), so they render as solid 1-px bars and the air either side of each is even (1.75 · 1.5 · 1.63 to the top plus, 1.75 · 1.5 · 1.63 to the corner plus); Polaris's short axis dash stays, 2.12 · 2.12 · — at 45° just past the mouth (1.62 · 1.77 · — from its cap) — the one piece that leaves the mouth, so the throw has a direction. Everything is mirror-symmetric about the cone's axis, as Polaris's set is. (3) Sixteen: pieces 6 · 6 · 5 — at 16 the axis dash is dropped, not because it reads grey (it does) but because its far cap lands 1.09 from the upright tick's foot; the five that stay are three crisp 3×3 crosses and two solid ticks; the upright tick's centreline at 9.5 (ink 8.875–10.125, not x.625) is chosen for even air, 1.63 to each plus, and renders as one solid column with 12.5% halos (checked at 1×). (4) Balance: ink box 20 · 16 · 14 square in both styles, the apex ink on the box's bottom-left corner, the pluses' caps on the top and right edges; the outline's mass centre sits 0.15,-0.15 · -0.04,0.05 · -0.23,0.23 from the canvas centre (x, y; S1: -0.7,0.62 · -0.53,0.54 · -1.09,0.58), the filled twin's -1.03,1.03 · -0.66,0.66 · -0.85,0.85 because the cone is solid (S1 filled: -1.65,1.6 · -1.1,1.12 · -1.55,1.16); no declared box — a shift would take the apex off the keyline corner. (5) Filled: the cone solid, every plus and dash a line at the outline weight, no dot; filled outer edge = outline's. Air: cone to the nearest plus 1.55 · 2.51 · 2.97, tick to axis dash 1.59 · 1.59 · —, cone to axis dash 1.62 · 1.77 · —. Smallest air 1.55 · 1.5 · 1.63 outline (cone–plusTop · plusTop–dashUp · plusTop–dashUp), 1.54 · 1.5 · 1.63 filled (cone–plusTop · plusTop–dashUp · plusTop–dashUp). Decimals: every piece coordinate is on the quarter grid at 24 and 20 and the eighth grid at 16; the only off-grid numbers are the cone's bend tangent points, as in every round. At 24, 1× (headless Chrome, both themes): three clean crosses, the upright and level ticks solid single-pixel bars, the axis dash a short grey diagonal; the cone with a spray of bits ahead of its mouth, nothing beside it. At 20, 1×: the same, the crosses a shade softer (half-tone rows). At 16, 1×: cone, three crisp crosses, two solid ticks — beside sparkle-4, sun and sparkle-3 it holds the strip's weight. At 2× every piece is clean at all three masters. (recommended) -->
