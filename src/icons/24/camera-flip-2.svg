  <!-- S2c: Arrow frame, ring lens: Arrow frame with a ring lens: the camera's frame drawn as two arrows chasing round the lens, full refresh heads (90 deg between legs, C10 tips) standing off the top-left and bottom-right corners, one head turned 180 deg about the centre; the lens a ring at every master. Frame corners camera's (r 2.5 · 2 · 1.5). 24: legs 4.95, heads 3.5 off the edges, head air 2.0; lens 6 across (hole 3), air to the legs 1.91, to the frame 2.19; inner leg to the side wall 2.0; sharp points on the grid at 9.75 and 14.25, the runs ending on the bends' apexes at 9.44 and 14.56. 20: lens camera-20's ring, 6 across (hole 3); heads at the run ends 7.5 and 12.5; lens to the heads' inner legs 1.16, to the frame's ends 1.23; inner leg end to the side wall 1.06 (the tightest air, gap note 1.06 both styles); head air 1.0 (C37). 16: lens a ring 5 across (hole 2.5; in the 16 px render it keeps a white middle pixel, 4 fills to a dot, 6 would come within 0.52 of the legs); the frame on the full keyline (centrelines 3.625 and 12.375, frame ink 14x10), heads 2 off the edges, legs 2.83, apex 6.25; head air 0.75 (C37 floor 1), lens to the inner legs 1.02, lens to frame 1.5 (gap note 0.75 both styles). Ink 20x20 · 16x16 · 14x14, centred. Filled: the lens fills as a disc on the ring's outer edge (6 · 6 · 5 across); frame and heads stay lines at the outline weight (a ring with a solid core cannot keep the 1.5 of white a filled cut needs at 16). Off-grid values: the heads' leg ends and tangent points, and at 24 the run ends on the bends' apexes. Weak points: at 20 the inner leg end nearly meets the side wall (1.06, a grey pixel between them); at 16 the heads are small (5 px tall). Picked by Maruti 2026-10-26 as camera-flip-2. -->
