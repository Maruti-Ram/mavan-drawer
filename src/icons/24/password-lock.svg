ed twin, the cut's tangent points. Filled: password-filled's field cut along the lock's ink grown 1.5 (radius 4 · 3.75 · 3.5 round the shackle, then the body's outline grown 1.5), the junctions eased 0.5 as map-pinned's; one dot hole; the lock body solid to its outline's outer edge; the shackle stays a line at 1.5 · 1.5 · 1.25, as lock-filled -->
