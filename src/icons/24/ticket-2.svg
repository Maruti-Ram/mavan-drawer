  <!-- Stub, edge notches: A new picture: the tear-off stub. The notches move from the short ends to the long edges, on the tear line, so the ends stay straight (Nucleo ticket-4, Remix coupon-3; SF Symbols airplane.ticket carries the same perforation). Body box and corners are A1's. The notches use the same flatter arc but smaller, because they cut into the 16 · 12 · 10 height: r 2.75 · 2.25 · 1.875, centre 0.75 · 0.75 · 0.5 outside the edge, bite 2 · 1.5 · 1.375 deep, at A1's tear x. That leaves 1.35 · 0.88 · 1.19 of straight edge before the corner arc. Between the notches the perforation is two dots at 24 (air 1.75 to each notch and 1.5 between the dots). At 20 and 16 it is one dot (air 2 and 1.5), because a second dot cannot keep 1.5 in the 6 · 4.75 of white. The count changing between masters is the one thing to look at. Filled: the dots are cut out as 1.5 slots, and the notches cut the solid. Ink 20×16 · 16×12 · 14×10, identical in both styles. Off-grid numbers are the notch lips. -->
