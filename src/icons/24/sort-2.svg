<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: sort, order, arrange, two arrows -->
  <!-- box: 18x18 -->
  <!-- Cut and staggered: The way out that keeps arrow-up's head completely untouched AND holds §6's 1.5 at every master. Both arrows are cut to about two thirds of the mark height (12.25 of 18 · 11 of 16 · 9.5 of 14) and the down arrow drops so that it begins below the up arrow's head. The up arrow's head-tip then faces the down arrow's TOP CAP rather than the side of its shaft, so the clearance becomes a diagonal: measured 2.441 · 1.987 · 1.556 filled, 2.664 · 2.105 · 1.684 outline. Everything clears with room and nothing is declared. What it costs is ink — 18x18 · 16x16 · 14x14, and at 16 that is the entire drawing bound, 1 to 15 both ways, the largest mark in the set by some way. It also changes the arrow's proportion: a 4.44-deep head on a 9.5-long arrow at 16 is 47% head against arrow-up's 37%, so the arrows read as darts. That is the same family break as narrowing the head, moved from the head to the shaft — and it is a bigger one. -->
  <path d="M3.75 7.69L7.47 3.97A0.75 0.75 0 0 1 8.53 3.97L12.25 7.69"/>
  <path d="M8 3.75V14.5"/>
  <path d="M11.75 16.31L15.47 20.03A0.75 0.75 0 0 0 16.53 20.03L20.25 16.31"/>
  <path d="M16 20.25V9.5"/>
</svg>
