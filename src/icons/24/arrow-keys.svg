<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: arrow keys, cursor keys, direction keys, keyboard, navigate, inverted t, key caps -->
  <!-- box: 19.5x12.5 -->
  <!-- optical: 0 -0.75 -->
  <!-- Four key caps: Rhythm and balance: one even pitch both ways, 7 · 5.75 · 5, so the up key stands exactly one key above the down key and the bottom row keeps one gap; the gap is the same share of a key at every master (1.5 · 1.25 · 1 of air against keys 5.5 · 4.5 · 4 = 0.27 · 0.28 · 0.25), and the cluster is lifted 0.75 · 0.625 · 0.5 because three keys sit low and one high — half the mass offset with the box centred (0.875 · 0.72 · 0.625), rounded to the grid; at 16 that also lands every key edge on a whole pixel (x 1–5 · 6–10 · 11–15, y 3–7 · 8–12). Keys: square, ink 5.5 · 4.5 · 4, centreline radius 1 · 0.75 · 0.625 (outer 1.75 · 1.5 · 1.25, about a third of the key as the shipped square's 3.25 is of 18), counters 2.5 · 1.5 · 1.5. Ink 19.5×12.5 · 16×10.25 · 14×9, declared box. Legend: none — measured, a legend cannot hold its 1.5 of air inside a key this size at any master (a 3-wide caret needs a 9-wide key; three across would need 30 at 24), the same arithmetic as grid-4, whose note records that three hollow squares across die at 20 and 16. Cost, the one decision: at 20 and 16 the keys cannot keep both 1.5 counters and 1.5 gaps inside 16 · 14, so this declares gap 1.25 at 20 and 1 at 16 in both files (the other way to pay is 1.25 counters with 1.625 · 1.375 gaps; at 16 a 1.25 hole in a 3.75 key renders as a grey dot, so the gap pays). Filled: the four keys solid (outer radius 1.75 · 1.5 · 1.25) with the same 1.5 · 1.25 · 1 of white between them. Who: SF Symbols arrowkeys (its arrowkeys.up.filled … right.filled leave the other keys blank), IconPark arrow-keys, Duotone Arrow Keys, Nucleo keys-up-down / keys-left-right (a pair of the same keys). Look-alikes at 16: hierarchy (boxes joined by lines; these have none), grid-4 (tiles in a square), categories. Clear of move: no arrows, no shafts, not a plus. (recommended: it is the arrow-key picture people already know, from SF Symbols to every keyboard, and at 16 it still reads as four keys; its only cost is the declared gap, which is yours to accept) -->
  <path d="M11 5.75H13A1 1 0 0 1 14 6.75V8.75A1 1 0 0 1 13 9.75H11A1 1 0 0 1 10 8.75V6.75A1 1 0 0 1 11 5.75Z"/>
  <path d="M4 12.75H6A1 1 0 0 1 7 13.75V15.75A1 1 0 0 1 6 16.75H4A1 1 0 0 1 3 15.75V13.75A1 1 0 0 1 4 12.75Z"/>
  <path d="M11 12.75H13A1 1 0 0 1 14 13.75V15.75A1 1 0 0 1 13 16.75H11A1 1 0 0 1 10 15.75V13.75A1 1 0 0 1 11 12.75Z"/>
  <path d="M18 12.75H20A1 1 0 0 1 21 13.75V15.75A1 1 0 0 1 20 16.75H18A1 1 0 0 1 17 15.75V13.75A1 1 0 0 1 18 12.75Z"/>
</svg>
