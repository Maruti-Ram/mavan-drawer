  <!-- Swept tip, solid band: Swept tip: a round head a size down from A's (radius 2.75 · 2.25 · 1.875) that leans — the upper-left flank is a convex arc, the lower-right a concave one (both radius 7 · 5.5 · 4.5, touching the point and the bulb), so the point curls down like a stroke of paint leaving the brush. Head 7 · 6 · 5 across, point in the bottom-left box corner, bend 0.75 · 0.75 · 0.625 (C10); the bulb sits 0.18 · 0.16 · 0.12 off the axis, found so the convex flank's ink just meets the box's left edge. a solid band for the ferrule (its inside closed by the stroke), 3 · 3 · 2.5 wide — two strokes, head 2 · 1.5 · 1.25 proud of it. Handle 12.37 · 9.55 · 8.13. All curves, no angle exception. Filled: the head fills to the outline's outer edge, the band is already solid, the handle stays a line at 1.5 · 1.5 · 1.25. Ink 18×18 · 14×14 · 12×12 on the square keyline (as pencil and the shipped paintbrush), centred; filled ink box equals the outline's at every master. Off-grid numbers are tangent points of the round parts; circle centres, cap ends and box edges sit on the grid (quarter at 24 and 20, eighth at 16). The most painterly; the curl is subtle at 24 and mostly gone at 16, and an asymmetric head sits slightly apart from the set's calm geometry. -->
