  <!-- box: 20x18 -->
  <!-- Monitor on a stand: Ink 20x18 · 16x14 · 14x12 (agreed box, as briefcase and folder), box-centred both ways. Screen 20x14 · 16x11 · 14x9 of ink (1.43 · 1.45 · 1.56 : 1), container radius 2.5 · 2 · 1.5. Neck on the centre line, 2.5 · 1.5 · 1.75 of it showing between the screen and the foot (floor 1.5); foot 9 · 7 · 6 of ink (45% · 44% · 43% of the screen). 16 master at stroke 1.25: centrelines on the eighth grid so the screen's outer edges and the foot's bottom are whole pixels; the neck at x 8, as briefcase's clasp, which on a 1.25 line covers two pixel columns at 62% (the same softness the clasp has); foot ends at x 5.625 / 10.375 (calendar's pegs) so its ink runs 5 to 11. Filled: screen solid, outer edge on the outline's (radius 3.25 · 2.75 · 2.125); neck and foot stay lines at 1.5 · 1.5 · 1.25. The plain monitor: a card-like screen with the container radius, a single neck line and a foot a little under half the screen wide. Nothing new enters the set: the box is briefcase's and folder's, the radius is folder's, the foot at 16 has calendar's peg x positions, the neck sits on the centre line as trash's rib and briefcase's clasp. Laptop, tablet, mobile and printer can take the screen from this drawing (recommended). -->
