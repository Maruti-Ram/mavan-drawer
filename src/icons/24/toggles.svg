<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: switches, settings, preferences, options, toggle, on, off, enabled, stacked, pill, ring, joined -->
  <!-- box: 15x18 -->
  <!-- Ring knob on the wall, middle track, on over off: Ring knob on the wall, middle track, on over off: A's switch with the track run out to a 2 : 1 pill, between A (12.5) and C (18) at 24, Maruti's "longer than A, shorter than C". The width is set by one rule at every master rather than a midpoint: the knob travels exactly its own diameter, so its ON and OFF places sit side by side and just touch, the proportion of a Windows / Fluent switch. Knob, hole and pitch are A's: knob ⌀7.5 · 5.5 · 5 (the pill's full height), white inside 4.5 · 2.5 · 2.5, pitch 10.5 · 8.5 · 7. Pill 15×7.5 · 11×5.5 · 10×5 (2 · 2 · 2 wide to tall; A 1.67 · 1.64 · 1.75, C 2.4 · 2.55 · 2.4); knob travel 7.5 · 5.5 · 5. Ink 15×18 · 11×14 · 10×12. Air above, between and below 3 · 3 · 3, 3 · 3 · 3 and 2 · 2 · 2; side margins 4.5 · 4.5 · 3, half as much again as the top and bottom at every master, so the pair sits as a slightly upright block. Only a width of 18 · 14 · 12 (C) makes the sides equal. At 16 every straight edge is on a whole pixel (x 3 and 13, y 2, 7, 9, 14). Between A and C, 10 is the only width at 16 that keeps both ends whole, so there is no second middle point (M2) that holds pixels at 16. The knob end reads by shape: the track's white is a slot 6 · 4 · 3.75 long from its round end to the knob, against the knob's round hole of 4.5 · 2.5 · 2.5 (1.33 · 1.6 · 1.5 times). A's slot and hole were equal at 16 and read as "88"; C's slot is 2.3 times the hole. Tightest air at 16: 2, between the switches; nothing inside a switch is under 2.5. Point-symmetric and centred. How it differs from sliders: each rail is a closed capsule as tall as its ring, 10 wide at 16 where sliders' lines are 12; rows-2 has no ring or hole. Filled: toggle-on-filled and toggle-off-filled at the 2 : 1 length: two solid pills with the knob knocked out and 1.5 of wall round the hole (holes 4.5 · 2.5 · 2, 0.5 smaller at 16 as in toggle-on-filled), solid track beside the hole 9 · 7 · 6.5, white between the pills 3 · 3 · 2. (recommended: the width Maruti asked for, set by one rule at every master, whole pixels at 16, and the knob end reads at 16 in both styles) -->
  <path d="M15.75 3.75H8.25A3 3 0 0 0 8.25 9.75H15.75"/>
  <path d="M12.75 6.75A3 3 0 1 0 18.75 6.75A3 3 0 1 0 12.75 6.75Z"/>
  <path d="M8.25 14.25H15.75A3 3 0 0 1 15.75 20.25H8.25"/>
  <path d="M11.25 17.25A3 3 0 1 1 5.25 17.25A3 3 0 1 1 11.25 17.25Z"/>
</svg>
