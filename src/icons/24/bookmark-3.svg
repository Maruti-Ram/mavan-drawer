nd 1.5 wide for only 1.35 of it (it would need an 11-pixel ribbon to hold). What it costs: at 16 it is the last board's A with a tighter head (radius 1 against 1.5), and its filled twin is the heaviest here, 128 px at 16, 10% above book-4. -->
