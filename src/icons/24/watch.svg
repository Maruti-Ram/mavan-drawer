  <!-- Round, tapered straps: Agreed box 14x20 · 10x16 · 8x14, box-centred. Case a ring 14 · 10 · 8 across the ink (radius 6.25 · 4.25 · 3.375 on the line). Straps narrow away from the case at 8.5 degrees (the references' taper, Lucide 11, Nucleo 9.5; an angle exception under the 10-degree taper doc 07 lists as drawn but not yet allowed): 7 · 5 · 4 of ink across the end, meeting the ring at x 15.35 · 12.3 · 9.91; end corners r1.5 · 1.25 · 1 (detail radius). The strap's end line sits 1.5 · 1.5 · 1.75 of air above the ring (floor 1.5), which is what fixes the case: 3 · 3 · 2.75 of each strap is taken by line plus air, so the case is 14 · 10 · 8. Hands are clock's (minute up, hour at 45 degrees, round join): 3.25 / 2.47 at 24 (0.76), 1.25 / 1.06 at 20; the minute tip sits exactly 1.5 inside the ring. At 16 the face is 5.5 across inside the ring and a hand can be 0.625 long at most, so the hands are removed there (the rule working): the 16 is a blank face. Off-grid values are the fillet tangent points on the slanted sides and the junctions with the ring (computed, 2 · 2 · 3 dp). Filled: the case solid on the outline's outer edge (ring 7 · 5 · 4), the straps kept as bands of the outline's width with their counters punched at true size down to the case's edge (C22, as printer's tray): a strap filled solid melts into the case at 16 and the watch reads as a bead; the hands knocked out at clock-filled's medium cut 2 · 1.76 (0.88 keeps 2 dp at 20), leaving 2.75 · 2.87 of case above the minute tip. The construction Lucide and Nucleo share. -->
