<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: control, ctrl, control key, modifier, key cap, keyboard, shortcut, caret, mac, centred legend -->
  <!-- Caret centred on the cap: Rhythm and balance: the ⌃ centred across the shipped square at checkbox's scale — legend 10 · 8 · 6.5 wide against its tick's 10.27 · 7.81 · 6.5 — with side air 2.5 · 1.5 · 1.5 (checkbox's tick keeps 2.37 · 1.59 · 1.5), and raised by C14's shift so its weight, not its box, sits on the centre. Numbers: cap ink 18×18 · 14×14 · 12×12; legend ink 10×5.44 · 8×4.44 · 6.5×3.616 (0.56 · 0.57 · 0.54 of the cap's width); air to the cap's inner edge: sides 2.5 · 1.5 · 1.5, above 4.41 · 2.98 · 2.699, below 5.15 · 3.58 · 3.185; the caret sits 0.37 · 0.3 · 0.243 above the cap's centre (C14: chevron-up's classic anchor 0.5, scaled by ink height 5.44 · 4.44 · 3.616 against chevron-up's 7.43). Caret: chevron-up's classic construction reused — 45° legs, a right-angle corner on a bend of radius 0.75 · 0.75 · 0.625 (C10's minimum, the same arc chevron-up bends on), round caps; only its size is the legend's. Off-grid decimals are the bend's tangent points and the ends' heights, which the 45° legs and the apex's place put there. Filled: the cap solid (outer radius 3.25 · 2.75 · 2.125), the caret cut out 1.5 wide at every master (C22, so at 16 the white is wider than the 1.25 line): at 24 and 20 the outline caret's own stroke, at 16 its ends pulled in 0.125 along their legs so the white keeps the outline caret's sides and foot, bend 0.75 (outer 1.5, inner corner sharp, as checkbox-filled's tick) — its apex stands 0.07 above the outline caret's top; solid between the cut and the key's outer left edge 4 · 3 · 2.75. Who: Lucide square-chevron-up, which Lucide tags control, ctrl, keyboard and mac; a centred legend on a key is also how Central draws cmd-box and SF Symbols command.square (SF has no control.square). Clash: the same picture is the familiar collapse or back-to-top button (Lucide square-chevron-up, Tabler square-chevron-up), so at 16 it reads as a button as soon as it reads as a key. -->
  <path d="M6.25 3.75H17.75A2.5 2.5 0 0 1 20.25 6.25V17.75A2.5 2.5 0 0 1 17.75 20.25H6.25A2.5 2.5 0 0 1 3.75 17.75V6.25A2.5 2.5 0 0 1 6.25 3.75Z"/>
  <path d="M7.75 13.6L11.47 9.88A0.75 0.75 0 0 1 12.53 9.88L16.25 13.6"/>
