  <!-- Bar cut through: What the eye sees: a struck monitor. The screen opens into two brackets along the bar, the top and right side as one long one and the left and bottom as a shorter one, over the floating stand bar, which stays whole. The play triangle, the one thing that says video here, is gone: at every master it lies inside the cut (all of it at 20 and 16; at 24 only a 2.37 fragment of its tip would be left beside the bar, a speck), and a small closed part the cut reaches is removed. With it gone this is the shipped desktop-2 struck: at 24 video-3's screen and stand are desktop-2's exactly; at 20 and 16 only the screen is taller, 1.5 · 2 on the line (box 16×16 · 14×14 against desktop-2's 16×14 · 14×12). Nothing in it says video; as a button it still shows the thing being switched off when it sits beside video-3. The choice is Maruti's: ship it as that (recommended), or hold video-off-3, which leaves video-3 without its C34 twin (lint warns once the row is listed in STATE_TWINS). The bar (C21, V1 spec): video's bar exactly, centreline (3.75,3.75)-(20.25,20.25) · (3.75,3.75)-(16.25,16.25) · (2.625,2.625)-(13.375,13.375), on video-3's own ink centre 12,12 · 10,10 · 8,8; it sits inside video-3's box, so the ink stays 20×18 · 16×16 · 14×14, the declared box, centred; the TV stays in place (C34). Cut: every stroke stops with 1.5 of air from the bar's edge, measured 1.505 · 1.505 · 1.501 at every cut end; round caps on every cut end. Pieces (24 · 20 · 16): screen top-right 24.67 · 19.43 · 17.00 (top edge from x 8 · 7 · 5.515, round the right side to 57° · 30° · 20° of the bottom-right corner), screen bottom-left 17.43 · 12.64 · 11.08 (left wall from y 7 · 7 · 5.515, bottom edge to x 12 · 9.5 · 7.485), stand 7.5 · 5.5 · 4.75, 1.68 · 1.68 · 1.58 from the bar. Removed: the screen's top-left corner, most of its bottom-right corner, and the play triangle 15.01 · 13.14 · 11.70. Line kept 62 · 57 · 56%. Tightest air between pieces 2.5 · 2 · 1.75, screen to stand, the base's own. Filled: video-3-filled's screen split by a channel 4.5 · 4.5 · 4.25 wide, corners r0.75 · 0.75 · 0.625 centred on the outline's cut ends; two solids, no play hole (it goes with the outline's triangle); white 1.506 · 1.506 · 1.501 each side; the stand a line at 1.5 · 1.5 · 1.25 as in the base; the bar whole. Off-grid decimals are the cut ends and the channel's corners. An offset bar was measured and not drawn: the play spans 6.8 · 6.0 · 5.3 across the bar, so clearing it needs the bar moved about 4.4 · 4.2 · 3.8 square to itself, and the margin allows 1 left, 1 down (1.41); there only 7.03 · 5.79 · 5.29 of its line survives, as a hooked arrow, and the stand loses 1.75 · 1.75 · 1.89 off its right end. (recommended: ship) -->
