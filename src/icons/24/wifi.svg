<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: wireless, internet, three arcs, dot, signal -->
  <!-- Three arcs over a dot: Rhythm: live's dot and radii with one more arc — dot ⌀3 · 2.5 · 2, arcs r5 / 9.25 / 13.5 · 3.75 / 7 / 10.25 · 3.125 / 5.875 / 8.625, pitch 4.25 · 3.25 · 2.75, and the air is the same everywhere it occurs: dot to arc and arc to arc 2.75 · 1.75 · 1.5 (24 is live's 2.75 exactly; 16 sits on the 1.5 floor, so three arcs hold without squeezing and none is dropped). All three arcs end on one radial line, the outer cap landing on the keyline's sides: 46.8 · 45.0 · 42.3° above level. Ink 20×15.75 · 16×12.25 · 14×10.25, landscape keyline, box centre 0.125 below the canvas centre at every master. Balance: a fan is heavy at the top — ink mass sits 2.0 · 1.46 · 1.17 above the canvas centre; by C14's solid-triangle measure (half the mass offset, toward the point) a 1.0 · 0.73 · 0.58 shift down would be the starting point for an optical-sheet pass once the picture is chosen; not shifted here. Filled: as live — the dot thickens in place to ⌀4 · 3 · 2 (air 2.25 · 1.5 · 1.5) and the arcs stay lines at 1.5 · 1.5 · 1.25. The dot is the bottom edge, so it grows the box 0.5 · 0.25 · 0 at the bottom (declared `grows`). A heavier-line twin (rss's way) cannot exist: three arcs at weight 2 with 1.5 of air need 12.5 of height at 20 and 16 inside 12 · 10. At 16 the filled twin is the outline drawing — the dot has no room to grow — so it reads lighter than its filled neighbours there. Who: Lucide, Heroicons, Phosphor (regular), Fluent wifi_1, Carbon, Polaris, Tabler. wifi-off: the C21 `\` bar crosses the three arcs and passes the dot; room on both sides. (recommended) — the picture nearly every set draws for Wi-Fi, built on live's own radii and air, so it sits in the set as one family with live, podcast and radio-tower. -->
  <path d="M11.25 18.5A0.75 0.75 0 1 0 12.75 18.5A0.75 0.75 0 1 0 11.25 18.5Z"/>
  <path d="M8.57 14.86A5 5 0 0 1 15.43 14.86"/>
  <path d="M5.66 11.76A9.25 9.25 0 0 1 18.34 11.76"/>
  <path d="M2.75 8.67A13.5 13.5 0 0 1 21.25 8.67"/>
</svg>
