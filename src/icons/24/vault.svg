  <!-- Strongbox on feet: dial and handle: (recommended) Rhythm: wall · dial · handle · wall gaps are equal, 2.5 · 2 · 2 at 24 · 20 · 16, and the dial clears top and bottom by the same 2.5 · 2 · 2, so the face sits on one even beat. Dial ring ⌀8 · 5.5 · 4.25 (inner air 5 · 2.5 · 1.75); handle 6 · 4 · 3.25 long, about three quarters of the dial; two feet 2 · 1.5 · 1.25 below the body, centred 24–25% in from each side. Body 20×16 · 16×12.5 · 14×10.75, radius 2.5 · 2 · 1.5. Font Awesome (vault), Phosphor (Vault), Untitled UI (safe) and Central (vault) draw this strongbox. Needs an agreed box 20×18 · 16×14 · 14×12 (the briefcase's): in the square keyline, dial + handle + three 1.5 gaps come to 9.75 at 16 and the box holds 9.5. Filled: solid body, dial ring and handle cut 1.5 wide on the outline's centrelines (dial island ⌀5 · 2.5 · 1.5), feet stay lines at 1.5 · 1.5 · 1.25. Why recommended: the only silhouette in the set with feet, and the most air of the five at 16 (2 everywhere), so it still reads as a safe at 16. Watch: ring beside a bar can echo a power I/O mark. -->
