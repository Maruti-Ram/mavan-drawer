<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- keyline: mark -->
  <!-- tags: slash, classic, xml -->
  <!-- Slash, classic brackets: The slash, and with it the mark can only mean code. The brackets keep the shipped chevron's 45 degree legs and C10 bend; the slash runs the whole mark box, 18 / 14 / 12 tall, at 73.1 / 72.3 / 73.2 degrees from the horizontal - where a typed slash stands, and an exception to the 0/45/90 rule (30 and 60 are the only extras already allowed). It overshoots the brackets top and bottom, which is what keeps it reading as a slash and not as a bar. Brackets 4.94x9 / 3.44x6 / 2.87x5: the slash costs three units of bracket height at 24 and 3.5 at 16 against the bare pair at A. The tight spot is each bracket's open end against the slash's run, not the two brackets (they stand 8 / 7 / 6.25 apart): 1.96 / 1.86 / 1.80 in the outline and 1.77 / 1.76 / 1.64 filled. Filled is always the tighter of the pair here, and it is worth knowing why - a bracket's ends pull toward its apex, outward, while the slash's ends pull toward its own centre, inward, so the two close on each other by half the added weight each. Box 17.88x18 / 13.88x14 / 11.98x12. (recommended) it is the only reading that cannot be mistaken for a chevron control, its brackets are the set's own chevron, and of the three slashed drawings it keeps the most air at 16 - 1.64 in the filled twin, where F holds 1.52. -->
  <path d="M7.25 8.25L4.03 11.47A0.75 0.75 0 0 0 4.03 12.53L7.25 15.75"/>
  <path d="M16.75 8.25L19.97 11.47A0.75 0.75 0 0 1 19.97 12.53L16.75 15.75"/>
  <path d="M9.5 20.25L14.5 3.75"/>
</svg>
