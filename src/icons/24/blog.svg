<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: post, article, card, cover, picture -->
  <!-- Post card: (recommended) A post as every blog index shows it: a cover picture over a headline and a shorter line, with no page round it — the post card of Ghost, Substack and Medium front pages and of the Webflow and Framer blog templates; Material feed and Fluent news are picture-over-text pictures of the same kind. It says "a post" at 16 where every page-shaped candidate says "a file": nothing shipped has a picture over lines (image has no text, layout-list has thumbnails beside lines). Rhythm and balance: picture, headline and line on equal gaps (2.25 · 1.75 · 1.5), the headline full width and the second line ragged, so the eye reads title then text; the picture is the image icon's own: frame r2.5 · 2 · 1.5 and its ridge, a 45° climb to a peak of the bend radius (1.5 · 1.25 · 1) and down to the right wall. 24: picture 18×10.5 ink, peak 2.25 below the frame's inner top; headline 18, line 12. 20: picture 14×7.5; headline 14, line 9.5. 16: picture 12×6.5; headline 12, line 8.25; the peak sits 1.5 under the frame and the ridge is short — the mountain is a small bump at 1×, the picture still reads. Filled: the picture fills, sky and mountain solid with the ridge as a 1.5 band of white between them (as image-filled); the lines stay at 1.5 · 1.5 · 1.25. Mass: outline 0.04 · −0.08 · −0.05 right, 0.36 · 0.34 · 0.31 high; filled sits high (−1.9 · −1.22 · −1.14), as any picture-over-text card does — the solid picture over two thin lines. -->
