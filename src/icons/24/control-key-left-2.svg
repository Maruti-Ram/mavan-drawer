<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: control, ctrl, control key, modifier, key cap, keyboard, shortcut, caret, mac, wide key, corner legend -->
  <!-- Wide control key, caret in the corner: Rhythm and balance: A's caret and A's air (left 2.25 · 1.75 · 1.5, top 2.5 · 2 · 1.75) on a key 1.25 keys wide — a real control key's width — so this column changes the key and nothing else. The key is the landscape keyline, credit-card's frame verbatim: 20×16 · 16×12 · 14×10, centreline radius 2.5 · 2 · 1.5 (1.25 · 1.33 · 1.4 : 1, the keyline's own drift at 20 and 16). Numbers: cap ink 20×16 · 16×12 · 14×10; legend ink 6.5×3.69 · 5×2.94 · 4.25×2.491 (0.33 · 0.31 · 0.3 of the cap's width); air to the cap's inner edge: left 2.25 · 1.75 · 1.5, top 2.5 · 2 · 1.75, right 8.25 · 6.25 · 5.75, below 6.81 · 4.06 · 3.259. Caret: chevron-up's classic construction reused — 45° legs, a right-angle corner on a bend of radius 0.75 · 0.75 · 0.625 (C10's minimum, the same arc chevron-up bends on), round caps; only its size is the legend's. Off-grid decimals are the bend's tangent points and the ends' heights, which the 45° legs and the apex's place put there. Filled: the cap solid (outer radius 3.25 · 2.75 · 2.125), the caret cut out 1.5 wide at every master (C22, so at 16 the white is wider than the 1.25 line): at 24 and 20 the outline caret's own stroke, at 16 its ends pulled in 0.125 along their legs so the white keeps the outline caret's sides and foot, bend 0.75 (outer 1.5, inner corner sharp, as checkbox-filled's tick) — its apex stands 0.07 above the outline caret's top; solid between the cut and the key's outer left edge 3.75 · 3.25 · 2.75. Who: the proportion is the keyboard's (PC Ctrl and Mac control keys are about 1.25 keys wide); no icon set ships a wide control key. Clash: this is shipped window's frame exactly (the same 20×16 · 16×12 · 14×10, its three dots in the top-left where the caret sits here) and credit-card's; at 16 it reads as a window before it reads as a key — the closest look-alike on the board. The wider cap also leaves more empty key than A. -->
  <path d="M5.25 4.75H18.75A2.5 2.5 0 0 1 21.25 7.25V16.75A2.5 2.5 0 0 1 18.75 19.25H5.25A2.5 2.5 0 0 1 2.75 16.75V7.25A2.5 2.5 0 0 1 5.25 4.75Z"/>
  <path d="M6.5 10.94L8.47 8.97A0.75 0.75 0 0 1 9.53 8.97L11.5 10.94"/>
</svg>
