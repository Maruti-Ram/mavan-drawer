  <!-- Knob on the piece, half-weight feet: The top knob moves left onto the left piece (knob centre x 6.5 · 5.75 · 4.125, was 8.5 · 7.5 · 5.625; head size, height and stand-proud unchanged), outline and filled together, so nothing overhangs the seam: the head's right edge is at 9.25 · 8.25 · 6.375 against the piece edge 11 · 9.5 · 7.5. Its feet are rounded at half the stroke weight in the filled (0.75 · 0.75 · 0.625, the set's bend radius; outline centreline 1.5 · 1.5 · 1.25, was 1 · 1 · 0.875). The right foot lands on the top edge 0.65 · 0.04 · 0.03 before the seam's 0.5 corner; the left foot lands on the outer corner arc - the piece is 9 · 7.5 · 6.5 wide and the knob's foot needs about all of it, so the left shoulder is the corner itself. Why not a smaller knob instead: trimming the head closes the outline knob's hollow neck below 1.5 (0.74 at 24 for 0.25 less), so the knob moves, it does not shrink. Outline knob neck clear inside stays over 1.75 at every master; the knob head is 3.63 · 3.01 · 2.59 clear of the right piece; narrowest filled air is the seam: 1.5 · 1.49 · 1.25 (1.49 is the shipped seam's 2-dp rounding). Ink 20x20 · 16x16 · 14x14 both styles. (recommended: looked at in real pixels at 16 and 20, both feet now render as clean curves, with no notch and no hook, and the knob still has a small shoulder on the left where the corner rounds into it; B's wider foot removes that shoulder and the left piece starts to read as a bottle. Cost against S: the knob sits in the middle of the piece, not beside the seam, and at 16 the left piece is more dome than shoulders) -->
