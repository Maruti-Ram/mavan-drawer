e's outer edge, cut along the filled dart's ink grown by 1.5 (1.5 of white at every master, 1.5 at 16 as well), the cut's two corners eased r 0.5 · 0.5 · 0.375 where it meets the edges at 70 degrees; the dart is cursor-click-filled's, moved the same 1. Filled ink box identical (recommended) -->
