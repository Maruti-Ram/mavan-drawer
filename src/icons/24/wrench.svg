<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: wrench, spanner, tool, settings, maintenance, fix, repair, build, open end, jaw, diagonal -->
  <!-- Open jaw, 45 degrees: The classic open-end spanner: jaw up to the top-right, straight handle down to a round butt, the whole tool on the 45-degree diagonal, ink 19.98 - 15.98 - 13.98 square on the diagonal keyline. The head's prongs run parallel to the jaw, so the air inside a prong is the same all the way to its tip - that, not the head's size, is what lets an outlined jaw survive 16. Head 12 - 10.75 - 9.5 wide (60% - 67% - 68% of the ink; the head takes a bigger share as the master shrinks because 9.5 is the floor). Jaw 4 - 3.5 - 3 deep. Mouth to butt centre 20.54 - 15.36 - 13.36, of which 6.5 - 6.25 - 5.5 is head before its shoulder and 3.5 - 3 - 2.75 is slanted shoulder, leaving 12.79 - 8.36 - 7.11 of bare handle. Horn corners 2.5 - 2.25 - 2 on the silhouette, so the outline's own arc is 1.75 - 1.5 - 1.375. Handle 4.5 - 4.5 - 4 wide holding exactly 1.5 of air inside it, round butt of radius 2.25 - 2.25 - 2. Jaw opening 2 - 1.75 - 1.5 of air, each prong 5 - 4.5 - 4 wide with 2 - 1.5 - 1.5 of air inside it. Lips are drawn as plain corners, so the round cap rounds them to exactly half a stroke; the jaw floor is flat with a 0.5 - 0.5 - 0.375 fillet. Filled: the silhouette fills solid and the jaw stays a notch of white measured at 1.5. Smallest air anywhere, both styles, every master: 1.5. (recommended) -->
