<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: identity, identification, photo card, license, contact card -->
  <!-- Photo card · gap 1 at 16: The commonest ID picture: a landscape card, a person on the left, two text lines on the right (Lucide id-card, Polaris IdentityCard, SF person.text.rectangle, Material id_card, Heroicons identification, Tabler id, Fluent ContactCard, Phosphor IdentificationCard). Card = credit-card's body (20x16 · 16x12 · 14x10, corners 2.5 · 2 · 1.5) with no stripe, so it cannot be read as a payment card. 24: a ring head 6 across (3 clear) over shoulders drawn as a half dome r 4 cropped by the bottom wall (9.5 wide, 2.5 white inside). 20: a dot head 3 across over an arch 6 wide with 1.5 of white inside. Head-to-top wall and head-to-shoulders 1.5 at both. 16 (Maruti, 2026-10-19): head 2.5 (r 0.625, the largest a stroke closes into a solid dot), centre (6, 7), top air 1.5; head-to-shoulders 1, declared <!— gap: 1 —> on the 16 outline on C19's reasoning that a 1.5 gap beside a 2.5 part leaves a hollow middle; shoulders an arch 4 wide x 2.5 tall, 1.75 from the left wall, whose white inside is 1.5 x 1.25 (under the same note). Lines: ink 4.5 · 3.25 · 2.5 long, pitch 4 · 3 · 2.75, line 1 level with the head; at 16 air top / between / bottom 1.75 / 1.5 / 1.75. Filled: the card fills; head, shoulders and lines are knocked out where the outline has ink (line cuts 1.5 wide), the bottom wall stays as the band under the shoulders; at 16 the 1 between head and shoulders is card, not air, so the filled file needs no note. Ink box 20x16 · 16x12 · 14x10, filled identical. -->
  <path d="M5.25 4.75H18.75A2.5 2.5 0 0 1 21.25 7.25V16.75A2.5 2.5 0 0 1 18.75 19.25H5.25A2.5 2.5 0 0 1 2.75 16.75V7.25A2.5 2.5 0 0 1 5.25 4.75Z"/>
  <path d="M7.5 10A2.25 2.25 0 1 0 12 10A2.25 2.25 0 1 0 7.5 10Z"/>
  <path d="M5.75 19.25A4 4 0 0 1 13.75 19.25"/>
  <path d="M15.25 10H18.25"/>
  <path d="M15.25 14H18.25"/>
