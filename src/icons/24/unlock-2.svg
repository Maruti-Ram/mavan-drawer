  <!-- Keyhole dot, released: lock-2 with its right leg lifted out, exactly as unlock: the arc runs on from the left leg and stops at its 3 o'clock, the end pointing straight down at its socket. Body, keyhole, left leg and arc are lock-2's, identical and in place at every master and in the filled twin, so the toggle changes one line: the right leg. Body top is lock's, flat under the leg, so the opening under the free end (end cap to the body's top edge) is unlock's: 3.5 · 2.5 · 2.375. Ink box 16x20 · 12x16 · 10x14, centred, exactly lock-2's. (recommended) -->
