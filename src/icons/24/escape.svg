<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: esc, escape key, keyboard, letters -->
  <!-- box: 17.5x8.5 -->
  <!-- ESC letters: Rhythm and balance: the key's legend, three capitals on one pitch — the E's arms, the S's two bowls and the C's mouth all on three levels 3.5 · 3 · 2.75 apart (air 2 · 1.5 · 1.5), letter gaps 1.75 · 1.5 · 1.5; S and C bowls r 1.75 · 1.5 · 1.375, E's corners r 0.75 · 0.75 · 0.625. Ink 17.5×8.5 · 15.5×7.5 · 14×6.75, declared box — past the mark ceiling, on the landscape keyline's width. Honest at 16: the three letters hold the 1.5 floor only by filling 14 of the 14 the circle box allows (ink 1 to 15, on the margin) at 6.75 tall, every gap at the floor, and their 1.25 lines fall between pixels and read grey. Lower-case esc does not fit at 16 (the e's bowl needs 2.75 across: 14.75 in all). Filled twin: the letters keep the outline weight (glyph: letter, C32), so it is the same drawing as the outline — at 2 the E's three arms alone need 9 of height against 6.75. Who: Material Design Icons keyboard-esc, Vaadin esc and esc-a; the legend on most keyboards (Apple prints esc). -->
  <path d="M6.75 8.5L4.75 8.5A0.75 0.75 0 0 0 4 9.25L4 14.75A0.75 0.75 0 0 0 4.75 15.5L6.75 15.5"/>
  <path d="M4 12H6.5"/>
  <path d="M13.5 8.5H11.75A1.75 1.75 0 0 0 11.75 12A1.75 1.75 0 0 1 11.75 15.5H10"/>
  <path d="M20 8.5H18.5A1.75 1.75 0 0 0 16.75 10.25V13.75A1.75 1.75 0 0 0 18.5 15.5H20"/>
</svg>
