<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: extension, plugin, integration, add-on, jigsaw, knobs, corner piece -->
  <!-- Corner piece, two knobs: A corner piece: two round knobs, top and right, each on a pinched neck; the other two sides straight. Whole piece (knobs included) on the circle keyline, body corners the calendar/checkbox container radius 2.5 · 2 · 1.5. Ink 20x20 · 16x16 · 14x14; body 15.5x15.5 · 11.75x11.75 · 10x10 outer; knob head 5.5 · 5.5 · 4.75 across, standing 4.5 · 4.25 · 4 proud of the body; neck clear inside 1.7 · 1.95 · 1.65 (floor 1.5), waist 0.4 · 0.27 · 0.3 each side; smallest gap anywhere 1.7 · 1.95 · 1.65. Filled: the piece solid; its edge is the outline's outer edge exactly (every curve offset by half the stroke), no inner lines. Every curve is a tangent arc; where a join lands off the grid this note is its documentation, as with checkbox's tick. (recommended: the only knobs that keep a visible waist at every master (0.4 · 0.27 · 0.3 each side) with at least 1.65 clear inside the neck; the circle keyline leaves the body room (knob head 28 · 34 · 34% of the piece across, against 31 · 39 · 40% in H on the square keyline), and the corners are checkbox's. At 16 in real pixels B's waist disappears and its knobs read as bumps) Knob feet (2026-09-28): The feet where each knob meets the piece are rounded at half the stroke weight in the filled (0.75 · 0.75 · 0.625, the set's bend radius, as puzzle-4; was 0.25 · 0.25 · 0.375, a quarter pixel that rendered as a nick), outline and filled together: outline foot centreline radius 1.5 · 1.5 · 1.25 (was 1 · 1 · 1), the filled edge still the outline's outer edge (same centres, offset by half the stroke). Nothing else changes: the knobs do not move (top knob centre x 9.75 · 8 · 6, right knob centre y 14.25 · 12.25 · 10, as shipped), head 5.5 · 5.5 · 4.75 across, standing 4.5 · 4.25 · 4 proud, body and its corners (2.5 · 2 · 1.5) as shipped. Ink 20x20 · 16x16 · 14x14 both styles. Where the feet land: at 24 and 16 on the straight edge, with 1.15 · 0.05 of straight left beside each foot. At 20 the piece is too narrow for any knob position - the two feet need 6.84 of straight and the edge has 6.25 - so, as puzzle-4's left foot does, each foot rounds straight into the body's corner arc (0.17 past the straight on one side, 0.41 on the other, because each knob sits 0.125 off the body centre to stay on the quarter grid, as shipped); the knob does not move or shrink, and the shoulder is the corner itself. Moving cannot help at 20 and shrinking is not the rule; a 0.25 smaller head at 20 was tried and looks the same in real pixels. Cost against S: the waist gets smaller - the neck is 0.15 · 0.08 · 0.17 narrower than the head each side, was 0.4 · 0.27 · 0.3 - so the knobs read a little more like domes, as puzzle-4's do. Outline knob neck clear inside widens to 2.21 · 2.33 · 1.91 (was 1.7 · 1.95 · 1.65; floor 1.5); the filled piece is one solid shape with no cuts, so no white band to hold. Off-grid decimals are all tangent points, computed and rounded to 2 dp (3 at 16): where a foot leaves the straight edge (24: 6.4 / 13.1, 10.9 / 17.6; 16: 3.172 / 8.828, 7.172 / 12.828), where a foot meets the head (24: 7.83,5.32 / 11.67 and 18.68,12.33 / 16.17 outline, 7.11,5.54 / 12.39 and 18.46,11.61 / 16.89 filled; 20: 6.05,5.18 / 9.95,5.19 and 14.82,10.3 / 14.81,14.2 outline, 5.31,5.34 / 10.68,5.36 and 14.66,9.56 / 14.64,14.93 filled; 16: 4.35,3.958 / 7.65 and 12.042,8.35 / 11.65 outline, 3.761,4.167 / 8.239 and 11.833,7.761 / 12.239 filled), and at 20 where a foot meets a corner arc (4.65,7 / 11.24,7.01 / 13,8.9 / 12.99,15.49 outline; 4.62,6.25 / 11.32,6.27 / 13.75,8.87 / 13.73,15.57 filled). (recommended: looked at in real pixels at 16 and 20, the feet now render as clean curves with no nick, in the same hand as puzzle-4's approved feet; the knob keeps its place and size) -->
  <path d="M2.75 9.75A2.5 2.5 0 0 1 5.25 7.25H6.4A1.5 1.5 0 0 0 7.83 5.32A2 2 0 0 1 9.75 2.75A2 2 0 0 1 11.67 5.32A1.5 1.5 0 0 0 13.1 7.25H14.25A2.5 2.5 0 0 1 16.75 9.75V10.9A1.5 1.5 0 0 0 18.68 12.33A2 2 0 0 1 21.25 14.25A2 2 0 0 1 18.68 16.17A1.5 1.5 0 0 0 16.75 17.6V18.75A2.5 2.5 0 0 1 14.25 21.25H5.25A2.5 2.5 0 0 1 2.75 18.75Z"/>
