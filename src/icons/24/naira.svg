<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- keyline: mark -->
  <!-- tags: naira, ngn, nigerian naira, nigeria, currency, money, sign, two bars -->
  <!-- Two bars: Two bars at every master — the sign as Nigeria writes it, the Unicode reference glyph, and 7 of the 10 system faces measured this session (Helvetica, SF Pro, Menlo, Lucida Grande, Monaco, Courier, Geneva). Bars 4 · 3.5 · 3.5 apart at 10/14 · 8.25/11.75 · 6.25/9.75, exactly the €'s, so € and ₦ share bar count, spacing and overhang. N body 11×16 · 9×13 · 8.5×12 (0.69 · 0.69 · 0.71 as wide as tall — measured this session: Helvetica 0.79, SF Pro 0.68, SF Symbols nairasign 0.65; the widest the slot allows, because every 0.5 of width buys air in the counters the bars cut), stems on whole-pixel edges at 16 (x 4.375 / 11.625), the diagonal 33 · 33 · 34° off vertical, the two corners C10's round join at half the weight (as the shipped Z in sort-alpha). Bars stand 2.25 · 1.75 · 1.375 past each stem, the €'s overhang, round caps as the $'s stubs. Ink 15.5×16 · 12.5×13 · 11.25×12, mark keyline. Point-symmetric — turned 180° about the canvas centre it lands on itself — so the mass centre is the box centre and no optical shift is needed (centroid measured on the raster, below 0.01 off). Cost, measured: where a bar crosses the diagonal the arm-tip air is 3.91 · 2.65 · 2.34 outline, 2.57 · 1.98 · 1.33 filled — at 16 filled under 1.5, so that file carries gap 1.25, the same note Maruti approved on euro-filled at 16 (1.29 there). The white the bars cut out of the N is tight in the filled twin (widest circle between the bars 1.42 · 1.26 · 1.08; the corner above the top bar closes), so at 16 filled it reads dense, as €-filled does. (recommended) -->
  <path d="M7.25 19.25V4.75L16.75 19.25V4.75"/>
  <path d="M5 10H19M5 14H19"/>
</svg>
