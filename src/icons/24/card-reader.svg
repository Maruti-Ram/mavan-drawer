<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: card, plug-in, mobile reader, jack, nucleo, polaris -->
  <!-- Card on a plug-in reader: The card resting in a small plug-in reader with its jack below (Nucleo UI credit-card-reader; Polaris CreditCardReader draws the same with a dome, which I drew first and which read as a desk lamp at 16). The card is credit-card's: the full width (20 · 16 · 14), its corners 2.5 · 2 · 1.5, its stripe 4 · 3 · 2.75 below the top edge, but 14 · 11 · 10 tall instead of 16 · 12 · 10, so the reader fits under it (proportion 1.43 · 1.45 · 1.4; a real card is 1.59). Reader: a rounded box with the detail corners 1.5 · 1.25 · 1, ink 9×8 · 7.5×7 · 6×5.5, rising 2.5 · 2 · 1.75 into the card; the card's bottom edge runs into its walls (the card sits in it). Jack 2 · 1.5 · 1.5 long, to the keyline. Circle keyline 20×20 · 16×16 · 14×14. Filled: the card in two pieces either side of a 1.5 stripe band (as credit-card-filled), a 1.5 ring of white around the reader, the reader solid, the jack a line at 1.5 · 1.5 · 1.25. Thinnest card left between the stripe band and the ring: 3 · 1.5 · 1.25 (at 16 the stripe sits 2.75 below the top, not credit-card's 3, to keep that 1.25). At 16 it can read as a card over a plug or a monitor on a stand: the reader is the smallest thing in the picture. -->
