  <!-- Important label: A's plate with a V-notched tail — Material Symbols label_important, Gmail's importance marker (not in our local references). An adjacent meaning: it would ship as `label-important` (or a later `label-2`), not as plain label. Same box and head as A; the notch is 45° like the head, so it is as deep as half the height, 6.25 · 5.25 · 4.375, its vertex at x 7.59 · 6.59 · 4.94, and the tail corners are 45° points rounded r 1 · 1 · 0.75 (smaller than the head's: a 45° corner at r 1.5 would eat 3.6 of the top edge). Body between notch and tip 14.3 · 11.2 · 9.9 wide. Material's notch is shallower [needs measuring] — off our angles. Filled: solid, no cuts. Rounding the 45° tangent points to 2 dp leaves the two styles' ink 0.01 apart at 24 and 20 (lint clean). Collisions: at 16 it is a fat chevron — reads as "next", a play-forward or a ribbon before it reads as a label. -->
