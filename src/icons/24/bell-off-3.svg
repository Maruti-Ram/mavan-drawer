  <!-- Bar cut through, big dome: What the eye sees: bell-3's big dome cut the same way. Its dome is rounder and wider, so the cut takes the dome's whole upper-left quarter and the left wall stops just below it. Left: the dome from 10:49 · 11:00 · 11:00 round to 3:00 with its short right wall in one piece, a corner of rim and left wall below the bar, and the clapper whole. The icon keeps the bell's box. Bar (C21): \ at 45°, its ink 16 · 12 · 10 square, centreline (4.75,4.75)-(19.25,19.25) · (4.75,4.75)-(15.25,15.25) · (3.625,3.625)-(12.375,12.375), centred on the bell's ink centre 12,12 · 10,10 · 8,8, 20.51 · 14.85 · 12.37 long; it ends flush with the bell's sides and 2 inside its top and bottom, and at 16 its ink ends on whole pixels (3 and 13). Its ends: the upper left stops 1.90 · 1.07 · 0.67 past the dome's cut tip, with 2.06 · 1.69 · 1.59 of air; the lower right stops 2.98 · 1.80 · 1.23 past the clapper, with 3.19 · 2.41 · 1.95 of air to the nearest ink (the right wall at 24, the clapper at 20 and 16). The two ends are not evened: the bar's ink fills the bell's width at both ends and is centred on the bell, so neither end can move without growing the box or taking the bar off centre. The difference is the bell's own shape (the dome curls toward the upper end; the clapper sits low and narrow). Evening the air would mean sliding the bar down, away from the bell's mass, which already sits above its box centre. Cut: 1.5 of air from the bar's edge at every cut end, measured 1.505 · 1.505 · 1.501–1.506. The 16 cut ends stay where the 1.5 puts them: snapping the walls' caps to half pixels would add 0.15 to 0.17 of air, and the rim's 0.26, at single cuts. Kept: the lower-left piece, rim 8.25 · 4.25 · 3.11 and left wall 7.55 · 3.84 · 2.74 (15.80 · 8.09 · 5.85; at 24 the wall runs up to 0.5 below the dome's 9 o'clock); the upper-right piece, dome 14.25 · 9.94 · 8.13 and right wall 5.34 · 3.15 · 2.62 (19.59 · 13.10 · 10.75); the clapper whole, 2.92 · 1.93 · 1.67 of air to the bar. The lower-left piece is 0.81 · 0.62 · 0.54 of the upper-right's length, its shortest leg 2.74 at 16, kept. Removed: the dome's upper left (6.67 · 6.92 · 6.46) and the lower-right corner with the rim's right end (8.95 · 8.87 · 8.18); 69 · 57 · 53% survives. Balance: mass −0.12,−0.04 · +0.02,−0.27 · +0.05,−0.26 from the canvas centre (bell-3 alone 0,+0.11 · 0,−0.28 · 0,−0.29). Ink 16×20 · 12×16 · 10×14, centred, the portrait keyline. Filled: a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side) knocked out of the solid bell. Its corners round at r0.75 · 0.75 · 0.625 about the outline's cut ends, so each solid's tip is the outline's cap; white 1.506 · 1.506 · 1.501 each side. Two solids; the rim-and-wall wedge is 0.62 · 0.45 · 0.39 of the dome's area. The clapper stays a line, 1.67 from the bar at 16, 0.17 outside the channel's edge. The bar runs whole through the channel at 1.5 · 1.5 · 1.25. The dome arc is written in two parts through its top so the rounded cut end cannot tilt it. Off-grid decimals are the cut ends and the channel's corners, where the circles put them. (recommended) -->
