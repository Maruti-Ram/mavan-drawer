  <!-- A star beside a list: A star beside a list: Edge's Favorites button (Fluent StarLineHorizontal3); Chrome and Firefox bookmark a page with a star. The shipped star's construction (inner radius 0.47 of the outer, tips at the mark bend 0.75 · 0.75 · 0.625, sharp inner corners, each tip arc written in two halves through its extreme point) at 11 · 9 · 8 wide; D's three lines beside it on pitch 3.5 · 3.25 · 2.75 (air 2 · 1.75 · 1.5), the same air between star and lines, centred on the star's ink. Ink 20x10.6 · 16x8.7 · 14x7.73 (agreed box; a measured decimal, as star's own box is). Edge fuses its top bar to the star's arm; our 1.5 gap forbids that, so the lines stand apart and the icon comes out short and wide. Filled: star solid, lines stay the outline weight; 56 px at 16 filled, the lightest here (list-bullet 55, star 106). Centroid: outline 0.34 · 0.26 · 0.26 left, filled 1.33 · 0.87 · 0.83 left. What it costs: at 16 the star is 8 px wide with a hole 3.5 across, so the outline reads as a knot beside a menu; and in this set star means favourite, so it blurs bookmark and favourite. Not built on a bookmark. Off-grid decimals are the star's tangent points and its centre, which fall where the circles put them. -->
