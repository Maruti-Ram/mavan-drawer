<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: tapered, smile handle, central, untitled -->
  <!-- Tapered bag, smile handle (recommended): A bag wider at the foot with the handle drawn on its face as a smile (Central shopping-bag-1, Central's default; Untitled shopping-bag-03). Ink 18×18 · 14×14 · 12×12, square keyline; mouth 13.5 · 10.5 · 9.25 wide on the centreline, walls lean 6.2° · 5.5° · 4.7°, all four corners 2.5 · 2 · 1.5. Smile a half circle, radius 3.5 · 2.5 · 2 (B's 3.5 at 24), ends at 7.5 · 7 · 5.625: 2.25 · 1.75 · 1.75 of air under the top, 2.1 · 1.55 · 1.6 to the leaning walls. Recommended: no loop on top, so it cannot be read as a padlock; the taper alone says bag at 16; the filled twin is the strongest silhouette of the five; and its bottom-right corner is plain wall, free for a C33 badge (shopping-bag-plus). Filled: body solid, the smile a 1.5 cut (lint: 5.39 · 3.43 · 2.45 of material left around it). Its risk is the opposite of A's: without a handle above, some readers see a pocket or a basket, not a bag. -->
