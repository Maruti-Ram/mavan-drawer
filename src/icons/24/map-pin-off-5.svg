  <!-- Bar moved 1 right, 1 up: OUTSIDE C21's centred bar, moved with C1: one unit right and one up at every master, 1.41 square to the bar. What the eye sees: the pushpin's head as a cap above the bar, kept from about half past ten over the top to half past four, a short piece of needle below it standing in the ground, and the ground ellipse running round the front to the bar's lower end. Why it moved: centred (E2), the cut takes 8.49 · 8.49 · 7.78 of the vertical needle, which is only 9 · 7 · 6.25 long, so the needle goes at every master and the head over the dish reads as a question mark. Moved, the needle keeps 4.00 · 2.00 · 1.73 at the bottom; the price is the head: 9.86 · 5.23 · 3.82 of 20.42 · 14.14 · 11.78 (48 · 37 · 32%; centred 62 · 58 · 57%). No whole step keeps both: the needle survives only where the bar crosses it near an end. Plainly: at 16 it reads as something struck on a dish, and as a pushpin only beside map-pin-5; it is not as strong as C1. The bar (C21): \ at 45°, the square keyline 18 · 14 · 12, centreline (4.75,2.75)-(21.25,19.25) · (4.75,2.75)-(17.25,15.25) · (3.625,1.625)-(14.375,12.375): centred 1 right and 1 up of the base's ink centre 12,12 · 10,10 · 8,8, its ink reaching the margin edge at its top and right ends. The base stays in place (C34); the composite is 20×20 · 16×16 · 14×14, centred, on the circle keyline. Pieces (24 · 20 · 16): head 9.86 · 5.23 · 3.82, needle 4.00 · 2.00 · 1.73, ground 23.80 · 17.73 · 15.38 of 35.03 · 26.46 · 22.62. Mass from the canvas centre, outline −0.56,+1.49 · −0.47,+1.26 · −0.36,+1.23 (centred E2 −1.19,+1.16 · −1.08,+0.94 · −0.97,+0.90; map-pin-5 0,+2.13 · 0,+1.69 · 0,+1.58); filled −0.44,+0.57 · −0.43,+0.96 · −0.34,+1.03. Filled: the head a solid cap cut by the channel; needle and ground stay lines at the outline weight, cut as in the outline. Cut as cloud-off and bug-off: every stroke stops 1.5 clear of the bar's edge (air at the cut ends measured 1.505 · 1.505–1.512 · 1.501); pieces under 1.5 go; filled, a channel 4.5 · 4.5 · 4.25 wide is knocked out of the solid (corners r0.75 · 0.75 · 0.625 on the outline's cut-end centres), its white 1.506 · 1.506 · 1.501 each side, and the bar runs whole through it at 1.5 · 1.5 · 1.25. Off-grid decimals are the cut ends and the channel corners, where the circles put them; a cut arc that passes its circle's top or side is pinned there (one extra node on the grid) so the ink box stays exactly the base's. (recommended) -->
