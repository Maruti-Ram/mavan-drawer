  <!-- Scalloped awning over building's walls: (recommended) The awning stands 1 proud of the walls on each side, so the silhouette is a canopy over a shop and cannot be read as building (flat box) or home (gable); it holds at 16 in both styles. Ink 18x18 · 14x14 · 12x12 (square keyline, as home); the body is building's tower exactly - walls x 4.75/19.25 · 4.75/15.25 · 3.625/12.375 (outer 16 · 12 · 10 wide), bottom corners r1.5 · 1.25 · 1 - and each wall starts where it crosses the end scallop (y 8.5 · 7.75 · 6.375). Awning: flat top with building's corners (r1.5 · 1.25 · 1), three scallops along its lower edge - chords 5.5 ×3 at 24 (r3, each dips 1.8), 4.25 / 4 / 4.25 at 20 (r2.5 / 2.25, dip 1.18-1.22), 3.625 / 3.5 / 3.625 at 16 (r2 / 1.875, dip 1.15-1.2); the points between scallops sit 3.5 · 3 · 2.75 under the top line (clear 2 · 1.5 · 1.5). Awning ink 6.8 · 5.72 · 5.2 deep (38 · 41 · 43% of the height). Door: home's door (clear 3 · 2 · 1.5 wide, top corners r1.5 · 1.25 · 1); home's height at 24 and 20 (top 14.5 · 11.5), at 16 its top drops 0.25 (9.625, home 9.375) so the filled body keeps 1.5 over the cut. Scallops to door, clear: 3.95 · 2.03 · 1.8. Filled: awning solid, the body a solid block from 1.5 under the awning (top 11.5 · 10.25 · 8.75), top corners r0.75 · 0.75 · 0.625 (half the stroke, as building-4 rounds its cut), door cut at its clear opening. Block as wide as the walls (16 · 12 · 10). -->
