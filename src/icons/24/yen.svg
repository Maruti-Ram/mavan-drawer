  <!-- keyline: mark -->
  <!-- tags: yen, yuan, renminbi, currency, money, two bars -->
  <!-- Two bars, pointed fork: Straight arms meeting at a point, two bars, the top one on the fork — the construction of SF Symbols (arms 33.5° off vertical, top bar on the fork), Central (40.6°) and Untitled (39°, top bar through the fork). Arms 37.2 · 39 · 39.2° off vertical (filled 36.5 · 38.7 · 38.7). Even vertical rhythm at 24 and 20: fork, lower bar and foot step 4 · 3.5 apart (12 → 16 → 20; 9.5 → 13 → 16.5); at 16 the bars sit 3.5 apart as the €’s (7.375, 10.875), the top bar’s lower edge on a whole pixel, foot 3.125 below. White between the bars 2.5 · 2 · 2.25 outline, 1.5 at every master filled. Ink 12.5×16 · 10×13 · 9×12 (the € 12.79×16 · 10.64×13 · 9.4×12: same cap height, a touch narrower), mark keyline, symmetric, so centred with no optical shift. Bars 9 · 7.5 · 6.75 long (the € bar is 8.75 · 7.5 · 6.875; ¥’s ends must sit on the stem’s centre, so 24 and 16 round to the nearest grid step), 0.72 · 0.75 · 0.75 of the arms’ span — SF Symbols 0.80, Central 0.81. Filled at 2.5 · 2 · 2, arm tips and foot pulled in by half the added weight so the ink box is identical; the filled bars keep the outline’s ink length. The one tight spot: the corner between each arm and the top bar, measured as §6 measures crossing arms (equal reach), holds 1.84 · 1.08 · 1.11 of air outline and 0.42 · 0.38 · 0.06 filled — it fills in to a solid shoulder in the filled twin at 16, as SF Symbols’ bold ¥ does. Lint does not judge it (the bar meets the fork; it does not cross an arm), so no gap note; it is the inside corner of the letter, not air between parts. Reads as ¥ at 16 in both styles. (recommended) -->
  <path d="M6.5 4.75L12 12L17.5 4.75"/>
  <path d="M12 12V19.25"/>
  <path d="M8.25 12H15.75"/>
  <path d="M8.25 16H15.75"/>
