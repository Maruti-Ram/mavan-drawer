<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: pill, track, fill, line, short -->
  <!-- anchor: progress-bar -->
  <!-- Fill at 40%: A's track with the fill stopping at two-fifths: line ink 5→10 · 5→8.5 · 3.75→6.5, i.e. 40 · 41 · 39% of the pill's width (A is 57 · 59 · 59%). The eye sees a capsule with a short dash in its left end and a long empty right — clearly "just started", with most of the bar still to come. At 16 the dash is 2.75 of ink: in real pixels (headless Chrome, 1×) it is a two-pixel grey blob and reads as a dot in the capsule's left end, not a dash — this length does not survive 16 in the outline. Air to the left wall 1.5 at every master, above and below as A. Filled: the hole is a long slot — 10.5×7 · 8×5 · 7×5, flat left edge, round right end — which is the opposite of toggle-on-filled's round ⌀5 hole at 16: a 7-wide slot cannot be read as a knob. This is the variation whose filled twin is furthest from the toggle. The question it asks is whether 40% reads as "in progress" or as "barely begun" -->
  <path d="M7 7.75H17A4.25 4.25 0 0 1 17 16.25H7A4.25 4.25 0 0 1 7 7.75Z"/>
  <path d="M5.75 12H9.25"/>
</svg>
