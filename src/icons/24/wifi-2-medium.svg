  <!-- Fan, medium: Level family member (C28), anchored to wifi-2: the fan frame, untouched, with a solid fan inside it two thirds full — Material's outlined signal_wifi_3_bar. Rhythm: the solid keeps 1.5 of white to the frame's sides and point (its own point sits 3.46 · 3.16 · 2.8 above the fan's), and the span from that point to the frame's inner top (14.5 · 10.25 · 8.375 about the fan's point) is cut in three equal steps of 3.68 · 2.36 · 1.86: the low solid's top at 7.14 · 5.52 · 4.66, this one's at 10.82 · 7.89 · 6.52, and the third step is the white under the frame (3.68 · 2.36 · 1.86 here, so never under 1.5). Two levels, not three: a fourth step needs 1.5 of white in steps of 2.76 · 1.77 · 1.39, which 16 cannot hold, so the high level is dropped at every master and the full fan is the top step. Outline: the outline format has no fills, so the solid is drawn with the pen as battery's charge bar is — its boundary, then arcs about the fan's point 1.2 · 1.2 · 1 apart, a little under one line so they overlap (3 · 1 · 1 runs), each step along a side retracing the boundary, the path closed; measured white left inside it under 0.01. Ink = wifi-2's box at every master. Filled: the same level, heavier — everything below the level's top is one solid with the frame (the 1.5 band closes), the fan above it an outline at 1.5 · 1.5 · 1.25 with 3.68 · 2.36 · 1.86 of white under the top. Who: Material signal_wifi_3_bar (outlined and filled), Android status bar. -->
