  <!-- Heart on the corner: Heart on the corner: the shipped file (default shape: fold top-right, chamfer 6 · 5 · 4), unchanged and in place (ink 16×20 · 12×16 · 10×14, x 4–20 · 4–16 · 3–13), with the shipped heart as a C33 shape badge on its bottom-right corner, the badge's ink corner on the margin edge (22 · 18 · 15), as file-clock and file-plus. Heart: `heart`, not `heart-2` — file-heart is unnumbered, so it takes the default shape (C9), and heart-2's facets would not survive the size (its chamfer 3 and flat top 2.38 at 24 become 1.5 and 1.2, under the line itself). Built exactly as heart builds itself: two round lobes, a notch bend and a point bend at half the weight (C10: 0.75 · 0.75 · 0.625 on the line), straight flanks tangent to lobe and point. Size and proportion: at 24 it is the heart's outline halved (outer lobe radius 6 → 3, lobe centres 4 → 2 either side of the axis, width 20 → 10); the three masters share that one silhouette — outer lobe radius about 0.3 of the width, lobe centres about 0.2 of it out — at 10 · 7.5 · 6.5 wide. It cannot be smaller: at 20 and 16 these are the smallest lobes whose inside holds 1.5 across (lobe radius on the line 2.25 · 1.5 · 1.375, inside 3 · 1.5 · 1.5; lint §5f); lobes of 1.25 · 1.125 leave 1.0 and lint says so. Height is set by the flanks, held at the heart's 45 deg rather than halving its 18: 43.8 · 44.1 · 44.0 deg (heart 45.54 · 44.5 · 45.22); halved to 10×9 the point steepens to 48.3 deg, because C10's point bend does not halve. Badge ink 10×8.5 · 7.5×6.25 · 6.5×5.5 (x 12–22, y 13.5–22 · x 10.5–18, y 11.75–18 · x 8.5–15, y 9.5–15), filled identical; between file-plus's 8 · 6 · 5 and file-clock's ring 10 · 9.5 · 9, about password-lock's lock (8×9.5 · 7×8.25 · 6×7). Notch 0.76 · 0.57 · 0.44 deep (9.0 · 9.2 · 8.0% of the height; heart 8.49 · 9.19 · 13.2%). Inside air (lint §5i) 3.97 · 2.24 · 2.14. Axis x 17 · 14.25 · 11.75; at 16 the left edge 8.5 and top 9.5 sit on half pixels: 6.5 is the narrowest heart with those lobes and a notch you can see (6 wide leaves 0.27 of notch). Box 18×20 · 14×16 · 12×14 (declared): the file's 16×20 · 12×16 · 10×14 plus the 2 the heart stands right of it; centre 13,12 · 11,10 · 9,8, 1 right of the canvas centre, so base: file, as file-clock and file-plus (the base kept in place, as user-lock was approved 2026-10-25); lint holds the composite to the file's left, top and bottom edges. Cut back by hand with 1.5 of air from the heart's ink: the bottom-right corner arc goes whole at every master. Right wall stops at y 11.25 · 9.5 · 7.375 (cap ink to 12 · 10.25 · 8), 2.5 · 1.75 · 1.625 past the chamfer corner (y 8.75 · 7.75 · 5.75), air to the right lobe 1.51 · 1.53 · 1.55. Bottom wall stops at x 12.25 · 9.5 · 7.5 (cap ink to 13 · 10.25 · 8.125), 5 · 2.75 · 2.375 past its corner (x 7.25 · 6.75 · 5.125), air to the left flank (at 20 and 16 where it leaves the lobe) 1.58 · 1.60 · 1.53. Fold and chamfer untouched: the fold's foot is 4 · 3.25 · 3.125 above the heart. The kept segments are file's strings verbatim, the path opened at the bottom wall's cut end. Tightest air, file to heart: outline 1.51 · 1.53 · 1.53 (24 and 20 the right wall's end; 16 the bottom wall's end); filled 1.50 · 1.50 · 1.50. Filled: file-filled's sheet cut along the heart's ink grown 1.5 (lobes radius 4.5 · 3.75 · 3.5, the left flank 1.5 out), the junctions with the right edge and the bottom edge eased 0.5 as map-pinned's, and the point of sheet the cut leaves above the heart's notch (where the two grown lobes meet, 1.85 · 1.80 · 1.74 above the notch's V) eased 0.5 too, so the white round the heart stays one even 1.5; the flap untouched. The sheet left under the fold, between its notch and the cut, is 2.5 · 1.75 · 1.5 thick (C33's floor at the line weight 1.5 · 1.5 · 1.25); it ends at the right edge rounded by the notch's own 0.5 corner and the 0.5 ease (straight edge left 1.52 · 0.75 · 0.53). The heart solid as heart-filled draws it: outer lobes 3 · 2.25 · 2, point bend 1.5 · 1.5 · 1.25 on the outer edge, the notch a V where the lobes cross. Off-grid decimals: the heart's tangent points (notch bend, both ends of each flank), fixed by the construction as in heart — every radius, lobe centre, lobe top and side and the point are on the quarter grid (eighth at 16); in the filled twin the cut's tangent points and 0.5 fillets, rounded away from the heart so the air never measures under 1.5. (recommended: the rules decide it; Polaris PageHeart and Nucleo file-heart put the heart on the bottom-right corner as C33 does, Lucide file-heart on the bottom-left) -->
