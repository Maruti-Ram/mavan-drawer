<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: scan, viewfinder, scan barcode, corners, brackets -->
  <!-- Bars in viewfinder: Rhythm: maximize's corners exactly — spread 18 · 14 · 12, radius 2.5 · 2 · 1.5, arms 6 · 4.75 · 4 of ink — as scan and qr-code draw them, so the three sit as one family. Inside, a thick + thin pair (3/1.5 · 3/1.5 · 2.5/1.25, the thick bar a flat-topped block as A's) with air 3 · 2 · 2 between them; the pair is half the corners' inner width, 7.5×9 · 6.5×7 · 5.75×6.5, centred, with 3.75 · 2.25 · 1.875 of air to the corners at the sides and 3 · 2 · 1.5 at top and bottom. Two bars, not three: inside maximize's corners the room is 12 · 8 · 6.5, and three bars at 16 need 6.75 in the outline, three filled bars at 20 need 9. Ink 18×18 · 14×14 · 12×12 (square keyline), outline and filled. Filled: maximize-5's precedent — the corners stay at the line weight 1.5 · 1.5 · 1.25, the bars fill in place, widened 0.5 · 0.25 · 0.25 a side (thick 4 · 3.5 · 3, thin 2.5 · 2 · 1.75), air between 2 · 1.5 · 1.5, to the corners 3.25 · 2 · 1.625; at 16 the thin bar stops at 1.75, as 2 would leave the pair 1.25 apart. Who: Lucide scan-barcode, Phosphor barcode, Tabler barcode, Polaris barcode, Fluent barcode-scanner, Material Symbols barcode_scanner, MDI barcode-scan, Bootstrap upc-scan, SF Symbols barcode.viewfinder. Reads as scan-barcode as much as barcode; worth keeping for that composite beside scan. -->
