<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: avatar, profile, account, person, profile picture -->
  <!-- Cropped by the frame: The avatar: `user` sits in `circle` the way a profile picture sits in a round frame, and the ring cuts the figure off at the bottom (Lucide circle-user and circle-user-round, Polaris Profile, SF Symbols person.crop.circle: every reference crops). The figure is `user` verbatim (head ⌀8 · 6 · 5 of ink, centreline r 3.25 · 2.25 · 1.875; dome centreline r 7.25 · 5.25 · 4.375, 16 · 12 · 10 wide, head = half the dome at every master; head-to-shoulder air 1.5 · 1.5 · 1.5, exact: each dome is two arcs through its on-grid apex (12, 15.25) · (10, 13.25) · (8, 11.125), so the 2 dp join points cannot drift its centre), moved down 3 · 3 · 3 and its base removed, as user's own note foresaw ("in a ring the base simply disappears"). Ring = circle, verbatim (outer ⌀20 · 16 · 14). Head-top air to the ring 1.5 · 1.5 · 1.75 (moved 3 so the head's top and bottom stay on whole pixels; at 16 the 5-wide head keeps user's half-pixel sides). Air inside the head 5 · 3 · 2.5. The shoulders end on the ring's centreline, a join, not a gap: the dome meets the ring at 78 · 84.06 · 86.37° (near square, so no sliver). Join points (5.75, 18.82) · (5.55, 15.72) · (4.289, 13.183) and their mirrors are off-grid where the ring crosses the dome, by construction (within 0.003 · 0.003 · 0.0005 of the ring's centreline and the dome). Visible shoulders 12.49 · 8.91 · 7.42 across on the centreline; the white inside the shoulders 4.5 · 2.5 · 2 tall (its widest circle). Moving the figure down 4 was measured and dropped: that white closes to 1.5 at 20 and 1 at 16. Filled: the set's ring rule (check-circle, accessibility): the disc goes solid and the figure is cut out of it, head and shoulders in white on the outline's outer edges (head r 4 · 3 · 2.5, user-filled's head; shoulders the dome's outer edge r 8 · 6 · 5, user-filled's body), stopped at the ring's inner edge so the rim keeps the line weight 1.5 · 1.5 · 1.25 below them (id-card cuts its shoulders against its bottom wall the same way). Chosen over a solid figure inside an open ring because every filled ring in the set is a solid disc, and the open ring with a solid figure would be the only filled container that stays hollow. Material head-to-shoulders 1.5 · 1.5 · 1.5, exact: the shoulder cut is likewise two arcs through its apex (12, 14.5) · (10, 12.5) · (8, 10.5) (floor 1.5 · 1.5 · 1.25). The shoulder cut meets the rim at 101° · 94° · 92°, a corner against a wall of line weight (C1 exempts it, as id-card's). Off-grid: the cut's corners (5.64, 17.64) · (5.43, 14.62) · (4.169, 12.288) and mirrors, where the circles meet (within 0.004 · 0.005 · 0.0006 of both). Ink box 20×20 · 16×16 · 14×14 in both styles. In real pixels at 16 the head ring and the shoulder curve read as a person at once. (recommended) -->
  <path d="M2.75 12A9.25 9.25 0 1 0 21.25 12A9.25 9.25 0 1 0 2.75 12Z"/>
  <path d="M8.75 9A3.25 3.25 0 1 0 15.25 9A3.25 3.25 0 1 0 8.75 9Z"/>
  <path d="M5.75 18.82A7.25 7.25 0 0 1 12 15.25A7.25 7.25 0 0 1 18.25 18.82"/>
</svg>
