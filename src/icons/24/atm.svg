<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: slot, banknote, cash out, withdraw, cash machine -->
  <!-- Whole note into the housing: (recommended) The note entering the slot, whole: A1's housing open where the note passes, and the note drawn closed, its top edge 1.5 inside the housing (Nucleo atm-machine-bill-coin, set 53, the most finished of the references). Housing as A1 (ink 7.5 · 7.5 · 6.75 tall, corners 2.5 · 2 · 1.5, shoulders 1.5 · 1.25 · 1, step to the note 3 at every master). Note as wide as A1's, 14 · 10 · 8 of ink, its top 1.5 below the housing's at every master and its walls 1.5 · 1.5 · 1.75 clear of the housing's, top corners 1.5 · 1.25 · 1, foot corners 2.5 · 2 · 1.5. The mark is cash's at every master and sits exactly where A1's does, centred in what shows below the housing: ring r 2.75 at 24, dot 3 · 1.75 at 20 · 16, 2 · 2 · 1.875 clear. Filled: the housing a solid arch notched round the note with 1.5 of white (1.5 · 1.5 · 1.25 left over the notch, feet 1.5 wide), the note a second solid with its ring cut white or its dot a hole. Why it is the pick: the note is cash's note, closed and marked at every size, and the housing over it reads as a slot, not a lid — the note's top shows inside it — and its filled twin, an arch over a marked note, is the clearest of the five at 16. Where to look: at 16 the white between the note's top and the housing is the 1.5 floor. -->
