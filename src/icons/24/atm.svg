  <path d="M7.25 5.75H16.75A1.5 1.5 0 0 1 18.25 7.25V18.75A2.5 2.5 0 0 1 15.75 21.25H8.25A2.5 2.5 0 0 1 5.75 18.75V7.25A1.5 1.5 0 0 1 7.25 5.75Z"/>
  <path d="M9.25 15A2.75 2.75 0 1 0 14.75 15A2.75 2.75 0 1 0 9.25 15Z"/>
