  <!-- Ball: What you see: a lighter, modern anchor: a solid ball instead of the ring, a narrower bowl with round ends, the crown 1 below the bowl. BALANCE: round 1's ball (D) had its stock tight under the ball (air 2 · 1.5 · 1.5) and hooks turning in, so the top clustered; here the stock drops to y 9.5 · 7.75 · 6.375 (air 3.75 · 2 · 2.25) and the arms end plainly. The ball, ⌀3 · 3 · 2.5 (the largest a stroke draws solid), is 19 · 25 · 25% of the width, so this is the least top-heavy of the five (24 · 25 · 26% of the ink above the stock; round 1 D: 18 · 21 · 21%), but at 24 its mass also sits lowest of the five: 1.86 below the canvas centre (1.09 · 1.05 at 20 · 16; filled 1.94 · 1.18 · 1.15), and at 24 it can read as a pin standing in a cup. Portrait keyline 16×20 · 12×16 · 10×14; bowl r 7.25 · 5.25 · 4.375 (microphone's cradle radius at 24 and 16). DEFINITION: the ball has no hole to go grey, so the head is a solid dot at every size; stem centred: two columns at 62.5% at 16; stock on y 9.5 · 7.75 · 6.375, one solid row. REFINEMENT: ball, stem, stock, bowl and round ends, nothing else (round 1's inward hooks reached 1.625 past the arm at 16, a stub); stock 6 · 6 · 4 long in ink. Tightest air 3.75 · 2 · 2.25 (ball to stock); filled 3.25 · 1.75 · 1.88. Filled: nothing is left to fill (the ball is already solid), so this is the line-heavy twin: lines at 2.5 · 2 · 2, the ball the same size, the bowl radius pulled in 0.5 · 0.25 · 0.375 and the stock and stem ends by the same, so the ink box is identical. In it the ball is only 0.5 wider than the lines, so the filled anchor reads as a bold anchor with a knob on top. -->
