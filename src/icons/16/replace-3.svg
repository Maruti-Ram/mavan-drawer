  <!-- a becomes b: Microsoft Office's Replace button (ab → ac) and codicons replace: one letter becoming another. Rhythm and balance: a at top left, b at bottom right, one hook (translate's bottom hook) from under the a round the corner into the b; the empty top-right corner left it 1.18 · 0.92 · 0.83 left and 1.25 · 0.94 · 0.74 low, so the drawing moves 1 right and 1 up at every master (C14 note, optical: 1 -1) and ends within 0.18 / 0.25 · 0.08 / 0.06 · 0.17 / 0.26 of centre outline, 0.59 / 0.72 · 0.11 / 0.15 · 0.07 / 0.03 filled. FOR MARUTI TO RULE: the shift uses C14's note on a composite, a new use. Box 18 · 14 · 12 on the square keyline, shifted. Letters are geometric lowercase, round bowls with tangent stems. The a now ends in a tail that turns out along the baseline (radius 1.25 · 0.75 · 0.75), so it no longer reads as o or d; its bowl is radius 3 · 2.25 · 1.875 (x-height ink 7.5 · 6 · 5.25, counters 4.5 · 3 · 2.5). The b's bowl is radius 2.5 · 2 · 1.5 with its ascender 2.75 · 2.25 · 2 above it, for less weight at the bottom. Hook bend 2.5 · 1.5 · 1.25, head legs 2.5 · 2 · 1.5 either side; the rail sits 0.5 · 0.25 · 0.5 above the b's bowl centre. Air: tip to b 1.75 · 1.75 · 1.5, a to hook 2.43 · 2.19 · 1.87, the a's tail to the b's ascender 2.19 at 20. Filled: the hook at 2.5 · 2 · 2 with its ends pulled in; the letters keep the outline weight (C32, glyph: letter). The filled head now keeps the outline head's full reach (2.5 · 2 · 1.5 either side, not pulled in to 2 · 1.75 · 1.125), so it reads as a head rather than a knob. Its V still closes: a leg's air to its shaft is reach minus weight (0 · 0 · −0.5), and opening it to 0.75 needs 3.25 · 2.75 · 2.75 of reach, which at 20 and 16 runs into the a. New to the set: lowercase letters (translate and sort use capitals). Capital A → B does not fit: a B with two 1.5 counters needs 6.75 of height at 16. -->
