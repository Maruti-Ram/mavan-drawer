  <!-- Layers in the sun's place: image's mountain verbatim and in place; the sun goes and in its place, out of the top-left corner, a layers badge: the shipped layers with two tiers instead of three, its diamond solid as layers-filled draws its top tier. Badge ink 8x8 · 6.5x7.5 · 6.5x6.5, its ink corner on the margin edge 2,2 · 2,2 · 1,1; diamond 6.5x3 · 5x2.5 · 5.25x2.25 on the line, slopes 24.8 · 26.6 · 23.2 degrees (layers 24.4 · 23.7 · 24.9); chevron one pitch down, 3.5 · 3.5 · 3, air between the tiers 1.68 · 1.63 · 1.51. The diamond is two closed triangles on its long diagonal, each thin enough for the stroke to fill (inside radius 0.71 · 0.59 · 0.54 under half the stroke), so it draws solid in both styles, as image-sparkle's spark does: drawn hollow with 1.5 of white inside, that white rendered as one grey pixel at 20 and 16 and the badge read as an eye. Why the sun's corner and not C33's bottom right: drawn first at the bottom right, the badge takes the mountain's peak and right leg at every master and the stub of slope beside the stub of bottom wall reads as a down-left arrow at 20 and 16 (rendered); image-sparkle, picked on this base, puts its spark in the same corner. Departing from C33's corner is Maruti's call. At 20 the badge is 6.5 wide, not 7: at 7 the filled sky between the cut and the mountain band would be 1.43, under 1.5. Box 19x19 · 15x15 · 13x13, centre 0.5 toward the badge (11.5 · 9.5 · 7.5), as image-sparkle. Cut back by hand with 1.5 of air from the badge's ink: the top-left corner arc goes; the top wall starts at x 12.25 · 10.75 · 9.625 (5.5 · 3.5 · 2.25 before its corner), air 1.54 · 1.51 · 1.50 to the diamond's right tip; the left wall starts at y 11.52 · 11.36 · 9.171 (6.23 · 2.89 · 2.70 before its corner), air 1.50 · 1.51 · 1.50 to the chevron, its end where its cap meets the 1.5 exactly. Mountain untouched, air to the badge 5.42 · 3.27 · 2.26. Filled: image-filled's sky without the sun hole, cut along the badge's ink grown 1.5 (radius 2.25 · 2.25 · 2.125 round its lines, closed by a straight edge down x 11.5 · 10 · 9 from the chevron's end to the top wall); each wall ends in its own cap, r0.75 · 0.75 · 0.625, the left cap on the cut and the top cap's edge on the straight edge, so no eases are needed; the badge is the outline's ink. At 16 the sky under the chevron's end would be 0.63 thick between the cut and the band, under the 1.25 floor, so the band opens into the cut there: the sky splits into the main sky and a piece on the left wall, each ending in a round r0.625 (1.25 of solid at the tip), 1.82 of white between them; at 24 and 20 it holds 3.9 · 1.77. Tightest air outline 1.50 · 1.51 · 1.50, filled 1.50 · 1.50 · 1.50. Ink box identical in both styles. Off-grid decimals: image's own; the left wall's end (its cap on the 1.5, rounded away from the badge); in the filled the cut's tangent points rounded away from the badge and the tip rounds' tangent points -->
