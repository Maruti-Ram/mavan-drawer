  <!-- Paperclip on the corner: Clip on the corner: the shipped file (default shape: fold top-right, chamfer 6 · 5 · 4), unchanged and in place (ink 16×20 · 12×16 · 10×14, x 4–20 · 4–16 · 3–13), with the set's paperclip as a C33 line badge on its bottom-right corner, the badge's ink corner on the margin edge (22 · 18 · 15), as file-down-2, file-heart and file-clock. The clip is `attachment`, the default upright clip, not a numbered one: file-attachment is unnumbered, so it takes the default shape (C9), as file-heart takes `heart`; its legs are upright, so at 16 they land on whole pixels, where attachment-3 and -4 (tilted) render as grey steps (their own note); attachment-2's four legs need 10.5 · 10.5 · 9.5 of width at the gap floor, wider than any file badge. It is attachment's construction rebuilt at badge size, not scaled: one spiral — outer leg, big turn at the bottom, up the left side, a small hook over the top, an inner leg hanging inside the big turn. Scaled to the badge's height (0.48 · 0.5 · 0.5) attachment's legs would stand 2–2.4 apart, 0.5–1.1 of air, so the legs keep the gap floor instead: 3 · 3 · 3 and 3 · 3 · 2.75 apart on the line, 1.5 · 1.5 · 1.75 of air inside the hook and 1.5 · 1.5 · 1.5 between the inner and outer legs (attachment: 4.5 and 5 · 4 and 4.5 · 4 and 4.75 apart). Hook radius 1.5 at every master, bottom turn 3 · 3 · 2.875 (attachment 2.25 and 4.75 · 2 and 4.25 · 2 and 4.375). The inner leg ends level with the bottom turn's centre (y 18.25 · 14.25 · 11.5), the lowest end that keeps 1.5 to the turn; the outer leg's free end is level with the hook's centre (y 14.75 · 12.25 · 10.125; attachment ends it 0.5 · 0.25 · 0.25 lower), so at badge size all three straight legs are one length, 3.5 · 2 · 1.375. That is the cost: the turns do not shrink with the clip, so it is stubbier than attachment (7.5×9.5 against 11×20 at 24, square at 16). At 16 the left and outer legs keep whole-pixel outer edges (x 8 and 15) and the inner leg sits at 11.625 so the hook keeps one clear pixel column inside it (x 10); the 1.5 between the inner and outer legs renders as two light columns. Badge ink 7.5×9.5 · 7.5×8 · 7×7 (x 14.5–22, y 12.5–22 · x 10.5–18, y 10–18 · x 8–15, y 8–15), filled identical: the file family's badge height (file-clock's ring 9.5 · 8 · 7, file-down-2's arrow 9.5 · 8 · 7.125); at 20 and 16 the fold caps it, the hook's top 1.5 · 1.625 under the fold's foot (3.0 at 24). Box 18×20 · 14×16 · 12×14 (declared): the file's 16×20 · 12×16 · 10×14 plus the 2 the clip stands right of it; centre 13,12 · 11,10 · 9,8, 1 right of the canvas centre at every master. The base keeps its place, so the files declare <!— base: file —> and lint holds the composite to the file's left and top edges, as file-down-2 and file-heart. Cut back by hand with 1.5 of air from the clip's ink. The bottom-right corner arc goes whole at every master. Right wall: stops at y 11 at 24 (cap ink to 11.75), 2.25 past the chamfer corner (8.75), air 1.507 to the hook; at 20 and 16 only 0.76 · 0.77 could stay past the corner (under the 1.5 a wall needs to stay), so the page ends at the fold corner, as file-down-2 and file-clock do there, air 2.15 · 2.17 to the hook. Bottom wall: stops at x 13 · 9 · 6.625 (cap ink to 12.25 · 8.25 · 6), 5.75 · 2.25 · 1.5 past its corner (x 7.25 · 6.75 · 5.125), air 1.547 · 1.547 · 1.535 to the bottom turn. Fold untouched. The kept segments are file's strings verbatim, the path opened at the bottom wall's cut end. Tightest air, file to clip: outline 1.507 · 1.5 · 1.535 (24 the right wall's end; 20 the fold's foot to the hook's top; 16 the bottom wall's end); filled 1.50 · 1.50 · 1.50. Filled: file-filled's sheet cut along the clip's ink grown 1.5 (the hook a circle of radius 3.75 · 3.75 · 3.625, the left leg's side x 13 · 9 · 6.5, the bottom turn radius 5.25 · 5.25 · 5). Where the outline's walls stop, the sheet stops with them, so the filled outer edge is the outline's: the bottom edge runs to x 13 · 9 · 6.625 and rounds up on the wall's own cap (radius 0.75 · 0.75 · 0.625), and at 24 the right edge runs to y 11 and rounds off on its cap the same way; each cap meets the cut along the tangent the two share (0.75 · 0.75 · 0.625 long at the bottom, 0.25 at the right), with no corner. At 24 a band of sheet 1.5 thick stays under the notch, from y 9.5 to the cut's top at 11 (C33's floor at the line weight). At 20 and 16 that band would be 0 thick (the grown hook touches the notch's bottom, y 8.5 · 6.5), so it goes and the sheet's edge runs straight down from the notch (x 9.5 · 7.5) into the cut, eased 0.5, as file-clock's; there the white from the flap to the clip is 3 · 3, the fold's own 1.5 band plus the 1.5 of air. The flap untouched. The clip stays a line at the outline weight, verbatim (a shape base: its lines keep 1.5 · 1.5 · 1.25). Off-grid decimals: none in the outline (quarter grid at 24 and 20, eighth at 16). In the filled twin, the cut's tangent points and the 0.5 eases, rounded away from the clip so the air never measures under 1.5. (recommended: the rules decide it. Polaris PageAttachment instead turns the page's top edge into the clip, at its top-right corner, where this file has its fold. A clip on the top edge was measured and cannot be drawn on the shipped file: the page fills the canvas height, so nothing can stand above its top edge, and between the left wall and the fold's leg there is 4 · 1 · 0.375 of room for ink once 1.5 of air is kept to each, where the narrowest clip needs 7.5 · 7.5 · 6.75 and a bare U 4.5 · 4.5 · 4.) -->
