  <!-- Wide slab, space bar to one side: The wide slab with the space bar to one side. Frame ink 20x12 · 16x11 · 14x10 (1.67 · 1.45 · 1.4 : 1, declared box; credit-card is 20x16), container radius 2.5 · 2 · 1.5 as credit-card, cash and desktop. Keys are short pills 2 · 2 · 1.75 long and one stroke tall: 4 · 3 · 3 in the top row, air 2 · 2 · 1.625 between them. Bottom row: a space bar under the first keys (ink 10 · 6 · 5.125) and one key under the last, so nothing sits centred under the keys like a mouth. The keys fill the frame: 1.5 clear of the side walls at every master, and 2 / 2 / 2 · 1.75 / 1.5 / 1.75 · 1.75 / 1.5 / 1.75 above / between / below the rows. Filled: the slab solid (outer radius 3.25 · 2.75 · 2.125), keys and bar cut out at their outline ink. Cost: at 20 the 11-unit height puts the top and bottom edges on half pixels (a 1.5 line straddles pixels either way). (recommended: the same silhouette at all three masters, it sits with credit-card and desktop as a family, and at 16 it is the framed version that stops reading as a face) -->
