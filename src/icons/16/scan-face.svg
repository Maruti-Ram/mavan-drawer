<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: face id, face scan, face recognition, viewfinder, brackets, smile -->
  <!-- Eyes and smile: A smiley without its ring, inside scan's corners: the same eyes and smile as face-smile, so it reads as one of the faces and one of the scans at every size. Scan's corners verbatim (spread 18 · 14 · 12, radius 2.5 · 2 · 1.5, arms 6 · 4.75 · 4 of ink, in place). At 24 and 20 the face is face-smile's verbatim — dash eyes 1.5×3 · 1.5×2.75 of ink on x ±2.25 · ±1.75, smile radius 5 · 3.75 swept 150° — moved up 1 · 0.25 so its ink sits on the centre (face 11.16×9.5 at 24, centred; 8.74×8.25 at 20, 0.125 below centre, the nearest the quarter grid allows). At 16 face-smile's own face does not fit: its eyes come within 1.21 of the top corners' tips and its smile within 1.36 of the bottom ones. So the 16 smile tightens to radius 3.125 (from 3.375) at face-smile 16's own 146°, and the eyes keep face-smile 16's x (6.375 / 9.625, inner edges on whole pixels) but shorten to 2 of ink (from 2.5); face 7.23×6.75, centred. The face is the same share of the corners at every master: 62 · 62 · 60% of the spread. Air, outline: to the corners 3.01 · 1.75 · 1.56, eye to smile 2.3 · 1.8 · 1.63, eye to eye 3 · 2 · 2. Filled: barcode-scan-filled's way, not scan-filled's — the corners stay lines at 1.5 · 1.5 · 1.25 and the face's lines fill in place, widened 0.5 · 0.25 · 0.25 a side with their ink length held (eyes 2.5×3 · 2×2.75 · 1.75×2, smile 2.5 · 2 · 1.75 thick), as barcode-scan's thin bar; air to the corners 2.52 · 1.54 · 1.53, eye to smile 1.99 · 1.68 · 1.53, eye to eye 2 · 1.5 · 1.5. scan-filled's way (corners and face all at 2.5 · 2 · 2) leaves no face at 16 that holds 1.5 (searched eyes ±1.75–2.5, smile radius 2–4). Off-grid numbers: the smile's ends (turned 15° · 15° · 17° below level, as face-smile's) and the filled shapes' edges along that arc. Who: Lucide scan-face. (recommended) — one drawing at all three masters, made of parts the set already has. -->
  <path d="M5.375 2.625L4.125 2.625A1.5 1.5 0 0 0 2.625 4.125L2.625 5.375"/>
  <path d="M10.625 2.625L11.875 2.625A1.5 1.5 0 0 1 13.375 4.125L13.375 5.375"/>
  <path d="M5.375 13.375L4.125 13.375A1.5 1.5 0 0 1 2.625 11.875L2.625 10.625"/>
