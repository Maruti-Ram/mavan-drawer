  <!-- Bookmark on the corner: The shipped book (default shape: page curl and spine), unchanged and in place (ink 16×20 · 12×16 · 10×14, x 4–20 · 4–16 · 3–13), with the shipped bookmark as a C33 shape badge on its bottom-right corner, the badge's ink corner on the margin edge (22 · 18 · 15), as file-heart and file-clock sit on file. Ribbon: bookmark, not bookmark-2 or -3 (book-bookmark is unnumbered, so it takes the default shape, C9), with its fold band dropped: the band's 2.5 · 2 · 1.75 of air between two lines would take 5.5 · 5 · 4.25 of a 10 · 8 · 7 badge, so the detail goes and the silhouette is the plain ribbon. Its proportion kept: ink 7×10 · 6×8 · 5×7 (x 15–22, y 12–22 · x 12–18, y 10–18 · x 10–15, y 8–15), 0.70 · 0.75 · 0.71 wide for its height, bookmark's own 0.70 · 0.75 · 0.71, every edge on a whole pixel. Head radius 0.75 · 0.75 · 0.625 on the line: bookmark's 1.5 halved with the badge at 24, held at C10's half-weight floor at 20 and 16. Notch at bookmark's 45°, half the ribbon's width deep, 2.75 · 2.25 · 1.875 on the centreline. Tips and notch drawn sharp under the round join, as bookmarks-2's small ribbon (7×10 · 5.5×7.75 · 4.75×6.75): bookmark's 0.75 · 0.75 · 0.625 fillets would leave a notch 1.38 · 0.88 · 0.73 deep seen from outside, under a pixel at 16; sharp it is 2.44 · 1.94 · 1.62 deep and 4 · 3 · 2.5 wide between the tips, the same in both styles (one outer edge; bookmarks-2's at 16: 1.49). Inside air 4 · 2.75 · 2.5. Size: file's corner badges are 9.5 · 8 · 7 tall (file-down-2; file-clock's ring 10 · 9.5 · 9) and password-lock's lock 8×9.5 · 7×8.25 · 6×7; the ribbon is as tall and narrower, as a ribbon is. Box 18×20 · 14×16 · 12×14 (declared): the book's 16×20 · 12×16 · 10×14 plus the 2 the ribbon stands right of it — the book's ink already reaches the bottom margin, so the badge can only stand past it sideways; centre 13,12 · 11,10 · 9,8, 1 right of the canvas centre at every master: the base keeps its place, so the files declare <!— base: book —> and lint holds the composite to the book's left, top and bottom edges (as file-heart and file-clock; user-lock approved in place 2026-10-25). Cut back by hand with 1.5 of air from the ribbon's ink: the bottom-right corner arc goes whole at every master. Right wall stops at y 9.75 · 7.75 · 5.875 (cap ink to 10.5 · 8.5 · 6.5), 5.5 · 3.75 · 3.25 past its top-right corner, 1.5 above the ribbon's head. Page line and bottom wall both stop at x 12.75 · 9.75 · 7.875 (cap ink to 13.5 · 10.5 · 8.5), 1.5 from the ribbon's left side and left tip; the bottom wall keeps 6 · 3.25 · 2.75 past its corner, the page line 5 · 2 · 1.5 past the spine, so the page band still reads as pages running on behind the ribbon. Spine untouched, 6.5 · 3.5 · 3 from the ribbon. The kept segments are book's strings verbatim, the cover's path opened at the bottom wall's cut end; at 16 only the page line is written from its curl end (the same line run the other way): written book's way round, lint §5l reads its curl landing on the now-open cover as an arrowhead (−1.25 of head air at 3.63,12.88), a reading that changes with the path's direction alone; book's joint is not a head and C37 does not reach it. Tightest air, book to ribbon: outline 1.50 · 1.50 · 1.50 (the three cut ends), filled 1.50 · 1.50 · 1.50. Filled: book-filled's cover cut along the ribbon's ink grown 1.5 (head corners radius 3 · 3 · 2.75 on the cut, the left side 1.5 out), each wall that stops ending on its own ink end — the right wall's corner and the page line's corner at the cap radius 0.75 · 0.75 · 0.625, the back-cover strip in a full round cap — so the filled outer edge is the outline's; the page band's white opens into the cut as the outline's band opens toward the ribbon; the spine cut untouched. The solid left between the spine cut and the ribbon's cut is 5 · 2 · 1.375 wide (at 16 over the line-weight floor 1.25). The ribbon solid at the outline's ink: tips round at the cap radius about the sharp vertices, the notch a sharp V, as bookmark-filled's. Off-grid decimals, filled ribbon only: the tips' tangent points (0.53 · 0.53 · 0.442 off each vertex across the 45° legs) and the notch's V (the vertex plus 0.75 · 0.75 · 0.625 × √2). (recommended: the rules decide it; Lucide's ribbon hung from the cover's top edge already ships as book-2, and on book it cannot hold 1.5 to spine and fore-edge at 20 (front panel 6 clear, a ribbon needs 7.5) or 16 (4.75, needs 7), where the spine would go and the drawing would be book-2's; Nucleo's ribbon hanging out below the pages needs room under the book, whose ink is on the bottom margin at 22 · 18 · 15, and laid over the page band instead (4 · 3.5 · 3 tall on its lines) its notch comes within 0.375 of the page line at 16) -->
