  <!-- Kitchen scale: A flat tray on a short stem over a domed body with a needle (Nucleo food-scale, food-scale-2, -3). It weighs goods: a shop or kitchen scale. Ink 18×18 · 14×14 · 12×12 on the square keyline, centred. Tray 18 · 14 · 12 of ink wide. Stem 2.25 · 1.5 · 1.5 between tray and dome. The dome is a half circle of r 7.25 · 5.25 · 4.375 on straight sides, with bottom corners at the container radius 2.5 · 2 · 1.5; body 16 · 12 · 10 of ink wide. The needle comes from the dome's centre at 45°, 3.54 · 2.12 · 1.59 long, with 2.21 · 1.63 · 1.53 of air to the dome. It is short at 20 and 16 because the 1.5 floor allows no more. Filled: the body is solid with the needle cut out as a 1.5-wide slot (1.5 at 16 too, C22) in the body's own path. Tray and stem stay lines. Clear at every size, and it is gauge's needle in a body, so it fits the set; the risk is that at 16 it can read as a lamp or a bell -->
