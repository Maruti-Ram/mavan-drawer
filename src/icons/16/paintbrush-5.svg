  <!-- Round head, spindle handle: Spindle handle: A's build, head a size down (radius 2.75 · 2.25 · 1.875; head 7 · 6 · 5, 2 · 1.5 · 1.25 proud of the band) with the handle drawn as an artist's handle — a slim solid that swells between two points, 2.5 · 2.5 · 2 at its widest and one stroke wide at each end, made of two arcs (radius 40.75 · 23 · 22.25), so no straight edge leaves the axis. Filled: the head fills to the outline's outer edge, the band is already solid, the handle is the same solid spindle. Ink 18×18 · 14×14 · 12×12 on the square keyline (as pencil and the shipped paintbrush), centred; filled ink box equals the outline's at every master. Off-grid numbers are tangent points of the round parts; circle centres, cap ends and box edges sit on the grid (quarter at 24 and 20, eighth at 16). Reads as a real paint brush at 24; heavier than every other handle in the set, and at 16 the swell is under a pixel, so it looks like A. -->
