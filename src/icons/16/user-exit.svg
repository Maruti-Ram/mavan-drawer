  <!-- Arrow out of the corner: Arrow out of the corner (recommended): the shipped user (head and tall dome) kept exactly where user has it, with a right-pointing arrow on its bottom-right corner, its ink corner on the margin edge (22 · 18 · 15), C33. The arrow is drawn from arrow-right, the arrow logout's own head comes from (45° legs into a C10 bend of half the weight whose outer point is the shaft's end), not from logout whole: a door needs its returns 1.5 clear of the shaft and the head 1.5 clear of the returns, at least 9.65×7.5 · 9.65×7.5 · 8.7×6.75, and the lock's envelope on user is 8×9.5 · 7×8.25 · 6×7. The head is the small one the set already ships inside file-down, file-up, folder-down, folder-up and desktop-download, turned to point right, string for string: legs 3 · 2.5 · 2.25 off the shaft, C37 head air 1.5 · 1 · 1 (measured). The shaft runs the lock's width, so the arrow is 8 · 7 · 6 long: ink 8×7.5 · 7×6.5 · 6×5.75 (x 14–22, y 14.5–22 · x 11–18, y 11.5–18 · x 9–15, y 9.25–15), shaft at y 18.25 · 14.75 · 12.125, the head 94 · 93 · 96% of the length and the shaft showing 3.81 · 3.31 · 2.76 ahead of the leg caps, one proportion at every master (arrow-right's head at C37's floor, 2.5 at 24, would be 81% there against 93 · 96% at 20 and 16). The head is untouched: 6.59 · 5.09 · 4.61 of air to the arrow. The figure is cut back by hand with 1.5 of air from the arrow's ink, and only its body: the right wall and the right bottom corner go (they lie under the head and the shaft). The dome runs from the bottom-left corner over the top and stops on the right shoulder at 16.1,13.52 · 12.41,10.84 · 9.95,8.584, 34.4 · 27.4 · 26.5° past the top, 1.507 · 1.502 · 1.505 from the end of the head's upper leg; each end is the dome circle where it meets the air line, rounded to 2 · 2 · 3 dp toward the top (arc-derived, off grid). The base stops at x 13.25 · 10 · 8, 7 · 4 · 3.375 past its corner: at 24 on the arrow's ink box (its cap ends at 14, the box's left edge; V2's ruling 3a, a line does not run on under the shaft into the arrow's own gap), 1.854 from the shaft's tail; at 20 and 16 where 1.5 holds to the tail, 1.552 · 1.525 (the furthest it may go is 10.09 · 8.04). Tightest air, outline: 1.507 · 1.502 · 1.505, dome end to the upper leg's end. Box 18×20 · 14×16 · 12×14 (declared, as user-lock, user-plus and user-search): user's 16×20 · 12×16 · 10×14 plus the arrow's 2 past its right side, centre 13,12 · 11,10 · 9,8, 1 right of the canvas centre at every master; the base keeps its place, so the files declare <!— base: user —>, as Maruti approved the figure in place for user-lock and user-shield (2026-10-25). Filled: the arrow stays a line at the outline weight 1.5 · 1.5 · 1.25, its outline drawing verbatim (a line badge on a shape base, as user-plus's plus and user-search's magnifier, so no badge note). user-filled's body is cut along the arrow's ink grown 1.5: round the upper leg's end (radius 2.25 · 2.25 · 2.125), along the shaft's grown top edge (y 16 · 12.5 · 10), round the tail (same radius), then the straight line tangent to it and to the outline base line's own round cap (centred 13.25,21.25 · 10,17.25 · 8,14.375, radius 0.75 · 0.75 · 0.625; the line 1.5 · 0.56 · 0.38 long), so the filled bottom edge ends where the outline's does, at x 14 · 10.75 · 8.625; the cut's two corners eased 0.5 as map-pinned's and user-plus's; the head disc whole. Tightest air, filled: 1.5 · 1.5 · 1.5 along the cut, by construction (measured 1.500 at each master). At 16 the shaft at y 12.125 covers two pixel rows by half and three quarters, as phone-forwarded's at 4.125 does: the head's legs fix it 2.25 above the lower leg's end, and a crisp row would need legs 2 off the shaft (under C37's 1) or 2.75 (a head taller than the arrow is long). Off-grid numbers: the head's leg ends and bend tangent points (x 18.56 · 15.06 · 12.384 and 21.03 · 17.03 · 14.192; y 17.72, 18.78 · 14.22, 15.28 · 11.683, 12.567), file-down's own turned a quarter; the dome's ends; in the filled twin the fillets' and tangents' points (24: 16.76,13.07 / 16.84,13.79, 16.31,15.45 / 15.82,16, 12.95,19.6 / 13.85,20.8; 20: 13.01,10.31 / 13.17,11.01, 12.81,12.04 / 12.32,12.5, 10.14,16.33 / 10.54,16.72; 16: 10.363,8.094 / 10.556,8.789, 10.28,9.57 / 9.786,10, 8.159,13.664 / 8.431,13.922), each on its circle and rounded away from the arrow so the 2- or 3-decimal point keeps 1.5 and stays inside user-filled's edge. -->
