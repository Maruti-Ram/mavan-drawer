<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: square, peel -->
  <!-- Square, corner peeled back: Rhythm and balance: one square sticker on the square keyline, 18 · 14 · 12, corners r2.5 · 2 · 1.5 (checkbox's), its bottom-right corner turned back on itself. The turned-back flap is the corner flipped over the fold: its tip sits 7.5 · 5.5 · 5 in from the corner on both axes, 45 · 44 · 47% of the side, so the peel is the same size at every master. The fold edge leaves each side in a bend of r6 · 4.5 · 4, runs a short 45° line and bends back; the flap rises from the same points in a root bend of r1.5 · 1.5 · 1 and turns at r2.5 · 2 · 1.5. Air inside the curl at its widest 3.46 · 1.82 · 2.13; its two ends close to points where flap and edge meet. Ink 18×18 · 14×14 · 12×12, centred. Filled: the sticker solid, its turned-back underside a white lens 3.46 · 1.82 · 2.13 wide, edged by the fold line at the outline weight (Nucleo's filled stickers); outer edge = the outline's. Decimals are the bends' tangent points and where the lens meets the fold. Nucleo sticker-square's construction. Look-alikes at 16: checkbox (square, no curl), and note: a sticky note is a square with a folded corner, so this is the candidate most likely to read as note. -->
