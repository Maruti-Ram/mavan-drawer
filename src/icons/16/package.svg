  <!-- tags: box, parcel, shipping, tape, label -->
  <!-- Chamfered box, label: A plus a shipping label: a dash in the lower left, 3 · 2.25 · 1.5 of centreline (4.5 · 3.75 · 2.75 of ink, 25 · 27 · 23% of the box), 1.5 of air to the wall and the floor at every master (its nearest point to the bottom-left corner's arc is 1.54 · 1.66 · 1.77 of air). Shoulders are 45° chamfers of 3 · 3 · 2.75, drawn sharp under round joins as file's and save's chamfers are; the lid line runs wall to wall at the chamfer foot, so its 1.5 of air to the top edge is what sets the chamfer (MIN_GAP pins it, as it pins trash's handle, so the lid band takes more of the box as the master shrinks). Bottom corners are the container radius 2.5 · 2 · 1.5. The chamfer tips of the filled lid are cut at r0.25, as C23 cuts file's 45° flap tips; the only off-grid values are those tips' tangent points and the chamfer's outer offsets (0.53 · 0.53 · 0.442 = half the stroke / √2). The label says "shipped" rather than "stored", at the cost of a lopsided interior and less room for package-check's mark. Filled: the lid band and the body are separate solids split by a 1.5 cut on the lid line (at 16 the cut shares the line's top edge, as briefcase and archive), the body's cut corners eased 0.5 at the walls; the tape becomes a 1.5 notch from the cut up through the top edge, so the lid reads as two flaps (notch mouth eased 0.25, its foot 0.5, as briefcase's clasp); 1.5 of air between every piece. The label is a 1.5 slot with round ends, the same ink length as the line (at 16 it shares the line's top edge, as archive's handle slot), 3 · 3 · 2.5 of material to the floor. -->
