<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: stand, no neck -->
  <!-- box: 14x12 -->
  <!-- Foot only: Ink 20x18 · 16x14 · 14x12 (agreed box, as briefcase and folder), box-centred both ways. Screen 20x14 · 16x11 · 14x9 of ink (1.43 · 1.45 · 1.56 : 1), container radius 2.5 · 2 · 1.5. No neck; foot 9 · 7 · 6 of ink (45% · 44% · 43% of the screen), 2.5 · 1.5 · 1.75 clear under the screen (floor 1.5). 16 master at stroke 1.25: centrelines on the eighth grid so the screen's outer edges and the foot's bottom are whole pixels; foot ends at x 5.625 / 10.375 (calendar's pegs) so its ink runs 5 to 11. Filled: screen solid, outer edge on the outline's (radius 3.25 · 2.75 · 2.125); the foot stays lines at 1.5 · 1.5 · 1.25. A with the neck taken out: the foot floats under the screen, held by the gap alone. Lighter and quieter; the risk is that at 16 the foot reads as an underline or a laptop's base (the foot is well under the screen's width, which is what keeps it from being a laptop). -->
  <path d="M3.125 2.625H12.875A1.5 1.5 0 0 1 14.375 4.125V8.875A1.5 1.5 0 0 1 12.875 10.375H3.125A1.5 1.5 0 0 1 1.625 8.875V4.125A1.5 1.5 0 0 1 3.125 2.625Z"/>
