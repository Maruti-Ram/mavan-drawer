  <!-- Serif T: The type-tool T (Lucide type, Tabler typography, Radix text): crossbar 18 · 14 · 12 wide across the mark ceiling with its ends turned down into serifs, a stem to the baseline and a foot 7 · 5.5 · 4.75 of ink wide (0.39 · 0.39 · 0.4 of the crossbar; Lucide's foot is 0.44). The serif drop is 3 · 2.5 · 2 of centreline below the crossbar's own line — 3 · 2.5 · 2 of ink showing under the crossbar's bottom edge, so at 16 the drop is two whole pixels; the turn is a C10 bend at half the stroke (0.75 · 0.75 · 0.625 outline, 1.25 · 1 · 1 filled). Air between a serif's inner edge and the stem 6.75 · 4.75 · 4.125 outline, 5.25 · 4 · 3 filled — never near the 1.5 floor, the serifs are far out at the crossbar's ends. Filled: line-heavy, 2.5 · 2 · 2; the crossbar's top ink, the serifs' outer ink, the foot's bottom ink and every cap hold their place (caps in 0.5 · 0.25 · 0.375, so the drop shows 2 · 2 · 1.25 under the heavier crossbar), box holds exactly. Box-centred: no measure for a three-path mark; line mass -4.87 · -3.93 · -3.51 high — the foot pulls it 1.1 · 0.73 · 0.6 lower than E's, but the crossbar and its serifs still put most of the ink at the top. In real pixels at 16 each drop is two whole pixels and the foot a crisp bar, and it is the one T in the row that reads as type rather than as a mark from plus's family (the convention of Lucide, Tabler, Radix and Phosphor); the trade is 18 across at 24 and 20 against plus's 15, which J answers (recommended) -->
  <path d="M2.625 4.625V3.25A0.625 0.625 0 0 1 3.25 2.625H12.75A0.625 0.625 0 0 1 13.375 3.25V4.625"/>
