<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: terminal, prompt, command line, shell, console, cli, window -->
  <!-- box: 14x12 -->
  <!-- Prompt in a window: The prompt in a window: Heroicons command-line (the one set that names it command), Lucide square-terminal, SF apple.terminal, Material terminal, Tabler terminal-2, Phosphor terminal-window. Frame at container radius 2.5 · 2 · 1.5 in an agreed box 20×18 · 16×14 · 14×12 (keyboard-2 keeps 20×18 · 16×15 · 14×13), not the landscape keyline: at 16 that keyline is 10 tall and leaves 7.5 inside, where a > that keeps 1.5 to the walls can be 4.5 tall and the _ has to start 2.1 after its corner, wider than the > itself, so the pair falls apart. The prompt is centred in the frame with even air: 2.25 left and right, 2.5 top and bottom at 24; 2 all round at 20; 1.75 all round at 16, where its ink is whole pixels (x 4 to 12, y 5 to 11). It fills 0.67 · 0.64 · 0.63 of the frame's inside height. Chevron (45°, C10 bend; tangent points 0.53 · 0.53 · 0.442 off the corner are construction values) 8.5 · 5.5 · 4.75 tall on its centreline, the _ on its lower end 4.5 · 3 · 2.75 long (0.53 · 0.55 · 0.58 of the chevron height), starting 2.25 · 1.75 · 1.625 after the corner (0.26 · 0.32 · 0.34): the gap opens up at the small masters because the _ has to stay 1.5 clear of the lower leg. Each _ sits on a .25 / .75 line (y 16.25 · 12.75 · 10.375) so it renders as one solid row. Tightest air: _ to the chevron 3.1 · 1.68 · 1.58; prompt to the walls 2.25 · 2 · 1.75. Filled: the window solid (outer radius 3.25 · 2.75 · 2.125), > and _ cut out 1.5 wide at every master — at 16 wider than the 1.25 line, as C22 asks of white — the cut chevron bending on r 0.75 with a sharp inner corner, as checkbox's tick is cut (its offset points 0.53 off each centreline point are construction values). At 16 the cut > ends are pulled in 0.125 on both axes and the cut _ is drawn on y 10.25 and ends at 11.25, so both keep the outline ink's outer edges; the cut _ starts at 9, 0.375 later than the outline's, so 1.55 of solid stands between the two cuts (3.1 · 1.68 at 24 and 20, as the outline). Solid round the cuts 3.75 · 3.5 · 3 at its thinnest. Risk: a frame round a chevron sits close to the layout icons and to code; the _ is what says prompt. -->
  <path d="M3.125 2.625H12.875A1.5 1.5 0 0 1 14.375 4.125V11.875A1.5 1.5 0 0 1 12.875 13.375H3.125A1.5 1.5 0 0 1 1.625 11.875V4.125A1.5 1.5 0 0 1 3.125 2.625Z"/>
  <path d="M4.625 5.625L6.558 7.558A0.625 0.625 0 0 1 6.558 8.442L4.625 10.375"/>
