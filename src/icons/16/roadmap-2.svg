  <!-- One board on a post: (recommended) The cleanest signpost at 16. One board pointing right, crossing a centred pole that shows 3 · 2 · 2 above it and 10 · 8 · 7 below. Portrait keyline 16×20 · 12×16 · 10×14. Board 16×7 · 12×6 · 10×5 of ink, air inside 4 · 3 · 2.5 (the most of any candidate at 16), point depth 2.75 · 2.25 · 1.875, tip vertex 19.56 · 15.56 · 12.634; at 16 the point still reads as a point, which A's and E's 4 px boards lose. The centred pole and the post below keep it apart from flag (pole at the edge, cloth to one side) and from tag / label (no post). Every board corner is an arc of 0.75 · 0.75 · 0.625 (C10, as flag-4's cloth corners): the point, the two shoulders and the square end. The point is two 45° edges, so its depth is half the board's centreline height. Off-grid decimals are the tangent points of the board arcs on the 45° tip edges (r × tan 22.5° at a shoulder, r / √2 at the point) and the tip vertex itself, placed so the rounded point lands its ink exactly on the keyline edge. Filled: the board one solid on the outline's outer edge, the pole a line at 1.5 · 1.5 · 1.25 straight through. -->
