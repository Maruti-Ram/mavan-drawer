<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: waveform, audio, bars -->
  <!-- box: 11.75x12 -->
  <!-- Waveform: Rhythm and balance: four bars on one even pitch, 5.5 · 4 · 3.5 (air 4 · 2.5 · 2.25 outline, 3 · 2 · 1.5 filled), centred on the middle line, ink heights 8, 18, 12, 6 · 6, 14, 9, 4.5 · 5.5, 12, 8, 4: the same 0.44 / 1 / 0.67 / 0.33 profile at every master. Four bars, not Lucide's six: at 20 and 16 the filled bars (2 wide) need 3.5 of pitch to keep 1.5 of air, and five or six bars do not fit the box at that pitch. Line-heavy, so the filled twin is the same bars at 2.5 · 2 · 2 with ends pulled in 0.5 · 0.25 · 0.375; the bars thicken in place (C17), declared as growth of 0.5 · 0.25 · 0.375 left and right. Ink 18x18 · 13.5x14 · 11.75x12 as an agreed box. Symmetric up and down; the tall bar sits left of the middle, so mass is 0.77 · 0.59 · 0.52 left of centre, to be checked on the optical sheet. The cost: at 16 no bar lands on whole pixels (centres 2.75 · 6.25 · 9.75 · 13.25), so the filled bars render grey-edged. Honest limit: this reads as audio or voice as much as music. Who draws it: Lucide audio-lines, SF Symbols waveform, Material graphic_eq, Phosphor Waveform. Not a row on the sheet. -->
  <path d="M2.75 5.875V10.125"/>
  <path d="M6.25 2.625V13.375"/>
  <path d="M9.75 4.625V11.375"/>
  <path d="M13.25 6.625V9.375"/>
