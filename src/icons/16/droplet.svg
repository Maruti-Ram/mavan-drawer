  <!-- Plain drop: Plain drop: the picture nearly every set draws (Lucide droplet, Material water_drop, SF Symbols drop, Phosphor Drop, Tabler droplet, Feather, Fluent Drop). Rhythm and balance: one shape, so balance is its mass — the bulb carries it low, the ink's mass centre sits 0.75 · 0.57 · 0.47 below the canvas centre in the outline and 0.94 · 0.71 · 0.61 in the filled, and the widest point is the bulb centre at y 14 · 12 · 10. The drop is one closed path: a bulb (radius 7.25 · 5.25 · 4.375 on the line), two convex flanks (radius 28.25 · 15.5 · 12.375) that leave the bulb and run into a tip arc of 0.75 · 0.75 · 0.625 (C10). The flank radius is chosen per master so the tip keeps one angle, 94.92 · 94.92 · 94.86° — the portrait keyline is taller at 16 than at 24, and one radius for all three sharpened the tip from 100° to 85°. No straight edge leaves 0/45/90. Inside air 13 · 9 · 7.5 across the bulb. ink 16×20 · 12×16 · 10×14 on the portrait keyline (flask's), box-centred. Filled: the same outer edge, solid; ink box identical. Off-grid numbers are the flanks' tangent points only; every centre and box edge sits on the grid (quarter at 24 and 20, eighth at 16). At 16 it reads as a drop beside map-pin and bell at the same weight, and it is the drawing the other four are built on. (recommended) -->
