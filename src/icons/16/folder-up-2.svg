  <!-- Corner badge: Polaris FolderUp's picture, folder-down-2 turned up (file-down's B, locked as file-down-2; file-up-2): the shipped folder in place with v3-kit-arrow.md's up badge on its bottom-right corner, string for string the badge on file-up-2, ink corner on the margin edge (22 · 18 · 15), C33. arrow-up's classic head at badge size: legs 45°, C10 bend 0.75 · 0.75 · 0.625 reaching the shaft's own end, half-width 2.5 · 2.5 · 2.25 — C37's floor, leg cap to shaft 1 · 1 · 1 in both styles (the badge stays at the outline weight). Badge ink 6.5×9.5 · 6.5×8 · 5.75×7.125; shaft at x 18.75 · 14.75 · 12.125, 0.5 · 0.5 · 0.25 inside the folder's right-wall line. Cut back by hand with 1.5 of air from the arrow's ink, as folder-down-2 (each line stops on the last quarter or eighth that holds 1.5, in its round cap); with the head at the top, the right wall now stops for the head. Right wall: at 24 it stops at y 11, 2.75 past its top corner, air 1.66 to the bend (a quarter further, 1.47); at 20 and 16 the last end that holds is y 8.5 · 6.5 (air 1.66 · 1.58), only 0.75 · 0.375 past the corner, so the wall goes and the folder ends at its top-right corner, air 2.26 · 1.88 to the bend. The bottom-right corner goes; the bottom wall stops at x 15.75 · 11.75 · 9.375, 10.5 · 7 · 6.25 past its corner, air 1.5 · 1.5 · 1.5 to the shaft's tail (a step further, 1.25 · 1.25 · 1.38). Tab untouched. Box 20×19 · 16×15 · 14×13 (declared, as folder-down-2 and folder-plus): the folder's box plus the 1 the arrow stands below it; centre 12,12.5 · 10,10.5 · 8,8.5, 0.5 low at every master — not more than 0.5, so no base note. Filled: folder-filled's solid cut along the arrow's ink grown 1.5 (2.25 · 2.25 · 2.125 from its centreline), folder-down-2's construction with the head at the top. Right of the arrow the cut would leave a strip 1 wide beside the shaft's band, thinner than a line, so the solid stops where the outline stops, on the outline's own round end (r 0.75 · 0.75 · 0.625): the wall's end at y 11 at 24, the corner's end at 20 and 16 (at 16 folder-filled's own corner ends at y 6.25, so its round end sits 0.125 below the outline's cap, as folder-down-2's). From that round end the edge runs on the common tangent into the grown bend (3 · 3 · 2.75 about the bend's centre), with no corner: a 1.09 line rising to the left at 24, a flat ceiling at y 8.5 at 20 (the grown bend's top exactly, as folder-down-2's at 20), a 1.39 line at 16; then over the grown bend's top, down the left leg's outer side, round the left leg's end, a 0.5 round onto the shaft's band at x 16.5 · 12.5 · 10 (file-up-2's strings from the leg down, the badge being the same), and straight down into the bottom wall's own round end at x 15.75 · 11.75 · 9.375, which the band meets on its tangent — the bottom-right corner goes whole. The solid above the head is the folder's body, 6 · 3.5 · 2.37 from its top edge to the grown bend. Tightest air, outline: 1.5 · 1.5 · 1.5 (the bottom wall to the tail); the wall's end or corner to the bend 1.66 · 2.26 · 1.88; the bottom wall to the left leg 1.85 at 20, 1.68 at 16. Filled: 1.5 · 1.5 · 1.5 at the band, the 0.5 round and the grown top (the 20 ceiling 1.501), 1.51 · 1.506 · 1.502 at the left leg's end, the tangent lines 1.505 (24) · 1.503 (16), the round end 1.69 · 2.41 · 1.83; head air 1 · 1 · 1. Off-grid decimals: the folder's tab-corner tangent points (its own), the head's leg ends and bend tangent points (the kit's up strings), and in the filled twin the cut's tangent points, worked at 0.005 · 0.005 · 0.002 more than the grown radius and rounded away from the arrow so the 2 and 3 dp values keep 1.5 (24: 20.95,11.69 · 19.96,11.25 · 16.62,11.87 · 14.65,13.84; 20: 12.62,9.37 · 10.65,11.35; 16: 14.206,6.852 · 12.871,6.475 · 10.179,7.179 · 8.371,8.987, and the grown top 6.374, the exact 6.3749 rounded away), and the 0.5 rounds' points (16.04,17.69 / 18.18 · 12.04,15.19 / 15.68 · 9.571,12.597 / 13.091). What it costs: at 20 and 16 the folder has no right wall; its side stands open 3.69 · 3.12 between the corner's round end and the arrow's right leg. -->
