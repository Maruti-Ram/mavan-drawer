  <!-- Flat small, open: The shipped flat small chevrons with a generous gap, 3.5 · 3 · 3 (0.66 · 0.65 · 0.69 of a chevron's height): the flat chevron is short, so it takes the most air under the ceiling. The Polaris proportion: two wide, calm strokes clearly apart. Ink 13×14.171 · 11×12.177 · 10×11.65 at 24 · 20 · 16 (mark ceiling 18 · 14 · 12), box-centred on both axes by construction: the bottom chevron is placed, the top one is its mirror about the canvas centre, so no optical shift (C14 moves a single chevron toward its point; the pair points both ways and cancels). Each chevron 13×5.336 · 11×4.589 · 10×4.325 of ink. Air between the facing caps 3.5 · 3 · 3, identical in the filled twin (measured edge to edge on the drawings): the filled ends pull in half the added weight on both axes (0.5 · 0.25 · 0.375), so each cap keeps its outer extreme and the gap cannot shrink. The open ends sit on the grid (y 9.5/14.5 · 7.75/12.25 · 5.875/10.125); the off-grid decimals are the C10 bend's tangent points, which follow the leg angle, and the apex ink, which falls where the bend puts it. -->
  <path d="M3.625 5.875L7.629 2.922A0.625 0.625 0 0 1 8.371 2.922L12.375 5.875"/>
  <path d="M3.625 10.125L7.629 13.078A0.625 0.625 0 0 0 8.371 13.078L12.375 10.125"/>
