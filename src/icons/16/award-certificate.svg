  <!-- Landscape certificate: Landscape certificate (recommended): the landscape keyline's card (ink 20×16 · 16×12 · 14×10, corners 2.5 · 2 · 1.5; credit-card, id-card, note-4 and window draw the same frame string for string) kept in place, with two text lines and award's seal as a C33 shape badge on its bottom-right corner. The seal is award's ring on its two ribbon legs, drawn small: ring ⌀8 · 6 · 5 of ink (centreline radius 3.25 · 2.25 · 1.875, centre 18,16 · 15,13 · 12.5,10.5), its hole 5 · 3 · 2.5; legs at x 16, 20 · 13.5, 16.5 · 11.125, 13.875 (2 · 1.5 · 1.375 either side of the axis), so the ribbon is 5.5 · 4.5 · 4 of ink wide, 0.69 · 0.75 · 0.80 of the ring (award 0.68; at 20 and 16 the legs cannot come closer, 1.5 of white between them is the floor), and each leg starts on the ring's centreline as award's do (a T: y 18.56 · 14.68 · 11.775, where x = 16 · 13.5 · 11.125 meets the ring's circle, the only off-grid numbers in the outline) and runs to 21.25 · 17.25 · 14.375, its cap on the margin edge, 2 below the ring's ink at every master. Award's notch goes: at these leg spacings its 45° V would show 0.63 · 0.13 · 0.23 deep (each leg's offset from the axis less 1.83 times the bend radius), and closing the ribbon under the ring would need 1.5 of white above the notch, a badge 11.6 tall at 24; a detail that cannot be seen is removed. Badge ink 8×10 · 6×8 · 5×7 (x 14–22, y 12–22 · x 12–18, y 10–18 · x 10–15, y 8–15), between password-lock's lock (8×9.5 · 7×8.25 · 6×7) and file-heart's heart (10×8.5 · 7.5×6.25 · 6.5×5.5) in size, its ink corner on the margin edge 22 · 18 · 15 (C33). At 16 the ring's top, bottom and sides fall on whole pixels; the legs sit on half pixels (10.5–11.75 and 13.25–14.5), because a leg pair 1.5 apart on a ring of ⌀5 cannot put either edge on a pixel, and a ⌀6 ring that could would make the badge 8 tall. Filled: the ring fills to a solid disc of its own ink (r 4 · 3 · 2.5) and the legs stay lines at the outline weight 1.5 · 1.5 · 1.25, as lock-filled keeps its shackle; award-filled's face (a 1.5 white ring cut inside the rim) needs a disc of ⌀7.5 to keep a face of 1.5, so it would show at 24 only (face ⌀2) and close at 20 and 16; the solid disc is one picture at all three. Box 20×18 · 16×14 · 14×12 (declared): the card plus the 2 the seal's legs stand below it; centre 12,13 · 10,11 · 8,9, 1 below the canvas centre. The card keeps its place, as credit-card-lock and credit-card-contactless ship it, so the files declare <!— base: note-4 —> and lint holds the composite to that frame's left, top and right edges; note-4 is named for its place only, its lines are not used. Lines: C17's gap 3, centrelines 4.5 apart at 24 and 20, starting at x 5.75 (credit-card's bar, blog-4's lines), 1.5 from the frame: at 24 y 8.25 to 18.25 (12.5 long, blog-4's top line one quarter higher) and y 12.75 to 10.75 (5); at 20 y 7.75 to 10.75 (5) and y 12.25 to 8.25 (2.5), 1.5 from the frame above and below, the most two lines get in a 12-tall card; at 16 one line, y 6.375, 4.375 to 8.25 (3.875), because a second at C17's 16 spacing (4.5) would stand 0.25 off the bottom wall: dropped rather than squeezed. Each line ends 3.0 · 3.0 · 2.75 or more from the seal's ink (3.0 and 3.2 · 3.0 and 3.04 · 2.8), not just 1.5, because the filled twin knocks the lines out of the solid and the solid left between a line and the cut round the seal floors at the line weight 1.5 · 1.5 · 1.25 (measured 1.5 and 1.7 · 1.505 and 1.54 · 1.263). Cut back by hand with 1.5 of air from the seal's ink: right wall stops at y 10.5 · 8.25 (3.25 · 1.5 past its corner, the shortest C33 keeps at 20), air to the ring 1.64 · 1.51; at 16 it would stop at 6.27, 1.15 past its corner, so it goes and the top-right corner arc ends on its own cap at 14.375,5.125, 2.57 from the ring. Bottom wall stops at x 12.5 · 10.25 · 8.25 (7.25 · 5.5 · 5.125 past its corner), air 1.64 · 1.51 · 1.52 to the ring and 2.0 · 1.75 · 1.625 to the left leg. Tightest air, card to seal: outline 1.64 · 1.51 · 1.52 (the walls' ends); filled 1.50 · 1.50 · 1.50. Filled: window-filled's solid with the lines knocked out 1.5 wide on the outline's ink ends (as file-text-filled; at 16 the hole is 1.5 tall round a 1.25 line), cut along the ring grown 1.5 (a circle of radius 5.5 · 4.5 · 4 round the seal's centre). Where a wall stops, the solid ends on that wall's own cap (radius 0.75 · 0.75 · 0.625), so its edge stops where the outline's ink does, and runs from the cap onto the cut circle along their common tangent (1.32 · 0.25 long at the right wall, 1.32 · 0.25 · 0.43 at the bottom): no corner to ease. At 16, where the right wall is gone, the band above the seal ends as a shelf on the corner arc's cap (y 5.75, the outline's ink end), turns down at x 11.5 round a 0.5 white corner and eases 0.5 onto the cut circle; the shelf leaves 2.25 of white above the ring, as the outline does. The cut circle is anchored on its own top and left points (18,10.5 and 12.5,16 · 15,8.5 and 10.5,13 · 8.5,10.5), so it never runs inside 1.5. The seal's legs stay lines; their white between them is 2.5 · 1.5 · 1.5 in both styles. Ink box equal to the outline's. Off-grid numbers: the legs' tops (above); in the filled card, the caps' and the cut circle's tangent points (21.01,11.21; 19.76,10.78; 12.78,17.76; 13.21,19.01 · 16.96,8.94; 16.73,8.84; 10.84,14.73; 10.94,14.96 · 8.705,11.766; 8.843,12.177) and the 16 shelf's ease (11.5,6.257 to 11.167,6.728), each point on the cut circle rounded away from the seal so the air never measures under 1.5. -->
