<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: clipboard, list, checklist, survey, questionnaire, application, sheet -->
  <!-- Clipboard with lines: A clipboard with lines on it (Lucide clipboard-list, Polaris ClipboardChecklist, Material assignment, Font Awesome clipboard-list, Heroicons clipboard-document-list). The shipped clipboard verbatim, portrait 16x20 · 12x16 · 10x14, with two lines under the clip; ticks beside them do not fit under the 1.5 floor at 20 and 16 (the board leaves 6 and 4.5 of width), so it is lines at every master. 24: lines 6.5 of ink, air clip-to-line 3.25, line-to-line 3.5, to the bottom and side walls 3.25, pitch 5. 20: lines 5, margins 2 all round, line-to-line 2.5, pitch 4. 16: lines 4, margins 1.75 all round and 1.75 between, pitch 3. Tightest air at 16: 1.75 outline; filled, 1.5 of board between the two cut lines. Filled: clipboard-filled's board with the lines cut out as 1.5 white slots at every master (as file-text-filled does), clip as shipped; box identical. At 16 file-text has a folded corner and one bar, clipboard has no lines; this is the clip plus two bars. Risk: it is the clipboard-list picture, and reads as a list or tasks first; a later clipboard-list would be this same drawing -->
