  <!-- Flange: A plate across the top, wider than the body, with a narrower rounded body hung under it (the Lucide construction, our numbers). Plate 16 · 12 · 10 of ink; body sides 6.25–17.75 · 6.25–13.75 · 4.875–11.125 with bottom arc radius 5.75 · 3.75 · 3.125, so the plate overhangs by 1.5 · 1.5 · 1.25 each side; the body's bottom lands on A's 17.75 · 13.75 · 11.375 and the cord is A's. Prongs 9/15 · 7.75/12.25 · 6.125/9.875 (air 4.5 · 3 · 2.5). Plate and body are one path; the prongs stand on the plate, the body hangs below it. Filled: the body solid, the plate a line at outline weight. Ink 16x20 · 12x16 · 10x14, centred. Lighter and more 'engineered' than A; at 20 and 16 the prongs sit almost directly above the body's sides, so the plate is doing all the separating -->
