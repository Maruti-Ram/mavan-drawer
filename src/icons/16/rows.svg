<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: rows, three rows, layout, split, stack, view -->
  <!-- Three equal, wall to wall: columns turned a quarter. Checkbox's square (18 · 14 · 12, container radius 2.5 · 2 · 1.5, outer 3.25 · 2.75 · 2.125), the frame every layout icon ships on, with two dividers wall to wall on table's row lines exactly: y 9.25 / 14.75 · 8 / 12 · 6.375 / 9.625, symmetric about the canvas centre. Pitch 5.5 · 4 · 3.25; rows of air 4 / 4 / 4 · 2.75 / 2.5 / 2.75 · 2.5 / 2 / 2.5; margins to the canvas 3 · 3 · 2 on all four sides (ink 18×18 · 14×14 · 12×12). At 16 the eighth grid cannot split 7 of air in three: the dividers sit on y.375 / y.625 so each has one whole-pixel edge (7 and 9) and the middle row gives up a half, as table's middle row does. Tightest air at 16: 2 (middle row). How it differs: it is table without its column line (table draws the same two lines plus x 12 · 10 · 8) — Lucide's rows-3 and table stand in exactly that relation; layout-header has one line at 9.75 · 8.5 · 6.625 and layout-footer one at 14.25 · 11.5 · 9.375, this has two; columns is this drawing turned back. At 16 in pixels: table's column line is a 2-pixel grey stripe (about 60%) through the middle, and that stripe is all that separates the two. Risk: two lines 0.25 outside header's and footer's (at 16) also read as a page with a header and a footer — no such icon is on the sheet, so nothing in the set takes that reading. Filled: columns-filled turned, which is table-filled without the column cut — three solids split by 1.5 cuts centred on each divider (y 8.5–10 / 14–15.5 · 7.25–8.75 / 11.25–12.75 · 5.625–7.125 / 8.875–10.375); pieces 5.5 / 4 / 5.5 · 4.25 / 2.5 / 4.25 · 3.625 / 1.75 / 3.625 tall, outer corners on the outline's, cut corners 0.5; at 16 the middle solid is half the height of the outer two, as columns-filled's middle is half the width. The turn adds one neighbour columns never had: filled, this is three horizontal bars 12 wide, like menu-filled, with the middle bar almost where menu's is (y 7.125–8.875 against 7–9) — what keeps it a box is the outer bars, 3.625 thick against menu's 2, and white bands of 1.5 against menu's 2.5, so ink covers about 72% of the square against menu-filled's 48% (recommended: the plain reading of rows, the one Lucide, Untitled and Polaris all draw) -->
  <path d="M4.125 2.625H11.875A1.5 1.5 0 0 1 13.375 4.125V11.875A1.5 1.5 0 0 1 11.875 13.375H4.125A1.5 1.5 0 0 1 2.625 11.875V4.125A1.5 1.5 0 0 1 4.125 2.625Z"/>
  <path d="M2.625 6.375H13.375"/>
  <path d="M2.625 9.625H13.375"/>
</svg>
