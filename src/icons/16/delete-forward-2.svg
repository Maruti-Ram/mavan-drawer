  <path d="M9.75 5.25L8.375 5.25A0.625 0.625 0 0 0 7.75 5.875L7.75 10.125A0.625 0.625 0 0 0 8.375 10.75L9.75 10.75"/>
  <path d="M7.75 8H9.5"/>
  <path d="M12.5 5.25L12.5 10.125A0.625 0.625 0 0 0 13.125 10.75L13.75 10.75"/>
