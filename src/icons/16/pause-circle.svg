  <!-- Pause's rhythm: Rhythm: the bare pause's own, air between the bars a third of their height — 3 · 2.5 · 2 = 0.33 · 0.36 · 0.33 of it (bare pause 0.33 · 0.31 · 0.32; at 20 the quarter grid gives 2.5 or 2, and 2.5 is nearer a third and puts the filled cuts on whole pixels). Bars as tall as stop-circle's square, 9 · 7 · 6, box-centred, centrelines 4.5 · 4 · 3.25 apart. Ink 6×9 · 5.5×7 · 4.5×6, 0.67 · 0.79 · 0.75 as wide as tall (Lucide circle-pause 0.75, air 0.25 of the height; Polaris PauseCircle 1.0, air 0.45 — measured from the refs). Ring air above and below 4 · 3 · 2.75 (stop's), beside 5.5 · 3.75 · 3.5, nearest at the caps 3.38 · 2.35 · 2.25. At 16 the centrelines sit on x.375 / x.625 (6.375, 9.625): the inner edges land on whole pixels (7, 9), the outer on quarter pixels (5.75, 10.25) — a 1.25 bar can have only one whole edge. Filled: the disc with the bars cut out as lone bars, 2.5 · 2 · 2, flat run kept (8.25–15.75 · 7.25–12.75 · 5.625–10.375), ends reaching 0.5 · 0.25 · 0.375 further. At 24 and 20 the cuts sit on the centrelines (20: whole pixels, 7–9 and 11–13); at 16 they move out 0.375 to whole pixels, 5–7 and 9–11 (the bare pause-filled's own pixels), keeping the outline's inner edges and its 2 of air. That move is a choice, not a rule: cut on the outline bars' own lines (5.375–7.375 and 8.625–10.625) the solid between them is 1.25 and straddles two pixels, so it blurs at 1×; moved out, white, solid and white read 2 · 2 · 2 whole pixels, and the filled pair is 6 wide against the outline's 4.5. Material between the cuts 2 · 2 · 2 (floor 1.5 · 1.5 · 1.25); to the disc edge 5 · 4.25 · 3.63 on the vertical axis, 4.38 · 3.6 · 2.9 at the caps; cut ends round at 1.25 · 1 · 1 (C1 floor 0.75 · 0.5 · 0.375). Ink box filled = the disc = the outline's. Weight against plus-circle (rasterised): outline 0.98 · 0.99 · 1.00, filled 0.97 · 0.98 · 0.96 (stop-circle 1.11 · 1.10 · 1.12 and 0.86 · 0.88 · 0.89). (recommended) -->
  <path d="M1.625 8A6.375 6.375 0 1 0 14.375 8A6.375 6.375 0 1 0 1.625 8Z"/>
