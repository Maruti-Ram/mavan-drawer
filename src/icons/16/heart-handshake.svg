  <!-- box: 14x12 -->
  <!-- Clasp in a heart: A heart split by A's hook (Central handshake, Nucleo heart-handshake, Tabler heart-handshake). The heart is the shipped heart, rebuilt from its own primitives so the outline matches it exactly: lobes r 5.25 · 4 · 3.25, notch and tip r 0.75 · 0.75 · 0.625, agreed box 20×18 · 16×14 · 14×12 like heart. The hook starts at the bottom of the heart's notch and is A's hook: the thumb runs down-left at 45°, 4.5 · 3.5 · 2.5 long, turns at pitch 3 with tip r 1.5, passes a knuckle r 1 · 1 · 0.75, then a 45° line meets the heart's right side square. Filled: the hook becomes a 1.5 white line that splits the heart into two hands; its top end is rounded at the notch (a 0.75 cap). It is an honest handshake, but it reads as care, charity or partnership more than deal. It would ship as heart-handshake, a sibling of heart, rather than as handshake. It is the strongest of the five at 16 in both styles. -->
