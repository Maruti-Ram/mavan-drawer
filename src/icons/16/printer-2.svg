<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: slot, sheet, status light -->
  <!-- Slot and status dot: D plus a status dot 2 across (camera-6's flash dot; r0.25 · 0.25 · 0.375 at stroke 1.5 · 1.5 · 1.25), on the right at 18,12 · 14,10 · 11,8: 1.5 · 1.5 · 1.75 clear of the right wall, centred in the body's height, 1.59 · 1.51 · 1.77 clear of the tray wall's end. Dot centres on whole units so its edges are whole pixels at every master. At 16 the body is one unit taller than D's (y 4-12) to give the dot whole-pixel edges, so the sheet there shows 3 (counter 1.75). Body the whole width, container radius 2.5 · 2 · 1.5 (desktop, folder). Tray and sheet share walls, ink 12 · 10 · 8 wide (60 · 62 · 57% of the body), corners r1.5 · 1.25 · 1 (save's detail radius). 16 master at stroke 1.25: centrelines on the eighth grid (x.375 / x.625), so every outer edge, the tray top, the body top and bottom and the sheet foot land on whole pixels. Filled: as D, with the dot a round hole 2 across; at least 3 of material around it. The dot is what tells a printer from a box; it only fits in a closed body (see the header). -->
  <path d="M3.125 4.625H12.875A1.5 1.5 0 0 1 14.375 6.125V9.875A1.5 1.5 0 0 1 12.875 11.375H3.125A1.5 1.5 0 0 1 1.625 9.875V6.125A1.5 1.5 0 0 1 3.125 4.625Z"/>
  <path d="M4.625 4.625V2.625A1 1 0 0 1 5.625 1.625H10.375A1 1 0 0 1 11.375 2.625V4.625"/>
  <path d="M4.625 11.375V13.375A1 1 0 0 0 5.625 14.375H10.375A1 1 0 0 0 11.375 13.375V11.375"/>
  <path d="M10.625 8A0.375 0.375 0 1 0 11.375 8A0.375 0.375 0 1 0 10.625 8Z"/>
</svg>
