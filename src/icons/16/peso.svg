  <!-- One bar, through: One bar through — the single-stroke ₱ (a minority form in the Philippines; type designers use it at heavy weights): one bar across the middle of the bowl, standing 2.25 · 1.75 · 1.375 past the stem and past the bowl, box-centred. Bowl ink 11 · 9 · 9 (69 · 69 · 75% of the cap) — flat run 3 · 2.5 · 2.25, quarter-ovals 5×4.25 · 4×3.5 · 3.75×3.625 with a short straight 1 · 0.5 · 0.5, the €’s language. Outline air bowl→bar 3.25 · 2.25 · 2.625; filled at 2.5 · 2 · 2 (ink box identical) 1.75 · 1.5 · 1.5 — 1.5 everywhere, no notes. Stays clear of the ₽: its bar runs through the bowl and out the right side, the ₽’s sits below the bowl and stops at the curve. Ink 14×16 · 11.5×13 · 10×12. Cost: one bar where the € has two, and Filipino readers mostly see two (recommended) -->
  <path d="M5 2.625V13.375"/>
  <path d="M5 2.625H7.25A3.75 3.625 0 0 1 11 6.25V6.75A3.75 3.625 0 0 1 7.25 10.375H5"/>
  <path d="M3.625 6.5H12.375"/>
