<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: window, app, application, chart, analytics, dashboard, stats, statistics, report, graph, metrics, data, line chart, trend, growth, performance -->
  <!-- Line chart: A line chart in the window, the picture Nucleo window-chart-line draws: one line that climbs, dips and climbs again to the top-right corner, low under the dot and high away from it. Drawn as chart-line and chart-line-2 draw their lines (45 degree legs, C10 bends 0.75 · 0.75 · 0.625). Legs up, down, up: 4, 2.5, 6 · 2.5, 1.5, 3.5 · 2, 1.25, 2.5 (about 1.6 : 1 : 2.2 at every master). Chart ink 14x9 · 9x6 · 7x4.5 (x 5 to 19, y 7.5 to 16.5 · x 6 to 15, y 7 to 13 · x 5.25 to 12.25, y 5.75 to 10.25). One traffic light, as window-pointer keeps one. With window's three dots the body under the dot row is 9.5 · 5.5 · 4.5 clear (y 9 to 18.5 · 9 to 14.5 · 7.25 to 11.75), which after 1.5 of air above and below leaves a chart 6.5 · 2.5 · 1.5 tall: at 16 one line weight, a flat line or a row of pills, and beside the third dot there is 6.5 · 2.5 · 2.5 to the right wall, room for no chart at 20 and 16. Two dots still pin the line flat under them at 16 (0.25 of travel) and leave room for one tall bar. So the second and third dots go at every master and the first stays, window's dot verbatim (6,8 · 6,8 · 4.5,6.5). The frame is window's path verbatim, whole and in place; the composite keeps the landscape keyline 20x16 · 16x12 · 14x10, centred, so it needs no box or base note. Air: to the frame 1.5 · 1.5 · 1.5 (the line's end to the right wall at every master, also the left wall at 24 and the floor and roof at 20 and 16; at 24 the chart sits centred, 2 above and below); to the dot 3.6 · 1.79 · 1.81. chart-line's own line (a short rise, a deep dip, a long climb) does not fit at 20 and 16: its first 45 degree rise from the floor heads into the dot, and a version with an even first bump read as a check mark in real pixels at 16, the short dip and long climb of check. Filled: window-filled's slab with its first hole (2 · 2 · 1.5 across) and the chart knocked out 1.5 wide, because the window fills as a shape and a shape's lines are cut out of it (chart-bar-5-filled cuts its bars, activity-circle-filled its pulse); a solid chart on a solid slab would not show. Filled ink box identical to the outline's. The cut follows the outline's centreline: outer bends concentric at radius 1.5 · 1.5 · 1.375, inner corners sharp (the cut is a 1.5 slit, so C1's corner floor does not apply), round ends on the outline's ink ends (at 16 the cap centres pulled in 0.125 on each axis, so a 0.75 cap ends 0.05 short of where the outline's 0.625 cap ends). Solid from the cut to the slab's edge 3.02 · 3.02 · 2.77, to the hole 3.6 · 1.79 · 1.68 (floor 1.5 · 1.5 · 1.25). Off-grid decimals: the bends' tangent points, vertex plus or minus 0.53 · 0.53 · 0.442 (chart-line's), and in the filled twin the cut's offset points (0.53, and 1.06 · 1.06 · 1.061 to the sharp inner corners). (recommended: the picture the reference draws, and at 16 it still reads as a rising line chart, where B's bars lose one bar and line up behind the dot) -->
  <path d="M3.125 3.625H12.875A1.5 1.5 0 0 1 14.375 5.125V10.875A1.5 1.5 0 0 1 12.875 12.375H3.125A1.5 1.5 0 0 1 1.625 10.875V5.125A1.5 1.5 0 0 1 3.125 3.625Z"/>
  <path d="M4.375 6.5A0.125 0.125 0 1 0 4.625 6.5A0.125 0.125 0 1 0 4.375 6.5Z"/>
  <path d="M5.875 9.625L7.433 8.067A0.625 0.625 0 0 1 8.317 8.067L8.683 8.433A0.625 0.625 0 0 0 9.567 8.433L11.625 6.375"/>
</svg>
