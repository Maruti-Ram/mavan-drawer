  <!-- tags: wireless, fan, signal -->
  <!-- The fan: Rhythm: one shape, no repeats — a fan sector on the keyline, apex r1.5 · 1.25 · 1 and top corners the same (the detail radius), r15.25 · 11 · 9 about its point; sides 49.5 · 44.7 · 40.6° above level, set by the keyline's own proportion (20×16 is squarer than 14×10, so the fan opens wider as the master shrinks). Ink 19.98×15.94 · 16×11.99 · 14×9.93, landscape keyline, centred within 0.03. Balance: mass 1.33 · 0.85 · 0.67 above centre, outline and filled alike. Filled: the solid fan — the strongest filled wifi on the board, Android's status-bar picture. Outline: the empty fan, which in Material means "Wi-Fi, no bars" (signal_wifi_0_bar), and at 16 the hollow fan reads close to a gem or a down-pointing shield. Who: Material signal_wifi_4_bar / signal_wifi_0_bar, Phosphor wifi-high-fill (Phosphor's filled style draws A's arcs as this solid fan). Outline style: a hollow full fan reads as 'none' — it is Material's 0_bar, and wifi-2-none's outline is this very drawing; wifi-2-none equals D only if the hollow full fan is kept. D-solid is the alternative (full = solid, Material's outlined 4_bar). wifi-off: the bar crosses the fan as ban's crosses its disc (C21's filled question returns). -->
  <path d="M1.974 7.459A1 1 0 0 1 1.953 5.959A9 9 0 0 1 14.047 5.959A1 1 0 0 1 14.026 7.459L8.651 12.067A1 1 0 0 1 7.349 12.067Z"/>
