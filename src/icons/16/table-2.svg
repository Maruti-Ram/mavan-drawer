<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: table, data, rows, columns, spreadsheet, sheet, header row, open -->
  <!-- Header + 2 columns: One horizontal and one column: literally layout-header with a column divider added, and at every master the horizontal sits on layout-header's own line (9.75 · 8.5 · 6.625), so the two icons share a drawing. Header air 4.5 · 3.25 · 2.75, body 9 · 6.25 · 5.5, columns 6.75 · 4.75 · 4.125 — by far the most open of the three and the only one whose cells never go below 2.75. The cost is recognition: four cells inside a rounded square is close to what grid already draws with its four squares, and at 16 the pair may be hard to tell apart. -->
  <path d="M4.125 2.625H11.875A1.5 1.5 0 0 1 13.375 4.125V11.875A1.5 1.5 0 0 1 11.875 13.375H4.125A1.5 1.5 0 0 1 2.625 11.875V4.125A1.5 1.5 0 0 1 4.125 2.625Z"/>
