  <!-- Chevron: Rhythm: the chevron’s two open ends sit exactly on rows 2 and 3, so its legs share the lines’ rows and its point aims at the gap between them; it stands 3 below the full line, the stack’s own row air (3.25 at 16). It points left, out to the margin. Rows are menu’s and list-bullet’s own (centrelines 7.5/12/16.5 · 5.5/10/14.5 · 3.5/8/12.5, pitch 4.5, air 3 · 3 · 3.25; C17) and the stack is list-bullet’s width (ink 3→21 · 3→17 · 2→14), so it sits on list-bullet’s rows in a toolbar. Top line full, the two lines under it start further in, and the cue sits in the pocket under the top line, centred between rows 2 and 3 (14.25 · 12.25 · 10.25). Box 18×10.5 · 14×10.5 · 12×10.25, centred. Chevron: the shipped chevron’s construction (45° legs, bend 0.75 · 0.75 · 0.625, C10), ink 3.44×6 · 3.44×6 · 3.24×5.75. Same air on both members (review, 2026-10-22): a point facing the gap between two rows sits closer than a flat back or open ends facing the line ends square-on, so the indent member’s cue sits 0.5 further in than the outdent’s (0.625 for B at 16) and both hold the same air to the lines. Indented lines ink 9.25→21 · 9→17 · 7.625→14 (11.75 · 8 · 6.375 long), shared by both members. Air, chevron to the indented lines: indent 2.84 · 2.62 · 2.40, outdent 2.81 · 2.56 · 2.38; filled indent 1.99 · 2.18 · 1.73, outdent 2.02 · 2.16 · 1.79. Filled: C17 — the lines thicken in place to 2.5 · 2 · 2, ends pulled in 0.5 · 0.25 · 0.375, row air 2 · 2.5 · 2.5; the stack stands 0.5 · 0.25 · 0.375 proud top and bottom (grows). Filled chevron (review, 2026-10-22: the grown 1.96 bend read as a bean): its open ends stay on rows 2 and 3 — it thickens in place like the lines — moving sideways only, so the cap holds the box edge; the bend is the filled minimum 1.25 · 1 · 1, so each straight leg is 1.93 · 2.18 · 2.18 long (was about 0.5) and it reads as a point. Its tip stands 0.79 · 0.40 · 0.60 further out than the outline’s, inside the pocket. Mass 0.43 · 0.27 · 0.18 right of centre (outdent 0.42 · 0.24 · 0.09). Kept apart from menu-arrow-left/right by the full top line (menu-arrow puts the chevron beside three equal short lines — Lucide’s list-indent-decrease is that drawing, which is why this one is not). Who: Lucide (list-indent-increase / -decrease, in our refs), Tabler (indent-increase / -decrease), Phosphor (TextIndent / TextOutdent, from memory). Same construction as indent B: same lines in the same places, only the cue turned round. -->
