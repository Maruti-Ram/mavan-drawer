  <!-- Down-left, tight: Back sheet offset down-left by 3 · 3 · 3, the tightest the 1.5 gap allows (3 = 1.5 of air + one stroke), showing only its left side, its bottom-left corner and its bottom; its ends stop where its other two corners would begin. Ink 16x20 · 12x16 · 10x14, the portrait keyline (the single `file`'s own box), so the stack sits exactly where the single does. Front sheet 13x17 · 9x13 · 7x11 (81% · 75% · 70% of `file`'s width), `file`'s drawing brought down: container radius 2.5 · 2 · 1.5, chamfer 5 · 3.5 · 3 (about `file`'s 41 · 48 · 46% of the width, never under C23's 3.0 floor), fold radius a quarter of the chamfer; the fold's counter holds a circle of 1.42 · 0.54 · 0.52 (edge to edge; the shipped `file` measures 2.01 · 1.42 · 1.15 the same way). Outline gap between the sheets measured 1.5 · 1.5 · 1.75 (floor 1.5). At 16 the line is 1.25, so the same 3 leaves 1.75 of air. Filled: the front is `file-filled` (flap split off by the 1.5 cut, tips r0.25); the sheet behind is a solid, cut 1.5 from the front (the users-behind rule, the same cut seen as two solids), cut ends rounded r0.75. It runs 1.5 · 1.5 · 1.5 thick on its straights and 2.74 · 2.74 · 2.74 at its corner, where the front's corner grown by 1.5 is rounder than the back sheet's own. Air measured 1.5 · 1.5 · 1.5. Off-grid values are computed, not rounded: the fold and flap tangent points and the r0.5 / r0.25 / r0.75 cut fillets of the filled drawings. Why: the back reads as the same sheet, not a bracket; the front stays as big as a stack can (tight offset); the fold stays in the open top-right corner; Lucide builds it this way; at 16 it stays two sheets and nothing clogs (recommended). -->
