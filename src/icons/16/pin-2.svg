<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: pushpin, thumbtack, keep, upright, curved -->
  <!-- Upright, curved flare: Stepped cap, straight waist, curved flare - the Lucide and Polaris construction. A flat cap 10 · 10 · 8 wide and 5 · 5 · 4 tall steps in (2 · 2 · 2 each side) to a waist 6 · 6 · 4 (clear 3 · 3 · 1.5), which curves out through one arc (r6 · 4 · 2.5, cut back at 20 and 16 so the filled twin's arc, r minus half the stroke, still fits the waist) into a 45 run to the plate edge 16 · 12 · 10; body 15 · 12 · 10, needle 5 · 4 · 4. The step's inner corner is drawn without an arc (the round join closes it); the filled twin keeps it sharp. The cap's top and step need 3 · 3 · 2.75 between centrelines to keep 1.5 clear inside; 24 and 20 take the next whole-pixel step, 3.5. Reads as a real pushpin head with a soft collar, and nothing like map-pin's teardrop or map-pin-5's ball on the ground (recommended: the most familiar pushpin at 16 in both styles, every flat edge crisp, and the curve echoes map-pin-2's curved sides). -->
