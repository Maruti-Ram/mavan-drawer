<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- keyline: mark -->
  <!-- tags: adjust, controls, filters, settings, tune, vertical, ring, mixer, equalizer -->
  <!-- Upright tracks, ring joined: Turned upright like a mixing desk: three tracks with joined ring knobs, high - low - high, filling the square guide box at 24 and 20 (ink 18×18 · 14×14 · 12×12). Says "levels" or "equaliser" more than "filters". Tracks 6 · 4.75 · 7 apart, rings 6 · 4.5 · 5 across with holes 3 · 1.5 · 2.5. At 16 it drops to two tracks: three rings of the smallest legal size (4 across) need tracks 4 apart in a 12 box, which leaves 1.375 between a ring and the next track - under the 1.5 floor - and a 4-wide ring's hole closed to grey in real pixels anyway. So 16 is A turned on its side. Smallest gap 2.25 at 24 (left track end to middle ring), 1.75 at 20 (left track end to middle ring), 2.616 at 16 (left ring to right ring). Filled: the shape case - each knob fills to a solid disc the size of the ring's outer edge, tracks stay at the outline weight 1.5 · 1.5 · 1.25; filled ink box equals the outline's at all three. -->
  <path d="M4.5 2.625V4.625"/>
  <path d="M4.5 8.375V13.375"/>
  <path d="M2.625 6.5A1.875 1.875 0 1 0 6.375 6.5A1.875 1.875 0 1 0 2.625 6.5Z"/>
  <path d="M11.5 2.625V7.625"/>
  <path d="M11.5 11.375V13.375"/>
  <path d="M9.625 9.5A1.875 1.875 0 1 0 13.375 9.5A1.875 1.875 0 1 0 9.625 9.5Z"/>
</svg>
