  <!-- Plus between the brackets: Plus between the brackets: code's two brackets verbatim and in place, the slash replaced by a plus centred between them (an inside mark, as coins-plus puts its plus on the coin; C18). The plus is the mark itself here, not a badge, so it goes to the filled weight with the brackets. Plus 8 · 5 · 3.75 ink, the same in both styles: the corner plus's 8 holds at 24, but the filled brackets' fat open ends set the size below it. At 20 the 6 keeps 1.51 in the outline and only 1.20 filled, 5.5 keeps 1.40 filled, so 5. At 16 the 5 keeps 1.40 even in the outline; the outline alone would hold 4.5 (1.58), but filled 4.5 keeps 1.24 and 4 keeps 1.47, so 3.75. Air plus to brackets 2.21 · 1.86 · 1.88 outline, 1.57 · 1.61 · 1.58 filled: arm tip to the bracket's arm at 24, to its open end's cap at 20 and 16. Ink box 17.88x9 · 13.88x6 · 11.98x5, centred (the slash's height goes with it). Every decimal is code's own. -->
