<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: cd, dvd, optical, sheen, album, music -->
  <!-- CD with sheen: Rhythm: the rim, two glints and the spindle sit at equal air at every master: spindle to glint 2.75 · 2 · 1.75, glint to rim 2.75 · 2 · 1.75 (24 · 20 · 16). Rim ⌀20 · 16 · 14 (the circle keyline, as target and film-reel), glints are 70° arcs at r 5 · 3.75 · 3.375 (0.54 · 0.52 · 0.53 of the rim) centred on the diagonals, top-left and bottom-right, so the disc is point-symmetric and box-centred; spindle dot ⌀3 · 2 · 2. Ink 20×20 · 16×16 · 14×14. The glints are open arcs, not target's full inner ring, and cover a third of a circle, not half (quarter arcs read as a broken target beside it at 16). Filled: the disc solid, the spindle a white hole the size of the dot (⌀3 · 2 · 2), each glint a 1.5 white band at the same radius; material hole to glint 2.75 · 2 · 1.62, glint to edge 4.25 · 3.5 · 2.88. Glint ends sit off the quarter grid (diagonal arcs). Who: Tabler disc, Lucide disc-3, Untitled UI disc-02, Phosphor vinyl-record. Only three of the five are separate pictures — the CD (A, B, C), the record player (D) and the album sleeve (E); A, B and C are the three CD constructions real sets use. (recommended) — the glints are what make a ring read as a shiny disc rather than a target or a donut, they keep 1.75 of air at 16, and the filled twin still reads as a CD. -->
  <path d="M1.625 8A6.375 6.375 0 1 0 14.375 8A6.375 6.375 0 1 0 1.625 8Z"/>
  <path d="M7.625 8A0.375 0.375 0 1 0 8.375 8A0.375 0.375 0 1 0 7.625 8Z"/>
  <path d="M4.676 7.414A3.375 3.375 0 0 1 7.414 4.676"/>
  <path d="M11.324 8.586A3.375 3.375 0 0 1 8.586 11.324"/>
</svg>
