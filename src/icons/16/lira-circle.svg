  <!-- Two bars: The shipped lira's construction, scaled into the coin: a straight stem, a corner at the foot, one quarter-oval bowl ending upright at the tip, and two parallel bars leaning 21.8°. Bowl rx×ry 6×4.5 · 5.5×3.75 · 4.5×2.25, tip rising 48 · 45 · 33% of the height (bare 47 · 46 · 36%). Bars 3.25 · 3.25 · 2.75 apart, standing 2.75 · 2.25 · 2.125 left of the stem, right arm 3 · 2.25 · 2.125. ₺ 10.25×11 · 9.25×10 · 7.88×8.75, against the € 9.41×11 · 7.27×8 · 6.56×7.5 and the $ 8.25×11 · 8×9 · 7.65×8. It is taller at 20 and 16 because two bars need the height. Placed by air: ink box centred within 0.13, body 1.5 · 1.25 · 1.13 right of centre. Ring air at 24: 2.77 above the stem and below the foot, 3.41 and 2.89 at the bar ends (€ 2.77–2.89). At 20: 1.24, lower bar 1.3. At 16: 1.21, lower bar 1.19 (€ 2.25–2.34 · 1.88–1.94). Tip air where the bars cross the stem 1.58 · 1.22 · 1.32. Bars 1.52 · 1.52 · 1.3 apart. Outline gap notes: 1.2 at 20 (smallest 1.22, the tip air) and 1.15 at 16 (smallest 1.18, the lower bar to the ring). Filled: the disc, r 10 · 8 · 7, with the ₺ cut out as one hole of its own path. The cut is 1.5 wide everywhere: the bowl is cut between ovals rx ± 0.75 and ry ± 0.75, as euro-circle's is, with the inner or outer oval eased by 0.05–0.2 at 20 and 16 so the cut holds 1.5 round the tip. Disc left at 24: 1.5 (bars 1.52, bar to bowl 1.51). Two warnings kept, because the knockout check takes no gap note: 1.45 at 20 (lower bar to bowl at the foot) and 1.04 at 16 (between the bars, and from the lower bar to the bowl). Off-grid decimals: the bars' right ends, where the 21.8° lean lands (0.4 rise per unit), and every point of the knockout, which is the stroke's edge. Reads as ₺ at 16 in real pixels, outline and filled, a little dense in filled. (recommended) -->
