  <!-- Plus on the rim corner: What the eye sees: the shipped bell, kept exactly where bell has it, with the V2 plus on its bottom-right corner, where the bell is widest. The plus takes the lower part of the right flare, the right half of the rim and the clapper's right end; the dome, the left flare and the left half of the rim stay as shipped. References put the plus top-right on a bell; C33 puts a badge bottom-right. Plus copied from the V2 spec string for string: bar and arm 8 · 6 · 5 of ink, centre 18,18 · 15,15 · 12.5,12.5, ink corner on the margin edge 22 · 18 · 15 (C33), at the outline weight in both styles. Cut back by hand with 1.5 of air from the plus's ink, and no line enters the plus's box (x and y from 14 · 12 · 10; spec 3a). The body becomes one open path: from the rim's cut end round the left corner, up the left flare, over the dome and down the right flare. Right flare: stops at 17.76,11.75 · 14.27,9.83 · 11.58,8.03, 3.51 · 3.10 · 3.18 below the dome (of 9.23 · 6.66 · 5.90); air to the arm's top cap 1.51 · 1.51 · 1.50, the air decides (its cap's lowest ink, y 12.5 · 10.58 · 8.655, is above the box). Each end is the flare circle where it meets the air line, rounded to 2 · 2 · 3 dp away from the plus, 0.0035 · 0.0028 · 0.0002 off the shipped circle. Rim: stops at x 11.75 · 10.25 · 8.5 (cap ink to 12.5 · 11 · 9.125, left of the box), 7 · 5.5 · 4.875 past its corner (of 14.5 · 10.5 · 8.75); air to the bar's left cap 1.59 · 1.55 · 1.58 (one grid step further leaves 1.35 · 1.35 · 1.49). The rim's right corner goes whole. Clapper: the bar's left end sat 0.87 · 0.34 · 0.35 from the shipped clapper, so its right end is cut. It now runs from its left end round the bottom to 13.25,20.92 · 10.63,17.13 · 8.528,14.28, 30 · 22 · 20 deg past the bottom (shipped 53 · 62 · 65), keeping 3.63 · 2.48 · 2.26 of 4.64 · 3.67 · 3.44; at 24 the box decides (cap ink to x 14, air 1.78), at 20 and 16 the air (1.505 · 1.501); 0.004 · 0.001 · 0 off the shipped circle after rounding. 74 · 76 · 79% of the body's line survives. Box 18x20 · 14x16 · 12x14 (declared): bell's 16x20 · 12x16 · 10x14 plus the 2 the plus stands right of it, so the centre sits 1 right of the canvas centre at every master; base: bell holds the composite to bell's left and top edges, as credit-card-contactless keeps its card. Filled: bell-filled's solid cut along the plus's ink grown 1.5 (radius 2.25 · 2.25 · 2.125 round each arm end, straight along the arms' sides), the cut's corners eased 0.5 as map-pinned's and user-plus's; the clapper stays a line, cut as the outline's; the plus a line at 1.5 · 1.5 · 1.25. The flare edge leaves at 18.54,11.92 · 15.05,9.93 · 12.215,8.009, eased 0.5 onto the arm's grown top. At 24 the cut rounds the arm's top to 15.75,14.75, runs down its side to the tab between the arms at 15.75,15.75 (eased 0.5) and round the bar's left end; at 20 and 16 the two grown circles meet (12.75,12.75) and cross (10.388,10.388), eased 0.5 between 12.78,12.37 / 12.37,12.78 and 10.444,10.087 / 10.087,10.444, as user-plus. The bottom edge ends in the outline rim's own round cap (centred 11.75,17.25 · 10.25,13.25 · 8.5,10.625, radius 0.75 · 0.75 · 0.625), joined to the bar's grown end by the line tangent to both (0.75 · 0.55 · 0.69 long), so the filled bottom edge turns up where the outline's rim does. Tightest air, filled: 1.500 · 1.502 · 1.500 along the cut. Off-grid numbers: the cut ends above; in the filled twin the flare's exit and the tangent points of the fillets and of the cap's join (24: 18.54,11.92 / 18.04,12.5, 12.76,16.94 / 12.41,17.6; 20: 15.05,9.93 / 14.64,10.52, 11.17,13.39 / 10.78,13.78; 16: 12.215,8.009 / 11.874,8.594, 9.418,10.75 / 8.855,11.14), each rounded on the side that keeps 1.5 and stays inside bell-filled's edge, the cap's points onto the cap's circle; the path turns at most 0.65 deg at any join. bell-filled's own 0.004 overhang on the left flare (24 and 20) is kept as shipped. (recommended) -->
