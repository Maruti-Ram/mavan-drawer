<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: wheelchair, accessibility, accessible, a11y, disabled, in motion -->
  <!-- No arm, 30° lean: W1 without the arm; nothing else changes. Shared with wheelchair, verbatim: the wheel (12 · 9.5 · 7.75 across, opening 135°, filled 170°), the head dot (3 · 3 · 2.5 across), the seat line, knee bend, 32° shin and foot, the box 18×18 · 14×14 · 12×12, and bends of half the weight (0.75 · 0.75 · 0.625; filled 1.25 · 1 · 1). The torso leans 30° at every master as one straight line, 7.5 · 4.33 · 3.26 from the hip to the neck, with the head on that line 1.5 above its end. (recommended) At 16 it is the only one of the three that keeps a clean shape in the set: a leaning stroke with the head on its end, where W1 and W3 knot into an X. It does what the shipped wheelchair did with its forward arm, left out at every size to keep one picture, so the two read as a pair: upright and leaning forward. The lean and the head carried forward say motion; the cost is the swept-back arm, the Accessible Icon's signature. Air: head to torso 1.5 at every master, outline and filled; leg to wheel 2.2 · 1.51 · 1.71 (filled 2.36 · 2.1 · 1.82); head to wheel 8.22 · 5.73 · 4.95. Thigh's straight run 3.41 · 1.58 · 1.52 (filled 2.27 · 1.01 · 0.66). Filled: lines 2.5 · 2 · 2; the neck end pulls in by the added half weight, the foot keeps the right edge; ink box identical to the outline. The decimals are where the lean, the 1.5 neck gap and the half-weight bends put each point (the neck end is rounded away from the head); the seat, knee, shin, foot and wheel numbers are wheelchair's. -->
