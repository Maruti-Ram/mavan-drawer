  <!-- Soft bowl: What the eye sees: a softer crown — round tips over a bowl (Streamline Flex crown-remix construction, Akar crown’s curved base). Tips bend at 1.5 · 1.25 · 1 on the line, 2.25 · 2 · 1.625 on the ink, twice crown’s C10 tips; walls lean 15 · 16 · 21°; the base is one arc of radius 14 · 10.5 · 8.75 (sagitta 1.4 · 1.2 · 1.1 over a 12.2 · 9.9 · 8.5 chord) run into container-radius corners 2.5 · 2 · 1.5, so the bowl is 1.75 · 1.25 · 1.375 narrower than the tips each side. The valleys stay at C10’s 0.75 · 0.75 · 0.625 and open 122 · 128 · 116°: a round valley has to be r 1.5 · 1.5 · 1.375 to leave 1.5 of white in its U, and at that size the leg from a side tip to its valley ran parallel to the wall — lint read 1.33 · 0.76 · 0.57 of air inside the side tips — so the round valleys went. Landscape keyline, ink 20×16 · 16×12 · 14×10, centred. Nothing comes within 1.5; the inside of a round tip is 1.5 · 1 · 0.75 across, a bend’s own inside, not a gap. Off-grid decimals are the tangent points, including the bowl’s. Filled: the outer edge, tips at 2.25 · 2 · 1.625, valleys sharp. Why not the tall five-point crown the type asked for first (Clarity, Streamline vip-crown-queen-1): at 16 a 14-wide mark gives five tips a pitch of 3.5 (four tips 4.67); the air between two neighbouring legs drops under 1.5 one unit below the tips (pitch − 1.25 − 2·d·tan 20°), and holding 1.5 of white at each notch’s bottom leaves each peak 1.6 (2.4 for four) of ink across at the valley level — less than the 2.5 two 1.25 lines need side by side — so the peaks become bars and the crown a comb. Measured on paper, not drawn. Read at 16 in real pixels: a slightly softer crown — one pixel of rounder tip, one of curved base; beside crown it is a variant of weight, not a new picture, and the roundness sits nearer the comical end of the set than anything shipped. -->
