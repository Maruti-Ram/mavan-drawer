  <!-- Arrow badge: The shipped mail, unchanged and in place, with an arrow leaving its bottom-right corner as a C33 badge, the arrow's ink corner on the margin edge (22 · 18 · 15): the picture Polaris draws for EmailFollowUp (its arrow 6.56×5.5 on a 20 canvas, shaft 0.5 above the envelope's bottom line, as here). The arrow is the V3 arrow kit's (v3-kit-arrow.md, file-down B) turned a quarter to point right: the same head strings with x and y swapped, legs at 45 deg into a C10 bend of 0.75 · 0.75 · 0.625 that reaches the shaft's end, half-width 2.5 · 2.5 · 2.25, C37's floor (head air 1.0 · 1.0 · 1.0), and the arrow stays a line at 1.5 · 1.5 · 1.25 in both styles. Its shaft is shortened from the kit's 9.5 · 8 · 7.13 to 8.5 · 7.25 · 5.5: mail's flap comes to a point in the middle of the envelope, and with the kit's length the filled twin would keep only 1.36 · 0.91 of envelope between the flap's white band and the 1.5 of white round the arrow's tail at 20 and 16 (floor 1.5 · 1.25); shortened it keeps 3.96 · 1.52 · 1.29. 24 is shortened with them so the arrow keeps one proportion, 0.35 · 0.36 · 0.34 of the canvas. Ink 8.5×6.5 at 13.5,15.5 · 7.25×6.5 at 10.75,11.5 · 5.5×5.75 at 9.5,9.25 (window-key's key, which also lies long on a landscape base, is 11×6 · 9×5 · 8×4.5; phone-forwarded's arrow 10×8 · 7.5×7 · 6×6.25). The shaft sits 0.5 · 0.5 · 0.25 above the envelope's bottom line: the head needs 2.5 · 2.5 · 2.25 below the shaft and the margin edge holds the ink, the same offset the kit's arrow keeps from file's right wall. Box 20×18 · 16×14 · 14×12 (declared): mail's 20×16 · 16×12 · 14×10 plus the 2 the arrow stands below it; centre 12,13 · 10,11 · 8,9, 1 below the canvas centre at every master. The envelope keeps its place, as credit-card-lock and window-key keep their landscape bases, so the files declare <!— base: mail —> and lint holds the composite to mail's left and top edges. Cut back by hand with 1.5 of air from the arrow's ink. Bottom wall stops at x 11.25 · 8.5 · 7.375, 6 · 3.75 · 4.25 past its corner, 1.54 · 1.54 · 1.51 from the shaft's tail. Right wall: the air would let it keep 6.75 · 3.25 · 2.75 past its corner (1.64 · 1.64 · 1.57 from the head), but the filled twin cannot keep the envelope under the flap's right arm at 20 and 16 (below), so the wall goes at every master and the frame ends on its corner's arc, at the point where the flap's right arm ends (21.25,7.25 · 17.25,6.75 · 14.375,5.125), two round caps on one point: outline and filled end the right side in the same place and the three masters show one picture, as credit-card-lock's 24 drops the wall its air allowed. The bottom-right corner goes. The flap is whole at every master: its right arm is 5.25 · 2.26 · 1.96 from the head. Tightest air, outline: 1.54 · 1.54 · 1.51, the bottom wall to the shaft. Filled: mail-filled's flap whole. The body cut along the arrow's ink grown by 1.5: round the tail (r 2.25 · 2.25 · 2.125), along the shaft's top at y 16.5 · 12.5 · 10, and straight up the head's grown side (x 16.75 · 12.75 · 10.25, 1.56 · 1.56 · 1.53 from the upper leg) to the flap's white band. The body under the flap's right arm goes: at 20 and 16 it would hang on a neck 0.76 · 0.33 thick between the band and the head's white (floor 1.5 · 1.25), and 24 follows, as credit-card-lock-filled runs its cut straight up the shackle's side. The bottom edge ends at x 12 · 9.25 · 8, where the outline's bottom wall's ink ends, its corner at the cap radius 0.75 · 0.75 · 0.625. Junctions eased 0.5. Filled air 1.5 · 1.5 · 1.5 (the shaft's band); ink box equal to the outline's. Off-grid decimals: the kit's head (leg ends and bend tangents 19.06, 21.03, 18.22, 19.28 · 15.06, 17.03, 14.22, 15.28 · 12.384, 14.192, 11.683, 12.567, on the 45 deg lines, as arrow-right's 14.81); in the filled only the 0.5 fillets' tangent points (16 11.09, 16.75 11.52 · 12.01 10.5, 12.75 10.94 · 9.509 8.652, 10.25 9.09, 9.527, 9.821 10.022). Cost: the envelope gives up its bottom-right corner and its right side under the flap's corner, in both styles. (recommended: the only picture that fits under the flap's point at every master in both styles, a low wide badge; at 16 px it reads as envelope and arrow, flap whole, as Polaris draws it) -->
