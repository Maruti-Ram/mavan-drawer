<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: pages, read, library, curl, bookmark, ribbon -->
  <!-- Page curl, ribbon: Page curl and a bookmark ribbon. D's cover with a forked ribbon hanging from the top edge near the fore-edge; the fork is cut at 45 degrees. Ribbon 3 · 3 · 2.75 wide on its centreline (1.5 clear inside), 1.5 clear of the right edge, tails at y 10.75 · 9.25 · 7.625, fork 1.5 · 1.5 · 1.375 deep. Ink box 16x20 · 12x16 · 10x14, filled identical; curl radius 2 · 1.75 · 1.5, page band clear 2.5 · 2 · 1.75. Filled: the ribbon knocked out at its ink width (4.5 · 4.5 · 4) under a top strip 1.5 · 1.5 · 1.25 thick, fork tooth rounded 0.5 · 0.5 · 0.375; the fork's slanted edges are off the quarter grid (lint's documented exception for filled cut-outs). What it costs: at 16 filled the fork does not resolve and the ribbon reads as a window over a bottom band - the save (floppy) icon. And `book-bookmark` (#419) is queued as its own variant; this would take its idea -->
  <path d="M4.625 1.625H11.375A1 1 0 0 1 12.375 2.625V13.375A1 1 0 0 1 11.375 14.375H5.125A1.5 1.5 0 0 1 3.625 12.875V2.625A1 1 0 0 1 4.625 1.625Z"/>
