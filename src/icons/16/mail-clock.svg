  <!-- Clock on the envelope: The clock is now file-clock's shipped clock. The ring is the same as before (ink 11 · 9.5 · 8, centreline radius 4.75 · 4 · 3.375, centre 16.5 · 13.25 · 11) and the hands are file-clock's, at 12 and 4:30 as the shipped clock and alarm-clock draw them, the strings copied from file-clock.svg and file-clock-filled.svg: minute 2.25 · 1.5 · 1.375 long, reaching 0.75 · 0.69 · 0.63 of the face, hour at 45 deg and 0.71 of the minute, tip air to the ring 1 · 1 · 1.01 under C38. The board declares hands: clock, which replaces the file-wide gap 1 this draft carried, so lint now holds the cut to a plain 1.5 itself. In the filled twin the white hands are a step longer than the outline's, as in file-clock-filled: the minute 2.75 · 2.25 · 2 long, reaching 0.64 · 0.63 · 0.61 of the disc's radius, the hour at 45 deg and 0.71 of it; at 16 the hands pivot on the ring's centre (11,11) as at 24 and 20 (2026-10-26: moved off it for crisp pixels they read misaligned); there the minute is 1.125 long in the outline and its white 1.75 long in the filled twin. The shipped mail with the clock as a C33 badge on its bottom-right corner, the clock's ink corner on the margin edge (22 · 18 · 15). What it costs on mail: the clock is 11 · 9.5 · 8 tall and the flap's point sits 6.33 · 4.33 · 4.01 from its centre, where the base needs 7.75 · 7 · 6.125 (5.5 · 4.75 · 4 of clock, 1.5 of air, half a stroke). So the flap's point goes at every master; its left arm keeps 8.87 · 5.36 · 4.95 of its 8.93 · 6.90 · 6.17 and stops 1.51 · 1.51 · 1.50 from the ring; its right arm could keep 3.4 · 0.74 · 0.78 from the corner and goes (under 1.5 at 20 and 16; 24 follows so the three masters show one picture). Right wall: 3 · 0.75 · 0.76 would be left past its corner, so it goes and the frame ends at the corner's arc. Bottom wall stops at x 9.25 · 6.5 · 5, 4 · 1.75 · 1.88 past its corner, 1.50 · 1.54 · 1.53 from the ring. Box 20×18 · 16×14 · 14×12 (declared), centre 1 below the canvas centre: the envelope keeps its place, so the files declare <!— base: mail —>. Tightest air, outline: 1.50 · 1.51 · 1.50 (bottom wall and the left arm to the ring). Filled: the clock is file-clock-filled's, a disc with its hands knocked out a step longer. mail-filled's flap and body cut along a circle, r 7 · 6.25 · 5.5 about the clock's centre, junctions eased 0.5 (the tangent points taken 0.005 · 0.005 · 0.002 outside it so 2 · 3 dp keep 1.5); the flap loses its point (the cut reaches 0.55 into it at 24 and takes the whole point at 20 and 16); the body keeps its left part, its bottom edge ending at x 10 · 7.25 · 5.63 where the outline's bottom wall's ink does, corner at the cap radius 0.75 · 0.75 · 0.625; the body under the flap's right arm goes with the outline's right wall. Filled air 1.50 · 1.50 · 1.50. Off-grid decimals: the flap's cut end (10.46 11.63 · 7.44 9.33 · 5.964 7.508, on the arm's line) and the outline's hour hand end (17.63 at 24, 11.19,12.065 at 16, 45 deg at 0.71) and, in the filled knockout, the 45-deg tangent points of the round join and cap (0.53 = 0.75 / root 2) and the inside corner 0.31 above the pivot, all file-clock's; in the filled only the cut's tangent points and fillets. Not recommended: at 20 and 16 the envelope keeps its frame and one diagonal and stops reading as mail; a clock that leaves the flap whole would be at most 9.25 · 6.75 · 5.75 across, under the 9.5 · 8 ring the clock has at 20 and 16. First drawn as mail-follow-up's B; Maruti kept it as its own icon, mail-clock (scheduled or snoozed mail), 2026-10-25. -->
  <path d="M5 12.375H3.125A1.5 1.5 0 0 1 1.625 10.875V5.125A1.5 1.5 0 0 1 3.125 3.625H12.875A1.5 1.5 0 0 1 14.375 5.125"/>
  <path d="M1.625 5.125L5.964 7.508"/>
