  <!-- tags: cut, cut here, dashed, coupon -->
  <!-- On a dashed cut line: Scissors cutting along a dashed line (Lucide scissors-line-dashed, Nucleo scissors-coupon; the 'cut here' mark). Rhythm and balance: A's construction, smaller; the dashed line runs on the centreline from between the blade tips to the right margin, two dashes of equal length with equal air. The dashes cannot carry the scissors' weight, so the drawing is pushed 0.5 · 0.25 · 0.25 right in the canvas (the largest move lint allows, 0.5), which moves the mass to 1.62 · 1.74 · 1.67 left of centre (was 2.53 · 2.23 · 2.07). Shortening the scissors made it worse (2.75 at 24), because the blades are what carries the weight to the right. Numbers 24 · 20 · 16: box 19×16 · 15.5×12 · 13.5×10 (20 and 16 on the landscape keyline; 24 declares its box); rings r 2.5 · 1.75 · 1.375, air inside 3.5 · 2 · 1.5, between rings 3 · 2 · 2, ring to the other blade 2.72 · 1.7 · 1.62; crossing at x 11 · 8.5 · 6.5. Dashes on the centreline 1.25 · 0.75 · 0.5 long (ink 2.75 · 2.25 · 1.75), air 2 · 1.5 · 1.625; the first dash sits inside the jaws, 1.51 · 1.51 · 1.58 from each blade. Maruti picked it 2026-10-22 (C35 dated note): these dashes are shorter than C35's 4 · 2.5 · 2.25 and the air is 2 · 1.5 · 1.625 against C35's 2.25 · 1.82 · 1.55. C35's dash leaves room for one dash, not two, at every master, because the first dash must sit 4.24 · 4.24 · 3.89 past the crossing to clear the blades. So, as on `ticket`, C35's evenness is kept (equal dashes, equal air, outline weight) and its lengths are not. At 16 the dashes are under 2 px and read as dots. Filled: solid handles, hole ⌀ 2 · 1.5 · 1.5; blades and dashes at the outline weight. Ink identical. -->
