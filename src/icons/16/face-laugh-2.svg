  <!-- Smiling eyes: Rhythm and balance: L1's mouth and stack (eye feet to lid 1.75 · 1.5 · 1.5, counter 2.25 · 1.5 · 1.5, lip to ring 2.25 · 1.5 · 1.5). The two ^ stand on the family's eye line (feet y 10.5 · 8.25 · 6.125) with their inner feet on the family's eye x, so the gap between them is the family's own, 3 · 2 · 2; apex-to-apex pitch 7.5 · 5.5 · 4.5 (0.41 · 0.38 · 0.35 of the ring); eye to ring 2.29 · 1.61 · 1.69, mirrored. Each eye is the set's chevron at eye size: legs at 45 degrees, apex bend at C10's half-weight radius 0.75 · 0.75 · 0.625, width 3 · 2 · 1.25, ink 4.5x2.69 · 3.5x2.19 · 2.5x1.62. 16 binds: the ring leaves a pocket about 1.5 x 1.2 above the mouth for each eye, so the ^ there is 2.5 px wide and reads as a soft cap more than a sharp ^; 24 and 20 match each other (0.22 of the ring's width), 16 is 20% smaller. Filled: eyes cut 2 · 1.75 · 1.75 wide like the family's dashes; between the two cuts 2.49 · 1.85 · 1.5, cut to mouth hole 1.75 · 1.67 · 1.5, rim 3.54 · 3.01 · 2.69. Drawn this way by Polaris SmileyJoy (its exact ^ eyes), Font Awesome face-laugh-beam / face-grin-beam, Nucleo face-grin-closed-eyes, Apple's grinning face with smiling eyes. At 16: apart from face-smile by the mouth; apart from L1 only by the eyes, a two-pixel difference. Off-grid numbers: the bend tangent points and the filled cut edges. -->
