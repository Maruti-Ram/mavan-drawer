<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: quill, feather, author, write -->
  <!-- Quill: The writer's quill: a feather on its rachis — Feather / Lucide feather, Phosphor Feather, Font Awesome feather, Tabler feather. The vane is a 45° band with a round crown and a square-cut base, the construction those sets share, drawn to our own numbers. Rhythm and balance: the rachis runs the canvas anti-diagonal, so the mark sits on the square keyline (18 · 14 · 12); the vane reaches down to 2 of the quill end so its weight sits on the centre — mass 0.23 · 0.06 · 0.09 right and −0.02 · 0.13 · −0.09 high in the outline (it was 0.69 / −0.47 at 24); filled 0.5 · 0.21 · 0.47 right and −0.82 · −0.53 · −0.47 high, the solid crown pulling it along the diagonal as compose-filled's pen does (−0.77 / 0.78). 24: vane 9 wide (centreline), crown r4.5, base corners r1.5; rachis from the quill end through the base corner to 1.5 short of the crown; barb at y 14, 2.75 of white to the base. 20: vane 7.5, crown r3.75, corners r1.25; barb at y 11.75, 1.5 of white to the base. 16: vane 6, crown r3, corners r1; no barb — rachis and barb inside a 6-wide vane read as a grey smudge at 1×, so 16 keeps the rachis only. Filled: the vane fills to the outline's outer edge; rachis and barb are cut as one white branch 1.5 wide, opening through the lower-right edge (at 16 the rachis cut alone, closed inside the vane); the quill stays a line at 1.5 · 1.5 · 1.25. Reads "write / author" more than "posts"; the only candidate with no page in it. Round 3: kept as a possible separate `quill` icon — a quill says "write" or "author", not "blog", so it is not a blog answer. Mass checked at 16: 0.09 right, 0.09 high outline; at 1× the feather reads, the rachis alone inside the vane. -->
