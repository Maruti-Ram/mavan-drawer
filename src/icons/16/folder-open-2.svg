  <!-- Whole flap, back cut short: The leaning flap of A drawn whole. Its left side runs on down into the folder's bottom-left corner, so the back's corner is hidden and the back's left wall stops 1.5 above the flap instead (at 10.5 · 8.5 · 6.375, the lowest grid point that keeps the air); the right wall ends at its top corner as in A. At 24 it reads as an open folder; at 16 its lean barely shows and it reads close to B. Same ink box as folder, centred. Angles: left side 1 across for 2 down, 63.43 deg at every master; right side as A, 75.96 · 74.74 · 75.26 deg. Flap corners at 2.5 · 2 · 1.5; top edge at 11.25 · 10.75 · 8.625. Air: the left wall end to the flap 1.55 · 1.56 · 1.69, the right corner end 2.04 · 1.89 · 1.52. Filled: two shapes with a band of 1.5 between them at every master; it follows the flap's top edge, round its top corner (an arc of 4.75 · 4.25 · 3.625 about the flap corner's centre) and down its left side. The back's left strip ends in a round end tangent to that band and to the outer edge, r 0.79 · 0.84 · 0.93, its lowest point at the outline cap's (11.25 · 9.25 · 7). The right cut corner eased 0.75 · 0.5 · 0.5 (at 16 tangent to the r2.25 corner, the filled back stopping at 6.5 against the outline's 6.75). Off-grid decimals: the flap corners' tangent points (snapped onto the arc), the band arc and the round end, the 16 ease, and folder's own tab decimals. -->
