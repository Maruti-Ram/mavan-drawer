<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: iris, shutter, lens, camera, six blades -->
  <!-- Iris, six straight blades: Rhythm: six blades at 60 degrees, every line continuing one side of a hexagon opening out to the rim, so the six white blade cells are identical and turn evenly round the centre. Opening circumradius 4.5 · 3.5 · 3.25 (0.45 · 0.44 · 0.46 of the outer radius; Lucide 0.46); white opening 6.29 · 4.56 · 4.37 across, white in each blade cell 3.52 · 2.44 · 2.12 across (widest circle, measured), each line 4.5 · 3.5 · 3.25 along the opening and 6.14 · 4.84 · 4.10 out to the rim. What set the opening: a line's air to the start of the next-but-one line is the side x sin 60 less one stroke, so the side must be at least 3.46 at 24 and 20 and 3.18 at 16; at 0.375 of the radius lint read 1.1 and 1.02 there. Rim = the circle keyline, 20 · 16 · 14 of ink. Lucide and Feather aperture, Phosphor Aperture, Nucleo aperture, Material camera, Myna UI and Boxicons shutter all draw six. Filled: the same lines and rim at the outline weight, the opening filled solid (a closed-down iris; Ionicons fills its centre the same way): ink 164 -> 199 · 126 -> 144 · 94 -> 110 (+21 · +14 · +18%), picture unchanged. Tried and dropped: the lines as white cuts in a black disc (Material camera) read as a white star at 16 and came out lighter than the outline (126 -> 120 at 20, 94 -> 86 at 16). Off-grid decimals are the 60 degree vertices and the lines' rim ends. (recommended) The aperture everyone already knows; six even blades read as an iris down to 16. -->
  <path d="M1.625 8A6.375 6.375 0 1 0 14.375 8A6.375 6.375 0 1 0 1.625 8Z"/>
  <path d="M11.25 8L7.577 14.361"/>
  <path d="M9.625 10.815L2.28 10.815"/>
  <path d="M6.375 10.815L2.702 4.454"/>
  <path d="M4.75 8L8.423 1.639"/>
  <path d="M6.375 5.185L13.72 5.185"/>
  <path d="M9.625 5.185L13.298 11.546"/>
</svg>
