<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: prohibition, rim -->
  <!-- Filled rim unbroken: A's outline unchanged; the filled cut stops 1.5 inside the rim (tip radius 8.5 / 6.5 / 5.5 against a disc of 10 / 8 / 7), so the rim runs all the way round and the disc stays ONE shape. Nothing is split, so nothing reads as a capsule, and the slot still crosses almost the whole face — endpoint radius 7.5 at 24 against the inset's 6. Cost, stated plainly: the outline's bar and the filled's cut are then different lengths. C18 puts the cut's cap centre on the outline's endpoint and every other pair in the set obeys it; matching them here is impossible, because pulling the outline back to 7.5 leaves its cap 0.25 short of the ring's inner edge. This is the direct answer to "looks inset without being inset": the outline is not inset, the filled is composed (recommended) -->
  <path d="M1.75 8A6.25 6.25 0 1 0 14.25 8A6.25 6.25 0 1 0 1.75 8Z"/>
  <path d="M3.58 3.58L12.42 12.42"/>
</svg>
