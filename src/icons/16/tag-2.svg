  <!-- Tag on a string: A's tag (same body, radii and dot) moved down and right so that the string fits above-left. The string starts at the hole dot and runs out along the tag's axis through the tip. It then bends up on an arc of radius 5 · 4 · 3.5 and ends at the top margin, at (3.25, 2.75) · (2.75, 2.75) · (1.875, 1.625). It crosses the tip square-on, because the tip's round corner turns across the axis there, so lint finds no tight wedge. Ink is 19.5×20 · 15.5×16 · 13.5×13.75, which fits the circle keyline at every master. The centre is 12.25,12 · 9.75,9.75 · 8,7.88. At 20 the body sits 0.5 up and left of 24's placement, so its dot lands on a pixel corner (11,11). Filled: the tag is solid with the hole punched (⌀2.5 · 2 · 2). The string does not cross the solid tag. It starts 1.5 off the filled tip, at 6.07 · 5.49 · 3.97 on the diagonal, and follows the same curve at the outline weight. A white slit through the tip would split it at 16. Nucleo draws this as tag-2: its string drops through the lower wall, and the wall is cut away around it. That cut would take 6 of the slope at our 1.5 gap, so the string leaves through the tip instead. Watch: in the filled twin the string floats 1.5 clear of the tip. -->
