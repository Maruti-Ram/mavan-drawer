<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: sync, loop, two-way, integration, round trip, connected -->
  <!-- Two tiles, linked both ways: Rhythm: the same pair on the diagonal (grid's cells), joined by two elbows that make a loop: one from the top-left tile's right wall round into the bottom-right tile's top, one from its left wall round into the first tile's bottom, both at hierarchy's radius 1.5 · 1.25 · 1. Point-symmetric: the white inside the loop is 6 · 5.25 · 4.5 wide on every side, and the tiles' facing corners are grid's gap, 3 · 3 · 2.5, apart on each axis. At 24 the elbows leave the wall centres; at 20 and 16 they sit 0.25 nearer each tile's outer corner, because two hidden ends inside one wall must keep 1.5 between them (as hierarchy). Ink 18×18 · 14×14 · 12×12, box-centred, margins 3 · 3 · 2, tile edges on whole pixels at 16. Who: Nucleo `squares-connected` (two squares, two elbow connectors), the icon this name comes from; Nucleo leaves a gap at each end of the links, ours join the walls as hierarchy and share do. Weak side: at 16 the two elbows and tiles close into one square outline with knobs on two corners, which can read as a frame or a crop box. Filled: two solid tiles, both elbows stay lines at 1.5 · 1.5 · 1.25 -->
