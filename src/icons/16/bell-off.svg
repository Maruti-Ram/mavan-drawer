  <!-- Bar cut through: What the eye sees: the bell struck by a bar held inside its own width. The bar takes the dome's upper left and the bell's lower right corner. Left: the dome with its right flare in one piece, a small corner of rim and left wall below the bar, and the whole clapper. The icon keeps the bell's box. Bar (C21): \ at 45°, its ink 16 · 12 · 10 square, centreline (4.75,4.75)-(19.25,19.25) · (4.75,4.75)-(15.25,15.25) · (3.625,3.625)-(12.375,12.375), centred on the bell's ink centre 12,12 · 10,10 · 8,8, 20.51 · 14.85 · 12.37 long; it ends flush with the bell's sides and 2 inside its top and bottom, and at 16 its ink ends on whole pixels (3 and 13). Its ends (24 · 20 · 16): the upper left stops 2.11 · 1.20 · 0.77 past the dome's cut tip along the bar, with 2.17 · 1.73 · 1.61 of air to it; the lower right stops 2.98 · 1.80 · 1.23 past the clapper, with 3.84 · 2.41 · 1.95 of air. The two ends are not evened: the bar's ink fills the bell's width at both ends and is centred on the bell, so neither end can move without growing the box or taking the bar off centre. The difference is the bell's own shape (the dome curls toward the upper end; the clapper sits low and narrow). Evening the air would mean sliding the bar down, away from the bell's mass, which already sits above its box centre. Cut: every stroke stops with 1.5 of air from the bar's edge, measured 1.505 · 1.505 · 1.501–1.505; round caps. The 16 cut ends stay where the 1.5 puts them and are not snapped to whole or half pixels: the nearest snaps add 0.13 to 0.32 of air at single cuts (the rim's end ink 7.36 → 7 gives air 1.76 and a rim 3.11 → 2.75), and even air at every cut comes first. Kept: the lower-left piece, rim 8.25 · 4.25 · 3.11 turning up into the left wall 6.84 · 3.44 · 2.48 (15.09 · 7.69 · 5.59); the upper-right piece, the dome from 10:37 · 10:50 · 10:49 round to 3:00 (12.61 · 8.71 · 7.11) running down the right wall 5.73 · 3.34 · 2.74 (18.34 · 12.05 · 9.85); the clapper whole, 2.92 · 1.93 · 1.67 of air to the bar. The lower-left piece is 0.82 · 0.64 · 0.57 of the upper-right's length but is no crumb: its shortest leg is 2.48 at 16, over the 1.5 floor, and it carries the rim, so it stays. The cut cannot grow it without moving the bar. Removed: the dome's upper left with the top of the left wall (7.06 · 7.07 · 6.52) and the lower-right corner with the rim's right end (9.74 · 9.57 · 8.79); 67 · 54 · 50% of the body survives. Balance: the mass sits −0.21,+0.05 · −0.09,−0.20 · −0.06,−0.21 from the canvas centre, against the bell's own 0,+0.28 · 0,−0.15 · 0,−0.19: the cut moves it 0.23 at most. Filled mass −0.13,−0.86 · +0.02,−0.90 · +0.05,−0.87 (bell-filled 0,−0.65 · 0,−0.81 · 0,−0.79). Ink 16×20 · 12×16 · 10×14, centred, the portrait keyline. Filled: a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side) knocked out of the solid bell. Its corners round at r0.75 · 0.75 · 0.625 about the outline's cut ends, so each solid's tip is the outline's cap; white 1.506 · 1.506 · 1.501 each side. Two solids; the rim-and-wall wedge is 0.63 · 0.46 · 0.40 of the dome's area. The clapper stays a line. Its right end is 1.67 from the bar at 16 (1.93 at 20), 0.17 outside the channel's edge, so the channel never reaches it. The bar runs whole through the channel at 1.5 · 1.5 · 1.25. The dome arc is written in two parts through its top so the rounded cut end cannot tilt it. Off-grid decimals are the cut ends and the channel's corners, where the circles put them. (recommended) -->
