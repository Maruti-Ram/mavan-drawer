<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: page and pen, write, post, article -->
  <!-- box: 12x14 -->
  <!-- Page and pen: The metaphor Shopify admins already read as "Blog posts" — Polaris BlogIcon (Nucleo blog, Lucide file-pen-line and Tabler file-pencil are the same page-and-pen idea) — drawn in Polaris's layout: the pen comes in at the top-right corner and writes on a portrait page, with one text line under it. Closest relative is compose-2 (a square with the same pen); what tells them apart is the portrait page and the line of text. Rhythm and balance: the same picture at every master — pen at about three quarters of compose's tip-to-band length, one full text line, the page keeping a real top wall and right wall; mass on the canvas centre in the outline (0.02 · −0.22 · −0.19 left of centre) and −0.77 · −0.76 · −0.73 filled, compose-filled's own −0.77. Box 18×20 · 14×16 · 12×14 (declared: page plus pen is taller than the square keyline and wider than the portrait one). 24: page 16×20 ink, r2.5; compose's pen raised 1 and 1.5 shorter (tip to band 5.8, compose 7.3); top wall 6.75 long, right wall 7.75; one line 11 long at y 18.25, 3.5 below the tip; walls stop 1.51 short of the pen. 20: page 13×16, r2; pen 1.5 shorter (tip to band 3.5, compose 5); top wall 4, right wall 5; line 7 long, 2.5 below the tip; air to the pen 1.51. 16: page 11×14, r1.5; pen 1.25 shorter (tip to band 2.9, compose 4.1); top wall 3.25, right wall 4.25; line 5.5 long, 2.25 below the tip; air to the pen 1.58. Filled: the page fills and is cut back from the pen exactly as compose-filled is (1.5 of white, its cut raised and moved with the tip); the line is cut 1.5 wide. To keep the line weight (1.5 · 1.5 · 1.25) of solid between the white round the pen tip and the line cut, the line cut sits 0.5 lower than the outline line at 20 and 0.625 lower at 16 (none at 24). Round 3: no change in the drawing. Nothing else that says "post" fits beside a compose-length pen — a second line, a picture or a comment needs 3 to 7 of height under the pen tip and 16 has 5 — so at 16 A is compose-2 in a portrait page with one line, and that is its limit. -->
  <path d="M7.375 1.625H4.125A1.5 1.5 0 0 0 2.625 3.125V12.875A1.5 1.5 0 0 0 4.125 14.375H10.875A1.5 1.5 0 0 0 12.375 12.875V8.625"/>
  <path d="M5.375 11.625H9.625"/>
  <path d="M7.5 8.125A0.625 0.625 0 0 1 6.875 7.5L6.875 6.125L11.082 1.918A1 1 0 0 1 12.496 1.918L13.082 2.504A1 1 0 0 1 13.082 3.918L8.875 8.125Z"/>
  <path d="M9.756 3.244L11.756 5.244"/>
