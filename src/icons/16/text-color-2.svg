<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- keyline: mark -->
  <!-- tags: font color, colour, swatch, format, typography -->
  <!-- Serif T over a solid bar: The serif T over a solid bar in both styles, as Word and Docs paint their colour bar. The outline can carry a solid honestly: the set already does, drawn with the pen (list-bullet's discs, battery's nub, battery-full's charge bar, highlighter's nib); this bar is battery-full's construction, a closed path whose runs sit one line apart so no white is left inside. Bar 18×4.5 · 14×3.5 · 12×3 of ink — a quarter of the box at every master, 3 · 2.3 · 2.4 times text-3's line — so the T gets more room than in A: a new, smaller serif T built as text's is (not text's or text-4's drawing), 12×12 · 10×9 · 10×7.5, serif drops 3 · 2.5 · 2 (text's own), foot 5.5 · 4 · 4 of ink. T to bar 1.5. Filled: line-heavy, T and bar at 2.5 · 2 · 2, ends pulled in 0.5 · 0.25 · 0.375, bends r 1.25 · 1 · 1; the bar keeps its outer edge, its corners rounding 1.25 · 1 · 1 instead of 0.75 · 0.75 · 0.625. Serif-to-stem air 3.75 · 2.75 · 3.125 outline, 2.25 · 2 · 2 filled (the 16 T is 10 wide so the filled serifs keep it). Ink 18×18 · 14×14 · 12×12, box-centred; mass 2.56 · 1.43 · 1.09 below centre in outline, 1.69 · 1.06 · 0.56 filled. The cost: the heaviest outline of the three (22 · 21 · 25% of the canvas inked, text-3 11 · 13 · 15%), and at 16 it is still a T on a bar, the nearest to text-3. -->
  <path d="M3.625 4.625V3.25A0.625 0.625 0 0 1 4.25 2.625H11.75A0.625 0.625 0 0 1 12.375 3.25V4.625"/>
  <path d="M8 2.625V8.875"/>
  <path d="M6.625 8.875H9.375"/>
  <path d="M2.625 12.5H13.375V11.625H2.625V13.375H13.375V12.5Z"/>
