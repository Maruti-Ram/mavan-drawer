  <!-- Round face, edge peeled: Rhythm and balance: face-smile's ring and face with the bottom-right edge peeling up over the end of the smile (Nucleo sticker-smile). The chord is pulled in 12 · 14 · 12° from the keyline points so the curl clears face-smile's right eye by 2.34 · 1.76 · 1.70; curl r5.25 · 3.75 · 3.5, its tip 3.98 · 2.81 · 2.29 from the centre. The smile runs under the curl and ends on its line, sweeping 93 · 92 · 81°. 24 is face-smile's 24 face verbatim. At 20 and 16 the peel forces a smaller smile: where it meets the curl, the smile's end must stay 1.5 from the sticker's edge across the curl (with the verbatim smile it comes to 1.43 · 1.28), so 20 has the smile r3.5 (was 3.75) ending 17° below level, 16 r2.875 (was 3.375) ending 26° below level; eyes unchanged. Air: inside the curl 2.27 · 1.90 · 1.81; smile to edge 1.79 · 1.57 · 1.56; eyes to ring 4 · 2.28 · 1.6. Filled: face-smile's cuts (eyes 2 · 1.75 · 1.75, smile 2 · 1.75 · 1.75) and a white lens; the smile cut stops 1.5 short of the lens, sweeping 72 · 63 · 44°. Decimals: the chord ends (12 to 14° off the keyline points), the smile's ends, the cut edges. Look-alike at 16: face-smile, which only the curl tells apart: the riskiest pair on this board. -->
