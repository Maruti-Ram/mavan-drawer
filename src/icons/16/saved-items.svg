  <!-- Ribbon with a tick (bookmark-3): bookmark-3's crisp ribbon verbatim (ink 14x20 · 12x16 · 10x14, head r 1.5 · 1.25 · 1, notch half its width deep) with check's tick inside it: 45 deg legs, short leg 0.44 · 0.45 · 0.44 of the long one (check 0.45), bend half the weight (C10). Tick ink 8x5.69 · 6x4.29 · 4.5x3.24 (0.57 · 0.5 · 0.45 of the ribbon's width), 1.5 of air to each side wall at every master (the most the white holds), 2.75 · 2.3 · 2.375 to the head. Its long leg runs parallel to the left tail, 1.55 · 1.51 · 1.59 of air from it — the tick sits as low as the tail allows, ink centre at 43 · 37 · 37.5% of the ribbon's height (round one 37 · 34 · 28%). Filled: bookmark-3-filled verbatim with the tick cut as a 1.5 slot, checkbox-filled's cut shape (at 16 the slot's ends pull in 0.125 and its bend is 0.75, its own half width, as checkbox-filled's does); material to the slot 3 · 2.5 · 2.625 at the sides, 3.05 · 2.6 · 2.71 to the notch. Smallest air: 1.5 to the side walls (outline), the 1.5 slot (filled). At 16 in real pixels: the outline is bookmark-3 with a three-pixel diagonal and one pixel of short leg in its upper body — a bookmark with a mark; the filled twin's white tick in the black ribbon reads as a tick. The runner-up: the one picture that is a shipped bookmark body with one mark added, so it sits beside bookmark and bookmarks as family; but a ribbon with a tick says 'this one is saved' more than 'the saved ones'. What it costs: at 16 the tick is three pixels of diagonal — a 7.5-wide white holds no more. Off-grid decimals: the tick's bend tangent points (0.53 · 0.53 · 0.442 from the vertex along each leg) and the ribbon's own notch points. -->
