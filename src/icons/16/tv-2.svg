<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: retro, vintage, knobs, antenna, television, crt -->
  <!-- box: 14x12 -->
  <!-- Retro set with knobs: Rhythm: one air of 1.5 everywhere in the knob panel — wall to knob, knob to knob, knob to divider; the panel is 6 · 5 · 4.5 wide inside (knob ⌀3 · 2 · 1.5, live's and radio's knob sizes). Two knobs at 24 (centres y 12 and 16.5, pitch 4.5, 1.5 above, between and below); one at 20 and 16, centred (2.75 · 2.5 above and below) — two need 8.5 · 7.5 of inside height and the antenna leaves 7.5 · 6.5, so a knob is dropped rather than squeezed. Body = A's screen at every master (20×13.5 · 16×10.5 · 14×9 of ink, r2.5 · 2 · 1.5); divider at x 13.75 · 10.75 · 8.625, screen compartment 9.5×10.5 · 6.5×7.5 · 5.75×6.5 inside. Antenna as A's (45°, rise 4.5 · 3.5 · 3) but standing over the screen compartment (apex x 8.25 · 6.5 · 4.625, its centre 8.25 · 6.75 · 5.125), because centred (x 12 at 24) its right arm ran into the divider's top; arm to divider top 2.39 · 1.5 · 1.58 of air. Ink 20×18 · 16×14 · 14×12, box-centred. Filled: body solid, divider a 1.5 white band at every master (wider than the 1.25 line at 16, C22), knobs white dots ⌀3 · 2 · 1.5; material knob to knob 1.5, knob to band 1.5 · 1.5 · 1.38 (line-weight floor 1.25 at 16). Who: Tabler device-tv-old, Phosphor Television. The clearest 'television set'; busiest at 16, and the single knob there reads more as a slot than a dial. -->
