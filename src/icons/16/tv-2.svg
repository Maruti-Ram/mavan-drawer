  <path d="M1.625 2.625L4.625 5.625L7.625 2.625"/>
  <path d="M8.625 5.625V13.375"/>
  <path d="M11.375 9.5A0.125 0.125 0 1 0 11.625 9.5A0.125 0.125 0 1 0 11.375 9.5Z"/>
