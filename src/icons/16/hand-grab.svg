e re-cut as prongs (thumb 3 · 3.5 · 2.75, knuckles 2.5 · 2.5 · 2, rounds of half their width) with 1.5 notches that stop half a unit (0.375 at 16) below the lower knuckle's rounding, so they read as knuckles and not as fingers -->
