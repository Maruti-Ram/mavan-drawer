  <!-- Cascaded pair: Two cascaded windows: a front window with a title bar at the top left, and the window behind it showing as an L at the bottom right. Fluent window_multiple, Phosphor browsers, Material select_window and Font Awesome window-restore. In those sets this is the plural (windows, window-multiple), not window. This is the popup brief's layered windows too; it is drawn once, here. Built on copy-3, turned half a turn: the same agreed box, 20x18 · 16x14 · 14x12, offset 3, radius 2.5 · 2 · 1.5. Front window 17x15 · 13x11 · 11x9 of ink. The back L runs from y 9.25 · 8.75 · 7.125 down the right and along the bottom to x 8.25 · 7.75 · 6.125. The front has a title bar as B, 2.5 · 2 · 1.75 clear (line at y 7.75 · 7.25 · 5.625), over a body 8 · 4.5 · 3.5 clear. White between the two windows is copy-3's: 1.5 · 1.5 · 1.75 on the straights and 2.74 at the corner at 24. Tightest air at 16: 1.75, the bar and the band between the windows. It collides with copy-3. Without the bar it is copy-3 turned over, and at 16 the bar is one 1.25 line. Against layout-header: different silhouette, and no header in the back window. Against the popup board: B's small box sits inside one page, while here two equal windows are offset. Filled: the front window's title bar solid as in B, from the outer top to the line's lower edge; its body and the back L stay lines at 1.5 · 1.5 · 1.25. Risk: it says more than one window and copy as much as it says window. -->
