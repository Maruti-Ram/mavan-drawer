  <!-- tags: wedge, welded, seam -->
  <!-- Wedge, welded cuff: Lucide's and Polaris's construction: cuff and palm are one closed outline and the cuff is drawn by a seam line from the cuff top to the bottom edge (both ends touch, so lint skips the pair). The wrist, where the cuff top turns up into the thumb's back, is heart's notch — a C10 bend of 0.75 · 0.75 · 0.625, half the weight — whose outer edge is a clean V 0.46 · 0.46 · 0.39 left of the seam line, under the seam's cap (a 1.5 · 1.25 · 1 bend there would raise a rounded bump 1.5 · 1 · 0.75 above the cuff's top edge, which the filled cut would slice in half). Flat bottom edge from the cuff's 1.5 · 1.25 · 1 corner to the palm's 2.5 · 2 · 1.5 corner. Thumb: back at 63.43° (2 up for 1 across) from the cuff line, front vertical, tip radius 1.5 · 1.5 · 1.375 so the thumb is 3 · 3 · 2.75 wide on the line at the tip and 5.43 · 4.68 · 4.22 at the knuckle line; the air inside the tip is 1.5 · 1.5 · 1.5, the floor exactly. Tip apex at x 11.68 · 10.18 · 8.22, front at x 13.18 · 11.68 · 9.6, straight back 5.78 · 4.1 · 3.62 long, straight front 3 · 1.75 · 1.63. Thumb rises 6 · 4.5 · 4 above the knuckle line; palm block 10.5 · 8 · 6.75 tall on the line. Knuckle top run between the web and the corner 3.07 · 1.32 · 1.28. Cuff 4 · 3.25 · 2.75 wide on the line (5.5 · 4.75 · 4 of ink, counter 2.5 · 1.75 · 1.5), corners the detail radius 1.5 · 1.25 · 1; palm corners the container radius 2.5 · 2 · 1.5, web between thumb and finger 1.5 · 1.25 · 1 concave. Cuff top straight run 2.04 · 1.54 · 1.36 between its corner and the wrist bend. Filled: silhouette solid to the outline's outer edge; the seam is a 1.5 cut at every master (mail's, file's), centred on the seam line, out through the bottom edge and up through the wrist notch, mouths eased 0.5; the cuff solid ends at the cuff top (y 9 · 7.5 · 6) and the palm side runs on up until it meets the thumb's back at y 6.57 · 5.07 · 3.73 — so the filled thumb has a vertical run of 2.43 · 2.43 · 2.27 above the cuff top before its diagonal begins, where the outline's back is diagonal all the way to the wrist. That is the through cut's cost at a diagonal wrist (a 1.5 cut cannot end inside the notch: its round end would break the back's outer edge); F, I and J avoid it. Ink box 18×18 · 14×14 · 12×12, filled 18×18 · 14×14 · 12×12; filled mass sits +0.18, +1.89 · +0.27, +1.3 · +0.32, +1.11 from the canvas centre (x right, y down). Box-centred: the silhouette is held to the square keyline like every container; the C15 measure (end triangle) has no reading on a closed shape. (recommended) -->
