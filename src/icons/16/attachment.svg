<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: paperclip, clip, attach, upright, simple -->
  <!-- box: 10x14 -->
  <!-- Upright, three legs: A slim upright clip drawn as one spiral: outer leg, big turn at the bottom, up the left side, a small hook over the top and an inner leg hanging two thirds of the way down. The calmest of the ten and the crispest at 16: every leg edge sits on a whole pixel with two or more clear pixels between legs, and the filled twin is the same drawing, only heavier. Three legs 4.5 and 5 apart at 24 (4 and 4.5 at 20, 4 and 4.75 at 16); in the filled twin they are 4 and 4.5 · 4 and 4 · 4 and 4 apart. As tall as file (20 · 16 · 14) and declared as its own box, since no keyline is this narrow; at 16 it is the portrait keyline exactly. Ink box 11x20 · 10x16 · 10x14, filled box identical. Smallest gap, outline 3 · 2.5 · 2.75 (between neighbouring legs); filled 1.5 · 2 · 2 (between neighbouring legs); floor 1.5. Filled is the line-heavy case: nothing to fill, so the same wire at 2.5 · 2 · 2, outer legs moved in 0.5 · 0.25 · 0.375 and free ends pulled back the same, so the ink box is held. Every number on the grid. It costs the inner loop of a real clip: a three-leg clip needs 10.5 · 9 · 9 of width once the filled twin holds 1.5 between 2.5 · 2 · 2 legs, which is why none of the ten is slimmer (recommended) -->
  <path d="M12.375 3.875L12.375 10A4.375 4.375 0 0 1 3.625 10L3.625 3.625A2 2 0 0 1 7.625 3.625L7.625 9.5"/>
</svg>
