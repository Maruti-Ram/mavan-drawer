  <!-- Classic small, open: The shipped small chevrons with the gap at about half a chevron's height at every master (3 · 2.5 · 2.25 against 5.93 · 5.19 · 4.69: 0.51 · 0.48 · 0.48), so the proportion holds from 24 to 16. At 16 the caps stop at y 6.875 and 9.125, leaving two clean white rows in both styles: two separate chevrons, one up and one down, never a diamond. 11.63 tall at 16 keeps 0.37 under the ceiling. All three references keep an open gap of this kind (recommended). Ink 11×14.859 · 9.5×12.879 · 8.5×11.628 at 24 · 20 · 16 (mark ceiling 18 · 14 · 12), box-centred on both axes by construction: the bottom chevron is placed, the top one is its mirror about the canvas centre, so no optical shift (C14 moves a single chevron toward its point; the pair points both ways and cancels). Each chevron 11×5.929 · 9.5×5.189 · 8.5×4.689 of ink. Air between the facing caps 3 · 2.5 · 2.25, identical in the filled twin (measured edge to edge on the drawings): the filled ends pull in half the added weight on both axes (0.5 · 0.25 · 0.375), so each cap keeps its outer extreme and the gap cannot shrink. The open ends sit on the grid (y 9.75/14.25 · 8/12 · 6.25/9.75); the off-grid decimals are the C10 bend's tangent points, which follow the leg angle, and the apex ink, which falls where the bend puts it. -->
