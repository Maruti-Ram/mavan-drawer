  <!-- Pencil on the page corner: Pencil on the page corner: the shipped file (default shape), unchanged and in place (ink 16×20 · 12×16 · 10×14, x 4–20 · 4–16 · 3–13), with the set's pencil as a C33 badge on its bottom-right corner, the badge's ink corner on the margin edge (22 · 18 · 15). This is Lucide's file-pen-line (first drawn as file-signature): Maruti, 2026-10-25, "looks more like edit rather than signature. so lets save it as file-edit". The pencil is pencil-4's, the 0/45/90 pencil that compose, note-3, pen-sparkle, scribble and blog-2 carry, built by compose's and note-3's recipe: each master's own pencil-4, tip slid up the axis, moved by whole steps. Its end, corners and band are pencil-4's strings verbatim, moved (1, 9.5) · (1, 7) · (1, 6). The square tip slides 8.5 · 6 · 5 up the axis (compose 4.5 · 3.5 · 3, note-3 6 · 4.5 · 4), so the pencil is 10.07 · 8.33 · 7.30 long on the centreline (pencil-4 22.09 · 16.82 · 14.37). Width 4.24 · 3.18 · 2.83, band 3.25 · 3.25 · 2.875 from the end, tip corner 0.75 · 0.75 · 0.625 (C10), inside air 2.74 · 1.68 · 1.58. Badge ink 9.5×9.5 · 8×8 · 7×7 (x and y 12.5–22 · 10–18 · 8–15), the file family's badge height (file-clock B's ring 9.5 · 8 · 7, file-down B's arrow 9.5 · 8 · 7.13). At that size the pencil is about twice as long as it is wide (ink 1.96 · 2.03 · 2.03) at every master; with the 20 master's width at 24 it would be 2.49, a thinner pencil than at 20 and 16. Box 18×20 · 14×16 · 12×14 (declared): the page plus the 2 the pencil stands right of it. Centre 13,12 · 11,10 · 9,8, 1 right of the canvas centre. The base keeps its place, so the files declare <!— base: file —>, as file-plus, file-clock and file-down do. Cut back by hand with 1.5 of air from the pencil's ink; the bottom-right corner arc goes at every master. Right wall: stops at y 10.25 at 24, exactly 1.5 past the fold corner (y 8.75; air 1.52 to the pencil's end corner), as file-down B's. At 20 and 16 nothing could stay (0 · 0.13), so the page ends at the fold corner (air 1.51 · 1.65). Bottom wall: stops at x 10.25 at 24, 3 past its corner (air 1.57 to the tip). At 20 and 16 it would leave 1 · 0.75 past its corner, under 1.5, so it is removed and the bottom-left corner ends at its tangent point (air 2.56 · 2.30 to the tip). The pencil's flat tip leg lies on the bottom wall's own line (y 21.25 · 17.25 · 14.375), so the page's bottom edge reads on into the pencil. Fold and chamfer whole at every master: fold to pencil 3.0 · 1.51 · 1.65. Tightest air, outline 1.52 · 1.51 · 1.65. Filled: pencil-4-filled's pencil cut the same way, cap verbatim moved, body shortened with the tip, the band a 1.5 white gap on the outline's band line. file-filled's sheet is cut along the filled pencil's ink grown 1.5, each junction eased 0.5: straight up from the bottom edge at x 11 · 8.5 · 6.5, round the cone's square corner (radius 1.5 about the filled pencil's own corner, (12.5, 17.94) · (10, 14.69) · (8, 12.116)), then along the pencil's upper side 1.5 out. At 24 it then rounds the pencil's end (radius 3.75) to the right edge, leaving a band of sheet 1.499 thick under the notch (measured 1.4986; the right edge straight to y 10.54; the arc's 2 dp ends keep the air at 1.5 first), as the outline keeps its wall. At 20 and 16 the grown end reaches the notch's bottom edge and the sheet under the notch thins to nothing, under the line weight, so it goes. The sheet's edge then runs straight down from the notch (x 9.5 · 7.5) into the cut, as file-clock B's does. The flap is file-filled's, whole, 1.5 from the sheet and 4.5 · 3.03 · 3.07 from the pencil. Tightest air, filled 1.50 · 1.50 · 1.50. Ink 0.0013 · 0.0028 short of the margin at 24 and 20 (21.9987 · 17.9972), the rounding of pencil-4's own 2 dp tangent points (pencil-4 at 20 reads 16.997 the same way). Off-grid decimals: the pencil's 45° points and arc tangent points are pencil-4's own, moved by whole steps. In the filled twin, the cut's tangent points and 0.5 fillets are rounded away from the pencil, so the air never measures under 1.5. At 24 the arc's centre sits 0.0068 left and slightly up of the end corner's centre (0.0067 left, 0.0013 up); the air keeps 1.5 first. -->
