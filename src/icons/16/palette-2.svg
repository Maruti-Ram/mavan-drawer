  <!-- Fanned swatches: Fanned swatches: Heroicons swatch, Lucide swatch-book, Tabler color-swatch, SF Symbols swatchpalette, Nucleo color-palette — three colour cards fanned from one pivot. Rhythm and balance: three cards of one size (ink 8.5 · 6.5 · 5.25 wide; the front card 18 · 14 · 12 tall) on one pivot — upright, 45°, flat — so the fan opens in equal 45° steps and every edge is on 0/45/90; each card behind is drawn only where it shows, its edges tangent to the front card's half-round foot (radius 3.5 · 2.5 · 2 on the line); top corners 1.5 · 1.25 · 0.75. The front card's hole (alert-circle's dot, ink 2.5) at 24 only, 1.5 from the foot (3.5 − 0.75 − 1.25); at 20 and 16 it would leave 0.75 · 0.375, so it goes. Ink 18×18 · 14×14 · 12×12 on the square keyline, box-centred. Filled: three solid cards, each behind stood off the one in front by 1.5 of white (C22); that white clips the 45° card's far corner and the flat card's top corner, as in Heroicons' solid swatch, and the new dark points round at 0.75 · 0.75 · 0.625. The front card keeps its hole white at 24. Off-grid numbers are the 45° card's corners and where its edges meet. It says "swatches" or "colour styles" more than "artist's palette", and at 16 the front card, 5.25 wide with no hole, is a lump beside the two thin cards behind it. -->
