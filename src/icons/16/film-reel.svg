<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: reel, movie, cinema, projector, film -->
  <!-- Reel: Rhythm: four holes on one ring, on the axes, 4.5 · 3.5 · 3 from the centre (0.45 · 0.44 · 0.43 of the radius), 3 · 3 · 2.5 across (image's sun dot at 24 and 20). Air hole to hole 3.36 · 1.95 · 1.74, hole to rim 2.5 · 1.5 · 1.5. Every hole's edges sit on whole pixels at every master (centres 7.5 / 16.5 · 6.5 / 13.5 · 5 / 11), so at 16 each hole is a clean 2 x 2 block: solid ink in the outline and fully white in the filled reel (measured: the four hole pixels 0% ink). The 16 hole went from 2 to 2.5 across for that, which costs 0.25 of hole-to-rim air. The film leaves along the bottom tangent and stops under the rim's right edge, so the ink box stays the circle keyline 20 · 16 · 14 and the reel is box-centred. Phosphor FilmReel and Solar reel draw exactly this; MDI film-reel, Hugeicons film-roll-02 and Streamline movies-reel are the same reel. Filled: the disc solid, the four holes punched white at the same sizes, the tail a line at the outline weight. (recommended) Round with four holes, it cannot be read as the strip, the clapper or a camera at 16, and no shipped icon draws it. -->
  <path d="M1.625 8A6.375 6.375 0 1 0 14.375 8A6.375 6.375 0 1 0 1.625 8Z"/>
  <path d="M8 14.375H14.375"/>
  <path d="M7.375 5A0.625 0.625 0 1 0 8.625 5A0.625 0.625 0 1 0 7.375 5Z"/>
  <path d="M10.375 8A0.625 0.625 0 1 0 11.625 8A0.625 0.625 0 1 0 10.375 8Z"/>
