  <!-- Hooked loops, diagonal: A turned onto link's diagonal and grown to the diagonal keyline (20x20 · 16x16 · 14x14, link's and link-2's box), keeping A's round loops: loop radius 4.75 · 3.75 · 3.375 on the line (16 is A's own 3.375), loops 14.36 · 11.95 · 10.37 long by 11 · 9 · 8 wide outer, about 1.3 to 1 as A's are (link's are 1.45 to 1), inside 8 · 6 · 5.5; far-cap centres 12.73 · 9.9 · 8.49 apart. The middle is A2's: the two hooks pass side by side, 3.5 · 3.5 · 3 apart on the line (air 2 · 2 · 1.75), each running 0.5 · 0.5 · 0.375 past the axis; nothing crosses (Untitled UI link-04 and Iconoir link construction, laid at 45°). The free ends run until they stop just clear of the other loop's hook, the same rule as A2 (stub 3 · 1.25 · 1 past the half circle, air 1.69 · 1.57 · 1.5), so each loop reads as a closed link with one opening. The twist runs opposite to link's on purpose: drawn with link's twist the hooked pair reads at 16 as link with gaps. Tightest air 1.69 · 1.57 · 1.5. Filled: line-heavy at 2.5 · 2 · 2 on the same outer edge (radius 4.25 · 3.5 · 3 on the line); the hooks turn 90° · 85° · 80°, stubs 1.25 · 0.5 · 0 (at 16 the free end stops 6° short of the top); hook end to the other loop 1.75 · 1.52 · 1.52, tightest air 1.53 · 1.52 · 1.52, inside 6 · 5 · 4; box identical. Off-grid decimals: every point of the 45° drawing (cap ends, run ends, hook ends), as in link. At 16: 48.2 px of ink against link-3's 43.9 in the outline, 66.6 against 64.7 filled: the only take at link-3's weight in both styles, with link's 14x14 presence. (recommended) It keeps A's picture (round hooked loops, an S through the middle, nothing crossing) and gives it link's size; at 16 it reads at once as a chain, and the round loops and the opposite twist keep it off link. -->
