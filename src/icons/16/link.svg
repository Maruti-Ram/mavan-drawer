<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: chain, diagonal, interlocked, hyperlink, url -->
  <!-- Diagonal chain: The classic two-link chain at 45°: two rounded links, each threading the other, drawn over where it is on top and cut where it passes underneath. The one shape a reader names as "link" without thinking; the medium proportion of the three (B rounder, I slimmer). Each link: a half circle at the far end, one long side, and a curl round the near end that passes over the other link and ends inside it; the other side stops short where it would pass under. Links 14.82x10 · 12.05x8.5 · 10.52x7.25 outer, radius 4.25 · 3.5 · 3 on the line (5 · 4.25 · 3.63 outer), near-cap centres 4.5 · 3.5 · 3 apart, far caps 14.14 · 10.61 · 9.55 apart. Where the outer edges cross they meet at 63.93 · 60 · 60° and the X sits 0.53 · 0.38 · 0.32 inside the side line. The curl ends +15.96° · +8.03° · +4.58° from its tip (plus = past the tip, toward the crossing it runs under), +1.17 · +0.49 · +0.24 from the axis (plus = across it); the short side is 3.44 · 1.56 · 1.36 long past the half circle. Air: every passage where a link runs under the other holds 1.51 · 1.51 · 1.51 between edges (floor 1.5), the curl end sits 1.61 · 1.51 · 1.51 clear of the other link's long side; inside a link 7 · 5.5 · 4.75. Nothing crosses, nothing touches. Box 20x20 · 16x16 · 14x14, on the diagonal keyline; filled box equal to 0.01. Filled: line-heavy, the same wire at 2.5 · 2 · 2 on the same outer edge (far caps 3.75 · 3.25 · 2.63 on the line). A heavier line needs more room at the crossings, so the filled twin is its own drawing there: near-cap centres 3 · 2.5 · 1.5 apart, curl -3.98° · -4.59° · -30.77° from its tip, short side 1.78 · 0.63 · 0 (no short side at 16); passages 1.51 · 1.51 · 1.51, inside a link 5 · 4.5 · 3.25. At 16 the cap radius on the line sits beside attachment's inner hook (2) and big turn (4.375), attachment-3's 1.944 and 3.889 on the same diagonal, and lock's shackle (2.375); external-link's box corners are 1.5 (all read from the shipped 16 files). Recommended: it holds the 1.5 passages at every master in both styles, keeps a short side at 16 in the outline, and its links are the same width as attachment-3's clip on the same diagonal, so the two sit together in a toolbar. -->
  <path d="M6.777 8.884A3 3 0 0 0 11.182 9.061L13.496 6.747A3 3 0 0 0 9.254 2.503L8.295 3.462"/>
  <path d="M9.223 7.116A3 3 0 0 0 4.818 6.939L2.503 9.254A3 3 0 0 0 6.747 13.496L7.705 12.538"/>
