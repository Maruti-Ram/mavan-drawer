<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: fold, chamfer, sharp tip -->
  <!-- Polaris tips, chamfer 6 · 5 · 4 (recommended): The flap's two 45 deg tips cut from r0.5 to **r0.25**, which is what makes it read as the corner peeling back rather than a shape parked in the notch. A 45 deg corner's tangent length is r / tan 22.5, so r0.5 pulls each tip back 1.21 along the edge - 0.85 in x - and shortens the flap's straight hypotenuse from 5.56 to 3.86 of the chamfer's 6.0 at 24. At r0.25 it runs 4.70. Polaris cuts the same two tips at about 0.12 (on its 20 canvas, ~0.14 here) and rounds the flap's right-angle corner at 0.375 against its body notch's 1.625 - the same difference-equals-the-gap relationship this build already has (2.25 against 0.75). Chamfer back to the references' 6 · 5 · 4, so the 16 master keeps 4.5 of top edge and the flap's counter measures 2.09 (recommended) -->
  <!-- 16 master at stroke 1.25 (C7, 2026-09-20): centrelines on the eighth grid so every ink edge stays where the 1.5 line had it. Fold and chamfer keep their skeleton (8.25 / 5.75), still an exact 45° cut; corner radii keep 1.5 and 1 -->
  <path d="M5.125 1.625H8.25L12.375 5.75V12.875A1.5 1.5 0 0 1 10.875 14.375H5.125A1.5 1.5 0 0 1 3.625 12.875V3.125A1.5 1.5 0 0 1 5.125 1.625Z"/>
  <path d="M8.25 1.625V4.75A1 1 0 0 0 9.25 5.75H12.375"/>
</svg>
