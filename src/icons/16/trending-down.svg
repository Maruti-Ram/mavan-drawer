  <!-- One pull-back: (recommended) The references' line: Lucide's trending-down, Central's trending-6 and Untitled's trend-down-01 all draw it - a fall, one short pull-back, then a long fall straight into the head, every run on 45 degrees. Runs 5.25/4/7.25 · 4/3/5.5 · 3.375/2.5/4.875. The turn-back point stays lower than the start by 1.25 · 1 · 0.875 and the end passes the first turn, which is what a trend is (lower lows, lower highs); chart-line A's line dips below its start. The last run is the longest because the head needs it: below 5.83 · 5.1 · 4.85 the middle stroke passes the head's back tip closer than 1.5 in the filled twin. The head is arrow-down-right's, unchanged in both styles: legs 6 · 5.25 · 4.75 on 0 and 90, bend 0.75 · 0.75 · 0.625 (C10), filled legs 5 · 4.75 · 4 at 2.5 · 2 · 2 with bend 1.25 · 1 · 1. The line runs into its corner exactly as arrow-down-right's shaft does, stopping 0.22 · 0.22 · 0.183 short on each axis (filled 0.37 · 0.29 · 0.293) - r(1 - 1/root2), which lands the round cap on the head's outer corner; those and the bend tangent points (r/root2 off each corner) are the only off-grid values. The pinch where each leg tip meets the line entering the head is arrow-down-right's own wedge, 2.74 · 2.21 · 2.11, filled 1.04 · 1.36 · 0.83. Ink 18x10 · 14x8 · 12x7, a mark; box-centred at 24 and 20 with the head's two straight edges on whole pixels; at 16 the box sits 0.5 above centre (4 to 11) so the head's bottom edge lands on a pixel, which also moves the ink's mass centre from 0.28 below centre to 0.22 above. Air head to the middle stroke 4.51 · 2.57 · 2.31, filled 3.51 · 2.07 · 1.55. How it differs from chart-line: an arrowhead and no axis; against chart-line E (the bare zigzag) the head would be the only difference, so this pairs best with chart-line A (axis). The head covers 75% · 84% · 86% of the height against Lucide's 67%, because it is the shipped head, not a smaller one. Two pull-backs do not fit on 45 degrees: with each at the filled floor (3 · 2.5 · 2.5) the line climbs only 4.5 · 2.5 · 0.75, so the 16 would stand 2 tall. Filled: line-heavy at 2.5 · 2 · 2, the open end pulled in 0.5 · 0.25 · 0.375 on both axes, ink box identical. Exact top-to-bottom mirror of trending-up's same letter: every number is the same. -->
