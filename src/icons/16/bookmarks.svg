<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: saved, read later, ribbons, collection -->
  <!-- box: 11x14 -->
  <!-- Two ribbons, one behind the other: Two ribbons, one behind the other: the plural in Material (bookmarks), Fluent (BookmarkMultiple), Tabler, Phosphor and Nucleo (bookmarks). Built on bookmark: the front is bookmark's ribbon (fold band, 45° notch half its width deep, 5.25 · 4 · 3.375; tips and notch corner at the mark bend 0.75 · 0.75 · 0.625; head r 1.5 · 1.25 · 1). The back ribbon shows one corner and its two sides, each stopping where the next corner would begin (copy's and files' rule): its top edge starts at its left corner's tangent point, its right side ends at its tip's tangent point. It sits up and right of the front by bookmark's own band pitch, 4 · 3.5 · 3, so the air behind the front (2.5 · 2 · 1.75) equals the air inside its band and the three top edges (back, front, band) run on one even pitch. Front ink 12x16 · 9.5x12.5 · 8x11 (0.75 · 0.76 · 0.73 wide for its height; bookmark 0.70 · 0.75 · 0.71); body clear under the band 5.12 · 3.37 · 3.27. Ink 16x20 (portrait keyline) · 13x16 · 11x14 (agreed box at 20 and 16). Placed for balance first: at 24 centred (outline centroid 0.01 off, filled 0.69 left); at 20 and 16 the box sits 0.25 right of centre, which splits the lean between the twins: outline 0.17 · 0.19 right, filled 0.20 · 0.15 left (centred it was 0.07 · 0.06 left and 0.45 · 0.40 left). What it costs: at 20 and 16 the vertical edges fall between pixels, so the ribbon's sides and the back's right side render soft, about a quarter pixel off the grid; A2 is the same drawing with every vertical on a whole pixel. Filled: the front solid with bookmark-filled's 1.5 cut on the fold line; the back stays a 1.5 · 1.5 · 1.25 line. 88 px of ink at 16 filled (bookmark 112, copy 76). At 16 it reads as two ribbons: not bookmark (the second edge), not copy (the notch), not files (no folded corner). Pairing (C27's reading): built on bookmark it ships as bookmarks; on bookmark-2's or bookmark-3's ribbon it would be bookmarks-2 / bookmarks-3. Off-grid decimals are the notch's tangent points, as in bookmark. (recommended) The plural most sets and apps already draw, built directly on our bookmark, so singular and plural read as one family at every size. -->
  <path d="M4.375 4.625L9.125 4.625A1 1 0 0 1 10.125 5.625L10.125 13.75A0.625 0.625 0 0 1 9.5 14.375A0.625 0.625 0 0 1 9.058 14.192L7.192 12.326A0.625 0.625 0 0 0 6.308 12.326L4.442 14.192A0.625 0.625 0 0 1 4 14.375A0.625 0.625 0 0 1 3.375 13.75L3.375 5.625A1 1 0 0 1 4.375 4.625Z"/>
  <path d="M3.375 7.625H10.125"/>
  <path d="M7.375 1.625H12.125A1 1 0 0 1 13.125 2.625V10.75"/>
