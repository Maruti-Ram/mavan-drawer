<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: pages, read, docs, guide -->
  <!-- Classic, soft hills: The open book most people know: each page runs flat from its outer corner, then rolls over a soft hill down to the spine; the bottom repeats it more gently and ends in a small flat foot, the back of the spine. Landscape keyline, because an open book is wide. Dip at the top 3 · 2.5 · 2 (19 · 21 · 20% of the height - at 16 anything under 2 disappears), hill radius 7.5 · 6.25 · 5 over a run of 6 · 5 · 4, so the page edge meets the spine at 53 degrees at every master; bottom drop 2 · 2 · 1, foot 3 wide on the centreline. Outer corners at the detail radius 1.5 · 1.25 · 1: with the container 2.5 the filled pages read as the two halves of a heart at 20. Ink box 20x16 · 16x12 · 14x10, filled identical. No two separate strokes come near each other; the tightest open space is the page interior, 7.75 · 5.75 · 5.13 wide. Filled: shape icon - the pages fill and the spine becomes a cut 2 wide that runs right through, as mail-filled cuts its flap line (pieces rounded 0.5); the notch the filled pages still show at the cut is 1.73 · 1.31 · 0.94 deep. Inside every rule, reads as a book at 16 in both styles, and the foot gives the filled pages a level base (recommended) -->
  <path d="M8 5.625A5 5 0 0 0 4 3.625L2.625 3.625A1 1 0 0 0 1.625 4.625L1.625 10.375A1 1 0 0 0 2.625 11.375L4.5 11.375A2.5 2.5 0 0 1 6.5 12.375L8 12.375L9.5 12.375A2.5 2.5 0 0 1 11.5 11.375L13.375 11.375A1 1 0 0 0 14.375 10.375L14.375 4.625A1 1 0 0 0 13.375 3.625L12 3.625A5 5 0 0 0 8 5.625Z"/>
  <path d="M8 5.625V12.375"/>
</svg>
