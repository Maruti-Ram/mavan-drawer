  <!-- Open, lying flat: Open scissors lying flat, blades crossing at 90° (Lucide, Feather, Tabler, Phosphor, Heroicons, Material content_cut, SF Symbols — the picture most sets agree on) (recommended). Rhythm and balance: the crossing sits on the canvas centre and both blades run at 45° to the box corners, the same diagonals as `x`. The two rings sit on those diagonals, the same size, stacked on one vertical, and the air between them equals the air inside each ring at 24 (4 and 4). Numbers 24 · 20 · 16: rings r 2.75 · 2 · 1.875 on the line (outer ⌀ 7 · 5.5 · 5), centres (6.5, 6.5)/(6.5, 17.5) · (5.75, 5.75)/(5.75, 14.25) · (4.5, 4.5)/(4.5, 11.5); air inside a ring 4 · 2.5 · 2.5, between rings 4 · 3 · 2, ring to the other blade 3.53 · 2.51 · 1.82. Each blade starts on its ring at the ring's 45° point (the off-grid starts 8.44/15.56 · 7.16/12.84 · 5.826/10.174 are those points) and runs straight through the centre to a tip at the box corner: blade 11.67 · 8.84 · 7.6 long against 5.03 · 4.01 · 3.08 of handle showing between ring and crossing. Arms meet at 90°, so there is no tip-air question. At 16 the rings are 5 px with whole-pixel edges (2–7), the hole 2.5 px; this is the strongest of the five at 16. Filled: rings become solid handles, discs on the outline's outer edge with a small hole ⌀ 2 · 1.5 · 1.5 (at the 1.5 floor at 20 and 16; 2.5 · 2 · 1.75 of material), so the filled twin reads heavier than the outline at 1× (ink at 16 21.2% → 23.7%, at 24 17.2% → 20.5%); blades stay at 1.5 · 1.5 · 1.25. Ink 18×18 · 14×14 · 12×12, square keyline, filled identical. Mass sits 1.47 · 1.05 · 0.93 left of centre (outline), the pull of two rings on one side; the ink box is centred. Why recommended: it is the picture nearly every set uses for cut, it reuses `x`'s 45° diagonals, and it holds the most air at 16. -->
