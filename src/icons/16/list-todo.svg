  <!-- optical: 0 -0.31 -->
  <!-- Ticked row over open box, light box in filled: Two rows on one pitch: the top row is done (a bare tick), the bottom row is open (an empty square box), one text line each. Lucide list-todo and Nucleo list-todo draw this pair (both with the box on top; Maruti's order puts the done row first); Material checklist draws two ticks. Tick: check's classic shape (45° legs, short leg a third of the run) scaled to the column, its bend at C10's radius 0.75 · 0.75 · 0.625. Column, tick and box the same width: 7 · 5.5 · 5, so both lines start at x 13 · 11 · 9. Tick 7×4.98 · 5.5×3.95 · 5×3.58. Box 7 · 5.5 · 5 square, corners at the tightest C10 allows, centreline radius 0.75 · 0.75 · 0.625 (the tick's own bend radius; outer 1.5 · 1.5 · 1.25, inner corner square), so at 16 it reads as a square and not a ring; inside air 4 · 2.5 · 2.5. Lines 8 · 6 · 5 long (13→21 · 11→17 · 9→14); at 16 the line is as long as the column. Rhythm: gutter column to line 3 · 2.5 · 2 and air tick to box 3.02 · 2.55 · 2.05, equal within 0.05 at every master. Pitch 8.75 · 7 · 6.125: line 2 on the box centre (y 15.5 · 13 · 10.5), line 1 at y 6.75 · 6 · 4.375, between the tick's box centre and its mass centre (the tick's weight sits low, in its V). Tick to its line 3.42 · 2.77 · 2.28 (floor 1.5). Ink 18×15 · 14×12 · 12×10.625; margins left/right 3 · 3 · 2, top 4 · 3.75 · 2.375, bottom 5 · 4.25 · 3. Optical: the box row outweighs the tick row, so box-centred the mass sat 0.81 · 0.61 · 0.56 below centre; the drawing moves up 0.5 · 0.25 · 0.31 (about half, as C15 does), declared optical. Mass now 0.31 · 0.36 · 0.25 below centre in the outline and 0.32 above · 0.08 below · 0.15 above in the filled twin. Across it is box-centred on the full mark width; the mass sits 1.89 · 1.37 · 1.24 left (list-bullet-3 1.58, layout-list 1.14) and cannot move right without shortening the lines. At 16 the box sits on whole pixels 8→13 and 2→7. Tightest air at 16: 2, column to line, in both styles. Against relatives at 16: list-bullet-3 has two rings; this has one square and a tick. layout-list has two 4.75 tiles with two lines each; this has one 5 box under a tick. checkbox has the tick inside a 12 box; here the tick stands bare. The wave-2 checkbox rows (form D: two empty 4-px boxes, corner 1) read as list-bullet-3; this keeps one box and puts the tick over it. A ticked box on top does not fit: at 16 it needs a box of at least 8.5 (a 3-wide tick, 1.5 of air each side, two 1.25 walls), and two rows would need 18.5 of the 12. Risk: at 16 the tick is 5×3.6 px with a 1.2 px short leg, and the box is layout-list's tile size. Filled (option a): tick and lines go to FILLED_WEIGHT 2.5 · 2 · 2 with their ink box held (tick bend 1.25 · 1 · 1, as check-filled; short leg 1.5 · 1.14 · 1.01 across). The box stays a ring at the outline weight 1.5 · 1.5 · 1.25, inside 4 · 2.5 · 2.5, so the open row stays visibly empty and no solid box says done. Drawn as outlined shapes: lint reads the file as a shape file, so it does not check the 2.5 · 2 · 2 (they are built at it). Keeping a container at the outline weight in a filled drawing is new (C32 and C33 do it for a numeral and a line badge only), so it needs Maruti's ruling. Off-grid numbers are the tick's, computed from check's shape at this width, and in the filled file its outlined edges (recommended: the tick reads at 16, the box stays square and open in both styles, and every air is 2 or more at 16) -->
