<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: scan line, viewfinder, brackets, beam -->
  <!-- Scan line in frame: Rhythm: maximize's four soft corners verbatim (spread 18×18 · 14×14 · 12×12, radius 2.5 · 2 · 1.5, arms 6 · 4.75 · 4 of ink, 6 · 4.5 · 4 of air between tips along a side) with one level line through the centre, 12 · 9.5 · 8 of ink (67 · 68 · 67% of the spread, so the line is the same share of the frame at every master), on y 12 · 10 · 8. Air from each line end to the nearest corner tip 3.3 · 2.25 · 2.05; the line passes through the open middle of each side, so it never runs beside an arm. Ink 18×18 · 14×14 · 12×12, box-centred. Filled: line-heavy, weight 2.5 · 2 · 2, the corners are maximize-filled verbatim and the line pulls in 0.5 · 0.25 · 0.375 so the ink box is identical; air to the tips 2.7 · 1.95 · 1.61. How it differs from maximize: the line is the only change, and it is what turns 'make this bigger' into 'read what is in here'. Who: Lucide scan-line, Tabler scan, Nucleo scan (Nucleo runs the line past the corners). (recommended) — it is the scan picture most sets share, it keeps maximize's frame so scan-face, barcode and qr-code can swap the line for their own content, and the line survives at 16 with 2 of air to the corners. -->
  <path d="M5.375 2.625L4.125 2.625A1.5 1.5 0 0 0 2.625 4.125L2.625 5.375"/>
  <path d="M10.625 2.625L11.875 2.625A1.5 1.5 0 0 1 13.375 4.125L13.375 5.375"/>
  <path d="M5.375 13.375L4.125 13.375A1.5 1.5 0 0 1 2.625 11.875L2.625 10.625"/>
  <path d="M10.625 13.375L11.875 13.375A1.5 1.5 0 0 0 13.375 11.875L13.375 10.625"/>
  <path d="M4.625 8L11.375 8"/>
