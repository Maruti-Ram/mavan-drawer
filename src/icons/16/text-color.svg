<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- keyline: mark -->
  <!-- tags: font color, colour, swatch, format, typography -->
  <!-- The set's A over a swatch: The A every editor uses for font colour (Word, Docs, Polaris, Nucleo), standing on a swatch: a rounded bar with white inside, which the filled twin makes solid, so filled shows the colour. It cannot be taken for text-3: a different letter, and a bar with a hollow body, not a line. A: at 16 it is spell-check-2's A verbatim, moved 3 right (legs 20.28° off vertical); at 24 and 20 it is the set's A construction drawn at its own size — apex arc r 0.75, bar on the leg centrelines a third of the way up (y 10 · 8.25) — with legs at 21.17° · 20.91° against spell-check-2's 20.66° · 20.41°; ink 9.5×10.5 · 7.5×8 · 6×6.5. Swatch: form-2's field, size and corners exactly — 18×6 · 14×4.5 · 12×4 of ink (text's own width, a third of the box's height at every master: 33 · 32 · 33%), corners r 1.5 · 1.25 · 1 on the line (outer 2.25 · 2 · 1.625, inner 0.75 · 0.5 · 0.375; the filled solid 2.25 · 2 · 1.625); white inside 15×3 · 11×1.5 · 9.5×1.5, the 1.5 floor at 20 and 16. At 16 the outline is form-2's field with an A over it. Letter to swatch 1.5 at every master. Filled: a shape icon — the swatch solid on the outline's outer edge, the A stays at 1.5 · 1.5 · 1.25 (as text-sparkle, form). Ink 18×18 · 14×14 · 12×12 in both styles, box-centred. The mass sits low, the swatch being the heaviest part; the ink box is centred, as text and text-3 are (C14). Off-grid values: the apex tangent points and the bar's ends fall out of the leg angle. (recommended: it is the font-colour picture people already know, and the letter alone keeps it apart from text-3 at 16) -->
  <path d="M5.625 7.875L7.414 3.033A0.625 0.625 0 0 1 8.586 3.033L10.375 7.875M6.225 6.25H9.775"/>
  <path d="M3.625 10.625H12.375A1 1 0 0 1 13.375 11.625V12.375A1 1 0 0 1 12.375 13.375H3.625A1 1 0 0 1 2.625 12.375V11.625A1 1 0 0 1 3.625 10.625Z"/>
