  <!-- tags: erase right, forward delete, del, key, plate, x -->
  <!-- Mirror of backspace: Rhythm and balance: backspace turned round, byte for byte, so the pair reads as one family and the x keeps the even air backspace was approved with — its air to the flat wall and to the point's slope (measured square to it) match within 0.11 at every master: 3.25 / 3.36 at 24, 2.25 / 2.23 at 20, 2.25 / 2.14 at 16; 2.25 · 1.75 · 1.5 above and below. The x stands 0.81 · 0.87 · 0.73 right of the centre of the plate's square part, toward the point, as backspace's stands toward its own. Plate: exactly the shipped `label` (backspace is label mirrored), ink 20×14 · 16×12 · 14×10 (24 declares box 20x14 as backspace and label do; 20 and 16 sit on the landscape keyline), point 90° with 45° slopes, tip and shoulders r 1.5 · 1.25 · 1, square corners r 2.5 · 2 · 1.5. Legend (the x): ink 6.5×6.5 · 5.5×5.5 · 4.5×4.5, centreline 5 · 4 · 3.25 across, 0.59 · 0.61 · 0.60 of the plate's inside height. Grid: every coordinate is 24 · 20 · 16 minus backspace's, so it stays on the quarter grid at 24 and 20 and on x.375 / x.625 at 16; the 14.99 / 16.06 / 20.81 at 24 are the label's own shoulder and tip tangent points (r 1.5 on 45°). Filled: backspace-filled mirrored = label-filled with the x cut out at 2 · 1.75 · 1.75, white x 7 · 5.75 · 5 across, 3 · 2.25 · 1.5 of plate between neighbouring white tips, 2.5 of plate above and below at 16. Who: the one picture of forward delete — Unicode ⌦ ERASE TO THE RIGHT, SF Symbols delete.forward (= delete.right), Nucleo delete-right, Framework7 delete-right, Material Design Icons and Bootstrap backspace-reverse. Look-alikes at 16: label (the same plate, no x), backspace (its mirror — read as a pair), tag (has a hole). (recommended: backspace is approved and this is its exact mirror, so the two ship as a matched pair with nothing new to judge) -->
