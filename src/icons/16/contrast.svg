  <!-- Hatched outline, solid filled: B's outline with A's filled twin — Phosphor's pairing (CircleHalf regular is the striped half, its fill the solid half). The outline never draws the letter-D half-disc that A's outline reads as at 16; the filled twin is A's solid right half fused to the ring, the clearest contrast picture of the set at 16. The dark side stays on the right in both styles: hatch on the right in outline, solid on the right in filled. All numbers are B's (outline: lines on the centre line and ± 4.5 · 3.5 · 3.125, air between lines 3.0 · 2.0 · 1.875) and A's (filled: white half 8.5 · 6.5 · 5.75 wide inside a 1.5 · 1.5 · 1.25 wall). Same ring, so the ink box is identical. Risk: the two styles are two different pictures of the same idea — switching style changes hatch to solid (recommended by the main session) -->
