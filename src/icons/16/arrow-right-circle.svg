  <!-- arrow-right-circle · wide: arrow-up-circle's drawing as shipped (2026-10-25, its board's B, the wide head, box-centred) turned a quarter about the canvas centre, (x, y) → (c − y, x) about (12, 12) · (10, 10) · (8, 8), so the point is on the right; a rotation, so every arc keeps its flags, and nothing is redrawn — the arrow and its cut are the shipped points turned, the ring and the disc are `circle`'s (V4 spec §1) verbatim, not turned. Head: arrow-up-2's wide head (arrow-right-2's, turned), the one C16 names for -circle buttons. Its ratio (14/15 · 12/13.5 · 11/12) would give 9.8 · 7.11 · 5.96; drawn 10 at 24 (the nearest quarter-grid head), grown to 8 · 7.25 at 20 and 16 (+0.89 · +1.29), forced by the knockout. Mark ink 10.5×10 · 8×8 · 6.5×7.25 (w×h): x 6.75–17.25 · 6–14 · 4.75–11.25, y 7–17 · 6–14 · 4.375–11.625, centre (12, 12) · (10, 10) · (8, 8). Head 5.44 · 4.44 · 3.99 long, shaft showing 5.06 · 3.56 · 2.51 left of the barbs. Head air (C37), outline: 2.75 · 1.75 · 1.75. Knockout solid barb-to-shaft (each barb cap's centre to the shaft cut's edge, less the cap's radius): 2.25 · 1.49 · 1.25 (1.5 on the true half-width 0.875, written 0.88 at 20). Proportion, as arrow-up-circle: head to length 0.95 · 1 · 1.12 (arrow-up-2 is 0.93); at 24 it fills the plus's square (10.5×10 against 10.5×10.5) the way it does at 20 (8×8). Ink 32.0 · 24.0 · 17.4 against plus-circle's 28.3 · 20.8 · 14.0 (+13% · +16% · +24%), measured as geometric area; knocked-out white at 16 24.7 against the plus's 18.6. C15, measured by hand (the sheet reads no measure on a two-path arrow): the triangle through both leg ends and the tail sits 1.13 · 0.88 · 0.95 left of the box centre, so × 0.5 recommends right 0.56 · 0.44 · 0.48; not applied (C14 keeps arrows box-centred; arrow-up-circle shipped without one). Ring: `circle` verbatim (outer ⌀20 · 16 · 14). Arrow: arrow-right's build turned from arrow-up's (shaft ending on the bend's apex, legs 45°, one C10 tip of 0.75 · 0.75 · 0.625), 10.5 · 8 · 6.5 long in ink (plus-circle's span, so the two swap), box-centred, mirrored top and bottom on y 12 · 10 · 8. Filled: the disc with the arrow cut out at the medium weight 2 · 1.75 · 1.75 on the outline's centrelines (flat run kept), ends reaching half the added weight further (0.25 · 0.125 · 0.25: white x 6.5–17.5 · 5.87–14.13 · 4.5–11.5); ink box = the disc. What sets the head: the knockout. The solid left between a barb's cap and the shaft's cut is the leg end's offset from the shaft's centreline, now across, less the cut weight, and it floors at the line weight 1.5 · 1.5 · 1.25 (§5c), so the offset must be 3.5 · 3.25 · 3 — head 8.5 · 8 · 7.25 tall at the least. The outline alone (C37, 1 of air) would only need 6.5 · 6.5 · 5.75. Air to the ring, outline: 3.25 at 24 (tip and tail), 2.49 at 20 and 2.12 at 16 (barb caps). Filled, solid round the cut to the disc edge: 4.5 · 3.86 · 3.12. Off-grid decimals are construction, turned: the tangent points of the 45° tip (16.28/11.47, 12.53 · 13.03/9.47, 10.53 · 10.442/7.558, 8.442), each leg end's x set by 45° from them (12.56 · 10.31 · 7.884), the cut's outer tip radius 1.75 · 1.63 · 1.5 (bend + half the cut) with its tangent points, the cut's 45° cap points, and the 20 cut's half-width 0.875 written 0.88 on both sides (y 9.12 / 10.88, as plus-circle-filled), which keeps it mirrored. At 16 the lead's eighths swap axes with the turn (shaft on y 8, its ends on x 5.375 / 10.625, the leg ends on y 5 / 11), so every value but those construction points stays on the eighth grid, at 3 dp. -->
