  <!-- box: 14x10 -->
  <!-- Raised button: The raised button: a pill-shaped top face with its depth showing underneath, Nucleo's button-cursor (UI Essential, outline and fill) without its pointer, which would make it A plus a detail. Face: a pill 18.5x8 · 14.5x6.5 · 12.75x6 on the centreline, its ends round (radius 4 · 3.25 · 3); the depth is the face's lower half drawn again 3.5 · 3 · 2.75 lower, with short side walls joining the two, so the outline is the face plus one line. Ink 20x13 · 16x11 · 14x10, centred (margins 2 · 2 · 1 left and right, 5.5 · 4.5 · 3 top and bottom). Face white 6.5 · 5 · 4.75 tall; the band of air between the face and the depth line 2 · 1.5 · 1.5 at the centre, narrowing into the side walls where the depth line leaves the face, as database's rings run into its walls; face white to band air 3.25 · 3.33 · 3.17, the same proportion at every master. At 16 the band must keep 1.5, so the drawing is taller there for its size (10 of 16 against 13 of 24). Tightest air at 16: 1.5, the band at its centre. How it differs: toggle-on is also a pill (20x12 · 16x10 · 14x8) but with a knob; this face is 20x9.5 · 16x8 · 14x7.25 of ink with nothing inside and a second rim under it. Risk: without a pointer, a pill on a pill can read as a keyboard key, a capsule or a soap bar more than as a UI button. Filled: the face goes solid on the outline's outer edge, the depth line stays a line at 1.5 · 1.5 · 1.25 (an open path), band air unchanged. Filled ink box identical -->
