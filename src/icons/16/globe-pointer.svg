the meridian's lower-right quarter and the equator's right half go whole; no closed cell is left beside the cut. Tightest air, outline 1.50 · 1.51 · 1.50 (meridian and equator ends; measured 1.501 · 1.508 · 1.500); filled 2.0 · 1.63 · 1.94 (the upper lens to the tip). Filled: globe-filled with its band and upper lens verbatim. The lower-right cell goes with the ring's quarter, so the disc's edge stops at the band at 3 o'clock and at the pole at 6, as credit-card-percent's top piece stops on its stripe. The lower lens goes at every master: at 20 and 16 the cut leaves it 1.21–1.67 · 0.82–1.44 wide, under the line weight 1.5 · 1.25, and 24 (2.1–2.6) drops it too so the three masters are one picture. Nothing else of the globe is cut, so there are no fillets: the upper lens is untouched (A's bit it 0.5 · 0.37 · 0.12 deep). Filled ink box identical. Off-grid decimals: the pointer's own (arc-derived tangent points of its rounded corners), the meridian's end on its ellipse and the equator's end, each where the air to the pointer is 1.5 (rounded away from it), and globe-filled's own. Risk: on a globe in Maps & Location the dart is also the navigation arrow (same 45-degree lean), so the pair can read as "navigate" rather than "open a link". -->
