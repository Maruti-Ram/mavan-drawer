  <!-- Horizontal, empty: Rhythm: one clean container, nothing inside. Body 18.5×12 · 14.5×9 · 12.75×8, container radius 2.5 · 2 · 1.5 on the line (keyboard's and credit-card's; filled outer 3.25 · 2.75 · 2.125). Nub solid and joined to the wall, one line past it (1.5 · 1.5 · 1.25) and half the body's height (6 · 4.5 · 4), centred on the body; it is drawn as a closed bar on the wall's centreline so no white is left inside it. Off-grid values 20.49 · 16.45 · 13.746 in the filled files are where the corner arc meets the nub's edge (computed). Ink 20×12 · 16×9 · 14×8, box-centred, so the body sits 0.75 · 0.75 · 0.625 left of the canvas centre. Inside white 15.5×9 · 11.5×6 · 10.25×5.5. The nub is joined, not floating 1.5 off the wall as Lucide's is: with a floating nub the body shrinks to 17 · 13 · 11.25 wide, and three charge cells would keep only 2.375 · 1.375 · 1.25 of air, under 1.5 at 20 and 16, so the level family could not be drawn at all; joined, they keep 2.75 · 1.75 · 1.625 (B). A shipped bolt (16×20 · 12×16 · 10×14) cannot sit inside with 1.5 of air, since the room is 6 · 3 · 2.5 tall, so battery-charging will need the bolt crossing the wall (Lucide) or a C33 badge. Filled: one solid shape, the nub included. Lint clean at every master in both styles. Who: Lucide battery, Tabler battery, Phosphor BatteryEmpty, Central battery-empty, Untitled battery-empty, SF battery.0percent. (recommended) — it is the battery every set ships as the plain word, and its body is the one battery-charging and every level member can share unchanged. -->
