  <!-- Crosshair: Lucide's crosshair on our ring: the container circle, four ticks that start on its centreline and point inward, and the bold dot (⌀ 3 · 2.7 · 2.4). Each tick runs 3.75 · 3 · 2.5 of centreline from the rim (r 9.25 · 7.25 · 6.375) to r 5.5 · 4.25 · 3.875, so its outer cap lands exactly on the ring's outer edge (nothing crosses the margin at 24, where the ring already touches it) and 3.75 · 3 · 2.5 of it shows inside the ring's inner edge; air from the tick's cap to the dot 3.25 · 2.15 · 2.05. Tick and ring touch, so lint skips that pair. Filled, reading K: solid disc with the rim left whole and each tick cut as a round-ended slot 1.5 wide at true size, from the rim's inner edge (r 8.5 · 6.5 · 5.75) in to the tick's cap (r 4.75 · 3.5 · 3.125) — 3.75 · 3 · 2.625 long, exactly the part of the tick the outline shows inside the ring — and the dot a hole ⌀ 3 · 2.7 · 2.4; material rim 1.5 · 1.5 · 1.25, slot to hole 3.25 · 2.15 · 1.925. A notch through the rim was tried and dropped: it takes the disc's own extreme off each axis and the filled box comes up 0.09–0.10 short. The bold dot's radius (0.75 · 0.6 · 0.575) and its hole's (1.5 · 1.35 · 1.2) are off the quarter and eighth grids at 20 and 16, as more-horizontal ships them (C17's dot formula, +0.125 at 16). Ink box 20×20 · 16×16 · 14×14, filled identical. Box-centred, no optical shift -->
