  <!-- tags: camera, camcorder, record, movie, clip -->
  <!-- Video camera: The camcorder: a rounded body with a lens wedge on its right side. Lucide video, Material videocam, SF video, Fluent Video, Heroicons video-camera, Tabler, Phosphor, Feather, Font Awesome and Nucleo all draw it, and it is the camera button in Zoom, Meet, Teams and FaceTime. Body outer 14.5x14 · 11.75x12 · 10x10, corner radius 2.5 · 2 · 1.5 on the line (camera's). Lens: its legs leave the body 3 · 3 · 2.75 apart on centre, so 1.5 of air inside the root at every master, and open at 32.5° · 32.9° · 32.0° to a back edge 10 · 8.5 · 7.75 long on centre, corners r 1; the lens stands 70% · 69% · 74% of the body's height. Ink 20x14 at 24 (agreed box: the landscape keyline's 20x16 would make the body taller than wide) · 16x12 · 14x10 (landscape keyline). Box-centred; a shift for the lighter right side belongs on the optical sheet. Filled: body and lens one solid on the outline's outer edge, meeting in the same sharp inside corner the outline's strokes make. At 16 it is not a camera-n: no lens ring, no hump; the wedge is the cue. Off-grid decimals are the lens corners' tangent points and where the lens's outer edge meets the body's. (recommended) The most used picture of video across sets and products, and the one a video-off slash (its C34 twin) reads on as camera-off. -->
