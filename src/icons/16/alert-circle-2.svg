<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: taper -->
  <!-- glyph: dot -->
  <!-- Wedge: What D was reaching for, without the T. The bar is a closed triangle stroked at 1.5, so it starts at 2.5 · 2 · 2 of ink at the shoulder — exactly the dot's diameter — and narrows to a 1.5 tip, exactly one stroke. Heavy top, light foot, graded the whole way down instead of stepped: the move a real exclamation makes, and the only one in this whole search that gives character without changing what the glyph is or what size it reads at. Ink box, C19 gap and dot are A's, untouched. Apexes 13.44 · 10.71 · 7.94 are two-decimal because the tip's round join drifts 0.06 from the nominal 13.5 · 10.75 · 8 — the numbers correct that, nothing else. Sides run 4.4 · 3.2 · 4.9 deg off vertical, which lint does not check and CLAUDE.md does not allow: that is the one thing to rule on (recommended, if you will take the angle) -->
  <!-- 16 master at stroke 1.25 (C7, 2026-09-20): centrelines on the eighth grid so every ink edge stays where the 1.5 line had it. Wedge: shoulder still 2 of ink, tip now 1.25; apex 8.065 keeps the ink bottom where it was; sides 6.7° off vertical (was 4.9) -->
  <path d="M1.625 8A6.375 6.375 0 1 0 14.375 8A6.375 6.375 0 1 0 1.625 8Z"/>
  <path d="M7.625 4.875H8.375L8 8.065Z"/>
  <path d="M7.625 10.75A0.375 0.375 0 1 0 8.375 10.75A0.375 0.375 0 1 0 7.625 10.75Z"/>
