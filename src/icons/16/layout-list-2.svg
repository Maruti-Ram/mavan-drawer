<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: list view, bullets, framed list, card, panel, items -->
  <!-- Bullets in a frame, even air: C polished for balance. Checkbox's square (18 · 14 · 12, radius 2.5 · 2 · 1.5, outer 3.25 · 2.75 · 2.125) with list-bullet's dot (⌀ 2 · 2 · 1.75, radius 0.25 on the centreline) and one line per row. Two rows at every master, as layout-list has, so the rhythm is the same at 24 · 20 · 16: three rows fit only at 24 (at 20 they would leave 1.25 between dots and walls, at 16 0.625, both under the 1.5 floor). Rows on y 9.25 / 14.75 · 7.75 / 12.25 · 6.125 / 9.875, symmetric about the canvas centre; pitch 5.5 · 4.5 · 3.75, about 0.31 of the frame at each master; at 24 these are rows' and table's own row lines. Air above / between / below, measured at the dots: 3.75 / 3.5 / 3.75 · 2.25 / 2.5 / 2.25 · 2 / 2 / 2; at the lines: 4 / 4 / 4 · 2.5 / 3 / 2.5 · 2.25 / 2.5 / 2.25. C had 2 / 2.5 / 2 · 2 / 3 / 2 · 1.5 / 3 / 1.5 at the dots, so its rows hugged the walls. Side air 2 · 1.5 · 1.5 to the dot and to the line's cap: a round end beside a wall reads further off than a long flat edge at the same distance, so 1.5 at the sides looks level with 2 to 2.5 above and below. Row: dot ⌀ 2 · 2 · 1.75, dot to line 2 · 1.5 · 1.5, line ink 7 · 4.5 · 3.25 long (x 10.5→17.5 · 9.5→14 · 8→11.25), so a line is 3.5 · 2.25 · 1.86 dots long. At 20 the line grows from C's 3.25 to 4.5 by taking the air C left at the sides (2 → 1.5) and in the gap (1.75 → 1.5). At 16 every space in the row is already on the floor (1.5 + 1.75 + 1.5 + 3.25 + 1.5 fills the 9.5 room), so the line cannot grow there; the row reads as bullet and line by grouping instead: the dots stand 2 apart up and down against 1.5 across to their own line, so each dot pairs with its line and not with the other dot (C's ": =" came from short lines, and C3 puts the dots 1.5 apart). Centring: the ink box is centred on all four sides; the content's mass sits right of centre at x 12.45 · 10.16 · 8.06 (sampled), y on centre, because the line outweighs the dot (three times its area at 24). A 0.25 shift left at 24 (C15's half of the offset) was drawn and left the side air visibly unequal against the frame (1.75 against 2.25), so the box stays centred. Tightest air at 16: 1.5 (dot to wall, dot to line, cap to wall). Pixels: at 20 the dot fills two whole columns (x 6 to 8); at 16 the lines sit on y.125 / y.875 and cover two pixel rows (50 % and 75 %), even air chosen over a hard edge (C3 is the crisp version). Against relatives at 16: rows-3 is the same frame with two guides and no dots; list-bullet has no frame and three rows; layout-list has tiles and no frame. Risk: at 16 the line is still under two dots long, so the icon can read as a form or a card with two fields as readily as a list. Filled: the square solid on the outline's outer edge with the dots and lines cut out in white on the outline's rows and ink ends; white lines 1.5 tall at every master (C22, not the 1.25 line at 16); white dots ⌀ 2 at every master. At 16 that dot is 0.25 wider than the outline's, so it sits on x 5.5, 0.125 left of the outline's 5.625, to keep 1.5 of solid before the line and fill one whole pixel column (x 5). Solid between cuts at 16: 1.5 dot to line, 1.75 dot to dot, 2.25 line to line; solid band to the outer edge 2.5 left, 2.75 right, 3.125 top and bottom (recommended: the air is even above, between and below at every master, the rhythm matches layout-list, and each dot groups with its line) -->
  <path d="M4.125 2.625H11.875A1.5 1.5 0 0 1 13.375 4.125V11.875A1.5 1.5 0 0 1 11.875 13.375H4.125A1.5 1.5 0 0 1 2.625 11.875V4.125A1.5 1.5 0 0 1 4.125 2.625Z"/>
