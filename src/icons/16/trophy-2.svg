  <!-- Champion cup: Champion cup: the trophy of Heroicons, Iconoir and Hugeicons (champion) — a bell bowl, wide at the rim and narrow at the waist, with the handles hanging from the rim's own ends, on trophy's stem and plinth, in trophy's box 18×20 · 14×16 · 12×14 centred. Rim 11.5 · 8 · 6.5 of ink wide, top edge on 2 · 2 · 1; each wall is one arc (r 19.18 · 18.25 · 24.36), vertical at the rim and leaning in to 33 · 23 · 14° where it meets a bottom arc r 2.25 · 2 · 2 whose lowest point is trophy's bowl bottom (14.25 · 11 · 8.875), so the stem (3 · 3 · 2.75) and plinth are trophy's verbatim and the bowl-to-plinth notch stays 1.5. White across the bowl 3 · 2.5 · 2.75 at the bottom: at 16 a bottom of r 1.5 (white 1.75, lint-clean) smudged walls, bottom and stem into one grey mass in real pixels, so the 16 and 20 bottoms are blunter than 24's (0.45 · 0.62 · 0.76 of the rim's half-width) — the rule working. Handles: the rim runs 0.75 · 0.75 · 1.25 past the corner, a semicircle r 2.5 · 2 · 1.625 drops to 7.75 · 6.75 · 4.875 and a horizontal leg returns to the wall. The references' sweep rejoins the bowl tangentially, which closes a wedge at 16; here the leg meets the wall at 75 · 77 · 82°, a T not a wedge — the loop's air reaches 1.5 within 3.11 · 3.07 · 2.77 along the wall, 0.11 · 0.07 · 0.02 more than a square T would. Air inside the loop 1.75 · 1.5 · 1.5 at the rim (1.91 · 1.61 · 1.55 at the ear's centre height), inside the ear's own arc 3.5 · 2.5 · 2; ear ink 6.5 · 5.5 · 4.5 tall on a cup 13 · 9.75 · 8.5. Tightest air 1.5 (the notch; the loop at 20 and 16). Off-grid decimals: the walls' radii and tangent points, the leg's end on the wall's arc. Filled: cup, stem and plinth one solid on the outline's outer edge, ears stay lines at 1.5 · 1.5 · 1.25, as trophy-filled. At 16 in real pixels: a trophy with its ears at the top; the outline has a goblet flavour that the ears and plinth hold in check, the filled is unmistakable. Beside trophy it is a second picture, not a redraw. (recommended) -->
