  <!-- tags: ragged -->
  <!-- Short first line — paragraph, ragged: 3 · 2 · 2, top line short at every master: 2.5 of 8.5 at 24 (40% of the ink, Lucide rags to 25% and Nucleo to 31%), 62% at 20 and 62% at 16 — the ratio climbs because MIN_GAP takes proportionally more of the small canvas, the same way trash's handle does. At 16 the top bar is 6.75→7.75, ink 2.5 against the full 4.0, and that rag pays for itself: a 2.5 bar clears the fold at y 8.46, so 8.5 is legal and only the bottom line's 2.75 to the floor is short — one warning, not two. Against B at 16 it is a 2.5px bar over a 4px one, which is the separation. Filled, the short bar keeps 1.0 of straight run inside its stadium -->
  <!-- 16 master at stroke 1.25 (C7, 2026-09-20): centrelines on the eighth grid so every ink edge stays where the 1.5 line had it. Fold and chamfer keep their skeleton (8.25 / 5.75); lines keep their ink ends, so they stand 1.75 off the wall (was 1.5) -->
  <path d="M5.125 1.625H8.25L12.375 5.75V12.875A1.5 1.5 0 0 1 10.875 14.375H5.125A1.5 1.5 0 0 1 3.625 12.875V3.125A1.5 1.5 0 0 1 5.125 1.625Z"/>
