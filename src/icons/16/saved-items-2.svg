  <!-- Ribbon with a tick (bookmark-2): The same tick in bookmark-2's round-headed ribbon verbatim (head a half circle r 6.25 · 5.25 · 4.375 on the line, same notch and box as bookmark-3). The head curves in above the tick's long leg, so A's tick would come 1.46 from the head's inner arc at 24 (and 1.07 at 20, 1.34 at 16); the tick is one step smaller, 7.25 · 5 · 4 wide (ink 7.25x5.19 · 5x3.59 · 4x2.87, short leg 0.44 · 0.46 · 0.47 of the long), as low as the tail allows (air 1.64 · 1.51 · 1.59 to the tail), 1.86 · 1.76 · 1.66 from the long leg's cap to the head's inner arc, 1.88 · 2 · 1.75 from the short leg's cap to the left wall. Ink centre 43 · 38 · 38% of the ribbon's height. Smallest air: 1.66 (16) from the long leg's cap to the head, outline; the 1.5 slot, filled. Filled: bookmark-2-filled verbatim with the tick cut as a 1.5 slot as in A. At 16 in real pixels: the tick is a two-to-three-pixel speck under the dome, and the filled twin reads as a white notch in a tombstone — a ghost before a bookmark. What it costs: at 16 the tick is 4 pixels wide, a notch under the dome, and bookmark-2's filled twin was already the tombstone of the three. Off-grid decimals: the tick's bend tangent points and the ribbon's notch points; at 24 the vertex rounds to 10.88 (0.005 right of centre). -->
