<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- keyline: mark -->
  <!-- tags: open, chevron pair, classic -->
  <!-- Two chevrons, open: The same 45 degree bracket, one step smaller, with the opening as wide as a bracket - the proportion the references use, drawn on our grid rather than copied. Brackets 5.44x10 / 4.69x8.5 / 4.12x7.5, air between them 7 / 4.5 / 3.75, so the opening is 1.29 / 0.96 / 0.91 of one bracket's width. Box 17.88x10 / 13.88x8.5 / 11.98x7.5 - it fills the mark ceiling across and sits low, so in a row with plus and x it reads wide and light. Filled identical in box and in air, as A. The cost: the wider the opening the more it reads as two separate marks; at 24 the 7 units of air is more than a bracket and the pair starts to come apart. -->
  <path d="M5.5 4.875L2.817 7.558A0.625 0.625 0 0 0 2.817 8.442L5.5 11.125"/>
  <path d="M10.5 4.875L13.183 7.558A0.625 0.625 0 0 1 13.183 8.442L10.5 11.125"/>
</svg>
