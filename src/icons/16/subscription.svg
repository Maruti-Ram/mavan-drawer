<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: recurring payment, card, repeat, loop, composite, nucleo -->
  <!-- box: 14x12 -->
  <!-- base: credit-card -->
  <!-- Card on repeat: credit-card with calendar-repeat's two-head loop on its bottom-right corner (Nucleo credit-card-refresh), the loop verbatim and proud to the margin edge (C33). The card keeps its own place, so the composite (20×18 · 16×14 · 14×12) sits 1 below the canvas centre at every master, declared base: credit-card as password-lock does — Maruti has not yet chosen base-in-place over centred for this one. Cut back with 1.5 of air from the loop's ink: right wall ends 11.25 at 24 (2.5 below the stripe, air 1.64), removed at 20 and 16 where it would be shorter than 1.5; bottom wall ends 11.25 · 8 · 5.875; stripe whole at 24, ends 13.5 at 20 (the head tip) and 6.625 at 16 (the loop's top rail). The card's number bar is dropped at every master: at 20 it came 0.3 from the loop's end. Filled: top band whole at 24 and 20; at 16 notched round the head tip (r 2.125 about it, 0.5 fillets, band 2.375 thick there); the body becomes an upper strip 3 tall plus a column 8.75 wide at 24, and a column only at 20 (5.5) and 16 (4.375), as calendar-repeat-filled does; the loop stays at the outline weight. Round 1's pick: the only picture that says paying, again, by the familiar route, it reuses two shipped drawings without change and holds at 16; its weakness is that filled at 16 it becomes a band, a column and the loop, close to calendar-repeat-filled -->
  <path d="M14.375 5.125A1.5 1.5 0 0 0 12.875 3.625H3.125A1.5 1.5 0 0 0 1.625 5.125V10.875A1.5 1.5 0 0 0 3.125 12.375H5.875"/>
  <path d="M1.625 6.625H6.625"/>
