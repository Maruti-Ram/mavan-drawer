<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: stack, perspective, planes, depth, isometric, exploded, fluent, sf symbols, xcode -->
  <!-- Planes on the diagonal: Rhythm and balance: three equal upright planes, each a parallelogram 11×9.75 · 8×6.75 · 6.5×5.88 with its top and bottom edges rising 26.57 · 26.57 · 26.57° (2 to 1), stepping back up-left 3.5, 1.75 · 3, 2 · 2.75, 1.75 per plane, so the gaps are even: 2 · 1.5 · 1.5 of air between the near edges, 1.63 · 1.63 · 1.55 between the top edges. The planes behind show their near edge and their top edge; the short ends left where they pass behind (under 1.5 past their corner) are removed, as C33 removes a short wall. Ink 18×18 · 14×14 · 12×12, box-centred. Who: Fluent Layer Diagonal (reference file), SF Symbols square.3.layers.3d.down.right (rendered this session), Xcode's view-hierarchy debugger (from memory). Filled: the front plane solid, corners 0.75 · 0.75 · 0.625, the edges behind stay lines. Ink box identical. Off-grid numbers are the slope's run-outs and the cut ends. Risk: the 2:1 slopes are outside the 0/45/90 angle rule (layers' 24° is the precedent), and at 16 the short slanted lines step. (recommended) — it keeps three planes at every master and still reads as a stack going back at 16, where A has to drop to two planes and its depth cue becomes a single bracket. -->
  <path d="M8.125 8.75L13.375 6.125L13.375 10.75L8.125 13.375Z"/>
  <path d="M5.375 8.602L5.375 7L10.625 4.375"/>
  <path d="M2.625 6.852L2.625 5.25L7.875 2.625"/>
</svg>
