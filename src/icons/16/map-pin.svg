<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: teardrop, ring -->
  <!-- Teardrop, ring: Portrait keyline: ink 16x20 · 12x15.5 · 10x13.5 (20 and 16 use the keyline's 0.5 tolerance on height so the pin does not grow pointier as the keyline gets taller; tip angle still runs 76 · 68 · 62 degrees). Head a circle r7.25 · 5.25 · 4.375 on the centreline (the width of the keyline), sides the straight tangents from the head to the tip, tip rounded at the C10 mark bend 0.75 · 0.75 · 0.625, so no corner anywhere is sharp. Sides lean 38 · 34 · 31 degrees from upright (the tangent angle is a consequence of circle + tip, not a 0/45/90 line - an angle exception scoped to the pin, as with check or mail). Hole: a ring the size of user's head at 24 and 20 (ink 8 · 6, opening 5 · 3); at 16 user's head (5) leaves 1.25 to the wall, so the ring is 4 across (opening 1.5, whole pixels), clear of the wall by 2.5 · 1.5 · 1.75 (floor 1.5). Filled: one solid with a round hole the ring's outer ink (8 · 6 · 4), leaving 4 · 3 · 3 of material over it. Off-grid decimals: tangent points and the tip arc sit where the tangent lands. The standard pin every reference draws, on the set's own head circle (recommended). -->
  <path d="M4.256 8.263A4.375 4.375 0 0 1 3.625 6A4.375 4.375 0 0 1 12.375 6A4.375 4.375 0 0 1 11.744 8.263L8.535 13.573A0.625 0.625 0 0 1 8 13.875A0.625 0.625 0 0 1 7.465 13.573Z"/>
  <path d="M6.625 6A1.375 1.375 0 1 0 9.375 6A1.375 1.375 0 1 0 6.625 6Z"/>
