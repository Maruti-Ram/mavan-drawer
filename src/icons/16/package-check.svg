e grown cut by the line touching both (right 0.68 · 1.17 · 0.76 long, bottom 0.47 · 1.06 · 0.58), so the filled ends stop where the outline's do. Inside the check's V the solid follows the grown ink down to a tip eased 0.5, file-check-filled's own points: at 24 between the two arms' grown sides, at 20 and 16 between the long arm's grown side and the short arm's grown cap. The label slot keeps a line weight of solid to the bite: whole at 24 (1.86 of material), shortened at its right end at 20 and 16, to x 8.5 · 6.5 from 9 · 6.75 (slot ink 3.25 · 2.5 long, 0.5 · 0.25 shorter than the outline's label), because whole it would leave 1.18 · 1.10 of material against the bite; now 1.57 · 1.30. The check stays a line at 1.5 · 1.5 · 1.25. Tightest air, outline: 1.54 · 1.68 · 1.56; filled: 1.500 · 1.502 · 1.500. Off-grid decimals: the check's own (V2 spec), the lid's chamfer tips (package-filled's), and in the filled body the cut's tangent points — the right cap's tangent 20.65,14.39 · 16.73,11.58 · 13.741,9.381 to 20.06,14.75 · 15.82,12.32 · 13.129,9.824 on the grown tip, the long arm's grown side from 19.66,15.06 · 15.65,12.47 · 12.852,10.064, the V's ease 16.7,18.02 to 16,18.01 · 14.07,14.05 to 13.44,14.12 · 11.683,11.264 to 11.059,11.338, the short arm's grown side from 15.75,17.76 (24 only), and the bottom join 11.92,19.68 to 11.99,20.14 · 9.99,15.41 to 9.73,16.44 · 7.815,12.877 to 7.745,13.451 — rounded to 2 · 2 · 3 dp away from the check so the air never falls under 1.5. -->
