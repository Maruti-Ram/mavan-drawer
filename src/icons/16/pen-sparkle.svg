  <!-- Pencil and sparks: (recommended) The survey's own picture — Fluent PenSparkle, Material pen_spark, Nucleo and Lucide all put a pencil on the diagonal and the spark in its empty corners — and it is pencil-4's pencil, untouched, so it sits beside pencil and wand as one family. Balance: the pencil is centred on the box diagonal, a large spark fills the top-left corner and a smaller one the bottom-right, so the two corners the pencil leaves are both used and the mass stays within half a unit of the centre: (-0.29, -0.47) · (-0.16, -0.21) · (-0.15, -0.22). A single spark with wand's dot was tried first and leaned (-0.82, -1.01) at 24. Pencil 18×18 · 14×14 · 12×12 (pencil-4). Top spark 7 · 5.5 · 4.25 across (wand's and sparkle-2's at 24 and 20; at 16 wand's 4.5 came 1.49 from the pencil, so it is 4.25, r 1.5); bottom spark 5 · 4.5 · 3.5 (sparkle-3's third spark at 24 and 20, r 1.125 at 16). Air spark to pencil 2.21 · 1.51 · 1.76, small spark to pencil 2.92 · 1.86 · 1.67. Ink 18×18 · 14×14 · 12×12, square keyline, box-centred. Filled: pencil-4-filled's pencil (white band at the ferrule) and both sparks filled to the outline's own ink, so the boxes match. Tight at 16: the small spark is 3.5 px, a plus more than a star; the 20 air (1.51) is the floor. Seen at 16 beside the set it is very close to wand: a diagonal stick, a spark top-left and a small mark bottom-right — only the pencil's chisel tip and ferrule band, and the second spark in place of wand's dot, tell them apart. If both ship, check them side by side at 16. -->
