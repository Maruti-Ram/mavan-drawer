  <!-- box: 13x13 -->
  <!-- glyph: dot -->
  <!-- Bare "!" on the corner: The shipped message bubble, unchanged and in place, with a bare "!" as a C33 line badge on its bottom-right corner, the dot's ink corner on the margin edge (22 · 18 · 15). The "!" is alert-circle's drawn to a tall badge's height: the same dot (ink ⌀2.5 · 2 · 2, the library constant), the same C19 air of 1 between bar and dot, the bar 6 · 5 · 4 of ink (alert-circle 8 · 6 · 4.5, alert-square 8 · 5 · 3.5, alert-triangle's floor for reading as "!" at 16 is 3.375). Axis x 20.75 · 17 · 14, bar on the line 13.25→17.75 · 10.75→14.25 · 8.625→11.375, dot centre y 20.75 · 17 · 14. Badge ink 2.5×9.5 · 2×8 · 2×7, top at 12.5 · 10 · 8, the tall-badge height (password-lock 9.5 · 8.25 · 7). Composite ink 19×19 · 15×15 · 13×13 (calendar-repeat's box), centre 0.5 toward the badge, declared as box; no base note, 0.5 is within the centre. Cut back by hand with 1.5 of air from the "!" ink, one open path in the shipped path's own segments (the closing Z written as its line): the right wall stops at y 10.25 · 7.75 · 5.875 on the line, leaving 4 · 2 · 1.75 straight past the top-right corner; the bottom wall stops at x 17.75 · 14 · 11.25, 8.32 · 5.67 · 4.33 straight from the tail's fillet; the bottom-right corner goes at every master. Both ends stop outside the badge's ink box (V2 rule 3a). Tightest air, bubble to "!", outline 1.50 · 1.50 · 1.50 (the bottom wall's end to the bar), the right wall's end to the bar's top 1.54 · 1.59 · 1.57; the dot keeps 3.41 · 3.05 · 2.93. Filled: the shipped message-filled solid, cut along the bar's ink grown 1.5 (radius 2.25 · 2.25 · 2.125 round the bar's line), so the white round the bar is 1.50 at every master; the solid's two cut ends round at the outline cap radius 0.75 · 0.75 · 0.625, the bottom one centred on the outline bottom wall's end (17.75, 16.25 · 14, 13.25 · 11.25, 10.375), the right one tangent to the bite, its centre 0.04 · 0.10 · 0.07 below the outline right wall's end because that end sits on the grid with 1.54 · 1.59 · 1.57 of air. The dot's grown circle clears the solid, so the solid keeps its bottom edge. The "!" stays a line at the outline weight 1.5 · 1.5 · 1.25 in the filled twin (a line badge, C33); filled ink box identical. Off-grid values: 9.43, 8.37, 5.03 and the like are the shipped bubble's own; in the filled cut 10.29 · 7.85 · 5.947 are where the corner fillet leaves the right edge and 20.38, 11.03 · 16.44, 8.57 · 13.517, 6.556 where it meets the bite, both tangent points. At 16 the bar is centred on the dot's axis x 14, as alert-circle's is on x 8, so its edges fall on eighths: in real pixels it renders 53–63% across two columns (alert-circle's bar the same), the dot 77%, with a clear row above the bar, a clear row between bar and dot and a clear column between the bar and the bubble, outline and filled. The "!" stands where the bubble's right wall was, on nearly the same line (0.5 · 0.75 · 0.625 right of it) (recommended: the only picture that holds every rule at every master). -->
