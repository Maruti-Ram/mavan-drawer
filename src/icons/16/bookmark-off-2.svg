  <!-- Big slash to the square, lifted 1.25, round head, whole notch: What the eye sees: bookmark-2 under A1's lifted bar. The whole notch survives, so the foot reads as a bookmark. The dome keeps more than on B2: from 11:03 · 11:26 · 11:31 over the top round to 3:00 and down the right side. The right tail is short, as A1's. The bar's upper end starts out in the empty corner of the box, well clear of the dome. The bar's centre sits 1 above the canvas centre and 0.25 right of it, at 12.25,11 · 10.25,9 · 8.25,7; the 1.25 is the line it sits on. Bar (C21, V1 spec as ruled 2026-10-25, the big slash to the square keyline): \ at 45°, its ink the square keyline 18 · 14 · 12, centreline (4,2.75)-(20.5,19.25) · (4,2.75)-(16.5,15.25) · (2.875,1.625)-(13.625,12.375), on the line through the bookmark's ink centre lifted 1.25 (0.88 square to the bar), slid 0.25 down-right along itself (0.35 along the bar) at every master; the same bar on all three bookmarks, whose ink centres agree. Its ink spans x 3.25–21.25 · 3.25–17.25 · 2.25–14.25, y 2–20 · 2–16 · 1–13, inside the margin edge. OUTSIDE C21's centred bar: A1's bar, the row's one bar. Its upper-left end stands 3.90 · 2.72 · 2.36 past the round head (B2: 3.53 · 2.31 · 1.97), all of it inside the box and the margin edge (ink from x 3.25 · 3.25 · 2.25, y 2 · 2 · 1). Along the bar it runs 3.94 · 2.73 · 2.37 past the dome against 2.87 · 1.46 · 1.51 past the right side. B1's own best balance would slide the bar to x 4.5 · 4.5 · 3.125, but the row shares bookmark-off's bar. Why not a whole step: a lift of 1 loses the V's right edge at 20 (1.371 of air, under 1.5) and is 0.004 short at 16 (1.496). A lift of 2 is the least whole step that works at every master (air 2.79 · 2.08 · 2.20), but it slides the box 1 right of centre, the bar 1 · 0 · 0 past the left side and 3 · 2 · 2 past the right, visibly lopsided. So 1.25 with a 0.25 slide is the better balance. Cut: every stroke stops with 1.5 of air from the bar's edge, measured 1.500–1.512 at every cut end (centrelines 3 · 3 · 2.75 apart), round caps; the cut ends at 16 are not snapped to pixels, so the air stays even. The notch's right edge runs at 45°, parallel to the bar, its centreline 3.75 · 3.05 · 2.92 from the bar's (air 2.25 · 1.55 · 1.67). The foot is cut exactly as A1's. Up the left side the 1.5 line falls 0.25 into the dome at 24 and 20. The side is carried straight on to it (y 8.75 · 7.75), since the dome's first 0.25 lies within 0.005 of the side's line, and an arc written from the rounded cut end bulged 0.001 past the box. At 16 it stops on the side (y 6.265). The dome's cut end sits at (9.01,3.51) · (8.48,2.97) · (6.904,1.764). What the longer bar removes that the inside-width bar did not: only the right tip's round, 1.09 · 0.96 · 0.87, as on A1; the dome is cut exactly as before. Kept (24 · 20 · 16): the dome piece 16.70 · 11.56 · 9.22, from the cut over the top and down the right side to y 12.75 · 9.75 · 7.235; the foot 28.44 · 21.69 · 18.53. Removed: the dome's upper left with the left side's top, 6.44 · 6.44 · 6.03; the right side between the cuts with part of the tip's round, 8.33 · 8.24 · 7.51; crumbs under 1.5 dropped: none · none · none. 75% · 69% · 67% of the bookmark's line survives. Every uncut segment is the shipped bookmark-2's, verbatim; off-grid decimals are the cut ends and the channel's corners, where the circle or line puts them. bookmark-2 stays in place (C34): its ink 14×20 · 12×16 · 10×14, centred 12,12 · 10,10 · 8,8. The composite's ink is 18×20 · 14×16 · 12×14 (declared box at every master), 0.25 right of the canvas centre (optical 0.25 0), outline and filled alike. Filled: a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side) knocked out of the solid, its corners rounded r0.75 · 0.75 · 0.625 about the outline's cut ends, so each solid's tip is the outline's cap; white 1.500–1.506 each side. The bar runs whole through it at 1.5 · 1.5 · 1.25. Two solids: the head 64.65 · 36.05 · 23.39, the foot 87.19 · 55.53 · 40.66 (units²). The right tail is a strip 2.25 · 1.55 · 1.42 wide, over the line weight. Balance: outline mass −0.16,+0.30 · −0.21,+0.21 · −0.17,+0.22 (bookmark-2 alone 0,+0.82 · 0,+0.64 · 0,+0.56; B2 −0.51,−0.21 · −0.41,−0.13 · −0.34,−0.11). Filled −0.23,−0.14 · −0.36,−0.07 · −0.30,+0.06 (bookmark-2-filled 0,−0.14 · 0,−0.04 · 0,−0.03). What it costs: as A1. The bar's upper end stands furthest from its base on the board, in the box's empty corner. (recommended) -->
