  <!-- Tilted, classic in both styles: OUTSIDE THE GAP RULE (filled only, at 24 and 20). The only candidate whose filled twin keeps the whole classic clip - both loops - at 24 and 20, so outline and filled are the same picture. The price: the filled legs stand 1.04 · 1.0 apart instead of 1.5, and the outline has to be drawn wider to make room (legs 3.89 · 3.18 apart), so at 24 it is rounder than G. In real pixels the filled 20 holds but is visibly tight. At 16 even a gap of 1 cannot hold four heavy legs (it was drawn: 0.93, and it closes to a blob), so the 16 is G's drawing, three legs when filled, inside the rule. Ink box 19.96x19.85 · 15.9x15.83 · 13.99x13.95, filled box the same to 0.01. Smallest gap, outline 2.38 · 1.67 · 1.57 (between neighbouring legs); filled 1.04 · 1 · 1.86 (between neighbouring legs); floor 1.5. The check warns about the filled 24 and 20 gaps on purpose. Filled is the line-heavy case: nothing to fill, so the same wire at 2.5 · 2 · 2, outer legs moved in 0.5 · 0.25 · 0.375 and free ends pulled back the same, so the ink box is held. Off-grid by construction (45 degree geometry): the half-circle radii, which are a leg spacing times 0.707 and are written rounded down so the renderer completes the exact half circle; and in the filled twin the leg and turn coordinates, because moving a leg in by half the added weight across a diagonal moves it 0.35 · 0.18 · 0.27 on each axis. Every outline leg end and free end is on the grid. -->
