<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: bars, rows, horizontal, baseline, axis, analytics, report -->
  <!-- Bars from a wall (chart-bar-2 turned): chart-bar-2 with its floor line stood up as a wall on the left and the bars growing from it, short / long / medium from top to bottom, the same order as A and the references. That order comes from flipping chart-bar-2 over its bottom-left-to-top-right diagonal (a clockwise quarter turn, then top and bottom swapped), at every master: the floor folds onto the left edge in place and the right-hand low bar becomes the top bar. A plain clockwise turn gives medium / long / short, which ends on a short line like the last line of a paragraph and, beside a rule on the left, reads as a block quote. The wall is what makes it a chart at 16: a crisp one-pixel black line the bars start from, where A is all grey rows. Every part is chart-bar-2's: the wall 18 · 14 · 12 long (x 3.75 · 3.75 · 2.625), bars on centrelines 6 / 12 / 18 · 5 / 10 / 15 · 4 / 8 / 12, bar lengths 6 / 15 / 10 · 4.5 / 11 / 7.5 · 4 / 9 / 6 of ink, the long bar reaching the right edge. Air bar to wall 1.5 · 1.5 · 1.75 (1.75 at 16 so the bar ends land on a whole pixel, as chart-bar-2), between bars 4.5 · 3.5 · 2.75. Ink box 18 × 18 · 14 × 14 · 12 × 12 on the square keyline, filled identical. Filled: chart-bar-2-filled flipped the same way, weight 2.5 · 2 · 2 with the ink box held: the wall thickens inward (centreline 4.25 · 4 · 3), the bars' far ends pull in 0.5 · 0.25 · 0.375 and their near ends move right to keep 1.5 of air to the heavier wall (filled lengths 5 / 14 / 9 · 4 / 10.5 / 7 · 3.5 / 8.5 / 5.5). At 16 the filled short bar is 3.5 long by 2 tall, the stubbiest part, as in chart-bar-2. Nearest shipped drawing: align-object-left (a wall with two outlined boxes); here three lines, so the two stay apart. (recommended) -->
  <path d="M2.625 2.625V13.375"/>
  <path d="M5.625 4H8.375"/>
  <path d="M5.625 8H13.375"/>
  <path d="M5.625 12H10.375"/>
</svg>
