  <!-- Bar cut through: What the eye sees: shield-2 struck the same way, and its crowned top survives the cut — the upper piece starts on the crown arc and runs over its peak to the right shoulder, so the bowed top still reads at 24 and 20; below the bar it is A1's lower piece exactly (shield and shield-2 share the body below the shoulders). The bar (C21, V1 spec): \ at 45°, its ink the square keyline 18 · 14 · 12, centreline (3.75,3.75)-(20.25,20.25) · (3.75,3.75)-(16.25,16.25) · (2.625,2.625)-(13.375,13.375) — exactly on shield-2's own ink centre 12,12 · 10,10 · 8,8 at every master, no snapping needed. shield-2 is portrait (16×20 · 12×16 · 10×14), so the bar stands 1 · 1 · 1 past each side and sits 1 inside its top and its point (bar ink 3–21 against 2–22 at 24, 3–17 against 2–18 at 20, 2–14 against 1–15 at 16): the spec's default for every row; whether a portrait base should hold the bar inside its own width is asked once, on the bell-off board, and this row follows that ruling. shield-2 stays in place (C34). Cut: every stroke stops with 1.5 of air from the bar's edge — cut ends measured 1.505 · 1.505 (one end 1.512) · 1.501, centrelines 3 · 3 · 2.75 apart; round caps on every cut end; tightest air anywhere in the drawing is that cut air. Pieces (24 · 20 · 16): upper 22.07 · 15 · 12.47 — from the cut on the crown at (7.51,3.26) · (7.26,3.01) · (5.743,1.853), over the crown's peak, the right shoulder and the right side, to (18.93,14.68) · (15.25,11) · (12.375,8.485), as A1; the crown's left end sits 0.51 · 0.26 · 0.23 below its peak and its right end 0.75 · 0.5 · 0.5, as shipped, so the rise shows on the right half where shield-2 has it; lower 19.51 · 13.08 · 10.86, A1's lower piece verbatim (3.78 · 2.29 · 1.91 of line from the cut to the point). Removed: the top-left corner — left side above y 9 · 9 · 7.515, the left shoulder round and the crown's first 0.97 · 1.06 · 1.1 — 7.30 · 7.49 · 6.96 of line, and the right belly across the bar, 6.22 · 6.48 · 6.08; 75 · 67 · 64% of shield-2's line kept. Nothing under 1.5 is left (shortest straight the left side's 3.31 · 1.80 · 1.43, tangent into the belly). Every uncut segment is shield-2's own, verbatim. Ink 18×20 · 14×16 · 12×14 (declared box), centred 12,12 · 10,10 · 8,8, outline and filled alike. Mass from the canvas centre, outline +0.23,−0.50 · +0.20,−0.36 · +0.17,−0.31 (shield-2 itself 0,−0.83 · 0,−0.59 · 0,−0.50); filled +0.28,−0.68 · +0.23,−0.49 · +0.20,−0.43 (shield-2-filled 0,−0.78 · 0,−0.56 · 0,−0.47). Filled: shield-2-filled's solid split by a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side; edges on x − y = ±3.19 · ±3.19 · ±3.006), its corners r0.75 · 0.75 · 0.625 — each corner round is the outline's round cap at that cut end, so the filled outer edge is the outline's outer edge exactly; white each side measured 1.506 · 1.506 · 1.501; the bar runs whole through it at 1.5 · 1.5 · 1.25. Two solids, upper right and lower left, nothing removed beyond the outline's removed runs, no sliver. At 16 the crown's rise is half a pixel, as on shield-2 itself: rendered at 16 px, B1 differs from A1 only in the grey of the top two pixel rows (19 pixels outline, 12 filled, at most 43% at the shoulders) — softer shoulders, not a new shape; the crown is read at 24 and 20. Off-grid decimals are the cut ends and the channel's corners, where the circles put them; every other number is shield-2's own. (recommended) -->
