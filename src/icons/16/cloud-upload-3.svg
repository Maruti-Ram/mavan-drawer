  <!-- Cloud-3, arrow up into it: Ink 20×20 · 16×16 · 14×14 (the circle keyline), filled identical, box-centred: no base note. The cloud is its shipped self moved up 3 · 2 · 2 to the top margin (ink top 2 · 2 · 1); no lobe radius or notch fillet changed. Open base, shared by cloud-download and cloud-upload: each end puff stops where it keeps exactly 1.5 of air from the up-arrow's head (the tighter of the two), so both files have the same cloud. Ends: the front puff stops at 111° · 132° · 123°, the right puff at 79° · 51° · 61° (ends at y 13.97 / 14.19 at 24). Overlap: the front puff's inner arc is cut back with 1.5 of air from the shaft — it runs 49° · 30° · 32° (3.4 · 1.7 · 1.45 long) against cloud-3's 52° · 52° · 46°; at 24 it is nearly whole, at 20 and 16 it is a short hook off the T, and the T is what still says "in front". Arrow: arrow-up's classic head unchanged (10 · 9 · 8 wide, legs 45°, bend 0.75 · 0.75 · 0.625), tip at 11.75 · 9.75 · 7.875, tail on the box edge — 11 · 9 · 7.75 long; cloud-download's arrow turned round, on the same span, so the pair swaps nothing but the head. Filled: the cloud solid, outer edge on the outline's; everything under the head's roof cut away — the roof runs 1.5 of air outside the legs and the bend (2.25 · 2.25 · 2.125 from the centrelines), so the cloud's bottom becomes a V opening round the arrow; where the roof meets the end puffs the corners are 0.75 · 0.75 · 0.625; arrow at the outline weight. The white band round the front puff stays at 24, stopping at −33° (1.5 of solid to the roof); at 20 and 16 it goes, as in cloud-download-3. Tightest air: 1.5 at the open ends, 1.5 under the cut roof. Off-grid values are tangent points and the shipped head's own decimals. Who: Material filter_drama's cloud, on cloud-3. -->
