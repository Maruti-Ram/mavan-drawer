  <!-- Hook, chamfered front: Hooked handle: a flat stub from the ink edge (3 · 3 · 2) bending down at r1.5 · 1.25 · 1 into the post (centreline x 6.75 · 6 · 4.625). Basket off the post, top 6.75 · 5.75 · 3.625, bottom 12.75 · 9.25 · 6.875, front 20.25 · 16.25 · 13.375: 15x7.5 · 11.75x5 · 10x4.5 of ink, 4.5 · 2 · 2 clear inside (floor 1.5), top corner r1.5 · 1.25 · 1. Front upright, then a 45° chamfer of 3 · 1.75 · 1.5 into the bottom (bends r1.5 · 1 · 0.75), so the cart leans forward without leaving 0/45/90. The post runs on below the basket and bends at r1.5 · 1.25 · 1 into a chassis rail at 15.75 · 12.25 · 9.625, 1.5 · 1.5 · 1.5 clear of the basket. The rail stops at the chamfer's foot (17.25 · 14.5; 11.375 at 16, half a unit short so the front wheel lands on whole pixels). Wheels: two solid dots of 3 · 2.5 · 2 ink (image's and bell's dot), 1.5 · 1.5 · 1.75 clear of the rail; the rear dot starts at the post's inner edge, the front one ends with the rail; at 16 both sit on whole pixels (centres 6 and 11). Ink 18x18 · 14x14 · 12x12, square keyline, box-centred. Mass centre, measured by render: outline 0.06 right and 0.19 high of the box centre at 24, 0.08 right and 1.0 high at 16; filled 0.44 right at 24 — balanced left–right, so no C15 shift proposed; the cart is top-heavy at 16 because the wheels are small, worth a look on an optical sheet later rather than a guess now. 16 master at stroke 1.25: centrelines on the eighth grid so the rail and the dots land on whole pixels. Filled: basket solid on the outline's outer edge, wheels solid discs, handle, post and rail stay lines at 1.5 · 1.5 · 1.25. Every part is the set's own (detail radius, image's dot, briefcase's line-weight handle), the chamfer is the only diagonal and it is 45°, and at 16 it still reads as a cart rather than a shelf (recommended). -->
