<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: wrench, spanner, tool, settings, maintenance, fix, repair, build, open end, jaw, round corners -->
  <!-- Round horns: A's drawing with the horns rounded hard: mouth corners 4 - 3.5 - 3 against A's 2.5 - 2.25 - 2, so each horn ends in most of a semicircle. The softest and friendliest of the three, and the closest to C1's "no sharp icons" - but the rounder the tip, the more the jaw reads as a dent in a blob rather than as an opening, and at 16 the head starts to look like a clover. Handle 4.5 - 4.5 - 4 wide holding exactly 1.5 of air inside it, round butt of radius 2.25 - 2.25 - 2. Jaw opening 2 - 1.75 - 1.5 of air, each prong 5 - 4.5 - 4 wide with 2 - 1.5 - 1.5 of air inside it. Lips are drawn as plain corners, so the round cap rounds them to exactly half a stroke; the jaw floor is flat with a 0.5 - 0.5 - 0.375 fillet. Filled: the silhouette fills solid and the jaw stays a notch of white measured at 1.5. -->
