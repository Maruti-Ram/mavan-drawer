  <!-- One bar, the bare ₹ scaled evenly: One bar at 20 and 16, as euro-circle drops one, with the ₹ at the bare rupee's own proportions, scaled evenly: 0.6 at 20, 0.55 at 16, then snapped to the grid. Width ÷ height: 0.69 at 20 (bare 0.69) and 0.65 at 16 (bare 0.67). Bar length ÷ bowl rx: 1.8 · 1.81 (bare 1.88 · 1.8). Bowl height ÷ centreline cap: 0.55 · 0.6 (bare 0.61 · 0.65); the strokes do not scale, so the bowl reads a little shorter. Leg 45°, as the bare. Dropping the second bar leaves the bowl's own height, so nothing is squeezed. 20: head line 8.25→12.75, bowl rx×ry 2.5×2, leg 2.73. 16: head line 6.5→10.125, bowl 2×1.875, leg 2.09. Ink 6×8.71 · 4.88×7.54 (€ 7.27×8 · 6.56×7.5). Round body centred: offset 0 at 20 and −0.06 at 16, the eighth grid's limit. Air to the ring, head line's end / leg end: 1.68 / 1.52 at 20 and 1.65 / 1.58 at 16. No gap notes; filled clean, every cut 1.5. In real pixels at 16 it still reads as ? or र rather than ₹: one bar is not enough at this size. -->
