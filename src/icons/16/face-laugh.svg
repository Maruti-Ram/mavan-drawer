  <!-- tags: open mouth, grin, laugh, laughing, joy, expression -->
  <!-- Open grin: Rhythm and balance: one vertical stack, eye, lid, counter, lower lip, ring, with gaps 1.75 / 2.25 / 2.25 at 24 and 1.5 / 1.5 / 1.5 at 20 and 16 (20 and 16 are packed: the family's eyes sit as high as the ring allows, so the mouth gets exactly 1.5 everywhere). Mouth side walls to the ring 3.07 · 2.13 · 1.93, equal left and right; symmetric, so box-centred. Eyes: face-smile's own dashes, untouched (ink 1.5x3 · 1.5x2.75 · 1.25x2.5, same x and y). Mouth: a straight lid (y 13.75 · 11.25 · 8.875) with a half-ellipse under it, rx 4.5 · 3.5 · 3.125, ry 3.75 · 3 · 2.75; ink 10.5x5.25 · 8.5x4.5 · 7.5x4; it spans 0.49 of the ring's diameter at every master (face-smile's arc spans 0.52). The half-ellipse meets the lid square, so the corners are round joins, not points. Counter (the white inside the mouth) 2.25 · 1.5 · 1.5. Filled: the mouth hole is the outline mouth's own silhouette with its top edge lowered 0.25, which keeps 1.75 · 1.71 · 1.5 of black under the eye cuts (eye cuts verbatim from face-smile-filled); rim under the hole 3.75 · 3 · 2.75. The hole's two top corners round at C1's 0.75 · 0.5 · 0.375 (lint §5k, 2026-10-24), tangent to the lowered edge and to the lip: at 20 and 16 the arc is centred on the lid's line and meets the lip where it stands upright, so the hole keeps its width; at 24 the arc meets the lip 0.28 below the lid's line, so the hole is 10.48 wide there, not 10.5. Drawn this way by Lucide laugh, Tabler mood-happy, Material sentiment_very_satisfied, Font Awesome face-laugh, Central emoji-grinning, Untitled face-happy. At 16 beside face-smile the closed lid and the white counter make it plainly a different face. Off-grid numbers: the filled hole's corner tangent points at 24 (7.51/16.49 on the edge, 6.76/17.24 at y 14.03 on the lip; the lip's centre stays within 0.003 of 13.75 and the join turns under 2 degrees). (recommended) -->
