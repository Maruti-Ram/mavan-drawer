<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: bars, columns, baseline, axis, analytics, report -->
  <!-- Three bars over a floor line: Three upright lines - middle, tall, low - floating just above a full-width floor line. The floor makes it a chart at a glance and gives the 16 a crisp black line to stand on, where the bare bars of A are all grey. Square guide box 18 · 14 · 12, filled completely: the floor runs the whole width, the tall bar reaches the top. Bars on A's centres (6 · 5 · 4 apart). Bar heights 10/15/6 · 7.5/11/4.5 · 6/9/4. Smallest gap is bar to floor: 1.5 · 1.5 · 1.75 (1.75 at 16 so the bar ends land on a whole pixel), filled 1.5 · 1.5 · 1.5; between bars 4.5 · 3.5 · 2.75, filled 3.5 · 3 · 2. Ink box 18x18 · 14x14 · 12x12, filled identical. Filled: the line-heavy case, as sliders-4-filled - everything at 2.5 · 2 · 2 with the ink box held; the floor thickens upward, so the bars end higher to keep 1.5 of air (filled heights 9/14/5 · 7/10.5/4 · 5.5/8.5/3.5). At 16 the filled low bar is 3.5 tall by 2 wide, the stubbiest part of the drawing. Best base for the family: horizontal = the same drawing turned, floor line on the left; stacked = each bar broken by a 1.5 gap; trend = a rising line over shortened bars (recommended) -->
  <path d="M2.625 13.375H13.375"/>
  <path d="M4 5.625V10.375"/>
  <path d="M8 2.625V10.375"/>
  <path d="M12 7.625V10.375"/>
