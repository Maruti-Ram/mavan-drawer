  <!-- Crossed, wrench in front: What changed from A: A cut the screwdriver's handle along the jaw's edge, so it showed as a lopsided U at 24 and a hook at 20 and 16, and its top-left end was a bare stick. Here the wrench is the shipped file, untouched. The screwdriver behind it gets the collar used on C2 (a crossbar where the shaft meets the handle). At 24 its axis sits 1 below the canvas diagonal, so the handle clears the jaw and shows whole: 4.5 wide, 5.95 from collar to round back, collar 0.75 past each side. 1.75 of shaft shows between the wrench and the collar, and 7.57 at the top left, so at 24 it reads as one tool passing behind the wrench. At 20 and 16 nothing can do that. The jaw leaves only 4.0 and 3.15 of height below it (measured, every position scanned), and an outline handle needs 4.5 and 4 just to hold 1.5 of air inside. So on the diagonal the handle's round end shows as a U, cut square across its own axis 1.5 off the wrench: 3.52 and 2.81 long, 4.5 and 4 wide, symmetric where A's was a hook. Top-left shaft 3.71 and 2.96. At 16 the screwdriver shows 5.8 of its 18.7 length (31%), the wrench 100%. Tightest air 1.5 at every cut, both styles. Ink 19.98 · 15.98 · 13.98 square, the wrench's own box. Mass centre from the canvas centre, outline +0.54,+0.60 · +0.27,+0.17 · +0.22,+0.14 (A: +0.63,+0.25 · +0.29,+0.19 · +0.24,+0.16): lower at 24 because the handle is now whole. Filled: the U's cut corners rounded 0.5. Values on the 45 degree axis are off the quarter and eighth grid, rounded to 2 · 2 · 3 dp; the wrench's values are the shipped file's. Honest read at 16: the same as A, a wrench, a stick and a round end; the gain is at 24. The classic crossed pair: Heroicons wrench-screwdriver, Font Awesome screwdriver-wrench. -->
