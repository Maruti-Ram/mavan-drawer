<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: table, data, rows, columns, spreadsheet, sheet, three rows -->
  <!-- 3 rows × 2 columns: Three rows and two columns — Lucide’s own table. The container is the layout family’s: the square keyline, radius 2.5 · 2 · 1.5, the same rounded rectangle layout-header and layout-sidebar ship. Rows carry 4 · 4 · 4 of air at 24, 2.75 · 2.5 · 2.75 at 20 and 2.5 · 2 · 2.5 at 16 — equal where the grid allows it, the middle row giving up a quarter at 20 and a half at 16 because the eighth grid has nowhere else to put the line. Columns 6.75 · 4.75 · 4.125. Three rows is what makes it a table rather than a layout: one horizontal line reads as a header on a panel, two read as rows of data. Filled follows layout-header-filled exactly — solid cells, a literal 1.5 of white on every divider at every master (C22), outer corners 3.25 · 2.75 · 2.125 and every inner corner 0.5. (recommended) -->
