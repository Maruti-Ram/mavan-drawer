  <!-- tags: clasp, fingers, thumb, deal, agreement, partner, lucide -->
  <!-- box: 14x11.915 -->
  <!-- Clasp, fingers shown, no cuffs: What the eye sees: two hands, not cuff-block-cuff. The cuffs are gone. The left arm is the icon's left edge and the right forearm comes in level from the right (Lucide's handshake, drawn with our parts). The left hand's fingers wrap down-right at 45°, three at 24 and two at 20 and 16 (a finger dropped, not squeezed). They use hand-grab and hand's construction: shared walls and round tips, pitch 3.5 · 3.25 · 3, tip r 1.75 · 1.625 · 1.5. The little finger is the shortest, by 1.4 · 1.1 · 1.0 along the finger. The right hand's thumb lies over the left hand's back, pointing down-left: 3 · 3 · 2.75 wide with a round tip, like hand's thumb. The finger walls come out from under it: the last wall at 24, both walls at 20 and 16. The right palm's heel comes down square (45°) onto the last finger, so no wedge of white closes to a point. Arm corners r 1.5 · 1.25 · 1. Agreed box 20×16 · 16×13.24 · 14×11.92, its bottom the little fingertip. Tightest air between separate lines, measured: 1.65 · 1.76 · 1.66. Filled: the thumb keeps its ink edge and the left hand is cut back 1.5 round it (a white C). The fingers share the outline's width evenly, 2.5 · 2.5 · 2.25 wide, parted by 1.5 white slits from the knuckle out, as hand-filled does. A finger that comes out from under the thumb stands as its own shape. All white is 1.5 at every master; filled box = outline box. (recommended for A) It reads as two hands at 16 in both styles. The fingers and the thumb carry it, so it no longer depends on the cuffs. -->
