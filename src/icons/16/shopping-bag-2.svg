<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: tote, tapered, arch handle, nucleo, central, untitled -->
  <!-- Tapered tote, handle on the rim: A bag wider at the foot than the mouth, a round handle standing on the rim (Nucleo bag-shopping, Central shopping-bag-2, Untitled shopping-bag-02 — the shape most sets draw). Ink 16×20 · 12×16 · 10×14, portrait keyline. Mouth 11.5 · 8.5 · 7.25 wide on the centreline; walls lean 8.7° · 7.2° · 6.0° (a fixed angle is a next-round variation). Rim 34% down the ink. Handle 6.5 · 5 · 4.75 wide, rising 6 · 4.5 · 4 above the rim, 5 · 3.5 · 3.5 of air inside it and 4.5 · 3 · 2.75 under its top. Corners 2.5 · 2 · 1.5 at the foot, 1.5 · 1.25 · 1 at the mouth. The legs stop on the rim: dipping inside would need 1.5 of air to a leaning wall, which leaves a 3 · 2.2-wide handle at 20 and 16. Padlock risk: at 16 the handle is lock's shackle exactly (5.625 → 10.375, needed for whole-pixel edges), and the filled twin is lock-4-filled with sloped walls — only the taper and the shorter loop say bag. Filled: body solid, handle a line. -->
  <path d="M3.633 12.719L4.281 6.521A1 1 0 0 1 5.276 5.625H10.724A1 1 0 0 1 11.719 6.521L12.367 12.719A1.5 1.5 0 0 1 10.875 14.375H5.125A1.5 1.5 0 0 1 3.633 12.719Z"/>
  <path d="M5.625 5.625V4A2.375 2.375 0 0 1 10.375 4V5.625"/>
</svg>
