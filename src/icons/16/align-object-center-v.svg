  <!-- Line and two boxes: Rhythm: two boxes 6 · 5 · 4 wide (white inside 3 · 2 · 1.5), 2 · 2 · 2 between them; the line spans the whole 18 · 14 · 12 and runs 2 · 1 · 1 past the boxes at each end; long box 18 · 14 · 12 tall, short 12 · 10 · 8 (0.667 · 0.714 · 0.667 of the long), both centred on the line, the long one on the left. Balance: ink 18 · 14 · 12 square on the square keyline, box-centred on the canvas with margins 3 · 3 · 2 on all four sides; ink mass off the canvas centre by x, y -0.66, 0 · -0.51, 0 · -0.52, 0, toward the long box on the left — kept on the box centre on purpose, as Lucide align-center-horizontal and Nucleo align-vertical are: the lean is what the icon says, and C14 moves only pointing marks. Corners r 1.5 · 1.25 · 1 on the centreline (inside 0.75 · 0.5 · 0.375, the C1 floor); 16 on the eighth grid, every box wall on x.375 / x.625 so outer edges land on whole pixels. The line runs behind the boxes, drawn only above, between and below them, each piece ending on a box wall's centreline, as align.vertical.center, Nucleo align-vertical and Central horizontal-alignment-center build it — no box is cut; at 16 the outer pieces show 1 past the boxes, the middle one 2. Who: Lucide align-center-horizontal, SF Symbols align.vertical.center, Nucleo align-vertical, Central horizontal-alignment-center — the common picture. Order: every reference checked leads with the tall box, as here — Lucide align-center-horizontal, SF Symbols align.vertical.center, Nucleo align-vertical / align-3-vertical, Central horizontal-alignment-center and Untitled UI align-vertical-center-02. Figma's "Align vertical centers" is this picture with solid bars (D). Filled: both boxes solid to the outline's outer edge (corners r 2.25 · 2 · 1.625), the line stays at 1.5 · 1.5 · 1.25; ink box unchanged. At 16 beside the set it is the one that says "line these up against this" in every member: the line names the axis, two boxes of different length say "objects", and the six stay apart in a toolbar row, where C relies on a 2-pixel shift of the short box (recommended) -->
