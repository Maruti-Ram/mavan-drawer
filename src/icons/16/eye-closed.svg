  <!-- Four lashes, centred (two at 16): What the eye sees: the familiar closed eye, four lashes, a long middle pair and a shorter pair toward the corners, each outer lash now standing clear of the lid's rising end; at 16 a closed lid with two lashes. THE LID: eye's lower half verbatim, tip to tip: arcs r9.6 · 7.75 · 6.968, corner rounds r1.5 · 1.25 · 1, ink x 2→22 · 2→18 · 1→15. LASHES, square to the lid (on its radius) and symmetric: inner pair at ±15.5° from upright, standing 3.25 · 2.75 · 2.625 out from the lid's outer edge, cap included; outer pair at ±46.5° · ±43° · none, 2.25 · 2 · none long (0.69 · 0.73 of the inner). OUTER LASH TO THE LID'S END (the corner round and tip ink; in the filled the lid's last stretch and end cap), the nearest the part of the lash standing proud of the lid comes, outline/filled, before → after: 24 3.17/1.96 → unchanged (it held); 20 1.54/1.08 → 2.01/1.54, the outer pair re-angled 46.5° → 43°; 16 1.08/0.32 → the outer pair removed. Why 16 loses it: at 16 filled (weight 2) the lashes' roots need 30.8° between neighbours for 1.5 of air, which puts the outer pair at 46.2° at the least, and the lid's end cap is at 63.7°; the two airs trade one for the other and sum to about 1.85 (outer at 36°: lid end 1.53, neighbour 0.35; at 46.5°: 0.32 and 1.53), so no angle or length gives both 1.5. Shortening only brings the lash's end nearer the lid; lengthening runs it past the eye's width. In real pixels at 16 the outer pair already merged into the lid's ends, so the four-lash drawing and this two-lash one render almost the same; the outer pair was the detail that could not hold the gap. Air between neighbouring lashes at the roots (lint's reading), outline/filled: 24 3.62/2.36, 20 2.19/1.57 (was 2.64/2.00 before the re-angle), 16 2.47/1.53 (the inner pair). PLACEMENT: centred as its own icon (C34: a second picture of a state, as unlock-swung and volume-off; in eye's place the lashes could stand only 2 long): box 20×11.53 · 16×9.12 · 14×7.9, centre 12,12.02 · 10,10.06 · 8,7.95; mass from the canvas centre (down +) outline +0.37 · +0.27 · +0.04, filled +0.19 · +0.19 · −0.09. FILLED: line-heavy at 2.5 · 2 · 2. The lid is one arc r9.25 · 7.53 · 6.778 whose end caps reach the outline's tip ink exactly (left and top) and whose bottom edge is the outline's, so the corner round goes into the cap; lashes on the same lines, rooted on that arc, ends pulled in so each cap's lowest point holds: filled == outline at every master. Off-grid decimals are eye's own, shifted up 5 · 3.75 · 3.375, and lash ends where the radius puts them. -->
