<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: recurring order, package, box, repeat, loop -->
  <!-- box: 13x13 -->
  <!-- Box on repeat: package with the same loop (Nucleo bag-refresh and cart-refresh: an order repeated, a delivery on a schedule). package's frame is calendar's (3.75 to 20.25), so the composite keeps calendar-repeat's box, 19×19 · 15×15 · 13×13, centre 0.5 toward the loop, no base note needed. Cut back 1.5 from the loop: right wall ends 10.5 at 24, removed at 20 and 16; bottom wall ends 11.25 · 8.25 · 5.625 (calendar-repeat's own); at 16 the chamfer goes as well (its end and the lid's end would sit 1.25 apart), so the top edge stops at 10.625 and the lid at 10.375. The label line is dropped at every master: at 20 it came 0.9 from the loop. Filled: both flaps whole at 24 and 20, the right flap cut to 11.25 at 16 to follow the outline; the body keeps a strip 3.25 tall over the head at 24, 2 tall at 20, and is a column only at 16. A cart was not used because its right wheel sits in the badge's corner. Adjacent meaning: reorder or recurring delivery more than payment; at 16 it loses its top-right corner and reads as calendar-repeat -->
  <path d="M10.625 2.625H5.375L2.625 5.375V11.875A1.5 1.5 0 0 0 4.125 13.375H5.625"/>
