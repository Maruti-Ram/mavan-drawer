  <!-- Head and shoulders: Head and shoulders (recommended): focus's four corners verbatim (maximize's: spread 18×18 · 14×14 · 12×12, radius 2.5 · 2 · 1.5, arms 6 · 4.75 · 4 of ink, in place, as scan, scan-face and barcode-scan keep them), with a head and shoulders inside: the base dropped, as user-circle drops it. 24: user-circle's figure exactly (user's head r 3.25 and dome r 7.25 moved down 3, head 8 of ink), the dome stopped where its ends hold 1.5 above the bottom corners, at (7, 17.25) and (17, 17.25), on the dome circle exactly (5² + 5.25² = 7.25²); shoulders 10 across on the centreline, rising 2. 20: user's 20 figure at 0.75: head 4.5 of ink (r 1.5, hole 1.5, the floor; user's 6 must sit with its bottom at 11.06 to hold 1.5 to the top corners' tips and leaves the shoulders no rise), dome r 3.75 (9 of ink, twice the head) on centre (10, 15.5), ends (7, 13.25) and (13, 13.25) exactly (a 3-4-5 triangle); shoulders 6 across, rising 1.5. 16: user's 16 figure at 0.5: head 2.5, a solid dot (r 0.625; a ring head needs 4 across for its 1.5 hole, and under it the shoulders rise 0.69 at most, a flat line; with id-card's gap 1 they rise 1, and in real pixels a ring over a flat arc reads as a face beside scan-face), dome r 1.875 (5 of ink, twice the head), a half circle on centre (8, 10.5), its top on a whole pixel. So the head is half the dome's width at every master (8/16 · 4.5/9 · 2.5/5), and head to shoulders is user's 1.5 · 1.5 · 1.5. Figure ink 11.5×13 · 7.5×9 · 5×7.13, 64 · 54 · 42% of the spread across: it shrinks faster than the masters because the corners leave 12 · 8 · 6.5 of room. Centred across, 0.5 · 0.5 · 0.44 above the centre; at 24 and 20 it cannot sit lower, the shoulders' ends are on the 1.5; at 16 (air 1.72) it stays put so the head top and the dome top keep on whole pixels. Air, outline: head to the top corners' tips 1.70 · 1.61 · 1.84, shoulders to the bottom corners 1.5 · 1.5 · 1.72, head to shoulders 1.5 · 1.5 · 1.5; inside the head 5 · 1.5 · solid. Filled: the figure goes solid and the corners stay lines at 1.5 · 1.5 · 1.25, as focus-filled and maximize-5-filled. The head is a disc r 4 · 2.25 · 1.25 (the outline's outer edge; at 24 user-filled's head); the shoulders are the dome's outer edge, r 8 · 4.5 · 2.5 (at 24 user-filled's body), closed by the end caps' round (0.75 · 0.75 · 0.625) and a flat base on the caps' bottoms (y 18 · 14 · 11.125): user-filled's body with its base raised to the outline's ink. Air, filled, the same as the outline: 1.70 · 1.61 · 1.84 to the top tips, 1.5 · 1.5 · 1.72 to the bottom corners, 1.5 · 1.5 · 1.5 head to shoulders. Ink box 18×18 · 14×14 · 12×12 in both styles, box-centred. Off-grid: in the filled twin, where each end cap meets the dome's outer edge: (6.48, 16.71) and (17.52, 16.71) at 24, (12, 22.5) + 8/7.25 × (∓5, −5.25) rounded to 2 dp, within 0.0005 of both circles; (6.4, 12.8) and (13.6, 12.8) at 20, exact. Who: Nucleo user-focus, a head ring over a shallow shoulder arc in four soft corners; it leaves 1 between head and shoulders and 1 from the shoulders to the bottom corners, held here at 1.5. Recommended: it is the viewfinder picture of a person, and at 24 it is the set's own head and shoulders: user-circle's head string for string, and its shoulders on the same circle, cropped shorter (ending at 7, 17.25 where user-circle's end at 5.75, 18.82). -->
