  <!-- Portrait panels: The same construction on the portrait keyline: ink 16x20 · 12x16 · 10x14, front panel 13x17 · 9x13 · 7x11, offset 3 up-left. This is the candidate that sits closest to files — it is files-3's exact back L and canvas with the fold taken off the front sheet — and it is on the board so the difference can be judged rather than assumed: at 16 it is two 7-wide portrait panels where files-3 is two 7-wide documents with a fold, which is one detail apart. White: outline 1.5 · 1.5 · 1.75, filled 1.5 · 1.5 · 1.5. At 16 the band is a uniform 1.5 instead of following the front's corner — the top arm ends at 7.875 and the front's corner centre is at 8.125, so there is no room for the wrapping arc; white opens to 2.74 across that corner only. -->
