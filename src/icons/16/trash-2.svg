<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: ribs, detached -->
  <!-- Detached lid (Nucleo / Central): The lid is its own bar with 1.5 of air under it and the body hangs below, which is how Nucleo and Central build it - and the only version whose FILLED state still has a lid, because A and B fill into one mass from tab to bottom. The cost is measured: the gap is 1.5 and the lid is 1.5, so a detached lid spends 3.0 of vertical budget that does not scale down. Body height goes 10.5 of 18 at 24 (58%, Nucleo's ratio exactly), 6.5 of 14 at 20 (46%) and 4.5 of 12 at 16 (37%) - and the r1 bottom corners eat 1 of that 4.5, so at 16 the rib has to shrink to a single 1.5 dot to keep 1.5 off the bottom stroke. The 16 rib you flagged was mine: it sat 0.25 off the bottom in the outline while the filled hole had 1.75 of material under it - the same defect lint caught. Both are centred on the tub now -->
  <!-- 16 master at stroke 1.25 (C7, 2026-09-20): centrelines on the eighth grid so every ink edge stays where the 1.5 line had it. Lid and tab are trash's; the 1.5 of air under the lid is kept, so the body top rises 0.5 (ink top 7.5); the dot keeps its 1.5 of ink (r 0.125 plus the stroke), centred on the tub at 10.125 -->
  <path d="M2.625 5.375H13.375"/>
  <path d="M5.625 5.375V3.625A1 1 0 0 1 6.625 2.625H9.375A1 1 0 0 1 10.375 3.625V5.375"/>
  <path d="M3.625 8.125L3.927 12.445A1 1 0 0 0 4.925 13.375H11.075A1 1 0 0 0 12.073 12.445L12.375 8.125"/>
  <path d="M7.875 10.125A0.125 0.125 0 1 0 8.125 10.125A0.125 0.125 0 1 0 7.875 10.125Z"/>
</svg>
