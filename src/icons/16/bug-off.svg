  <!-- Bar cut through: What the eye sees: the shorter bug struck by the bar in two long pieces — the head flowing into the right shoulder with its front leg, and the round lower half of the shell with two legs, no seam. Closest to cloud-off: two shell pieces, three legs, the bar. What changed from A2 / B2: (1) The head now runs straight into the shoulder: the bit of top wall that sat under the head (3 · 2 · 1.11 long in A2) is gone, so the head, the shoulder corner and the right wall are one line and the upper piece no longer has the middle prong that made it a "3". (2) The middle-right leg is gone at 24 too (A2 kept it at 24 only; at 20 and 16 the cut leaves it floating), so every master keeps the same three legs: front-right, middle-left, back-left. (3) The left wall no longer pokes up past the middle-left leg (A2 kept 1.5 · 1.75 · 1.11 of it as a T); the leg turns into the wall. (4) The seam is gone, and the bottom curve runs on past it to its own cut (2.88 · 2.09 · 1.84 past the seam's place, at 59° · 62° · 59°), so the lower half of the shell is one long curve, as cloud-off's lower piece is. Filled, the lower half is one solid with no slot, so the chip right of the slot that A2 had to drop is part of it. (5) At 16 the bar is centred exactly on the bug, as C21 asks: A2 sat it 0.25 low only to keep two walls past the shoulder, and with the head joined to the shoulder those walls are not needed. At 24 exact centring falls off the quarter grid (3.625), so the bar stays on the canvas diagonal, 0.125 below the bug's centre, and the whole icon is centred on the canvas. Cut ends facing the bar: 5 · 5 · 5 in A2, now 3 · 2 · 2. Pieces at every master, outline and filled alike: the upper piece (head and shoulder), the lower piece (the lower half of the shell as one long curve, no seam), three legs, the bar. Bug in its shipped place (C34); ink 20×18 · 16×15 · 14×13.5, centred 12,12 · 10,10 · 8,7.75, declared as a box at 24 and 20 as bug does. Bar (C21): \ at 45°, its ink the square keyline 18 · 14 · 12; centreline (3.75,3.75)-(20.25,20.25) · (3.75,3.75)-(16.25,16.25) · (2.625,2.375)-(13.375,13.125); it stands 0.25 above and 0.5 below the bug at 24, and sits 0.5 · 0.75 inside its top and bottom at 20 · 16. Cut: every stroke stops with 1.5 of air from the bar's edge, measured 1.51 · 1.51 · 1.50 at every cut end, no exceptions. The head is kept from 215° · 225° · 210° round to its right foot. The right wall runs on 3.75 below the front leg to its cut at 24; at 20 and 16 the cut would leave 1.26 · 0.36 below the leg, so the wall ends at the leg and turns into it. Lengths (24 · 20 · 16): upper piece 14.99 · 10.00 · 9.10, lower piece 13.12 · 9.51 · 8.01, legs front 5.66 · 4.24 · 4.24, middle 4 · 3 · 3, back 5.83 · 2.83 · 2.12; the shortest piece is the back-left leg at 16, the bug's own. Tightest air 1.51 · 1.51 · 1.50, bar to the cut ends; the front-right leg is the nearest leg to the bar, 4.16 · 2.39 · 1.76. Filled: a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side) knocked out, corners r0.75 · 0.75 · 0.625, white 1.51 · 1.51 · 1.50 each side, the bar whole through it at 1.5 · 1.5 · 1.25; the shell is two solids, the shoulder and the lower half, with no slot; the head cap stays whole, 1.5 above the body and 2.26 · 1.56 · 1.59 clear of the bar. Off-grid decimals are the cut ends, the channel's corners and the back legs' arc-derived roots, where the circles put them. At 16 in real pixels it is the calmest of the four: the lower half reads at once as the bug's round back with its legs; the head-and-shoulder piece still reads as a small wave with a tick, so it stays busier than cloud-off. It drops the seam that bug and bug-2 have; A3 keeps it. Lucide's bug-off cut with the seam left out, the lower piece built as cloud-off's is. (recommended) -->
