  <!-- Cloud-3, arrow out the bottom: Ink 20×20 · 16×16 · 14×14 (the circle keyline), filled identical, box-centred: no base note. The cloud is its shipped self moved up 3 · 2 · 2 to the top margin (ink top 2 · 2 · 1); no lobe radius or notch fillet changed. Open base, shared by cloud-download and cloud-upload: each end puff stops where it keeps exactly 1.5 of air from the up-arrow's head (the tighter of the two), so both files have the same cloud. Ends: the front puff stops at 111° · 132° · 123°, the right puff at 79° · 51° · 61° (ends at y 13.97 / 14.19 at 24). Overlap: the front puff's inner arc is cut back with 1.5 of air from the shaft — it runs 49° · 30° · 32° (3.4 · 1.7 · 1.45 long) against cloud-3's 52° · 52° · 46°; at 24 it is nearly whole, at 20 and 16 it is a short hook off the T, and the T is what still says "in front". Arrow: arrow-down's classic head unchanged (10 · 9 · 8 wide, legs 45°, bend 0.75 · 0.75 · 0.625; the shipped head's own tangent points), shaft x 12 · 10 · 8 from 11.75 · 9.75 · 7.875 to the tip on the box edge — 11 · 9 · 7.75 long, the held draft's arrow; same arrow on all three clouds and in cloud-upload, turned round. Filled: the cloud solid, outer edge on the outline's, flat base at 15 · 11.5 · 9 — raised 0 · 1.5 · 1 from cloud-3-filled's base — so it sits 1.56 above the leg ends, corners 0.75 · 0.75 · 0.625; a slot 4.5 · 4.5 · 4.25 wide cut up round the shaft, closed with a half circle, mouth corners 0.5 (export-filled's slot), 1.5 of air all round; arrow at the outline weight. The white band round the front puff stays at 24, stopping at −33° (1.5 of solid to the slot); at 20 and 16 it could only run 16–17° and read as a nick, so it goes and the crotch takes cloud's notch fillet (0.75 · 0.625). Tightest air: 1.5 at the open ends, 1.5 slot to shaft, 1.56 filled base to the leg ends. Off-grid values are tangent points and the shipped head's own decimals. Who: Material filter_drama's cloud, on cloud-3. -->
