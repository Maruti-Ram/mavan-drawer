<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- keyline: mark -->
  <!-- tags: exit fullscreen, shrink, brackets, corners, inward -->
  <!-- Soft corners, turned in: Pairs with maximize. Its four soft corners, each turned end for end inside its own box, so the bend points at the centre and the arms run out to the edge (Lucide's minimize, our radius). Every length is maximize's: radius 2.5 · 2 · 1.5, arms 6 · 4.75 · 4 of ink, straight run 2 · 1.25 · 1.25 past the bend, spread 18×18 · 14×14 · 12×12. Air between neighbouring bends 6 · 4.5 · 4, the same air maximize leaves between its tips, so nothing comes near anything at 16. The 16 centrelines sit on x.375 / x.625 so the outer edges stay on whole pixels. Filled: weight 2.5 · 2 · 2, ends pulled in 0.5 · 0.25 · 0.375, bend 2 · 1.75 · 1.125 around the same centre, so the curve facing the middle is the outline's (outer 3.25 · 2.75 · 2.125), as maximize-filled; ink box identical. Recommended: it is the twin of the default maximize, so the pair ships as one drawing turned around; it is the exit-fullscreen mark people already know; and it keeps the most air of the five at 16 (4) (recommended) -->
  <path d="M5.375 2.625V3.875A1.5 1.5 0 0 1 3.875 5.375H2.625"/>
  <path d="M10.625 2.625V3.875A1.5 1.5 0 0 0 12.125 5.375H13.375"/>
  <path d="M5.375 13.375V12.125A1.5 1.5 0 0 0 3.875 10.625H2.625"/>
  <path d="M10.625 13.375V12.125A1.5 1.5 0 0 1 12.125 10.625H13.375"/>
</svg>
