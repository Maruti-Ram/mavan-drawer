  <!-- T over text lines: A small serif T heads a paragraph: the family's T, shrunk to the width of text-2's short line, standing on two text-align rows, so it reads as "title above body". T 9 · 8 · 7 wide (crossbar ink exactly over the short line, 4.5→13.5 · 3.25→11.25 · 2→9) and 9.5 · 6.5 · 5 tall; serif drop 2.25 · 1.75 · 1.25 of centreline on a C10 bend of 0.75 · 0.75 · 0.625; foot 4 · 3.5 · 3 of ink (0.44 · 0.44 · 0.43 of the crossbar, text's is 0.39); serif to stem air 2.25 · 1.75 · 1.63. Lines: full 15 · 13.5 · 12 and short 9 · 8 · 7 of ink at text-align's pitch 4.5 · 4 · 3.5 (air 3 · 2.5 · 2.25). T foot to the first line 2 · 1.75 · 1.88. Filled: the lines go to 2.5 · 2 · 2 and thicken in place (C17), standing 0.5 · 0.25 · 0.375 proud at the bottom (grows), line air 2 · 2 · 1.5, T to line 1.5 at every master. The T keeps the outline weight (glyph: letter, C32): at the filled weight its serifs close onto the stem (0.75 of air at 24, 0.5 at 16). To keep that growth inside the mark the outline's bottom line stops 0.5 · 0.25 · 0.375 short of the floor of the mark, so the outline sits 0.25 · 0.125 · 0.19 above centre (ink 15×17.5 · 13.5×13.75 · 12×11.63; filled 15×18 · 13.5×14 · 12×12). The trade: at 16 the T is 7×5 pixels, legible but small; the outline's short line falls across two pixel rows (62% each); in the filled twin the title is lighter than its body, the opposite of what a title is. It also shares text-color's draft composition (a small serif T over something). -->
