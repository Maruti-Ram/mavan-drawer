  <!-- Card, arrow through the top: A closed card on the baseline with arrow-up breaking out through its top wall. Card 18×9 · 14×7 · 12×6 outer, corners 2.5 · 2 · 1.5; the top edge stops 1.5 clear of the shaft on each side (x 9 / 15 · 7 / 13 · 5.25 / 10.75), leaving 2.75 · 1.25 · 1.125 of straight top edge on each side of the notch. Arrow: arrow-up's classic head unchanged on upload's own placement, ink 14.75 · 10.75 · 8.88 long and 10 · 9 · 8 wide; head 3.56 · 2.06 · 1.56 clear of the card's top, tail 1.75 · 1.75 · 1.5 above the card's floor. Filled: card solid, slot 4.52 · 4.52 · 4.41 wide cut down the arrow and closed with a half circle on its end, air 1.51 · 1.51 · 1.56 all round; arrow at the outline weight. Against upload: upload's tray is open at the top and its arrow stands in the mouth; here the container is closed on four sides and the arrow has broken through it. Against upload-2: same difference, and upload-2's arrow does not cross anything at all. Said honestly, that difference is 1.125 of line at each end of the notch at 16 — this is the candidate most likely to be taken for upload, and it is on the board to find out whether it is. -->
