<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: storage, disk, hdd, platter, internal, disc -->
  <!-- Platter inside: Rhythm: the platter keeps 1.5 to the top and both walls, and the air below it splits evenly — platter to bar and bar to floor 2 · 2 · 2.125; the bar is as long as the platter is wide (10 · 6 · 4.5). Ink 16×20 · 12×16 · 10×14 (portrait keyline; a 3.5-inch drive is portrait), corners r2.5 · 2 · 1.5. Platter ring ⌀10 · 6 · 4.5 on the ink. The hub (⌀2, 2.5 of air in the ring) is drawn at 24 only: the hole is 3 at 20 and 2 at 16, and a ⌀2 or ⌀1.5 hub cannot keep 1.5 of air in it — dropped, not squeezed. Filled: body solid, platter a 1.5 white band round a solid core ⌀7 · 3 · 1.5 (radio's ring), hub a ⌀2 hole at 24, bar a 1.5 slot. Who: Material hard_disk. Ships as hard-drive-2 beside A. The only one that shows what is inside the drive, but it shares speaker's body (16×20, a ring and a mark): speaker's ring sits low, this one high, and at 16 without the hub the two are close. A read arm across the platter was tried and dropped: from the bottom-right corner it reads as search's magnifier, and with the hub there is no room for it to reach the disk with 1.5 of air. -->
