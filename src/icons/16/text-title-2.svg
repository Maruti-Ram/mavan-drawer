<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- keyline: mark -->
  <!-- tags: heading, h, title, serif, letter, type -->
  <!-- Serif H: A serif H, the T's sister: the heading convention (Lucide heading, Tabler heading, an editor's H1), drawn with the family T's own foot at the top and bottom of each stem, so T and H read as one alphabet. It fills the T's box exactly, 18×18 · 14×14 · 12×12 in both styles, centred, no notes. Feet 7 · 5.5 · 4.75 of ink (text's foot), stems 11 · 8.5 · 7.25 apart (centrelines 6.5/17.5 · 5.75/14.25 · 4.375/11.625), air between facing feet 4 · 3 · 2.5 in both styles; counters 9.5 · 7 · 6 wide (8.5 · 6.5 · 5.25 filled). Crossbar 0.25 · 0.25 · 0.375 above centre (11.75 · 9.75 · 7.625), the optical middle; at 16 its ink covers pixel row 7 and a quarter of row 8 (ink 7→8.25). Filled: line-heavy 2.5 · 2 · 2; the feet's outer ink and every cap hold (ends in 0.5 · 0.25 · 0.375), the crossbar keeps its top edge (11 · 9 · 7; centrelines 12.25 · 10 · 8), so at 16 it is exactly rows 7–8. No level numeral: a title has no level, and at 16 four feet with 1.5 between them need 11 of the 12 units, leaving no room for a numeral and its 1.5. Nothing shrinks at 16 — it is one letter at the full mark — and it is distinct from every shipped icon (no H in the set). Beside bold and italic (12 · 10 · 8 wide) and underline (15 · 12 · 10) it is as wide as text's T. (recommended) -->
  <path d="M2.625 2.625H6.125M4.375 2.625V13.375M2.625 13.375H6.125"/>
  <path d="M9.875 2.625H13.375M11.625 2.625V13.375M9.875 13.375H13.375"/>
  <path d="M4.375 7.625H11.625"/>
</svg>
