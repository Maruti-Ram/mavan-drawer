  <!-- optical: 1 0 -->
  <!-- 35 mm canister, sprocketed strip: Rhythm: the film coming out of the canister is a strip with film's own sprocket band along its top: two holes 3.25 x 2.5 · 2.25 x 1.5 · 2.25 x 2 of air, one rung between them (1.5 · 1.5 · 1.25), band air equal to the picture air below it (2.5 / 2.5 · 1.5 / 1.5 · 2 / 1.75), so the strip reads as two even rows. Hole sizes are film's (3-3.25 x 2.5 at 24, 2-2.25 x 1.5 at 20); at 16 they grow to 2.25 x 2 so each hole is two whole white pixel rows (film's 1.5 renders grey there). Canister and knob are A's: canister 8.5 · 6.5 · 5 of ink wide, corners r2 · 1.25 · 1, solid knob 3 · 3 · 2.5 wide rising 1.75 · 1.5 · 1.25; the strip is centred on the canister body (24 and 20 lifted 0.5 · 0.25 to offset the knob), corners r1.5 · 1.25 · 1 as A's leader, and runs to the right margin. No tongue, so no flag: the strip ends square with rounded corners, as Material camera_roll and IconOven film-roll draw it. Balance: moved right a whole unit at every master (optical 1 0), which keeps the 16 outer edges whole; ink mass then sits +0.42 · +0.43 · +0.57 (outline) and -0.63 · -0.18 · +0.15 (filled) from the centre across and +0.16 · +0.28 · +0.26 / +0.60 · +0.51 · +0.53 down, the two styles straddling the centre (their mean -0.1 · +0.13 · +0.36 across). Ink 18x18 · 14x14 · 12x12, square keyline. Filled: canister, knob and strip one solid, the two sprocket holes punched white (the outline's own air, clear white 2-pixel rows at 16); ink 114 -> 207 · 86 -> 128 · 65 -> 96, the same picture. (recommended) The sprocket holes are the cue film, film-reel and video-2 already teach; with them the canister cannot read as a battery. -->
