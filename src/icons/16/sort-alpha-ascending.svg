  <!-- arrow — the chevron head on a full-height stem: The family’s own reading: the mark points, and it is the same head sort-3 uses so the two icons share a chevron. The stem runs the characters’ full height, which is what shipped sort-ascending does with its arrow. (recommended) The characters are Maruti’s locked letterforms re-solved for this box; at 16 they are the locked drawings untouched. A over Z, stacked with 1.5 of air, fills the family box exactly. -->
