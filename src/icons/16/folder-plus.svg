rown cut by the straight line tangent to both, which crosses the gap between them at their near point: 0.25 · 0.35 · 0.31 long at the bottom, 1.95 · 0.25 · 0.68 at the right side (there the cap stands 0.58 clear of the cut at 24 and 0.08 at 16). The plus stays a line at 1.5 · 1.5 · 1.25. Tightest air, filled: 1.5 at every master. Off-grid decimals are the folder's own (its corner tangent points) and, in the filled twin, the cut's tangent points: both ends of each joining line, on the cap and on the grown circle, and the armpit round's at 20 and 16, rounded to 2 · 2 · 3 dp with each end on the grown circle kept on or just outside it so the air holds 1.5 -->
