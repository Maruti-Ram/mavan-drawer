  <!-- Corner axis: (recommended) chart-bar-3's L verbatim - left and bottom in one line, corner 1.5 · 1.25 · 1, filled 1.25 · 1 · 1 (C10) - with the line floating inside it. The axis is what says chart: trending-up (zigzag + arrowhead) and activity (pulse) carry none, so the bare zigzag stays free for them, and chart-line sits beside chart-bar-3 as one family. Lucide and Nucleo draw this structure. Line up, down, up on 45 degrees, runs 2.5/4/6 · 2/3/4 · 1.5/2.5/3.25; C10 bends at half the weight (0.75 · 0.75 · 0.625, filled 1.25 · 1 · 1), so the tangent points sit r/1.414 off each corner - off the grid by construction, rounded to 2 · 2 · 3 dp, as in presentation-2. The dip falls below the start (Lucide's rhythm) rather than presentation-2's: at 16 the axis leaves 7.25 of run, and presentation-2's rhythm at the same height leaves only 0.83 of clear edge between the two rising strokes in the filled twin (1.54 here), so the filled 16 clotted into a knot. Line ink 14x7.19 · 10.5x5.19 · 8.5x4.24, ending flush with the floor's end, centred top to bottom between the box top and the floor; at 16 it is presentation-2's line size (8.5 wide). Air line to upright 2.5 · 2 · 2.25, filled 1.5 · 1.5 · 1.5 - the line starts where the thickened filled axis still leaves 1.5, as chart-bar-3's bars do; line to floor 4.56 · 3.56 · 3.26, filled 3.27 · 2.91 · 2.29. Ink box 18x18 · 14x14 · 12x12 (square keyline), filled identical. Filled: line-heavy, everything at 2.5 · 2 · 2, the axis is chart-bar-3-filled, the line's ends pulled in 0.5 · 0.25 · 0.375 on both axes -->
  <path d="M2.625 2.625V12.375A1 1 0 0 0 3.625 13.375H13.375"/>
