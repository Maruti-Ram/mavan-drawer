  <!-- Piano keys: Rhythm and balance: three white keys of equal width 4 · 2.75/2.5/2.75 · 2.375/2.25/2.375 (whole widths are not on the grid at 20 and 16) between dividers at the outline weight, under two solid black keys 3 · 3 · 2.5 wide and 10.5 · 8.25 · 7 long, about 60% of the inside height. Each black key is one closed path no wider than the line, so it reads solid (a key, like calculator's tall key). That gives 2× · 2× · 2× the divider's width, which is what makes them read as black keys and not as more lines at 16. Air between the black keys 2.5 · 1.5 · 1.5; black key to the frame 3.25 · 1.75 · 1.5. At 20 and 16 the black keys sit 0.25 outward from their dividers, as a real piano's do (C sharp leans left, D sharp right), so the white keys can stay equal. Container: the square keyline 18 · 14 · 12, corner r 2.5 · 2 · 1.5, keyboard's container radius. Box-centred; symmetric, so no shift. Filled: keyboard-filled's build, a solid square with the keys cut out as white (key slots 3 · 3 · 2.5, divider cuts 1.5 at every master, C22); the material between the two key slots is 2.5 · 1.5 · 1.5. The cost: the filled twin shows the black keys as white, so it reads as inverted, and at 16 its two white slots come close to a pause in a box. Who draws it: SF Symbols pianokeys, Material piano (solid black keys, frame, dividers: our outline), Phosphor PianoKeys (fill: knockout). Not a row on the sheet; keyboard is the computer keyboard. -->
