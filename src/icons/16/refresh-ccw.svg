  <!-- Mirror of refresh: Refresh mirrored left to right, as rotate-cw mirrors rotate-ccw: x → 24 − x · 20 − x · 16 − x, each arc's sweep flipped, radii kept, by script on refresh and refresh-filled at all three masters. Which way it turns: refresh's heads sit top-right and bottom-left and point down the right side and up the left, clockwise. Here they sit top-left and bottom-right and point down the left side and up the right, anticlockwise; the top-left head and its 45° run are rotate-ccw's at 24 to the hundredth (at 20 and 16 refresh's head sits 0.25 further out than rotate's, as it does beside rotate-cw). It cannot read as refresh turned round: a turn never changes the direction, and the only turn that brings refresh's heads to this diagonal, a quarter turn, moves its tails to 12 and 6 o'clock — that drawing is refresh-3, exactly so at 16. Here the two tails still start level at 3 and 9 o'clock, as refresh's do (Lucide's refresh-ccw has its heads in the same two corners). What carries over: a mirror moves no point nearer another, so every length, radius and air is refresh's — legs 5 · 4.25 · 4, ring r 8.13 · 5.83 · 4.773, bend 0.75 · 0.75 · 0.625 — and because refresh is the same under a half turn, every mirrored coordinate is one refresh already uses: the quarter grid at 24 and 20; at 16 the eighth grid, the heads' centrelines on 2.625 · 6.625 · 9.375 · 13.375, and the off-grid ring points refresh's own. Ink box 18×18 at 3,3 · 14×14 at 3,3 · 12×12 at 2,2, centred, filled identical; no optical shift, as refresh (none of its notes depends on direction). Rasterised at 24, 20 and 16 its pixels are refresh's mirrored, outline and filled, no pixel more than 1/255 apart. Head air (C37): outline 2.04 · 1.5 · 1.58; filled 0.83 · 0.9 · 0.65, refresh-filled's own numbers, under C37's 1, so lint warns here as it does on refresh-filled, which plans/lint-head-air.md lists for redrawing with rotate-cw and rotate-ccw. Kept as refresh's so the pair stays one drawing; opening it is the family's filled-head redraw, not this icon's. Filled as refresh-filled: weight 2.5 · 2 · 2, ends pulled in 0.5 · 0.25 · 0.375. refresh-2 and refresh-3 mirror the same way if refresh-ccw-2 and -3 are wanted later (not drawn). (recommended) -->
