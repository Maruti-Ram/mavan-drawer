<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: app, application, browser, tabs, web, website, menu bar -->
  <!-- Tabs: The browser window by its tabs: B's frame and title bar, with two short ticks from the top wall down to the bar that split off two small tab cells at the left. Lucide app-window draws exactly this; Tabler browser has one tick, and Central browser-tabs and Material tab show the same tab strip. Bar as B (line at y 8.75 · 8.25 · 6.625). Ticks at x 6.75 / 10.75 · 6.25 / 9.75 · 4.625 / 7.625, each one a T-join at the top wall and at the bar. Rhythm: the cells are as wide as the bar is tall, square at every master, 2.5 · 2 · 1.75. Ticks on a pitch of 4 · 3.5 · 3, so cell, tick, cell, tick repeat evenly. The first cell starts at the inside of the left wall, and its outer corner is the frame's own inner corner. Tightest air at 16 is 1.75, each cell. A version with the bar running only right of a single open tab (Material tab) was tried and dropped: at 16 its open tab reads as folder, a box with its tab raised at the top left. Against layout-header at 16: the frame is 14x10, and the header carries two cells, which no layout icon has. Against credit-card: the two cells are in the bar, not low down. Against the popup board: nothing in common. Filled: B's solid title bar with the two cells left white (2.5 · 2 · 1.75 square, the outer corner concentric with the frame, the other corners eased 0.5), so the tabs survive in solid. The ink between cells is the tick, 1.5 · 1.5 · 1.25. The body stays a line at 1.5 · 1.5 · 1.25. Risk: the cells are 1.75 squares at 16, the smallest detail on either board. They read as tabs only beside a bar. -->
  <path d="M3.125 3.625H12.875A1.5 1.5 0 0 1 14.375 5.125V10.875A1.5 1.5 0 0 1 12.875 12.375H3.125A1.5 1.5 0 0 1 1.625 10.875V5.125A1.5 1.5 0 0 1 3.125 3.625Z"/>
  <path d="M1.625 6.625H14.375"/>
  <path d="M4.625 3.625V6.625"/>
  <path d="M7.625 3.625V6.625"/>
</svg>
