<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: classic -->
  <!-- Equator and meridian: The circle from the shipped family (r 9.25 · 7.25 · 6.25, the same one clock, x-circle and plus-circle use), one meridian ellipse through the poles (rx 3.75 · 3 · 2.5, ratio 0.40 — Nucleo's exact proportion at 20) and a straight equator whose caps land flush on the circle's outer edge. Three paths, the fewest that still read as a sphere, and the only one of the three with nothing to lose at 16 (recommended) -->
  <path d="M1.75 8A6.25 6.25 0 1 0 14.25 8A6.25 6.25 0 1 0 1.75 8Z"/>
  <path d="M8 1.75A2.5 6.25 0 1 0 8 14.25A2.5 6.25 0 1 0 8 1.75Z"/>
  <path d="M1.75 8L14.25 8"/>
</svg>
