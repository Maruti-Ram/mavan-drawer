  <!-- Grip: One fist closed over the other hand, forearms meeting below: the arm-wrestle or solidarity grip (Nucleo handshake-2). The drawing sits in a frame turned 45°. The fist is three whole finger capsules, staggered as Nucleo staggers them, at pitch 3 · 3 · 2.75 so every counter is 1.5. The gripped hand shows two knuckles (r 1.5 · 1.5 · 1.375) down its far side. Its last knuckle rounds into the hand's side, which narrows into its forearm. At 24 the fist's forearm has both edges. At 20 and 16 it keeps only its lower edge (Nucleo draws its forearms with single edges too), because the upper edge cannot keep 1.5 of air from the little finger and still be long enough to read. Tightest air 1.50 at every master. The turned frame puts the box off the quarter grid: agreed box 19.54×18.91 · 15.72×15.9 · 13.938×13.85, centred. Filled: the three fingers are solid and parted by 1.5 white lines. The outer two keep the outline's ink edge; the middle one narrows to 2 · 2 · 1.5. The gripped hand and the forearms are one shape behind, cut back 1.5 from the fist; at 20 and 16 the fist's forearm edge stays a line. It is an honest handshake picture, but it says team or solidarity. It is the weakest of the five at 16: the outline's fingers knot together at 1×. It would ship as handshake-2 or grip. -->
