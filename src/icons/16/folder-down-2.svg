  <!-- Corner badge: Polaris FolderDown's picture, file-down's B (locked as file-down-2): the shipped folder in place with the kit's down arrow (v3-kit-arrow.md, verbatim — the same strings as file-down-2) as a C33 badge on its bottom-right corner, ink corner on the margin edge (22 · 18 · 15). arrow-down's classic head at badge size: legs 45°, C10 bend 0.75 · 0.75 · 0.625 reaching the shaft's end, half-width 2.5 · 2.5 · 2.25 — C37's floor, leg cap to shaft 1 · 1 · 1 in both styles (the badge stays at the outline weight). Badge ink 6.5×9.5 · 6.5×8 · 5.75×7.125; shaft at x 18.75 · 14.75 · 12.125, 0.5 · 0.5 · 0.25 inside the folder's right-wall line. Cut back by hand with 1.5 of air from the arrow's ink, as folder-plus cuts for its plus (each line stops on the last quarter or eighth that holds 1.5, in its round cap). Right wall: at 24 it stops at y 11.5, 3.25 past its top corner, air 1.55 to the shaft's top; at 20 and 16 the last end that holds is y 9 · 6.875, only 1.25 · 0.75 past the corner, so the wall goes and the folder ends at its top-right corner (air 2.4 · 2.02). The bottom-right corner goes; the bottom wall stops at x 13.25 · 9.25 · 7.25, 8 · 4.5 · 4.125 past its corner, air 1.73 · 1.73 · 1.56 to the left leg. Tab untouched. Box 20×19 · 16×15 · 14×13 (declared, as folder-plus): the folder's box plus the 1 the arrow stands below it; centre 12,12.5 · 10,10.5 · 8,8.5, 0.5 low at every master — not more than 0.5, so no base note (as folder-plus, map-pinned, calendar-repeat). Filled: folder-filled's solid cut along the arrow's ink grown 1.5 (2.25 · 2.25 · 2.125 from its centreline): the band edge at x 16.5 · 12.5 · 10 with its 0.5 corner onto the left leg's grown end, as file-down-2's. Where the cut would leave a strip thinner than a line along an outer edge (1 beside the band, right of the arrow) the solid stops where the outline stops, on the outline's own round ends (r 0.75 · 0.75 · 0.625), as folder-plus: right side at y 11.5 at 24 and at the corner's end at 20 and 16 (at 16 folder-filled's own corner ends at y 6.25, so its round end sits 0.125 below the outline's cap at y 6.125); bottom at x 13.25 · 9.25 · 7.25. From each round end the edge runs on the common tangent into the grown arrow, with no corner: on the right a 0.53 diagonal at 24, a flat ceiling at y 8.5 at 20 (the shaft's grown top exactly), a 1.6 slope at 16; at the bottom a straight drop at x 14 · 10 (the leg's grown end and the round end share it) and a 0.55 slope at 16. Tightest air: outline 1.55 · 1.73 · 1.56 (24 the wall's end to the shaft's top; 20 and 16 the bottom wall to the left leg); filled 1.5 · 1.5 · 1.5 at the shaft band and its grown top, 1.5 · 1.5 · 1.502 at the leg; head air 1 · 1 · 1. Off-grid decimals: the folder's tab-corner tangent points (its own), the head's leg ends and bend tangent points (arrow-down's construction), and in the filled twin the cut's tangent points, worked at 0.005 · 0.005 · 0.002 more than the grown radius so the 2 and 3 dp values keep 1.5, and file-down-2's 0.5 corner. What it costs: at 20 and 16 the folder has no right wall at all; its side stands open 5.81 · 5.01 between the corner's round end and the arrow's right leg, where folder-plus keeps 3 · 2.375 of wall. folder-up mirrors this cut (v3-kit-arrow.md: right wall to y 11 at 24, gone at 20 and 16). -->
