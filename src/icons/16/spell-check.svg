  <!-- A + tick: (recommended) A full A top-left and a tick bottom-right, as Lucide's spell-check, Nucleo's spell-check and Tabler's text-spellcheck pair them; the two interlock on the diagonal and together fill the mark box, 18×18 · 14×14 · 12×12, centred. Balance: the letter carries about twice the tick's ink, so the A is held to a square (w = h) and the tick kept long and low — mass sits 0.84 · 0.67 · 0.76 left of centre in outline (0.17 · 0.39 · 0.29 filled) and within 0.2 vertically in outline (0.81 · 0.33 · 0.33 low filled); the remaining left lean is the letter's, and only an optical shift would take it out. Rhythm: the tick is the same share of the box at every master — ink 10.41×7.25 · 8.28×5.75 · 6.84×4.75 (58% × 40% each time); air from A to tick 2.21 · 1.86 · 2.03 outline, 1.71 · 1.50 · 1.52 filled, the 1.5 floor held at every master in both styles. A: the set's A, both legs to the baseline (drawn apex arc r 0.75 · 0.75 · 0.625, bar on the leg centrelines a third of the way up), legs 24.5° · 23.7° · 23.3° off vertical; ink 12.5×12.5 · 9.5×9.5 · 7.25×7.25 (at 16 the A is relatively smaller, 60% of the box against 69%, because 1.5 of air is a larger share of 12). Tick: the classic 45° tick, short leg 0.42 of the long (check's own), vertex r 0.75 · 0.75 · 0.625. Filled: tick at 2.5 · 2 · 2 (bend 1.25 · 1 · 1), ends pulled in, its right and bottom edges kept; the A keeps the outline weight (glyph: letter, C32). Tightest at 16: the tick's short leg to the A's right foot, 2.03 (1.52 filled). Why recommended: the most used spell-check picture; at 16 it reads as letter + tick; and it is neither a checklist (D) nor a text-formatting control (B). Off-grid values: the apex and tick tangent points and the tick's short-leg end fall out of the leg angles. -->
