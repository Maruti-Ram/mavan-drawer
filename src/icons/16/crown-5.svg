  <!-- Imperial, on a band: What the eye sees: C’s imperial crown — two arches meeting in a cleft, the rib down the middle, a cross on top — set on crown-2’s band and given pointed shoulders, in a box one keyline taller than crown-2’s. Construction: Phosphor crown-cross (two arches, rib, cross), the arches springing from points on the circlet as heraldic imperial crowns draw them (Game-icons imperial-crown); band and base are crown-2’s. Box 20×20 · 16×16 · 14×14, the circle keyline’s height: the cross reaches the top margin edge and the band the bottom one. In crown-2’s 20×18 box the cross, its 1.5 of air and the band leave the body 5.75 tall at 16 and the arches flatten into a lid (C3 shows it). Band: crown-2’s line, 13.5 · 10.5 · 9 of ink, 1.5 of air to the base. Base: crown-2’s, 13.5 · 10.5 · 9 wide, corners 1.5 · 1.25 · 1; walls lean 20 · 25 · 25° (crown-2 15 · 19 · 21°) up to C10 shoulders (0.75 · 0.75 · 0.625) on the box’s side edges at y 10.75 · 9.5 · 7.25, which run 2.75 · 2.38 · 2.03 straight in to the arches — the corner the eye reads as the crown’s side points. Arches: lobes r 4.75 · 3.5 · 3, centres ±3.75 · ±3 · ±2.75 on y 11.75 · 10.5 · 8.125, meeting in a C10 cleft 1.48 · 1.24 · 1.26 deep. Cross: stem from the top to the base (the rib), bar at y 4.25 · 4.25 · 2.625 (one edge on a whole pixel), 4 · 3.5 · 3 of ink wide; the lobe heights are solved, the lowest grid y that keeps 1.5 from the bar’s ends; 2.73 · 2.49 · 2.51 of stem shows between bar and cleft. Body ink 20×12.75 · 16×8.75 · 14×7.75, wider than tall. Tightest air: band to base 1.5 (crown-2’s), bar end to arch 1.66 · 1.56 · 1.56. Off-grid decimals: the wall and shoulder tangent points, the cleft’s touch points, the slit’s corners, and crown-2’s base-corner x (6.43 · 5.68 · 4.215). Filled: the stroke’s outer edge, cleft sharp, band a line at the outline weight; at 24 and 20 the rib is a 1.5 white slit from the cleft to the base stroke’s inner edge, the stem’s round cap plugging its top (a 1.5 stem in a 1.5 slit); at 16 the slit goes — a 1.25 stem leaves 0.125 each side, and a closed slot under the cleft read as a keyhole — so the 16 twin is solid with its 1.26 cleft. Read at 16 in real pixels: a royal crown on its band, shoulders and cross clear, a crown before an orb or a bell; the rib makes the middle busy, and the solid 16 twin loses the split its 24 twin shows. -->
