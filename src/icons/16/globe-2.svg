<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: tilted -->
  <!-- Tilted: Nucleo's construction: the equator drawn as a horizontal ellipse (ry 3.75 · 3 · 2.5) rather than a straight line, so the sphere reads as seen slightly from above rather than edge-on. Symmetrical with the meridian, which is either the point or the problem — it can read as a ring around a ball rather than a line on it. FILLED: both bands reach the rim, so the cut severs the disc at four points and the face breaks into nine pieces — four corners, four arms and a centre lens -->
  <!-- 16 master at stroke 1.25 (C7, 2026-09-20): centrelines on the eighth grid so every ink edge stays where the 1.5 line had it. Both ellipses follow the ring out to 6.375; their 2.5 half-width stays -->
