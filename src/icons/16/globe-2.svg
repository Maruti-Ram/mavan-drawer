  <path d="M8 1.625A2.5 6.375 0 1 0 8 14.375A2.5 6.375 0 1 0 8 1.625Z"/>
  <path d="M8 5.5A6.375 2.5 0 1 0 8 10.5A6.375 2.5 0 1 0 8 5.5Z"/>
