  <!-- ⇪ on a key cap, polished: control-key's caret over a bar: Rhythm and balance: control-key's caret, verbatim (45° legs, the bend at 0.75 · 0.75 · 0.625, caret 10×5.44 · 8×4.44 · 6.5×3.62), with a bar under it as wide as the caret (10 · 8 · 6.5 of ink) at 1.5 · 1.5 · 1.25. The air is even all round. At 24: sides 2.5, top 2.78, caret to bar 2.78, bottom 2.5. At 20: sides 1.5, top 1.78, caret to bar 1.78, bottom 1.5. At 16: sides 1.5, top 1.57, caret to bar 1.56, bottom 1.5. Legend 10×9.72 · 8×7.72 · 6.5×6.43 = 0.56 · 0.57 · 0.54 of the cap, centred at 12.14 · 10.14 · 8.04. The caret is raised 1.63 · 1.2 · 1.13 from control-key's place, because that place leaves no room for the bar at 20 and 16 (3.58 · 3.19 below it, where 4.5 · 4.25 is needed). The bar's bottom edge is on a whole pixel at 24 and 20 and its top edge at 16, so the bar reads as a crisp line. Filled: the solid cap. The caret is cut white exactly as control-key's filled cut (at 16 its ends pulled in 0.125 so the white keeps the outline caret's sides and foot). The bar is cut white 1.5 wide at every master (C22), its ends on the caret's white sides and its corners round at 0.75. Material between the two cuts: 2.8 · 1.8 · 1.45 (floor 1.5 · 1.5 · 1.25). Material from the bar to the cap's outer edge: 4 · 3 · 2.63. Who: Material keyboard_capslock_badge. Agrees with control-key: the same caret, size and construction, outline and filled, so the two keys read as a set. (recommended) It is B with the caret made control-key's and the air evened out, and the filled twin holds at 16 (1.45 of material where the floor is 1.25). -->
