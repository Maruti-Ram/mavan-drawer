  <!-- Square with face-smile's face, corner peeled: Rhythm and balance: K1's square with face-smile's face centred on it and a smaller peel (flap tip 6.5 · 4.5 · 4 in from the corner, 39 · 36 · 37% of the side), so the face keeps its place. The smile runs under the curl and ends on the curl's line (Nucleo sticker-smile's construction), sweeping 95 · 100 · 101°. 24 carries face-smile's 24 face verbatim (eyes 1.5 long at ±2.25, smile r5). The square is smaller than face-smile's ring, so the body forces a smaller face at 20 and 16, to keep 1.5 from the walls: 20 has face-smile's 20 eyes (±1.75, 1.25 long) with the smile r3.5 (was 3.75) ending 22° below level (was 15°); 16 has the eyes on face-smile's x (±1.625) but 1.0 long (was 1.25) and the smile r2.5 (was 3.375) ending 30° below level, the most a 12 square holds with 1.5 between eye and smile end in both styles. Air: eyes to top wall 3.75 · 1.5 · 1.5; smile to walls 1.64 · 1.5 · 1.5; right eye to curl 2.09 · 2.46 · 1.92; inside the curl 2.76 · 1.85 · 1.74. Filled: solid, eyes and smile cut 2 · 1.75 · 1.5 wide (face-smile's cuts; 1.5 at 16, the white floor), curl a white lens; the smile cut has to stop 1.5 short of the lens, so it sweeps 75 · 70 · 54°, shorter than the outline's. Decimals: bend tangent points, the smile's end where it meets the curl, the cut edges. The sticker buttons of WhatsApp, Discord, Instagram and Messenger (from memory). Look-alikes at 16: face-smile (round, no curl), checkbox. -->
