  <!-- Box, arrow in through the top: The import of Lucide, Nucleo, Heroicons (arrow-down-on-square) and SF Symbols (square.and.arrow.down). Box: the landscape keyline at every master, 20×16 · 16×12 · 14×10, corners 2.5 · 2 · 1.5 (download's); the lid stops 1.5 clear of the shaft (export's notch rule), running 3.75 · 2.25 · 2.125 straight past its corner. Arrow: download's head and shaft as shipped, moved up or down only (the off-grid decimals are its tangent points), centred between lid and floor so the air is even all round: head to lid 3.81 · 2.06 · 1.56, tip to floor 3.75 · 2 · 1.5, head to walls 3.5 · 2 · 1.75, shaft to lid 1.5. The shaft stands 3 · 2.5 · 2 above the lid, a fifth of the box height at every master. Ink 20×19 · 16×14.5 · 14×12 (agreed box). Balance: the box carries the weight, so the mass sat 1.19 · 1.08 · 0.92 below centre (filled 1.45 · 1.18 · 0.97); moved up 0.5 at every master (half the offset, as C15 corrects), now 0.69 · 0.58 · 0.42 (filled 0.95 · 0.68 · 0.47). Filled: the box solid, the arrow knocked out of it 1.5 wide (SF's .fill and Heroicons solid draw it this way); above the lid the shaft stays ink and runs into a band of solid as thick as the outline's lid. Not export's construction: export's card (18×9 · 14×7 · 12×6) cannot hold a head, which needs 13.5 of width at 16; it shares export's notch rule, corners and stroke. Against download at 16: a closed box with shoulders and a short tail, against an open tray under a long arrow; against inbox: an arrow, no scoop (recommended) -->
