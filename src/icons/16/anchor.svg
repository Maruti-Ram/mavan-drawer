  <!-- tags: ring, arrowheads, flukes, crown -->
  <!-- Classic arrowheads: What you see: the textbook anchor: ring, stock, a round bowl whose arms end in small solid arrowheads pointing up, and the crown (the shank showing 1 below the bowl) at 24 and 20. BALANCE: round 1's arrowhead candidate (C) stopped its bowl at 45° and pointed the heads up and out; here the bowl is a full half circle and the heads point straight up from the arm tips, so the weight sits evenly on both sides of the stem. Ink 19.5×20 · 16×16 · 13.5×14 (circle keyline); ring 26 · 28 · 30% of the width (round 1 C: 30 · 31 · 29%); 26 · 27 · 26% of the ink above the stock (round 1 C: 30 · 29 · 28%); stock 7 · 5 · 4 long in ink, 1.4 · 1.1 · 1× the ring (round 1: 1×). The stock sits level with the arrowhead tips (its centreline on y 10.5, the tips' ink top 10.5 at 24), so stock and flukes read as one waistline. Mass centre 0.99 · 0.61 · 1.09 below the canvas centre (filled 0.73 · 0.47 · 0.91): the nearest to centre of the five at 24. DEFINITION: centred like the rest of the set, so at 16 the stem still renders as two columns at 62.5% and the ring's hole is at best 68% white; the stock is on y 10.5 · 8.75 · 7.375 so it fills one row; the arrowheads are 4.25 wide in ink at 16 (half-width 1.5; at 1.25 they rendered as blobs in the pixel test). REFINEMENT: each arrowhead is a solid right-angled triangle on 45° sides, half-width 1.75 · 1.5 · 1.5, stroked closed so it fills (its inner circle 0.72 · 0.62 · 0.62 is under half the weight); corners are the round join (outer radius half the weight) because a C10 arc does not fit a leg this short. Each arm meets its arrowhead's base square, in the middle, so both notches are 90° and there is no wedge. Bowl r 7.25 · 5.75 · 4.625. No crown at 16: with it the arrowheads would come within 0.98 of the stock. Tightest air 2.22 · 1.5 · 1.67 (stock to arrowhead at 24 and 16, ring to stock at 20). Filled: the ring closes to a ball ⌀5 · 4.5 · 4; stem, stock, bowl and arrowheads stay at 1.5 · 1.5 · 1.25. -->
