<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: taper, flat foot -->
  <!-- glyph: dot -->
  <!-- Wedge + dash mid: alert-circle-2's graded bar over G's foot: 2.5 · 2 · 2 of ink at the shoulder narrowing to a 1.5 tip, then a 3.5 · 3 · 3 horizontal under it. Both halves are already settled — the wedge was approved as alert-circle-2, the width is G — so nothing new is being decided, only combined. The dash takes §6's 1.5 gap (a dash is not two-arcs-closed, so C19 does not reach it), which at 24 buys the bar 0.5 more length than the dot version: apex 13.95 against the wedge's 13.44. At 20 and 16 the two land on the same apex, 10.71 and 7.94 — the dot's 1.0 gap over a 2.0 dot and the dash's 1.5 gap over a 1.5 foot come to the same number -->
  <path d="M1.75 8A6.25 6.25 0 1 0 14.25 8A6.25 6.25 0 1 0 1.75 8Z"/>
  <path d="M7.75 5H8.25L8 7.94Z"/>
  <path d="M7.25 11h1.5"/>
</svg>
