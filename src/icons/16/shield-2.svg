  <!-- Crowned top: A's body with the top edge bowed up instead of flat: a crown arc of radius 20 · 14.5 · 11.25 carrying the edge 0.75 · 0.5 · 0.5 above the shoulder, tangent into the shoulder round so there is still no corner. Ink 16x20 · 12x16 · 10x14 — the portrait keyline, the box lock, user and flag already use. Shoulders 2.5 · 2 · 1.5; sides straight down to 52% · 56% · 57% of the height, then the bottom. Tip round 0.75 · 0.75 · 0.625 (C10's minimum at each master, map-pin's tip). Every join is tangent, so nothing in the drawing is a sharp corner. It answers the top-edge question on its own: the crown adds a little life and stops the shield reading as a box with a point, at the cost of 0.75 · 0.5 · 0.5 of the shoulders' height. At 16 the rise is 0.5 — half a pixel — and in real pixels it does not survive: E and A are the same drawing at 16. So this is a decision about 24 and 20 only. Filled: the same silhouette solid, one path whose outer edge is the outline's outer edge exactly — every convex arc grows by half the stroke, so the ink box is identical to 0.01. -->
  <path d="M8 1.625A11.25 11.25 0 0 1 11.317 2.125A1.5 1.5 0 0 1 12.375 3.559L12.375 8.947A5.5 5.5 0 0 1 8.935 14.046L8.234 14.329A0.625 0.625 0 0 1 8 14.375A0.625 0.625 0 0 1 7.766 14.329L7.065 14.046A5.5 5.5 0 0 1 3.625 8.947L3.625 3.559A1.5 1.5 0 0 1 4.683 2.125A11.25 11.25 0 0 1 8 1.625Z"/>
