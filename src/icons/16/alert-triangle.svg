  <!-- Raised, soft corners: A near-equilateral sign with softly rounded corners, standing half a unit high in the canvas: the rounded point touches the top margin the way alert-circle does, the flat base sits on the same line as our square containers. The triangle is a container here, so its corners take the container radius (2.5 · 2 · 1.5 on the line) - and the rounder corner is also what gives the "!" its room, because for the same ink box a rounder corner means a bigger triangle underneath. The "!" is alert-circle's to the unit at 24 (bar 8, gap 1, dot 2.5); at 20 and 16 the bar is as long as 1.5 of air to the sloping sides allows. At 16 only, the point takes one radius step more (2 on the line, feet stay 1.5): with 1.5 everywhere the bar was 2.875 against a 2.0 dot and read as a colon in real pixels; at 3.375 it reads as "!". Ink box 20x19 · 16x15 · 14x13, filled box identical; top edge at 2 · 2 · 1, base at 21 · 17 · 14; sides 61.6 · 61.1 · 62.4 degrees; bar ink 8 · 4.75 · 3.375 (alert-circle 8 · 6 · 4.5); smallest gaps: bar to the sloping sides 1.95 · 1.59 · 1.50, foot to the base 1.50 · 1.50 · 1.75 (at 20 and 16 the foot sits on whole pixel rows so a clear row parts it from the bar), bar to foot 1 · 1 · 1 (C19 glyph gap); filled: triangle solid, "!" cut out the way alert-circle-filled cuts it (bar cut 2 · 1.76 · 1.75 wide); least material bar cut to outer edge 3.20 · 2.96 · 2.56, foot cut to outer edge 2.75 · 2.87 · 2.88, between the two cuts 1.00 · 1.00 · 1.00; the triangle's centre of area sits 1.53 · 1.05 · 0.83 below the canvas centre after the lift. Inside every rule except the one every triangle breaks (the angle). Calm, reads as a sign at 16, and the closest sibling to alert-circle (recommended) -->
