  <!-- tags: wide -->
  <!-- Wide head (recommended): arrow-up-2's wide head, the one C16 names for -circle buttons. Its ratio (14/15 · 12/13.5 · 11/12) would give 9.8 · 7.11 · 5.96; drawn 10 at 24 (the nearest quarter-grid head), grown to 8 · 7.25 at 20 and 16 (+0.89 · +1.29), forced by the knockout. Mark ink 10×10.5 · 8×8 · 7.25×6.5 — identical to A at 20 and 16. Head 5.44 · 4.44 · 3.99 tall, shaft showing 5.06 · 3.56 · 2.51 below the barbs. Head air (C37), outline: 2.75 · 1.75 · 1.75. Knockout solid barb-to-shaft: 2.25 · 1.5 · 1.25. Recommended: at 20 and 16 the knockout already makes this the wide head, so B is the only one that keeps one proportion at every master, head to length 0.95 · 1 · 1.12 (arrow-up-2 is 0.93), and at 24 it fills the plus's square (10×10.5 against 10.5×10.5) the way it does at 20 (8×8). Cost: at 24 its ink is 13% over the plus (32.0 px against 28.31). At 16 A and B are one drawing, 7.25×6.5 against the plus's 6.5×6.5, ink 17.5 px against 14.03 (+25%), knocked-out white 24.6 against 18.7. C15, measured by hand (the sheet reads no measure on a two-path arrow): the triangle through both leg ends and the tail sits 1.13 · 0.88 · 0.95 low, so × 0.5 recommends up 0.55 · 0.45 · 0.5; not applied (C14 keeps arrows box-centred). Name: C9 ships it as arrow-up-circle-2, though no medium-headed arrow-up-circle can exist at 20 and 16. Ring: `circle` verbatim (outer ⌀20 · 16 · 14). Arrow: arrow-up's build (shaft ending on the bend's apex, legs 45°, one C10 tip of 0.75 · 0.75 · 0.625), 10.5 · 8 · 6.5 long in ink (plus-circle's span, so the two swap), box-centred: ink y 6.75–17.25 · 6–14 · 4.75–11.25, mirrored left and right on x 12 · 10 · 8, so a quarter turn about the centre gives down, left and right. Filled: the disc with the arrow cut out at the medium weight 2 · 1.75 · 1.75 on the outline's centrelines (flat run kept), ends reaching half the added weight further (0.25 · 0.125 · 0.25); ink box = the disc. What sets the head: the knockout. The solid left between a barb's cap and the shaft's cut is the leg-end offset less the cut weight, and it floors at the line weight 1.5 · 1.5 · 1.25 (§5c), so the offset must be 3.5 · 3.25 · 3 — head 8.5 · 8 · 7.25 wide at the least. The outline alone (C37, 1 of air) would only need 6.5 · 6.5 · 5.75. Air to the ring, outline: 3.25 at 24 (tip and tail), 2.49 at 20 and 2.12 at 16 (barb caps). Filled, solid round the cut to the disc edge: 4.5 · 3.86 · 3.12. Off-grid decimals are construction: the tangent points of the 45° tip (11.47/7.72 · 9.47/6.97 · 7.558/5.558), each leg end's y set by 45° from them, the cut's outer tip radius 1.75 · 1.63 · 1.5 (bend + half the cut) with its tangent points, the cut's 45° cap points, and the 20 cut's half-width 0.875 written 0.88 on both sides (as plus-circle-filled), which keeps it mirrored. -->
