  <!-- box: 10x12 -->
  <!-- Big knob over a slim track, polished, on over off: Big knob over a slim track, polished, on over off: B at M's width, with the knob made as big as the air to the other switch allows. Each switch is still toggle-on-2's body: a ring knob taller than a pill track, the track lines stopping on the ring's centreline (x 12.38 / 11.62 · 10.25 / 9.75 · 8.63 / 7.37; on the grid at 20, off it by construction at 24 and 16, as in toggle-on-2). The knobs sit at opposite ends, each beside the other switch's track. What changed, B to B1: width 12 · 9 · 8 → 15 · 11 · 10 (M's box: 15×18 · 11×14 · 10×12); knob ⌀8 · 6 · 5.25 → 8.5 · 6.5 · 5.5, white inside 5 · 3 · 2.75 → 5.5 · 3.5 · 3; track 6 · 4.5 · 4 → 5.5 · 4.5 · 4 tall, white 3 · 1.5 · 1.5 → 2.5 · 1.5 · 1.5; knob proud of the track 1 · 0.75 · 0.625 → 1.5 · 1 · 0.75 on each side (toggle-on-2: 2 · 2 · 2); track showing past the knob 4 · 3 · 2.75 → 6.5 · 4.5 · 4.5, so the track's white runs 5 · 3 · 3.25 from its round end to the knob, where B had 2.5 · 1.5 · 1.5. Air: margins top and bottom 3 · 3 · 2; knob to the other switch's track 3 · 2.75 · 2.125 → 2.5 · 2 · 1.75; knob to knob 3.01 · 2.25 · 2.41; pitch 9.5 · 7.5 · 6.5. The bigger knob is paid for in the air between the switches, which is now less than the top and bottom margins (2.5 · 2 · 1.75 against 3 · 3 · 2). What could not be fixed at 16: the knob stands 1 proud only if the track's white closes under 1.5 or the knob comes within 1.5 of the other track. Keeping both needs a pair at least 12.25 wide, wider than the square keyline, even with the switches staggered. The track's white stays on the 1.5 floor at 20 and 16 and turns grey in real pixels. A line instead of a pill track is sliders-5 exactly (a ring at each end of two lines, top right and bottom left), so that lever was not drawn. Tightest air at 16: 1.5, the track's own white. Straight track edges miss whole pixels at 20 and 16. Point-symmetric and centred. Filled: toggle-on-2-filled: each knob a solid disc ⌀8.5 · 6.5 · 5.5, tracks stay lines at 1.5 · 1.5 · 1.25. At 16 the grey track plus the disc still reads close to sliders-5-filled (a disc on a line). -->
