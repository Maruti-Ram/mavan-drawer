<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: coupon, voucher, discount, percent, sale, notched, lucide -->
  <!-- glyph: dot -->
  <!-- Coupon %: A coupon (Lucide ticket-percent): the notched body with a % in the middle — would ship as ticket-percent or coupon, not as ticket, and the % should follow percent's pick (in review) once it lands. Slash at 45° through the centre, spanning 6 · 4 · 3.25 across and down on the line; solid dots ⌀ 2.5 · 2 · 1.5. At 24 everything holds 1.5 (dot to slash 2.24, dot to notch 1.93). At 20 and 16 a ticket's 9 and 7.5 of white height cannot hold two dots and a slash with 1.5 between them and 1.5 to the walls, so the file declares glyph: dot (C19: a character with detached dots floors dot-to-body at 1): dot to slash 1.08 · 1.01, dots to walls and notches 1.5. At 16 the notch is 1.75 (A's 1.875) and the dots sit 1.875 off the centre across, 1.5 up and down, to keep that 1.5 to the notches. Filled: slash and dots cut out (the slash 1.5 wide, its ends pulled in at 16 so the cut's ends match the line's); at 16 the filled dots sit 2.125 off centre so 1.06 of ticket stays between dot and slash (draft-check). Off-grid numbers are the cut slash's tangent points. Honest: at 16 the % is a murmur — it reads as "ticket with something", which is the cost of this meaning. -->
  <path d="M3.125 3.625H12.875A1.5 1.5 0 0 1 14.375 5.125V6.25A1.75 1.75 0 0 0 12.625 8A1.75 1.75 0 0 0 14.375 9.75V10.875A1.5 1.5 0 0 1 12.875 12.375H3.125A1.5 1.5 0 0 1 1.625 10.875V9.75A1.75 1.75 0 0 0 3.375 8A1.75 1.75 0 0 0 1.625 6.25V5.125A1.5 1.5 0 0 1 3.125 3.625Z"/>
  <path d="M6.375 9.625L9.625 6.375"/>
  <path d="M6 6.5A0.125 0.125 0 1 0 6.25 6.5A0.125 0.125 0 1 0 6 6.5Z"/>
  <path d="M9.75 9.5A0.125 0.125 0 1 0 10 9.5A0.125 0.125 0 1 0 9.75 9.5Z"/>
</svg>
