<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: round, bowl -->
  <!-- glyph: dot -->
  <!-- Polaris bowl: Polaris' construction on the C19 glyph gap: the bowl wraps 249 deg from just past 9 o'clock (r 3 · 2.25 · 1.75), then a reverse tuck (1.14 · 0.86) turns the terminal onto the axis, dot directly below. Counter 4.5 · 3 · 2, void/dot 0.5. At 16 the tuck is dropped and the bowl ends at its own foot: a tail there needs the bowl down to r1.5, which takes the counter from 2 to 1.5, and help is the one of the four with the widest counter to lose. That is a judgement, not a geometric bar — 31 legal 16 drawings exist and help-3 took one on 2026-09-18. The earlier claim that a legal tuck would need a 0.57 radius was wrong: it centred the mark instead of the ink box. Shipped 16: counter 2, mouth 1.45, dot at 11, shared with help-2. -->
  <path d="M1.75 8A6.25 6.25 0 1 0 14.25 8A6.25 6.25 0 1 0 1.75 8Z"/>
  <path d="M6.41 5.76A1.75 1.75 0 1 1 8 8.25"/>
  <path d="M7.75 11A0.25 0.25 0 1 0 8.25 11A0.25 0.25 0 1 0 7.75 11Z"/>
</svg>
