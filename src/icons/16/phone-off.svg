  <!-- Bar cut through, / across the grip (breaks C21's direction): BREAKS C21's direction: the one / bar in the set (Maruti's pick, 2026-10-25, over the centred \ bar, which ran down the handset's length and left only its back curve; a dated C21 note grants it). What the eye sees: the handset cut in two across its grip, each head whole with half the grip, the two halves exact mirror images, and the bar running / through the gap into the empty corner between the heads. At 16 in real pixels the outline reads loop, slash, loop, close to a % sign, as Lucide's phone-off does; the two back curves aimed at each other across the bar are what say handset. Filled, the two solids carry the heads' face notches and the grip's outer curve, so it reads more surely as a handset, though two solids and a slash can still suggest a bold %. Why /: our handset lies along the \ diagonal (21.26 · 16.02 · 13.96 long along it, 9.08 · 6.83 · 5.98 across), so a \ bar runs down it; Lucide runs phone-off's bar / for the same reason (its own M22 2 2 22). The bar: / at 45°, the square keyline 18 · 14 · 12, centreline (20.25,3.75)-(3.75,20.25) · (16.25,3.75)-(3.75,16.25) · (13.375,2.625)-(2.625,13.375), on phone's ink centre 12,12 · 10,10 · 8,8 and on its mirror axis; it crosses the grip square on at its middle. Cut: the grip's back stops with 1.505 · 1.505 · 1.501 of air from the bar's edge at all four ends, the ends meeting the bar at 77.6° · 73.4° · 72.7°. The inner curve stops 1.505 · 1.501 from the bar at 20 and 16, which is 0.31 · 0.31 past the face's C10 bend; at 24 the same cut would land 1.21 past it, a hook the other masters cannot have, so at 24 it stops 0.32 past the bend too (air 2.35) and every master's half ends the same way, the face curling into the grip. Kept: two mirror-image pieces, 21.69 + 21.69 · 15.12 + 15.12 · 12.76 + 12.76 long (76 · 71 · 69% of phone's outline), each with its head whole and 32.6° · 28.4° · 27.7° of the grip's back (of 45°). Removed: the grip's middle, back 6.05 · 6.08 · 5.58 long, inner curve 7.88 · 6.17 · 5.68. Bar ends: equal air to both heads (mirror); the bar stands 6.13 · 4.79 · 4.25 past the back's cut ends at the lower left and 8.46 · 6.49 · 5.39 past the heads' tips at the upper right, because the handset sits low-left along the bar while the bar is centred on the box; evening that out would slide the bar 1.16 · 0.85 · 0.57 off the keyline and nearly double the mass offset, so it stays centred. Ink 18×18 · 14×14 · 12×12, the square keyline, outline and filled. Mass from the canvas centre −0.34,+0.34 · −0.19,+0.19 · −0.09,+0.09 (phone −1.03,+1.03 · −0.78,+0.78 · −0.58,+0.58): the bar fills the corner phone leaves empty. Filled: a channel 4.5 · 4.5 · 4.25 wide (the bar plus 1.5 each side) knocked out of the grip, corners r0.75 · 0.75 · 0.625, white 1.506 · 1.506 · 1.501 each side, the bar whole at 1.5 · 1.5 · 1.25; two mirror-image solids, each a head with half the grip, their backs on one circle across the channel. The channel stays straight at 24, so there the solid's inner corner sits 0.84 nearer the bar than the outline's curl. At 16 the cut ends stay where the circles put them: no eighth-grid point holds both the arc and the 1.5 of air, and moving them for a whole-pixel cap edge would cost the equal air. Off-grid decimals are the cut ends and the channel's corners, where the circles put them. -->
