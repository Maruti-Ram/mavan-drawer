<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: ribs, attached -->
  <!-- Square can · ribs, one rib at 16: C3 drawn to the numbers. The square keyline at every master (18 · 14 · 12), body hanging straight off the lid line, walls tapering 4 deg, bottom corners r1.5 / 1.25 / 1. The lid runs the full keyline and the tab is 42% of it. The handle's depth is not a proportion: MIN_GAP pins the tab's top line 3.0 above the lid line at every master, because both are 1.5 strokes and 1.5 has to fit between them. At 16 the two ribs do not fit - two 1.5 ribs with 1.5 clear on both sides and between them need 7.5 of interior, and the 12-wide can gives 7.0 at the ribs' lowest point (0.90 of measured clearance against the 1.5 floor). So 16 drops to one rib. That is the gap rule working - remove the detail - but see what it costs the family below -->
  <!-- 16 master at stroke 1.25 (C7, 2026-09-20): centrelines on the eighth grid so every ink edge stays where the 1.5 line had it. Tab top stays on the keyline and the lid keeps 1.5 of air under it (2.75 between centrelines, was 3), so the lid rises 0.375 and the body is that much taller; rib ink 8 → 10.75 — supersedes the 16 figures above -->
  <path d="M2.625 5.375H13.375"/>
  <path d="M5.625 5.375V3.625A1 1 0 0 1 6.625 2.625H9.375A1 1 0 0 1 10.375 3.625V5.375"/>
  <path d="M3.625 5.375L4.119 12.445A1 1 0 0 0 5.117 13.375H10.883A1 1 0 0 0 11.881 12.445L12.375 5.375"/>
  <path d="M8 8.625V10.125"/>
</svg>
