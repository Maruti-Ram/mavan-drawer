  <!-- Smaller back, level: The -behind arrangement (users-behind): a smaller second person on the same eye line (head centres level). With a one-arc figure a level, smaller person cannot reach the shared baseline without its arc going past a semicircle, so its feet sit higher (bottom 18 · 15 · - against the front's 21 · 17 · 14) and it reads as further away as well as smaller. FIGURE, from user-4 and kept exactly: stroke 1.5 · 1.5 · 1.25, head-to-arc gap 1.5 at every master (outline and filled), the arc's ends on the figure's own baseline with round caps, the head centred over the arc, the filled twin = the head disc plus the closed shape under the arc's outer edge with the caps as corners; user-4's splay is 62.4 · 51.3 · 62.3°. Scaled down to fit two people, so head size, arc width and rise are the arrangement's numbers. Everything of the back person nearer than 1.5 to the front one is cut away with round ends, and anything behind the front person's filled body goes too (user's dome hid that; the open arc does not), so the filled twin is the same cut seen as solids. ARRANGEMENT: front head 8 · 6 · 6 (user-4's own head at 24 and 16), back head 8 · 6 · 5 across, 0 · 0 · 4.5 to the right; back arc 11 · 7 · none wide; its head shows 117° · 162° · 163°, its arc 51° · 79° · hidden (4.7 · 4 · none long). Ink 18×18 · 14×14 · 12×12, the square box, filled box identical. Smallest gap 1.5 · 1.5 · 1.5 in the outline (head↔hill) and 1.5 · 1.5 · 1.5 filled (hill↔hill); head holes 5/7 · 3/5 · 2.5/3.5 clear. At 16 the back arc was a 1.28 dot behind the front arc's end, so it is removed: the back person is a head on the same eye line; the front is 10 wide, not 12, to leave it room. -->
