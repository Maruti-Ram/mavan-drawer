  <!-- Hooked loops, level: A's picture, kept level in A's box: two capsule loops side by side, each drawn three-quarters round (a free end, the half circle at the outer end, the long run, and a quarter-turn hook into the other loop); no bar, nothing crosses (Untitled UI link-04 and Iconoir link construction, redrawn on our grid). What changed from A: the two hooks now run past each other. Each hook goes on 0.5 · 0.25 · 0.375 straight past mid-height, so the middle of the S is two short upright strokes side by side instead of two tips meeting at one point. At 16 those strokes sit on whole pixel columns (centrelines x 6.5 and 9.5) and render as two solid black columns, where A's tips rendered as two half-grey pixels (52% coverage) at the centre of the S. To keep 1.5 as they pass, the hooks stand 3.5 · 3.5 · 3 apart on the line (air 2 · 2 · 1.75) instead of A's 3 · 3 · 2.75; at 20 the passing hook end sits exactly 1.5 above the other loop's run. The free end at 24 now runs 1.5 past the half circle instead of 0.5, so at every master the free end stops just clear of the other loop's hook (air 1.6 · 1.64 · 1.54): one opening, not a wider one at 24. Box 20x10 · 16x8 · 14x8 (A's). Loop radius 4.25 · 3.25 · 3.375 on the line, loops 12.5 · 10.5 · 9.13 long outer, inside 7 · 5 · 5.5. Tightest air 1.6 · 1.5 · 1.54. Filled: line-heavy, the same wire at 2.5 · 2 · 2 on the same outer edge (loop radius 3.75 · 3 · 3 on the line). A heavier line cannot keep hooks that reach mid-height with 1.5 round them, so the filled twin is its own drawing in the middle, as A's was: the hooks turn 85° · 80° · 80° and the free ends stop 1° · 11° · 37° short of the top of the half circle; hook end to the other loop 1.53 · 1.52 · 1.52, tightest air 1.53 · 1.52 · 1.51, inside 5 · 4 · 4; box identical. Off-grid decimals: the 16 free end (it stops 5° short of the top, at 4.706 4.638) and, in the filled twin, every hook end and free end, which stop at an angle, not on a grid point. Why it stays this short: 14 wide holds two loops 8 tall that overlap with 1.5 between the hooks; drawn 14x10 like link-3 the loops have to be circles with no straight run, and the pair reads as an S inside a ring (tried at 20x12 · 16x10 · 14x10). At 16: 42.5 px of ink against link-3's 43.9 in the outline (A: 41.3), 55.9 against 64.7 filled (A: 55.3); nearly link-3's weight in the outline, but 2 px shorter and still light filled. -->
