  <!-- Developer board: Rhythm: a board with a pin header on its right edge only, pins at A's pitch and air, 4 · 3 (8/12/16 · 7/10/13, air 2.5 · 1.5), standing 2 · 1.5 out; at 16 the header drops to two pins (6.375/9.625, pitch 3.25, air 2), because three would run into the board's corner curve. One chip on the board, A's die size at 24 (8 square, r1); 5.5 · 4.5 at 20 · 16. It sits left of centre so the header balances it: air to the board 2 left, 2.5 · 1.75 · 1.5 top and bottom. Board 18×16 · 14.5×12 · 12.5×10 outer, corners r2.5 · 2 · 1.5. Ink 20×16 · 16×12 · 14×10, landscape keyline, box-centred. The weakest reading of the five: at 16 it reads as a card or a camera, and it says 'hardware' more than 'processor'. Filled: board solid, chip kept solid inside a 1.5 white cut, header stays 1.5 · 1.5 · 1.25. Who: Material developer_board (board, three-slot header on the right, four blocks inside; here reduced to one chip so it holds at 16). -->
