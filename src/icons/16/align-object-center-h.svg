  <!-- Line and two boxes: Rhythm: two boxes 6 · 5 · 4 tall (white inside 3 · 2 · 1.5), 2 · 2 · 2 between them; the line spans the whole 18 · 14 · 12 and runs 2 · 1 · 1 past the boxes at each end; long box 18 · 14 · 12 wide, short 12 · 10 · 8 (0.667 · 0.714 · 0.667 of the long), both centred on the line, the long one on top. Balance: ink 18 · 14 · 12 square on the square keyline, box-centred on the canvas with margins 3 · 3 · 2 on all four sides; ink mass off the canvas centre by x, y 0, -0.66 · 0, -0.51 · 0, -0.52, toward the long box on top — kept on the box centre on purpose, as Lucide align-center-vertical and Nucleo align-horizontal are: the lean is what the icon says, and C14 moves only pointing marks. Corners r 1.5 · 1.25 · 1 on the centreline (inside 0.75 · 0.5 · 0.375, the C1 floor); 16 on the eighth grid, every box wall on x.375 / x.625 so outer edges land on whole pixels. The line runs behind the boxes, drawn only above, between and below them, each piece ending on a box wall's centreline, as align.horizontal.center, Nucleo align-horizontal and Central vertical-alignment-center build it — no box is cut; at 16 the outer pieces show 1 past the boxes, the middle one 2. Who: Lucide align-center-vertical, SF Symbols align.horizontal.center, Nucleo align-horizontal, Central vertical-alignment-center — the common picture. Order: Lucide align-center-vertical and Central vertical-alignment-center lead with the long box, as here; SF Symbols align.horizontal.center, Untitled UI align-horizontal-centre-02 and Nucleo align-horizontal / align-3-horizontal (the name source) with the short one (E). Figma's "Align horizontal centers" is this picture with solid bars (D). Filled: both boxes solid to the outline's outer edge (corners r 2.25 · 2 · 1.625), the line stays at 1.5 · 1.5 · 1.25; ink box unchanged. At 16 beside the set it is the one that says "line these up against this" in every member: the line names the axis, two boxes of different length say "objects", and the six stay apart in a toolbar row, where C relies on a 2-pixel shift of the short box (recommended) -->
