  <!-- Joined columns: Three hollow columns sharing their walls - low, tall, middle - one stepped outline with two dividing walls, corners at the mark bend (0.75 · 0.75 · 0.625). Hollow bars like Polaris, but three separate hollow bars cannot be drawn at 20 or 16 (three bars with 2 clear inside and 1.5 between need 18 of width; 20 has 14), so the columns share walls instead. The most solid, building-like of the ten; it can read as a podium. Clear inside each column 4 · 2.5-2.75 · 2.25-2.5 - all over the 2 that stays white at 16 (computed by the drawing script; the check does not measure inside a closed outline). Column heights 9/18/13 · 7/14/10 · 6/12/9. Square guide box, ink 18x18 · 14x14 · 12x12, filled identical. Filled: the shape case - three solid bars 5 · 3.5-3.75 · 3 wide, the dividing walls become 1.5 cuts through to the floor (as image-filled's mountain line does), outer corners 1.5 · 1.5 · 1.25. The cuts sit 0.5 · 0.5 · 0.375 off the outline's walls so that the three solid bars are equal. At 16 the middle solid bar's edges fall on half pixels (6.5 and 9.5), so it renders slightly softer than its neighbours. Extends: stacked = a level line across each column (filled: a 1.5 cut); horizontal = the same turned; trend is crowded - the columns leave no empty sky -->
