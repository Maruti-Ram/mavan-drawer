  <!-- 01 in the sun’s place: 01 in the sun's place (recommended; Maruti locked B as image-binary on 2026-10-25): the shipped image (frame, one mountain) verbatim and in place, with the digits 0 and 1 out of its top-left corner where the sun was, exactly where image-sparkle H puts its spark; the sun goes, the mountain stays whole at every master. Why not C33's bottom-right corner (measured): two digits side by side are 8.5 · 8.5 · 7.25 wide, wider than image-plus's plus (8 · 6 · 5), and on that corner they come within 0.26 · 0.28 of the mountain's left leg at 20 and 16, so the peak, the right leg and all but 2.83 · 2.47 of the left leg would go; inside the frame the 16 master has 6.5 of white between 1.5 margins and the pair needs 7.25. Digits drawn as numerals at the outline weight (C19 glyph: numeral): the 0 is the stadium of sort-numeric's locked 0 (ink 4.5×6.5 · 4.5×5 · 3.5×4.25, hole 1.5 · 1.5 · 1 wide; at 16 3.5×4.25 is sort-numeric's own 16 proportion, 0.82 against its 0.81), the 1 is list-ordered's, a flag of 1 at 45 degrees on a stem as tall as the 0 (ink 2.5×6.5 · 2.5×5 · 2.25×4.25). At 16 the 0's left edge sits on pixel 1 and the hole's floor of 1 then puts its right side on x 3.875, so its pixel columns read 100 · 25 · 75 · 50 per cent; only the order 10 would give the hole a white pixel, and 01 is kept, the counting order the board was locked in. Badge ink 8.5×6.5 · 8.5×5 · 7.25×4.25, its top-left ink corner on the margin edge (2,2 · 2,2 · 1,1). Air 0 to 1: 1.53 · 1.53 · 1.50 at the flag (the flag tip to the 0's shoulder), 2.5 at every master between the stem and the 0's side. Cut back by hand with 1.5 of air from the digits' ink: the top-left corner arc goes at every master; the top wall starts at x 12.75 · 12.75 · 10.375, 5 · 1.5 · 1.5 before its top-right corner arc (the least a wall may keep, C33), air 1.50 · 1.50 · 1.50 to the 1's stem; the left wall stops at y 10.75 · 9.25 · 7.375, 7 · 5 · 4.5 before its bottom-left corner arc, air 1.53 · 1.53 · 1.50 to the 0's foot; one grid step further leaves 1.25 · 1.25 · 1.38 and 1.28 · 1.28 · 1.38. Mountain verbatim, 5.10 · 3.21 · 2.89 from the 1's foot (the nearest digit). Box 19×19 · 15×15 · 13×13 (declared), centre 0.5 toward the digits, as image-sparkle and image-plus. Filled: image-filled's upper solid without the sun's hole, cut along the digits' ink grown 1.5 (the 0's foot r 3.75 · 3.75 · 3.25, the 1's foot r 2.25 · 2.25 · 2.125, then straight up the stem's grown side at x 12 · 12 · 9.75), the black point between the two feet rounded 0.5; each wall's strip of solid ends as its outline line ends, in a round cap of r 0.75 · 0.75 · 0.625 on the outline wall end (ink to y 10 · 8.5 · 6.75 on the left and from x 12 · 12 · 9.75 on top, as the outline), the left cap joined to the grown 0 by a level tangent 0.5 · 0.5 · 0.125 long, the top cap already tangent to the stem's grown side. The black strip left between the 1's foot cut and the peak's band is 3.59 · 1.69 · 1.26, over the line-weight floor 1.5 · 1.5 · 1.25 (it was 3.59 · 1.25 · 0.57 before the digits were made 5 · 4.25 tall at 20 and 16, the review of 2026-10-25). The digits stay lines at 1.5 · 1.5 · 1.25 (the filled image is a shape icon: its lines keep the outline weight), so they are the outline's own ink; the mountain solid verbatim. Tightest air outline 1.50 · 1.50 · 1.50, filled 1.50 · 1.50 · 1.50 (the cut is the grown ink; measured by sampling). Filled ink box equals the outline one. Off-grid decimals: image's own (the peak's tangent points, the filled arcs' ends and fillets) and the cut's fillet tangent points (rounded to 2 · 2 · 3 dp, the fillet placed 0.005 out so rounding keeps 1.5). -->
