  <!-- Card in place, password-lock's lock on its corner: Secure card: credit-card (bar left) kept exactly where credit-card has it (ink 20×16 · 16×12 · 14×10), with password-lock's padlock badge copied string for string, body and shackle, at every master and in both styles, its ink corner on the margin edge (22 · 18 · 15), C33; user-lock carries the same lock. Lock ink 8×9.5 · 7×8.25 · 6×7 (map-pinned's pin 8×9.5 · 7×8.25 · 6×7.125). Box 20×18 · 16×14 · 14×12 (declared), the card's box plus the 2 the lock stands below it; centre 12,13 · 10,11 · 8,9, 1 below the canvas centre at every master, over C33's 0.5: the card keeps its place, as credit-card-contactless ships it, and Maruti approved it in place (2026-10-25), so the files declare <!— base: credit-card —> and lint holds the composite to the card's left and top edges, 1 below centre. Cut back by hand with 1.5 of air from the lock's ink, to credit-card-contactless's picture. Bottom wall stops at x 11.75 · 8.75 · 6.875, 6.5 · 4 · 3.75 past its corner, 1.5 from the lock body at every master. Right wall stops at the stripe: at 24 it meets it (y 8.75, 1.5 past its corner; the 2.75 below the stripe that would hold 1.53 of air goes, so 24 shows the picture 20 and 16 must, as credit-card-contactless's 24 follows its 20 and 16); at 20 it stops at y 8.25, 1.5 past its corner, the shortest C33 keeps, 0.5 below the stripe's line, 1.65 from the shackle; at 16 at y 6.625, 1.5 past its corner, on the stripe's line, 1.5 from the shackle. Stripe: whole at 24, 3 above the shackle. At 20 and 16 the shackle rises to within 1.25 · 0.75 of it, so it stops at x 13 · 9.625, 1.51 · 1.5 from the shackle, and its piece at the wall goes (1.25 long at 20, none at 16; C33). At 16 the stripe's end and the wall's end stand mirror-image about the shackle's axis. Bar: 5 · 4 long at 24 and 20 as shipped; at 16 3.25 (was 3.5), its end at x 6.375: in the filled twin the cut round the lock body left 1.06 of solid beside the bar's hole, under the 1.25 line-weight floor; the outline is cut with it so the pair keeps one bar (as password-lock dropped its second dot from both). No keyhole (the badge has none). Tightest air, outline: 1.5 · 1.5 · 1.5, bottom wall to the lock body (at 16 also the stripe's and wall's ends to the shackle, 1.502). Filled: credit-card-filled's top band whole at every master (4.5 · 2.75 · 2 from the shackle); the lower solid cut along the lock's ink grown 1.5 (the body's outline grown to radius 3.5 · 3.25 · 2.875) and straight up the shackle's grown side, x 14 · 10.75 · 8.5, to the stripe's gap. At 20 and 16 the shackle's grown disc (radius 3.75 · 3.5) reaches into the gap and would leave a wedge about 0.7 thick and a crumb right of the shackle; at 24 it would leave a 1.5 strip over the shackle and a horn down the right edge the outline no longer has. So the cut runs straight up at every master, as credit-card-contactless-filled ends its lower part on one straight edge and password-lock-filled runs its cut along the disc's tangent. The solid's bottom edge ends at x 12.5 · 9.5 · 7.5, where the outline's bottom wall's cap does. Junctions eased 0.5. The lock body is solid to its outline's outer edge; the shackle stays a line at 1.5 · 1.5 · 1.25, as lock-filled. Filled air: 1.5 · 1.5 · 1.5 (the cut); solid between the bar's hole and the cut 3.24 · 1.7 · 1.26; ink box equal to the outline's. Off-grid numbers are only the 0.5 fillets' tangent points, copied from password-lock-filled: 15.38 and 13.81,15.77 · 12.45 and 10.58,12.83 · 9.977 and 8.352,10.332. -->
