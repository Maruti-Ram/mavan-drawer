  <!-- ⌥ on the square key, polished: Rhythm and balance: the ⌥ sits at the family's legend scale on the family's key — 10 · 8 · 6.5 wide, 0.56 · 0.57 · 0.54 of the key, the very widths of control-key's centred caret and of checkbox's tick (10.27 · 7.81 · 6.5) — 8.5 · 6.5 · 5.5 tall (0.47 · 0.46 · 0.46 of the key), so the share of the key is the same at 24 · 20 · 16. Key: the shipped square verbatim (ink 18 · 14 · 12, centreline r 2.5 · 2 · 1.5, opening 15 · 11 · 9.5). The diagonal runs at 63.4° at every master, the shipped option's angle (2 down for 1 across). Bars on the centreline 2.5 · 2.5 · 2.5 at 24 (the detached bar straight above the bottom one, as option draws it), 1.5 · 1.5 · 2.5 at 20 and 1 · 1.125 · 2.125 at 16 (left, detached, bottom), the detached bar 1 · 1 right of the bottom bar's start there: the 1.5 floor needs the detached bar to start 3.354 · 3.354 · 3.075 past the left bar's end, so at 16 the two top bars share 2.125 of a 5.25 legend. Air to the key's inner edge: sides 2.5 · 1.5 · 1.5, top 3.5 · 2.5 · 2.125, bottom 3 · 2 · 1.875 — wider above and below than at the sides as checkbox's tick and control-key's caret are, because the legend is wider than tall. Balance: the legend is lowered 0.25 · 0.25 · 0.125, half its measured mass offset (its weight sits 0.74 · 0.32 · 0.19 above its box centre — two bars on top, one below), so its weight, not its box, sits on the key's centre; it is not moved across (its weight sits 0.63 · 0.40 · 0.27 right) because at 20 and 16 the sides are already on the 1.5 floor. Detached bar to the diagonal 1.63 · 1.63 · 1.54. Filled: square-filled's solid key with the legend cut out 1.5 wide on the same centrelines (C22; solid key, legend cut white, as control-key ships), cut bends r 0.75 as checkbox-filled's; material between the two cuts 1.63 · 1.63 · 1.3. Off-grid values are the bends' tangent points. It holds every floor on the square key at 16, so the larger key is no longer needed; the cost is legibility at 16: the two top bars are 1 and 1.125 long (under 2 pixels of ink past their round ends) and the glyph reads as a small step with a dot, where B on power-square's key keeps them 2.25 and 1.625. Polished from B. -->
