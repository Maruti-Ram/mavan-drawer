  <!-- Soft corners, circle size: A regular octagon on the circle keyline, flats 20 · 16 · 14 of ink (centreline apothem 9.25 · 7.25 · 6.375, the circle’s own radius), corners at the container radius 2.5 · 2 · 1.5 on the line — the same corner alert-triangle takes. The "!" is alert-circle’s verbatim: bar 8 · 6 · 4.5 ink, C19 gap 1, dot 2.5 · 2 · 2. Air from the glyph to the top and bottom flats 2.75 · 2.0 · 2.0 (bar and dot alike), to the nearest diagonal side 4.08 · 3.04 · 2.81 (dot), to the nearest corner arc 3.63 · 2.71 · 2.62 (dot). Because an octagon’s corner turns only 45°, the container radius eats just 1.04 · 0.83 · 0.62 of each side at the tangent, so each flat keeps 5.59 · 4.35 · 4.04 straight (76% of the side at 16, outer corner radius 2.125 px). The family-consistent corner, and at 24 and 20 it reads as an octagon; but in real pixels at 16, beside alert-circle, the eight soft corners melt together and A reads as the circle with four short flats — in the filled twin almost exactly the circle. Kept on the board as the triangle’s corner, not recommended. Ink box 20×20 · 16×16 · 14×14, filled identical. Filled: solid octagon, outer corner radius 3.25 · 2.75 · 2.125, with alert-circle-filled’s cuts to the unit — bar slot 2.0 · 1.76 · 1.75 wide, dot ⌀2.5 · 2 · 2, 1.0 of disc between them; least material from a cut to the outer flat 4.0 · 3.37 · 3.125. The cuts are alert-circle-filled’s verbatim at 24 and 20 (at 20 the disc between them is 0.99, as shipped); at 16 they are written on the eighth grid instead, 7.125 / 8.875 / 10.875 for its 7.13 / 8.88 / 10.87, 0.005 apart, so the disc between them is 1.0 exactly. Note for lint: the disc between the bar cut and the dot cut is material between two separate holes, which no check reads today (alert-circle-filled prints no knockout line either) — the 1.0 here is measured by hand. -->
