  <!-- Check on the shield's corner: The shipped shield (the default shape, C9), its drawing and canvas place unchanged, with the V2 check (v2-badge-spec: badge-check's mark, ink 8.6x6.09 · 6.58x4.69 · 5.7x4.08) copied string for string onto its bottom-right corner. The check's ink corner sits on the margin edge 22 · 18 · 15 (C33), at the outline weight in both styles. Box 18x20 · 14x16 · 12x14 (declared): the shield's 16x20 · 12x16 · 10x14 plus the 2 the check stands right of it. Its centre is 13,12 · 11,10 · 9,8, 1 right of the canvas centre, so it declares base: shield, as shield-pending and file-check do. The shield is cut back by hand with 1.5 of air from the check's ink. The check covers the shield's point: the lower-right belly, the run into the point and the point's round all go, and 82 · 80 · 80% of the shield's line is kept. Right side: it runs down the straight side and stops on the belly arc at 18.91,14.75 · 15.16,11.88 · 12.324,9.694, 15.7 · 9.6 · 7.8 deg into the arc's 68. The long arm decides it, at 1.505 · 1.520 · 1.511 of air, and the cap's ink ends above the check's box (15.5 · 12.63 · 10.32 against 15.91 · 13.31 · 10.92). Left side: it runs over the top, down the left side and round the left belly to the run into the point. At 24 it stops on the shield's own tangent node 11.72,21.2, keeping the whole run, 0.28 left of the point's centre. At 20 and 16 it stops on the run at 9.33,17.04 · 7.352,14.162, 0.67 · 0.65 left of the point's centre. The short arm's start cap decides it, at 1.554 · 1.531 · 1.520 of air, and the cap ends left of the check's box (12.47 · 10.08 · 7.98 against 13.4 · 11.42 · 9.3). No line enters the check's box. Filled: shield-filled's solid, cut along the check's ink grown 1.5 (radius 2.25 · 2.25 · 2.125 round its centreline), with the check a line at 1.5 · 1.5 · 1.25. Both ends of the solid end in the outline line's own round cap (r 0.75 · 0.75 · 0.625), centred on the outline's cut ends, as shield-pending's do (spec 4a). On the right the cap turns tangent into the long arm's grown side (at 20 by way of 0.05 of the arm's grown tip cap). On the left it joins the short arm's grown start cap by the line that touches both (0.53 · 0.38 · 0.32 long), and at 24 it meets shield-filled's own tangent point 11.44,21.89. Inside the check's V the solid follows the grown ink down to a tip eased 0.5 (fillet centre 16.35,17.66 · 13.72,13.7 · 11.325,10.914), as file-check does: at 24 between the two arms' grown sides, at 20 and 16 between the long arm's grown side and the short arm's grown start cap, because the short arm is too short there for its side to reach. Tightest air, filled: 1.506 · 1.505 · 1.501. The cut is grown 0.008 · 0.008 · 0.0012 past 1.5 so that rounding to 2 · 2 · 3 dp never drops it under. Near the right end the bite, held at 1.5 from the long arm, runs just outside the line the outline cut. So the solid there stands up to 1.12 · 0.84 · 0.64 past the outline cap's ink, on a sliver of the shield's own outer stroke (0.28 · 0.21 · 0.13 sq units), as file-plus's solid does past its right wall's cap. Off-grid decimals: the check's own (V2 spec); the shield's own tangents (10.38, 20.65, 12.31, 11.72, 21.2 · 8.82, 16.83, 10.8 · 7.065, 14.046, 8.947); the two cut ends, each where the shield's centreline meets the air line, rounded to 2 · 2 · 3 dp on the side that keeps 1.5; and in the filled twin the cut's cap, fillet and tangent points, rounded the same way. -->
