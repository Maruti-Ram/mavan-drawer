  <!-- Squeezed eyes: Rhythm and balance: L1's mouth and stack. The > < stand on the family's eye line, points toward the nose, apexes 1.5 · 1.5 · 1.375 from the centre line: 2.12 · 2.12 · 2.02 between the two points (filled cuts 1.61 · 1.87 · 1.52); eye to ring 2.34 · 1.8 · 1.69, mirrored. Each eye is the set's chevron at eye size: legs at 45 degrees, apex bend 0.75 · 0.75 · 0.625. The ring sets the size: the upper leg's tip reaches the ring's 1.5 first, so the legs are 1.5 · 0.75 · 0.5 long (ink 4.5 · 3 · 2.25 tall): full size at 24, half at 20, a third at 16. THE TYPE DOES NOT SURVIVE 16 in this family: there each > is a 0.5-unit hook and reads as a grey dot, like L1's eye; at 20 it still reads as > <. Keeping it would mean lowering the eyes below the family's line, which costs the mouth its counter at 20 and 16. Drawn this way by Font Awesome face-laugh-squint / face-grin-squint, Central emoji-lol, Nucleo face-grin-squint, Tabler mood-xd (as X X), Apple's grinning squinting face. Off-grid numbers: the bend tangent points and the filled cut edges. -->
