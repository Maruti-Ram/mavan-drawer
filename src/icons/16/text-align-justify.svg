<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: alignment, paragraph, justify, four rows -->
  <!-- box: 12x11.75 -->
  <!-- Four rows: Four full lines, both edges straight, so justify is its own drawing and no longer menu: menu is three lines, this is four. Lines menu's, 15 · 13.5 · 12 of ink (x 4.5→19.5 · 3.25→16.75 · 2→14). Rows even-pitched and centred on the canvas: centrelines 5.25 / 9.75 / 14.25 / 18.75 · 4 / 8 / 12 / 16 · 2.75 / 6.25 / 9.75 / 13.25 (pitch 4.5 · 4 · 3.5), a block 15 × 15 · 13.5 × 13.5 · 12 × 11.75. The cost: the air between lines is 3 · 2.5 · 2.25, against menu's and text-2's 3 · 3 · 3.25, so at 20 and 16 this stack reads denser than every other line stack in the set. Beside menu it differs by one more line and that tighter rhythm, nothing else: rendered at 16 in real pixels it reads as four lines against menu's three, but heavier — a third more ink (59 against 44 pixels of ink in the outline, 92 against 69 filled; text-2 has 38 and 59). Filled: thickened in place to 2.5 · 2 · 2, ends in 0.5 · 0.25 · 0.375, grows 0.5 · 0.25 · 0.375 top and bottom; filled air 2 · 2 · 1.5 — exactly the floor at 16. Two costs at 16 that A does not have. The filled stack is 12.5 tall (ink 1.75→14.25), 0.25 past the 12 mark keyline top and bottom, and lint §2 warns; it cannot fit, because four lines of 2 with 1.5 of air between them need 12.5. And the 3.5 pitch falls on the pixel grid unevenly: in the outline the white between rows is 1 · 2 · 1 whole pixel rows, so the stack reads as two pairs; in the filled twin rows two and three keep no whole white pixel row between them (a 25 % grey band). -->
  <path d="M2.625 2.75H13.375"/>
  <path d="M2.625 6.25H13.375"/>
  <path d="M2.625 9.75H13.375"/>
  <path d="M2.625 13.25H13.375"/>
</svg>
