  <!-- File with the seal: File with the seal: the shipped file (default shape: fold top-right, chamfer 6 · 5 · 4) unchanged and in place (ink 16×20 · 12×16 · 10×14), with the same seal as A as a C33 shape badge on its bottom-right corner. The seal is award's ring on its two ribbon legs, drawn small: ring ⌀8 · 6 · 5 of ink (centreline radius 3.25 · 2.25 · 1.875, centre 18,16 · 15,13 · 12.5,10.5), its hole 5 · 3 · 2.5; legs at x 16, 20 · 13.5, 16.5 · 11.125, 13.875 (2 · 1.5 · 1.375 either side of the axis), so the ribbon is 5.5 · 4.5 · 4 of ink wide, 0.69 · 0.75 · 0.80 of the ring (award 0.68; at 20 and 16 the legs cannot come closer, 1.5 of white between them is the floor), and each leg starts on the ring's centreline as award's do (a T: y 18.56 · 14.68 · 11.775, where x = 16 · 13.5 · 11.125 meets the ring's circle, the only off-grid numbers in the outline) and runs to 21.25 · 17.25 · 14.375, its cap on the margin edge, 2 below the ring's ink at every master. Award's notch goes: at these leg spacings its 45° V would show 0.63 · 0.13 · 0.23 deep (each leg's offset from the axis less 1.83 times the bend radius), and closing the ribbon under the ring would need 1.5 of white above the notch, a badge 11.6 tall at 24; a detail that cannot be seen is removed. Badge ink 8×10 · 6×8 · 5×7 (x 14–22, y 12–22 · x 12–18, y 10–18 · x 10–15, y 8–15), between password-lock's lock (8×9.5 · 7×8.25 · 6×7) and file-heart's heart (10×8.5 · 7.5×6.25 · 6.5×5.5) in size, its ink corner on the margin edge 22 · 18 · 15 (C33). At 16 the ring's top, bottom and sides fall on whole pixels; the legs sit on half pixels (10.5–11.75 and 13.25–14.5), because a leg pair 1.5 apart on a ring of ⌀5 cannot put either edge on a pixel, and a ⌀6 ring that could would make the badge 8 tall. Filled: the ring fills to a solid disc of its own ink (r 4 · 3 · 2.5) and the legs stay lines at the outline weight 1.5 · 1.5 · 1.25, as lock-filled keeps its shackle; award-filled's face (a 1.5 white ring cut inside the rim) needs a disc of ⌀7.5 to keep a face of 1.5, so it would show at 24 only (face ⌀2) and close at 20 and 16; the solid disc is one picture at all three. Box 18×20 · 14×16 · 12×14 (declared), file-heart's and file-clock's: the file plus the 2 the seal stands right of it; centre 13,12 · 11,10 · 9,8, 1 right of the canvas centre, so the files declare <!— base: file —> (the base kept in place, as file-heart and user-lock). How it differs from the shipped file badges: it is built exactly as file-heart and file-plus are, so it is the same picture with a different badge, and could as well be called file-award. File-text's lines cannot come with it: in the filled twin a knocked-out line needs 3.0 · 3.0 · 2.75 of outline air to the seal so that 1.5 · 1.5 · 1.25 of solid stays between it and the cut, which leaves file-text's two lines 3 and 2.5 long at 24, one stub 0.75 long at 20 and none at 16. The seal is taller than the heart (10 against 8.5 at 24), so the right wall goes at every master (it would stop at y 9.88 · 7.76 · 5.88, 1.13 · 0.01 · 0.13 past the chamfer's corner, under C33's 1.5), where file-heart keeps 2.5 of it. Cut back by hand with 1.5 of air from the seal's ink: the chamfer ends at its corner with the fold's foot, 2.61 · 1.51 · 1.63 from the ring; the fold is whole, its foot 2.5 · 1.5 · 1.63 above the ring. Bottom wall stops at x 13 · 10.5 · 8.375 (5.75 · 3.75 · 3.25 past its corner), exactly 1.5 from the left leg and 2.5 · 2.44 · 2.53 from the ring. Tightest air, file to seal: outline 1.50 · 1.50 · 1.50 (bottom wall to the leg; at 20 also the fold's foot to the ring); filled 1.50 · 1.50 · 1.50. Filled: file-filled's body cut down the column x 12.5 · 10.5 · 8.5, the ring's cut circle's leftmost point (radius 5.5 · 4.5 · 4), so the cut runs into the circle on its tangent; at 24 that column is the fold notch's own left edge, at 20 and 16 it lies 1 right of it and keeps 1.85 · 1.72 of the notch's arc (of 3.14 · 2.75), eased 0.5 into the column. The cut follows the circle round the ring, eases 0.5 onto a line 1.5 from the left leg, and ends on the bottom wall's cap (radius 0.75 · 0.75 · 0.625) where the outline's ink does (x 13.75 · 11.25 · 9). The body under the flap goes: between the notch (y 9.5 · 8.5 · 6.5) and the cut it would be 1.0 · 0 · 0 thick, under the 1.5 · 1.5 · 1.25 floor, so the filled file reads as a column and a floating flap, as file-clock's first draft does. Flap untouched. Ink box equal to the outline's. Off-grid numbers: the legs' tops (above); in the filled body the cut circle's tangent points and eases (13.64,19.36 and 13.75,19.67 · 10.3,8.1 on the notch arc, 11.17,15.37 and 11.25,15.63 · 8.278,6.205 and 8.5,6.621, 8.944,12.332 and 9,12.562), rounded away from the seal; the flap's own numbers are file-filled's. -->
