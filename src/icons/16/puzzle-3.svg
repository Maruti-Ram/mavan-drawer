  <!-- Classic piece: two knobs, two sockets: The whole jigsaw piece: knobs top and right, sockets bottom and left - the piece from the middle of the puzzle, the silhouette people draw when they draw 'puzzle'. Knobs are puzzle-2's small knob. The two sockets share a corner, so at 20 and 16 they are round notches (R1.625 · R1.5, the 16 one puzzle-2's notch radius) set 0.25 away from that corner; an undercut pair at 20 leaves at most 0.84 between them however far they slide (measured). Circle keyline, corners 2.5 · 2 · 1.5. Ink 20x20 · 16x16 · 14x14; knob head 5 · 5 · 4.5 across, standing 3.75 · 3.75 · 3.5 proud; neck clear inside 1.62 · 1.62 · 1.58, waist 0.19 · 0.19 · 0.21 each side; socket 3.75 · 2.625 · 2.125 deep, mouth clear 1.62 · 1.75 · 1.75, undercut 0.19 · 0 · 0 each side; smallest gap measured anywhere 1.62 · 1.62 · 1.58 (floor 1.5). Filled: the piece solid, its edge the outline's outer edge exactly (convex curves +half the stroke, concave -half), no inner lines. Every curve is a tangent arc; joins that land off the grid are documented here, as with checkbox's tick. (recommended: of the ten it is the one that reads as a jigsaw piece first at 16 in real pixels - two knobs and two bites, nothing else to decode - and it is puzzle-2 carried to its full form (same knob, same corners, same 16 notch radius), so it sits in the family instead of beside it. Runner-up: B, if the variant should say 'integration' rather than 'piece') -->
