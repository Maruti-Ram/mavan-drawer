  <!-- Dot sending waves: Round one's drawing, unchanged. A small solid dot with two arcs curving away on each side — a thing that is on and sending (Lucide radio, "live"; Nucleo live and circle-signal; SF dot.radiowaves.left.and.right; Polaris Live). It is target with its two rings opened into side waves: the same radii 5 / 9.25 · 4 / 7.25 · 3.375 / 6.375 and target's small dot ⌀ 3 · 2.5 · 2, so the air is target's — dot to wave 2.75 · 2 · 1.75, wave to wave 2.75 · 1.75 · 1.75. The outer waves end where their caps land on the landscape keyline, 20×16 · 16×12 · 14×10 (volume's box), which puts the ends at 51.6 · 46.4 · 43.3 degrees from level; the inner waves end on the same radial line. Filled: as volume fills — the one shape fills and the waves stay lines at 1.5 · 1.5 · 1.25 — with the dot thickened in place the way rss-filled thickens its dot, to ⌀ 4 · 3.5 · 2.5 (at 16 only as far as 1.5 of air to the inner wave allows), air dot to wave 2.25 · 1.5 · 1.5. A heavier-line twin (rss's way, 2.5 · 2 · 2) was worked out and cannot exist: a dot plus two waves at weight 2 with 1.5 of air needs 8.5 · 8 of radius at 20 · 16 inside 8 · 7. Ink box identical, box-centred. Reads "live" more than "status" — likely its own concept -->
