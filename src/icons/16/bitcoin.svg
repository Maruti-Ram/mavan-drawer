  <!-- Upright, spurs: Upright with spurs: A, plus the top and bottom bars run 1.5 · 1 · 1 past the stem to the left — the spur the Bitcoin logo, Lucide, Nucleo and Central all draw. It reads as “the Bitcoin B” rather than a B with ticks, at the cost of a serif in a sans family. Placed by the € rule: the B body is centred exactly as in A, and the spurs hang outside the centring, so optical −0.75 · −0.5 · −0.5. Ink 11×18 · 9×14 · 9×12. The B is the $’s height: letter 13.5 · 10.5 · 9.25 tall, ticks standing 2.25 · 1.75 · 1.375 past it as the $’s stubs do, so the whole sign is 18 · 14 · 12, the same as the $. Top bowl a touch smaller than the bottom, in the oval language of the € and $: it reaches 7.25 · 6 · 6.125 from the stem against the bottom’s 8 · 6.5 · 6.75 (0.91), and its oval ends are rx×ry 3.25×2.88 / 3.5×3.13 · 2.5×2.13 / 2.75×2.38 · 2.25×1.94 / 2.5×2.06, the middle bar a hair above centre. Two ticks, 4 · 3.5 · 3.5 apart — the €’s bar spacing, which is also the closest two ticks can sit and keep 1.5 of white in the filled twin. Counters stay open at every master: white 4.25 / 4.75 · 2.75 / 3.25 · 2.63 / 2.88 tall in outline, 2.75 / 3.25 · 2 / 2.5 · 1.63 / 1.63 filled (at 16 the filled middle bar sits on 8, so both filled counters keep 1.63). Filled at 2.5 · 2 · 2, ends pulled in so the ink box is identical. At 16 the spur and tick meet the stem in a small cross at each corner, busier than A in real pixels but every gap holds. Lint clean. -->
