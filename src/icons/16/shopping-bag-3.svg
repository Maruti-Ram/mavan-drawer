<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: fold, band, smile handle, lucide, untitled -->
  <!-- Box, fold band, smile handle: An upright box with a band across the top (the folded gusset) and the handle drawn on the face as a smile (Lucide shopping-bag, Untitled shopping-bag-01). Lucide chamfers the shoulders; they are kept square here because a chamfered box with a lid line is our package. Ink 16×20 · 12×16 · 10×14, portrait keyline, corners 2.5 · 2 · 1.5. Band at 6.75 · 6 · 4.375, 2.5 · 1.75 · 1.5 of air above it. Smile a half circle, radius 3.5 · 2.25 · 1.625, its ends 1.75 · 1.5 · 1.75 under the band and 2.25 · 1.5 · 1.5 off the walls — the wall sets its size, which is why the smile is small at 16 (4.5 px of ink). Filled: the band becomes a 1.5 cut (6 → 7.5 · 5.25 → 6.75 · 3.75 → 5.25; at 16 it shares the line's top edge, as briefcase), cut corners eased 0.5; the smile a 1.5 cut of the body; 1.75 · 1.5 · 1.375 of material between band cut and smile (floor 1.5 · 1.5 · 1.25). Most familiar from Lucide and Feather, but at 16 it is a jar or a cup as much as a bag. -->
  <path d="M3.625 12.875V3.125A1.5 1.5 0 0 1 5.125 1.625H10.875A1.5 1.5 0 0 1 12.375 3.125V12.875A1.5 1.5 0 0 1 10.875 14.375H5.125A1.5 1.5 0 0 1 3.625 12.875Z"/>
  <path d="M3.625 4.375H12.375"/>
  <path d="M9.625 7.375A1.625 1.625 0 0 1 6.375 7.375"/>
</svg>
