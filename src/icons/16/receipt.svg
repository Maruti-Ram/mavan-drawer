  <!-- tags: torn, zigzag, slip, bill, invoice, total -->
  <!-- Two notches at 16, set corners: A1c exactly — A1a's even teeth at 24 and 20 (inner teeth symmetric, flanks 45°, corner half-teeth 2.75), two notches at 16 (5.875 / 10.125 on 12.375, 2 deep, flanks 41.6° · 43.3°, each notch two white pixels in real pixels), A1's lines (7 / 11 / 15 · 7 / 11 · 5.625 / 8.625, the total half the long line, its ink ending on the canvas centre) — but the top corners at the set's radius for paper and containers, r 2.5 · 2 · 1.5 as file, file-text, clipboard, credit-card, calendar, package and printer (only bookmark and tag use 1.5 · 1.25 · 1). The ghost concern, measured: at 16 in real pixels the filled slip's top corners render 33% / 78% (corner pixel / its neighbours), the same as clipboard-filled's 33% / 78% and one grey step lighter than A1c's 44% / 89%; nothing else differs by a pixel. Beside file-filled and clipboard-filled at 16, 1× and 2×, it reads as a slip of the same family, not a ghost: the ghost read shows only blown up large, where the round head, zigzag hem and two short cuts are all visible at once, and that is not how the icon is seen. Air to the notches 2.19 · 2.69 · 2.27; notch white 1.94 · 1.44 · 1.77. Filled as A1a: outer top corners r 3.25 · 2.75 · 2.125, tips rounded by half the weight, lines cut 1.5 wide; ink box 16×20 · 12×16 · 10×14 in both styles. Bottom-right is a tip at every master: receipt-refund cuts back the right tooth, and at 16 keeps the middle tip and the left tooth. (recommended) — the tear reads in real pixels at 16 and the slip keeps the set's container radius beside file-text. -->
