<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: coil, curl -->
  <!-- glyph: dot -->
  <!-- Coil: the bowl runs on to 60 deg and a reverse arc of the same radius lands the terminal on the axis — the longest tail of the three, so the smallest bowl (counter 3.5 · 2.5 · 2). 16 is shared with help, and measured 2026-09-18 rather than assumed: at 16 this construction has no legal drawing. The full curl closes its own mouth to 0.97 at r1.5 and 0.56 at r1.25, against C19's 1.0; every legal truncated curl either bows under 0.05 units off a straight tail or, to put the terminal on the axis, hangs the mark 1.1 left of centre. With centring in the search there are zero. So 16 keeps the shared bowl: counter 2, mouth 1.45, dot at 11. -->
