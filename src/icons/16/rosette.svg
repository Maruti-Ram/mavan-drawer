  <!-- Rosette: Rosette, ring cut: Today’s rosette with A’s ring cut in the filled twin (recommended for the rosette, at every master). The ring cut is a plain 1.5 white circle whose outer edge touches the ink’s inner edge at the eight valleys, so the rim is the outline’s own ink there — 1.51 · 1.51 · 1.25, the radius rounded down to the grid (4.46 · 3.69 · 3.159 for an exact 4.470 · 3.697 · 3.159) so it never dips under the weight — and the lobes are left solid outside it (lobe ink from the white’s edge to the peak 2.54 · 2.31 · 1.84); the face is a dot ⌀ 5.92 · 4.38 · 3.32 (r 2.96 · 2.19 · 1.659; lint reads the island 5.8 · 4.3 · 3.25), against A’s 8 · 5 · 4.5. The other honest construction — the white following the scallops’ inner line into the bays, its inner edge the 1.5 offset of that line, arcs of r 3 · 3 · 2.75 about the fillet centres meeting in cusps on the lobe rays — was drawn and measured: the face becomes an eight-petal flower r 2.96 at the valleys and 3.57 · 2.56 · 1.90 at the tips, the white 1.5 at the valleys and 1.93 · 1.94 · 1.85 deep in the bays. In real pixels the petals read at 24 only; at 20 and 16 the white turns lumpy and the face a ragged blob, so the circle is the one on the board (the generator keeps the other). Every white is 1.5 at every master; the ring cut holds at all three. Real pixels: at 16 the face is a 3-pixel dot inside a visible white ring, and the scallops read as a rough rim — a ring medal, where the solid 16 is a blob with a tab; at 20 the face is 4 px and the ring clean. Outline unchanged from round two: eight lobes r 1.75 · 1.5 · 1.375 on r 4.5 · 3.75 · 3, fillets 0.75 · 0.75 · 0.625, peaks on r 6.25 · 5.25 · 4.375, valleys on r 5.22 · 4.45 · 3.78, fillet centres on r 5.97 · 5.2 · 4.41, bookmark-3’s ribbon with legs 8/16 · 7/13 · 5.625/10.375; ink 14x20 · 12x16 · 10x14, the 20 declared. All off-grid decimals are tangent points between arcs (tools-generated, 2 · 2 · 3 dp). -->
