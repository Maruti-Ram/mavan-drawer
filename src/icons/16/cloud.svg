  <!-- Two puffs: Rhythm: one big puff and one small, a single notch. Big puff r 5.75 · 4.75 · 3.875 spans the full height; small puff r 3.75 · 2.75 · 2.5 (0.65 · 0.58 · 0.65 of the big one), centre 2 · 2 · 1.375 lower. The notch turns 94° · 86° · 93° and sits 62 · 58 · 61% up, at x 15.2 · 13.4 · 10.2. The 20 master is the odd one out (smaller puff, shallower notch) because its box is the tallest of the three (1.45 against 1.54 · 1.56). Balance: mass 0.34 · 0.32 · 0.24 left of centre (outline; 0.63 · 0.56 · 0.45 filled) — the big puff is on the left, as in every two-puff cloud; not corrected. Ink 20×13 · 16×11 · 14×9, filled identical, 1.54 · 1.45 · 1.56 wide for its height (SF Symbols' cloud is 1.51); the full width of the circle keyline. Lifted 0.5 at every master (optical 0 −0.5, as alert-triangle): a cloud's mass sits low, measured 0.76–1.15 below the box centre at 24 without the lift (outline), and the lift also puts the flat base on a whole pixel (18 · 15 · 12). Puffs are circles on the quarter grid (eighth at 16); the ends sit on the base, so the bottom corners are the puffs themselves. Notches are filleted 1.5 · 1.5 · 1.25 on the line, 0.75 · 0.75 · 0.625 on the outer edge (half the weight, C10; the held cloud-download's notch). Off-grid values are the tangent points the circles put there. Who: Lucide and Feather cloud, Phosphor (mirrored), Nucleo 12px, Untitled UI cloud-01 — and the held cloud-download (2026-10-18), whose cloud is this one to the unit (r 5.75 / 3.75 at 24, same notch) with an open base, 2 narrower. Composites: an arrow through the base on the centreline passes 3.2 left of the notch, through the big puff — works (Lucide's cloud-download). A bottom-right badge (C33, ~9×9 at 24 with 1.5 cut back) takes almost all of the small puff, leaving one round lump — the weakest of the five for badges. -->
  <path d="M5.5 11.375A3.875 3.875 0 0 1 1.625 7.5A3.875 3.875 0 0 1 5.5 3.625A3.875 3.875 0 0 1 9.071 5.994A1.25 1.25 0 0 0 10.773 6.631A2.5 2.5 0 0 1 11.875 6.375A2.5 2.5 0 0 1 14.375 8.875A2.5 2.5 0 0 1 11.875 11.375H5.5Z"/>
