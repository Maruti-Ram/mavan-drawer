  <!-- tags: compass, navigation, explore, direction, diagonal, diamond, split, two-tone -->
  <!-- North solid, south outlined: What the eye sees: round 1's B filled turned white-on-dark — the north half a solid white triangle, the south half only a white outline with a dark triangle of disc left inside it, so the needle reads as one filled half and one open half, the classic two-tone needle. The white line round the south island is 1.5 wide at every master: the outline's needle stroke at 24 and 20; at 16, where the stroke is 1.25, the knocked-out needle stands 0.25 proud of the outline's ink all round (knock-out corners r1.5 on the outline's own corner centres, was r1.25; its decimals 11.531, 6.392, 10.399, 9.502, 4.469, 9.608, 5.601, 6.498 are those centres moved 1.5 out square to the 20° and 70° edges), so the band holds the 1.5 floor for a strip between parts (2026-09-28; was 1.25), and the island is the outline's own south counter (sharp corners, as every stroked counter is): at 24 and 20 it stops at the split line's edge and holds a circle of 2.82 · 1.63; at 16, with no split line, it runs to the waist and holds 1.78. At 20 and 16 that island is under two pixels across — the busiest answer at small sizes; at 16 it keeps its 1.78, and the needle grows round it rather than the island shrinking (an island cut 0.25 smaller would hold 1.43). Filled: the disc solid (ink ⌀20 · 16 · 14, as clock and target), the needle knocked out at the outline's ink size at 24 and 20 and 0.25 larger all round at 16 (9 long, was 8.5); the disc is the ink, so the filled ink box is the outline's at every master. Disc left round the tips 3 · 3 · 2.5 (2.75 before the 16 band was widened). Outline: B from round 1, byte for byte — the 45° diamond needle (tip 50°, edges at 20° and 70°, cursor's angle exception) with a line across its waist at 24 and 20; at 16 the line would leave each half 1.41, under the 1.5 floor, so the 16 has no line. Needle ink 14 · 10 · 8.5 long, tips 1.5 inside the ring; ring is clock's (ink ⌀20 · 16 · 14). (recommended: only the filled 16 changes; the island keeps its 1.78 and the needle grows a quarter all round, which also brings the 16 needle to 0.64 of the disc, between 20's 0.63 and 24's 0.7) -->
  <path d="M1.625 8A6.375 6.375 0 1 0 14.375 8A6.375 6.375 0 1 0 1.625 8Z"/>
