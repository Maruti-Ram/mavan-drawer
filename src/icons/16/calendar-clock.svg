  <!-- box: 13x13 -->
  <!-- hands: clock -->
  <!-- Hands on the ring's centre at 16: The same calendar-clock as D, with one change at 16: the clock's hands pivot on the ring's centre (11,11), as they do at 24 and 20, instead of 0.5 left and 0.375 below it (10.5,11.375), so the minute hand stands on the clock's 12 o'clock line. Outline at 16: minute 1.125 long, tip air 1 to the ring (C38), reaching 0.64 of the face; hour at 45 deg, 0.71 of it (0.8; end 11.565, off-grid for the ratio). Filled at 16: the white minute 1.75 long, reaching 0.625 of the disc (E2's 0.63 at 20), the white hour 0.71 of it (end 11.879); knockout 1.5 wide, 0.53 = 0.75 / root 2 at the round join and cap, inside corner 0.31 above the pivot. The cost: on the centre the hands sit across two pixel columns at 16 instead of one, so they render a shade softer; the clock reads balanced. 24 and 20 unchanged. The clock is now file-clock's shipped clock. The ring is the same as before (ink 11 · 9.5 · 8, centreline radius 4.75 · 4 · 3.375, centre 16.5 · 13.25 · 11) and the hands are file-clock's, at 12 and 4:30 as the shipped clock and alarm-clock draw them, the strings copied from file-clock.svg and file-clock-filled.svg: minute 2.25 · 1.5 · 1.375 long, reaching 0.75 · 0.69 · 0.63 of the face, hour at 45 deg and 0.71 of the minute, tip air to the ring 1 · 1 · 1.01 under C38. The board declares hands: clock, which replaces the file-wide gap 1 this draft carried, so lint now holds the calendar's cut to a plain 1.5 itself. In the filled twin the white hands are a step longer than the outline's, as in file-clock-filled: the minute 2.75 · 2.25 · 2 long, reaching 0.64 · 0.63 · 0.61 of the disc's radius, the hour at 45 deg and 0.71 of it; at 16 the pivot sits 0.5 left and 0.375 below the ring's centre (10.5,11.375) so the minute fills one pixel column. The calendar and its cut are as drawn before. The shipped calendar, unchanged and in place, with the clock as a C33 badge on its bottom-right corner, the ink corner on the margin edge (22 · 18 · 15). Composite ink 19×19 · 15×15 · 13×13, centre 0.5 toward the badge, calendar-repeat's box at every master, declared as box (no base note). Cut back by hand with 1.5 of air from the clock's ink (base centrelines 7.75 · 7 · 6.125 from its centre): 24: header line to x 12.5 (no longer whole), top-right corner kept (its end 2.81 from the ring), right wall gone (1.47 at most would be left past the corner), bottom wall to x 9.5, 3.25 past its corner; 20: header line to x 7.75, top wall to x 14.25 where its corner began (the corner's end would sit 0.77 from the ring, so corner and right wall go), bottom wall gone (1.18 at most would be left past its corner), the corner kept; 16: header line to x 5.875, top wall to x 11.875 where its corner began (the corner's end would sit 0.80 from the ring), bottom wall gone (1.23 at most), the corner kept. Both pegs stay at every master (the right one 2.0 · 1.78 from the ring at 20 · 16), with the top wall and the left side whole. Tightest air, calendar to clock, outline 1.60 · 1.61 · 1.51 (the header line's end at every master), filled 1.50 · 1.51 · 1.50. Filled: calendar-filled's header and page cut along the clock's ink grown 1.5 (a circle of radius 7 · 6.25 · 5.5), junctions eased 0.5; the clock is file-clock-filled's solid disc with the white hands above. Where the outline's wall ends in a round cap, the filled sheet ends on that cap, in the same place and at the cap's radius (0.75 · 0.75 · 0.625), so the two outer edges agree: at 24 the header's bottom-right is the right corner's cap (the right wall is gone) and the page's bottom ends on the bottom wall's cap at x 10.25, then rises straight into the cut; at 20 and 16 the header ends on the top wall's cap at x 15 · 12.5 (its corner 2.18 · 1.66 from the cut) and drops straight into the cut. White above the disc 2.0 · 1.5 · 1.5: at 24 the header stays whole, at 20 and 16 the cut bites it. 24: the cut rises 1 above the page's top edge, and following it there would leave a horn of sheet 1.2 thick under the header cut, under the line weight, so the page ends at x 10.25 (its corner 1.66 from the cut) and drops into the cut. 20 and 16: the header is bitten from x 9.71 · 7.03. The outline's last bottom ink there is the bottom-left corner's cap (x 6.5 · 4.75), so the page ends on that cap and rises straight at x 6.5 · 4.75 into the header cut, eased 0.5, as at 24 and as credit-card-percent does; the cost is that the white between page and clock widens to 2.0 · 2.25 at its narrowest instead of the cut's even 1.5. Both pegs stay lines. Off-grid decimals: the outline's hour hand end (17.63 at 24, 11.19,12.065 at 16, 45 deg at 0.71) and, in the filled knockout, the 45-deg tangent points of the round join and cap (0.53 = 0.75 / root 2) and the inside corner 0.31 above the pivot, all file-clock's; in the filled twin also the cut's tangent points and 0.5 fillets, rounded away from the clock so the air never measures under 1.5. At real pixels both pegs and the top edge carry the calendar at 20 and 16; the calendar gives up its top-right corner and its bottom wall there, so its left side reads a little like an F. -->
