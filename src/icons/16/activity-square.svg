  <!-- tags: pulse, heartbeat, square, monitor, health, status -->
  <!-- Wall to wall: The square is square's (checkbox's) path verbatim. The spike is activity-circle's to the hundredth at every master, in both styles: legs at 1 x 3, 10.5 · 7 · 6 tall, 8.16 · 5.82 · 4.97 between the bend vertices, centred on 12 · 10 · 8. Only the flats change: they run on into the side walls and join them, ending on the walls' centrelines with the round caps buried in the wall, as the trace runs edge to edge on a monitor screen and as credit-card's stripe meets its walls. Nucleo's square-activity-chart does this at both its grids. The flats read from the wall's inner edge to the bend: 3.42 · 2.59 · 2.27, the bare activity's proportion (3.34 · 2.67 · 2.56), against the ring's 1.92 · 1.21 · 1.02. Air: spike tips to the top and bottom walls 2.25 · 2 · 1.75; flat to the long leg 2.88 · 1.77 · 1.53, the ring's own, so the spike keeps 1.5 to itself at every master. The wedge inside the spike opens to 1.5 of air 74% down at 24 and never at 20 or 16, as in the shipped ring. Where the trace meets a wall the white corners are square. At 16 the flats sit on y 8, as activity-circle's and activity's do. Filled: the solid square with activity-circle-filled's cut verbatim through the spike (1.5 wide, outer edge radius 1.5, inner corners sharp). Its flats run on to the walls' inner edges (4.5 / 19.5 · 4.5 / 15.5 · 3.25 / 12.75) and stop there with square ends, so the walls stay whole at the line weight (1.5 · 1.5 · 1.25), the tile is one piece and its silhouette is the plain square's. Cutting through to the edge, as credit-card-filled's stripe does, would notch both sides and split the tile in two (C18 tried a cut to the edge for a breakout ring and did not take it). The square white corners stand against a line-weight wall, so C1 exempts them; the rest of the cut is a slit. Material: cut tips to the edge 3.75 · 3.5 · 3; at the spike's mouth 2.88 · 1.77 · 1.46 against the floor 1.5 · 1.5 · 1.25. Ink box is the square's, 18 · 14 · 12. Measured and not drawn: the spike grown to the square's height (12 · 8 · 6.5 tall) opens the wedge at 64% at 24 and 97% at 20, still never at 16, and leaves activity-circle's spike. -->
