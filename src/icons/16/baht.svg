  <!-- Thin line, ₿’s B: Outline is A’s, verbatim. Filled: the B goes to 2.5 · 2 · 2 exactly as the shipped ₿-filled does, and the line stays at the outline weight, 1.5 · 1.5 · 1.25, the way a C32 letter keeps its weight. White beside the line: 1 / 1.25 · 1 / 1 · 1 / 1.13 in the top counter and 2 · 1.5 · 1.75 to the bottom bowl, against A’s 0.5 · 0.75 · 0.63. Filled files carry gap 1. Why the line thins and the bowls don’t: thinning the bowls alone can’t make room at 16. Even with the bowls back at 1.25, a line 2 wide keeps only 1.06 of white each side. The ₿ and ฿ share one B: same stem, bowls and middle bar, ink 9.5×18 · 8×14 · 8×12. At 16 it reads as ฿ in both styles; the thinner line is clearly a line, not part of the letter. Needs Maruti’s ruling: this widens C32’s letter note to a sign’s own line, a new use. -->
  <path d="M4.625 7.875H8.875A2.5 2.063 0 0 1 11.375 9.938A2.5 2.063 0 0 1 8.875 12H4.625"/>
  <path d="M4.625 4H8.5A2.25 1.938 0 0 1 10.75 5.938A2.25 1.938 0 0 1 8.5 7.875"/>
  <path d="M4.625 4V12"/>
  <path d="M7.625 2.625V13.375"/>
</svg>
