<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round">
  <!-- tags: email, envelope, letter, subscribe, mailing -->
  <!-- box: 14x12 -->
  <!-- Letter rising from an open envelope: Rhythm: two lines at 24 on pitch 3.5 (gap 2), 8 long, 1.5 of air to the letter's top and both sides; one line at 20 and 16, because the envelope's mouth rises to meet a second one (at pitch 3 it would keep 0.94 · 0.5 of air, not 1.5), so 20 drops it as well as 16. Picture: Polaris EmailNewsletter, Nucleo envelope-content, FA envelope-open-text: a letter standing in an open envelope. Pocket = mail without its top edge: mail's walls, width (18.5 · 14.5 · 12.75), corners (2.5 · 2 · 1.5) and flap verbatim (29.6 · 28.9 · 28.8°, point r 3 · 2.5 · 2), the flap line now the pocket's mouth, round joins at its two top corners. Not mail's height: the letter needs the top half, so the pocket is 8 · 6.75 · 6 tall (letter rises 52 · 46 · 44% of the height); mail-2's shallower flap was tried and read as inbox's tray at 16. Air under the point 1.7 · 1.61 · 1.53. Letter 12.5 · 9.5 · 8.25 wide (68 · 66 · 65% of the envelope), corners at the detail radius 1.5 · 1.25 · 1 (the container radius read as a bag handle); its sides stop with 1.5 · 1.68 · 1.59 of air above the mouth, cut back as badges and back figures are. Box 20x18 · 16x14 · 14x12 (desktop's agreed box), centred. Filled: pocket solid on the same silhouette; letter solid down to a 1.5 white band parallel to the mouth (tip r 0.75 at 24, 0.25 at 20; at 16 the offset lines cross, softened r 0.25), lines 1.5 slots. Off-grid values are the mouth's tangent points and offsets and the r 0.5 corner fillets, as mail-filled. Risk at 16: the letter shrinks to a short cap with one line and can read as inbox with a sheet, a printer or a bag. -->
  <path d="M1.625 7.375L7.037 10.347A2 2 0 0 0 8.963 10.347L14.375 7.375V11.875A1.5 1.5 0 0 1 12.875 13.375H3.125A1.5 1.5 0 0 1 1.625 11.875Z"/>
