  <!-- Sun behind a cloud: A cloud in front, the sun peeking out behind its upper right — Lucide cloud-sun construction. The sun is the shipped sun, core and rays, at the canvas centre, untouched; the cloud is cloud (two puffs: the big puff left is the bulk, the small puff right sits lower, so the right ray stays clear — cloud-2's taller right puff would cut it, cloud-3's inner arc is already busy). At 24 the cloud is the shipped 20-master cloud drawing (r 4.75 / 2.75, notch fillet 1.5, 16×11) set on the margin (left ink 2, base ink 22); at 20 and 16 the same construction one step smaller, 13×8.5 (r 3.5 / 2.25, centres 5.75 apart, fillet 1.5) and 11.5×7.5 (r 3.125 / 2, centres 5.125 apart, fillet 1.25) — 0.80 · 0.81 · 0.82 of the box. Cut back by hand with 1.5 of air from the cloud's ink (C33): the core arc runs from −13.6° to 125.6° · 4.1° to 122.0° · 8.5° to 114.2° (139° · 118° · 106°; 8.5 · 5.66 · 4.38 long), its caps 1.50 from the puffs, apex pinned at the core's top; four rays stay whole (top, both upper diagonals, right — the right ray clears the small puff's ink by 3.38 · 2.5 · 2.2, the upper-left ray's inner cap clears the big puff by 2.85 · 2.82 · 2.51), four lie inside the cloud with nothing left past the air, so they go, no stubs. Ink 20×20 · 16×16 · 14×14 (top ray, right ray, cloud's left and base: the circle keyline), centred, no box note. Off-grid decimals are the cut ends and the notch tangents. Filled: the cloud solid (its own filled drawing), the sun's disc (r 4.25 · 3.5 · 3) cut back behind a 1.5 white band that follows the puffs (arcs concentric with them, meeting above the notch), rays stay 1.5 · 1.5 · 1.25; the band is 1.5 at 16 too. Ships as its own concept cloud-sun. Reads at once at 16: cloud, sun behind. -->
