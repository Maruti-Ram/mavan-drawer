<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Slot test</title>
<!-- Do status icons sit level when they swap in the same slot? One row per icon, at real size,
     in the places they actually swap: a list row, a toast, an icon button. Shipped icons come from
     lab/manifest.json; candidates on the board (lab/drafts/current.js) are added, so a proposed
     shift can be read beside the shipped set. Nothing here decides anything — it is a looking page. -->
<style>
 :root{--bg:#121212;--panel:#1a1a1a;--ink:#f4f4f4;--muted:#8a8a8a;--line:#2b2b2b;--toast:#202020}
 :root.light{--bg:#fafafa;--panel:#fff;--ink:#141414;--muted:#6b6b6b;--line:#e4e4e4;--toast:#f1f1f1}
 body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
 header{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
 h1{font-size:13px;margin:0;font-weight:600}
 .sub{color:var(--muted)}
 button{font:inherit;color:var(--ink);background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
 button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
 main{padding:18px 20px 60px;display:grid;gap:26px}
 .block{display:grid;gap:8px}
 h2{font-size:12px;margin:0 0 2px;font-weight:600}
 h2 span{color:var(--muted);font-weight:400}
 table{border-collapse:collapse;width:100%;max-width:1180px}
 th{font-weight:400;color:var(--muted);text-align:left;font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:0 10px 6px 0}
 td{padding:5px 10px 5px 0;vertical-align:middle;border-top:1px solid var(--line)}
 td.name{color:var(--muted);white-space:nowrap}
 td.name b{color:var(--ink);font-weight:600}
 .row{display:flex;align-items:center;gap:9px}
 .rule{position:relative}
 .rule::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed color-mix(in srgb,var(--muted) 45%,transparent)}
 .toast{display:flex;align-items:center;gap:10px;background:var(--toast);border:1px solid var(--line);border-radius:9px;padding:10px 13px;max-width:330px}
 .btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px}
 svg{display:block;color:var(--ink);flex:none}
</style>
<header>
  <h1>Slot test</h1>
  <span class="sub">do the status icons sit level when they swap in the same place?</span>
  <span style="flex:1"></span>
  <button id="style" aria-pressed="false">Filled</button>
  <button id="rule" aria-pressed="false">Centre line</button>
  <button id="theme" aria-pressed="false">Light</button>
</header>
<main id="main"></main>
<script type="module">
const man = await (await fetch(`./manifest.json?${Date.now()}`)).json();
let draft = { candidates: [] };
try { draft = (await import(`./drafts/current.js?${Date.now()}`)).default; } catch {}

// The slot: status icons that share the ring, plus every info style, plus board candidates.
const SHIPPED = ['check-circle', 'x-circle', 'plus-circle', 'minus-circle', 'info', 'info-2', 'info-3'];
const CAND = draft.candidates.filter((c) => /^(P|S)/.test(c.id));
const MASTERS = [24, 20, 16];
const body = (name, m, filled) => man.masters[m].icons[filled ? `${name}-filled` : name]?.body ?? '';
const draw = (c, m, filled) => filled
  ? (c.filled[m].fill ?? []).map((d) => `<path fill="currentColor" fill-rule="evenodd" stroke="none" d="${d}"/>`).join('')
    + (c.filled[m].stroke ?? []).map((d) => `<path d="${d}"/>`).join('')
  : c.masters[m].map((d) => `<path d="${d}"/>`).join('');
const svg = (inner, m, px = m) => `<svg width="${px}" height="${px}" viewBox="0 0 ${m} ${m}" fill="none"
  stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${inner}</svg>`;
const rows = [
  ...SHIPPED.map((n) => ({ label: n, at: (m, f) => svg(body(n, m, f), m) })),
  ...CAND.map((c) => ({ label: `${c.id} · ${c.label}`, cand: true, at: (m, f) => svg(draw(c, m, f), m) })),
];
const CONTEXTS = [
  ['In a list row', 'each master beside 14px text, on one baseline', (r, f) =>
    MASTERS.map((m) => `<span class="row">${r.at(m, f)}<span style="font-size:14px">More information</span></span>`).join('')],
  ['In a toast', 'the swap that matters: same box, different status icon', (r, f) =>
    `<span class="toast">${r.at(20, f)}<span style="font-size:14px">Your changes were saved</span></span>`],
  ['Icon buttons', '32 and 28 square, 32 circle', (r, f) =>
    `<span class="row">${[[32, 8], [28, 8], [32, 999]].map(([s, rad]) =>
      `<span class="btn" style="width:${s}px;height:${s}px;border-radius:${rad}px">${r.at(20, f)}</span>`).join('')}</span>`],
  ['Side by side', 'nothing else in the way — 24, 20, 16', (r, f) =>
    `<span class="row">${MASTERS.map((m) => r.at(m, f)).join('')}</span>`],
];
function render() {
  const f = style.getAttribute('aria-pressed') === 'true';
  main.innerHTML = CONTEXTS.map(([title, note, cell]) => `<section class="block">
    <h2>${title} <span>· ${note}</span></h2>
    <table><tr><th style="width:230px">Icon</th><th>${f ? 'Filled' : 'Outline'}</th></tr>
    ${rows.map((r) => `<tr><td class="name">${r.cand ? `<b>${r.label}</b>` : r.label}</td>
      <td class="cell"><span class="row">${cell(r, f)}</span></td></tr>`).join('')}
    </table></section>`).join('');
  document.querySelectorAll('td.cell').forEach((td) => td.classList.toggle('rule', rule.getAttribute('aria-pressed') === 'true'));
}
for (const b of [style, rule, theme]) b.onclick = () => {
  b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true');
  document.documentElement.classList.toggle('light', theme.getAttribute('aria-pressed') === 'true');
  render();
};
render();
</script>
