<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The wall</title>
<style>
/* The wall (audit card 4.1): every concept in lab/manifest.json at real pixels, in rows of twenty, sorted and lit by
   the numbers in lab/audit-data/wall.json (tools/audit/wall-data.mjs, measured on the pinned tree). Tokens copied
   from library.html and figures.html; there is no shared stylesheet. */
:root{--bg:#f6f6f4;--panel:#fff;--inset:#fafaf9;--ink:#16171a;--muted:#7a7c82;--faint:#a4a6ab;--line:#e7e7e4;--accent:#2f6feb;--done:#1f9d55;--review:#d18a00;--sel:#0d99ff;--hover:rgba(0,0,0,.04);--tint:rgba(0,0,0,.035);--shadow:0 1px 2px rgba(0,0,0,.04)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0e0f11;--panel:#16171a;--inset:#1b1c20;--ink:#eceef2;--muted:#8b8e96;--faint:#5d6068;--line:#26282d;--accent:#5b8cff;--done:#3fbf78;--review:#e6a52e;--sel:#2ea8ff;--hover:rgba(255,255,255,.05);--tint:rgba(255,255,255,.04);--shadow:none}}
:root[data-theme="dark"]{--bg:#0e0f11;--panel:#16171a;--inset:#1b1c20;--ink:#eceef2;--muted:#8b8e96;--faint:#5d6068;--line:#26282d;--accent:#5b8cff;--done:#3fbf78;--review:#e6a52e;--sel:#2ea8ff;--hover:rgba(255,255,255,.05);--tint:rgba(255,255,255,.04);--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
svg{display:block;overflow:visible;flex:none}
button{font:inherit;color:inherit}
a{color:inherit}
code{font:12px/1 ui-monospace,SFMono-Regular,Menlo,monospace}
kbd{font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace;display:inline-block;min-width:18px;text-align:center;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:2px 4px;background:var(--panel);color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* ── app header (library.html) ── */
.app{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.app .top{display:flex;align-items:center;gap:16px;padding:16px 24px;flex-wrap:wrap}
.ident{display:flex;align-items:center;gap:12px;flex:1;min-width:220px}
.glyph{width:40px;height:40px;border-radius:10px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;box-shadow:var(--shadow);color:var(--ink)}
.ident>div{min-width:0}
.ident h1{font-size:18px;line-height:22px;margin:0;font-weight:600;letter-spacing:-.01em}
.ident p{margin:2px 0 0;font-size:12px;line-height:18px;height:18px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.divider{width:1px;height:20px;background:var(--line);margin:0 4px}
.back{font-size:12px;color:var(--muted);text-decoration:none}
.back:hover{color:var(--ink)}
.seg{display:inline-flex;height:28px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.seg button{font-size:12px;padding:0 9px;border:0;border-radius:5px;background:none;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--hover);color:var(--ink)}
.tbtn{height:28px;display:inline-flex;align-items:center;gap:6px;padding:0 8px 0 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);font-size:12px;cursor:pointer;white-space:nowrap}
.tbtn:hover,.tbtn.on{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.tbtn .k{color:var(--muted)}
.tbtn .v{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;text-align:left}
.tbtn svg{color:var(--muted)}
.tbtn[disabled]{opacity:.45;cursor:default}
.pop{position:relative}
.lmenu{position:absolute;right:0;top:calc(100% + 6px);width:300px;max-height:min(70vh,560px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.16);padding:4px;z-index:15}
.msec{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding:8px 8px 2px}
.mrow{display:flex;align-items:flex-start;gap:10px;width:100%;padding:5px 8px;border:0;border-radius:6px;background:none;color:var(--muted);font-size:13px;cursor:pointer;text-align:left}
.mrow:hover{background:var(--hover)}
.mrow.on{color:var(--ink)}
.mrow[disabled]{opacity:.45;cursor:default}
.mrow .mt{flex:1;min-width:0}
.mrow small{display:block;font-size:11px;color:var(--faint);line-height:1.35;margin-top:1px}
.mrow .ck{margin-left:auto;opacity:0;margin-top:3px}
.mrow.on .ck{opacity:1}
.msep{height:1px;background:var(--line);margin:4px 6px}

/* ── layout: the wall left, the icon panel right; nothing sits below the wall, so Both can grow it ── */
main{display:grid;grid-template-columns:minmax(0,1fr) var(--side,288px);gap:16px;align-items:start;padding:24px 24px 80px}
@media (max-width:1200px){main{padding:16px 16px 80px}}
/* the icon panel folds to a strip (R), as the drawing board's sidebars do; the wall does not move when it folds */
body.side-collapsed{--side:44px}
body.side-collapsed .side>.panel{display:none}
.strip{display:none;flex-direction:column;align-items:center;gap:10px;padding:10px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
body.side-collapsed .strip{display:flex}
.strip .cap{writing-mode:vertical-rl;transform:rotate(180deg)}
.iconbtn{flex:none;width:28px;height:28px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;padding:0}
.iconbtn:hover{color:var(--ink)}
.iconbtn.ghost{border-color:transparent;background:none}
.iconbtn.ghost:hover{background:var(--hover)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px 20px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid var(--line);min-height:57px}
.pt{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 260px}
.pt h2{font-size:14px;line-height:21px;font-weight:600;margin:0;white-space:nowrap}
.pt p{flex:1;margin:0;font-size:12px;line-height:18px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pa{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
/* the wall's header: two fixed rows (what you see · what you look for), so folding the panel or a narrower window never
   re-wraps it and the wall below never moves */
.ph.wallhead{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-rows:28px 28px;gap:8px 16px;align-items:center;height:92px;padding:14px 20px}
.wallhead .pa{flex-wrap:nowrap}
.wallhead .pd{margin:0;font-size:12px;line-height:18px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pill{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;background:var(--hover);color:var(--muted);font-size:11px;font-weight:500;white-space:nowrap}

/* the strip that says what the highlight is and where it comes from: fixed two lines */
.lead{display:grid;grid-template-columns:auto 1fr;gap:0 10px;align-items:center;height:56px;padding:9px 20px;border-bottom:1px solid var(--line);background:var(--inset);font-size:12px;color:var(--muted)}
.lead .sw{grid-row:1/3;width:14px;height:3px;border-radius:2px;background:var(--line)}
.lead.on .sw{background:var(--accent)}
.lead b{color:var(--ink);font-weight:500}
.lead div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:19px;height:19px}

/* the wall: twenty to a row; pitch fixed for the session from the screen's pixel ratio */
.wallscroll{overflow-x:auto}
/* --sx / --sy: the fraction of a device pixel the layout above leaves, put back so every canvas starts on a device pixel */
.wall{display:grid;grid-template-columns:repeat(20,var(--pitch));padding:calc(12px + var(--sy,0px)) 12px 12px calc(12px + var(--sx,0px));width:max-content}
.c{position:relative;width:var(--pitch);height:var(--pitch);padding:0;border:0;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
body.both .c{height:calc(var(--pitch) * 2 - 8px)}
.c canvas{display:block;image-rendering:pixelated;flex:none}
.c canvas.f{display:none}
body.both .c canvas.f{display:block}
.c:hover{background:var(--hover)}
.c.g1{background:var(--tint)}
.c.g1:hover{background:var(--hover)}
.c.sel{box-shadow:inset 0 0 0 2px var(--sel);border-radius:4px}
.c .hl{position:absolute;left:50%;bottom:2px;width:12px;height:2px;margin-left:-6px;border-radius:1px;background:var(--accent);opacity:0}
.c.lit .hl{opacity:1}
body.fade .wall.haslist .c:not(.lit) canvas{opacity:.18}
.c .st{position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;opacity:0}
.c.added{outline:1px dashed var(--review);outline-offset:-3px;border-radius:4px}
.c.added .st,.c.redrawn .st{opacity:1;background:var(--review)}
.c.flag::after{content:"";position:absolute;top:3px;left:3px;width:5px;height:5px;border-radius:1px;background:var(--sel)}
.empty{padding:48px 20px;text-align:center;color:var(--muted);font-size:13px}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}

/* ── the icon panel: one fixed shape whatever is selected ── */
.side{position:sticky;top:calc(var(--head,73px) + 16px);display:flex;flex-direction:column;gap:16px;max-height:calc(100vh - var(--head,73px) - 32px);overflow-y:auto}
.side>*{flex:none}
.side .ph{min-height:57px;padding:0 10px 0 20px;height:57px;flex-wrap:nowrap;gap:8px}
.side .ph .grow{flex:1}
.side .ph b{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.prev{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);height:132px}
.prev>div{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:0}
.prev>div+div{border-left:1px solid var(--line)}
.prev .box{display:grid;place-items:center;width:72px;height:72px}
.prev canvas{image-rendering:pixelated;display:block}
.prev canvas.mag{width:64px;height:64px;background:var(--inset);border:1px solid var(--line);border-radius:3px}
.prev small,.cap{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);white-space:nowrap}
.dsec{padding:12px 20px;border-bottom:1px solid var(--line)}
.dsec:last-child{border-bottom:0}
.dsec h3{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:500;margin:0 0 6px}
.mt2{width:100%;border-collapse:collapse;font-size:12px;table-layout:fixed}
.mt2 th{font-size:10px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);text-align:right;padding:2px 0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt2 th:first-child{text-align:left;width:44%}
.mt2 td{padding:4px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:27px}
.mt2 td:first-child{text-align:left;color:var(--muted)}
.mt2 td.span{text-align:right}
.inl{height:78px;overflow-y:auto;font-size:12px;color:var(--muted);line-height:1.45}
.inl div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inl b{color:var(--ink);font-weight:500}
.links{display:flex;gap:8px;align-items:center;height:28px}
.status{height:18px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status.warn{color:var(--review)}
.flags{height:58px;overflow-y:auto;font:11px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);word-break:break-all}
.keys{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.keys span{display:inline-flex;align-items:center;gap:5px}
details.about summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;padding:0 14px 0 20px;height:49px;font-size:14px;font-weight:600}
details.about summary::-webkit-details-marker{display:none}
details.about summary svg{color:var(--muted);transition:transform .15s}
details.about[open] summary svg{transform:rotate(180deg)}
details.about[open] summary{border-bottom:1px solid var(--line)}
.about .dsec p{margin:0 0 6px;font-size:12px;color:var(--muted);line-height:1.5}
.about .dsec p b{color:var(--ink);font-weight:500}
.about ul{margin:0;padding-left:16px;font-size:12px;color:var(--muted);line-height:1.5}
.about li{margin-bottom:5px}
</style>
</head>
<body>
<header class="app">
  <div class="top">
    <div class="ident">
      <div class="glyph"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 4.75h2M8 4.75h2M13 4.75h2M3 10h2M8 10h2M13 10h2M3 15.25h2M8 15.25h2M13 15.25h2"/></svg></div>
      <div><h1>The wall</h1><p id="subtitle">&nbsp;</p></div>
    </div>
    <div class="actions" id="bar">
      <a class="back" href="library.html">Library</a>
      <span class="divider"></span>
      <span class="seg" id="style"></span>
      <span class="divider"></span>
      <span class="seg" id="theme"></span>
    </div>
  </div>
</header>

<main>
  <section class="panel" id="wallPanel">
    <div class="ph wallhead">
      <div class="pt"><h2>Every icon</h2><span class="pill num" id="count"></span></div>
      <div class="pa"><div class="pop" data-pop="view"></div><span class="seg" id="pixels"></span><div class="pop" data-pop="squint"></div></div>
      <p class="pd" id="desc"></p>
      <div class="pa"><div class="pop" data-pop="sort"></div><div class="pop" data-pop="list"></div></div>
    </div>
    <div class="lead" id="lead"><i class="sw"></i><div id="lead1"></div><div id="lead2"></div></div>
    <div class="wallscroll"><div class="wall" id="wall"></div></div>
  </section>

  <aside class="side" id="side">
    <div class="strip"><button class="iconbtn ghost" id="stripBtn" title="Open the panel (R)" aria-label="Open the panel" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M10 2.75v10.5"/></svg></button><span class="cap">icon panel · R</span></div>
    <section class="panel">
      <div class="ph"><b id="dName">No icon selected</b><span class="grow"></span><span class="pill num" id="dRank">—</span>
        <button class="iconbtn ghost" id="sideBtn" title="Fold the panel (R)" aria-label="Fold the panel" aria-expanded="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="2"/><path d="M10 2.75v10.5"/></svg></button></div>
      <div class="prev" id="prev">
        <div><span class="box"><canvas data-k="1"></canvas></span><small>real · 1×</small></div>
        <div><span class="box"><canvas data-k="2"></canvas></span><small>real · 2×</small></div>
        <div><span class="box"><canvas class="mag" data-k="1"></canvas></span><small>1× enlarged</small></div>
      </div>
      <div class="dsec">
        <table class="mt2"><thead><tr><th id="dView">At this view</th><th>Outline</th><th>Filled</th></tr></thead><tbody id="dNums"></tbody></table>
      </div>
      <div class="dsec"><h3>In the highlight lists, at this view</h3><div class="inl" id="dLists"></div></div>
      <div class="dsec">
        <div class="status" id="dStatus">&nbsp;</div>
        <div class="links"><a class="tbtn" href="library.html" id="dLib" title="Open the Library — it opens on its grid; press / and type the name">Library</a><button class="tbtn" id="dCopy" disabled style="width:84px;justify-content:center">Copy name</button><button class="tbtn" id="dFlag" disabled title="Flag (X)" style="width:64px;justify-content:center">Flag</button></div>
      </div>
    </section>

    <section class="panel">
      <div class="ph"><b>Flagged</b><span class="pill num" id="fCount">0</span></div>
      <div class="dsec"><div class="flags" id="flags"></div>
        <div class="links" style="margin-top:8px"><button class="tbtn" id="fCopy">Copy list</button><button class="tbtn" id="fClear">Clear</button><span class="cap" style="margin-left:auto">this browser only</span></div></div>
      <div class="dsec"><div class="keys"><span><kbd>F</kbd> filled</span><span><kbd>S</kbd> squint</span><span><kbd>X</kbd> flag</span><span><kbd>←</kbd><kbd>→</kbd> step</span><span><kbd>Esc</kbd> clear</span><span><kbd>R</kbd> fold panel</span></div></div>
    </section>

    <details class="panel about" id="about">
      <summary>How to read this page<svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 4l2.5 2.5L7.5 4"/></svg></summary>
      <div id="aboutBody"></div>
    </details>
  </aside>
</main>

<script type="module">
// ── data ───────────────────────────────────────────────────────────────────────────────────────────────
// The drawings come from the live lab/manifest.json (what ships today); the numbers come from
// lab/audit-data/wall.json, measured on the pinned tree by tools/audit/wall-data.mjs. A concept the pin does not
// have is marked "added after the pin"; one whose path data no longer matches the pin's is marked "redrawn".
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch { /* storage may be unavailable */ } },
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MASTERS = [24, 20, 16];

const [man, wall] = await Promise.all([
  fetch('manifest.json', { cache: 'no-store' }).then((r) => r.json()),
  fetch('audit-data/wall.json', { cache: 'no-store' }).then((r) => (r.ok ? r.json() : null)).catch(() => null),
]);

// FNV-1a over the d strings joined with "|" — tools/audit/wall-data.mjs `drawingHash`, the same on both sides.
function fnv1a(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(16).padStart(8, '0');
}
const bodyHash = (body) => fnv1a([...body.matchAll(/<path\b[^>]*?\bd="([^"]*)"/g)].map((m) => m[1]).join('|'));

/** The live set against the pin: every live concept, its pin record (or null), and what moved since. Pure. */
function reconcile(manifest, data) {
  const live = [...new Set(MASTERS.flatMap((m) => manifest.masters[m]?.names ?? []))].filter((n) => !n.endsWith('-filled')).sort();
  const pin = new Map((data?.concepts ?? []).map((c) => [c.name, c]));
  const rows = live.map((name) => {
    const p = pin.get(name) ?? null;
    const moved = [];
    if (p) for (const m of MASTERS) for (const style of ['outline', 'filled']) {
      const rec = manifest.masters[m]?.icons?.[style === 'filled' ? `${name}-filled` : name];
      const was = p[style]?.[String(m)]?.hash ?? null;
      const now = rec ? bodyHash(rec.body) : null;
      if (was !== now) moved.push(`${m} ${style}`);
    }
    return { name, p, status: !p ? 'added' : moved.length ? 'redrawn' : 'pin', moved };
  });
  const liveSet = new Set(live);
  return { rows, retired: [...pin.keys()].filter((n) => !liveSet.has(n)) };
}
window.wallDebug = { reconcile, bodyHash, fnv1a, snap: () => snap(), solidDots: (b, w) => solidDots(b, w) };   // for checking in the console; the page does not need it

if (!wall) {
  document.getElementById('wall').outerHTML = '<div class="empty"><b>No data yet</b>Run <code>node tools/audit/wall-data.mjs &lt;pin-dir&gt;</code> to write <code>lab/audit-data/wall.json</code>.</div>';
  throw new Error('lab/audit-data/wall.json is missing');
}
const { rows: ROWS, retired } = reconcile(man, wall);
const VIEWS = wall.views;
const LISTS = wall.lists;

// ── state ──────────────────────────────────────────────────────────────────────────────────────────────
const state = {
  theme: store.get('icon-theme', 'auto'),               // shared with the drawing board and the Library
  style: store.get('wall-style', 'outline'),            // 'outline' | 'filled' | 'both'
  view: store.get('wall-view', '16'),
  k: store.get('wall-k', 1),                            // 1× or 2× device pixels per icon pixel
  sort: store.get('wall-sort', 'share'),
  reverse: store.get('wall-reverse', false),
  list: store.get('wall-list', ''),
  fade: store.get('wall-fade', false),
  squint: store.get('wall-squint', 0),
  lastSquint: 1.5,
  flags: new Set(store.get('wall-flags', [])),
  sel: null,
  menu: null,
};
if (!VIEWS.some((v) => v.id === state.view)) state.view = '16';
if (state.list && !LISTS.some((l) => l.id === state.list)) state.list = '';
const view = () => VIEWS.find((v) => v.id === state.view);

    [`Drawn here, ${state.k}×`, cellPair('<span data-drawn="outline">—</span>', '<span data-drawn="filled">—</span>')],
    ['Strokes', cellPair(o?.strokes ?? '—', fl?.strokes ?? '—')],
    ['Paths', cellPair(o?.paths ?? '—', fl?.paths ?? '—')],
    ['Kind', span(o?.kind ?? '—')],
    ['Family', span(fam ? `${esc(fam)} · ${famN} member${famN === 1 ? '' : 's'}` : '—')],
  ].map(([k, cellsHtml]) => `<tr><td>${k}</td>${cellsHtml}</tr>`).join('');
  // lists, at this view
  const inl = [];
  if (row) for (const l of LISTS) for (const s of ['outline', 'filled']) {
    const gs = groupsOf(l, s).filter((x) => x.includes(n));
    if (!gs.length) continue;
    const partners = [...new Set(gs.flat())].filter((x) => x !== n);     // every group it sits in (a name can pair twice)
    const note = noteOf(l, s, n);
    inl.push(`<div title="${esc(`${l.label}\n${l.source}${note ? `\n${note}` : ''}`)}"><b>${esc(l.label.split(' — ')[0])}</b> · ${s}${partners.length && partners.length < 8 ? ` · with ${esc(partners.join(', '))}` : ''}${note ? ` · ${esc(note)}` : ''}</div>`);
  }
  document.getElementById('dLists').innerHTML = row ? (inl.join('') || '<div>In none.</div>') : '<div>Click an icon on the wall.</div>';
  const st = document.getElementById('dStatus');
  st.className = `status${row && row.status !== 'pin' ? ' warn' : ''}`;
  st.textContent = !row ? ' ' : row.status === 'added' ? 'Added after the pin — no numbers yet; rerun wall-data.mjs on a newer pin'
    : row.status === 'redrawn' ? `Redrawn since the pin (${row.moved.join(', ')}) — the numbers are the pin's drawing` : `As at pin ${wall.pin.commit}`;
  document.getElementById('dCopy').disabled = !row;
  const fb = document.getElementById('dFlag');
  fb.disabled = !row; fb.textContent = row && state.flags.has(n) ? 'Unflag' : 'Flag';
  // previews: the style on show (outline in Both), at 1×, 2× and the 1× raster enlarged
  const style = sortStyle();
  const [i1, i2] = row ? await Promise.all([imageOf(n, v, style, 1), imageOf(n, v, style, 2)]) : [null, null];
  if (state.sel !== n) return;
  const [c1, c2, cm] = document.querySelectorAll('#prev canvas');
  draw(c1, i1, v, 1); draw(c2, i2, v, 2); draw(cm, i1, v, 1, { css: v.px * Math.floor(64 / v.px) });   // whole CSS pixels per icon pixel
  // The browser's own raster of each style at the pixels on show, in px² of the icon: its coverage summed. The sort
  // uses the geometry (card 1.5); this row shows how far the browser's anti-aliasing sits from it, e.g. on tiny dots.
  if (!row) return renderFlags();
  for (const s of ['outline', 'filled']) {
    const el = document.querySelector(`#dNums [data-drawn="${s}"]`);
    const img = await imageOf(n, v, s, state.k);
    if (state.sel !== n || !el) return;
    el.textContent = img ? drawnInk(img, v.px * state.k, state.k).toFixed(1) : '—';
  }
  renderFlags();
}
function drawnInk(img, size, k) {
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const ctx = cv.getContext('2d', { willReadFrequently: true }); ctx.drawImage(img, 0, 0, size, size);
  const d = ctx.getImageData(0, 0, size, size).data;
  let a = 0; for (let i = 3; i < d.length; i += 4) a += d[i];
  return a / 255 / (k * k);
}
document.getElementById('dCopy').addEventListener('click', async (e) => {
  const b = e.currentTarget; if (!state.sel) return;
  try { await navigator.clipboard.writeText(state.sel); b.textContent = 'Copied'; } catch { b.textContent = 'Blocked'; }
  setTimeout(() => { b.textContent = 'Copy name'; }, 1200);
});
function toggleFlag() {
  if (!state.sel) return;
  if (state.flags.has(state.sel)) state.flags.delete(state.sel); else state.flags.add(state.sel);
  store.set('wall-flags', [...state.flags]);
  light(); renderDetail();
}
document.getElementById('dFlag').addEventListener('click', toggleFlag);
function renderFlags() {
  const list = [...state.flags].sort();
  document.getElementById('fCount').textContent = list.length;
  document.getElementById('flags').textContent = list.length ? list.join(', ') : 'Click an icon you cannot name, or would confuse, then Flag (X). Copy the list back into the conversation.';
}
document.getElementById('fCopy').addEventListener('click', async (e) => {
  const b = e.currentTarget, text = [...state.flags].sort().join('\n');
  try { await navigator.clipboard.writeText(text || '(none flagged)'); b.textContent = 'Copied'; } catch { b.textContent = 'Blocked'; }
  setTimeout(() => { b.textContent = 'Copy list'; }, 1200);
});
document.getElementById('fClear').addEventListener('click', () => { state.flags.clear(); store.set('wall-flags', []); light(); renderDetail(); renderFlags(); });

// ── how to read it ────────────────────────────────────────────────────────────────────────────────────
document.getElementById('aboutBody').innerHTML = `
  <div class="dsec"><h3>What you are looking at</h3>
    <p>Every concept in <code>lab/manifest.json</code>, one representative drawing each, twenty to a row, at real pixels, smoothing off. <b>1×</b> is the icon as a standard screen draws it — 16 pixels across at the 16 view (on this ${DPR}× screen each of those pixels is a ${perPixel(1)} × ${perPixel(1)} block of device pixels). <b>2×</b> is the icon as a retina screen draws it — twice the pixels each way. Names are kept off the wall so a row reads the way a customer reads it; the panel names what you click.</p>
    <p>A dashed cell was <b>added after the pin</b> and has no numbers; an amber dot means <b>redrawn since the pin</b> — its numbers are the pin's drawing. Blue corner: flagged by you.</p></div>
  <div class="dsec"><h3>The numbers</h3><ul>${Object.values(wall.definitions).map((d) => `<li>${esc(d)}</li>`).join('')}
    <li>Drawn here: this browser's own raster of the drawing at the pixels on show, its coverage summed, in px² of the icon. Not a figure from the pin — it shows where anti-aliasing sits away from the geometry the sort uses.</li></ul>
    <p><b>How the wall is drawn.</b> Each icon is the file's own SVG, rasterised by this browser at the pixels on show, on a CPU canvas with full anti-aliasing. Two of the browser's canvas paths are wrong for this set and are not used as they come: a GPU canvas paints small shapes with four-level coverage (outline <code>more-horizontal</code> read 8.77 px² there against 13.93), and the CPU canvas punches a hole in a stroked circle whose radius is under half its stroke — the set's dots. Those circles are drawn as the solid discs SVG defines (radius + half the stroke); every other path is drawn as the file has it. <span id="dotCount"></span></p>
    <p><b>Where the drawn pixels and the geometry part (measured 2026-10-08, Chrome, this panel's Drawn here row, 16 master).</b> Over the 485 outlines the wall's pixels carry a median 0.992 of the geometry's ink at 1× (5th–95th percentile 0.955–1.030) and 0.999 at 2× (0.978–1.016); the filled drawings 0.994 (0.964–1.015) and 0.999 (0.985–1.010). At 1× thin crosses draw lightest — <code>x</code> and <code>x-large</code> −9%, <code>x-small</code> 24.5 against 26.7 (−8%) — and a few chevrons heaviest, <code>chevron-down-2</code> +13%; at 2× every outline sits between −4% and +6%. The dots now draw what the geometry says: filled <code>more-horizontal</code> 19.6 at 1× and 21.0 at 2× against 19.8; filled <code>grid-3</code> 58.8 and 61.7 against 59.5. The sort uses the geometry.</p></div>
  <div class="dsec"><h3>Eye questions this page hosts</h3><ul>${wall.hosted.map((h) => `<li><b>${esc(h.question)}</b> ${esc(h.how)}. <code>${esc(h.source)}</code></li>`).join('')}</ul></div>
  <div class="dsec"><h3>Where the numbers come from</h3>
    <p>Pin <b>${esc(wall.pin.commit)}</b> · ${wall.pin.concepts} concepts · ${wall.pin.files} files · fingerprint <code>${esc(wall.pin.fingerprint)}</code> · measured ${esc(wall.generated)}.</p>
    <p><code>${esc(wall.pinCommand)}</code></p><p><code>${esc(wall.generator)}</code></p>
    <p>Row medians, px²: ${Object.entries(wall.medians).map(([k, v]) => `${esc(k)} ${v}`).join(' · ')}.</p></div>`;

// How many drawings carry a stroked circle under half its stroke — counted now, from the manifest on show.
{
  let n = 0, at16 = 0;
  for (const m of MASTERS) for (const [name, r] of Object.entries(man.masters[m]?.icons ?? {})) {
    if (solidDots(r.body.replaceAll('currentColor', '#000'), r.stroke) !== r.body.replaceAll('currentColor', '#000')) { n++; if (m === 16) at16++; }
  }
  document.getElementById('dotCount').textContent = `In the Library as it stands, ${n} drawings carry such a circle, ${at16} of them at the 16 master.`;
}

// ── keys ──────────────────────────────────────────────────────────────────────────────────────────────
document.addEventListener('keydown', (e) => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.target.closest?.('input,textarea,select')) return;
  if (e.key === 'Escape') { if (state.menu) { state.menu = null; renderControls(); } else { state.sel = null; light(); renderDetail(); } return; }
  if (e.key === 'f' || e.key === 'F') return setStyle(state.style === 'filled' ? 'outline' : 'filled');
  if (e.key === 's' || e.key === 'S') { setSquint(state.squint ? 0 : state.lastSquint); return renderControls(); }
  if (e.key === 'x' || e.key === 'X') return toggleFlag();
  if (e.key === 'r' || e.key === 'R') return setSide(!document.body.classList.contains('side-collapsed'));
  if ((e.key === 'ArrowLeft' || e.key === 'ArrowRight') && state.sel) {
    const i = order.indexOf(state.sel);
    const next = order[(i + (e.key === 'ArrowRight' ? 1 : order.length - 1)) % order.length];
    select(next); cells.get(next)?.scrollIntoView({ block: 'nearest' }); e.preventDefault();
  }
});

// The panel's sticky top follows the header, whatever height it wraps to.
const app = document.querySelector('.app');
new ResizeObserver(() => { document.documentElement.style.setProperty('--head', `${app.offsetHeight}px`); snap(); }).observe(app);
// Real pixels need every canvas on a device pixel: whatever fraction the layout above the wall leaves is added back
// to the wall's own padding. Every cell size is a whole number of device pixels, so one correction holds for all.
function snap() {
  const pad = (v) => parseFloat(getComputedStyle(document.documentElement).getPropertyValue(v)) || 0;
  const r = wallEl.getBoundingClientRect(), x = r.left + scrollX - pad('--sx'), y = r.top + scrollY - pad('--sy');
  const frac = (v) => (Math.ceil(v * DPR - 1e-6) - v * DPR) / DPR;
  document.documentElement.style.setProperty('--sx', `${frac(x)}px`);
  document.documentElement.style.setProperty('--sy', `${frac(y)}px`);
}
new ResizeObserver(snap).observe(document.querySelector('#wallPanel .ph'));   // what sits above the wall; never the wall itself
addEventListener('resize', snap);
// The icon panel folds to a strip so the wall keeps twenty to a row on a narrow window. A per-viewer convenience.
function setSide(collapsed) {
  document.body.classList.toggle('side-collapsed', collapsed);
  document.getElementById('sideBtn').setAttribute('aria-expanded', String(!collapsed));
  document.getElementById('stripBtn').setAttribute('aria-expanded', String(!collapsed));
  store.set('wall-side-collapsed', collapsed);
}
document.getElementById('sideBtn').addEventListener('click', () => setSide(true));
document.getElementById('stripBtn').addEventListener('click', () => setSide(false));
setSide(store.get('wall-side-collapsed', false));
applyTheme();
renderFlags();
render({ pixels: true });
requestAnimationFrame(snap);
</script>
</body>
</html>
